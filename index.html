  //:     на 1.0 - то есть на максимуме, который вообще умеет `<audio>`.
  //: (2) RNNoise и АРУ живут на стороне ГОВОРЯЩЕГО, а не слушателя: они меняют то, что
  //:     уезжает в комнату, и «тихо у меня» ими не лечится в принципе. Зато они могут
  //:     сделать тихим ГОВОРЯЩЕГО - и это уже видно на строке звука у него.
  //: Отсюда вывод: ползунок 0..100% был бы ручкой, которая не может решить названную
  //: задачу, - он уже на потолке. Значит либо выше ста, либо ручки нет вовсе.
  //:
  //: ═══ ПОЧЕМУ УСИЛЕНИЕ ВКЛЮЧАЕТСЯ ТОЛЬКО СВЕРХ 100% ═══
  //: `createMediaElementSource` ЗАБИРАЕТ звук элемента в граф НАВСЕГДА: пока контекст
  //: не запущен, звука нет ВООБЩЕ. А в вебвью Telegram контекст без жеста человека
  //: остаётся `suspended` - это мы уже проходили на шумодаве. Значит тихий звук мы
  //: рискуем променять на ПОЛНУЮ тишину, и делать это без спроса нельзя.
  //: Ниже 100% граф не нужен вовсе (элемент умеет сам), выше - нужен, и там уже есть
  //: жест: человек ТЯНЕТ ползунок. Не завёлся - возвращаем 100% и ГОВОРИМ причину.
  var voxVol = 100, voxCtx = null, voxNodes = {}, voxWhy = '';
  try {
    var _vv = parseInt(localStorage.getItem('rtc_vox_vol'), 10);
    if (_vv >= 10 && _vv <= 300) voxVol = _vv;
  } catch (e) {}

  //: ═══ КУДА ИДЁТ УСИЛЕННЫЙ МИКС: LOOPBACK, А НЕ ПРЯМО В ДИНАМИКИ ═══
  //: МЕХАНИЗМ ЭХА, УСТАНОВЛЕННЫЙ РЕСЁРЧЕМ (Chromium 687574, twilio-video #323): AEC
  //: браузера вычитает ТОЛЬКО тот звук, который прошёл штатным путём - через WebRTC либо
  //: через <audio>-элемент. Всё, отрендеренное в `AudioContext.destination`, для него НЕ
  //: СУЩЕСТВУЕТ, и микрофон человека без наушников возвращает это в комнату. То есть наше
  //: же усиление голосов и было источником эха на боевых созвонах.
  //: ДОКУМЕНТИРОВАННЫЙ ОБХОД РОВНО ОДИН: завернуть микс в ЛОКАЛЬНЫЙ RTCPeerConnection и
  //: играть обычным <audio> - тогда Chrome берёт его в опорный сигнал AEC.
  //: ЦЕНА НАЗВАНА: локальный PC добавляет ~20-40 мс на приёме. Это дешевле, чем быть
  //: услышанным дважды.
  var voxMix = null, voxLoop = null, voxLoopBusy = false, voxReleasing = false;
  //: Сколько ждём дорожку с приёмной стороны локального PC. Соединение идёт внутри одной
  //: вкладки, без сети и без ICE-серверов: не встало за две секунды - не встанет.
  var VOX_LOOP_MS = 2000;

  function voxOut() {
      //: Пока loopback не поднялся, играем ПРЯМО в динамики: иначе до его готовности у
      //: человека была бы ТИШИНА, а это хуже эха. Встанет - `voxLoopEnsure` переключит
      //: уже подключённые узлы.
      return (voxLoop && voxMix) ? voxMix : (voxCtx && voxCtx.destination);
  }

  async function voxLoopEnsure() {
      if (voxLoop || voxLoopBusy || !voxCtx) return;
      if (!window.RTCPeerConnection) {
          voxWhy = 'браузер не умеет RTCPeerConnection';
          return;
      }
      voxLoopBusy = true;
      var a = null, b = null, el = null;
      try {
          if (!voxMix) voxMix = voxCtx.createMediaStreamDestination();
          a = new RTCPeerConnection();
          b = new RTCPeerConnection();
          a.onicecandidate = function (e) {
              if (e.candidate) { try { b.addIceCandidate(e.candidate); } catch (x) {} }
          };
          b.onicecandidate = function (e) {
              if (e.candidate) { try { a.addIceCandidate(e.candidate); } catch (x) {} }
          };
          //: ЖДЁМ ФАКТ ДОРОЖКИ, А НЕ ФАКТ ПЕРЕГОВОРОВ (закон №35): `setRemoteDescription`
          //: может пройти, а `ontrack` не прийти - и мы бы отрапортовали успех над тишиной.
          var got = new Promise(function (res) {
              b.ontrack = function (e) {
                  res((e.streams && e.streams[0]) || new MediaStream([e.track]));
              };
          });
          voxMix.stream.getTracks().forEach(function (t) { a.addTrack(t, voxMix.stream); });
          var off = await a.createOffer();
          await a.setLocalDescription(off);
          await b.setRemoteDescription(off);
          var ans = await b.createAnswer();
          await b.setLocalDescription(ans);
          await a.setRemoteDescription(ans);
          var st = await Promise.race([got, new Promise(function (_, rej) {
              setTimeout(function () {
                  rej(new Error('дорожка не пришла за ' + VOX_LOOP_MS + ' мс'));
              }, VOX_LOOP_MS);
          })]);
          el = document.createElement('audio');
          el.autoplay = true;
          el.setAttribute('playsinline', '');
          //: НЕ `muted` НАРОЧНО, И ЭТО НЕСУЩЕЕ: приглушённый элемент AEC в опорный сигнал
          //: НЕ БЕРЁТ - весь обход потерял бы смысл, оставшись рабочим на вид.
          el.muted = false;
          el.srcObject = st;
          el.style.display = 'none';
          el.dataset.voxout = '1';
          document.body.appendChild(el);
          try { await el.play(); } catch (e) {}
          voxLoop = { a: a, b: b, el: el };
          //: ПЕРЕКЛЮЧАЕМ УЖЕ ПОДКЛЮЧЁННЫЕ УЗЛЫ: пока loopback поднимался, они висели на
          //: `voxCtx.destination`, и оставить их там значило бы собрать обход впустую.
          Object.keys(voxNodes).forEach(function (k) {
              var g = voxNodes[k];
              try { g.disconnect(); g.connect(voxMix); } catch (e) {}
          });
          diag('голоса: усиление идёт через loopback, AEC его видит', 'звук');
      } catch (e) {
          voxWhy = (e && e.message) || 'loopback не собрался';
          try { a && a.close(); } catch (e2) {}
          try { b && b.close(); } catch (e2) {}
          try { el && el.remove(); } catch (e2) {}
          voxLoop = null;
          //: НЕ ВЫШЛО - ОСТАЁМСЯ НА ПРЯМОМ ВЫХОДЕ И ГОВОРИМ ЭТО. Молчаливый откат вернул
          //: бы эхо ровно тем, у кого обход не сработал, а узнали бы мы об этом от них.
          diag('голоса: loopback не собрался (' + voxWhy + '), усиление идёт мимо AEC',
               'звук');
      }
      voxLoopBusy = false;
  }

  function voxLoopDrop(why) {
      if (!voxLoop) return false;
      try { voxLoop.el.pause(); } catch (e) {}
      try { voxLoop.el.srcObject = null; } catch (e) {}
      try { voxLoop.el.remove(); } catch (e) {}
      try { voxLoop.a.close(); } catch (e) {}
      try { voxLoop.b.close(); } catch (e) {}
      voxLoop = null;
      diag('голоса: loopback снят (' + why + ')', 'звук');
      return true;
  }

  function voxBoost(el) {
      //: Один элемент - один узел. Повторный `createMediaElementSource` на том же
      //: элементе бросает InvalidStateError, и это не теория: перерисовка списка зовёт
      //: применение громкости на каждом обновлении.
      var key = el.__voxKey || (el.__voxKey = 'v' + Math.random().toString(36).slice(2));
      if (voxNodes[key]) return voxNodes[key];
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { voxWhy = 'браузер не умеет Web Audio'; return null; }
      try {
          if (!voxCtx) voxCtx = regCtx(new Ctx(), 'голоса');
          var srcNode = voxCtx.createMediaElementSource(el);
          var g = voxCtx.createGain();
          srcNode.connect(g);
          g.connect(voxOut() || voxCtx.destination);
          voxNodes[key] = g;
          return g;
      } catch (e) {
          voxWhy = (e && e.name) || 'усилитель не собрался';
          return null;
      }
  }

  function voxRelease() {
      //: ═══ ВОЗВРАТ В ШТАТНЫЙ ПУТЬ ВОЗМОЖЕН ТОЛЬКО ПЕРЕСОЗДАНИЕМ ЭЛЕМЕНТА ═══
      //: `createMediaElementSource` захватывает элемент НАВСЕГДА: отсоединить узел мало -
      //: звук элемента после захвата никуда, кроме графа, не идёт. Значит человек, который
      //: поднял громкость на минуту и вернул ползунок, до этой правки оставался мимо AEC
      //: ДО КОНЦА СОЗВОНА, а по коду выглядело, будто путь «до 100% - элементом» работает
      //: у всех. Пересоздаём дорожку: новый элемент чист.
      if (voxReleasing) return 0;
      var els = voxEls(), n = 0, i;
      voxReleasing = true;
      try {
          for (i = 0; i < els.length; i++) {
              var el = els[i];
              if (!el.__voxKey) continue;          //: не захвачен - и трогать нечего
              var tr = el.__track;
              if (!tr) {
                  //: ДОРОЖКИ НЕТ - НЕ ТРОГАЕМ ВОВСЕ. Отключив узел, мы получили бы у этого
                  //: человека ТИШИНУ вместо «мимо AEC»: элемент уже захвачен и без графа не
                  //: звучит. Плохой обмен, и заметил бы его человек, а не мы.
                  try { voxNodes[el.__voxKey].gain.value = 1; } catch (e) {}
                  continue;
              }
              try {
                  var g = voxNodes[el.__voxKey];
                  if (g) g.disconnect();
              } catch (e) {}
              delete voxNodes[el.__voxKey];
              try { attachTrack(tr, false); n++; } catch (e) {}
          }
      } catch (e) {}
      voxReleasing = false;
      if (n) diag('голоса: ' + n + ' дорожек вернулись в штатный путь, AEC их видит', 'звук');
      return n;
  }

  function applyVoxVolume() {
      var els = voxEls(), i;
      if (voxVol <= 100) {
          //: ГРАФ НЕ ТРОГАЕМ ВОВСЕ, пока он не нужен: включённый однажды, он остаётся
          //: единственной дорогой звука, и его сбой стал бы нашим. А что уже захвачено -
          //: возвращаем в штатный путь, иначе AEC так и не увидит эти дорожки.
          voxRelease();
          voxLoopDrop('громкость вернулась к 100%');
          els = voxEls();                          //: список после пересоздания элементов
          for (i = 0; i < els.length; i++) {
              try { els[i].volume = Math.max(0, Math.min(1, voxVol / 100)); } catch (e) {}
              var g0 = els[i].__voxKey && voxNodes[els[i].__voxKey];
              if (g0) { try { g0.gain.value = 1; } catch (e2) {} }
          }
          return true;
      }
      var okAny = false;
      for (i = 0; i < els.length; i++) {
          try { els[i].volume = 1; } catch (e) {}
          var g = voxBoost(els[i]);
          if (!g) continue;
          try { g.gain.value = voxVol / 100; okAny = true; } catch (e2) {}
      }
      //: КОНТЕКСТ ЗАПУСКАЕМ ЯВНО: жест у нас есть - человек тянет ползунок. Проверяем
      //: ФАКТ (`state`), а не то, что вызов вернулся: `suspended` не обрабатывает звук.
      if (voxCtx && voxCtx.state !== 'running') {
          try { voxCtx.resume(); } catch (e) {}
      }
      //: LOOPBACK ПОДНИМАЕТСЯ ФОНОМ, А НЕ БЛОКИРУЕТ РУЧКУ: до его готовности звук идёт
      //: прямо в динамики (то есть как раньше), а не пропадает.
      try { voxLoopEnsure(); } catch (e) {}
      return okAny || !els.length;
  }

  function voxPaint() {
      var box = $('voxvol');
      if (!box) return;
      box.style.display = '';
      var sl = $('voxv');
      sl.value = String(voxVol);
      voxLab();
      sl.oninput = function () {
          voxVol = Math.max(10, Math.min(300, parseInt(sl.value, 10) || 100));
          var ok = applyVoxVolume();
          if (!ok && voxVol > 100) {
              //: НЕ СМОГЛИ УСИЛИТЬ - ВОЗВРАЩАЕМ ТО, ЧТО ТОЧНО РАБОТАЕТ, И НАЗЫВАЕМ
              //: ПРИЧИНУ. Оставить ползунок наверху при мёртвом усилителе значило бы
              //: показать человеку «300%» над неизменившимся звуком.
              voxVol = 100; sl.value = '100'; applyVoxVolume();
          }
          voxLab();
          try { localStorage.setItem('rtc_vox_vol', String(voxVol)); } catch (e) {}
      };
  }

  //: ПОКАЗЫВАЕМ СРАЗУ, А НЕ ПО СОБЫТИЮ: у ползунка радио есть повод появляться и
  //: исчезать (дорожка радио), а голоса в комнате есть ВСЕГДА - значит и регулятор
  //: обязан быть на месте до того, как человек начнёт искать, почему тихо.
  //: Разметка стоит ВЫШЕ скрипта в том же документе, поэтому элемент уже существует.
  try { voxPaint(); } catch (e) { }

  function voxLab() {
      var t = 'Громкость голосов: ' + voxVol + '%';
      if (voxVol > 100) t += ' (усиление - если собеседника еле слышно)';
      else if (voxVol < 100) t += ' (у каждого своя)';
      else t += ' (обычная; тяни вправо, если тихо)';
      if (voxWhy && voxVol <= 100) t += ' · усилитель не завёлся: ' + voxWhy;
      $('voxvlab').textContent = t;
  }

  function applyDjVolume() {
      // ГРОМКОСТЬ ТОЖЕ КО ВСЕМУ, ЧТО ЗВУЧИТ. Ползунок, двигающий одну дорожку из двух,
      // выглядит как «регулятор не работает»: человек тянет вниз, а фон остаётся.
      var did = false;
      if (djTrack && djTrack.setVolume) {
          try { djTrack.setVolume(djVol / 100); did = true; } catch (e) {}
      }
      var els = document.querySelectorAll('audio[data-dj="1"]');
      for (var i = 0; i < els.length; i++) {
          try { els[i].volume = Math.max(0, Math.min(1, djVol / 100)); did = true; } catch (e2) {}
      }
      return did;
  }

  // ═══ ШКАЛА ГРОМКОСТИ ЛОГАРИФМИЧЕСКАЯ, И НАЧИНАЕТСЯ ОНА С 0.1% ═══
  // ПЕРВЫЙ ЗАХОД (шаг 1% внизу, 5% наверху) отменён живым прогоном Ren: «даже 1% громко».
  // Это не придирка, а свойство слуха: громкость воспринимается ЛОГАРИФМИЧЕСКИ, и на
  // линейной шкале весь фоновый диапазон умещается в одно-два первых деления - то есть
  // его там нет вовсе. Тридцать делений по ~2 дБ покрывают 60 дБ: от 0.1% до 100%.
  //: позиция 0 - ВЫКЛЮЧЕНО (настоящий ноль, а не «очень тихо»);
  //: позиции 1..30 - от 0.1% до 100%, каждый шаг умножает громкость на ~1.26.
  var VOL_POS_MAX = 30;

  function volOfPos(pos) {
    pos = Math.max(0, Math.min(VOL_POS_MAX, parseInt(pos, 10) || 0));
    if (pos <= 0) return 0;
    var v = 100 * Math.pow(10, -3 * (1 - (pos - 1) / (VOL_POS_MAX - 1)));
    // ТОЧНОСТЬ ОКРУГЛЕНИЯ ЗАВИСИТ ОТ МЕСТА НА ШКАЛЕ, и это не педантизм: до десятой доли
    // первые ШЕСТЬ делений схлопывались в три одинаковых числа, и ползунок читался как
    // сломанный - двигаешь, а цифра та же. Наверху шкалы вторая цифра, наоборот, шум.
    return v < 1 ? Math.round(v * 100) / 100 : Math.round(v * 10) / 10;
  }

  function posOfVol(vol) {
    vol = Math.max(0, Math.min(100, parseFloat(vol) || 0));
    if (vol <= 0) return 0;
    var p = 1 + Math.round((Math.log(vol / 100) / Math.log(10) / 3 + 1) * (VOL_POS_MAX - 1));
    return Math.max(1, Math.min(VOL_POS_MAX, p));
  }

  //: ЧИСЛО ЧЕЛОВЕКУ: внизу шкалы десятая доля процента - значащая цифра, наверху она шум.
  function fmtVol(v) {
    if (!v) return 'выкл';
    // БЕЗ ХВОСТОВЫХ НУЛЕЙ: «0.10%» и «0.1%» это одно число, а второе читается быстрее.
    return (v < 1 ? String(Math.round(v * 100) / 100)
                  : String(Math.round(v))) + '%';
  }

  function showDjVol(on) {
      var box = $('djvol');
      if (!box) return;
      box.style.display = on ? '' : 'none';
      if (!on) return;
      var sl = $('djv');
      sl.value = String(posOfVol(djVol));
      // ПОДПИСЬ НАЗЫВАЕТ ВЫХОД, А НЕ ТОЛЬКО СОСТОЯНИЕ: человек, которому радио мешает,
      // должен видеть, что это чинится здесь же, а не выключением радио всей комнате.
      $('djvlab').textContent = 'Громкость радио: ' + fmtVol(djVol)
          + ' (у каждого своя - тяни, если мешает)';
      sl.oninput = function () {
          djVol = volOfPos(sl.value);
          $('djvlab').textContent = 'Громкость радио: ' + fmtVol(djVol)
            + ' (фоном под разговор)';
          // ПРИМЕНЯЕМ СРАЗУ, А НЕ ПО ОТПУСКАНИЮ: человек ведёт ползунок и слушает, что
          // получается, - иначе он подбирает значение вслепую.
          applyDjVolume();
          try { localStorage.setItem('rtc_dj_vol', String(djVol)); } catch (e) { }
      };
  }


  // ═══ ДВЕ РАЗНЫЕ ВЕЩИ, И ДО ЭТОЙ ПРАВКИ ОНИ БЫЛИ ОДНОЙ КНОПКОЙ ═══
  // РАСПОЗНАВАНИЕ - общее на комнату, идёт на сервере и СТОИТ ДЕНЕГ: включил один, платят
  // все. ПОКАЗ ЛЕНТЫ - личное дело каждого: кому-то текст мешает, кто-то пришёл слушать.
  // Склеенные в одну кнопку, они означали, что человек не может убрать ленту у себя, не
  // выключив распознавание ВСЕЙ комнате.
  var subShow = true;
  try {
    var _ss = localStorage.getItem('rtc_sub_show');
    if (_ss === '0') subShow = false;         // выбор переживает переоткрытие комнаты
  } catch (e) {}

  function subBoxPaint() {
    // ЛЕНТА ВИДНА, КОГДА ЕСТЬ ЧТО ПОКАЗЫВАТЬ И ЧЕЛОВЕК ЭТОГО ХОЧЕТ. Два условия, и оба
    // обязательны: распознавание выключено - показывать нечего; скрыл сам - не навязываем.
    $('subbox').style.display = (subOn && subShow) ? '' : 'none';
    var b = $('subshow');
    if (b) {
      b.style.display = subOn ? '' : 'none';
      b.classList.toggle('on', subShow);
      b.textContent = subShow ? '🙈 Скрыть ленту у себя' : '👁 Показать ленту';
    }
  }

  function subNote(txt, sticky) {
    $('subnote').textContent = txt || '';
    subSticky = !!sticky && !!txt;
    subBoxPaint();
  }

  // СОСТОЯНИЕ ЗАПИСИ ЧИТАЕТСЯ У КОМНАТЫ, А НЕ ХРАНИТСЯ У НАС. Свой флажок разошёлся бы с
  // сервером на первом же падении Egress, и кнопка предлагала бы остановить то, что уже
  // не пишется. Метаданные ставит БОТ - он же владеет записью (закон №40: одна дверь).
  var lastMeta = '';
  // КТО Я И ЧТО МНЕ РАЗРЕШЕНО - ДВА РАЗНЫХ ФАКТА. Первый знает LiveKit (identity в
  // токене), второй живёт в метаданных комнаты и ставится БОТОМ: страница о правах не
  // решает ничего, она только показывает (закон №32).
  var myIdent = '';

  //: неё. Строка нужна ровно затем, чтобы `vFull` не указывал на мёртвый узел; обещать
  //: ею что-то большее (и городить вокруг класс на `body`) значило бы завести механизм
  //: без последствия, а такой хуже отсутствующего.
  function vfsForget(el) { if (vFull === el) vFull = null; }
  //: ПОДПИСЬ ЗАКРЕПЛЕНИЯ - ОДНА ДВЕРЬ, И ЗОВЁТ ЕЁ РАСКЛАДКА (закон №40). Состояние
  //: `layPin` меняют ТРИ места: сам тап, сброс «закреплённого окна больше нет в
  //: комнате» и общий сброс вида. Раскрась подпись по месту - два из трёх забыли бы,
  //: и кнопка говорила бы «Снять» над незакреплённым окном.
  function pinLabel(el) {
    var b = el && el.querySelector('.vpin');
    if (!b) return;
    var on = el.classList.contains('pinned');
    var w = b.querySelector('.vpw');
    if (w) w.textContent = on ? 'Снять' : 'Крупно';
    b.title = on
      ? 'Снять закрепление: окна снова раскладываются как обычно'
      : 'Показывать это окно крупно, остальные - полосой снизу (только у тебя)';
  }
  // ДВА РАЗМЕРА, А НЕ ОДИН: свободный размер это ширина И высота, и половина здесь
  // означала бы, что уголок тянет вбок, а после перезахода окно возвращается узким.
  var layBigH = 0, layBigW = 0;
  try {
    layPin = localStorage.getItem('rtc_lay_pin') || '';
    layBigH = parseInt(localStorage.getItem('rtc_lay_bigh') || '0', 10) || 0;
    layBigW = parseInt(localStorage.getItem('rtc_lay_bigw') || '0', 10) || 0;
    layMode = localStorage.getItem('rtc_lay_mode') || 'auto';
    if (!LAY_NAMES[layMode]) layMode = 'auto';
    // РАССТАВЛЕННОЕ ПЕРЕЖИВАЕТ ПЕРЕЗАХОД (требование Ren): человек расставил окна под
    // свой экран, вышел за кофе и вернулся - переставлять заново он не подписывался.
    freeLoad();
  } catch (e) {}

  function laySave() {
    try {
      localStorage.setItem('rtc_lay_pin', layPin || '');
      localStorage.setItem('rtc_lay_bigh', String(layBigH || 0));
      localStorage.setItem('rtc_lay_bigw', String(layBigW || 0));
      localStorage.setItem('rtc_lay_mode', layMode);
    } catch (e) {}
  }

  function addVideo(track, nm, mine, pid) {
    var w = document.createElement('div');
    w.className = 'vwrap';
    if (pid) w.dataset.pid = pid;
    if (mine) w.dataset.me = '1';
    //: ИСТОЧНИК НА САМОМ ОКНЕ: по нему `freeKey` разводит СВОИ экран и камеру. Без него
    //: у них один ключ, и на свободном холсте второе окно накрывает первое (см. `freeKey`).
    //: Спрашиваем ДОРОЖКУ, а не вызывающего: у SDK это факт, у вызывающего - строка.
    try {
      var _sc = String((track && track.source) || '');
      if (_sc.indexOf('screen') >= 0) w.dataset.src = 'screen';
    } catch (e) {}
    var v = track.attach();
    v.setAttribute('playsinline', ''); v.muted = true; v.autoplay = true;
    w.appendChild(v);
    // ПОДПИСЬ ОБЯЗАТЕЛЬНА У СВОЕГО ОКНА: без неё человек видит свой же экран внутри
    // своего экрана и решает, что это чужой показ (и наоборот).
    var tag = document.createElement('span');
    tag.className = 'vnm';
    tag.textContent = mine ? 'Ты · так тебя видят' : (nm || 'Участник');
    // ИМЯ ЛЕЖИТ НА САМОМ ОКНЕ: по нему отвечаем на вопрос «а кто уже показывает».
    if (!mine) w.dataset.nm = (nm || 'Участник');
    w.appendChild(tag);
    // ═══ ЗАКРЕПИТЬ - ЭТО МЕСТНОЕ РЕШЕНИЕ, А НЕ КОМАНДА КОМНАТЕ ═══
    // Кому смотреть крупно, каждый решает себе: «крупно говорящий» хорош на созвоне и
    // мешает, когда смотришь чужой экран и слушаешь автора. Ничего не рассылаем.
    var pin = document.createElement('button');
    pin.className = 'vpin';
    //: ЗНАЧОК И СЛОВО - РАЗНЫЕ УЗЛЫ: подпись правится ОДНОЙ дверью `pinLabel`, а
    //: `textContent` на всей кнопке стёр бы слово вместе со значком (ровно так уже
    //: терялась подпись у кнопок нижней полосы).
    pin.appendChild(document.createTextNode('📌'));
    var pinw = document.createElement('span');
    pinw.className = 'vpw';
    pin.appendChild(pinw);
    pin.onclick = function (ev) {
      ev.stopPropagation();
      //: КЛЮЧ СЧИТАЕТ ОДНА ДВЕРЬ (закон №40): копий этого правила было ТРИ, и после
      //: разведения своих окон по источнику они разошлись бы - закрепление экрана
      //: цеплялось бы за камеру, потому что ключ у них тут остался бы общим.
      var key = freeKey(w);
      layPin = (layPin === key || !key) ? '' : key;
      //: ЗАКРЕПЛЕНИЕ ПЕРЕВОДИТ РАСКЛАДКУ ВСЕГДА, А НЕ ТОЛЬКО ИЗ «АВТО». Стояло
      //: `layPin && layMode === 'auto'`, и у человека, выбравшего «сетку» РУКАМИ, тап по
      //: 📌 не менял НИ ОДНОГО пикселя: `layPin` записывался, а режим оставался сеткой,
      //: где крупного окна нет по построению. Это ровно та жалоба Ren («ни фиксации в
      //: рамке, ни поверх других окон»), только в состоянии, которое мы не проверяли.
      //: Человек только что сказал, ЧТО смотреть крупно - значит раскладка следует за
      //: ним, а не спорит; обратный путь есть у обоих (тот же 📌 и кнопка «Раскладка»),
      //: и реплика прямо называет, что остальные ушли полосой.
      if (layPin) layMode = 'spk';
      laySave();
      layPaint();
      //: ЖИВОЙ ОТЗЫВ REN: «нажимаешь - ничего видимого не происходит». Так и было:
      //: при ОДНОМ окне «крупно» выглядит ровно как обычный вид, и слово «закрепил»
      //: описывало то, чего человек не видит. Теперь фраза называет ПОСЛЕДСТВИЕ, а сама
      //: кнопка появляется только там, где последствие есть (см. `layPaint`).
      say(layPin
          ? ('Это окно теперь крупное, остальные - полосой снизу. Только у тебя: '
             + 'комнате ничего не ушло. Снять - тот же 📌 Снять. '
             + 'Развернуть на всю площадь - соседняя ⛶.')
          //: «КАК ОБЫЧНО» БЫЛО НЕТОЧНО: закрепление ПЕРЕВОДИТ раскладку в «крупно», а
          //: снятие её не возвращает - остаётся «крупно», где большим идёт говорящий.
          //: Это законное состояние, но назвать его надо: иначе человек, пришедший из
          //: сетки, ищет, почему сетка не вернулась, и решает, что сломано снятие.
          : ('Закрепление снял. Раскладка осталась «крупно» - большим идёт говорящий; '
             + 'сменить её кнопкой «Раскладка» в «Ещё».'));
    };
    w.appendChild(pin);
    pinLabel(w);
    // ═══ ВО ВЕСЬ ЭКРАН - ОТДЕЛЬНАЯ КНОПКА, А НЕ ВТОРОЙ СМЫСЛ У ЗАКРЕПЛЕНИЯ ═══
    // ТРЕБОВАНИЕ REN: показывают экран или камеру - надо развернуть ЭТО окно на всю
    // площадь. Закрепление отвечает на другой вопрос («кого показывать крупно, когда
    // говорят несколько»), и вешать на него второе значение значило бы получить кнопку,
    // про которую снова непонятно, что она делает.
    var fs = document.createElement('button');
    fs.className = 'vfs';
    fs.textContent = '⛶';
    fs.title = 'Развернуть окно на всю площадь';
    fs.onclick = function (ev) {
      ev.stopPropagation();
      vfsSet(w);
      //: ПЕРЕСБОРКА ПОСЛЕ ВОЗВРАТА - ОБЯЗАТЕЛЬНАЯ ПОЛОВИНА: свободный холст расставляет
      //: окна координатами, и снятое при развороте надо вернуть, а не оставить окно
      //: лежать по умолчанию сетки поверх чужих.
      layPaint();
    };
    w.appendChild(fs);
    $('screens').appendChild(w);
    vids.push({ t: track, el: w });
    layPaint();
  }

  function dropVideo(track) {
    for (var i = vids.length - 1; i >= 0; i--) {
      if (vids[i].t !== track) continue;
      try { track.detach(vids[i].el.querySelector('video')); } catch (e) {}
      vfsForget(vids[i].el);
      vids[i].el.remove();
      vids.splice(i, 1);
    }
    layPaint();
  }

  // ═══ ПЛИТКА УБИРАЕТСЯ ПО ФАКТУ МЁРТВОЙ ДОРОЖКИ, А НЕ ПО ПРИХОДУ СОБЫТИЯ ═══
  // Живой отзыв 29.08: камеру и показ экрана выключили, а тёмные плитки остались. Класс
  // тот же, что был у звука радио (Б3): источник сняли, ОКНО забыли. Событие тут не
  // опора: `LocalTrackUnpublished` приходит с `pub.track`, а к моменту его прихода SDK
  // мог уже обнулить ссылку - тогда `dropVideo(undefined)` не находит НИЧЕГО и плитка
  // живёт дальше. Ни ошибки, ни строки в консоли.
  // ПОЭТОМУ ПРОВЕРЯЕМ РЕЗУЛЬТАТ (закон №35): дорожка, чей `MediaStreamTrack` перешёл в
  // `ended`, показывать больше нечего - окно уходит независимо от того, дошло событие
  // или нет. Уборка идемпотентна и стоит один проход по списку окон.
  function sweepVideos() {
    var dead = [];
    vids.forEach(function (r) {
      var mst = null;
      try { mst = r.t && r.t.mediaStreamTrack; } catch (e) { mst = null; }
      // НЕТ `mediaStreamTrack` - НЕ ПОВОД СНОСИТЬ: у части версий SDK его нет вовсе, и
      // слепая уборка убрала бы ЖИВОЕ чужое видео. Сносим только доказанно мёртвое.
      if (mst && mst.readyState === 'ended') dead.push(r.t);
    });
    dead.forEach(dropVideo);
    return dead.length;
  }

  // ═══ МИКРОФОН: ОДНА ДВЕРЬ, И СОСТОЯНИЕ МЕНЯЕТСЯ ТОЛЬКО ПОСЛЕ УСПЕХА ═══
  // Мест, где мы дёргаем микрофон, ТРИ: кнопка внизу, адресная просьба «приглушись» и
  // общее «тишина». Во всех трёх стояло `micOn = false; try { ... } catch (e) {}` - то
  // есть подпись менялась ПЕРЕД вызовом, а отказ SDK съедался МОЛЧА. Отказ там не
  // теоретический: ровно этим путём приходит `waiting for pending publication promise
  // timed out`, если публикация ещё идёт, - и человек видел переключившуюся кнопку над
  // работающим микрофоном. Это тот же класс, что залипшая кнопка показа (закон №55:
  // обратный путь обязан быть проверен), только тише - у показа хотя бы был текст.
  // ВЕРДИКТ ПО ФАКТУ (закон №35): состояние берём у SDK после вызова, а не из намерения.
    // ═══ «silence detected on local audio track» - ЧЬЯ ЭТО ТРЕВОГА И ЛОЖНАЯ ЛИ ═══
  // ВОПРОС REN 31.08: строка горит при ИСПРАВНОМ микрофоне. Она НЕ наша - её печатает
  // сам livekit-client: после публикации он ~200 мс слушает опубликованную дорожку и,
  // не найдя ни одного ненулевого сэмпла, предупреждает. Это ПРЕДУПРЕЖДЕНИЕ, а не
  // ошибка: на звук оно не влияет, дорожка уходит как уходила.
  // ПОЧЕМУ ОНО МОЖЕТ БЫТЬ ЛОЖНЫМ ИМЕННО У НАС: публикуется дорожка ПОСЛЕ шумодава
  // (`setProcessor` подменяет её выход), а наш worklet собирает кадр RNNoise из 480
  // сэмплов при кванте WebAudio в 128 - первые кванты он копит и отдаёт тишину. Плюс
  // человек в момент публикации обычно молчит. Оба случая дают ровно эту строку.
  // СПОРИТЬ С НЕЙ НЕЛЬЗЯ, А ИЗМЕРИТЬ МОЖНО: печатаем СВОЙ уровень в ТО ЖЕ окно. Дальше
  // это не рассуждение, а два числа рядом - и следующий живой прогон отвечает сам.
  //: УРОВЕНЬ КАДРА В дБ. Наверху, потому что читателей ДВА и один из них - на верхнем
  //: уровне страницы (замер после публикации микрофона).
  function frameDbTop(an, tbuf) {
    an.getFloatTimeDomainData(tbuf);
    var s = 0;
    for (var i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i];
    var rms = Math.sqrt(s / tbuf.length);
    return rms > 1e-8 ? 20 * Math.log10(rms) : -120;
  }

  function micLevelFact() {
    try {
      var ac = actx();
      if (!ac || !room || !room.localParticipant) return;
      var pub = null;
      var pubs = room.localParticipant.trackPublications
              || room.localParticipant.tracks || new Map();
      pubs.forEach(function (p) {
        if (!pub && String(p.source || '') === 'microphone' && p.track) pub = p;
      });
      var ms = pub && pub.track && pub.track.mediaStreamTrack;
      if (!ms) return;
      var an = ac.createAnalyser();
      an.fftSize = 2048;
      var src = ac.createMediaStreamSource(new MediaStream([ms]));
      src.connect(an);
      var buf = new Float32Array(an.fftSize), peak = -120, n = 0;
      var t = setInterval(function () {
        peak = Math.max(peak, frameDbTop(an, buf));
        if (++n < 20) return;                 // ~400 мс: окно проверки SDK внутри него
        clearInterval(t);
        try { src.disconnect(); } catch (e) {}
        var proc = !!window.__PROC;
        console.log('[mic] уровень после публикации: ' + Math.round(peak)
                    + ' дБ · шумодав=' + (proc ? 'вкл' : 'выкл')
                    + ' · если SDK в это же окно написал «silence detected», а тут не -120,'
                    + ' его тревога ЛОЖНАЯ');
        try { window.__MICDB = peak; } catch (e) {}
      }, 20);
    } catch (e) {}
  }

  async function micSet(want, why) {
    if (!room) return false;
    try {
      // ═══ ТРЕТЬЯ ДВЕРЬ ПУБЛИКАЦИИ, И ОНА БЫЛА БЕЗ ПОТОЛКА (живой отказ Ren 30.08) ═══
      // «В одной сессии виден и старый текст «waiting for pending publication promise
      // timed out», и новый про 25 с» - значит путей два, и один непокрыт. Вот он:
      // `republishPromise` у SDK ОБЩИЙ НА УЧАСТНИКА, а не на источник, поэтому живая
      // камера подвешивает и микрофон тоже. Экран и камера обёрнуты сторожем, микрофон
      // не был - и висел без конца, а дойдя, отдавал сырой текст SDK человеку.
      // ОТКАЗ ПО ПОТОЛКУ - НАШ И НАЗЫВАЕТСЯ НАШИМИ СЛОВАМИ, а не чужой строкой.
      // ФЛАГИ ЗАХВАТА ПЕРЕДАЁМ ЯВНО И ЗДЕСЬ: включение после mute ПЕРЕСОЗДАЁТ дорожку,
      // и «умолчания комнаты доедут» - это рассуждение, а не гарантия (у аргумента
      // приоритет выше). Один и тот же объект на все три места, где мы просим звук.
      var _mp = want ? room.localParticipant.setMicrophoneEnabled(true, AUDIO_WANT)
                     : room.localParticipant.setMicrophoneEnabled(false);
      var _late = false;
      await Promise.race([_mp, new Promise(function (_, rej) {
        setTimeout(function () {
          _late = true;
          rej(new Error('микрофон не ответил за ' + Math.round(PUB_WAIT_MS / 1000)
                        + ' с (у клиента идёт другая публикация - экран или камера)'));
        }, PUB_WAIT_MS);
      })]);
      if (_late) return false;              // до сюда не доходим, но пусть будет явно
      if (want) micLevelFact();
    } catch (e) {
      // ОПЕРАЦИЯ ВСЁ ЕЩЁ ИДЁТ ВНУТРИ SDK, И ОНА МОЖЕТ ДОЕХАТЬ ПОЗЖЕ. Тогда кнопка обязана
      // догнать факт: молча разошедшаяся подпись хуже отказа - человек говорит в
      // выключенный микрофон, глядя на «включён». Спрашиваем У SDK, а не ставим намерение.
      try {
        if (_late && _mp) _mp.then(function () {
          try { micOn = !!room.localParticipant.isMicrophoneEnabled; } catch (e3) {}
          micPaint();
          say('Микрофон всё-таки переключился - кнопка обновлена.');
        }, function () {});
      } catch (e4) {}
      // ИСТИННОЕ СОСТОЯНИЕ СПРАШИВАЕМ У SDK, А НЕ ДОГАДЫВАЕМСЯ: у части отказов дорожка
      // всё-таки переключается, и «вернуть как было» соврало бы во второй раз.
      try { micOn = !!room.localParticipant.isMicrophoneEnabled; } catch (e2) {}
      micPaint();
      var _mw = devWhy(e, 'mic');
      say((why ? why + ' ' : '')
          + (_mw || ('Микрофон переключить не вышло (' + (e && e.message || e) + ').'))
          + ' Кнопка показывает то, что есть на самом деле.', true);
      return false;
    }
    micOn = want;
    micPaint();
    // ═══ ЗАГОВОРИЛ - ЗНАЧИТ ВЕРНУЛСЯ ═══
    // Требовать за это отдельный тап значит копить забытые метки: человек включает
    // микрофон, чтобы ответить, и в этот момент «отошёл» рядом с его именем уже врёт.
    // СНИМАЕМ ТОЛЬКО ПРИ ВКЛЮЧЕНИИ И ТОЛЬКО ПОСЛЕ УСПЕХА: отказ SDK сюда не доходит.
    if (want && awayOn) awaySet(false, 'Микрофон включён - снял метку «отошёл».');
    if (why) say(why);
    try { upsert(room.localParticipant.identity, { muted: !micOn }); } catch (e) {}
    return true;
  }

  function micPaint() {
    var b = document.getElementById('mic');
    if (!b) return;
    b.className = micOn ? 'on' : 'off';
    barLabel(b, micOn ? '🎙' : '🔇', 'Микрофон');
  }

  // ═══ СВОБОДНЫЙ ХОЛСТ: ГДЕ ЛЕЖИТ КАКОЕ ОКНО ═══
  // ХРАНИМ У СЕБЯ И В ДОЛЯХ, А НЕ В ПИКСЕЛЯХ. Человек открывает комнату с ноутбука и с
  // планшета, и пиксели с одного экрана на другом кладут окно за край - вернуть его
  // будет нечем, потому что тащить станет не за что. Доли переносятся.
  var layFree = {};

  function freeLoad() {
    try {
      layFree = JSON.parse(localStorage.getItem('rtc_lay_free') || '{}') || {};
    } catch (e) { layFree = {}; }
    if (typeof layFree !== 'object' || !layFree) layFree = {};
  }

  // ═══ ИМЕНОВАННЫЕ СЛОТЫ РАСКЛАДКИ ═══
  // ЧТО ХРАНИТСЯ - ДОЛИ И РЕЖИМ, А НЕ КАРТИНКА. Слот, помнящий только координаты, при
  // загрузке в режиме «сетка» не сделал бы НИЧЕГО: доли там не применяются, и человек
  // решил бы, что слот пустой. Поэтому режим едет вместе с ними и ставится первым.
  var slotNames = [];

  function slotsPaint() {
    var box = document.getElementById('slots');
    if (!box) return;
    // КНОПОК НЕТ ТАМ, ГДЕ РАССТАВЛЯТЬ НЕЧЕМ. На мобиле свободной раскладки не бывает
    // (см. `freeOk`), и «сохранить раскладку» сохраняло бы сетку под именем - то есть
    // обещало бы то, что не выполнится.
    box.style.display = freeOk() ? '' : 'none';
    var lst = document.getElementById('slotlist');
    if (!lst) return;
    lst.innerHTML = '';
    slotNames.forEach(function (nm) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = '🔲 ' + nm;
      b.onclick = function () { slotLoad(nm); };
      lst.appendChild(b);
      var x = document.createElement('button');
      x.className = 'chip'; x.textContent = '✖️';
      x.title = 'Убрать «' + nm + '»';
      // ОБРАТНЫЙ ПУТЬ У КАЖДОГО СЛОТА, А НЕ ОДИН НА ВСЕ. Пять заготовок и одна кнопка
      // «стереть всё» - это не обратный ход, а другая операция.
      x.onclick = function () { slotDrop(nm); };
      lst.appendChild(x);
    });
  }

  // ПОВОРОТ ПЛАНШЕТА МЕНЯЕТ ОТВЕТ `freeOk`, И РЯД ОБЯЗАН ЗА НИМ ПОЙТИ. Посчитай мы его
  // один раз при входе - человек, повернувший устройство, остался бы либо с кнопкой,
  // которая ничего не сохранит, либо без кнопки при рабочем холсте.
  window.addEventListener('resize', function () {
    try { slotsPaint(); } catch (e) {}
  });

  function slotsFrom(res) {
    if (!res || !res.slots) return;
    slotNames = [].slice.call(res.slots).map(String);
    slotsPaint();
  }

  async function slotSave() {
    if (!roomAsk) { say('Ещё подключаюсь - слоты будут через секунду.', true); return; }
    var nm = await askText('Как назвать раскладку?', 'например «планёрка»');
    if (!nm) return;
    // ШЛЁМ ТО, ЧТО ПРАВДА СТОИТ НА ЭКРАНЕ. Собрать «как должно быть» отдельной формулой
    // значило бы завести второй ответ на вопрос «где лежат окна» (закон №40).
    var res = await roomAsk({ kind: 'rtclay', room: ROOM, act: 'lay_save', nm2: nm,
                             mode: layMode, lay: JSON.stringify(layFree) },
                            'Сохраняю раскладку…');
    slotsFrom(res);
  }

  async function slotLoad(nm) {
    if (!roomAsk) { say('Ещё подключаюсь - слоты будут через секунду.', true); return; }
    var res = await roomAsk({ kind: 'rtclay', room: ROOM, act: 'lay_load', nm2: nm },
                            'Загружаю раскладку…');
    if (!res || !res.lay) return;                 // причину бот уже назвал сам
    var lay = null;
    try { lay = JSON.parse(res.lay); } catch (e) { lay = null; }
    if (!lay || typeof lay !== 'object') {
      say('Раскладка «' + nm + '» пришла в непонятном виде - не применяю.', true);
      return;
    }
    // РЕЖИМ ПЕРВЫМ, КООРДИНАТЫ ВТОРЫМИ: иначе доли лягут в память и не применятся, и
    // тап по слоту выглядел бы как «ничего не произошло».
    if (res.mode && LAY_NAMES[res.mode]) layMode = freeOk() ? res.mode : 'grid';
    layFree = lay;
    freeSave(); laySave(); layPaint();
    say('Раскладка «' + nm + '»: окон ' + Object.keys(lay).length + '.');
  }

  async function slotDrop(nm) {
    if (!roomAsk) return;
    var res = await roomAsk({ kind: 'rtclay', room: ROOM, act: 'lay_drop', nm2: nm },
                            'Убираю раскладку…');
    slotsFrom(res);
  }

  function freeSave() {
    try { localStorage.setItem('rtc_lay_free', JSON.stringify(layFree)); } catch (e) {}
  }

  //: КЛЮЧ ОКНА. Для видео это участник (или «@me»), для крипто-панели - её имя. Ключ
  //: обязан пережить перезаход, поэтому берётся от СУЩНОСТИ, а не от порядка в списке:
  //: порядок меняется при каждом входе-выходе, и раскладка уехала бы к соседу.
  //: ═══ У СВОИХ ОКОН КЛЮЧ РАЗНЫЙ, ИНАЧЕ КАМЕРА САДИТСЯ НА ЭКРАН (живой отказ Ren 01.09)
  //: «Включил показ, потом камеру - экран исчезает с холста, хотя кнопка показывает, что
  //: он включён.» Механизм: у ОБОИХ своих окон не было `pid` (он есть только у чужих), и
  //: ключ выходил один и тот же - `@me`. На свободном холсте это значит ОДНУ сохранённую
  //: рамку на два окна: второе ложится ровно на первое и накрывает его целиком. Плитка
  //: жива, дорожка публикуется, соседи её видят - не видит только сам показывающий.
  //: ИСТОЧНИК БЕРЁМ У ДОРОЖКИ, А НЕ У ПОДПИСИ: подпись пишет человек, источник знает SDK.
  function freeKey(el) {
    if (!el) return '';
    if (el.id === 'crypto') return '@crypto';
    if (el.dataset.pid) return el.dataset.pid;
    if (el.dataset.me !== '1') return '';
    //: СТАРЫЙ КЛЮЧ `@me` СОХРАНЁН ЗА КАМЕРОЙ НАРОЧНО: у людей уже лежат сохранённые
    //: раскладки (localStorage и именованные слоты), и смени мы ключ у обоих окон -
    //: разъехалось бы то, что человек ставил руками. Камера - частый случай, она и
    //: остаётся под прежним именем; у показа ключ свой.
    return el.dataset.src === 'screen' ? '@me:screen' : '@me';
  }

  //: РАСКЛАДКА ПО УМОЛЧАНИЮ - ЛЕСЕНКОЙ, А НЕ СТОПКОЙ. Положи мы все окна в одну точку,
  //: человек увидел бы ОДНО окно и решил, что остальные пропали.
  function freeDefault(i) {
    var step = 0.06 * (i % 5);
    return { x: 0.04 + step, y: 0.04 + step, w: 0.46, h: 0.42 };
  }

  //: ОКНА ХОЛСТА = ВИДЕО + КРИПТО-ПАНЕЛЬ. Список собирается в ОДНОМ месте: разойдись
  //: он с тем, что реально лежит в контейнере, - часть окон осталась бы неподвижной, и
  //: выглядело бы это как «у меня не таскается вот это».
  //: ═══ РАЗВЁРНУТОЕ ОКНО ХОЛСТУ НЕ ПРИНАДЛЕЖИТ, И ЭТО ОДНА ПРИЧИНА ДВУХ СИМПТОМОВ ═══
  //: ЖИВОЙ ОТКАЗ REN 03.09: на раскладке «свободно» окна камеры и показа «съезжают за
  //: фиксированную рамку страницы», а «во весь экран» на них не срабатывает - окно
  //: остаётся почти того же размера; в «авто» полный экран работает нормально.
  //: МЕХАНИЗМ: `freeApply` пишет ИНЛАЙНОВЫЕ left/top/width/height КАЖДОМУ окну холста, а
  //: инлайн сильнее любого класса. `vfsSet` снимает координаты при развороте
  //: (`freeClear`), но следующий же `layPaint` - а его зовёт каждое событие комнаты и
  //: сердцебиение раз в пять секунд - кладёт их ОБРАТНО. Дальше арифметика: окно с
  //: классом `.vfull` это `position:fixed`, и координаты холста применяются к нему
  //: ОТНОСИТЕЛЬНО ОКНА БРАУЗЕРА, а не канвы - отсюда и «съехало за рамку», и «размер
  //: почти прежний». В «авто» инлайна нет вовсе, поэтому там всё работает.
  //: ЧИНИТСЯ ИСКЛЮЧЕНИЕМ, А НЕ ПОРЯДКОМ ВЫЗОВОВ: пока окно развёрнуто, оно вне холста;
  //: свернули - `layPaint` из `vfsSet` вернёт ему координаты сам (закон №55, обе стороны).
  function freeEls() {
    var out = [];
    vids.forEach(function (r) {
      if (r.el && r.el.classList.contains('vfull')) return;
      out.push(r.el);
    });
    var cr = $('crypto');
    //: ═══ У ПАНЕЛИ ФИЛЬТРА НЕТ, И ЭТО НЕ ЗАБЫТАЯ ПОЛОВИНА ═══
    //: `vfull` вешает РОВНО `vfsSet`, а её зовёт кнопка `.vfs`, которая создаётся только
    //: у видео-окна. Крипто-панель развернуть нечем ни одним путём, и симметричная
    //: проверка здесь охраняла бы НЕВОЗМОЖНОЕ состояние - то есть врала бы читателю, что
    //: у панели есть развёртка. Появится - строка вернётся вместе с кнопкой.
    //: Поймано подсадкой: она снимала эту проверку, и круг пробы честно не краснел -
    //: воспроизводить было нечего.
    if (cr && cr.style.display !== 'none' && cr.parentNode === $('screens')) out.push(cr);
    return out;
  }

  //: ═══ ВЫХОД СО СВОБОДНОГО ХОЛСТА ОБЯЗАН СНЯТЬ КООРДИНАТЫ (закон №55) ═══
  //: ЖИВОЙ ОТКАЗ REN (скриншот): «свободно» -> «авто» - окна вылетают за рамку, раскладка
  //: разваливается. `freeApply` ставит окнам ИНЛАЙНОВЫЕ left/top/width/height в пикселях,
  //: а сетка и «крупно» раскладывают их своими правилами - но инлайн сильнее класса, и
  //: окна оставались стоять по старым точкам холста. Обратный путь у переключателя был
  //: наполовину: включить умел, выключить - нет.
  //: ДВЕРЬ ОДНА, ПОТОМУ ЧТО СНИМАТЬ НАДО РОВНО ТО ЖЕ, ЧТО СТАВИЛИ: две копии списка
  //: свойств разошлись бы на первой добавленной координате, и остаток снова уезжал бы.
  var FREE_PROPS = ['left', 'top', 'width', 'height'];
  function freeClear(el) {
    if (!el || !el.style) return;
    for (var i = 0; i < FREE_PROPS.length; i++) el.style.removeProperty(FREE_PROPS[i]);
  }

  function freeApply() {
    var box = $('screens');
    var W = box.clientWidth || 1, H = box.clientHeight || 1;
    freeEls().forEach(function (el, i) {
      var k = freeKey(el);
      var r = (k && layFree[k]) || freeDefault(i);
      // ПОТОЛКИ И ПОЛЫ НЕ УКРАШЕНИЕ: без нижнего окно схлопывается в ноль и тянуть его
      // станет не за что, без верхнего оно уезжает за холст и теряется целиком.
      var w = Math.max(0.12, Math.min(1, r.w || 0.46));
      var h = Math.max(0.12, Math.min(1, r.h || 0.42));
      var x = Math.max(0, Math.min(1 - w, r.x || 0));
      var y = Math.max(0, Math.min(1 - h, r.y || 0));
      el.style.left = (x * W) + 'px';
      el.style.top = (y * H) + 'px';
      el.style.width = (w * W) + 'px';
      el.style.height = (h * H) + 'px';
      freeGrip(el);
    });
  }

  //: ОДНА РУЧКА НА ОКНО. Вешаем ОДИН РАЗ и метим сам элемент: `layPaint` зовётся на
  //: каждое событие комнаты, и без метки на окне за час созвона накопились бы сотни
  //: обработчиков на одном и том же уголке.
  function freeGrip(el) {
    if (el.dataset.freewired === '1') return;
    el.dataset.freewired = '1';
    var g = document.createElement('div');
    g.className = 'wgrip';
    g.title = 'Тяни за угол - размер. Двойной тап по заголовку - вернуть окно на место';
    el.appendChild(g);
    freeDrag(g, el, 'size');
    var head = el.querySelector('.vnm');
    if (!head && el.id === 'crypto') {
      head = document.createElement('span');
      head.className = 'vnm';
      head.textContent = '📈 График и доска';
      el.insertBefore(head, el.firstChild);
    }
    if (head) {
      freeDrag(head, el, 'move');
      // ═══ ОБРАТНЫЙ ПУТЬ У КАЖДОГО ОКНА, А НЕ ТОЛЬКО У ВСЕЙ РАСКЛАДКИ (закон №55) ═══
      // «Авто» сбрасывает ВСЁ; двойной тап возвращает на место ОДНО, которое человек
      // только что уронил за край. Без него единственный выход - снести и свою работу.
      head.addEventListener('dblclick', function () {
        var k = freeKey(el);
        if (k) { delete layFree[k]; freeSave(); }
        freeApply();
        say('Вернул это окно на место.');
      });
    }
  }

  //: ТАЩИМ И ТЯНЕМ ОДНИМ КОДОМ. `pointer`-события покрывают мышь и палец сразу; два
  //: обработчика разошлись бы на первой правке (закон №40).
  function freeDrag(handle, el, kind) {
    var from = null, base = null;
    handle.addEventListener('pointerdown', function (e) {
      if (layMode !== 'free') return;
      var box = $('screens');
      var br = box.getBoundingClientRect();
      var r = el.getBoundingClientRect();
      from = { x: e.clientX, y: e.clientY, W: br.width || 1, H: br.height || 1 };
      base = { x: (r.left - br.left) / from.W, y: (r.top - br.top) / from.H,
               w: r.width / from.W, h: r.height / from.H };
      try { handle.setPointerCapture(e.pointerId); } catch (e2) {}
      e.preventDefault();
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', function (e) {
      if (!from) return;
      var dx = (e.clientX - from.x) / from.W, dy = (e.clientY - from.y) / from.H;
      var r;
      if (kind === 'move') {
        r = { x: base.x + dx, y: base.y + dy, w: base.w, h: base.h };
      } else {
        r = { x: base.x, y: base.y,
              w: Math.max(0.12, base.w + dx), h: Math.max(0.12, base.h + dy) };
      }
      r.w = Math.min(1, r.w); r.h = Math.min(1, r.h);
      r.x = Math.max(0, Math.min(1 - r.w, r.x));
      r.y = Math.max(0, Math.min(1 - r.h, r.y));
      var k = freeKey(el);
      if (k) layFree[k] = r;
      freeApply();
    });
    function done() {
      if (!from) return;
      from = null;
      freeSave();
    }
    handle.addEventListener('pointerup', done);
    handle.addEventListener('pointercancel', done);
  }

  function layPaint() {
    var box = $('screens');
    var n = vids.length;
    // ═══ ЗАКРЕПЛЕНИЕ ПОКАЗЫВАЕТСЯ ТОЛЬКО ТАМ, ГДЕ У НЕГО ЕСТЬ ПОСЛЕДСТВИЕ ═══
    // ЖИВОЙ ОТЗЫВ REN: «нажимаешь 📌 - ничего видимого не происходит». Так и было, и
    // код был при этом верен: «крупно» при ОДНОМ окне выглядит ровно как обычный вид -
    // закреплять не от чего. Кнопка, которая честно отработала и ничего не изменила,
    // читается как сломанная, поэтому при одном окне её нет вовсе (закон №36 наоборот:
    // прячем не работу, а то, чего не существует).
    // РАЗВЁРТКА ⛶ ОСТАЁТСЯ ВСЕГДА: она меняет вид и при одном окне - ровно ради этого
    // случая Ren её и просил (показ экрана обычно единственный).
    vids.forEach(function (r) {
      var pb = r.el.querySelector('.vpin');
      if (pb) pb.style.display = (n >= 2) ? '' : 'none';
      r.el.classList.toggle('haspin', n >= 2);
    });
    // «АВТО» - ЭТО НЕ ЧЕТВЁРТАЯ РАСКЛАДКА, А ПРАВИЛО: одно видео во всю ширину, два и
    // больше - сетка. Человек выбирает только тогда, когда правило ему не подходит.
    // ЗАКРЕПЛЁННОЕ ОКНО СИЛЬНЕЕ ПРАВИЛА «АВТО»: человек сказал, что смотреть крупно, и
    // переспрашивать его каждый раз, когда заговорил сосед, - это спорить с ним.
    var mode = layMode;
    // ═══ СВОБОДНЫЙ ХОЛСТ ТОЛЬКО ТАМ, ГДЕ ЕСТЬ ЧЕМ ТАЩИТЬ ═══
    // На мобиле его нет, и режим тихо становится сеткой: оставить его значило бы дать
    // кнопку, после которой окна разъезжаются в кашу и вернуть их пальцем нечем.
    if (mode === 'free' && !freeOk()) mode = 'grid';
    if (mode === 'auto') mode = layPin ? 'spk' : (n >= 2 ? 'grid' : 'one');
    box.className = (mode === 'grid') ? 'grid'
                  : (mode === 'spk' ? 'spk' : (mode === 'free' ? 'free' : ''));
    if (mode === 'free') {
      // КРИПТО-ПАНЕЛЬ ПЕРЕЕЗЖАЕТ НА ХОЛСТ. Иначе «доска и график» осталась бы
      // единственным, что нельзя подвинуть, - холст был бы наполовину свободным.
      var _cr = $('crypto');
      if (_cr && _cr.style.display !== 'none' && _cr.parentNode !== box) {
        _cr.dataset.homeparent = '1';
        box.appendChild(_cr);
      }
      vids.forEach(function (r) {
        r.el.classList.remove('big'); r.el.classList.remove('small');
        r.el.classList.remove('pinned');
      });
      var _sp0 = document.getElementById('vgrip');
      if (_sp0) _sp0.remove();
      freeApply();
    } else {
      //: КООРДИНАТЫ СНИМАЮТСЯ ПЕРВЫМ ДЕЛОМ, ДО ВСЕГО ОСТАЛЬНОГО: ниже раскладка
      //: расставляет окна классами, и оставленный инлайн победил бы её молча.
      vids.forEach(function (r) { freeClear(r.el); });
      // ВОЗВРАТ ПАНЕЛИ НА МЕСТО - ОБЯЗАТЕЛЬНАЯ ПОЛОВИНА (закон №55): уехав на холст и
      // не вернувшись, она пропала бы с экрана при первом же переключении раскладки.
      var _cr2 = $('crypto');
      if (_cr2 && _cr2.dataset.homeparent === '1') {
        delete _cr2.dataset.homeparent;
        _cr2.removeAttribute('style');
        _cr2.style.display = '';
        var _anchor = $('port');
        if (_anchor && _anchor.parentNode) _anchor.parentNode.insertBefore(_cr2, _anchor);
      }
    }
    //: ═══ РАЗВЁРНУТОЕ ОКНО РАСКЛАДКА НЕ ТРОГАЕТ (вторая половина правки 02.09) ═══
    //: Снять классы в `vfsSet` мало: `layPaint` зовут и сердцебиение графика, и приход
    //: соседа, и смена раскладки - через пять секунд `big` вернулся бы, и конфликт с
    //: ним. Развёрнутое окно живёт ОТДЕЛЬНО от потока, пока не свёрнуто.
    //: ═══ ИСКЛЮЧАЕМ ИЗ РАЗДАЧИ, А НЕ СНИМАЕМ ПОСЛЕ НЕЁ ═══
    //: ПЕРВАЯ РЕДАКЦИЯ СНИМАЛА КЛАССЫ ЗДЕСЬ И БЫЛА НЕВЕРНА, И ПОЙМАЛА ЭТО ПРОБА, А НЕ
    //: ЧТЕНИЕ: цикл раздачи `big`/`small`/`pinned` стоит НИЖЕ и возвращал их обратно тому
    //: же окну - живой прогон показал `vwrap haspin vfull big pinned`. Порядок строк тут
    //: решает исход, и полагаться на него нельзя: `layPaint` длинная, и следующая правка
    //: снова переставит их местами. Поэтому развёрнутое окно ВЫПАДАЕТ из раздачи -
    //: утверждение держится состоянием, а не расположением строк.
    function layTouch(el) { return el !== vFull; }
    if (vFull && vFull.parentNode) {
      LAY_CLS.forEach(function (c) { vFull.classList.remove(c); });
    }
    if (mode === 'spk') {
      // КРУПНО - ЗАКРЕПЛЁННЫЙ, А ЕСЛИ ЕГО НЕТ - ТОТ, КТО ГОВОРИТ. Молчат все - первый:
      // пустое место вместо картинки читается как поломка.
      var big = null;
      if (layPin) {
        vids.forEach(function (r) {
          var k = freeKey(r.el);
          if (!big && k && k === layPin) big = r;
        });
        // ЗАКРЕПЛЁННЫЙ УШЁЛ ИЗ КОМНАТЫ - ЗАКРЕПЛЕНИЕ СНИМАЕТСЯ САМО. Держать его значило
        // бы показывать крупно пустоту и не давать вернуться к нормальной раскладке.
        if (!big) { layPin = ''; laySave(); }
      }
      if (!big) {
        vids.forEach(function (r) {
          var pid = r.el.dataset.pid || '';
          if (!big && pid && people[pid] && people[pid].speaking) big = r;
        });
      }
      if (!big) big = vids[0];
      vids.forEach(function (r) {
        if (!layTouch(r.el)) return;      // развёрнутое окно вне раскладки
        r.el.classList.toggle('big', r === big);
        r.el.classList.toggle('small', r !== big);
        var k = freeKey(r.el);
        r.el.classList.toggle('pinned', !!(layPin && k === layPin));
      });
      laySplit(box);
    } else {
      vids.forEach(function (r) {
        r.el.classList.remove('big'); r.el.classList.remove('small');
        r.el.classList.remove('pinned');
      });
      // ДЕЛИТЬ НЕЧЕГО - ПОЛОСЫ НЕТ ВОВСЕ (закон №36). Она живёт РОВНО в режиме «крупно»:
      // в сетке тянуть не за что, и оставленная полоса читалась бы как сломанная кнопка.
      // УБОРКА СТОИТ ИМЕННО ЗДЕСЬ, В ВЕТКЕ «не крупно»: вынеси её наружу - и она сносила
      // бы полосу СРАЗУ ПОСЛЕ того, как ветка «крупно» её создала (поймано пробой:
      // «делителя между окнами нет» при верном на вид коде).
      var _sp = document.getElementById('vgrip');
      if (_sp) _sp.remove();
    }
    // ГОВОРЯЩИЙ - ОБВОДКОЙ ПЛИТКИ, И ЭТО ОДНО МЕСТО НА ВСЕ РАСКЛАДКИ. Раскладка отвечает
    // на вопрос «где окна», подсветка - «кто сейчас говорит»; свяжи их, и в сетке
    // говорящий перестал бы подсвечиваться вовсе.
    vids.forEach(function (r) {
      var pid = r.el.dataset.pid || '';
      r.el.classList.toggle('speaking', !!(pid && people[pid] && people[pid].speaking));
    });
    //: ПОДПИСЬ КРАСИТСЯ ПОСЛЕ ВСЕХ ВЕТОК, А НЕ ВНУТРИ ОДНОЙ. Класс `pinned` ставит
    //: ветка «крупно» и снимает ветка «не крупно»; покрась подпись внутри первой - и
    //: она осталась бы «Снять» после переключения в сетку. Тот же порядок уже стоил
    //: круга на делителе окон.
    vids.forEach(function (r) { pinLabel(r.el); });
    var b = $('lay');
    if (b) {
      // РАСКЛАДЫВАТЬ НЕЧЕГО - КНОПКИ НЕТ. Она бы переключала невидимое и читалась как
      // сломанная (закон №36: причина рядом, а не молчание после тапа).
      b.style.display = n ? '' : 'none';
      b.textContent = '🔲 Раскладка: ' + LAY_NAMES[layMode];
      b.classList.toggle('on', layMode !== 'auto');
    }
  }

  // ═══ ДЕЛИТЕЛЬ МЕЖДУ ОКНАМИ: ТЯНЕШЬ - МЕНЯЕТСЯ ТОЛЬКО ТВОЙ ЭКРАН ═══
  // Полоса живёт РОВНО в режиме «крупно»: в сетке делить нечего, и полоса там была бы
  // кнопкой, которая ничего не делает. Высоту храним в пикселях у себя (закон о личном
  // против общего: раскладка это вкус, а не состояние комнаты).
  // МЫШЬ И ПАЛЕЦ - ОДИН КОД: `pointer`-события покрывают оба, а два обработчика разошлись
  // бы на первой правке (закон №40).
  function laySplit(box) {
    // ═══ СВОБОДНЫЙ РАЗМЕР: ЗА УГОЛ, ШИРИНА И ВЫСОТА (требование Ren 30.08) ═══
    // Полоса под окном была `cursor:row-resize` и читала ТОЛЬКО `clientY` - то есть
    // тянулась исключительно по высоте, а договаривались про размер, как у окна в
    // системе. Уголок живёт НА САМОЙ КРУПНОЙ ПЛИТКЕ, а не отдельным блоком: элемент,
    // прибитый к соседу, уезжает от него при первой же смене раскладки.
    var big = box.querySelector('.vwrap.big');
    var old = document.getElementById('vgrip');
    if (!big) { if (old) old.remove(); return; }
    var sp = old;
    if (!sp) {
      sp = document.createElement('div');
      sp.id = 'vgrip';
      sp.title = 'Тяни за угол - ширина и высота. Двойной тап - вернуть как было';
      var from = null, baseH = 0, baseW = 0;
      sp.addEventListener('pointerdown', function (e) {
        var b = box.querySelector('.vwrap.big');
        if (!b) return;
        var r = b.getBoundingClientRect();
        from = { x: e.clientX, y: e.clientY };
        baseH = r.height; baseW = r.width;
        //: ═══ ПОКА ТЯНЕМ - ПЛИТКУ НЕ ПЕРЕСОБИРАЕМ (первая половина дёрганья) ═══
        //: `laySplit` при каждой перерисовке делает `big.appendChild(sp)`, а перемещение
        //: узла в DOM СНИМАЕТ захват указателя. Перерисовка идёт постоянно: обводка
        //: говорящего живёт в том же `layPaint`, и на живом созвоне она меняется по
        //: несколько раз в секунду. Захват терялся, `pointermove` переставал доходить, а
        //: `from` оставался - и следующее попадание пальца по уголку считалось от старой
        //: точки. Это и есть «скачет влево-вправо».
        window.__VGRIP_DRAG = 1;
        try { sp.setPointerCapture(e.pointerId); } catch (e2) {}
        e.preventDefault();
      });
      sp.addEventListener('pointermove', function (e) {
        if (!from) return;
        // ПОТОЛКИ НЕ УКРАШЕНИЕ: без нижнего окно схлопывается в ноль и вернуть его нечем
        // (тянуть станет не за что), без верхнего уезжают все остальные плитки.
        //: ═══ ПЛИТКА ОТЦЕНТРОВАНА, ЗНАЧИТ ШИРИНА РАСТЁТ ВДВОЕ БЫСТРЕЕ КРАЯ ═══
        //: ВТОРАЯ ПОЛОВИНА ДЁРГАНЬЯ, и она чисто арифметическая. У крупной плитки стоит
        //: `margin-left:auto; margin-right:auto` - она ЦЕНТРИРУЕТСЯ. Прибавив к ширине
        //: Δ, мы двигаем правый край всего на Δ/2, а уголок прибит к этому краю: палец
        //: ушёл на Δ, уголок - на половину, и человек весь драг догоняет собственную
        //: руку. По высоте центрирования нет, поэтому там множитель единица.
        var h = Math.max(120, Math.min(window.innerHeight * 0.85,
                                       baseH + (e.clientY - from.y)));
        var w = Math.max(160, Math.min(box.clientWidth || window.innerWidth,
                                       baseW + (e.clientX - from.x) * 2));
        layBigH = Math.round(h); layBigW = Math.round(w);
        box.style.setProperty('--bigh', layBigH + 'px');
        box.style.setProperty('--bigw', layBigW + 'px');
      });
      function stop() {
        window.__VGRIP_DRAG = 0;
        if (from) { from = null; laySave(); }
      }
      sp.addEventListener('pointerup', stop);
      sp.addEventListener('pointercancel', stop);
      // ОБРАТНЫЙ ПУТЬ У РАЗМЕРА ТОЖЕ ЕСТЬ (закон №55): утянул окно не туда - двойной тап
      // возвращает как было, и искать «сброс» в меню не нужно. Возвращаются ОБА размера:
      // вернуть половину значит оставить окно кривым и без способа это починить.
      sp.addEventListener('dblclick', function () {
        layBigH = 0; layBigW = 0;
        box.style.removeProperty('--bigh'); box.style.removeProperty('--bigw');
        laySave();
        say('Размер окна вернул к обычному.');
      });
    }
    // УГОЛОК ПЕРЕЕЗЖАЕТ К НЫНЕШНЕЙ КРУПНОЙ ПЛИТКЕ: закрепили другого - тянуть надо его.
    // НО НЕ ВО ВРЕМЯ ТЯГИ: перемещение узла снимает захват указателя, и драг рассыпается
    // ровно тогда, когда кто-то говорит (перерисовка идёт из-за обводки говорящего).
    if (sp.parentNode !== big && !window.__VGRIP_DRAG) big.appendChild(sp);
    if (layBigH) box.style.setProperty('--bigh', layBigH + 'px');
    if (layBigW) box.style.setProperty('--bigw', layBigW + 'px');
  }

  // ═══ ВО ВЕСЬ ЭКРАН: У TELEGRAM СВОЙ API, У БРАУЗЕРА СВОЙ ═══
  // Кнопка появляется ТОЛЬКО там, где хоть один из них есть: на клиенте старее Bot API 8.0
  // её быть не должно вовсе - кнопка, после которой ничего не происходит, хуже отсутствующей.
  var fullOn = false;

  function fullCan() {
    return !!(tg && typeof tg.requestFullscreen === 'function')
        || !!(document.documentElement && document.documentElement.requestFullscreen);
  }

  function fullPaint() {
    var b = $('full');
    if (!b) return;
    b.style.display = fullCan() ? '' : 'none';
    b.classList.toggle('on', fullOn);
    b.textContent = fullOn ? '⛶ Свернуть' : '⛶ Во весь экран';
  }

  // ═══ КАЧЕСТВО СВЯЗИ: ЦИФРЫ ВМЕСТО «У МЕНЯ ЗАИКАЕТСЯ» ═══
  // ЖИВОЙ СОЗВОН НЕСКОЛЬКИХ ЧЕЛОВЕК (Ren 27.08): «непонятно, у кого плохо со связью».
  // По жалобе делать нечего: она не говорит НИ КТО, НИ НАСКОЛЬКО. Пороги названы им же -
  // потери больше 2% и джиттер больше 30 мс.
  //: ПОТЕРИ СЧИТАЮТСЯ ЗА ОКНО, А НЕ ОТ НАЧАЛА СОЗВОНА. Накопленный процент за час
  //: показывает историю, а вопрос у человека про СЕЙЧАС: одна плохая минута в начале
  //: разговора не должна красить весь остаток.
  var LOSS_BAD = 2, JIT_BAD = 30, STAT_EVERY = 10000;
  var statSaid = false;       // говорили ли уже, что статистики у клиента нет
  //: ═══ ОДНА ДВЕРЬ ЗАМЕРА, А НЕ ДВА ПРОХОДА НА ОДИН ВОПРОС (закон №40) ═══
  //: До этой правки `getStats` по чужим дорожкам обходился ДВАЖДЫ за тик: `statsOnce`
  //: ради админской строки и `rxOnce` ради своего приёма. Вопрос у них ОДИН - «что
  //: дошло до меня», - и копии УЖЕ разошлись: `break` по первой попавшейся дорожке
  //: участника починен только в `rxOnce`, то есть у админа звук мог не мериться ВООБЩЕ,
  //: а строка выглядела полной. Теперь замер один (`rxOnce`), показ обеих строк - в
  //: `rxTick`, и разъехаться им нечем. Своих `statPrev`/`statLast` у второго прохода
  //: больше нет: счётчики живут в `rxPrev` и ключуются ДОРОЖКОЙ, а не участником.
  //: ═══ КТО СКОЛЬКО ГОВОРИЛ: КОПИМ ЗДЕСЬ, ПОТОМУ ЧТО БОЛЬШЕ НЕГДЕ ═══
  //: Вопрос Ren 08.09 («можно ли после созвона узнать, кто сколько говорил») до этой
  //: правки не имел ответа: событие `ActiveSpeakersChanged` у нас БЫЛО и только
  //: подсвечивало рамку - накопления не делал никто, а спросить у LiveKit задним числом
  //: нечего: он отдаёт СОБЫТИЕ, а не счётчик.
  //: СЧИТАЕМ ПО ОТРЕЗКАМ МЕЖДУ СОБЫТИЯМИ, А НЕ ТИКОМ ТАЙМЕРА: событие приходит на смену
  //: состава говорящих, и между двумя соседними человек говорил ВСЁ это время. Тик раз в
  //: секунду дал бы то же самое ценой лишнего таймера и ошибки округления на коротких
  //: репликах - а именно короткие и отличают «поддакивал» от «делал доклад».
  var talkAcc = {};           // identity -> накопленные секунды
  var talkFrom = {};          // identity -> когда начал говорить (мс)
  function talkMark(ids) {
    var t = _now(), on = {};
    (ids || []).forEach(function (id) { on[id] = true; });
    Object.keys(talkFrom).forEach(function (id) {
      if (on[id]) return;                       // всё ещё говорит - отрезок не закрыт
      talkAcc[id] = (talkAcc[id] || 0) + (t - talkFrom[id]) / 1000;
      delete talkFrom[id];
    });
    Object.keys(on).forEach(function (id) {
      if (talkFrom[id] === undefined) talkFrom[id] = t;
    });
  }
  function talkSecs() {
    //: ОТКРЫТЫЙ ОТРЕЗОК ВХОДИТ В ОТВЕТ: снимок делается ПО ХОДУ созвона, и говорящий в
    //: этот момент человек иначе выглядел бы молчащим ровно тогда, когда он говорит.
    var t = _now(), out = {};
    Object.keys(talkAcc).forEach(function (id) { out[id] = talkAcc[id]; });
    Object.keys(talkFrom).forEach(function (id) {
      out[id] = (out[id] || 0) + (t - talkFrom[id]) / 1000;
    });
    var named = {};
    Object.keys(out).forEach(function (id) {
      if (out[id] < 1) return;                  // меньше секунды - это не «говорил»
      var nm = (people[id] && people[id].name) || human('', id);
      named[nm] = Math.round((named[nm] || 0) + out[id]);
    });
    return named;
  }

  function statFmt(nm, q) {
    //: ОЦЕНКА ПОКАЗЫВАЕТСЯ ТОЛЬКО КОГДА ОНА НИЖЕ ПОРОГА. Строка и так плотная, а «4.3 из
    //: 5» у всех подряд превращает её в шум, в котором плохое число не заметно. Ноль
    //: означает «не знаю» (нет буфера или RTT) - тогда её нет вовсе, а не «0 из 5».
    var poor = (q.mos > 0 && q.mos < MOS_BAD);
    var bad = (q.loss > LOSS_BAD) || (q.jit > JIT_BAD) || poor;
    return nm + ': ' + q.loss.toFixed(1) + '% потерь, джиттер ' + Math.round(q.jit) + ' мс'
      + (q.rtt ? ', RTT ' + Math.round(q.rtt) + ' мс' : '')
      + (poor ? ', качество ' + q.mos.toFixed(1) + ' из 5' : '')
      + (bad ? ' ⚠️' : '');
  }

  // ═══ ЧТО СЛЫШУ И ВИЖУ Я САМ: МЕТРИКИ ПРИЁМА ═══
  // ЖИВОЙ СЛУЧАЙ (боевой созвон 31.08): у Максима, который НЕ СЛЫШАЛ, строка показывала
  // «0.0% потерь, джиттер 5 мс». Числа были верные и отвечали НЕ НА ТОТ ВОПРОС: снимок
  // делает КАЖДЫЙ у себя, а отправляет боту ОДИН - админ. Значит «Максим: 0%» означало
  // «АДМИН принял Максима чисто», то есть говорило про путь ЕГО ГОЛОСА НАРУЖУ и ничего -
  // про то, что доходило ДО НЕГО. Про свой приём человек обязан узнать сам и от себя.
  //
  // ЧЕМ ВИДНЫ РЫВКИ. Потери и джиттер описывают ТРАНСПОРТ, а рвётся звук в ПЛЕЕРЕ:
  // `concealedSamples` - это сэмплы, которых не было и которые кодек ДОРИСОВАЛ. Их доля
  // от `totalSamplesReceived` и есть «сколько звука я на самом деле не услышал», и
  // именно она отличает «шуршит» от «рвётся». Ни одна из прежних цифр её не показывала.
  var RX_CONCEAL_BAD = 3;     // % дорисованного звука, выше которого это слышно
  var RX_LOST_BAD = 3;        // % потерь на приёме
  var RX_JBUF_BAD = 300;      // мс задержки буфера: столько уже слышно как отставание

  // ═════════ КАЧЕСТВО ОДНИМ ЧИСЛОМ: MOS. ЭТО ОЦЕНКА, А НЕ ЗАМЕР ═════════
  // ЗАЧЕМ ОНО, КОГДА ТРИ ПОРОГА УЖЕ ЕСТЬ. Пороги смотрят на КАЖДЫЙ признак отдельно, а
  // слышимость рушат их СОЧЕТАНИЯ: буфер 200 мс (порог 300 - молчим) плюс RTT 180 мс
  // (своего порога нет вовсе) дают задержку 310 мс, на которой разговор уже неудобен.
  // Ни один из трёх при этом не срабатывает - а MOS падает до 3.4.
  //
  // АРИФМЕТИКА ВЗЯТА У `rtcscore` 0.0.2 (MIT по package.json; файла лицензии в пакете
  // нет, автор и репозиторий там не названы), файл `src/rtc_mos.js`, звуковая половина.
  // Видеовую не берём: её коэффициенты автор сам помечает как регрессию по «очень
  // ограниченным данным». `report()` не берём тем более - он шлёт замеры на чужой хост.
  //
  // ═══ ОДНО ОТСТУПЛЕНИЕ ОТ ИСХОДНИКА, И ОНО ПОСЧИТАНО, А НЕ НА ГЛАЗ ═══
  // У автора член задержки написан как `0.1 * delay - 150` вместо `0.1 * (delay - 150)`.
  // Потерянные скобки делают `Id` ОТРИЦАТЕЛЬНЫМ везде выше 150 мс, `R` упирается в
  // потолок 100, и оценка ПИННЕТСЯ НА МАКСИМУМЕ ровно там, где задержка стала плохой:
  //
  //   задержка   Id у автора   MOS у автора   Id со скобками   MOS со скобками
  //      95 мс          2.9           4.32              2.9              4.32
  //     150 мс          4.5           4.27              4.5              4.27
  //     200 мс       -124.0           4.50             11.0              4.06
  //     320 мс       -108.4           4.50             26.6              3.37
  //     600 мс        -72.0           4.50             63.0              1.57
  //
  // До 150 мс формулы совпадают ТОЧНО - то есть правка меняет ровно тот участок, ради
  // которого показатель и нужен. С исправленной арифметикой порог 3.5 срабатывает на
  // задержке ~310 мс при нулевых потерях либо на ~6% потерь при нормальной задержке.
  var MOS_BAD = 3.5;          // ниже этого говорим человеку и админу (число из ТЗ)
  function rxMos(pl, bufMs, rttMs) {
      //: -> оценка 1..5, либо 0 = «не знаю». НУЛЬ ЗДЕСЬ НЕ «ПЛОХО», А ОТСУТСТВИЕ ДАННЫХ.
      //: У автора недостающее подставляется умолчаниями (буфер 50 мс, RTT 50 мс) - для
      //: библиотеки это удобно, для нас это выдуманное число (закон №22): браузер, не
      //: отдавший `jitterBufferDelay` или пару кандидатов, получил бы оценку, собранную
      //: из наших догадок, и она выглядела бы ровно как настоящая.
      if (!(bufMs > 0) || !(rttMs > 0)) return 0;
      //: ПАКЕТИЗАЦИЯ 20 мс - это наш кодек, а не оценка: Opus у нас идёт кадрами 20 мс.
      var delay = 20 + bufMs + rttMs / 2;
      //: `Ie` ПРИ DTX РАВЕН 8 И ОТ БИТРЕЙТА НЕ ЗАВИСИТ - а DTX у нас включён в
      //: `publishDefaults` для ВСЕХ, кто открыл эту страницу. Значит битрейт приёмнику
      //: спрашивать незачем, и мы его не спрашиваем.
      var Ie = 8;
      //: `Bpl` У АВТОРА ОЗНАЧАЕТ «У РЕЧИ ЕСТЬ ИЗБЫТОЧНОСТЬ». У нас это RED (`red: true`
      //: там же), а не in-band FEC: RED везёт ПОЛНУЮ копию прошлого кадра, то есть
      //: избыточность СИЛЬНЕЕ той, под которую число подбиралось. Берём 20 - при таком
      //: раскладе это оценка снизу, а не сверху.
      var Bpl = 20;
      var Ipl = Ie + (100 - Ie) * (pl / (pl + Bpl));
      var Id = delay * 0.03 + (delay > 150 ? 0.1 * (delay - 150) : 0);
      var R = Math.max(0, Math.min(100, 100 - Ipl - Id));
      var M = 1 + 0.035 * R + (R * (R - 60) * (100 - R) * 7) / 1000000;
      return Math.max(1, Math.min(5, Math.round(M * 100) / 100));
  }
  try { window.rxMos = rxMos; } catch (e) {}
  var rxPrev = {};            // sid -> прошлые счётчики (считаем ЗА ОКНО, не от начала)
  var rxLast = { bad: false, why: '', quiet: false, at: 0 };
  var rxSaidAt = 0;
  //: «ПОСАЖЕНО ЛИ ВИДЕО» - ЭТО ФАКТ РЕЕСТРА, А НЕ ОТДЕЛЬНЫЙ ФЛАГ (закон №35). Флаг
  //: разъезжается с делом на первом же расхождении: дорожка ушла из комнаты, флаг
  //: остался - и обратный путь «уже сделан».
  function rxIsLow() { for (var k in rxLowSids) { if (rxLowSids[k]) return true; } return false; }

  function pubSid(pub, fallback) {
      //: КАК ЗОВУТ ЭТУ ДОРОЖКУ - ОДИН ОТВЕТ НА ВСЕХ (закон №40). Спрашивают ДВОЕ: замер
      //: (`rxOnce`, кладёт долю дорисованного в `rxCon[sid]`) и обход (`rxEachRemotePub`,
      //: по этому же ключу просит буфер). Пока у публикации есть `trackSid`, обе формы
      //: совпадают и разницы не видно; на сборке без него замер сказал бы
      //: «участник:номер», а обход - `track.sid`, ключи разъехались бы, и лечение
      //: дорисованного звука не случилось бы НИ РАЗУ - молча, при исправном виде кода.
      try {
          if (!pub) return String(fallback || '');
          return String(pub.trackSid || pub.sid || (pub.track && pub.track.sid)
                     || fallback || '');
      } catch (e) { return String(fallback || ''); }
  }

  function rxPct(cur, prev, a, b) {
      //: доля a от (a+b) ЗА ОКНО. Накопленный процент за час отвечает на другой вопрос:
      //: одна плохая минута в начале не должна красить весь остаток.
      var da = Math.max(0, (cur[a] || 0) - (prev[a] || 0));
      var db = Math.max(0, (cur[b] || 0) - (prev[b] || 0));
      return (da + db) ? (100 * da / (da + db)) : 0;
  }

  async function rxOnce() {
      //: -> {bad, why, quiet, rows, peers}. Мерит ВХОДЯЩИЕ дорожки: что дошло ДО МЕНЯ.
      //: `rows` - готовые строки админской карточки («от кого именно приходит плохо»),
      //: и считаются они ТЕМ ЖЕ проходом: второй обход тех же дорожек отвечал бы на тот
      //: же вопрос своей арифметикой (закон №40).
      if (!room || !connected) return null;
      var ps = [];
      room.remoteParticipants.forEach(function (p) { ps.push(p); });
      var rows = [], why = [], worst = '', bad = false, heard = 0, audios = 0;
      for (var i = 0; i < ps.length; i++) {
          var p = ps[i], pubs = [];
          var m = p.trackPublications || p.tracks;
          if (m && m.forEach) m.forEach(function (pub) { pubs.push(pub); });
          //: ИМЯ БЕРЁМ ИЗ СПИСКА КОМНАТЫ, А НЕ У `nameOf`: та живёт в области видимости
          //: `go()`, и модульная функция её не видит - вышло бы «nameOf is not a
          //: function» на первом же тике, то есть строки связи не было бы НИ РАЗУ.
          var nm = (people[p.identity] && people[p.identity].name)
                || human(p.name, p.identity);
          var sum = null;         //: сводка участника для админской строки
          for (var k = 0; k < pubs.length; k++) {
              // ═══ КАЖДАЯ ДОРОЖКА, А НЕ ПЕРВАЯ ПОПАВШАЯСЯ ═══
              // Прежний цикл делал `break` на первой, у которой нашлась статистика.
              // У участника их две, и порядок нам не принадлежит: попадись первой
              // видео - звук не мерился ВООБЩЕ, а строка выглядела полной.
              var pub = pubs[k], t = pub && pub.track;
              if (!t || typeof t.getRTCStatsReport !== 'function') continue;
              var isAudio = String(pub.kind || t.kind || '').indexOf('audio') >= 0;
              if (isAudio) audios++;
              var rep = null;
              try { rep = await t.getRTCStatsReport(); } catch (e) { rep = null; }
              if (!rep || !rep.forEach) continue;
              var cur = null, rtt = 0;
              rep.forEach(function (st) {
                  //: ═══ RTT БЕРЁТСЯ У ПАРЫ КАНДИДАТОВ, И ЗДЕСЬ ЭТО ЕДИНСТВЕННЫЙ ГОДНЫЙ
                  //: ИСТОЧНИК ═══ `remote-inbound-rtp` - это отчёт ДАЛЬНЕЙ стороны о том,
                  //: что ОНА приняла от МЕНЯ, то есть про мою ОТПРАВКУ; у двери, которая
                  //: мерит ПРИЁМ, ему делать нечего. Прежний второй проход брал максимум
                  //: из двух, но в отчёте ПРИЁМНИКА второго не бывает вовсе - строка была
                  //: мёртвой и создавала впечатление, что источников у нас два.
                  if (st.type === 'candidate-pair' && st.currentRoundTripTime) {
                      rtt = Math.max(rtt, Number(st.currentRoundTripTime) * 1000);
                      return;
                  }
                  if (st.type !== 'inbound-rtp') return;
                  cur = {
                      lost: Number(st.packetsLost || 0),
                      recv: Number(st.packetsReceived || 0),
                      conceal: Number(st.concealedSamples || 0),
                      samples: Number(st.totalSamplesReceived || 0),
                      jbuf: Number(st.jitterBufferDelay || 0),
                      jemit: Number(st.jitterBufferEmittedCount || 0),
                      lvl: Number(st.audioLevel || 0),
                      jit: Number(st.jitter || 0) * 1000,
                  };
              });
              if (!cur) continue;
              var sid = pubSid(pub, p.identity + ':' + k);
              var prev = rxPrev[sid] || {};
              rxPrev[sid] = cur;
              //: ═══ ПЕРВОЕ ОКНО СЧИТАЕТСЯ ОТ ПОДПИСКИ, А НЕ ПРОПУСКАЕТСЯ ═══
              //: Счётчики дорожки начинаются с нуля в момент подписки, значит доля за
              //: «первое окно» - это доля С МОМЕНТА ПОДПИСКИ: то же окно, просто другой
              //: длины. Пропуск стоил двух живых дефектов сразу. (1) `heard` считается
              //: НИЖЕ пропуска, а `audios` выше - поэтому на первом же наблюдении новой
              //: звуковой дорожки выходило `audios>0, heard=0`, то есть «Ты никого не
              //: слышишь» КАЖДОМУ, кто зашёл в комнату к людям (в разговоре на двоих -
              //: всегда, `ParticipantConnected` заводит тик через 1.2 с). (2) Админская
              //: строка появлялась только со второго тика, то есть через десять секунд
              //: пустоты, которую человек читает как «статистики нет».
              var loss = rxPct(cur, prev, 'lost', 'recv');
              //: СВОДКА УЧАСТНИКА - ПО ЗВУКОВОЙ ДОРОЖКЕ, ЕСЛИ ОНА ЕСТЬ: комната
              //: голосовая, и «у кого плохо со связью» это в первую очередь про голос.
              //: Прежний второй проход брал ПЕРВУЮ попавшуюся дорожку, а порядок нам не
              //: принадлежит - половину времени он отвечал про видео.
              if (isAudio || !sum) sum = { loss: loss, jit: cur.jit, rtt: rtt };
              if (!isAudio) {
                  if (loss > RX_LOST_BAD) {
                      bad = true;
                      why.push(nm + ' (видео): ' + loss.toFixed(1) + '% потерь');
                  }
                  continue;
              }
              // ДОЛЯ ДОРИСОВАННОГО: вот это и есть «рвётся».
              var conceal = rxPct(cur, prev, 'conceal', 'samples');
              //: `jitterBufferDelay` - НАКОПЛЕННАЯ сумма в секундах, а не «текущая
              //: задержка». Среднее по окну = прирост суммы / прирост числа кадров.
              var dj = Math.max(0, cur.jbuf - (prev.jbuf || 0));
              var de = Math.max(0, cur.jemit - (prev.jemit || 0));
              var jms = de ? (1000 * dj / de) : 0;
              if (cur.samples > (prev.samples || 0)) heard++;
              //: ДОЛЯ ДОРИСОВАННОГО ЗАПОМИНАЕТСЯ ПО ДОРОЖКЕ: буфер воспроизведения
              //: просится у КОНКРЕТНОЙ дорожки, и решать за неё по общему вердикту
              //: комнаты значило бы трогать соседей, у которых всё в порядке.
              rxCon[sid] = conceal;
              //: ОЦЕНКА СЧИТАЕТСЯ ЗДЕСЬ, ПОТОМУ ЧТО ЗДЕСЬ ЛЕЖАТ ВСЕ ТРИ ЕЁ ВХОДА:
              //: потери за окно, средняя задержка буфера за окно и RTT пары кандидатов.
              //: Второе место, где их пришлось бы собирать заново, разошлось бы с этим.
              if (sum) sum.mos = rxMos(loss, jms, rtt);
              var mine = [];
              if (loss > RX_LOST_BAD) mine.push(loss.toFixed(1) + '% потерь');
              if (conceal > RX_CONCEAL_BAD) mine.push('дорисовано ' + conceal.toFixed(1) + '%');
              if (jms > RX_JBUF_BAD) mine.push('буфер ' + Math.round(jms) + ' мс');
              //: ═══ ОЦЕНКА ВХОДИТ В ТОТ ЖЕ ВЕРДИКТ, А НЕ ЖИВЁТ ОТДЕЛЬНОЙ СТРОКОЙ ═══
              //: Она ловит РОВНО те случаи, которых не видят три порога выше (буфер и
              //: RTT по отдельности терпимы, вместе - нет), и действие у неё то же:
              //: сказать человеку и убавить видео, чтобы полоса досталась голосу.
              //: Отдельная строка была бы вторым механизмом на то же последствие.
              if (sum && sum.mos > 0 && sum.mos < MOS_BAD) {
                  mine.push('качество ' + sum.mos.toFixed(1) + ' из 5');
              }
              if (mine.length) { bad = true; why.push(nm + ': ' + mine.join(', ')); }
              if (conceal > RX_CONCEAL_BAD && !worst) worst = nm;
          }
          if (sum) rows.push(statFmt(nm, sum));
      }
      // ═══ «МЕНЯ НЕ СЛЫШНО» И «Я НЕ СЛЫШУ» - РАЗНЫЕ БЕДЫ, И ВТОРАЯ ВИДНА ОТСЮДА ═══
      // Все входящие звуковые дорожки без прироста сэмплов при живых соседях означают,
      // что до меня не доходит НИЧЕЙ звук. Это не требует жалобы человека - это факт.
      var quiet = (audios > 0 && heard === 0);
      rxLast = { bad: bad, why: why.join(' · '), quiet: quiet, at: Date.now(),
                 worst: worst, rows: rows, peers: ps.length };
      try { window.__RX = rxLast; } catch (e) {}
      return rxLast;
  }

  // ═════════ БУФЕР ВОСПРОИЗВЕДЕНИЯ: ПРОСИМ БОЛЬШЕ, КОГДА ЗВУК РВЁТСЯ ═════════
  // `concealedSamples` - это сэмплы, которых не пришло вовремя и которые кодек дорисовал.
  // Лечится это ровно одним: дать плееру подождать подольше, то есть поднять нижнюю
  // границу буфера. У получателя такая ручка есть - `playoutDelayHint` (у livekit-client
  // это `RemoteTrack.setPlayoutDelay` в секундах).
  //
  // ЦЕНА НАЗВАНА, А НЕ ЗАМОЛЧАНА: буфер входит в задержку разговора (`delay = 20 + буфер
  // + RTT/2` в оценке выше), то есть мы меняем «рвётся» на «отвечает позже». Поэтому
  // потолок мал и посчитан: +100 мс сверх браузерного буфера оставляют задержку в районе
  // 200-250 мс, где оценка ещё 3.8-4.1; порог 3.5 она пробивает около 310 мс, и лечение
  // не имеет права само загнать человека за него.
  //
  // ШАГ 50 мс - ЭТО ДВА КАДРА OPUS (по 20 мс) с запасом, а не круглое число: буфер
  // отдаёт звук кадрами, и просить долю кадра бессмысленно.
  var PLAY_STEP = 0.05;       // на сколько поднимаем за один плохой замер, секунды
  var PLAY_MAX = 0.10;        // потолок нашей добавки (число из ТЗ: +50-100 мс)
  // ОБРАТНЫЙ ПУТЬ НЕ СРАЗУ, И ПРИЧИНА НЕ В ОСТОРОЖНОСТИ: чистое окно после подъёма -
  // это результат НАШЕГО ЖЕ действия, а не признак того, что сеть починилась. Снимай мы
  // добавку на первом же чистом окне, лечение отменяло бы себя ровно в тот момент, когда
  // оно сработало, и человек получил бы пилу «рвётся - не рвётся» каждые двадцать секунд.
  var PLAY_CALM = 3;          // столько чистых окон подряд, прежде чем опустить
  var rxCon = {};             // sid -> доля дорисованного за последнее окно
  var rxPlay = {};            // sid -> {want: секунды нашей добавки, calm: чистых окон}
  var rxPlaySaid = false;     // сказали ли уже, что клиент такой ручки не имеет

  function rxPlayout() {
      //: -> сколько дорожек тронули. Зовётся ПОСЛЕ замера: решение принимает `rxCon`.
      if (!room) return 0;
      return rxEachRemotePub('audio', function (pub, sid) {
          var t = pub && pub.track;
          if (!t || typeof t.setPlayoutDelay !== 'function') return false;
          var con = rxCon[sid];
          if (con === undefined) return false;         //: этой дорожки замер не видел
          var st = rxPlay[sid] || { want: 0, calm: 0 };
          var was = st.want;
          if (con > RX_CONCEAL_BAD) {
              st.calm = 0;
              st.want = Math.min(PLAY_MAX, st.want + PLAY_STEP);
          } else if (st.want > 0) {
              st.calm++;
              if (st.calm >= PLAY_CALM) { st.want = 0; st.calm = 0; }
          }
          rxPlay[sid] = st;
          if (st.want === was) return false;
          try { t.setPlayoutDelay(st.want); } catch (e) { return false; }
          //: ═══ ПЕРЕЧИТЫВАЕМ, А НЕ ВЕРИМ ВЫЗОВУ (закон №35) ═══
          //: `setPlayoutDelay` у SDK молча ничего не делает, когда у приёмника нет поля
          //: `playoutDelayHint` (часть сборок Safari) - он лишь пишет предупреждение в
          //: свою консоль. «Позвали» и «применилось» тут разные вещи, и вторая читается
          //: обратным вызовом. Чего перечитывание НЕ доказывает - что браузер правда
          //: подержит звук дольше: это видно окном позже, приростом `jitterBufferDelay`.
          var got = null;
          try { got = t.getPlayoutDelay(); } catch (e) { got = null; }
          if (got === undefined || got === null) {
              if (!rxPlaySaid) {
                  rxPlaySaid = true;
                  console.warn('[rx] буфер воспроизведения: у этого клиента ручки нет - '
                             + 'дорисованный звук лечить нечем');
              }
              rxPlay[sid] = { want: 0, calm: 0 };       //: не копим то, чего не приняли
              return false;
          }
          console.log('[rx] буфер ' + sid + ': ' + Math.round(was * 1000) + ' -> '
                    + Math.round(got * 1000) + ' мс (дорисовано ' + con.toFixed(1) + '%)');
          return true;
      });
  }

  // ═════════ СВОЙ БИТРЕЙТ ВНИЗ, КОГДА НАС ПЛОХО СЛЫШАТ ═════════
  // ЧЕСТНЫЙ ВЕРДИКТ ПО FEC, И ОН ИЗМЕРЕН, А НЕ ВСПОМНЕН (закон №48). Живой offer
