    // как «ползунок не работает». Тот же класс, что подпись кнопки записи, которая
    // зависела от порядка строк, а не от состояния.
    room.on(LK.RoomEvent.ParticipantConnected, function (p) {
      upsert(p.identity, { name: human(p.name, p.identity) });
      // КОТ ЗАМЕЧАЕТ ВОШЕДШЕГО. Ничего не сообщает сверх того, что и так видно в списке,
      // - это характер, а не индикатор, и потому его можно выключить.
      try { if (window.catDo) window.catDo('hop'); } catch (e) {}
      // ПРИШЁЛ ЧЕЛОВЕК - МЕРЯЕМ ЕГО СВЯЗЬ, НЕ ДОЖИДАЯСЬ ОКНА: именно в этот момент
      // спрашивают «а его хорошо слышно?», и ответ через десять секунд опаздывает.
      setTimeout(statTick, 1200);
    });
    room.on(LK.RoomEvent.ParticipantDisconnected, function (p) {
      if (isDj(p)) dropDj();
      delete people[p.identity]; draw();
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, function (track, _pub2, p2) {
      if (track.kind === 'audio') {
        // РАДИО ВЫКЛЮЧИЛИ - ПОЛЗУНОК УХОДИТ ВМЕСТЕ С НИМ. Регулятор громкости того, чего
        // не играет, читается как «сломано»: человек двигает его и ничего не происходит.
        // ОТПИСКА ОДНОЙ ДОРОЖКИ - НЕ «ВЫКЛЮЧИЛИ РАДИО». При смене станции старая и новая
        // живут внахлёст, и `dropDj()` здесь снёс бы ТОЛЬКО ЧТО ПРИШЕДШУЮ: радио умирало
        // бы на каждом переключении (поймано браузерной пробой на моей же правке).
        // Снимаем ровно эту дорожку; ползунок убираем, только если радио не осталось
        // ВОВСЕ - выключение целиком приезжает признаком комнаты, а не отпиской.
        detachTrack(track);
        if (track === djTrack) djTrack = null;
        if (isDj(p2) && !Object.keys(djSids).length) { djTrack = null; showDjVol(false); }
        return;
      }
      // ОТПИСКА ОТ ВИДЕО РАЗБИРАЕТСЯ НИЖЕ И РАЗБИРАЛАСЬ ВСЕГДА. Я успел вписать сюда
      // ВТОРУЮ такую же ветку, прочитав только голову обработчика, - и поймала это
      // ПОДСАДКА, а не чтение: дубль на живом коде невидим, а читателю врёт.
      // НАСТОЯЩАЯ НЕДОСТАЧА БЫЛА У ДРУГОГО ПРИЗНАКА - `TrackMuted`: часть клиентов не
      // отписывает дорожку, а глушит её, и вот ТАМ окно оставалось чёрным.
      if (track.kind !== 'video') return;
      // ЧУЖОЕ ВИДЕО УБИРАЕТСЯ, КОГДА ЕГО ПЕРЕСТАЛИ ДАВАТЬ. Оставленный чёрный
      // прямоугольник читается как «зависло».
      dropVideo(track);
    });
    // ═══ СВОЁ ВИДЕО ЧЕЛОВЕК ОБЯЗАН ВИДЕТЬ ТОЖЕ ═══
    // ЖИВОЙ ОТЗЫВ REN: показывающий не видит, ЧТО именно уходит соседям, - ту вкладку или
    // весь экран, попал ли в кадр. Спросить об этом можно только у них, то есть посреди
    // разговора. Своя картинка идёт ТОЙ ЖЕ дверью, что чужая (закон №40), и помечена
    // словом «Ты»: две копии «как показать видео» разошлись бы на первой правке.
    room.on(LK.RoomEvent.LocalTrackPublished, function (pub) {
      var t = pub && pub.track;
      // ИМЯ СВОЕГО ОКНА СОСТАВЛЯЕТ ДВЕРЬ, А НЕ ВЫЗЫВАЮЩИЙ. Передавали 'Ты' строкой - и
      // пометка держалась на ТЕКСТЕ от вызывающего, а не на признаке «моё»: подсадка
      // «своё окно без подписи» проходила МОЛЧА, потому что строка приезжала снаружи.
      if (t && t.kind === 'video') addVideo(t, '', true);
      // ═══ ПРИОРИТЕТЫ СТАВЯТСЯ ПОСЛЕ КАЖДОЙ ПУБЛИКАЦИИ, А НЕ ОДИН РАЗ ПРИ ВХОДЕ ═══
      // Отправитель появляется ВМЕСТЕ с дорожкой: поставь мы приоритет только на старте,
      // включённая позже камера уехала бы с чужим умолчанием - то есть ровно в том
      // случае, ради которого всё и делается (камера + показ у Максима).
      tunePriorities().catch(function () {});
    });
    room.on(LK.RoomEvent.LocalTrackUnpublished, function (pub) {
      if (pub && pub.track) dropVideo(pub.track);
      // СОБЫТИЕ МОЖЕТ ПРИЙТИ С УЖЕ ОБНУЛЁННОЙ ССЫЛКОЙ - тогда строка выше не находит
      // ничего. Подметаем по факту: окно над мёртвой дорожкой не нужно никому.
      sweepVideos();
    });
    room.on(LK.RoomEvent.TrackSubscribed, function (track, _pub, p) {
      if (track.kind === 'video') {
        // СМОТРЕТЬ ЧУЖОЙ ЭКРАН УМЕЮТ ВСЕ, ВКЛЮЧАЯ МОБИЛЬНЫЕ: это обычное входящее видео.
        // Ограничение касается только ОТДАЧИ - там у мобильных браузеров нет самого API.
        addVideo(track, (p ? nameOf(p) : 'Участник'), false, p && p.identity);
        say((p && p.name ? p.name : 'Участник') + ' показывает экран.');
        return;
      }
      if (track.kind === 'audio') {
        // ЗВУК ИГРАЕТ ЭЛЕМЕНТОМ, КОТОРЫЙ МЫ ДЕРЖИМ САМИ: на iOS элемент, не привязанный к
        // DOM, браузер вправе выгрузить, и участник замолкает без единой ошибки.
        attachTrack(track, isDj(p));
        // ═══ РАДИО ИГРАЕТ ФОНОМ, А НЕ ВРОВЕНЬ С ГОЛОСАМИ ═══
        // Живой прогон Ren: «мы делали радио, чтобы играло ФОНОМ под разговор - тихо».
        // Громкость КЛИЕНТСКАЯ и у каждого своя: серверной ручки «сделай этому участнику
        // тише» у LiveKit нет, да она и не нужна - одному фон мешает, другому нет.
        // СТАВИТСЯ СРАЗУ ПРИ ПОДПИСКЕ, А НЕ ПОСЛЕ ПЕРВОГО ДВИЖЕНИЯ ПОЛЗУНКА: иначе первые
        // секунды радио бьёт по ушам, и человек лезет искать регулятор уже раздражённым.
        if (isDj(p)) { djTrack = track; applyDjVolume(); showDjVol(true); }
        //: ВОТ ТОТ САМЫЙ МОМЕНТ, РАДИ КОТОРОГО ВСЁ И ПИШЕТСЯ: дорожка соседа приехала.
        //: Если она пришла РАНЬШЕ первого касания, браузер её не проиграет, и без этой
        //: строки человек об этом не узнает НИКОГДА.
        soundCheck();
      }
    });
    //: СОБЫТИЕ SDK - ЕДИНСТВЕННЫЙ ИСТОЧНИК, КОТОРЫЙ ЗНАЕТ О СМЕНЕ БЕЗ ОПРОСА. Полагаться
    //: только на проверку при подписке нельзя: браузер снимает и НАКЛАДЫВАЕТ запрет и в
    //: другие моменты (смена вкладки, политика сайта, возврат из фона).
    if (LK.RoomEvent.AudioPlaybackStatusChanged) {
      room.on(LK.RoomEvent.AudioPlaybackStatusChanged, function () { soundCheck(); });
    }
    room.on(LK.RoomEvent.ActiveSpeakersChanged, function (spk) {
      var now = {};
      spk.forEach(function (p) { now[p.identity] = true; });
      Object.keys(people).forEach(function (id) { people[id].speaking = !!now[id]; });
      // ЗАГОВОРИЛИ - КОТ ПРОСЫПАЕТСЯ. Дремота это признак ТИШИНЫ, и держать её при живом
      // разговоре значило бы врать картинкой.
      if (spk && spk.length) { try { if (window.catAwake) window.catAwake(); } catch (e) {} }
      draw();
      // «КРУПНО» СЛЕДУЕТ ЗА ГОВОРЯЩИМ, ИНАЧЕ ЭТО ПРОСТО «БОЛЬШИМ ПЕРВЫЙ ВОШЕДШИЙ».
      layPaint();
    });
    // ═══ ИНДИКАТОР ЗАПИСИ - ИЗ МЕТАДАННЫХ КОМНАТЫ, А НЕ ИЗ РАССЫЛКИ ПО КАНАЛУ ДАННЫХ ═══
    // Рассылку не услышит тот, кто зашёл ПОЗЖЕ, то есть индикатор молчал бы ровно тому,
    // кого он должен предупредить. Метаданные LiveKit отдаёт каждому при входе и шлёт
    // всем при смене - это состояние комнаты, а не чьё-то сообщение.
    room.on(LK.RoomEvent.RoomMetadataChanged, function (m) { showRec(m); });
    // ЗАГЛУШЕННАЯ КАМЕРА - ВТОРОЙ СПОСОБ ЕЁ ВЫКЛЮЧИТЬ, И КАРТИНКИ ПОСЛЕ НЕГО НЕТ ТОЖЕ.
    // Часть клиентов не отписывает дорожку, а помечает её `muted`: подписка жива,
    // кадры не идут, и окно остаётся ровно таким же чёрным. Признак `muted` у нас
    // уже приезжал - им помечали ЧЕЛОВЕКА в списке и не трогали его ОКНО.
    room.on(LK.RoomEvent.TrackMuted, function (_pub, p) {
      if (p) upsert(p.identity, { muted: true });
      var _t = _pub && _pub.track;
      if (_t && _t.kind === 'video') dropVideo(_t);
    });
    room.on(LK.RoomEvent.TrackUnmuted, function (_pub, p) {
      if (p) upsert(p.identity, { muted: false });
      var _t = _pub && _pub.track;
      // ВЕРНУЛ КАМЕРУ - ВЕРНУЛОСЬ И ОКНО. Без этой половины «выключил» работало бы, а
      // «включил обратно» молча не показывало ничего (закон №55).
      if (_t && _t.kind === 'video') {
        addVideo(_t, p ? nameOf(p) : 'Участник', false, p && p.identity);
      }
    });
    room.on(LK.RoomEvent.Disconnected, function (reason) {
      connected = false;
      sub('Отключился');
      say('Соединение закрыто' + (reason ? ' (' + reason + ')' : '') + '.');
    });
    // ПЕРЕПОДКЛЮЧЕНИЕ НАЗЫВАЕТСЯ ВСЛУХ: молчащая комната и комната, которая сейчас
    // вернётся, для человека выглядят одинаково, а ждать стоит только во второй.
    room.on(LK.RoomEvent.Reconnecting, function () { say('Связь прервалась, возвращаюсь…'); });
    room.on(LK.RoomEvent.Reconnected, function () { say(''); });

    stage('подключение к комнате');
    try {
      await room.connect(j.url, j.token);
      // ФЛАГИ ПЕРЕДАЮТСЯ ЯВНО, А НЕ ТОЛЬКО ЧЕРЕЗ УМОЛЧАНИЯ КОМНАТЫ. Умолчания SDK
      // мержит со своими, и «мы же попросили в конструкторе» - это рассуждение, а не
      // гарантия: у аргумента приоритет выше, и он снимает вопрос целиком.
      stage('включение микрофона');
      // ═══ ПОСЛЕ RELOAD В WEBVIEW `getUserMedia` МОЖЕТ НЕ ВЕРНУТЬСЯ ВОВСЕ ═══
      // Факт, а не догадка: сторож загрузки назвал СТАДИЮ - «включение микрофона», при
      // том что соединение уже `connected`, а подпись Telegram на месте (живой прогон
      // 29.08, «Перезагрузить» в меню Telegram). У этого вызова нет своего потолка, и
      // страница оставалась на «Подключаюсь…» НАВСЕГДА.
      // ВХОД БЕЗ МИКРОФОНА ЛУЧШЕ, ЧЕМ НЕ ВХОД: человек попадает в комнату, слышит всех, и
      // ему СКАЗАНО, чем это лечится. Микрофон не отменён - его включает та же кнопка,
      // что и всегда, и включение идёт уже по жесту человека (а жест как раз и есть то,
      // чего вебвью ждал). Молча войти немым нельзя: он будет говорить в пустоту.
      // ═══ ЭТА ПУБЛИКАЦИЯ ЗАНИМАЕТ ОЧЕРЕДЬ, ДАЖЕ КОГДА МЫ ПЕРЕСТАЛИ ЕЁ ЖДАТЬ ═══
      // ЖИВОЙ ОТКАЗ Ren 31.08: показ экрана не работает при ПЕРВОМ заходе, без всякой
      // камеры, и заводится после перезахода. Камера действительно ни при чём - дело в
      // МИКРОФОНЕ, который включается здесь автоматически.
      // МЕХАНИЗМ: у livekit-client публикация сериализуется НА УЧАСТНИКА
      // (`setTrackEnabled` первым делом ждёт `republishPromise`), а `Promise.race` ниже
      // отменяет только НАШЕ ОЖИДАНИЕ - сама операция внутри SDK продолжается. На первом
      // заходе она долгая (запрос разрешения у человека) или висит вовсе; на втором
      // разрешение уже выдано, микрофон встаёт мгновенно, очередь пуста - и показ
      // работает. Это тот же класс, что мы уже дважды чинили у показа экрана.
      // `PUB_BUSY` ДО ЭТОЙ ПРАВКИ ЕГО НЕ ВИДЕЛ: он ставился ТОЛЬКО в обработчике кнопки
      // нижней полосы, то есть охранял наши собственные тапы и не знал про автозапуск.
      // Человек получал ТИШИНУ вместо честного «дождись микрофона».
      PUB_BUSY = 'Микрофон';
      var _micPub = room.localParticipant.setMicrophoneEnabled(true, AUDIO_WANT);
      // СНИМАЕМ ПРИЗНАК ПО ФАКТУ, А НЕ ПО ТАЙМЕРУ: операция могла доехать и через минуту,
      // и до этого момента очередь публикаций правда занята.
      _micPub.then(function () {
        if (PUB_BUSY === 'Микрофон') PUB_BUSY = '';
        micOn = true; micPaint();
        say('');
      }, function () {
        if (PUB_BUSY === 'Микрофон') PUB_BUSY = '';
      });
      var micGot = await Promise.race([
        _micPub.then(function () { return 'ok'; }, function (e) { return e; }),
        new Promise(function (ok) { setTimeout(function () { ok('slow'); }, MIC_BOOT_MS); })
      ]);
      if (micGot !== 'ok') {
        micOn = false;
        var _mw = (micGot === 'slow')
          ? ('микрофон не ответил за ' + Math.round(MIC_BOOT_MS / 1000)
             + ' с - так бывает после перезагрузки страницы в Telegram')
          : ('микрофон не дали (' + (micGot && micGot.message || micGot) + ')');
        say('Ты в комнате и всех слышишь, но ' + _mw
            + '. Нажми «🎙 Микрофон» внизу - включится по твоему касанию.'
            + (micGot === 'slow'
               ? ' Пока он не ответит, экран и камера тоже не включатся: клиент делает'
                 + ' публикации по очереди.' : ''), true);
      }
    } catch (e) {
      sub('Не подключился');
      say(lkWhy(e, (j && j.url) || ''), true);
      //: ═══ ОТКАЗ ОБЯЗАН ДАВАТЬ ВЫХОД, А НЕ ТОЛЬКО ДИАГНОЗ (требование Ren) ═══
      //: Человек с текстом ошибки и без единой кнопки может ровно одно - закрыть аппку.
      //: Браузер тут не догадка: комнату он открывает ТЕМ ЖЕ адресом, а вебвью Telegram
      //: у части людей до сигнального порта не доходит (живой отказ у нескольких сразу).
      //: Кнопка ПОКАЗЫВАЕТСЯ ВСЕГДА при отказе подключения, а не только на «not
      //: reachable»: чинить причину человек не может ни в одном из случаев, а попробовать
      //: другую дорогу - может.
      showBrowserWay();
      //: «ЕЩЁ» РАСКРЫВАЕМ САМИ: кнопка живёт в свёрнутой панели, и предложенный выход,
      //: которого не видно, это тот же отсутствующий выход.
      try {
        var _tl = document.getElementById('tools');
        if (_tl && _tl.style.display === 'none') {
          _tl.style.display = '';
          var _mb = document.getElementById('more');
          if (_mb) _mb.classList.add('on');
        }
      } catch (e2) {}
      return;
    }
    connected = true;
    micPaint();                       // подпись кнопки обязана отвечать факту, а не намерению
    // ЗАПИСЬ МОГЛА НАЧАТЬСЯ ДО НАШЕГО ВХОДА, И ЭТО ГЛАВНЫЙ СЛУЧАЙ, РАДИ КОТОРОГО
    // индикатор живёт в метаданных: вошедший позже обязан узнать о записи сразу, а не
    // остаться единственным, кто о ней не знает.
    showRec(room.metadata);
    //: ═══ КНОПКА ЗАВОДИТСЯ СРАЗУ ПОСЛЕ ВХОДА, А НЕ ПРИ ПЕРВОЙ БЕДЕ ═══
    //: Обработчик, повешенный в момент, когда полосу уже показали, - это ещё одна гонка
    //: того же рода. Вешаем один раз здесь; полосой управляет `soundPaint`.
    (function () {
      var b = document.getElementById('sound');
      if (!b) return;
      b.onclick = async function () {
        b.disabled = true;
        try { await soundStart(); } finally { b.disabled = false; }
      };
    })();
    //: И СРАЗУ СПРАШИВАЕМ СОСТОЯНИЕ: в комнате уже может кто-то говорить, и его дорожка
    //: приезжает ВМЕСТЕ с входом - то есть заведомо до любого нашего тапа.
    soundCheck();

    // ═══ ЧТО БРАУЗЕР ПРИМЕНИЛ НА САМОМ ДЕЛЕ ═══
    // Мы ПРОСИМ echoCancellation/noiseSuppression/autoGainControl в audioCaptureDefaults,
    // но просьба и факт - разные вещи: часть клиентов молча игнорирует флаг, а на части

    // собеседницы шёл РОВНЫЙ ГУЛ, с которым встроенное подавление обязано справляться, -
    // значит вопрос не «слабое ли оно», а «включилось ли вообще».
    // getSettings() отдаёт ПРИМЕНЁННЫЕ значения, и печатаем мы их НА СТРАНИЦЕ, а не в
    // консоль: до консоли на телефоне не добраться.
    function micTrack() {
      var pubs = room.localParticipant.trackPublications
              || room.localParticipant.tracks || new Map();
      var out = null;
      pubs.forEach(function (pub) {
        if (String(pub.source || '') !== 'microphone' || !pub.track) return;
        out = pub.track.mediaStreamTrack || null;
      });
      return out;
    }

    // ═══ ЧТО БРАУЗЕР ВООБЩЕ УМЕЕТ ═══
    // ЖИВОЙ ПРОГОН (Ren): «шумодав не сообщает · эхо вкл · громкость не сообщает · 96000 Гц
    // · до браузера дошло не то». Моя прежняя строка обвиняла НАС - будто флаги потерялись
    // по дороге. Но 96000 Гц это чистая улика: конвейер обработки Chrome работает на 48
    // кГц, и родная частота устройства означает, что обработки НЕТ ВОВСЕ. А `getSettings()`
    // молчит про noiseSuppression ровно тогда, когда браузер такого флага НЕ ЗНАЕТ (так
    // ведёт себя Safari: у него из трёх есть только echoCancellation).
    // ЗНАЧИТ ИСХОДОВ ТРИ, А НЕ ДВА, И ПУТАТЬ ИХ НЕЛЬЗЯ: «браузер не умеет» (лечится только
    // своим шумодавом, встроенного там нет в принципе), «умеет, но до него не дошло» (это
    // НАШ баг) и «дошло, но выключено» (чиним на месте). Одна фраза на три случая - ровно
    // та подмена причины, из-за которой мы уже теряли круги.
    function canDo(k) {

          ? navigator.mediaDevices.getSupportedConstraints() : null;
        // НЕ СПРОСИТЬ - НЕ ЗНАЧИТ «НЕ УМЕЕТ». Отсутствие самого метода это отдельный
        // случай, и объявлять по нему браузер неумелым было бы выдумкой.
        return sup ? !!sup[k] : null;
      } catch (e) { return null; }
    }

    function flagLine(o) {
      var f = function (k) {
        if (k in o) return o[k] ? 'вкл' : 'ВЫКЛ';
        // ОТСУТСТВИЕ ПОЛЯ РАЗБИРАЕТСЯ ДО КОНЦА, а не сваливается в «не сообщает»: браузер,
        // который такого флага не знает, и браузер, который знает и молчит, - разные миры.
        var c = canDo(k);
        return c === false ? 'НЕ УМЕЕТ' : 'не сообщает';
      };
      // ═══ ГЛАВНОЕ - КТО ДАВИТ ШУМ ПРЯМО СЕЙЧАС, А НЕ ПЕРЕЧЕНЬ ФЛАГОВ ═══
      // ЖИВОЙ ПРОГОН REN 26.08 (вторая половина): строка раздулась и повторяла одно и то же
      // трижды - «встроенный шумодав НЕ УМЕЕТ», потом «браузер НЕ УМЕЕТ: noiseSuppression»,
      // потом «встроенного подавления тут нет». Три формулировки одного факта не добавляют
      // ничего, кроме длины, и в них теряется ответ на единственный вопрос: слышно ли меня
      // нормально. Отсюда правило: СУТЬ ОДНОЙ СТРОКОЙ, подробности - только когда что-то
      // не работает.
      // ИМЯ ТОГО, КТО РАБОТАЕТ, А НЕ СПИСОК ТОГО, ЧЕГО НЕТ: «шумодав: RNNoise» отвечает
      // сразу и на «есть ли он», и на «чей он».
      var _ns = RNN_ON ? 'RNNoise' : f('noiseSuppression');
      return 'шумодав: ' + _ns + ' · эхо ' + f('echoCancellation')
        + ' · ' + (o.sampleRate ? Math.round(o.sampleRate / 1000) + ' кГц' : '? кГц');
    }

    // ═══ НАШ ШУМОДАВ - СВОЯ СТРОКА, И ОНА ПЕРЕРИСОВЫВАЕТСЯ ПО ТАПУ ═══
    // Состояние браузера меряется один раз при захвате, а наш RNNoise человек включает и
    // выключает - значит строка обязана следовать за ним, иначе она отвечает на вчерашний
    // вопрос. Текст храним отдельно от браузерной части: смешав их в одну строку, мы
    // получили бы то же самое, только длиннее.
    // ХРАНИМ ИСХОДНЫЕ НАСТРОЙКИ, А НЕ ГОТОВУЮ СТРОКУ. Строка зависит от `RNN_ON` (кто
    // именно давит шум), а он меняется по кнопке - сохранённый текст отвечал бы на
    // вчерашний вопрос, и мы получили бы ровно ту поломку, которую чиним.
    var AUDIO_GOT = null;
    var AUDIO_TXT = '';

    // ВТОРАЯ СТРОКА - ТОЛЬКО КОГДА ЕСТЬ ЧТО СКАЗАТЬ. Совет уйти в обычный браузер нужен,
    // ПОКА наш шумодав выключен; после включения он предлагает лечить то, что уже вылечено
    // (замечание Ren). Подробности про флаги - тоже только при поломке.
    var AUDIO_HINT = '';
    //: ПЕРЕГРУЗ ЖИВЁТ ОТДЕЛЬНОЙ СТРОКОЙ И НЕ ГАСНЕТ ВМЕСТЕ С ШУМОДАВОМ. Остальные
    //: подробности при живом RNNoise прячутся (они про встроенное подавление, которое мы
    //: сами и выключили), а хрип - про ЗАХВАТ: он остаётся при любом шумодаве, и молчать
    //: о нём именно тогда, когда человек включил обработку, значит соврать умолчанием.
    var AUDIO_CLIP = '';

    function paintAudio() {
      var box = $('audiodbg');
      if (!box) return;
      if (AUDIO_GOT) AUDIO_TXT = flagLine(AUDIO_GOT);
      var rest = [];
      if (!RNN_ON && AUDIO_HINT) rest.push(AUDIO_HINT);
      if (AUDIO_CLIP) rest.push(AUDIO_CLIP);
      //: ПОЧЕМУ ХЛОПКИ СИНТЕЗОМ - ВИДНО ЗДЕСЬ, А НЕ В КОНСОЛИ. На телефоне до консоли не
      //: добраться (это уже записано про сам этот блок), и три круга живых прогонов ушли
      //: на «файлы лежат, а играет синтез» именно потому, что причина никуда не выводилась.
      //: Строка появляется ТОЛЬКО когда что-то пошло не так: у работающих файлов её нет.
      if (SND_DIAG) rest.push('звуки реакций: ' + SND_DIAG);
      box.textContent = AUDIO_TXT + (rest.length ? '\n' + rest.join(' · ') : '');
    }
    //: КРЮЧОК НАРУЖУ: `sndSay` живёт на верхнем уровне (звуки нужны и до подключения), а
    //: `paintAudio` - внутри `go()`. Прямой вызов был бы пятым случаем «объявлено внутри,
    //: зовётся снаружи», на котором мы уже четырежды теряли полстраницы `ReferenceError`.
    window.__paintAudio = paintAudio;

    //: СКОЛЬКО РАЗ ЖДЁМ МИКРОФОН. Публикация идёт своим темпом (разрешение, устройство,
    //: сеть), и на 800 мс её может ещё не быть. Раньше это стоило одной строки в
    //: диагностике, теперь - ВСЕЙ машинки: авто-включение и наблюдатель фона живут за
    //: этим же входом, и молчаливый ранний возврат означал бы, что шумодав не заводится
    //: НИКОГДА, а в интерфейсе про это ни слова.
    var AUDIO_TRIES = 12;

    async function audioFacts() {
      var box = $('audiodbg');
      try {
        var ms = micTrack();
        if (!ms) {
          box.textContent = 'микрофон ещё не опубликован';
          if (AUDIO_TRIES-- > 0) { setTimeout(audioFacts, 700); return; }
          // ЖДАЛИ ДЕСЯТЬ СЕКУНД И НЕ ДОЖДАЛИСЬ - ЭТО УЖЕ НЕ «ПОДОЖДИ», А ФАКТ.
          box.textContent = 'микрофон так и не опубликовался - шумодава и замера фона не '
            + 'будет. Проверь разрешение на микрофон.';
          return;
        }

        // ═══ ЧТО МЫ ПОПРОСИЛИ У БРАУЗЕРА НА САМОМ ДЕЛЕ ═══
        // getConstraints() отдаёт то, с чем дорожка реально захвачена, AUDIO_WANT - то,
        // что мы просили. Расходятся ПРИ ПОДДЕРЖИВАЕМОМ флаге - значит между нами и
        // браузером кто-то вмешался, и это НАШ баг. Расходятся при неподдерживаемом -
        // это свойство браузера, и кричать тут не о чем.
        var asked = {};
        try { asked = (ms.getConstraints && ms.getConstraints()) || {}; } catch (e) {}
        var lost = [], cant = [];
        // СВЕРЯЕМСЯ С ТЕМ, ЧЕГО ХОТИМ СЕЙЧАС, А НЕ С ЗАХВАТНЫМ УМОЛЧАНИЕМ. При живом
        // RNNoise мы САМИ просим `noiseSuppression=false` (один подавитель за раз), и
        // сверка с `AUDIO_WANT` кричала бы «НАШ БАГ» на собственном верном решении.
        var _want = audioWant();
        AUDIO_MUST.forEach(function (k) {
          var sup = canDo(k);
          if (sup === false) { cant.push(k); return; }
          if (!(k in asked)) { if (sup) lost.push(k + ': не дошло'); return; }
          var v = (asked[k] && typeof asked[k] === 'object') ? asked[k].ideal : asked[k];
          if (v !== _want[k]) lost.push(k + ': просили ' + _want[k] + ', ушло ' + v);
        });

        var got = (ms.getSettings && ms.getSettings()) || {};
        // ═══ ПРИМЕНИЛОСЬ НЕ ТО - ЧИНИМ, А НЕ КОНСТАТИРУЕМ ═══
        // Живой случай (Ren): ровный гул, с которым встроенное подавление обязано
        // справляться. Значит вопрос был не «слабое ли оно», а «включилось ли вообще»;
        // если браузер сказал ВЫКЛ, у нас есть ровно один законный ход - попросить ещё
        // раз через applyConstraints и СКАЗАТЬ, помогло ли.
        // ═══ АРУ ЧИНИМ ТЕМ ЖЕ БЕЗОПАСНЫМ ПУТЁМ, ЧТО И ОСТАЛЬНОЕ ═══
        // ЖИВОЙ ЗАМЕР REN: пик амплитуды 1.456 при норме 1.0 - микрофон изредка
        // перегружается, и это болезнь АРУ, а не шумодава. Просить её надо там же, где
        // остальные флаги, и ОДНОЙ дверью: `applyConstraints` на живой дорожке, без
        // единого переиздания публикации (класс Б1).
        var bad = AUDIO_MUST.filter(function (k) {
          return (k in got) && got[k] !== _want[k];
        });
        var fixed = '';
        if (bad.length) {
          var r = await applyAudio(_want);
          got = r.got || got;
          fixed = r.kind === 'ok' ? ' · было не то, включил на ходу'
                : r.kind === 'threw' ? (' · починить не дал: ' + r.why)
                : (' · чинил, НЕ ПОМОГЛО: ' + (r.why || 'браузер промолчал'));
        }

        // ЧАСТОТА И КАНАЛЫ - УЛИКА, А НЕ УКРАШЕНИЕ: конвейер обработки Chrome работает на
        // 48 кГц, и родная частота устройства (96 кГц у внешних карт) означает сырой
        // захват без обработки. Мы sampleRate/channelCount НЕ ЗАДАЁМ НИГДЕ - это видно по
        // AUDIO_WANT, - поэтому цифра говорит о выборе браузера, а не о нашей просьбе.
        // СУТЬ - ПЕРВОЙ СТРОКОЙ И КОРОТКО. Подробности приписываются ТОЛЬКО когда что-то
        // не так: на исправном звуке человеку не нужен перечень применённых флагов.
        AUDIO_GOT = got;
        AUDIO_TXT = flagLine(got);
        AUDIO_HINT = '';
        if (fixed) AUDIO_HINT += fixed.replace(/^ · /, '');
        if (lost.length) {
          AUDIO_HINT += (AUDIO_HINT ? ' · ' : '')
            + '⚠️ НАШ БАГ, не дошло до браузера (' + lost.join('; ') + ')';
        }

        // ═══ КНОПКА ШУМОДАВА - У ВСЕХ, И ЦЕНА НАЗВАНА ═══
        // ПРЕЖДЕ ОНА СТОЯЛА ТОЛЬКО ТАМ, ГДЕ ВСТРОЕННОГО НЕТ, и рассуждение было верным
        // ровно наполовину: браузер и правда делает ту же работу дешевле. Но ЖИВОЙ ЗАМЕР
        // (Ren 27.08) показал случай, где встроенное РАБОТАЕТ и не помогает: шум
        // НЕСТАЦИОНАРНЫЙ (разброс уровня фона 11.5 дБ), 74% энергии в 100-1000 Гц - ровно
        // там, где речь. Человеку с таким фоном второе средство было недоступно вовсе.
        // ЦЕНА СКАЗАНА ПРЯМО, А НЕ СПРЯТАНА: двойная обработка греет телефон и может
        // съесть тихую речь - решает человек, а не мы за него.
        var noNS = canDo('noiseSuppression') === false;
        var rnnBtn = $('rnn');
        if (rnnBtn) {
          rnnBtn.style.display = '';
          rnnBtn.onclick = function () { rnnToggle(); };
          // СОВЕТ ЖИВЁТ ВО ВТОРОЙ СТРОКЕ И ГАСНЕТ, КОГДА RNNoise ВКЛЮЧЁН: предлагать
          // человеку, который уже включил наш шумодав, лечить то же самое - это
          // предлагать лечить вылеченное (замечание Ren).
          if (noNS && !RNN_ON) {
            AUDIO_HINT += (AUDIO_HINT ? ' · ' : '')
              + 'встроенного подавления тут нет: включи «Подавить шум» либо открой '
              + 'комнату в обычном браузере - там оно есть';
          }
        }

        // ═══ ГРОМКОСТЬ НЕ ВЫРАВНИВАЕТСЯ - ЭТО СЛЫШНО, И ПОЧИНИТЬ ЭТО МОЖЕМ НЕ МЫ ═══
        // ЖИВОЙ ЗАМЕР REN: пик амплитуды 1.456 при норме 1.0, то есть микрофон изредка
        // перегружается (1% кадров), и АРУ не работает. Перегрузка случается ДО нас, в
        // цепочке захвата: ни шумодав, ни applyConstraints её не лечат - лечит убавленное
        // усиление в системе. Молчать об этом нельзя: человек слышит хрип и думает на
        // связь, а чинить надо ползунок у себя.
        if (got.autoGainControl === false || canDo('autoGainControl') === false) {
          AUDIO_HINT += (AUDIO_HINT ? ' · ' : '')
            + 'громкость не выравнивается (АРУ выключена): если микрофон перегружается и '
            + 'хрипит, убавь усиление в настройках системы - отсюда это не чинится';
        }
        paintAudio();
        // ЗАМЕР ПЕРЕГРУЗА ИДЁТ ВСЕГДА, А НЕ ТОЛЬКО ПРИ ВЫКЛЮЧЕННОМ ШУМОДАВЕ: хрип живёт в
        // цепочке ЗАХВАТА и от нашей обработки не зависит.
        if (!clipTimer) clipTimer = setInterval(clipTick, NS.CLIP_MS);
        rnnBoot();
      } catch (e) { box.textContent = 'настройки звука не спросить: ' + e; }
    }

    // ═══ ДЕФОЛТЫ РАЗНЫЕ, И РАЗНИЦА НЕ В ВЕЖЛИВОСТИ, А В ЦЕНЕ ОШИБКИ ═══
    // ДЕСКТОП - ВКЛЮЧАЕМ САМИ. Прежнее правило («браузер умеет - берём встроенное») было
    // верным ровно наполовину и ОТМЕНЕНО ЗАМЕРОМ, а не вкусом: живой сэмпл (Ren 27.08)
    // дал разброс уровня фона 11.5 дБ и 74% его энергии в полосе речи - шум
    // НЕСТАЦИОНАРНЫЙ, и встроенное подавление, рассчитанное на ровный, его не берёт.
    // Человек при этом фонит и НЕ ЗНАЕТ ОБ ЭТОМ: слышат его соседи. Кнопка, до которой
    // надо догадаться дойти, такую задачу не решает.
    // МОБИЛА - НЕ ВКЛЮЧАЕМ. Там цена в процессоре заметна, а сторож может и опоздать:
    // рвущийся звук хуже шумного. Вместо этого меряем фон и предлагаем в один тап.
    // РЕШЕНИЕ ЧЕЛОВЕКА СИЛЬНЕЕ АВТОМАТИКИ И ПЕРЕЖИВАЕТ ВХОД: выключил руками - не
    // включаем и не предлагаем. Просьба админа сильнее: он человек, а не правило.
    var rnnBooted = false;
    function rnnBoot() {
      if (rnnBooted) return;

    // ═══ ОДНА ДВЕРЬ НА ЛЮБУЮ ПРАВКУ НАСТРОЕК ЖИВОЙ ДОРОЖКИ ═══
    // ПУБЛИКАЦИЯ НЕ ПЕРЕСОЗДАЁТСЯ НИ ПРИ КАКОМ ИЗМЕНЕНИИ ФЛАГОВ. Путь
    // unpublish -> publish это ровно класс Б1: `Promise.race` отменяет ОЖИДАНИЕ, а
    // операция внутри SDK продолжается, источник числится «публикуется», и следующий тап
    // падает «waiting for pending publication promise timed out». Мы это чинили, и второй
    // дороги, по которой оно вернётся, здесь нет.
    // ПРОСЬБА - НЕ ФАКТ (закон №35): после applyConstraints ПЕРЕЧИТЫВАЕМ настройки. У
    // браузера три поведения, и они разные для человека: применил / отказал ошибкой /
    // СОГЛАСИЛСЯ И НИЧЕГО НЕ СДЕЛАЛ. Последнее самое коварное - вызов проходит, а звук
    // прежний, и без перечитывания мы отрапортовали бы успех.
    async function applyAudio(want) {
      // ИСТОЧНИК, А НЕ ОБРАБОТАННАЯ ДОРОЖКА: у дорожки из MediaStreamAudioDestinationNode
      // нет ни эха, ни АРУ, и просьба ушла бы в никуда - молча.
      var t = (RNN_PROC && RNN_PROC.srcTrack) || micTrack();
      if (!t || !t.applyConstraints) return { ok: false, why: 'дорожки захвата нет', got: {} };
      var ask = {};
      Object.keys(want).forEach(function (k) {
        // НЕИЗВЕСТНЫЙ БРАУЗЕРУ ФЛАГ НЕ ПРОСИМ ВОВСЕ: часть браузеров на такой набор
        // отвечает OverconstrainedError и не применяет НИЧЕГО - то есть один лишний ключ
        // отменял бы и остальные.
        if (canDo(k) !== false) ask[k] = want[k];
      });
      // ═══ ТРИ ИСХОДА, И СХЛОПНУТЬ ИХ В ДВА НЕЛЬЗЯ ═══
      // «Отказал ошибкой» и «согласился и ничего не сделал» - разные миры для человека:
      // в первом браузер что-то не умеет и говорит об этом, во втором вызов проходит, а
      // звук прежний. Схлопнув их, мы отправили бы разбор не туда - и ровно это поймала
      // браузерная проба, когда первая редакция этой двери вернула одно слово на оба.
      try {
        await t.applyConstraints(ask);
      } catch (e) {
        return { kind: 'threw', ok: false, why: (e && e.name) || String(e),
                 got: (t.getSettings && t.getSettings()) || {} };
      }
      var got = (t.getSettings && t.getSettings()) || {};
      var bad = Object.keys(ask).filter(function (k) {
        return (k in got) && got[k] !== ask[k];
      });
      return { kind: bad.length ? 'silent' : 'ok', ok: !bad.length,
               why: bad.length ? bad.join(', ') : '', got: got };
    }

    // ═════════════ ЗАМЕР ФОНА: ОДНА МАШИНКА НА ДЕТЕКТОР И НА ОТЧЁТ ═════════════
    // Обе задачи спрашивают одно и то же - какой у человека фон В ПАУЗАХ речи. Две копии
    // этого счёта разошлись бы порогом «что считать паузой», и тогда предложение на
    // мобиле опиралось бы на один фон, а отчёт «-14 дБ» на другой (закон №40).
    function newStat() { return { all: [], db: [], low: [] }; }

    // ТЕЛО ПЕРЕЕХАЛО НАВЕРХ (`frameDbTop`): его зовёт и замер уровня микрофона, который
    // живёт на верхнем уровне страницы. Оставить его здесь значило бы завести ШЕСТОЙ
    // случай «объявлено внутри, зовётся снаружи» - ровно тот класс, что уже пять раз
    // уносил половину страницы ReferenceError'ом.
    var frameDb = frameDbTop;

    // ДОЛЯ ЭНЕРГИИ В 100-1000 Гц - ЭТО НЕ УКРАШЕНИЕ ОТЧЁТА, А ПРИЗНАК «МЕШАЕТ РЕЧИ».
    // Шум, лежащий выше 4 кГц, человек слышит как шипение и разбирать речь оно почти не
    // мешает; шум В ПОЛОСЕ РЕЧИ (живой сэмпл: 74%) съедает именно разборчивость.
    function lowShare(an, fbuf) {
      an.getFloatFrequencyData(fbuf);
      var hz = (an.context.sampleRate / 2) / fbuf.length;
      var lo = 0, all = 0;
      for (var i = 1; i < fbuf.length; i++) {
        var f = i * hz;
        if (f > 8000) break;
        if (fbuf[i] <= -180) continue;              // пустой бин
        var pw = Math.pow(10, fbuf[i] / 10);
        all += pw;
        if (f >= NS.LOW_HZ[0] && f <= NS.LOW_HZ[1]) lo += pw;
      }
      return all > 0 ? lo / all : 0;
    }

    // ПОРОГ ПАУЗЫ ПЛАВАЮЩИЙ И СЧИТАЕТСЯ ОТ СОБСТВЕННОГО МАКСИМУМА ЗА ОКНО. Абсолютное
    // число означало бы «у половины людей не работает»: усиление микрофона у всех своё, и
    // -45 dBFS у одного это фон, у другого - крик. Окно короткое (последние ~200 кадров,
    // то есть 10 секунд), иначе один хлопок дверью навсегда поднял бы планку и вся речь
    // после него считалась бы паузой.
    function feed(st, an, tbuf, fbuf) {
      var d = frameDb(an, tbuf);
      st.all.push(d);
      if (st.all.length > 200) st.all.shift();
      var mx = -120;
      for (var i = 0; i < st.all.length; i++) if (st.all[i] > mx) mx = st.all[i];
      if (d > mx - NS.SPEECH_GAP_DB) return;        // это речь, а не пауза
      st.db.push(d);
      st.low.push(lowShare(an, fbuf));
      if (st.db.length > 600) { st.db.shift(); st.low.shift(); }
    }

    function verdict(st) {
      if (st.db.length < NS.MIN_PAUSES) return null;
      var s = st.db.slice().sort(function (a, b) { return a - b; });
      var q = function (x) { return s[Math.min(s.length - 1, Math.floor(x * (s.length - 1)))]; };
      var sum = 0;
      for (var i = 0; i < st.low.length; i++) sum += st.low[i];
      // РАЗБРОС - ЭТО p90-p10, А НЕ max-min: одиночный щелчок не должен объявлять ровный
      // гул нестационарным, иначе предложение вылезало бы у всех подряд.
      return { db: q(0.5), spread: q(0.9) - q(0.1), low: sum / st.low.length,
               n: st.db.length };
    }

    // ═══ НАБЛЮДАТЕЛЬ ФОНА. ЖИВЁТ, ПОКА ШУМОДАВ ВЫКЛЮЧЕН, И ТОЛЬКО ТОГДА ═══
    // Включён - предлагать нечего, а лишний анализатор на телефоне это лишняя работа.
    // СВОЙ КОНТЕКСТ, И ЕМУ НЕ НУЖНЫ 48 кГц: 48 - условие работы МОДЕЛИ (она обучена на
    // кадрах 480 сэмплов), а уровень и доля полосы считаются на любой частоте, потому что
    // границы бинов берутся из `ctx.sampleRate`.
    var WATCH = null, rnnOffered = false;

    function watchStop() {
      if (!WATCH) return;
      try { clearInterval(WATCH.timer); } catch (e) {}
      try { WATCH.src.disconnect(); } catch (e) {}
      try { WATCH.ctx.close(); } catch (e) {}
      WATCH = null;
    }

    function watchStart() {
      watchStop();
      if (RNN_ON) return;
      var t = micTrack();
      if (!t) return;
      try {
        var ctx = regCtx(new (window.AudioContext || window.webkitAudioContext)(),
                         'детектор шума');
        var an = ctx.createAnalyser();
        an.fftSize = 1024; an.smoothingTimeConstant = 0;
        var src = ctx.createMediaStreamSource(new MediaStream([t]));
        src.connect(an);
        WATCH = { ctx: ctx, an: an, src: src, st: newStat(), hold: 0,
                  tbuf: new Float32Array(an.fftSize),
                  fbuf: new Float32Array(an.frequencyBinCount), timer: 0 };
        WATCH.timer = setInterval(watchTick, NS.TICK_MS);
      } catch (e) {
        // НЕ ПОЛУЧИЛОСЬ МЕРИТЬ - ЭТО НЕ ПОЛОМКА РАЗГОВОРА. Молчим в интерфейсе и
        // говорим в консоль: предложение просто не появится.
        console.warn('[rnn] наблюдатель фона не завёлся:', e);
      }
    }

    function watchTick() {
      if (!WATCH) return;
      feed(WATCH.st, WATCH.an, WATCH.tbuf, WATCH.fbuf);
      var v = verdict(WATCH.st);
      if (!v) return;
      // ТРИ ПРИЗНАКА РАЗОМ, А НЕ ОДИН ГРОМКИЙ. Просто громкий фон встроенное подавление
      // берёт; берёт оно и ровный. Не берёт оно РОВНО ЭТО СОЧЕТАНИЕ - заметный уровень,
      // прыгающий, и в полосе речи (живой разбор Ren 27.08).
      var noisy = v.db > NS.FLOOR_DB && v.spread >= NS.SPREAD_DB && v.low >= NS.LOW_SHARE;
      WATCH.hold = noisy ? (WATCH.hold + NS.TICK_MS / 1000) : 0;
      if (WATCH.hold < NS.HOLD_SEC) return;
      rnnOffer(v);
      // ПРЕДЛОЖИЛИ (ИЛИ РЕШИЛИ НЕ ПРЕДЛАГАТЬ) - БОЛЬШЕ МЕРИТЬ НЕЧЕГО. Наблюдатель,
      // крутящийся до конца созвона ради вопроса, на который ответ уже дан, - это работа
      // впустую на телефоне, ради которого мы и не включаем шумодав сами.
      if (rnnOffered || HAS_DISPLAY || rnnPrefGet()) watchStop();
    }

    // ═══ ПРЕДЛОЖЕНИЕ - ОДИН РАЗ ЗА СЕССИЮ И ТОЛЬКО ТАМ, ГДЕ ОНО УМЕСТНО ═══
    // На десктопе шумодав уже включён сам, предлагать нечего. Человеку, выключившему его
    // руками, не предлагаем ВООБЩЕ: он решил, и повторный вопрос это не забота, а спор.
    function rnnOffer(v) {
      if (rnnOffered || RNN_ON || HAS_DISPLAY || rnnPrefGet()) return;
      rnnOffered = true;
      var box = $('rnnoffer');
      if (!box) return;
      box.style.display = '';
      box.textContent = '';
      var t = document.createElement('span');
      // ЦИФРЫ, А НЕ «У ВАС ШУМНО»: человек вправе не согласиться, и тогда ему нужно
      // видеть, на чём основано предложение.
      t.textContent = 'Шумно: фон ' + Math.round(v.db) + ' дБ, скачет на '
        + Math.round(v.spread) + ' дБ, ' + Math.round(v.low * 100)
        + '% его энергии там же, где речь - встроенное подавление такой не берёт. ';
      box.appendChild(t);
      var b = document.createElement('button');
      b.textContent = '🔇 Включить шумодав';
      b.onclick = function () {
        box.style.display = 'none';
        rnnPref('on');
        rnnApply(true, 'по предложению');
      };
      box.appendChild(b);
    }

    // ═══ СКОЛЬКО ОН СНЯЛ - ЗАМЕР, А НЕ ФЛАГ «ВКЛЮЧЕНО» (закон №35) ═══
    // «Шумодав включён» верно и тогда, когда он не сделал ничего: модель могла не подойти
    // источнику, и человек продолжал бы фонить, считая себя вылеченным. Отчёт называет
    // ЧИСЛО, а нулевой результат - называет нулевым.
    var gainTimer = 0;
    function gainStop() { if (gainTimer) { clearInterval(gainTimer); gainTimer = 0; } }

    function gainStart() {
      gainStop();
      var pr = RNN_PROC;
      if (!pr || !pr.anIn || !pr.anOut) return;
      var a = newStat(), b = newStat();
      var tb = new Float32Array(pr.anIn.fftSize);
      var fb = new Float32Array(pr.anIn.frequencyBinCount);
      var left = Math.round(NS.GAIN_SEC * 1000 / NS.TICK_MS);
      gainTimer = setInterval(function () {
        if (!RNN_ON || RNN_PROC !== pr) { gainStop(); return; }
        // ПАУЗЫ ВЫБИРАЕМ ПО ВХОДУ, А ЗАМЕРЯЕМ ОБА. Выбери мы их по выходу - шумодав сам
        // решал бы, что считать паузой, и отчёт хвалил бы себя.
        var before = a.db.length;
        feed(a, pr.anIn, tb, fb);
        if (a.db.length > before) feed(b, pr.anOut, tb, fb);
        if (--left > 0) return;
        gainStop();
        var va = verdict(a), vb = verdict(b);
        if (!va || !vb) {
          // МОЛЧАНИЕ ТУТ ЧЕСТНЕЕ ВЫДУМАННОГО ЧИСЛА: пауз не набралось, мерить нечего.
          return;
        }
        var d = va.db - vb.db;
        if (d >= NS.GAIN_MIN_DB) {
          say('Шумодав работает: фон −' + Math.round(d) + ' дБ.');
        } else {
          say('Шумодав включён, но фон упал всего на ' + Math.round(d)
              + ' дБ - на этом источнике он не помогает. Выключить можно той же кнопкой.',
              true);
        }
      }, NS.TICK_MS);
    }

    // ═══ ПЕРЕГРУЗ МИКРОФОНА: МЕРИМ СИГНАЛ, А НЕ ЧИТАЕМ ФЛАГ ═══
    // Смотрим НА ИСТОЧНИК в обоих состояниях: при выключенном шумодаве это анализатор
    // наблюдателя фона, при включённом - входной анализатор процессора. Перегруз
    // случается ДО нас, в цепочке захвата, и от того, обрабатываем мы звук или нет, он
    // не зависит - значит и мерить его надо одинаково.
    var CLIP = { n: 0, hit: 0, said: false }, clipTimer = 0;

    function clipTick() {
      var an = (RNN_PROC && RNN_PROC.anIn) || (WATCH && WATCH.an) || null;
      if (!an) return;
      var buf = new Float32Array(an.fftSize);
      an.getFloatTimeDomainData(buf);
      var pk = 0;
      for (var i = 0; i < buf.length; i++) {
        var v = buf[i] < 0 ? -buf[i] : buf[i];
        if (v > pk) pk = v;
      }
      CLIP.n++;
      if (pk >= NS.CLIP_PEAK) CLIP.hit++;
      // ОКНО СКОЛЬЗЯЩЕЕ: за час разговора один хриплый эпизод не должен висеть в строке
      // до конца созвона, а свежий - обязан появиться.
      if (CLIP.n > 600) { CLIP.n = 300; CLIP.hit = Math.round(CLIP.hit / 2); }
      if (CLIP.n < NS.CLIP_MIN) return;
      var share = CLIP.hit / CLIP.n;
      // ДВА ПОРОГА, КАК У СТОРОЖА ПРОЦЕССОРА: строка, мигающая на границе, читается как
      // случайная и перестаёт что-либо значить.
      var bad = share >= NS.CLIP_SHARE;
      var okAgain = share <= NS.CLIP_SHARE / 2;
      if (bad === CLIP.said || (!bad && !okAgain)) return;
      CLIP.said = bad;
      AUDIO_CLIP = bad
        ? ('микрофон перегружается: ' + (share * 100).toFixed(1) + '% кадров упираются в '
           + 'потолок. АРУ этого не лечит - убавь усиление микрофона в настройках системы')
        : '';
      paintAudio();
    }

    // ═══ СТОРОЖ ПРОЦЕССОРА: ДВА ПОРОГА, ЧТОБЫ НЕ ХЛОПАТЬ ═══
    // Доклад приходит раз в секунду из самого worklet'а, поэтому счёт докладов и есть
    // счёт секунд. Между `CPU_OK` и `CPU_BAD` счётчик НЕ РАСТЁТ И НЕ СБРАСЫВАЕТСЯ - это и
    // есть гистерезис: на границе сторож молчит вместо того, чтобы включать и выключать.
    var cpuBad = 0, cpuWarned = false;
    function cpuOnLoad(load) {
      if (load >= NS.CPU_BAD) cpuBad += 1;
      else if (load <= NS.CPU_OK) { cpuBad = 0; return; }
      if (cpuBad < NS.CPU_HOLD_SEC) return;
      cpuBad = 0;
      var pct = Math.round(load * 100);
      if (!HAS_DISPLAY) {
        // НА ТЕЛЕФОНЕ РЕШАЕМ САМИ И ГОВОРИМ ОБ ЭТОМ. Захлебнувшаяся обработка это не
        // «чуть хуже качество», это рвущийся звук: сначала снимаем, потом объясняем.
        // И БОЛЬШЕ НЕ ПРЕДЛАГАЕМ: `rnnApply(false)` заводит наблюдателя фона заново, а
        // фон никуда не делся - без этой строки получился бы круг «сторож снял -
        // детектор предложил - человек включил - сторож снял».
        rnnOffered = true;
        rnnApply(false, 'устройство не справляется');
        say('Шумодав выключен: устройство не справляется (обработка съедала ' + pct
            + '% звукового потока). Звук идёт как был.', true);
        return;
      }
      if (cpuWarned) return;
      cpuWarned = true;
      // НА ДЕСКТОПЕ РЕШАЕТ ЧЕЛОВЕК: там запас есть почти всегда, и снятое за спиной
      // подавление он заметит по звуку, а не по нашей строке.
      var box = $('rnnoffer');
      if (!box) return;
      box.style.display = '';
      box.textContent = '';
      var t = document.createElement('span');
      t.textContent = 'Шумодав ест ' + pct + '% звукового потока - устройство на пределе, '
        + 'звук может рваться. ';
      box.appendChild(t);
      var b = document.createElement('button');
      b.textContent = '🔊 Выключить шумодав';
      b.onclick = function () {
        box.style.display = 'none';
        rnnPref('off');
        rnnApply(false, 'по предупреждению');
      };
      box.appendChild(b);
    }

    // ═══ ЧТО ЧЕЛОВЕК РЕШИЛ САМ - ПЕРЕЖИВАЕТ ВХОД И ВЫХОД ═══
    // «Уважать» решение только внутри одной сессии значит переспрашивать при каждом
    // заходе: автоматика включала бы шумодав заново, и человек выключал бы его снова.
    function rnnPref(v) { try { localStorage.setItem(RNN_PREF_KEY, v); } catch (e) {} }
    function rnnPrefGet() {
      try { return localStorage.getItem(RNN_PREF_KEY) || ''; } catch (e) { return ''; }
    }

    function rnnPaint() {
      var btn = $('rnn');
      if (btn) {
        btn.classList.toggle('on', RNN_ON);
        btn.textContent = RNN_ON ? '🔊 Выключить шумодав' : '🔇 Подавить шум';
      }
      // СТРОКА СЛЕДУЕТ ЗА СОСТОЯНИЕМ, А НЕ ЗА ПОРЯДКОМ СТРОК: браузерная часть меряется
      // один раз при захвате, наш шумодав живёт по кнопке.
      paintAudio();
    }

    // ═══ СОСТОЯНИЕ РАССЫЛАЕМ САМИ: АДМИН ВИДИТ ФАКТ, А НЕ СВОЮ ЖЕ ПРОСЬБУ ═══
    // Бот знает только то, что попросил, - а включает шумодав КЛИЕНТ и вправе не смочь
    // (нет wasm, не тот sampleRate, человек выключил обратно). Показывать админу
    // отправленную просьбу вместо факта значило бы врать ровно тем способом, ради
    // которого этот экран и заводится.
    function rnnSay() {
      try { upsert(room.localParticipant.identity, { rnn: RNN_ON }); } catch (e) {}
      send({ t: 'rnn', on: RNN_ON });
    }

    // ═══════════ ОДНА ДВЕРЬ НА ВСЕ ЧЕТЫРЕ ПУТИ ВКЛЮЧЕНИЯ ═══════════
    // Тап человека, автоматика десктопа, просьба админа и сторож процессора обязаны
    // делать ОДНО И ТО ЖЕ: иначе, например, автоматика включила бы шумодав, забыв снять
    // встроенный, и мы получили бы двойную обработку у половины комнаты (закон №40).
    async function rnnApply(on, why) {
      on = !!on;
      var pub = micPub();
      if (!pub || !pub.track || !pub.track.setProcessor) {
        if (why === 'тап') say('Этот клиент не умеет подключать шумодав к дорожке.', true);
        return false;
      }
      if (rnnBusy || on === RNN_ON) { rnnPaint(); return on === RNN_ON; }
      rnnBusy = true;
      var btn = $('rnn');
      if (btn) btn.disabled = true;
      try {
        if (on) {
          watchStop();
          if (why === 'тап') say('Включаю шумодав, это пара секунд…');
          var proc = rnnProcessor(await rnnBytes());
          proc.onLoad = cpuOnLoad;
          // setProcessor ПОДМЕНЯЕТ ДОРОЖКУ У ОТПРАВИТЕЛЯ, А НЕ ПЕРЕИЗДАЁТ ПУБЛИКАЦИЮ.
          // Именно поэтому переключение здесь безопасно и во время показа экрана, и
          // посреди разговора: сама публикация микрофона не трогается вовсе.
          await pub.track.setProcessor(proc);
          RNN_PROC = proc;
          RNN_ON = true;
          cpuBad = 0;
          await applyAudio(audioWant());
          gainStart();
          if (why && why !== 'тап') say('Шумодав включён (' + why + ').');
        } else {
          gainStop();
          await pub.track.stopProcessor();
          RNN_PROC = null;
          RNN_ON = false;
          await applyAudio(audioWant());
          watchStart();
          // ГОВОРИМ ВСЕГДА, А НЕ ТОЛЬКО ПО СВОЕМУ ТАПУ. Шумодав снимает ещё сторож
          // процессора и админ, и молчаливое снятие человек услышит как «шум вернулся
          // сам» - то есть пойдёт чинить микрофон. «Никаких уведомлений» из ТЗ - это про
          // АДМИНА, которому не докладывают о чужом локальном выборе, а не про хозяина
          // микрофона.
          say(why === 'тап' ? 'Шумодав выключен.'
                            : ('Шумодав выключен (' + (why || 'не мной') + ').'));
        }
      } catch (e) {
        // ОСТАЁМСЯ НА ИСХОДНОЙ ДОРОЖКЕ И ВОЗВРАЩАЕМ ВСТРОЕННОЕ ПОДАВЛЕНИЕ: уйти
        // одновременно без нашего и без браузерного значило бы оставить человека в эфире
        // хуже, чем он был до тапа.
        RNN_ON = false; RNN_PROC = null;
        // ═══ СНИМАЕМ ПРОЦЕССОР ЯВНО, А НЕ НАДЕЕМСЯ НА SDK ═══
        // `init` мог упасть ПОСЛЕ того, как livekit-client уже подменил дорожку у
        // отправителя, - проверить это из контейнера нечем (закон №48), а цена ошибки
        // здесь ТИШИНА В ЭФИРЕ: обработанной дорожки нет, а исходная уже не публикуется.
        // Один безусловный `stopProcessor` делает вопрос неважным: что бы SDK ни успел,
        // публикуется источник.
        try { await pub.track.stopProcessor(); } catch (e2) {}
        try { await applyAudio(audioWant()); } catch (e2) {}
        // ═══ БРАУЗЕР НЕ ДАЁТ ЗАПУСТИТЬ ЗВУК БЕЗ ЖЕСТА - ЭТО НЕ ПОЛОМКА, А ОЖИДАНИЕ ═══
        // Авто-включение при входе идёт БЕЗ жеста по построению, и на таком клиенте
        // красная строка вылезала бы при КАЖДОМ заходе - то есть сторож кричал бы всегда,
        // и на него перестали бы смотреть. Ждём первого касания и включаем молча; строка
        // при этом всё равно есть, но спокойная и объясняющая, а не отказ.
        var _needGesture = String((e && e.message) || '').indexOf('без твоего действия') >= 0;
        if (_needGesture && why === 'по умолчанию') {
          rnnArmGesture();
          say('Шумодав включится при первом касании экрана: раньше браузер обработку '
              + 'звука не запускает. Пока идёт встроенное подавление.');
        } else {
          // МОЛЧАЛИВЫХ ФОЛБЭКОВ ЗДЕСЬ НЕТ: неудачу видно строкой, а не по звуку. И строка
          // называет ТО НАПРАВЛЕНИЕ, которое не вышло: «не включился» над упавшим
          // ВЫКЛЮЧЕНИЕМ отправляет человека искать не ту поломку - тем более что снять
          // шумодав могли не он, а сторож процессора или админ.
          say((on ? 'Шумодав не включился (' : 'Шумодав не выключился (')
              + (e && e.message || e) + '). Звук идёт как был.', true);
        }
        watchStart();
      }
      if (btn) btn.disabled = false;
      rnnBusy = false;
      rnnPaint();
      rnnSay();
      return RNN_ON === on;
    }

    // ═══ ЖДЁМ ПЕРВОГО КАСАНИЯ И ПРОБУЕМ СНОВА - ОДИН РАЗ ═══
    // Условие, из-за которого мы не смогли включиться, снимается РОВНО ЖЕСТОМ, и ждать
    // его дешевле, чем требовать от человека найти кнопку. Слушатель одноразовый: второй
    // отказ уже не про жест, и крутить его по кругу значит скрывать настоящую причину.
    var gestureArmed = false;
    function rnnArmGesture() {
      if (gestureArmed) return;
      gestureArmed = true;
      var fire = function () {
        document.removeEventListener('pointerdown', fire, true);
        document.removeEventListener('keydown', fire, true);
        // РЕШЕНИЕ ЧЕЛОВЕКА МОГЛО ПОМЕНЯТЬСЯ, ПОКА МЫ ЖДАЛИ: он мог нажать «Подавить шум»
        // сам либо, наоборот, выключить. Перепроверяем, а не включаем вслепую.
        if (RNN_ON || rnnPrefGet() === 'off') return;
        rnnApply(true, 'по умолчанию');
      };
      document.addEventListener('pointerdown', fire, true);
      document.addEventListener('keydown', fire, true);
    }

    // ТАП ЧЕЛОВЕКА - ЭТО РЕШЕНИЕ, И ОНО ЗАПОМИНАЕТСЯ. Автоматика после него молчит
    // навсегда; админ может попросить снова - он человек, а не правило.
    async function rnnToggle() {
      rnnPref(RNN_ON ? 'off' : 'on');
      await rnnApply(!RNN_ON, 'тап');
    }

    // ═══ ПРОСЬБА АДМИНА: ПРИМЕНЯЕМ ЗДЕСЬ, ПРОЧИТАНА ОНА БЫЛА В showRec ═══
    rnnPump = function () {
      var w = rnnWant;
      rnnWant = null;
      if (!w) return;
      // ЛОКАЛЬНОЕ РЕШЕНИЕ ПОБЕЖДАЕТ - НО НЕ ЗАДНИМ ЧИСЛОМ. Просьба свежее его, значит
      // админ действовал ПОСЛЕ и знает, что делает; выключить обратно человек может тем
      // же тапом, и уведомления об этом никто не получит.
      rnnApply(w.on, w.by ? ('просьба: ' + w.by) : 'просьба админа');
    };

    // ═══ ПОКАЗ ЭКРАНА: КНОПКА ПО НАЛИЧИЮ МЕТОДА, А НЕ ПО ПЛАТФОРМЕ ═══
    // Живая проба (Ren 24.08): desktop отдаёт поток 2880x1448@30 со звуком вкладки,
    // Android - метода getDisplayMedia НЕТ ВООБЩЕ. Это не отказ в разрешении, а
    // отсутствие API: подсказывать нечего, включать нечего.
    // ПРОВЕРЯЕМ МЕТОД, А НЕ UserAgent: UA врёт (режим «для компьютеров» на телефоне),
    // наличие метода - факт.
    // ПРИЗНАК ОДИН НА СТРАНИЦУ (`HAS_DISPLAY`, объявлен выше): дефолт шумодава спрашивает
    // РОВНО ТО ЖЕ, что решает судьбу этой кнопки, и вторая копия проверки разошлась бы с
    // первой на первой правке.
    // ДВА УСЛОВИЯ, И ОНИ РАЗНЫЕ. Метод - что умеет КЛИЕНТ; грант - что разрешил СЕРВЕР.
    // Второе без первого бесполезно, первое без второго ВИСНЕТ вместо отказа.
    var g = grantOf(j.token), srcs = g.canPublishSources || [];
    var mayScreen = srcs.indexOf('screen_share') >= 0, mayCam = srcs.indexOf('camera') >= 0;
    // ═══ ЭКРАН - ТОЛЬКО ГДЕ ЕСТЬ МЕТОД, КАМЕРА - ВЕЗДЕ ═══
    // Прежняя редакция показывала камеру ТОЛЬКО там, где нет экрана, - как замену. Это
    // неверно: с компьютера тоже надо показать себя, особенно когда экран показывать
    // нечего. Делить по устройству оправдано лишь у экрана, где метода физически нет.
    var canScreen = HAS_DISPLAY && mayScreen;
    var canCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && mayCam;
    var showBtn = $('show'), camBtn = $('cam');

    if (!mayScreen && !mayCam) {
      // ГЛАВНОЕ СООБЩЕНИЕ ЭТОГО ЭКРАНА: причина НЕ в браузере и не в комнате.
      // НАЗЫВАЕМ ПРОВЕРЕННЫЙ ФАКТ И ГОВОРИМ, ЧЕМ ПРОВЕРИТЬ ПРИЧИНУ, А НЕ УТВЕРЖДАЕМ ЕЁ.
      // Прежняя редакция дописывала «Worker выложен старой версией» - это ДОГАДКА: тот
      // же пустой грант даёт и токен, выданный вчера, и смена политики выдачи. Факт у
      // нас ровно один - в токене нет права публикации.
      $('showhint').textContent = 'Показ выключен на сервере: в токене нет права '
        + 'публикации. Это у нас, не у тебя: смотреть чужой экран при этом можно. '
        + 'Проверить - tools/rtc_env.py, там видно, каким Worker\'ом выдан токен.';
    } else {
      if (canScreen) showBtn.style.display = '';
      if (canCam) camBtn.style.display = '';
      $('showhint').textContent = canScreen
        ? 'Смотреть чужой экран можно откуда угодно, показывать - с компьютера.'
        : 'Показ экрана у телефонов недоступен - такой возможности нет у мобильных '
          + 'браузеров. Запись экрана можно снять системой и прислать файлом в чат. '
          + 'Камера и просмотр чужого экрана работают отсюда.';
    }
    barLabel(showBtn, '🖥', 'Экран');

    // ═══ ПОРОГ СТОРОЖА ЗАВЕДОМО ВЫШЕ ВСЕХ ПОТОЛКОВ SDK ═══
    // ЖИВОЙ ОТКАЗ REN: «сервер не принял дорожку за 12 с», и после этого до перезахода не
    // работали НИ экран, НИ камера. Причина найдена исходником `livekit-client@2.7.2`, а
    // не рассуждением: у SDK свои таймауты на ОБЕИХ стадиях - `RTCEngine.addTrack` 10 с
    // («publication of local track timed out») и `PCTransportManager.negotiate` 15 с
    // (`peerConnectionTimeout`). Наши 12 с стояли РОВНО МЕЖДУ ними, то есть сторож резал
    // ЖИВОЕ окно негоциации и не давал дойти точному отказу SDK.
    // ПОЧЕМУ СТОРОЖ ВСЁ-ТАКИ НУЖЕН: два ожидания у SDK не ограничены ничем -
    // `getDisplayMedia` (человек выбирает источник, и это законно) и
    // `await this.republishPromise` в `setTrackEnabled` при переподключении. Второе как
    // раз и держит нас после аварии.
    // ЗНАЧИТ ОН СТРАХОВКА, А НЕ СУДЬЯ: 25 с (10 и 15 со слаком), а текст отказа берётся У
    // SDK, если тот успел ответить. Свой - только когда SDK не сказал ничего.
    var PUB_WATCHDOG_MS = PUB_WAIT_MS;

    // ═══ ПОСЛЕ НЕУДАЧНОЙ ПУБЛИКАЦИИ ДВИЖОК ВОЗВРАЩАЕТСЯ В РАБОЧЕЕ СОСТОЯНИЕ ═══
    // Провал негоциации у SDK зовёт `handleDisconnect('negotiation')`, движок уходит в
    // ПЕРЕПОДКЛЮЧЕНИЕ, а `setTrackEnabled` первым делом ждёт `republishPromise` - это
    // ОБЩЕЕ состояние, не по источнику. Отсюда «умерли обе кнопки»: камера ни при чём,
    // она просто ждёт того же.
    // ПОЭТОМУ ПОСЛЕ ОТКАЗА МЫ ЖДЁМ ФАКТА, А НЕ ПОКАЗЫВАЕМ ОШИБКУ И УХОДИМ. Ждём
    // ограниченно и смотрим `room.state` - именно его SDK выставляет в 'connected' по
    // завершении переподключения.
    function connOk() { return String(room.state || '') === 'connected'; }

    // ═══ НИ ОДНОГО ОЖИДАНИЯ SDK БЕЗ ПОТОЛКА - ЧЕТВЁРТЫЙ КРУГ ОДНОГО ДЕФЕКТА ═══
    // ЖИВОЙ ОТКАЗ REN 30.08: камера включена, тап по «Экран» - показ не идёт, кнопка
    // ЗАЛИПАЕТ СЕРОЙ, лечит только перезаход. Прежний сторож прикрывал ОЖИДАНИЕ
    // публикации и не прикрывал РАЗМАТЫВАНИЕ: в `catch` стояло `await sdkOff()` без
    // потолка, а `sdkOff()` идёт через тот же метод, который сейчас висит (у
    // livekit-client `setTrackEnabled` первым делом ждёт `republishPromise`, и он ОБЩИЙ
    // НА УЧАСТНИКА - поэтому живая камера вешает и экран, и микрофон). `btn.disabled =
    // false` живёт в `finally`, до которого исполнение не доходило ВООБЩЕ.
    // ПОЭТОМУ ПОТОЛОК ОДИН И ОБЩИЙ: любое обращение к SDK оборачивается им, и «висит»
    // превращается в НАЗВАННЫЙ отказ, а не в серую кнопку.
    function capped(p, what, ms) {
      var t = null;
      return Promise.race([
        Promise.resolve(p).then(function (v) { clearTimeout(t); return v; },
                                function (e) { clearTimeout(t); throw e; }),
        new Promise(function (_, rej) {
          t = setTimeout(function () {
            rej(new Error(what + ': за ' + Math.round((ms || PUB_WAIT_MS) / 1000)
                          + ' с ни ответа, ни отказа'));
          }, ms || PUB_WAIT_MS);
        })]);
    }

    async function settle(ms) {
      var t0 = Date.now();
      while (Date.now() - t0 < ms) {
        if (connOk()) return true;
        await new Promise(function (r) { setTimeout(r, 250); });
      }
      return connOk();
    }

    // РУЧНОЕ ПЕРЕПОДКЛЮЧЕНИЕ - КНОПКОЙ, А НЕ САМО. Оно рвёт звук у всех, кто в разговоре;
    // делать это за человека посреди фразы хуже самой болезни. Кнопка при этом ЕСТЬ, и
    // это и есть «без перезахода»: окно закрывать не нужно.
    // ═══ ЖДЁМ ДВИЖОК В ФОНЕ, А НЕ ДЕРЖА КНОПКУ ═══
    // Первая редакция ждала `settle` ПРЯМО в обработчике тапа, и кнопка оставалась серой
    // все двенадцать секунд - то есть лечение от западни само было маленькой западнёй.
    // Человеку кнопка нужна СРАЗУ (отказ мог быть разовым), а предложение переподключиться
    // догонит его само.
    function watchEngine(why) {
      settle(12000).then(function (ok) { if (!ok) offerRedo(why); },
                         function () { offerRedo(why); });
    }

    var _redoBtn = null;
    function offerRedo(why) {
      if (_redoBtn) { _redoBtn.style.display = ''; return; }
      var host = $('showhint');
      if (!host) return;
      _redoBtn = document.createElement('button');
      _redoBtn.id = 'redo';          // чтобы реестр переключателей её ВИДЕЛ
      _redoBtn.className = 'wide';
      _redoBtn.textContent = '🔌 Переподключиться';
      _redoBtn.onclick = async function () {
        _redoBtn.disabled = true;
        say('Переподключаюсь…');
        try {
          await room.disconnect();
          // ТОТ ЖЕ ТОКЕН, ЧТО И НА ВХОДЕ: он живёт 15 минут и в самом частом случае
          // (авария вскоре после входа) ещё годен. Протух - говорим это ПРЯМО, а не
          // «не получилось»: лечится он не повтором, а новым входом из бота.
          await room.connect(j.url, j.token);
          // ЧЕРЕЗ ТУ ЖЕ ДВЕРЬ, ЧТО И КНОПКА: у неё сторож, разбор отказа и честная
          // подпись. Свой вызов здесь был четвёртой копией правила и единственной без
          // потолка после переподключения - то есть ровно тем же дефектом ещё раз.
          await micSet(true);
          say('');
          _redoBtn.style.display = 'none';
        } catch (e) {
          var m = String((e && e.message) || e);
          say(/expire|invalid|token/i.test(m)
              ? 'Токен входа протух - открой комнату заново из бота, кнопка там всегда '
                + 'свежая. (' + m + ')'
              : 'Переподключиться не вышло. ' + lkWhy(e, (j && j.url) || ''), true);
        }
        _redoBtn.disabled = false;
      };
      host.parentNode.insertBefore(_redoBtn, host.nextSibling);
      // ═══ ЛЕЧЕНИЕ ДОПИСЫВАЕТСЯ К ПРИЧИНЕ, А НЕ ЗАМЕНЯЕТ ЕЁ ═══
      // Поймала браузерная проба, а не чтение: `stopShow` честно говорил «у себя выключил,
      // сервер не подтвердил», а следом `offerRedo` затирал это своим текстом - человек
      // получал «нажми Переподключиться» и терял ЕДИНСТВЕННОЕ, что объясняло, видят его
      // соседи или нет. Диагноз и что делать нужны ОБА.
      var _was = ($('state').textContent || '').trim();
      say((_was ? _was + ' ' : '') + why
          + ' Соединение не вернулось само - нажми «Переподключиться», окно закрывать '
          + 'не надо.', true);
    }

    // ═══ ОДНА ДВЕРЬ НА ОБА ПОКАЗА, РАЗНЫЕ ТОЛЬКО ИСТОЧНИК И ПОДПИСЬ ═══
    // Две копии «включить/выключить» разошлись бы на первой правке (закон №40), а тут
    // цена расхождения - висящая дорожка, которую видно СОСЕДЯМ, а не нам.
    function toggler(btn, kind, offIcon, word) {
      var live = false;
      //: ЧЕМ ОТМЕНИТЬ ОЖИДАНИЕ ОКНА ВЫБОРА. Пока не ждём - null, и тап идёт обычным путём.
      var pickAbort = null;
      // ПОДПИСЬ И КЛАСС - ОДНОЙ ДВЕРЬЮ, ИЗ `live`. Пока их ставили по местам, ветка
      // отказа забывала их вернуть, и кнопка показывала «идёт показ» над мёртвой
      // дорожкой (живой отказ Ren).
      function paint() {
        btn.classList.toggle('on', live);
        barLabel(btn, live ? '⏹' : offIcon, word);
      }

      // ═══ КНОПКА ОЖИВАЕТ ПО ТАЙМЕРУ, А НЕ ТОЛЬКО В `finally` ═══
      // `finally` возвращает её лишь тогда, когда работа ЗАВЕРШИЛАСЬ, - а весь этот класс
      // багов про то, что она НЕ завершается. Страховка на секунду выше самого долгого
      // нашего ожидания. Живой отказ Ren: кнопка серая до перезахода.
      //
      // ═══ ЧАСЫ ЗАВОДЯТСЯ НА НАШУ РАБОТУ, А НЕ НА РАЗДУМЬЕ ЧЕЛОВЕКА ═══
      // Прежняя редакция ставила таймер ОДИН РАЗ, в момент тапа, на 29 секунд - а внутри
      // лежало ожидание окна выбора длиной до ШЕСТИДЕСЯТИ.
      // ЗДЕСЬ ЖЕ ЗАПИСАНА МОЯ СОБСТВЕННАЯ ОШИБКА В РАЗБОРЕ, ПОТОМУ ЧТО ЛОЖНЫЙ КОММЕНТАРИЙ
      // ЗАКРЫВАЕТ РАЗБОР НАДЁЖНЕЕ, ЧЕМ ЕГО ОТСУТСТВИЕ. Сперва я написал, что сторож
      // срабатывал посреди диалога и объявлял «клиент так и не ответил», зовя нажать ещё
      // раз (а повторный тап во время ожидания - это `pickAbort`, то есть отмена выбора).
      // ЭТО НЕВЕРНО, и проверено чтением прежней редакции, а не по памяти: первой строкой
      // у сторожа стоит `if (!btn.disabled) return`, а на время ожидания диалога кнопка
      // ЖИВА (`btn.disabled = false` + подпись «Отменить») - значит он выходил первой же
      // строкой, ложной фразы не давал и нажать ещё раз не звал. Седьмой заход, пойдя за
      // этим объяснением, искал бы строку, которой нет.
      // ЧТО ЛОМАЛОСЬ НА САМОМ ДЕЛЕ, И ЭТО МЕНЬШЕ: одноразовый таймер у долго выбиравшего
      // человека СГОРАЛ ВХОЛОСТУЮ на 29-й секунде, и дальше публикация шла БЕЗ страховки
      // вовсе. Основной потолок публикации при этом работал, поэтому кнопка возвращалась;
      // пропадал ровно тот запасной слой, который заведён под пути, которых мы ещё не
      // нашли, - и пропадал он ИЗБИРАТЕЛЬНО, у тех, кто выбирал окно дольше всех.
      // ЧЕСТНО ПРО ДОКАЗАННОСТЬ: наблюдаемой разницы в пробе у этой правки НЕТ - круг
      // «долгое раздумье» зелен и на старом коде. Она остаётся ОБОСНОВАННЫМ намерением:
      // страховка обязана покрывать нашу работу, а не сгорать на раздумье человека.
      var _wake = null;
      function wakeArm(ms) {
        clearTimeout(_wake);
        _wake = setTimeout(function () {
          _wake = null;
          if (!btn.disabled) return;
          btn.disabled = false;
          paint();
          say('Кнопка «' + word + '» отвисла: клиент так и не ответил. Нажми ещё раз - '
              + 'состояние у себя я вернул.', true);
        }, ms || (PUB_WAIT_MS + 4000));
      }
      function wakeOff() { clearTimeout(_wake); _wake = null; }

      // ВЫКЛЮЧЕНИЕ - ТОЖЕ ОБРАЩЕНИЕ К SDK, И ОНО ВИСНЕТ РОВНО ТАК ЖЕ. Половина потолков
      // хуже, чем ни одного: она создаёт впечатление, что путь прикрыт.
      function sdkOff(ms) {
        return capped(kind === 'screen'
          ? unpublishScreen()
          : room.localParticipant.setCameraEnabled(false),
          'снятие ' + word.toLowerCase(), ms);
      }

      // ═══ ЭКРАН БЕРЁТСЯ СИНХРОННО В САМОМ ТАПЕ, ДО ЛЮБОГО `await` ═══
      // ЖИВОЙ ФАКТ (Ren 30.08), и он асимметричен: экран -> камера работает, камера ->
      // экран НЕТ. Это и есть подпись механизма. `getDisplayMedia` требует ЖЕСТА
      // человека; `getUserMedia` для камеры с уже выданным разрешением - НЕ требует.
      // ГДЕ ТЕРЯЛСЯ ЖЕСТ - НЕ В НАШЕМ КОДЕ: у нас `setScreenShareEnabled` звался
      // синхронно из обработчика (первый `await` стоит ПОСЛЕ него). Ожидание живёт
      // ВНУТРИ livekit-client: `setTrackEnabled` первым делом ждёт незавершённую
      // публикацию (`republishPromise`, ОБЩИЙ на участника - поэтому живая камера вешает
      // и экран, и микрофон) и только ПОТОМ зовёт `getDisplayMedia`. После ожидания жест
      // уже протух, и запрос экрана НЕ РЕЗОЛВИТСЯ И НЕ РЕДЖЕКТИТСЯ - отсюда наша же
      // строка «за 25 с не пришло ни подтверждения, ни отказа». ПОТОЛКИ ТУТ БЕСПОЛЕЗНЫ
      // ПО ПОСТРОЕНИЮ: они превращают вечное ожидание в названный отказ, но показа от
      // этого не случается.
      // ПОЭТОМУ ПОРЯДОК ОБРАТНЫЙ: сперва САМИ берём поток (первым действием тапа,
      // синхронно), и только потом отдаём готовую дорожку в `publishTrack` - тот ничего
      // не захватывает, жеста не требует и ждать ему нечего.
      function grabScreen() {
        if (!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)) {
          return Promise.reject(new Error('этот клиент не умеет показывать экран'));
        }
        // ПОТОЛОК КАРТИНКИ ЗАДАН НАРОЧНО: 2880x1448@30 это десятки мегабит, а комната
        // живёт на общем канале песочницы. Читаемость текста даёт и 1080p.
        var _t0 = _now();
        //: ═══ ЧТО ВЕРНУЛ САМ ВЫЗОВ - ОТДЕЛЬНАЯ СТРОКА ЛЕНТЫ (требование Ren) ═══
        //: Прежде исход `getDisplayMedia` был виден только КОСВЕННО: дошли мы до стадии
        //: «поток получен» или нет. А исходов ТРИ, и они требуют разного: вернул поток /
        //: отказал (человек закрыл окно, нет прав) / МОЛЧИТ (обещание не разрешилось и
        //: не отклонилось - беда вебвью, и чинить у себя нечего). Третий от первых двух
        //: по косвенным признакам не отличить, а именно он у нас и живой.
        //: ВЕШАЕМСЯ НА САМ ПРОМИС, А НЕ НА ГОНКУ: гонка кончается нашим потолком, и
        //: поздний ответ - если он вообще придёт - прошёл бы мимо ленты незамеченным.
        SCREEN_HUNG = 0;
        var _p = navigator.mediaDevices.getDisplayMedia({
          video: { width: { max: 1920 }, height: { max: 1080 }, frameRate: { max: 15 } },
          audio: true
        });
        _p.then(function (st) {
          var n = 0;
          try { n = st.getTracks().length; } catch (e) {}
          diag('getDisplayMedia ВЕРНУЛ ПОТОК за ' + (_now() - _t0) + 'мс, дорожек ' + n);
          //: ВЕРНУЛСЯ ПОЗЖЕ НАШЕЙ СДАЧИ - ВЫЗОВ БОЛЬШЕ НЕ ВИСИТ, и следующий тап
          //: обязан идти обычным путём, а не упираться в нашу же метку.
          SCREEN_HUNG = 0;
        }, function (e) {
          diag('getDisplayMedia ОТКАЗАЛ за ' + (_now() - _t0) + 'мс: '
               + (e && e.name || 'ошибка') + ': ' + (e && e.message || e));
          SCREEN_HUNG = 0;
        });
        return _p;
      }

      // ЧТО МЫ ОПУБЛИКОВАЛИ САМИ - ПОМНИМ САМИ. `setScreenShareEnabled(false)` ведёт
      // СВОЁ состояние, и о наших публикациях он не знает; звать его на снятие значило
      // бы надеяться, что он их найдёт, - а цена ошибки видна СОСЕДЯМ, не нам.
      var myScreen = [];

      //: ═══ ЧТО ИМЕННО МЫ ДЕРЖИМ В РУКАХ - ФАКТ, А НЕ «поток получен» ═══
      //: «Дорожек 2» не отвечает ни на один вопрос разбора. Отвечают вид, метка
      //: (у показа это имя окна или вкладки), состояние и то, не погасил ли её кто-то
      //: между получением и публикацией: мёртвая дорожка публикуется молча и навсегда
      //: остаётся чёрным квадратом у соседей.
      function trackWord(t) {
        try {
          return (t.kind || '?') + '/' + (t.readyState || '?')
               + '/«' + String(t.label || '').slice(0, 40) + '»'
               + (t.muted ? '/muted' : '');
        } catch (e) { return '?'; }
      }
      //: СОСТОЯНИЕ КОМНАТЫ РЯДОМ С КАЖДОЙ ПУБЛИКАЦИЕЙ: «встало на публикации» и «встало
      //: на публикации, потому что соединение уже переподключалось» - разные починки, а
      //: по одной строке они неразличимы.
      function roomWord() {
        try {
          return 'room=' + String(room && room.state)
               + ' сеть=' + (navigator.onLine ? 'есть' : 'НЕТ');
        } catch (e) { return 'room=?'; }
      }

      async function publishScreen(stream) {
        var st = await stream;   // промис взят ДО await'ов, здесь он уже без жеста
        var LK = window.LivekitClient || window.LiveKitClient || {};
        var SRC = (LK.Track && LK.Track.Source) || {};
        var tracks = st.getTracks ? st.getTracks() : [];
        diag('дорожки: ' + tracks.map(trackWord).join(' + ') + ' · ' + roomWord());
        if (!tracks.length) throw new Error('пустой поток: браузер не отдал ни дорожки');
        myScreen = [];
        for (var i = 0; i < tracks.length; i++) {
          var t = tracks[i];
          // ЗВУК ВКЛАДКИ - СВОЙ ИСТОЧНИК: назови его картинкой, и LiveKit разложит его
          // соседям как видео, а грант проверяется ПО ИСТОЧНИКУ.
          var src = (t.kind === 'audio')
            ? (SRC.ScreenShareAudio || 'screen_share_audio')
            : (SRC.ScreenShare || 'screen_share');
          //: ═══ КАЖДАЯ ДОРОЖКА ОТДЕЛЬНОЙ СТРОКОЙ, И ЭТО НЕ ПОДРОБНОСТЬ РАДИ ПОДРОБНОСТИ
          //: Публикаций тут ДВЕ (картинка и звук вкладки), они идут ПОСЛЕДОВАТЕЛЬНО, и
          //: у SDK каждая - своя негоциация. «Публикация не прошла» без номера дорожки
          //: не говорит, встало на первой или на второй, а это разные причины: на первой
          //: - соединение, на второй - очередь за собственной первой.
          diag('публикую ' + (i + 1) + '/' + tracks.length + ' ' + src + ' ' + trackWord(t));
          var _t0 = _now();
          var pubd = await room.localParticipant.publishTrack(t, { source: src });
          diag('опубликована ' + (i + 1) + '/' + tracks.length + ' за '
               + (_now() - _t0) + 'мс · ' + roomWord());
          myScreen.push(pubd || t);
        }
        // ЧЕЛОВЕК ЗАКРЫЛ ПОКАЗ СРЕДСТВАМИ БРАУЗЕРА («Остановить доступ») - У НАС ЭТО
        // ТАКОЕ ЖЕ ВЫКЛЮЧЕНИЕ. Без этого кнопка осталась бы в «идёт показ» над мёртвой
        // дорожкой, а соседи видели бы застывший кадр.
        try {
          var vt = st.getVideoTracks ? st.getVideoTracks()[0] : null;
          if (vt) vt.addEventListener('ended', function () {
            if (!live) return;
            live = false; paint(); sweepVideos();
            unpublishScreen().catch(function () {});
            say('Показ экрана остановлен в браузере - снял и в комнате.', true);
          });
        } catch (e) {}
        return myScreen;
      }

      async function unpublishScreen() {
        var mine = myScreen; myScreen = [];
        // ═══ ОТКАЗ СНЯТИЯ НЕ ГЛОТАЕТСЯ: ЕГО ЖДЁТ ЧЕЛОВЕК ═══
        // Первая редакция ловила каждую ошибку в пустой `catch`, и `sdkOff` всегда
        // отвечал успехом - а значит ветка «у себя выключил, но сервер снятие не
        // подтвердил» не выполнялась НИ РАЗУ. Цена видна не нам: соседи продолжают
        // видеть картинку, а человек уверен, что показ снят. Поймала это проба, а не
        // чтение. Дорожки при этом гасим ВСЕ, даже если первая не снялась.
        var bad = null;
        for (var i = 0; i < mine.length; i++) {
          var it = mine[i], tr = (it && it.track) ? it.track : it;
          try { await room.localParticipant.unpublishTrack(tr, true); }
          catch (e) { bad = bad || e; }
          try { tr.stop(); } catch (e) {}
        }
        // СТРАХОВКА НА ЧУЖИЕ ПУБЛИКАЦИИ: если экран когда-то включили СТАРЫМ путём (или
        // это второй клиент того же человека), наш список пуст, а дорожка идёт. Снимаем
        // по ФАКТУ источника, а не по нашей памяти.
        try {
          var pubs = room.localParticipant.trackPublications
                  || room.localParticipant.tracks || new Map();
          var left = [];
          pubs.forEach(function (pub) {
            if (String(pub.source || '').indexOf('screen') >= 0 && pub.track) left.push(pub.track);
          });
          for (var j = 0; j < left.length; j++) {
            try { await room.localParticipant.unpublishTrack(left[j], true); }
            catch (e) { bad = bad || e; }
          }
        } catch (e) {}
        if (bad) throw bad;
        return true;
      }

      async function stopShow() {
        // ПОРЯДОК ЗДЕСЬ ЗНАЧИМ, И ЭТО ПОЙМАЛ БРАУЗЕРНЫЙ ПРОГОН. Сперва гасим САМИ
        // дорожки (пока публикации ещё на месте), потом отключаем источник: наоборот
        // `setScreenShareEnabled(false)` уже снял публикации, и явная остановка работала
        // ВХОЛОСТУЮ - счётчик остановленных дорожек показывал ноль. Незакрытая дорожка
        // держит захват, и следующий выбор источника ведёт себя непредсказуемо.
        stopLocalMedia(kind);
        // ═══ ЛОКАЛЬНО МЫ УЖЕ ВЫКЛЮЧЕНЫ, ЧТО БЫ НИ ОТВЕТИЛ SDK ═══
        // Захват снят строкой выше, значит честное состояние кнопки - «выключено», и
        // ставим его ДО просьбы к SDK. ПРЕЖНЯЯ РЕДАКЦИЯ ДЕЛАЛА НАОБОРОТ: на исключении
        // она оставляла live=true и класс `.on`, следующий тап снова шёл в остановку,
        // снова падал - и человек был заперт до перезахода (живой отказ Ren:
        // «waiting for pending publication promise timed out», кнопка залипает).
        live = false;
        // ОКНО УХОДИТ ВМЕСТЕ С ЗАХВАТОМ, А НЕ ЖДЁТ СОБЫТИЯ ОТ SDK: `LocalTrackUnpublished`
        // может прийти с уже обнулённым `pub.track` - тогда плитка остаётся тёмной
        // навсегда (живой отзыв 29.08). Уборка идёт по ФАКТУ мёртвой дорожки.
        sweepVideos();
        try {
          await sdkOff();
          sweepVideos();
          say('');
        } catch (e) {
          sweepVideos();
          // ГОВОРИМ РОВНО ТО, ЧТО ЗНАЕМ: у себя выключили, а снял ли публикацию сервер -
          // не знаем. Молчаливое «выключено» здесь было бы обещанием соседям, которое мы
          // не можем сдержать.
          say('У себя ' + word.toLowerCase() + ' выключил, но сервер снятие не подтвердил ('
              + (e && e.message || e) + '). Соседи могут ещё пару секунд видеть картинку.',
              true);
          watchEngine('Показ снят у себя, но соединение в переподключении.');
        }
      }

      // ═══ СТАДИЯ НАЗЫВАЕТСЯ ВСЛУХ, ИНАЧЕ СЛЕДУЮЩИЙ ЖИВОЙ ПРОГОН СНОВА НЕ ОТВЕТИТ ═══
      // Шесть кругов подряд разбор упирался в одно: «залипло, и непонятно, где». Стадий
      // всего три (запросил экран -> поток получен -> опубликовано), и та, на которой
      // встало, отвечает на вопрос сразу: нет второй - молчит `getDisplayMedia` (диалог
      // не открылся), нет третьей - молчит `publishTrack` (держит SDK).
      // ИМЯ СВОЁ, А НЕ `stage`: наверху уже живёт `stage()` - сторож ЗАГРУЗКИ страницы,
      // и второе имя того же вида читателю неразличимо, а при удалении внутреннего
      // вызовы молча поехали бы в чужой сторож и испортили бы его диагностику
      // (закон №26: локальное имя не совпадает с модульным). Поймал собственный `rtc17`.
      //: ═══ СТАДИЯ ОБЯЗАНА ДОЙТИ ДО ЧЕЛОВЕКА, А НЕ ТОЛЬКО ДО КОНСОЛИ ═══
      //: ЖИВОЙ ОТКАЗ Ren 31.08: «после камеры выбрал «весь экран» -> ничего, висит «Жду
      //: окно выбора экрана»». Диалог при этом ОТКРЫЛСЯ и человек в нём ВЫБРАЛ - то есть
      //: `getDisplayMedia` отработала, и висела уже ПУБЛИКАЦИЯ. А на экране оставалась
      //: подсказка ПЕРВОЙ стадии: `say()` пишет строку, и никто её не перебивал ещё
      //: двадцать пять секунд, до сторожа публикации.
      //: ЦЕНА ЭТОГО НЕ В КОСМЕТИКЕ: подпись НАЗЫВАЛА НЕ ТУ СТАДИЮ, и следующий разбор
      //: снова ушёл бы в окно выбора - в исправную половину. Стадии у нас посчитаны с
      //: прошлого захода, до человека они просто не доезжали. На телефоне консоли нет.
      var SHOW_SAY = {
        'запросил экран': '',            // первую стадию озвучивает мягкая подсказка
        'публикую дорожки': 'Экран взял, отдаю его комнате - это пара секунд.',
      };
      function showStage(what) {
        try { console.log('[показ] ' + what); } catch (e) {}
        try { window.__STAGE = (window.__STAGE || []); window.__STAGE.push(what); } catch (e) {}
        //: ═══ ТА ЖЕ СТАДИЯ УХОДИТ В bot.log ═══
        //: Первая стадия ОТКРЫВАЕТ ленту (обнуляет часы), последняя её ЗАКРЫВАЕТ - иначе
        //: отправка ждала бы тишины ещё секунду после того, как всё уже кончилось, а
        //: человек в это время успевает тапнуть снова.
        try {
          if (String(what).split(':')[0] === 'запросил экран') diagStart('показ');
          diag(what);
          if (String(what).split(':')[0] === 'опубликовано') diagFlush();
        } catch (e) {}
        try {
          var head = String(what).split(':')[0];
          if (head === 'поток получен') {
            say('Экран взял, отдаю его комнате - это пара секунд.', true);
          } else if (SHOW_SAY[head]) {
            say(SHOW_SAY[head], true);
          }
        } catch (e) {}
      }

      // ═══ ДИАЛОГ НЕ ОТКРЫЛСЯ - ГОВОРИМ ЭТО И ДАЁМ ВЫХОД ═══
      // ФАКТ (живой прогон Ren 31.08, две точки): при свежем заходе в Telegram WebView
      // диалог появляется, ПОСЛЕ включённой камеры - нет вовсе. Значит поддержка есть, а
      // ломается сочетание; из кода этого не установить (закон №48), но молчать нельзя.
      // Называем ОБА выхода: выключить камеру и попробовать снова, либо открыть комнату в
      // обычном браузере - там показ работает (тот же прогон).
      function sayNoPicker() {
        var camOn = false;
        try {
          camOn = !!(document.getElementById('cam')
                     && document.getElementById('cam').classList.contains('on'));
        } catch (e) {}
        //: ═══ ФРАЗА ПРЯМАЯ, ПОТОМУ ЧТО ОТВЕТ МЫ УЖЕ ЗНАЕМ (лента 01.09) ═══
        //: Раньше здесь стояло «окно не открылось» - и это ВЕРНО не всегда: у Ren оно
        //: как раз открылось, он выбрал окно, а промис не вернулся. Две разные вещи под
        //: одной фразой отправляли разбор искать диалог, который был.
        //: Различаем по ленте: дошли до «поток получен» - вызов ответил; не дошли -
        //: Telegram не отдал экран, и чинить это у себя нечем.
        var t = 'Telegram не отдал экран за ' + Math.round(SCREEN_PICK_MS / 1000) + ' с';
        t += camOn
          ? ' (у него это чаще всего при включённой камере - её можно выключить и'
            + ' попробовать снова).'
          : '. Выбрал ты окно или диалог не появился - ему всё равно: ответа нет.';
        t += ' Открой комнату в браузере - там показ работает.';
        say(t, true);
        showBrowserWay();
      }

      //: ═══ ПЕРЕЗАХОД: НОВЫЙ ДОКУМЕНТ ВМЕСТО ПОВИСШЕГО ВЫЗОВА ═══
      //: `location.reload()` не годится: часть вебвью отдаёт документ из кэша вместе с
      //: состоянием, а нам нужен именно ЧИСТЫЙ лист - висящий `getDisplayMedia`
      //: принадлежит документу и умирает только вместе с ним. Поэтому уходим на ТОТ ЖЕ
      //: адрес с новой меткой: для вебвью это другой URL, и он его не переиспользует.
      //: ПАРАМЕТРЫ ССЫЛКИ СОХРАНЯЮТСЯ ЦЕЛИКОМ - в них имя комнаты, язык и адрес
      //: эндпоинта; потеряй мы их, человек попал бы не в свою комнату (этот класс уже
      //: стоил круга у плеера, когда самообновление стирало `screen` и `fav`).
      function showRejoinWay() {
        var b = document.getElementById('rejoin');
        if (!b) return;
        b.style.display = '';
        b.onclick = function () {
          b.disabled = true;
          try {
            var u = new URL(location.href);
            u.searchParams.set('rj', String(Date.now()));
            location.replace(u.toString());
          } catch (e) {
            try { location.reload(); } catch (e2) {}
          }
        };
      }

      //: ═══ ПОВТОР ТЕМ ЖЕ ПОТОКОМ: ОКНО УЖЕ ВЫБРАНО, ВЫБИРАТЬ ЗАНОВО НЕЧЕГО ═══
      //: ТРЕБОВАНИЕ REN (6-й заход): «поток получен, а публикация не идёт - сказать это
      //: словами и предложить повтор, не оставляя серую кнопку». Сегодня отказ гасил
      //: захват, и человек шёл в диалог по второму кругу - а диалог как раз и есть то
      //: место, где половина попыток и теряется.
      //: ДЕРЖИМ ОГРАНИЧЕННО И ГОВОРИМ, КОГДА ОТПУСТИЛИ. Незакрытый захват - это «идёт
      //: доступ к экрану» в браузере над комнатой, где ничего не показывается: висеть
      //: вечно он не имеет права, а исчезнуть молча - тем более.
      var RETRY_KEEP_MS = 90000;
      var _retryBtn = null, _retryTimer = null;
      function dropRetry(stream, why) {
        clearTimeout(_retryTimer); _retryTimer = null;
        if (_retryBtn) { _retryBtn.style.display = 'none'; }
        if (stream && stream.getTracks) {
          try { stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); }
          catch (e) {}
        }
        if (why) say(why, true);
      }
      function offerShowRetry(stream) {
        //: ПРЕДЛАГАЕМ, ТОЛЬКО ЕСЛИ ЕСТЬ ЧТО ПОВТОРИТЬ. Мёртвую дорожку публиковать
        //: бессмысленно: у соседей она станет чёрным квадратом, а человек решит, что
        //: показ идёт (закон №35 - проверяем ФАКТ, а не то, что поток у нас в руке).
        var vt = null;
        try { vt = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null; }
        catch (e) { vt = null; }
        if (!vt || vt.readyState !== 'live') { dropRetry(stream, ''); return false; }
