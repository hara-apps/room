  // Chromium 141 на `addTransceiver('audio')`:
  //     a=rtpmap:111 opus/48000/2
  //     a=fmtp:111 minptime=10;useinbandfec=1      <- FEC УЖЕ ВКЛЮЧЁН БРАУЗЕРОМ
  //     a=rtpmap:63 red/48000/2                    <- RED тоже предлагается сам
  // и ровно та же строка стоит в СОГЛАСОВАННОМ описании после ответа второй стороны
  // (проверено локальным созвоном двух RTCPeerConnection). То есть требование ТЗ
  // «in-band FEC» выполнено БЕЗ ЕДИНОЙ НАШЕЙ СТРОКИ - включать нечего.
  //
  // ЧЕГО ЗАДАТЬ НЕЛЬЗЯ, И ПОЧЕМУ ЭТО НЕ НАША ЛЕНЬ: `packetLossPerc` - это подсказка
  // кодеку, на какой процент потерь рассчитывать силу избыточности. Путей к ней три, и
  // все три закрыты. (1) У livekit-client в `TrackPublishDefaults` такого поля нет
  // вовсе, а его собственный munging звукового SDP трогает РОВНО `maxaveragebitrate`
  // (плюс `stereo=1` у forceStereo) - прочитано в исходнике 2.7.2, а не по памяти.
  // (2) `setCodecPreferences` с дописанным `sdpFmtpLine` браузер ОТВЕРГАЕТ:
  // «InvalidModificationError: Missing codec from codec capabilities» - измерено.
  // (3) Свой munging требует хука в `setLocalDescription`, которого SDK не даёт.
  // ПРИ ЭТОМ ПОТЕРИ И ТАК УЧИТЫВАЮТСЯ: приёмник сообщает их отправителю в RTCP, и
  // Opus в Chrome подстраивает силу FEC сам. `packetLossPerc` задал бы лишь НАЧАЛЬНОЕ
  // значение до первого отчёта, то есть первые секунды разговора.
  //
  // ЧТО У НАС ПРАВДА ЕСТЬ - ПОТОЛОК БИТРЕЙТА, И ОН ДВИГАЕТСЯ В ОБЕ СТОРОНЫ. Замер на
  // живом локальном созвоне: `targetBitrate` 32000 -> задали `encodings[0].maxBitrate =
  // 24000` -> стало 24000 -> сняли ограничение -> вернулось 32000. То есть рычаг
  // работает, и обратный путь у него тоже (закон №55).
  //
  // ПОЧЕМУ ЭТО НЕ СПОРИТ С `audioPreset.maxBitrate`: то число SDK кладёт в SDP
  // (`maxaveragebitrate`), наше - в параметры отправителя. Оба ограничивают, побеждает
  // меньшее, и снятие нашего возвращает поведение к тому, что задано в SDP.
  //
  // ОТКУДА ЗНАЕМ, ЧТО НАС ПЛОХО СЛЫШАТ. Тут зеркало замера приёма, и это стоит помнить:
  // в отчёте ПРИЁМНИКА `remote-inbound-rtp` не бывает вовсе (там `inbound-rtp`), а в
  // отчёте ОТПРАВИТЕЛЯ он ЕСТЬ и описывает, как нас слышат на той стороне - проверено
  // тем же локальным созвоном (`packetsLost`, `fractionLost`, `jitter`, `roundTripTime`).
  var TX_BR_LO = 24 * 1000;   // куда садимся при потерях (число из ТЗ)
  // ПОТОЛОК ВЕРХА - НЕ ВТОРАЯ КОПИЯ ЧИСЛА, А ТО ЖЕ САМОЕ `AUD_BR` (закон №40): разъедься
  // они, «вернули как было» означало бы «поставили другое».
  var TX_CALM = 3;            // столько чистых окон подряд, прежде чем вернуть верх
  var txPrev = {};            // sid -> прошлый срез счётчиков отправки
  var txState = {};           // sid -> {low: сидим ли внизу, calm: чистых окон}
  var txSaid = false;         // сказали ли уже, что ручки у этого клиента нет

  function txPubs() {
      //: -> список своих публикаций. Форма реестра у разных сборок SDK разная, поэтому
      //: спрашиваем оба имени и НЕ придумываем, если не нашли (та же осторожность, что
      //: в `senderOf`).
      var out = [];
      if (!room || !room.localParticipant) return out;
      var m = room.localParticipant.trackPublications || room.localParticipant.tracks;
      if (m && m.forEach) m.forEach(function (p) { out.push(p); });
      return out;
  }

  async function txBitrate() {
      //: -> {moved: сколько дорожек тронули, loss: последняя доля потерь, why: строка}
      //: Зовётся из того же тика, что замер приёма: вопрос один («сеть плохая»), и
      //: второй период сделал бы решения о звуке несинхронными без единой причины.
      var res = { moved: 0, loss: 0, why: '' };
      var pubs = txPubs();
      for (var i = 0; i < pubs.length; i++) {
          var pub = pubs[i];
          var kind = (pub.kind || (pub.track && pub.track.kind) || '').toString();
          if (kind.indexOf('audio') < 0) continue;
          var snd = senderOf(pub);
          if (!snd || typeof snd.getStats !== 'function'
                   || typeof snd.setParameters !== 'function') {
              if (!txSaid) {
                  txSaid = true;
                  console.warn('[tx] битрейт: у этого клиента ручки отправителя нет - '
                             + 'подстраивать нечем, звук идёт как есть');
              }
              continue;
          }
          var sid = pubSid(pub, 'a' + i);
          var rep = null;
          try { rep = await snd.getStats(); } catch (e) { continue; }
          var lost = null, sent = null;
          rep.forEach(function (st) {
              if (st.type === 'remote-inbound-rtp' && String(st.kind) === 'audio') {
                  lost = Number(st.packetsLost || 0);
              } else if (st.type === 'outbound-rtp' && String(st.kind) === 'audio') {
                  sent = Number(st.packetsSent || 0);
              }
          });
          //: ОТЧЁТА ПРИЁМНИКА МОЖЕТ НЕ БЫТЬ ЕЩЁ ВОВСЕ (первые секунды, пока не пришёл
          //: первый RTCP). Это НЕ «потерь ноль»: посчитав так, мы бы вернули верхний
          //: битрейт ровно в тот момент, когда о качестве не знаем ничего (закон №22).
          if (lost === null || sent === null) continue;
          var pv = txPrev[sid];
          txPrev[sid] = { lost: lost, sent: sent };
          if (!pv) continue;                       //: первое окно - сравнивать не с чем
          var dl = lost - pv.lost, ds = sent - pv.sent;
          if (ds <= 0) continue;                   //: молчали (DTX) - судить не по чему
          if (dl < 0) dl = 0;                      //: счётчик перезапустился
          var loss = (dl / (ds + dl)) * 100;
          res.loss = Math.max(res.loss, loss);
          var st = txState[sid] || { low: false, calm: 0 };
          var want = st.low;
          //: ПОРОГ ТОТ ЖЕ, ЧТО У ПРИЁМА (`LOSS_BAD`), И ЭТО НЕ ЭКОНОМИЯ: вопрос один и
          //: тот же - «сеть плохая», - а два числа однажды разъехались бы, и человеку
          //: пришлось бы объяснять, почему приём уже жалуется, а отправка ещё нет.
          if (loss > LOSS_BAD) { st.calm = 0; want = true; }
          else if (st.low) { st.calm++; if (st.calm >= TX_CALM) { want = false; st.calm = 0; } }
          if (want === st.low) { txState[sid] = st; continue; }
          var br = want ? TX_BR_LO : AUD_BR;
          var got = null;
          try {
              var prm = snd.getParameters();
              if (!prm || !prm.encodings || !prm.encodings[0]) continue;
              prm.encodings[0].maxBitrate = br;
              await snd.setParameters(prm);
              //: ЧИТАЕМ ОБРАТНО (закон №35): «мы позвали setParameters» и «потолок
              //: применён» - разные утверждения, а решение о звуке принимают по второму.
              var back = snd.getParameters();
              got = back && back.encodings && back.encodings[0]
                  ? back.encodings[0].maxBitrate : null;
          } catch (e) {
              console.warn('[tx] битрейт ' + sid + ': не приняли ' + br + ' - ' + e);
              continue;
          }
          if (got !== br) {
              //: МОЛЧАЛИВЫЙ ОТКАЗ ЗАПРЕЩЁН: приняли просьбу и не применили - это тот же
              //: мир, что «согласился и ничего не сделал» у applyConstraints.
              console.warn('[tx] битрейт ' + sid + ': просили ' + br + ', стоит ' + got
                         + ' - подстройка не работает, звук идёт как есть');
              continue;
          }
          st.low = want; txState[sid] = st; res.moved++;
          res.why = (want ? 'сел на ' : 'вернул ') + Math.round(br / 1000) + ' кбит/с';
          console.log('[tx] битрейт ' + sid + ': ' + Math.round(br / 1000)
                    + ' кбит/с (нас теряют ' + loss.toFixed(1) + '%)');
          try {
              diag('битрейт ' + Math.round(br / 1000) + ' кбит/с, потери у слушателей '
                 + loss.toFixed(1) + '%', 'сеть');
          } catch (e) {}
      }
      return res;
  }
  try { window.txBitrate = txBitrate; } catch (e) {}

  //: КОГО ИМЕННО МЫ ПОСАДИЛИ. Возвращать надо РОВНО ИХ, а не всё видео подряд: у
  //: остальных слой выбирает `adaptiveStream` по размеру плитки, и наш «возврат» стал бы
  //: тихой отменой его работы - маленькое окно навсегда получало бы полное разрешение.
  var rxLowSids = {};

  function rxVidEl(pub) {
      //: Плитка этой дорожки. `vids` - наш же реестр окон (`addVideo`).
      var t = pub && pub.track;
      if (!t) return null;
      for (var i = 0; i < vids.length; i++) {
          if (vids[i].t === t) { try { return vids[i].el.querySelector('video'); } catch (e) {} }
      }
      return null;
  }

  function rxEachRemotePub(want, fn) {
      //: ОДИН ОБХОД НА ВСЕ СТОРОНЫ: копии «как найти чужую дорожку» разошлись бы, и
      //: обратный путь однажды пропустил бы ту, которую прямой тронул (закон №40).
      //: `want` - вид дорожки ('video' либо 'audio'): у видео мы садимся на нижний слой,
      //: у звука просим буфер побольше, но ищутся они одинаково.
      if (!room) return 0;
      var n = 0, ps = [];
      room.remoteParticipants.forEach(function (p) { ps.push(p); });
      for (var i = 0; i < ps.length; i++) {
          var pubs = [], m = ps[i].trackPublications || ps[i].tracks;
          if (m && m.forEach) m.forEach(function (pub) { pubs.push(pub); });
          for (var k = 0; k < pubs.length; k++) {
              var pub = pubs[k];
              var kind = String(pub.kind || (pub.track && pub.track.kind) || '');
              if (kind.indexOf(want) < 0) continue;
              var sid = pubSid(pub, '');
              if (!sid) continue;
              try { if (fn(pub, sid)) n++; } catch (e) {}
          }
      }
      return n;
  }

  function rxLowerVideo() {
      //: САДИМСЯ НА НИЖНИЙ СЛОЙ, А НЕ ОТКАЗЫВАЕМСЯ ОТ ВИДЕО. Человек пришёл смотреть
      //: показ экрана; отняв картинку целиком, мы решили бы за него. Simulcast для того
      //: и включён - у дорожки есть слои LOW/MEDIUM/HIGH, и слабому каналу берётся LOW.
      //: -> сколько дорожек посадили.
      if (!room || !LOW_ON_BAD) return 0;
      var Q = (LK.VideoQuality && LK.VideoQuality.LOW);
      if (Q === undefined || Q === null) return 0;
      var n = rxEachRemotePub('video', function (pub, sid) {
          if (typeof pub.setVideoQuality !== 'function') return false;
          pub.setVideoQuality(Q);
          rxLowSids[sid] = 1;          //: помним ИМЕННО ЭТУ - вернём тоже её
          return true;
      });
      if (n) console.log('[rtc] слабый приём: посадил ' + n + ' видео на нижний слой');
      return n;
  }

  function rxRestoreVideo() {
      //: ОБРАТНЫЙ ПУТЬ ОБЯЗАТЕЛЕН (закон №55). Связь выправилась - картинку возвращаем,
      //: иначе один плохой десятисекундный отрезок навсегда оставлял бы человека с
      //: мылом вместо показа, и понять почему он не смог бы ничем.
      //:
      //: ВОЗВРАЩАЕМ УПРАВЛЕНИЕ `adaptiveStream`, А НЕ ПРИБИВАЕМ К HIGH. У SDK эти два
      //: способа исключают друг друга: заданное качество отменяет выбор по размеру
      //: плитки, а заданный размер - выбор качества. Прибей мы HIGH, маленькое окно
      //: после первого же плохого отрезка навсегда тянуло бы полное разрешение - то
      //: есть «лечение» жгло бы полосу сильнее болезни. Размер берём у САМОГО элемента:
      //: это ровно то, чем adaptiveStream и руководствуется.
      if (!room) return 0;
      var n = rxEachRemotePub('video', function (pub, sid) {
          if (!rxLowSids[sid]) return false;      //: эту дорожку сажали не мы
          var el = rxVidEl(pub);
          var w = el && (el.clientWidth || el.videoWidth);
          var h = el && (el.clientHeight || el.videoHeight);
          if (typeof pub.setVideoDimensions === 'function' && w > 0 && h > 0) {
              pub.setVideoDimensions({ width: Math.round(w), height: Math.round(h) });
          } else if (typeof pub.setVideoQuality === 'function') {
              //: ЗАПАСНОЙ ПУТЬ, И ЕГО ЦЕНА НАЗВАНА: размера нет (окно скрыто, метод у
              //: этой сборки SDK отсутствует) - прибиваем HIGH. Это хуже адаптивного
              //: выбора, но лучше, чем оставить человека с нижним слоем навсегда.
              var Q = (LK.VideoQuality && LK.VideoQuality.HIGH);
              if (Q === undefined || Q === null) return false;
              pub.setVideoQuality(Q);
          } else {
              return false;
          }
          delete rxLowSids[sid];
          return true;
      });
      if (n) console.log('[rtc] приём выправился: вернул ' + n + ' видео');
      return n;
  }

  async function rxTick() {
      //: ГОВОРИМ ЧЕЛОВЕКУ ПРО ЕГО СОБСТВЕННЫЙ ПРИЁМ, а не молчим при зелёных цифрах.
      //: -> результат замера, он же уезжает боту из `statTick`.
      var r = null;
      try { r = await rxOnce(); } catch (e) { r = null; }
      if (!r) return null;
      //: ═══ АДМИНСКАЯ СТРОКА РИСУЕТСЯ ПЕРВОЙ И БЕЗУСЛОВНО ═══
      //: Она отвечает на ДРУГОЙ вопрос («от кого именно приходит плохо»), и ветки моего
      //: собственного вердикта ниже кончаются возвратом. Нарисуй её после них - в
      //: состоянии «я никого не слышу» строка про участников не появлялась бы вовсе,
      //: ровно тогда, когда она нужнее всего.
      //: БУФЕР ПРОСИТСЯ ПО ДОРОЖКАМ И ДО ВЕТОК ВЕРДИКТА: у него свой признак (доля
      //: дорисованного У ЭТОЙ дорожки) и своё действие. Ветки ниже кончаются возвратом,
      //: и после них лечение не случилось бы ровно в состоянии «я никого не слышу».
      try { rxPlayout(); } catch (e) { console.warn('[rx] буфер:', e); }
      //: СВОЙ БИТРЕЙТ - ТУТ ЖЕ И ПО ТОЙ ЖЕ ПРИЧИНЕ. Он про ОТПРАВКУ, а не про приём
      //: (признак берётся у `remote-inbound-rtp` нашего же отправителя), но ветки ниже
      //: кончаются возвратом, и после них подстройка не случилась бы ровно в состоянии
      //: «я никого не слышу» - то есть у человека с самой плохой связью.
      try { await txBitrate(); } catch (e) { console.warn('[tx] битрейт:', e); }
      var cq = $('connq');
      if (cq) {
          //: МОЛЧАНИЕ КЛИЕНТА НАЗЫВАЕТСЯ ОДИН РАЗ, А НЕ КАЖДЫЕ ДЕСЯТЬ СЕКУНД.
          if (!r.rows.length && !statSaid) {
              statSaid = true;
              cq.textContent = r.peers
                  ? 'Связь: клиент не отдаёт статистику - цифр по участникам не будет.'
                  : '';
          } else if (r.rows.length) {
              statSaid = false;
              cq.textContent = 'Связь (за 10 с): ' + r.rows.join(' · ');
          }
      }
      var box = $('rxq');
      if (r.quiet) {
          //: ЭТО СИЛЬНЕЕ ЛЮБОЙ ЖАЛОБЫ: соседи публикуют звук, а до нас не доходит ничей.
          if (box) box.textContent = 'Ты никого не слышишь: звук соседей до тебя не '
                                   + 'доходит. Проверь связь или перезайди в комнату.';
          if (box) box.style.display = '';
          return r;
      }
      if (r.bad) {
          //: САЖАЕМ НА КАЖДОМ ПЛОХОМ ТИКЕ, А НЕ ОДИН РАЗ. Пока связь плохая, сосед может
          //: включить камеру - при «уже посадили, больше не трогаем» его дорожка пришла бы
          //: полным слоем ровно в тот момент, когда человеку и без неё тяжело.
          rxLowerVideo();
          if (box) {
              box.textContent = 'Связь слабая, звук рвётся (' + cut(r.why, 90) + '). '
                              + (rxIsLow() ? 'Видео убавил. ' : '')
                              + 'Если не помогло - выключи камеру и показ экрана.';
              box.style.display = '';
          }
          rxSaidAt = Date.now();
          return r;
      }
      //: ВЫПРАВИЛОСЬ - СНИМАЕМ И ГОВОРИМ ЭТО. Строка, которая осталась висеть после
      //: того, как всё наладилось, читается как «до сих пор плохо».
      if (rxIsLow()) rxRestoreVideo();
      if (box && box.style.display !== 'none' && Date.now() - rxSaidAt > 8000) {
          box.textContent = ''; box.style.display = 'none';
      }
      return r;
  }
  //: ═══ ОДНА ДВЕРЬ НАРУЖУ ДЛЯ ПРОБЫ, А НЕ ТРИ ═══
  //: Здесь ЦЕПОЧКА решений: замер -> буфер -> битрейт -> показ, и порядок в ней несущий
  //: (ветки вердикта кончаются возвратом, а лечение обязано случиться ДО них). Открой я
  //: наружу три звена по отдельности, проба гоняла бы СВОЙ порядок, а не наш - и первая
  //: же перестановка внутри осталась бы незамеченной. Плюс так проба не ждёт тика
  //: вслепую: слепое ожидание против чужого периода уже породило круг, который краснеет
  //: на верном коде через раз.
  try { window.rxTick = rxTick; } catch (e) {}

  // ═════════════ ДЕТЕКТОР ГУЛА: МЕРИМ СОДЕРЖАНИЕ, А НЕ ДОСТАВКУ ═════════════
  //: ПОЧЕМУ НЕ `audioLevel` ИЗ getStats, ХОТЯ ПОЛЕ У НАС УЖЕ СОБИРАЕТСЯ. `rxOnce` правда
  //: читает `st.audioLevel` (поле `lvl`), и до этой правки его не читал НИКТО - мёртвая
  //: строка. Но и прочитай мы его, этого не хватило бы: `rxTick` зовётся из `statTick`
  //: раз в `STAT_EVERY` = 10 секунд, то есть 0.1 Гц. Провал между словами длится 0.2-0.8 с
  //: - ОДИН замер в десять секунд не даёт распределения ВООБЩЕ, он даёт случайную точку.
  //: Поднять же getStats до 10 Гц на дюжине участников значит 120 вызовов в секунду.
  //: ПОЭТОМУ АНАЛИЗАТОР: он читает уже декодированный звук, стоит микросекунды на кадр и
  //: не зависит от того, отдаёт ли браузер `audioLevel` (Safari, например, не отдаёт).
  //:
  //: ТАП, А НЕ ЗАХВАТ. `createMediaStreamSource` СЛУШАЕТ дорожку, оставляя её элементу;
  //: это принципиально не `createMediaElementSource`, который забирает звук элемента в
  //: граф НАВСЕГДА (мы уже обожглись на нём в усилении громкости).
  var humCtx = null, humNodes = {}, humTimer = 0, humSaid = {}, humWhy = '';
  var humRep = {};              //: о ком -> {кто сказал: когда}
  var humBad = {};              //: чей sid -> сколько секунд подряд держится признак

  function humPct(a, x) {
    //: Квантиль по отсортированному массиву. Та же форма, что в `verdict` у детектора
    //: шума: разброс это p90-p10, а не max-min - одиночный щелчок не должен решать.
    return a[Math.min(a.length - 1, Math.floor(x * (a.length - 1)))];
  }

  function humVerdict(st) {
    //: -> {db, spread, grow} либо null, если кадров ещё мало.
    if (!st || st.a.length < HUM.WIN) return null;
    var s = st.a.slice().sort(function (x, y) { return x - y; });
    //: РОСТ - ЭТО ПОДПИСЬ ИМЕННО АКУСТИЧЕСКОЙ ПЕТЛИ («она РАСТЁТ», слова Ren). В гейт он
    //: НЕ входит: петля, упёршаяся в потолок, расти перестаёт, и требовать роста значило
    //: бы промолчать ровно тогда, когда громче всего. Но в отчёт он идёт - по нему потом
    //: отличают петлю от вентилятора.
    var h = Math.floor(st.a.length / 3), n = st.a.length;
    var f = 0, l = 0;
    for (var i = 0; i < h; i++) { f += st.a[i]; l += st.a[n - 1 - i]; }
    return { db: humPct(s, 0.5), spread: humPct(s, 0.9) - humPct(s, 0.1),
             grow: (l - f) / h };
  }

  function humEachMic(fn) {
    //: Каждая ЧУЖАЯ МИКРОФОННАЯ дорожка. -> сколько обошли.
    //: БОТОВ ИСКЛЮЧАЕМ, И ЭТО НЕ ПЕДАНТИЗМ: радио - ровный громкий сигнал по построению,
    //: то есть идеальный ложный гул. Источник тоже строго микрофон: звук вкладки при
    //: показе экрана (музыка в ролике) выглядит так же ровно.
    if (!room) return 0;
    var n = 0, ps = [];
    room.remoteParticipants.forEach(function (p) { ps.push(p); });
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      if (String(p.identity || '').indexOf('bot-') === 0) continue;
      var pubs = [], m = p.trackPublications || p.tracks;
      if (m && m.forEach) m.forEach(function (pub) { pubs.push(pub); });
      for (var k = 0; k < pubs.length; k++) {
        var pub = pubs[k];
        if (String(pub.source || '') !== 'microphone') continue;
        var t = pub.track, ms = t && t.mediaStreamTrack;
        if (!ms) continue;
        var sid = String(pub.trackSid || (t && t.sid) || (p.identity + ':' + k));
        try { if (fn(p, sid, ms)) n++; } catch (e) {}
      }
    }
    return n;
  }

  function humTick() {
    //: ОДИН ПРОХОД: завести анализатор новым дорожкам, убрать ушедшим, снять кадр, судить.
    if (!room || !connected || !humCtx) return;
    //: КОНТЕКСТ МОГ УСНУТЬ (вебвью, звонок поверх). Спящий отдаёт ТИШИНУ, и судить по ней
    //: значило бы отвечать «никто не гудит» там, где мы просто не слышим (закон №22).
    if (!ctxRunning(humCtx)) {
      try { ctxWake(humCtx); } catch (e) {}
      return;
    }
    var live = {};
    humEachMic(function (p, sid, ms) {
      live[sid] = 1;
      var st = humNodes[sid];
      if (!st) {
        var an = humCtx.createAnalyser();
        an.fftSize = 1024; an.smoothingTimeConstant = 0;
        var src = humCtx.createMediaStreamSource(new MediaStream([ms]));
        src.connect(an);
        st = humNodes[sid] = { an: an, src: src, id: p.identity, a: [],
                               buf: new Float32Array(an.fftSize) };
      }
      st.id = p.identity;
      st.a.push(frameDbTop(st.an, st.buf));
      if (st.a.length > HUM.WIN) st.a.shift();
      return true;
    });
    //: УШЕДШИЕ УБИРАЮТСЯ, ИНАЧЕ УЗЛЫ КОПЯТСЯ ДО КОНЦА СОЗВОНА. Их состояние сносим
    //: целиком: вернувшийся человек начинает с чистого окна, а не с чужой историей.
    for (var sid in humNodes) {
      if (live[sid]) continue;
      try { humNodes[sid].src.disconnect(); } catch (e) {}
      delete humNodes[sid];
      delete humBad[sid];
    }
    for (var sid2 in humNodes) {
      var s2 = humNodes[sid2], v = humVerdict(s2);
      if (!v) continue;
      var hum = (v.spread < HUM.SPREAD_DB && v.db > HUM.FLOOR_DB);
      var was = humBad[sid2] || 0;
      humBad[sid2] = hum ? (was + HUM.TICK_MS / 1000) : 0;
      //: СНЯТИЕ - ТОЖЕ СОБЫТИЕ, И ЕГО НАДО ПОСЛАТЬ. Молча перестать повторять недостаточно:
      //: у обвинённого на экране висит крупная плашка, и убрать её может только сообщение.
      if (!hum && was >= HUM.HOLD_SEC) humSay(s2.id, null);
      if (!hum || humBad[sid2] < HUM.HOLD_SEC) continue;
      var last = humSaid[s2.id] || 0;
      if (Date.now() - last < HUM.SAY_EVERY * 1000) continue;
      humSaid[s2.id] = Date.now();
      humSay(s2.id, v);
    }
  }

  function humSay(id, v) {
    //: СООБЩАЕМ ВСЕЙ КОМНАТЕ, А НЕ АДРЕСНО. Плашку показывает САМ обвинённый (он
    //: единственный, кто гула не слышит), строку - админ (у него есть чем это прекратить),
    //: и оба должны СОГЛАСОВАННО посчитать, сколько слушателей сошлось. Считать это может
    //: только тот, кто видит все отчёты, - значит рассылка общая.
    if (!roomSend) return;
    try {
      roomSend(v ? { t: 'hum', who: id, db: Math.round(v.db),
                     spread: Math.round(v.spread), grow: Math.round(v.grow) }
                 : { t: 'hum', who: id, off: 1 });
    } catch (e) {}
  }

  function humStart() {
    //: ЗАВОДИТСЯ ОДИН РАЗ ЗА СЕССИЮ И ПОСЛЕ ВХОДА: к этому моменту человек уже тапал
    //: (кнопка входа, микрофон), то есть жест у контекста есть.
    if (humCtx) return;
    try {
      humCtx = regCtx(new (window.AudioContext || window.webkitAudioContext)(),
                      'детектор гула');
      humTimer = setInterval(humTick, HUM.TICK_MS);
      try { window.__HUMON = 1; } catch (e) {}
    } catch (e) {
      //: НЕ ЗАВЕЛСЯ - ЭТО НЕ ПОЛОМКА РАЗГОВОРА, НО И НЕ ТИШИНА. Без этой строки «никто не
      //: гудел» и «мы не слушали» выглядели бы одинаково.
      humWhy = String((e && e.message) || e);
      console.warn('[hum] детектор не завёлся:', e);
      try { diag('детектор не завёлся: ' + humWhy, 'гул'); } catch (e2) {}
    }
  }

  function humStop() {
    if (humTimer) { try { clearInterval(humTimer); } catch (e) {} humTimer = 0; }
    for (var sid in humNodes) { try { humNodes[sid].src.disconnect(); } catch (e) {} }
    humNodes = {}; humBad = {};
    if (humCtx) { try { humCtx.close(); } catch (e) {} humCtx = null; }
  }

  function humAgree(id) {
    //: Сколько РАЗНЫХ слушателей сказали про этого человека за последнее окно. Порог
    //: опускается до одного, когда слушатель в комнате физически один.
    var m = humRep[String(id)] || {}, n = 0, now = Date.now();
    //: ОТМЕТКА ВРЕМЕНИ, А НЕ САМ ОТЧЁТ. Здесь стояло `now - m[k]`, где `m[k]` это
    //: ОБЪЕКТ `{at, db, spread, grow}`: вычитание давало NaN, любое сравнение с ним
    //: ложно, и согласие не набиралось НИ РАЗУ - то есть плашка не показывалась
    //: никому, строки админу не было, и в `bot.log` не уезжало ничего. Детектор при
    //: этом честно считал и слал отчёты: сломана была ровно та половина, которую
    //: видит человек. Чтением не видно - обе строки выглядят верно (нашла проба).
    for (var k in m) {
      if (now - (m[k] && m[k].at || 0) < (HUM.SAY_EVERY + HUM.CLEAR_SEC) * 1000) n++;
    }
    //: СКОЛЬКО НАС ВООБЩЕ: люди минус боты минус сам обвинённый.
    var live = 0;
    for (var pid in people) {
      if (String(pid).indexOf('bot-') === 0) continue;
      if (String(pid) === String(id)) continue;
      live++;
    }
    return n >= Math.min(HUM.AGREE, Math.max(1, live));
  }

  function humNote(id) {
    //: Последний отчёт о человеке - берём САМЫЙ СВЕЖИЙ, а не первый попавшийся: цифры у
    //: разных слушателей разные (у каждого свой канал), и показывать надо актуальные.
    var m = humRep[String(id)] || {}, best = null;
    for (var k in m) { if (!best || m[k].at > best.at) best = m[k]; }
    return best;
  }

  function humPaint() {
    //: ═══ ДВА АДРЕСАТА, И ОНИ РАЗНЫЕ ПО СУЩЕСТВУ ═══
    //: Обвинённому - крупная плашка и действие: он единственный, кто гула не слышит.
    //: Админу - строка с именем и заглушением: у него есть чем это прекратить.
    var box = $('humwarn');
    if (box) {
      var mine = myIdent && humAgree(myIdent);
      var v = mine ? humNote(myIdent) : null;
      box.style.display = mine ? '' : 'none';
      if (mine && v) {
        //: ЧТО ИМЕННО МЫ УТВЕРЖДАЕМ - ЭТО ФАКТ СЛУШАТЕЛЕЙ, А НЕ ДИАГНОЗ ЕГО МИКРОФОНА.
        //: Формулировка «тебя СЛЫШАТ с гулом» и правдива, и не спорит с человеком, если
        //: он уверен в обратном (закон №51): мы сообщаем, что дошло до других.
        $('humtext').textContent =
          'Тебя слышно ровным гулом без пауз (' + v.db + ' дБ, разброс ' + v.spread
          + ' дБ' + (v.grow > 1 ? ', и он нарастает' : '') + '), и сказали об этом '
          + v.n + ' ' + (v.n === 1 ? 'человек' : 'человека') + '. Сам ты его не слышишь: '
          + 'так выглядит петля от динамика в микрофон. Надень наушники - это лечит её '
          + 'целиком. Шумодав тут не поможет: он берёт ровный шум, а петля растёт.';
      }
    }
    var ab = $('admhum');
    if (!ab) return;
    ab.textContent = '';
    if (!iAmAdm) return;
    for (var id in humRep) {
      if (!humAgree(id)) continue;
      var nv = humNote(id);
      if (!nv) continue;
      var nm = (people[id] && people[id].name) || id;
      var row = document.createElement('p');
      row.className = 'me';
      row.textContent = '🔊 ' + nm + ' гудит: ровный сигнал ' + nv.db + ' дБ, разброс '
                      + nv.spread + ' дБ. Ему это не слышно.';
      ab.appendChild(row);
      if (!admDo) continue;
      var b = document.createElement('button');
      b.className = 'adm wide';
      b.textContent = '🔇 Заглушить ' + nm;
      b.onclick = (function (_id, _nm) {
        return function () { admDo('mute', _id, _nm); };
      })(id, nm);
      ab.appendChild(b);
    }
  }

  function humGot(fromId, m) {
    //: Отчёт слушателя. -> изменилось ли что-то на экране.
    var who = String(m.who || '');
    if (!who) return;
    var bag = humRep[who] || (humRep[who] = {});
    if (m.off) {
      delete bag[String(fromId)];
      if (!Object.keys(bag).length) delete humRep[who];
    } else {
      bag[String(fromId)] = { at: Date.now(), db: Number(m.db) || 0,
                              spread: Number(m.spread) || 0, grow: Number(m.grow) || 0 };
    }
    //: СКОЛЬКО СОШЛОСЬ - СЧИТАЕТСЯ ПРЯМО СЕЙЧАС, а не хранится счётчиком: отчёты
    //: протухают по времени, и счётчик разъехался бы с ними на первом же протухании.
    var bag2 = humRep[who] || {};
    var n = Object.keys(bag2).length;
    for (var k in bag2) bag2[k].n = n;
    humPaint();
    //: ═══ В `bot.log` УЕЗЖАЕТ ОДИН СНИМОК, И ШЛЁТ ЕГО АДМИН ═══
    //: LiveKit уровней звука не пишет вовсе, и разобрать такой случай потом можно только
    //: по НАШЕЙ строке. Пришли её все - в логе лежало бы N копий одного гула (тот же
    //: порядок, что у снимка связи).
    if (!iAmAdm || m.off || !humAgree(who)) return;
    var nm = (people[who] && people[who].name) || who;
    try {
      diag(nm + ': ровный сигнал ' + (Number(m.db) || 0) + ' дБ, разброс '
           + (Number(m.spread) || 0) + ' дБ, рост ' + (Number(m.grow) || 0)
           + ' дБ за окно · сошлось слушателей: ' + n, 'гул');
    } catch (e) {}
  }

  // ═════════════ ДЕТЕКТОР ЭХА: СРАВНИВАЕМ ДИНАМИКИ С МИКРОФОНОМ ═════════════
  //: ═══ МЕХАНИЗМ, А НЕ СИМПТОМ ═══
  //: AEC браузера вычитает из микрофона ТОЛЬКО тот звук, который он видел на выходе.
  //: Всё, что мы отрендерили мимо штатного пути, для него не существует - и тогда микрофон
  //: человека без наушников возвращает чужие голоса в комнату. Выше мы этот путь закрыли
  //: (усиление идёт через loopback), но AEC отказывает и по своим причинам: динамик громче
  //: порога, дешёвый телефон, две вкладки. Значит нужен ФАКТ, а не уверенность в починке.
  //:
  //: ═══ ПОЧЕМУ ДЕТЕКТОР ЛОКАЛЬНЫЙ, В ОТЛИЧИЕ ОТ ДЕТЕКТОРА ГУЛА ═══
  //: Гул слышат СОСЕДИ, и сам гудящий - последний, кто о нём узнает; поэтому там сходятся
  //: несколько слушателей. Здесь наоборот: только У СЕБЯ известны ОБА ряда - что играет в
  //: динамиках и что попало в микрофон. Сосед слышит их СМЕСЬ и эхо от «двое говорят
  //: разом» не отличит никак. Значит считаем сами о себе, а согласия не спрашиваем.
  //:
  //: ═══ ПОЧЕМУ ОГИБАЮЩИЕ, А НЕ СЫРЫЕ СЭМПЛЫ ═══
  //: Полная кросс-корреляция по сэмплам требует буфера звука и FFT на каждом кадре - на
  //: слабом телефоне, ради которого всё и делается, это самая дорогая вещь на странице.
  //: Огибающая (уровень 50 раз в секунду) стоит микросекунды и отвечает на тот же вопрос:
  //: эхо ПОВТОРЯЕТ форму чужой речи с задержкой, а два независимых говорящих - нет.
  var ECHO = {
    //: 50 Гц. Путь «динамик -> воздух -> микрофон» плюс буферы это 60-300 мс; на темпе
    //: детектора гула (100 мс) весь диапазон лагов уложился бы в 1-3 отсчёта, а по трём
    //: точкам корреляции не бывает.
    TICK_MS: 20,
    //: Окно решения - 3 секунды. Короче нельзя: у речи есть паузы длиной в секунду, и на
    //: коротком окне пауза съела бы весь ряд.
    WIN: 150,
    //: Диапазон лагов: 60-400 мс. Ниже - это уже не эхо, а тот же звук в двух дорожках
    //: (например, оба сидят в одной комнате и мы слышим одного напрямую); выше - за
    //: пределом любой разумной задержки воспроизведения.
    LAG_MIN: 3,
    LAG_MAX: 20,
    //: ═══ ПОРОГ КОРРЕЛЯЦИИ: 0.6, И ЭТО ЗАМЕР, А НЕ ОЦЕНКА ═══
    //: Число взято из таблицы, посчитанной ЭТИМ ЖЕ кодом (`echoCorr`/`echoBest` под node,
    //: двадцать окон на каждый случай). Обе половины таблицы ОСТАЮТСЯ инвариантом
    //: (`rtc31`, закон №49) - иначе следующая правка детектора тихо отломает строку.
    //:
    //:   случай                        min    мед    max   лаг (чаще всего / разных)
    //:   ЭХО -25дБ, молчу       0.980  0.984  0.988   20/20, разных 1
    //:   ЭХО -25, говорю 30%       0.129  0.405  0.631   14/20, разных 7
    //:   ЭХО -25, говорю наравне   0.000  0.250  0.548    6/20, разных 12
    //:   ЭХО -55 тонет в шуме -50  0.084  0.185  0.365    5/20, разных 12
    //:   НАУШНИКИ: говорю         0.000  0.132  0.451    6/20, разных 9
    //:   НЕЗАВИСИМЫЕ говорящие    0.000  0.200  0.464    5/20, разных 13
    //:
    //: ПОРОГ СТОИТ В ПУСТОТЕ МЕЖДУ ДВУМЯ МИРАМИ: худший ЗАКОННЫЙ случай за
    //: двадцать окон дотянулся до 0.464, эхо в паузе начинается с 0.980. 0.6 не посередине
    //: одного распределения, а между двумя - и это свойство величины, а не удача: корреляция
    //: Пирсона НЕ ЧУВСТВИТЕЛЬНА К МАСШТАБУ, то есть ослабление комнатой на 20-30 дБ
    //: её не роняет. Подтверждение - ЛАГ: у эха он ОДИН И ТОТ ЖЕ во всех двадцати
    //: окнах (путь «динамик -> воздух -> микрофон» не меняется), а у всего остального
    //: максимум бродит по 7-13 разным лагам. Гейтом лаг НЕ ставим: порог и выдержка
    //: разводят миры и без него, а лишнее условие — это лишний способ ослепнуть.
    //:
    //: ГРАНИЦА ДЕТЕКТОРА НАЗВАНА, А НЕ ЗАМОЛЧАНА: пока человек ГОВОРИТ поверх
    //: эха, его собственный голос забивает огибающую, корреляция падает до 0.25-0.40, и мы
    //: МОЛЧИМ. Это верная сторона ошибки: ловим в его ПАУЗАХ, а паузы бывают всегда
    //: (эхо тем временем не прекращается), а выдержка не ОБНУЛЯЕТСЯ на промахе, а убывает.
    //: Строка «ЭХО -55 тонет в шуме» - тоже законное молчание: такого эха никто не слышит.
    //:
    //: ЧЕГО ЗАМЕР НЕ ДОКАЗЫВАЕТ (закон №48): огибающая там СИНТЕТИЧЕСКАЯ - живого
    //: эха в контейнере не бывает, оно ловится только на созвоне. Замерена РЕШАЮЩАЯ
    //: ФУНКЦИЯ на заданных данных, а не акустика комнаты; именно поэтому одиночного
    //: превышения мало, и рядом стоит выдержка.
    R_MIN: 0.6,
    //: Сколько секунд подряд признак обязан держаться. Одно окно при 2.3 разброса это
    //: случайность раз в несколько минут; четыре секунды подряд - нет.
    HOLD_SEC: 4,
    //: Сколько тишины признака снимает обвинение. Обвинение обязано сниматься само (закон
    //: №55): человек надел наушники - плашка уходит, и просить об этом его не надо.
    CLEAR_SEC: 6,
    //: Ниже этого в динамиках нечему возвращаться, а в микрофоне нечего ловить.
    FLOOR_DB: -50
  };

  var echoCtx = null, echoTimer = 0, echoNodes = {}, echoMic = null;
  var echoFar = [], echoNear = [], echoHeld = 0, echoOn = false, echoWhy = '', echoSince = 0;
  var echoRep = {};                //: чей identity -> {at, r, lag} - это видит АДМИН

  function echoLin(db) {
    //: дБ -> линейная амплитуда. Складывать чужие голоса можно только так: децибелы
    //: складывать нельзя вовсе, это логарифм.
    return db <= -119 ? 0 : Math.pow(10, db / 20);
  }

  function echoFarDb() {
    //: ЧТО ИГРАЕТ У МЕНЯ В ДИНАМИКАХ. Сумма чужих МИКРОФОННЫХ дорожек: радио и звук
    //: вкладки сюда не идут (их обходит `humEachMic`), и это правильно - Ren говорит про
    //: возврат ЧУЖИХ ГОЛОСОВ, а ровный музыкальный фон дал бы ложную корреляцию.
    if (!echoCtx) return null;
    var sum = 0, seen = 0;
    humEachMic(function (p, sid, ms) {
      var st = echoNodes[sid];
      if (!st || st.ms !== ms) {
        if (st) { try { st.src.disconnect(); } catch (e) {} }
        try {
          var an = echoCtx.createAnalyser();
          //: МАЛЕНЬКОЕ ОКНО НАРОЧНО: нам нужна ГРОМКОСТЬ кадра, а не спектр. 256 сэмплов
          //: это 5 мс при 48 кГц - вчетверо дешевле, чем у детектора гула, и на дюжине
          //: участников эта разница уже видна на слабом телефоне.
          an.fftSize = 256;
          var src = echoCtx.createMediaStreamSource(new MediaStream([ms]));
          src.connect(an);
          st = echoNodes[sid] = { an: an, src: src, ms: ms, buf: new Float32Array(256) };
        } catch (e) { return false; }
      }
      sum += echoLin(frameDbTop(st.an, st.buf));
      seen++;
      return true;
    });
    //: НИКОГО НЕ СЛУШАЕМ - ЭТО НЕ НОЛЬ, А «МЕРИТЬ НЕЧЕГО» (закон №22). Ноль означал бы
    //: «в динамиках тихо», и ряд наполнился бы тишиной, которой не было.
    if (!seen) return null;
    return sum > 0 ? 20 * Math.log10(sum) : -120;
  }

  function echoNearDb() {
    //: ЧТО УХОДИТ В КОМНАТУ ИЗ МОЕГО МИКРОФОНА. Берём ОПУБЛИКОВАННУЮ дорожку, а не сырой
    //: захват: вопрос детектора - «слышат ли меня с эхом», а слышат именно её.
    if (!echoCtx || !room || !room.localParticipant) return null;
    var pub = null;
    var pubs = room.localParticipant.trackPublications
            || room.localParticipant.tracks || new Map();
    pubs.forEach(function (p) {
      if (!pub && String(p.source || '') === 'microphone' && p.track) pub = p;
    });
    var ms = pub && pub.track && pub.track.mediaStreamTrack;
    //: МИКРОФОН ВЫКЛЮЧЕН - В КОМНАТУ НЕ ИДЁТ НИЧЕГО, И ОБВИНЯТЬ НЕ В ЧЕМ. Без этой ветки
    //: человек, честно выключивший микрофон, продолжал бы видеть плашку.
    if (!ms || ms.enabled === false || ms.readyState === 'ended') return null;
    if (!echoMic || echoMic.ms !== ms) {
      if (echoMic) { try { echoMic.src.disconnect(); } catch (e) {} }
      try {
        var an = echoCtx.createAnalyser();
        an.fftSize = 256;
        var src = echoCtx.createMediaStreamSource(new MediaStream([ms]));
        src.connect(an);
        echoMic = { an: an, src: src, ms: ms, buf: new Float32Array(256) };
      } catch (e) { return null; }
    }
    return frameDbTop(echoMic.an, echoMic.buf);
  }

  function echoCorr(f, n, lag) {
    //: Пирсон между far[i] и near[i+lag]. Инвариантен к масштабу - а эхо это и есть тот же
    //: сигнал, ослабленный комнатой на 20-30 дБ.
    var m = f.length - lag;
    if (m < 20) return 0;
    var i, sf = 0, sn = 0;
    for (i = 0; i < m; i++) { sf += f[i]; sn += n[i + lag]; }
    var mf = sf / m, mn = sn / m, num = 0, df = 0, dn = 0, a, b;
    for (i = 0; i < m; i++) {
      a = f[i] - mf; b = n[i + lag] - mn;
      num += a * b; df += a * a; dn += b * b;
    }
    //: РОВНЫЙ РЯД - ЭТО НЕ КОРРЕЛЯЦИЯ, А ДЕЛЕНИЕ НА НОЛЬ. Тишина в динамиках и тишина в
    //: микрофоне «совпадают» идеально, и без этой проверки детектор обвинял бы молчащих.
    if (df < 1e-6 || dn < 1e-6) return 0;
    return num / Math.sqrt(df * dn);
  }

  function echoBest() {
    //: -> {r, lag} лучший лаг в диапазоне, либо null если рядов ещё мало.
    if (echoFar.length < ECHO.WIN) return null;
    var best = { r: 0, lag: 0 };
    for (var L = ECHO.LAG_MIN; L <= ECHO.LAG_MAX; L++) {
      var r = echoCorr(echoFar, echoNear, L);
      if (r > best.r) best = { r: r, lag: L };
    }
    return best;
  }

  function echoMed(a) {
    var b = a.slice().sort(function (x, y) { return x - y; });
    return b[Math.floor(b.length / 2)];
  }

  function echoTick() {
    //: СПЕРВА ДИНАМИКИ, ПОТОМ МИКРОФОН, И ЭТО НЕ ПОРЯДОК СТРОК РАДИ ПОРЯДКА: человек,
    //: сидящий в комнате ОДИН, платил бы за замер своего микрофона пятьдесят раз в
    //: секунду, при том что возвращаться в динамиках нечему ПО ПОСТРОЕНИЮ. Ровно тот
    //: класс, из-за которого замер связи считает окно, а не всю сессию.
    var far = echoFarDb();
    if (far === null) return;
    var near = echoNearDb();
    if (near === null) {
      //: МЕРИТЬ НЕЧЕГО - РЯД НЕ КОПИМ И НЕ ОБНУЛЯЕМ ВЫДЕРЖКУ: человек мог на секунду
      //: остаться один в комнате либо выключить микрофон, и начинать счёт заново было бы
      //: неверно.
      return;
    }
    echoFar.push(far); echoNear.push(near);
    if (echoFar.length > ECHO.WIN) { echoFar.shift(); echoNear.shift(); }
    var v = echoBest();
    if (!v) return;
    var loud = echoMed(echoFar) > ECHO.FLOOR_DB && echoMed(echoNear) > ECHO.FLOOR_DB;
    var bad = loud && v.r >= ECHO.R_MIN;
    if (bad) {
      echoHeld += ECHO.TICK_MS / 1000;
      if (!echoOn && echoHeld >= ECHO.HOLD_SEC) {
        echoOn = true;
        echoSince = Date.now();
        echoPaint(v);
        echoSay(true, v);
        try {
          diag('мой микрофон возвращает чужие голоса: корреляция '
               + Math.round(v.r * 100) + '% на лаге ' + (v.lag * ECHO.TICK_MS) + ' мс',
               'эхо');
        } catch (e) {}
      } else if (echoOn) {
        echoPaint(v);
      }
      return;
    }
    echoHeld = Math.max(0, echoHeld - ECHO.TICK_MS / 1000);
    if (echoOn && echoHeld <= Math.max(0, ECHO.HOLD_SEC - ECHO.CLEAR_SEC)) {
      echoOn = false;
      echoPaint(null);
      echoSay(false);
      try {
        //: СТРОКА НЕСЁТ СОДЕРЖИМОЕ, А НЕ ОДНО СЛОВО, И ЭТО НЕ УКРАШЕНИЕ: голое «эхо
        //: прекратилось» не отвечает НИ НА ОДИН вопрос разбора - сколько оно длилось и
        //: на чём мы его сняли. Сверх того `diag(строка, метка)` с коротким литералом
        //: ПЕРВЫМ неотличим от перепутанных аргументов, и сторож `rtc28` краснеет на
        //: такой форме везде, где бы её ни написали (живой случай: `diag('виджет',
        //: <размер>)` печатал голое слово, а замер выбрасывался молча).
        diag('эхо прекратилось: держалось ' + Math.round((Date.now() - echoSince) / 1000)
             + ' с, корреляция упала до ' + Math.round((v && v.r || 0) * 100) + '%', 'эхо');
      } catch (e) {}
    }
  }

  function echoSay(on, v) {
    //: О СЕБЕ, А НЕ О СОСЕДЕ: получатель берёт автора из `identity` САМОГО сообщения, и
    //: подделать чужое обвинение нечем (закон №32) - поля «кто» здесь нет вовсе.
    if (!roomSend) return;
    try {
      roomSend(on ? { t: 'echo', on: 1, r: Math.round(v.r * 100),
                      lag: v.lag * ECHO.TICK_MS }
                  : { t: 'echo', off: 1 });
    } catch (e) {}
  }

  function echoGot(fromId, m) {
    var id = String(fromId || '');
    if (!id) return;
    if (m && m.off) delete echoRep[id];
    else echoRep[id] = { at: Date.now(), r: Number(m.r) || 0, lag: Number(m.lag) || 0 };
    echoPaint();
    //: В `bot.log` УЕЗЖАЕТ СНИМОК ОТ АДМИНА, а не от каждого: пришли строку все, в логе
    //: лежало бы N копий одного эха (тот же порядок, что у гула и у снимка связи).
    if (!iAmAdm || (m && m.off)) return;
    var nm = (people[id] && people[id].name) || id;
    try {
      diag(nm + ': возвращает чужие голоса, корреляция ' + (Number(m.r) || 0)
           + '% на лаге ' + (Number(m.lag) || 0) + ' мс', 'эхо');
    } catch (e) {}
  }

  function echoPaint(v) {
    //: ═══ ДВА АДРЕСАТА, И СООБЩЕНИЯ У НИХ РАЗНЫЕ ═══
    var box = $('echowarn');
    if (box) {
      box.style.display = echoOn ? '' : 'none';
      var t = $('echotext');
      if (echoOn && t) {
        //: ГОВОРИМ ПРО ПОСЛЕДСТВИЕ, А НЕ ПРО ФОРМУЛУ: «корреляция 0.82» человеку не
        //: сообщает ничего. Числа уезжают в лог, где их читаем мы.
        t.textContent = 'Чужие голоса из твоих динамиков попадают обратно в твой микрофон,'
          + ' и в комнате их слышно дважды' + (v ? ' (задержка ' + (v.lag * ECHO.TICK_MS)
          + ' мс)' : '') + '. Сам ты этого не слышишь. Надень наушники - это лечит целиком;'
          + ' либо выключай микрофон, пока слушаешь.';
      }
    }
    var ab = $('admecho');
    if (!ab) return;
    ab.textContent = '';
    if (!iAmAdm) return;
    var now = Date.now();
    for (var id in echoRep) {
      var e = echoRep[id];
      //: ПРОТУХШЕЕ НЕ ПОКАЗЫВАЕМ: человек мог выйти, не сняв обвинения, и оно висело бы
      //: до конца созвона.
      if (!e || now - e.at > (ECHO.CLEAR_SEC + 30) * 1000) { delete echoRep[id]; continue; }
      var nm = (people[id] && people[id].name) || id;
      var row = document.createElement('p');
      row.className = 'me';
      row.textContent = '🎧 ' + nm + ' без наушников: его микрофон возвращает чужие голоса'
                      + ' (задержка ' + e.lag + ' мс).';
      ab.appendChild(row);
      if (!admDo) continue;
      var b = document.createElement('button');
      b.className = 'adm wide';
      b.textContent = '🔇 Заглушить ' + nm;
      b.onclick = (function (_id, _nm) {
        return function () { admDo('mute', _id, _nm); };
      })(id, nm);
      ab.appendChild(b);
    }
  }

  function echoStart() {
    if (echoCtx) return;
    try {
      echoCtx = regCtx(new (window.AudioContext || window.webkitAudioContext)(),
                       'детектор эха');
      echoTimer = setInterval(echoTick, ECHO.TICK_MS);
      try { window.__ECHOON = 1; } catch (e) {}
    } catch (e) {
      //: НЕ ЗАВЁЛСЯ - ЭТО НЕ ПОЛОМКА РАЗГОВОРА, НО И НЕ ТИШИНА (тот же довод, что у гула).
      echoWhy = String((e && e.message) || e);
      try { diag('детектор эха не завёлся: ' + echoWhy, 'эхо'); } catch (e2) {}
    }
  }

  function echoStop() {
    if (echoTimer) { try { clearInterval(echoTimer); } catch (e) {} echoTimer = 0; }
    for (var sid in echoNodes) { try { echoNodes[sid].src.disconnect(); } catch (e) {} }
    echoNodes = {};
    if (echoMic) { try { echoMic.src.disconnect(); } catch (e) {} echoMic = null; }
    echoFar = []; echoNear = []; echoHeld = 0; echoOn = false;
    if (echoCtx) { try { echoCtx.close(); } catch (e) {} echoCtx = null; }
  }

  // ═══ ТИК ЖИВЁТ РЯДОМ С ЗАМЕРОМ, А НЕ ВНУТРИ ВЕТКИ ПОДПИСИ ═══
  // Собирает цифры КАЖДЫЙ (это его канал), а отправляет боту только админ: пришли снимок
  // все, в логе лежало бы N копий одного разговора. Внутри `if (initData)` тик был бы
  // невидим соседям - в частности, приходу нового участника, а это ровно тот момент,
  // когда его связь интересна.
  var _statTick = 0;
  async function statTick() {
    // ЗАМЕР ОДИН НА ОБА ВОПРОСА: `rxTick` мерит входящие дорожки и рисует обе строки -
    // свою («что дошло до меня», решение принимает тот, у кого рвётся) и админскую («от
    // кого именно»). Раньше здесь стоял ВТОРОЙ проход `getStats` по тем же дорожкам со
    // своей арифметикой, и копии успели разойтись (закон №40).
    var r = null;
    try { r = await rxTick(); } catch (e) { console.warn('[rx] тик приёма:', e); }
    var rows = (r && r.rows) || [];
    _statTick++;
    // ═══ СНИМОК ШЛЁТ КАЖДЫЙ, А НЕ ТОЛЬКО АДМИН (требование ТЗ) ═══
    // ПОЧЕМУ ПРЕЖНЕЕ ПРАВИЛО ОТВЕЧАЛО НЕ НА ТОТ ВОПРОС. Снимок админа честно говорит,
    // как АДМИН слышит остальных, и МОЛЧИТ ровно про то, ради чего замер заводился:
    // рвётся у того, кто жалуется, и рвётся у него НА ПРИЁМЕ, а чужой приём админ не
    // видит ничем. Живой случай того же класса уже записан у детектора гула: у гудящего
    // участника было 0% потерь, потому что гул доставляется идеально.
    // ЦЕНА НАЗВАНА: на созвоне из двенадцати это двенадцать сигналов в минуту вместо
    // одного. Поэтому темп прежний (раз в минуту на человека), в журнале снимок
    // ПЕРЕЗАПИСЫВАЕТСЯ по ключу отправителя, а в `bot.log` ровные снимки печатаются
    // редко - плохие всегда (иначе лог, которым мы же и разбираем, перестал бы отвечать).
    // ВЕБ-ГОСТЬ СЮДА НЕ ПОПАДАЕТ, И ЭТО НЕ НАШ ВЫБОР: ящик принимает только подпись
    // Telegram, а у пришедшего по ссылке её нет и быть не может. Его приём остаётся
    // виден ему самому строкой на экране - там он считается локально.
    if (!initData || !rows.length || (_statTick % 6)) return;
    try {
      var r = await fetch(API + '/signal', {
        method: 'POST',
        headers: { 'X-Init-Data': initData, 'Content-Type': 'application/json' },
        //: ВРЕМЯ РЕЧИ ЕДЕТ ТЕМ ЖЕ СИГНАЛОМ, А НЕ СВОИМ: у него тот же адресат
        //: (журнал созвона), тот же отправитель (админ) и тот же темп. Второй
        //: сигнал был бы вторым запросом к чужому суточному лимиту ради данных,
        //: которые едут попутно.
        //: ЧЕЙ ЭТО ПРИЁМ - ЧАСТЬ САМОГО ЗАМЕРА, А НЕ ПОДПИСЬ. Без имени снимки
        //: участников затирали бы друг друга в журнале, и «от каждого» стало бы «от
        //: последнего» - причём молча.
        //: ВРЕМЯ РЕЧИ ШЛЁТ ТОЛЬКО АДМИН: оно считается по ВСЕЙ комнате одинаково у
        //: каждого, и двенадцать одинаковых копий не добавили бы ни одного факта.
        //: ЧЕРЕЗ `roomLabel`, А НЕ `myLabel` НАПРЯМУЮ: последняя объявлена ВНУТРИ
        //: `go()`, а этот тик живёт выше по файлу - это ровно тот `ReferenceError`,
        //: который в этом файле уже семь раз уносил всё, что регистрируется ниже.
        body: JSON.stringify({ kind: 'rtcstat', room: ROOM,
                               me: (roomLabel ? roomLabel() : ''),
                               rows: rows.slice(0, 20),
                               talk: iAmAdm ? talkSecs() : {} }),
      });
      // ═══ НЕУДАЧА НЕ ЛОМАЕТ РАЗГОВОР, НО И НЕ ИСЧЕЗАЕТ БЕССЛЕДНО ═══
      // Строка связи на экране считается локально и работает при любом исходе, поэтому
      // человеку тут говорить нечего. А вот пустой `catch {}` означал бы, что «в логе нет
      // связи» и «Worker выложен старой версией и про `rtcstat` не знает» выглядят
      // одинаково, - а разбор начинается ровно с этого различия.
      if (!r.ok) console.warn('[rtcstat] ящик не принял: HTTP', r.status);
    } catch (e) { console.warn('[rtcstat] не отправилось:', e); }
  }
  //: ═══ ВТОРАЯ ДВЕРЬ НАРУЖУ, И ОНА ПРО ДРУГОЙ ВОПРОС ═══
  //: `rxTick` - это ЦЕПОЧКА ЗАМЕРА (замер -> буфер -> битрейт -> показ), а `statTick` -
  //: ТИК ОТПРАВКИ: снимок приёма живёт ИМЕННО ТУТ и нигде больше, а решает, ехать ли
  //: ему, счётчик `_statTick` - переменная замыкания, тронуть которую снаружи нечем.
  //: Гоняй проба снимок через `rxTick`, она не исполняла бы проверяемую ветку ВООБЩЕ.
  //: Ждать своего периода тоже нельзя: снимок уезжает каждый шестой тик по десять
  //: секунд, то есть раз в минуту, - слепое ожидание против чужого периода уже породило
  //: круг, который краснеет на верном коде через раз.
  try { window.statTick = statTick; } catch (e) {}

  // ПЕРВЫЙ ЗАМЕР - СРАЗУ, А НЕ ЧЕРЕЗ ОКНО. Ждать десять секунд пустой строки человек
  // читает как «статистики нет»; первое окно короче, и это честно - оно и правда короче.
  setTimeout(statTick, 1500);
  setInterval(statTick, STAT_EVERY);

  // СКОЛЬКО ЧЕЛОВЕК В КОМНАТЕ - ОТДЕЛЬНОЙ СТРОКОЙ И ВСЕГДА. Список из одной строки «Ты»
  // не отвечает на вопрос «я тут один или другие ещё не зашли»: это два разных решения -
  // ждать или звать людей. Число считается ПО ТОМУ ЖЕ объекту, что рисует список, а не
  // отдельным счётчиком - два счётчика разошлись бы на первом же выходе участника.
  function headcount() {
    var n = Object.keys(people).length;
    if (n <= 1) return 'В комнате: только ты';
    var tail = (n % 10 === 1 && n % 100 !== 11) ? 'человек'
             : ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'человека'
             : 'человек');
    return 'В комнате: ' + n + ' ' + tail;
  }

  // ═══════════════ КОТ КАК АВАТАР УЧАСТНИКА ═══════════════════════════════════════
  // ОДНА ГЕОМЕТРИЯ, ЧЕТЫРЕ ОСИ, НИКАКОГО ХРАНИЛИЩА. Рисовать N разных котов значило бы
  // держать N кусков разметки и править их по одному; вместо этого оси выводятся
  // ДЕТЕРМИНИРОВАННО из identity участника - тот же id даёт того же кота в любой сессии
  // и у любого зрителя, и хранить нечего вовсе.
  // ПОЧЕМУ НЕ АВАТАР TELEGRAM (решение Ren): `photo_url` приходит не всегда, у веб-гостя
  // его нет ВООБЩЕ, чтение пикселей с чужого домена требует прокси через Worker, а
  // доминирующий цвет фотографии - это обычно стена за спиной. То есть путь длиннее,
  // ломается чаще и даёт худший результат.
  var CAT_FUR = ['--cat-1', '--cat-2', '--cat-3', '--cat-4', '--cat-5', '--cat-6'];
  var CAT_PAT = ['plain', 'stripe', 'spot', 'socks'];
  var CAT_TOP = ['none', 'torn', 'bow', 'tuft'];

  //: FNV-1a: коротко, без зависимостей и одинаково на всех клиентах. Криптостойкость тут
  //: не нужна - нужна ПОВТОРЯЕМОСТЬ, и именно её проверяет проба.
  function catHash(id) {
    var h = 2166136261, t = String(id == null ? '' : id), i;
    for (i = 0; i < t.length; i++) {
      h ^= t.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h >>> 0;
  }

  //: -> {fur, pat, eye, top} | null. БЕЗ id КОТА НЕТ, И ЭТО НЕ ПАДЕНИЕ: у части событий
  //: SDK identity приходит пустым, и «нарисуем какого-нибудь» означало бы, что один и тот
  //: же человек показывается разными котами.
  function catAxes(id) {
    var t = String(id == null ? '' : id);
    if (!t) return null;
    var h = catHash(t);
    return {
      fur: CAT_FUR[h % CAT_FUR.length],
      pat: CAT_PAT[(h >>> 3) % CAT_PAT.length],
      eye: (h >>> 6) % 4,
      top: CAT_TOP[(h >>> 9) % CAT_TOP.length]
    };
  }

  //: ГЛАЗА - ЧЕТЫРЕ ФОРМЫ ОДНОЙ ГЕОМЕТРИИ. Дремота НЕ отдельная картинка: тот же элемент
  //: сжимается по вертикали классом `nap`, поэтому «бодрый» и «дремлющий» не могут
  //: разойтись между собой при правке.
  var CAT_EYE = [[2.6, 3.4], [3.2, 2.2], [3.0, 3.0], [2.0, 2.8]];

  function catSvg(id, size) {
    var a = catAxes(id);
    if (!a) return '';
    var e = CAT_EYE[a.eye], rx = e[0], ry = e[1];
    var fur = 'fill:var(' + a.fur + ')';
    var out = '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '">'
            + '<g class="c-body">';
    // УХО: НАДОРВАННОЕ - ЭТО ТА ЖЕ ФИГУРА С ВЫРЕЗОМ, а не второй рисунок.
    out += '<path class="c-ear" d="M14 26 L18 12 L28 20 Z"/>';
    out += (a.top === 'torn')
      ? '<path class="c-ear" d="M50 26 L46 12 L42 17 L45 19 L36 20 Z"/>'
      : '<path class="c-ear" d="M50 26 L46 12 L36 20 Z"/>';
    out += '<ellipse class="c-head" style="' + fur + '" cx="32" cy="34" rx="20" ry="17"/>';
    // УЗОР ЛЕЖИТ ПОВЕРХ ГОЛОВЫ И БЕРЁТ ЕЁ ЖЕ ЦВЕТ ПОД ДРУГОЙ ПРОЗРАЧНОСТЬЮ: свой цвет
    // означал бы седьмой токен и седьмую проверку контраста ни за чем.
    if (a.pat === 'stripe') {
      out += '<path d="M24 20 q3 6 0 12 M32 18 q3 7 0 14 M40 20 q3 6 0 12" '
           + 'style="stroke:var(' + a.fur + ');fill:none" stroke-width="2.4" '
           + 'stroke-linecap="round" opacity=".55"/>';
    } else if (a.pat === 'spot') {
      out += '<g style="' + fur + '" opacity=".5">'
           + '<ellipse cx="22" cy="24" rx="4" ry="3"/>'
           + '<ellipse cx="42" cy="26" rx="3" ry="2.4"/></g>';
    } else if (a.pat === 'socks') {
      out += '<ellipse style="' + fur + '" opacity=".45" cx="32" cy="45" rx="9" ry="5"/>';
    }
    out += '<g class="c-eyes">'
         + '<ellipse class="c-eye" cx="25" cy="32" rx="' + rx + '" ry="' + ry + '"/>'
         + '<ellipse class="c-eye" cx="39" cy="32" rx="' + rx + '" ry="' + ry + '"/></g>';
    out += '<path class="c-nose" d="M31 39 h2 l-1 1.6 Z"/>';
    out += '<path class="c-wh" d="M12 36 h8 M12 40 h8 M52 36 h-8 M52 40 h-8"/>';
    out += '<path class="c-tail" d="M52 44 q8 2 6 10"/>';
    if (a.top === 'bow') {
      out += '<path d="M40 15 l5 -4 v8 Z M46 15 l5 -4 v8 Z" style="fill:var(--acc-h)"/>';
    } else if (a.top === 'tuft') {
      out += '<path d="M30 18 q2 -7 5 -8 q-1 5 1 7" style="stroke:var(' + a.fur
           + ');fill:none" stroke-width="2" stroke-linecap="round"/>';
    }
    return out + '</g></svg>';
  }
  //: НАРУЖУ - ЧИСТОЙ ФУНКЦИЕЙ. Повторяемость кота нельзя увидеть чтением кода:
  //: любой хэш «выглядит детерминированным». Проба спрашивает ФАКТ.
  window.catSvg = catSvg;

  function draw() {
    var box = $('people');
    box.innerHTML = '';
    var ids = Object.keys(people);
    if (connected) sub(headcount());
    if (!ids.length) { box.innerHTML = '<div class="me">Пока никого</div>'; return; }
    ids.forEach(function (id) {
      var p = people[id];
      var row = document.createElement('div');
      row.className = 'p';
      // ОЧЕРЕДЬ СЛОВА - ЭТО ПОРЯДОК, А НЕ ФЛАЖОК: номер считается по времени поднятия,
      // иначе «кто раньше поднял» решает случайный порядок объекта.
      var q2 = ids.filter(function (x) { return people[x].hand; })
                  .sort(function (a, b) { return people[a].hand - people[b].hand; });
      var pos = q2.indexOf(id);
      // ═══ ЗНАЧОК ШУМОДАВА - ТОЛЬКО АДМИНУ, И ЭТО НЕ СЕКРЕТНОСТЬ, А ЧИСТОТА СПИСКА ═══
      // Остальным он не отвечает ни на один вопрос: своё состояние человек видит на своей
      // же кнопке, а чужое ему нечем изменить. Админу же это ЕДИНСТВЕННЫЙ способ увидеть
      // ФАКТ вместо своей отправленной просьбы.
      // «Неизвестно» отличается от «выключен»: сосед со старой страницей про шумодав не
      // рассказывает вовсе, и молчание не значит «у него выключено».
      var _rn = (iAmAdm && !p.me)
        ? (p.rnn === undefined ? '<span class="hand">🔇?</span> '
                               : (p.rnn ? '<span class="hand">🔇</span> ' : ''))
        : '';
      // ═══ «ОТОШЁЛ» ВИДЕН ВСЕМ, И ЭТО ВЕСЬ СМЫСЛ СТАТУСА ═══
      // Он отвечает соседям на вопрос «ждать ли от него ответа». Метка стоит РЯДОМ С
      // ИМЕНЕМ, а не в общем состоянии: то перетирается следующим сообщением.
      var _aw = p.away ? '<span class="hand">⏸ отошёл</span> ' : '';
      // КОТ - ПЕРЕД ИМЕНЕМ, И У ЭТОГО ЖЕ ЧЕЛОВЕКА ОН ЖЕ СТОИТ В УГЛУ (если это я).
      // Дремлет ровно тогда, когда человек отошёл: состояние одно, картинок две.
      var _cs = catSvg(id, 22);
      row.innerHTML = '<span class="dot' + (p.speaking ? ' on' : '') + '"></span>'
        + (_cs ? '<span class="pcat' + (p.away ? ' nap' : '') + '">' + _cs + '</span>' : '')
        + '<span class="nm"></span>'
        + (pos >= 0 ? '<span class="hand">✋ ' + (pos + 1) + '</span> ' : '')
        + _aw
        + _rn
        + '<span class="me">' + (p.me ? 'ты' : (p.muted ? 'микрофон выкл' : '')) + '</span>';
      row.querySelector('.nm').textContent = p.name;
      // ═══ ДЕЙСТВИЯ НАД УЧАСТНИКОМ ═══
      // СВОЯ СТРОКА ИХ НЕ ПОЛУЧАЕТ: «заглушить себя» это кнопка микрофона внизу, и второй
      // способ сделать то же самое разошёлся бы с ней при первой правке.
      if (!p.me) {
        var more = document.createElement('button');
        more.className = 'more';
        more.textContent = '⋯';
        more.onclick = function () {
          pactFor = (pactFor === id) ? '' : id;
          draw();
        };
        row.appendChild(more);
      }
      box.appendChild(row);
      if (pactFor === id && !p.me) box.appendChild(pactRow(id, p));
    });
  }

  //: ЧЬЁ МЕНЮ ДЕЙСТВИЙ СЕЙЧАС РАСКРЫТО. Одно на список: два раскрытых разом означали бы,
  //: что человек не видит, к кому относится кнопка, которую он вот-вот нажмёт.
  var pactFor = '';

  function pactRow(id, p) {
    var box = document.createElement('div');
    box.className = 'pact';
    var isRadio = (id === DJ_ID);
    if (isRadio) {
      // ═══ РАДИО - НЕ ЧЕЛОВЕК, И ЗДЕСЬ ДЕЙСТВИЕ НАСТОЯЩЕЕ ═══
      // Процессом владеет БОТ, значит «отсоединить» это не просьба, а команда: тот же
      // путь, что у кнопки «Выключить радио», и второй дороги мы не заводим (закон №40).
      var off = document.createElement('button');
      off.textContent = '⏹ Отсоединить радио';
      off.onclick = function () {
        pactFor = ''; draw();
        if (djOff) djOff();
        else say('Отсоединить радио может тот, кто вошёл из Telegram: у меня нет канала '
                 + 'к боту.', true);
      };
      box.appendChild(off);
      var nt = document.createElement('p');
      nt.className = 'me';
      nt.textContent = 'Радио - мой процесс, поэтому это настоящая команда, а не просьба.';
      box.appendChild(nt);
      return box;
    }
    // ═══ АДМИН МОЖЕТ ПО-НАСТОЯЩЕМУ, ОСТАЛЬНЫЕ - ПРОСЯТ ═══
    // Разница не в вежливости, а в том, ЧТО ФИЗИЧЕСКИ УМЕЕТ КЛИЕНТ: выключить чужой
    // микрофон у livekit-client двери нет вовсе, это только серверный вызов. Поэтому
    // админские кнопки идут через ящик к боту, а право всё равно проверяет ОН (закон
    // №32) - здесь решается лишь, что показывать.
    if (iAmAdm && admDo) {
      // ═══ ШУМОДАВОМ СОСЕДА АДМИН БОЛЬШЕ НЕ УПРАВЛЯЕТ, И ЭТО НЕ ПОТЕРЯ ПРАВА ═══
      // Кнопка была нужна, пока шумодав включался ТАПОМ и его можно было не включить.
      // Теперь он включается сам у каждого, у кого его вообще можно включить, - просить
      // соседа сделать то, что у него уже сделано, значит показывать кнопку, после
      // которой ничего не меняется. Состояние его шумодава по-прежнему видно в списке.
      // ═══ РЕАКЦИИ И ЗВУКИ - ПЕРЕКЛЮЧАТЕЛЬ, И ОБРАТНЫЙ ПУТЬ ОБЯЗАТЕЛЕН (закон №55) ═══
      // Заглушить человека навсегда одним тапом нельзя: он перестанет быть участником
      // разговора, а вернуть его будет нечем до конца созвона.
      var _fOff = !!funOff[String(id)];
      var fb = document.createElement('button');
      fb.className = 'adm';
      fb.textContent = _fOff ? '🔊 Вернуть реакции' : '🙊 Запретить реакции и звуки';
      fb.onclick = function () {
        pactFor = ''; draw();
        admDo(_fOff ? 'fun_on' : 'fun_off', id, p.name);
      };
      box.appendChild(fb);
      // ═══ ВИДЕО ПО УЧАСТНИКУ - РАЗОВОЕ ДЕЙСТВИЕ, И КНОПКИ СТОЯТ ВСЕГДА ═══
      // ПОКАЗЫВАТЬ ИХ «ТОЛЬКО КОГДА ОН ПРАВДА ПОКАЗЫВАЕТ» БЫЛО БЫ ХУЖЕ: наше знание о
      // чужих дорожках неполно (мы можем быть на них не подписаны - adaptive stream,
      // свёрнутая аппка), и по устаревшему признаку админ остался бы БЕЗ единственного
      // инструмента ровно в тот момент, когда он нужен. Правду знает сервер, и он же
      // отвечает третьим исходом «выключать было нечего» (закон №22) - это дешевле, чем
      // спрятанная кнопка.
      // ЭТО РАЗОВОЕ ВЫКЛЮЧЕНИЕ, А НЕ ЗАПРЕТ: включить обратно он сможет. Запрет - режим
      // на всю комнату, и он живёт отдельной кнопкой в админской карточке.
      [['🖥 Выключить показ экрана', 'scr_off'],
       ['📷 Выключить камеру', 'cam_off'],
       ['🔇 Заглушить', 'mute'], ['🚪 Отключить', 'kick'],
       ['👑 Сделать админом', 'admin']].forEach(function (a) {
        var b = document.createElement('button');
        b.className = 'adm';
        b.textContent = a[0];
        b.onclick = function () {
          pactFor = ''; draw();
          admDo(a[1], id, p.name);
        };
        box.appendChild(b);
      });
    }
    [['🔇 Попросить приглушиться', 'quiet'],
     ['🚪 Попросить выйти', 'bye']].forEach(function (a) {
      var b = document.createElement('button');
      b.textContent = a[0];
      b.onclick = function () {
        pactFor = ''; draw();
        //: ОТПРАВКА ЧЕРЕЗ ДВЕРЬ. Прежняя редакция звала `send` и `myLabel` НАПРЯМУЮ, а
        //: они живут в области `go()` - тап бросал `ReferenceError` и умирал молча.
        if (!roomSend) {
          say('Просьбу отправить нечем: соединение с комнатой ещё не поднялось. '
              + 'Подожди пару секунд и нажми снова.');
          return;
        }
        roomSend({ t: 'ask1', to: id, do: a[1],
                   by: (roomLabel ? roomLabel() : 'Кто-то') });
        say('Отправил ' + p.name + ': ' + (a[1] === 'quiet' ? 'приглушиться' : 'выйти')
            + '. Это просьба - решает он.');
      };
      box.appendChild(b);
    });
    // ═══ ЧЕСТНО ПРО ГРАНИЦУ, А НЕ МОЛЧА ═══
    // Серверного «замолчи» мы не шлём: для него нужен админский грант У КАЖДОГО, то есть
    // право выключать чужой микрофон кому угодно. Подпись, обещающая приказ там, где
    // отправлена просьба, хуже отсутствующей кнопки - человек решит, что сломалось.
    var note = document.createElement('p');
    note.className = 'me';
    // ТЕКСТ ОТВЕЧАЕТ СОСТОЯНИЮ, А НЕ ПОРЯДКУ СТРОК: у админа на экране стоят ОБА ряда
    // кнопок, и общая подпись «это просьбы» врала бы про верхний.
    note.textContent = iAmAdm
      ? ('Заглушить и отключить - настоящие: их выполняет сервер. Шумодав - просьба с '
         + 'настоящим гейтом: включает его страница участника, и выключить у себя он '
         + 'может всегда. Нижние - ПРОСЬБЫ: у него всплывёт окно, и он решает сам.')
      : ('Это ПРОСЬБЫ: у него всплывёт окно, и он решает сам. По-настоящему заглушить '
         + 'или отключить может только админ комнаты.');
    box.appendChild(note);
    return box;
  }

  // ИМЯ ЧЕЛОВЕКА, А НЕ ЕГО TELEGRAM-ID. Токен несёт `name` из подписи, но у токена,
  // выданного СТАРЫМ Worker'ом, там лежит uid - и комната показывала соседям столбик
  // голых чисел. Число вместо имени не сообщает НИЧЕГО и при этом светит чужой id,
  // поэтому оно заменяется словом, а не показывается «как есть».
  // ЧТО НАМ ВООБЩЕ РАЗРЕШИЛИ. JWT это base64 - клиент читает свой грант, не спрашивая
  // никого. Нужно вот зачем: страница и Worker выкладываются РАЗНЫМИ командами, и если
  // приехала новая страница со старым токеном, кнопка показа есть, а права нет. LiveKit
  // в этом случае НЕ отказывает - он ВИСИТ («waiting for pending publication promise
  // timed out»), и по этому тексту причину не угадать (живой случай Ren 25.08).
  function grantOf(token) {
    try {
      var b = String(token).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      var j = JSON.parse(decodeURIComponent(escape(atob(b + '='.repeat((4 - b.length % 4) % 4)))));
      return (j && j.video) || {};
    } catch (e) { return {}; }
  }

  function human(name, id) {
    var n = String(name == null ? '' : name).trim();
    if (!n || n === String(id) || /^\d{5,}$/.test(n)) return 'Гость';
    return n;
  }

  function upsert(id, patch) {
    people[id] = Object.assign(people[id] || { name: id, speaking: false, muted: false }, patch);
    draw();
  }

  // ═════════════════════════════════════════════════════════════════════════════════
  // ЗВУКОВЫЕ РЕАКЦИИ: СИНТЕЗ НА МЕСТЕ + КАНАЛ ДАННЫХ, А НЕ ВТОРАЯ АУДИО-ДОРОЖКА
  // ═════════════════════════════════════════════════════════════════════════════════
  // ПОЧЕМУ НЕ ДОРОЖКОЙ, ХОТЯ LiveKit ЭТО УМЕЕТ. У нас на `track_published` висит вебхук,
  // и бот ДОБИРАЕТ каждую новую аудио-дорожку в идущую запись - ради вошедших позже.
  // Саундборд, опубликованный дорожкой, попал бы туда же, а бюджет Egress это ТРИ дорожки
  // на комнату (`track_cpu_cost` 0.5 при `cpus: 2.0`), - то есть каждый «тынц» отнимал бы
  // место у живого человека, и узнали бы мы об этом по недостающему голосу в транскрипте.
  // Это механизм, а не вкусовщина.
  //
  // ПОЧЕМУ БЕЗ ФАЙЛОВ. Файлы пришлось бы выкладывать ОТДЕЛЬНОЙ командой от страницы, а
  // два артефакта, уезжающие врозь, у нас уже дважды расходились (страница против
  // Worker'а, грант показа экрана). Синтез такого класса не имеет вовсе: звук едет тем же
  // документом, что и кнопка.
  //
  // ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. Смеха нет: голос синтезом не подделать, а «смех», звучащий
  // как пила, хуже отсутствующей кнопки. Все восемь ниже - ударные и шум, они синтезом
  // получаются как есть, а не «похоже».
  var _AC = null, _MASTER = null;

  function actx() {
    if (!_AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { _AC = regCtx(new C(), 'звуки'); } catch (e) { return null; }
      _MASTER = _AC.createGain();
      // ═══ УРОВЕНЬ: 0.5 БЫЛО ТИХО, И ЭТО ЖИВОЙ ОТЗЫВ, А НЕ ВКУС ═══
      // Реакция звучит ПОВЕРХ разговора, у которого своя громкость, - и «гонг и остальные
      // очень тихие» означает, что её просто не слышно. Ставим 1.0 и держим пики у
      // источников: общий множитель ниже единицы отнимал половину у КАЖДОГО звука разом.
      _MASTER.gain.value = 1.0;
      _MASTER.connect(_AC.destination);
    }
    // БЕЗ ЖЕСТА БРАУЗЕР ДЕРЖИТ КОНТЕКСТ ПРИТОРМОЖЕННЫМ И МОЛЧА. `resume()` зовём без
    // ожидания: не успел к этому звуку - успеет к следующему, а срывать из-за него ПОКАЗ
    // реакции нельзя (у сигнала обязано быть два независимых пути дойти).
    // СПРАШИВАЕМ `running`, А НЕ `suspended`: у WebKit есть третье состояние
    // `interrupted` (звонок, уход в фон), и проверка по имени одного из спящих
    // пропускала его целиком - см. `ctxWake`.
    ctxWake(_AC);
    return _AC;
  }

  function noise(ac, sec) {
    var n = Math.max(1, Math.floor(ac.sampleRate * sec));
    var b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  //: Шумовой удар: хлопок, щётка, тарелка. `exponentialRamp` в НОЛЬ уходить не умеет -
  //: отсюда 0.0001, а не 0 (иначе Web Audio молча не применит спад, и звук оборвётся
  //: щелчком).
  function burst(ac, t0, dur, gain, type, freq, q) {
    var s = ac.createBufferSource(); s.buffer = noise(ac, dur + 0.02);
    var f = ac.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq || 1200;
    if (q) f.Q.value = q;
    var g = ac.createGain();
    g.gain.setValueAtTime(Math.max(0.0001, gain), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(_MASTER);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }

  //: Тон с атакой и спадом. Атака в 8 мс нужна против щелчка: мгновенный старт с полной
  //: громкости слышен как треск, а не как нота.
  function tone(ac, t0, dur, gain, f0, f1, type) {
    var o = ac.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(_MASTER);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  // РЕЕСТР ОДИН НА КНОПКУ И НА ПРИЁМНИК: рисуем кнопки из него же, из него же читаем
  // пришедший id. Два списка разъехались бы, и половина комнаты слышала бы не то, что
  // написано на кнопке у соседа (закон №40).
  var SOUNDS = {
    clap: { e: '👏', t: 'Хлопки', p: function (ac, t) {
      // ═══ ВТОРОЙ ЗАХОД, И ОБА ПРЕЖНИХ ПРОМАХА НАЗВАНЫ ═══
      // (1) `bandpass` c Q=1.2 на коротком шуме - РЕЗОНАТОР: звенит на своей частоте, ухо
      // слышит тон, а не удар. (2) `highpass` на 320-700 Гц оставил ВЕСЬ низ, и вышло
      // «низко, на хлопки не похоже» (живой отзыв Ren).
      // ХЛОПОК ЖИВЁТ ВЫШЕ, ЧЕМ КАЖЕТСЯ: основная энергия ладоней - 1.5-4 кГц, а спад
      // 8-15 мс, не 35. Отсюда: срез снизу от 1.2 кГц, ОЧЕНЬ короткий удар и лёгкий
      // «хвост зала» после каждого - без него это щелчки мыши, а не аплодисменты.
      for (var i = 0; i < 28; i++) {

        // сетка читается как метроном.
        var at = t + Math.pow(Math.random(), 0.5) * 1.15;
        burst(ac, at, 0.010 + Math.random() * 0.008, 0.55 + Math.random() * 0.35,
              'highpass', 1200 + Math.random() * 900, 0);
        burst(ac, at + 0.006, 0.045, 0.10 + Math.random() * 0.06, 'bandpass', 2400, 0.7);
      }
    } },
    drum: { e: '🥁', t: 'Дробь', p: function (ac, t) {
      // ═══ ПОЧЕМУ ПРЕЖНЯЯ БЫЛА «НЕ ПОХОЖА» ═══
      // `lowpass 260` на 50 мс - это глухой бубух, и двадцать таких подряд сливаются в
      // РОВНЫЙ ГУЛ. Барабанная дробь - это СУХИЕ короткие удары по пластику: середина и
      // верх (600 Гц - 5 кГц), длительность 8-14 мс, и они обязаны РАЗЛИЧАТЬСЯ поштучно.
      // Плюс дробь идёт ПАРАМИ (правая-левая) с лёгкой неровностью - ровная сетка звучит

    bell: { e: '🔔', t: 'Динь', p: function (ac, t) {

    tada: { e: '🎺', t: 'Та-да', p: function (ac, t) {

    } },
    buzz: { e: '📢', t: 'Гудок', p: function (ac, t) {
      tone(ac, t, 0.45, 0.28, 118, 108, 'square');
    } },
    pop: { e: '💧', t: 'Поп', p: function (ac, t) {
      tone(ac, t, 0.11, 0.38, 420, 950, 'sine');
    } },
    gong: { e: '⏰', t: 'Гонг', p: function (ac, t) {
      // ТРИ ОДИНАКОВЫХ СИНУСА ПОДРЯД - ЭТО БУДИЛЬНИК, А НЕ ГОНГ. У гонга ОДИН удар с
      // неровными обертонами и длинным хвостом; удар начинается шумом (било о металл),
      // дальше остаётся звон.
      burst(ac, t, 0.06, 0.34, 'lowpass', 1800, 0);
      [110, 164, 233, 311, 415].forEach(function (f, i) {
