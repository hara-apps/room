        freeApply();
        say('Вернул это окно на место.');
      });
    }
  }

  //: ТАЩИМ И ТЯНЕМ ОДНИМ КОДОМ. `pointer`-события покрывают мышь и палец сразу; два
  //: обработчика разошлись бы на первой правке (закон №40).
  function freeDrag(handle, el, kind) {
    var from = null, base = null;
    handle.addEventListener('pointerdown', function (e) {
      if (layMode !== 'free') return;
      var box = $('screens');
      var br = box.getBoundingClientRect();
      var r = el.getBoundingClientRect();
      from = { x: e.clientX, y: e.clientY, W: br.width || 1, H: br.height || 1 };
      base = { x: (r.left - br.left) / from.W, y: (r.top - br.top) / from.H,
               w: r.width / from.W, h: r.height / from.H };
      try { handle.setPointerCapture(e.pointerId); } catch (e2) {}
      e.preventDefault();
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', function (e) {
      if (!from) return;
      var dx = (e.clientX - from.x) / from.W, dy = (e.clientY - from.y) / from.H;
      var r;
      if (kind === 'move') {
        r = { x: base.x + dx, y: base.y + dy, w: base.w, h: base.h };
      } else {
        r = { x: base.x, y: base.y,
              w: Math.max(0.12, base.w + dx), h: Math.max(0.12, base.h + dy) };
      }
      r.w = Math.min(1, r.w); r.h = Math.min(1, r.h);
      r.x = Math.max(0, Math.min(1 - r.w, r.x));
      r.y = Math.max(0, Math.min(1 - r.h, r.y));
      var k = freeKey(el);
      if (k) layFree[k] = r;
      freeApply();
    });
    function done() {
      if (!from) return;
      from = null;
      freeSave();
    }
    handle.addEventListener('pointerup', done);
    handle.addEventListener('pointercancel', done);
  }

  function layPaint() {
    var box = $('screens');
    var n = vids.length;
    // ═══ ЗАКРЕПЛЕНИЕ ПОКАЗЫВАЕТСЯ ТОЛЬКО ТАМ, ГДЕ У НЕГО ЕСТЬ ПОСЛЕДСТВИЕ ═══
    // ЖИВОЙ ОТЗЫВ REN: «нажимаешь 📌 - ничего видимого не происходит». Так и было, и
    // код был при этом верен: «крупно» при ОДНОМ окне выглядит ровно как обычный вид -
    // закреплять не от чего. Кнопка, которая честно отработала и ничего не изменила,
    // читается как сломанная, поэтому при одном окне её нет вовсе (закон №36 наоборот:
    // прячем не работу, а то, чего не существует).
    // РАЗВЁРТКА ⛶ ОСТАЁТСЯ ВСЕГДА: она меняет вид и при одном окне - ровно ради этого
    // случая Ren её и просил (показ экрана обычно единственный).
    vids.forEach(function (r) {
      var pb = r.el.querySelector('.vpin');
      if (pb) pb.style.display = (n >= 2) ? '' : 'none';
      r.el.classList.toggle('haspin', n >= 2);
    });
    // «АВТО» - ЭТО НЕ ЧЕТВЁРТАЯ РАСКЛАДКА, А ПРАВИЛО: одно видео во всю ширину, два и
    // больше - сетка. Человек выбирает только тогда, когда правило ему не подходит.
    // ЗАКРЕПЛЁННОЕ ОКНО СИЛЬНЕЕ ПРАВИЛА «АВТО»: человек сказал, что смотреть крупно, и
    // переспрашивать его каждый раз, когда заговорил сосед, - это спорить с ним.
    var mode = layMode;
    // ═══ СВОБОДНЫЙ ХОЛСТ ТОЛЬКО ТАМ, ГДЕ ЕСТЬ ЧЕМ ТАЩИТЬ ═══
    // На мобиле его нет, и режим тихо становится сеткой: оставить его значило бы дать
    // кнопку, после которой окна разъезжаются в кашу и вернуть их пальцем нечем.
    if (mode === 'free' && !freeOk()) mode = 'grid';
    if (mode === 'auto') mode = layPin ? 'spk' : (n >= 2 ? 'grid' : 'one');
    box.className = (mode === 'grid') ? 'grid'
                  : (mode === 'spk' ? 'spk' : (mode === 'free' ? 'free' : ''));
    if (mode === 'free') {
      // КРИПТО-ПАНЕЛЬ ПЕРЕЕЗЖАЕТ НА ХОЛСТ. Иначе «доска и график» осталась бы
      // единственным, что нельзя подвинуть, - холст был бы наполовину свободным.
      var _cr = $('crypto');
      if (_cr && _cr.style.display !== 'none' && _cr.parentNode !== box) {
        _cr.dataset.homeparent = '1';
        box.appendChild(_cr);
      }
      vids.forEach(function (r) {
        r.el.classList.remove('big'); r.el.classList.remove('small');
        r.el.classList.remove('pinned');
      });
      var _sp0 = document.getElementById('vgrip');
      if (_sp0) _sp0.remove();
      freeApply();
    } else {
      //: КООРДИНАТЫ СНИМАЮТСЯ ПЕРВЫМ ДЕЛОМ, ДО ВСЕГО ОСТАЛЬНОГО: ниже раскладка
      //: расставляет окна классами, и оставленный инлайн победил бы её молча.
      vids.forEach(function (r) { freeClear(r.el); });
      // ВОЗВРАТ ПАНЕЛИ НА МЕСТО - ОБЯЗАТЕЛЬНАЯ ПОЛОВИНА (закон №55): уехав на холст и
      // не вернувшись, она пропала бы с экрана при первом же переключении раскладки.
      var _cr2 = $('crypto');
      if (_cr2 && _cr2.dataset.homeparent === '1') {
        delete _cr2.dataset.homeparent;
        _cr2.removeAttribute('style');
        _cr2.style.display = '';
        var _anchor = $('port');
        if (_anchor && _anchor.parentNode) _anchor.parentNode.insertBefore(_cr2, _anchor);
      }
    }
    //: ═══ РАЗВЁРНУТОЕ ОКНО РАСКЛАДКА НЕ ТРОГАЕТ (вторая половина правки 02.09) ═══
    //: Снять классы в `vfsSet` мало: `layPaint` зовут и сердцебиение графика, и приход
    //: соседа, и смена раскладки - через пять секунд `big` вернулся бы, и конфликт с
    //: ним. Развёрнутое окно живёт ОТДЕЛЬНО от потока, пока не свёрнуто.
    //: ═══ ИСКЛЮЧАЕМ ИЗ РАЗДАЧИ, А НЕ СНИМАЕМ ПОСЛЕ НЕЁ ═══
    //: ПЕРВАЯ РЕДАКЦИЯ СНИМАЛА КЛАССЫ ЗДЕСЬ И БЫЛА НЕВЕРНА, И ПОЙМАЛА ЭТО ПРОБА, А НЕ
    //: ЧТЕНИЕ: цикл раздачи `big`/`small`/`pinned` стоит НИЖЕ и возвращал их обратно тому
    //: же окну - живой прогон показал `vwrap haspin vfull big pinned`. Порядок строк тут
    //: решает исход, и полагаться на него нельзя: `layPaint` длинная, и следующая правка
    //: снова переставит их местами. Поэтому развёрнутое окно ВЫПАДАЕТ из раздачи -
    //: утверждение держится состоянием, а не расположением строк.
    function layTouch(el) { return el !== vFull; }
    if (vFull && vFull.parentNode) {
      LAY_CLS.forEach(function (c) { vFull.classList.remove(c); });
    }
    if (mode === 'spk') {
      // КРУПНО - ЗАКРЕПЛЁННЫЙ, А ЕСЛИ ЕГО НЕТ - ТОТ, КТО ГОВОРИТ. Молчат все - первый:
      // пустое место вместо картинки читается как поломка.
      var big = null;
      if (layPin) {
        vids.forEach(function (r) {
          var k = freeKey(r.el);
          if (!big && k && k === layPin) big = r;
        });
        // ЗАКРЕПЛЁННЫЙ УШЁЛ ИЗ КОМНАТЫ - ЗАКРЕПЛЕНИЕ СНИМАЕТСЯ САМО. Держать его значило
        // бы показывать крупно пустоту и не давать вернуться к нормальной раскладке.
        if (!big) { layPin = ''; laySave(); }
      }
      if (!big) {
        vids.forEach(function (r) {
          var pid = r.el.dataset.pid || '';
          if (!big && pid && people[pid] && people[pid].speaking) big = r;
        });
      }
      if (!big) big = vids[0];
      vids.forEach(function (r) {
        if (!layTouch(r.el)) return;      // развёрнутое окно вне раскладки
        r.el.classList.toggle('big', r === big);
        r.el.classList.toggle('small', r !== big);
        var k = freeKey(r.el);
        r.el.classList.toggle('pinned', !!(layPin && k === layPin));
      });
      laySplit(box);
    } else {
      vids.forEach(function (r) {
        r.el.classList.remove('big'); r.el.classList.remove('small');
        r.el.classList.remove('pinned');
      });
      // ДЕЛИТЬ НЕЧЕГО - ПОЛОСЫ НЕТ ВОВСЕ (закон №36). Она живёт РОВНО в режиме «крупно»:
      // в сетке тянуть не за что, и оставленная полоса читалась бы как сломанная кнопка.
      // УБОРКА СТОИТ ИМЕННО ЗДЕСЬ, В ВЕТКЕ «не крупно»: вынеси её наружу - и она сносила
      // бы полосу СРАЗУ ПОСЛЕ того, как ветка «крупно» её создала (поймано пробой:
      // «делителя между окнами нет» при верном на вид коде).
      var _sp = document.getElementById('vgrip');
      if (_sp) _sp.remove();
    }
    // ГОВОРЯЩИЙ - ОБВОДКОЙ ПЛИТКИ, И ЭТО ОДНО МЕСТО НА ВСЕ РАСКЛАДКИ. Раскладка отвечает
    // на вопрос «где окна», подсветка - «кто сейчас говорит»; свяжи их, и в сетке
    // говорящий перестал бы подсвечиваться вовсе.
    vids.forEach(function (r) {
      var pid = r.el.dataset.pid || '';
      r.el.classList.toggle('speaking', !!(pid && people[pid] && people[pid].speaking));
    });
    //: ПОДПИСЬ КРАСИТСЯ ПОСЛЕ ВСЕХ ВЕТОК, А НЕ ВНУТРИ ОДНОЙ. Класс `pinned` ставит
    //: ветка «крупно» и снимает ветка «не крупно»; покрась подпись внутри первой - и
    //: она осталась бы «Снять» после переключения в сетку. Тот же порядок уже стоил
    //: круга на делителе окон.
    vids.forEach(function (r) { pinLabel(r.el); });
    var b = $('lay');
    if (b) {
      // РАСКЛАДЫВАТЬ НЕЧЕГО - КНОПКИ НЕТ. Она бы переключала невидимое и читалась как
      // сломанная (закон №36: причина рядом, а не молчание после тапа).
      b.style.display = n ? '' : 'none';
      b.textContent = '🔲 Раскладка: ' + LAY_NAMES[layMode];
      b.classList.toggle('on', layMode !== 'auto');
    }
  }

  // ═══ ДЕЛИТЕЛЬ МЕЖДУ ОКНАМИ: ТЯНЕШЬ - МЕНЯЕТСЯ ТОЛЬКО ТВОЙ ЭКРАН ═══
  // Полоса живёт РОВНО в режиме «крупно»: в сетке делить нечего, и полоса там была бы
  // кнопкой, которая ничего не делает. Высоту храним в пикселях у себя (закон о личном
  // против общего: раскладка это вкус, а не состояние комнаты).
  // МЫШЬ И ПАЛЕЦ - ОДИН КОД: `pointer`-события покрывают оба, а два обработчика разошлись
  // бы на первой правке (закон №40).
  function laySplit(box) {
    // ═══ СВОБОДНЫЙ РАЗМЕР: ЗА УГОЛ, ШИРИНА И ВЫСОТА (требование Ren 30.08) ═══
    // Полоса под окном была `cursor:row-resize` и читала ТОЛЬКО `clientY` - то есть
    // тянулась исключительно по высоте, а договаривались про размер, как у окна в
    // системе. Уголок живёт НА САМОЙ КРУПНОЙ ПЛИТКЕ, а не отдельным блоком: элемент,
    // прибитый к соседу, уезжает от него при первой же смене раскладки.
    var big = box.querySelector('.vwrap.big');
    var old = document.getElementById('vgrip');
    if (!big) { if (old) old.remove(); return; }
    var sp = old;
    if (!sp) {
      sp = document.createElement('div');
      sp.id = 'vgrip';
      sp.title = 'Тяни за угол - ширина и высота. Двойной тап - вернуть как было';
      var from = null, baseH = 0, baseW = 0;
      sp.addEventListener('pointerdown', function (e) {
        var b = box.querySelector('.vwrap.big');
        if (!b) return;
        var r = b.getBoundingClientRect();
        from = { x: e.clientX, y: e.clientY };
        baseH = r.height; baseW = r.width;
        //: ═══ ПОКА ТЯНЕМ - ПЛИТКУ НЕ ПЕРЕСОБИРАЕМ (первая половина дёрганья) ═══
        //: `laySplit` при каждой перерисовке делает `big.appendChild(sp)`, а перемещение
        //: узла в DOM СНИМАЕТ захват указателя. Перерисовка идёт постоянно: обводка
        //: говорящего живёт в том же `layPaint`, и на живом созвоне она меняется по
        //: несколько раз в секунду. Захват терялся, `pointermove` переставал доходить, а
        //: `from` оставался - и следующее попадание пальца по уголку считалось от старой
        //: точки. Это и есть «скачет влево-вправо».
        window.__VGRIP_DRAG = 1;
        try { sp.setPointerCapture(e.pointerId); } catch (e2) {}
        e.preventDefault();
      });
      sp.addEventListener('pointermove', function (e) {
        if (!from) return;
        // ПОТОЛКИ НЕ УКРАШЕНИЕ: без нижнего окно схлопывается в ноль и вернуть его нечем
        // (тянуть станет не за что), без верхнего уезжают все остальные плитки.
        //: ═══ ПЛИТКА ОТЦЕНТРОВАНА, ЗНАЧИТ ШИРИНА РАСТЁТ ВДВОЕ БЫСТРЕЕ КРАЯ ═══
        //: ВТОРАЯ ПОЛОВИНА ДЁРГАНЬЯ, и она чисто арифметическая. У крупной плитки стоит
        //: `margin-left:auto; margin-right:auto` - она ЦЕНТРИРУЕТСЯ. Прибавив к ширине
        //: Δ, мы двигаем правый край всего на Δ/2, а уголок прибит к этому краю: палец
        //: ушёл на Δ, уголок - на половину, и человек весь драг догоняет собственную
        //: руку. По высоте центрирования нет, поэтому там множитель единица.
        var h = Math.max(120, Math.min(window.innerHeight * 0.85,
                                       baseH + (e.clientY - from.y)));
        var w = Math.max(160, Math.min(box.clientWidth || window.innerWidth,
                                       baseW + (e.clientX - from.x) * 2));
        layBigH = Math.round(h); layBigW = Math.round(w);
        box.style.setProperty('--bigh', layBigH + 'px');
        box.style.setProperty('--bigw', layBigW + 'px');
      });
      function stop() {
        window.__VGRIP_DRAG = 0;
        if (from) { from = null; laySave(); }
      }
      sp.addEventListener('pointerup', stop);
      sp.addEventListener('pointercancel', stop);
      // ОБРАТНЫЙ ПУТЬ У РАЗМЕРА ТОЖЕ ЕСТЬ (закон №55): утянул окно не туда - двойной тап
      // возвращает как было, и искать «сброс» в меню не нужно. Возвращаются ОБА размера:
      // вернуть половину значит оставить окно кривым и без способа это починить.
      sp.addEventListener('dblclick', function () {
        layBigH = 0; layBigW = 0;
        box.style.removeProperty('--bigh'); box.style.removeProperty('--bigw');
        laySave();
        say('Размер окна вернул к обычному.');
      });
    }
    // УГОЛОК ПЕРЕЕЗЖАЕТ К НЫНЕШНЕЙ КРУПНОЙ ПЛИТКЕ: закрепили другого - тянуть надо его.
    // НО НЕ ВО ВРЕМЯ ТЯГИ: перемещение узла снимает захват указателя, и драг рассыпается
    // ровно тогда, когда кто-то говорит (перерисовка идёт из-за обводки говорящего).
    if (sp.parentNode !== big && !window.__VGRIP_DRAG) big.appendChild(sp);
    if (layBigH) box.style.setProperty('--bigh', layBigH + 'px');
    if (layBigW) box.style.setProperty('--bigw', layBigW + 'px');
  }

  // ═══ ВО ВЕСЬ ЭКРАН: У TELEGRAM СВОЙ API, У БРАУЗЕРА СВОЙ ═══
  // Кнопка появляется ТОЛЬКО там, где хоть один из них есть: на клиенте старее Bot API 8.0
  // её быть не должно вовсе - кнопка, после которой ничего не происходит, хуже отсутствующей.
  var fullOn = false;

  function fullCan() {
    return !!(tg && typeof tg.requestFullscreen === 'function')
        || !!(document.documentElement && document.documentElement.requestFullscreen);
  }

  function fullPaint() {
    var b = $('full');
    if (!b) return;
    b.style.display = fullCan() ? '' : 'none';
    b.classList.toggle('on', fullOn);
    b.textContent = fullOn ? '⛶ Свернуть' : '⛶ Во весь экран';
  }

  // ═══ КАЧЕСТВО СВЯЗИ: ЦИФРЫ ВМЕСТО «У МЕНЯ ЗАИКАЕТСЯ» ═══
  // ЖИВОЙ СОЗВОН НЕСКОЛЬКИХ ЧЕЛОВЕК (Ren 27.08): «непонятно, у кого плохо со связью».
  // По жалобе делать нечего: она не говорит НИ КТО, НИ НАСКОЛЬКО. Пороги названы им же -
  // потери больше 2% и джиттер больше 30 мс.
  //: ПОТЕРИ СЧИТАЮТСЯ ЗА ОКНО, А НЕ ОТ НАЧАЛА СОЗВОНА. Накопленный процент за час
  //: показывает историю, а вопрос у человека про СЕЙЧАС: одна плохая минута в начале
  //: разговора не должна красить весь остаток.
  var LOSS_BAD = 2, JIT_BAD = 30, STAT_EVERY = 10000;
  var statPrev = {};          // identity -> {lost, recv}
  var statLast = {};          // identity -> {loss, jit, rtt} последнего окна
  var statSaid = false;       // говорили ли уже, что статистики у клиента нет

  function statFmt(nm, q) {
    var bad = (q.loss > LOSS_BAD) || (q.jit > JIT_BAD);
    return nm + ': ' + q.loss.toFixed(1) + '% потерь, джиттер ' + Math.round(q.jit) + ' мс'
      + (q.rtt ? ', RTT ' + Math.round(q.rtt) + ' мс' : '') + (bad ? ' ⚠️' : '');
  }

  // ═══ ЧТО СЛЫШУ И ВИЖУ Я САМ: МЕТРИКИ ПРИЁМА ═══
  // ЖИВОЙ СЛУЧАЙ (боевой созвон 31.08): у Максима, который НЕ СЛЫШАЛ, строка показывала
  // «0.0% потерь, джиттер 5 мс». Числа были верные и отвечали НЕ НА ТОТ ВОПРОС: снимок
  // делает КАЖДЫЙ у себя, а отправляет боту ОДИН - админ. Значит «Максим: 0%» означало
  // «АДМИН принял Максима чисто», то есть говорило про путь ЕГО ГОЛОСА НАРУЖУ и ничего -
  // про то, что доходило ДО НЕГО. Про свой приём человек обязан узнать сам и от себя.
  //
  // ЧЕМ ВИДНЫ РЫВКИ. Потери и джиттер описывают ТРАНСПОРТ, а рвётся звук в ПЛЕЕРЕ:
  // `concealedSamples` - это сэмплы, которых не было и которые кодек ДОРИСОВАЛ. Их доля
  // от `totalSamplesReceived` и есть «сколько звука я на самом деле не услышал», и
  // именно она отличает «шуршит» от «рвётся». Ни одна из прежних цифр её не показывала.
  var RX_CONCEAL_BAD = 3;     // % дорисованного звука, выше которого это слышно
  var RX_LOST_BAD = 3;        // % потерь на приёме
  var RX_JBUF_BAD = 300;      // мс задержки буфера: столько уже слышно как отставание
  var rxPrev = {};            // sid -> прошлые счётчики (считаем ЗА ОКНО, не от начала)
  var rxLast = { bad: false, why: '', quiet: false, at: 0 };
  var rxSaidAt = 0;
  //: «ПОСАЖЕНО ЛИ ВИДЕО» - ЭТО ФАКТ РЕЕСТРА, А НЕ ОТДЕЛЬНЫЙ ФЛАГ (закон №35). Флаг
  //: разъезжается с делом на первом же расхождении: дорожка ушла из комнаты, флаг
  //: остался - и обратный путь «уже сделан».
  function rxIsLow() { for (var k in rxLowSids) { if (rxLowSids[k]) return true; } return false; }

  function rxPct(cur, prev, a, b) {
      //: доля a от (a+b) ЗА ОКНО. Накопленный процент за час отвечает на другой вопрос:
      //: одна плохая минута в начале не должна красить весь остаток.
      var da = Math.max(0, (cur[a] || 0) - (prev[a] || 0));
      var db = Math.max(0, (cur[b] || 0) - (prev[b] || 0));
      return (da + db) ? (100 * da / (da + db)) : 0;
  }

  async function rxOnce() {
      //: -> {bad, why, quiet, rows}. Мерит ВХОДЯЩИЕ дорожки: что дошло ДО МЕНЯ.
      if (!room || !connected) return null;
      var ps = [];
      room.remoteParticipants.forEach(function (p) { ps.push(p); });
      var rows = [], worst = '', bad = false, heard = 0, audios = 0;
      for (var i = 0; i < ps.length; i++) {
          var p = ps[i], pubs = [];
          var m = p.trackPublications || p.tracks;
          if (m && m.forEach) m.forEach(function (pub) { pubs.push(pub); });
          for (var k = 0; k < pubs.length; k++) {
              // ═══ КАЖДАЯ ДОРОЖКА, А НЕ ПЕРВАЯ ПОПАВШАЯСЯ ═══
              // Прежний цикл делал `break` на первой, у которой нашлась статистика.
              // У участника их две, и порядок нам не принадлежит: попадись первой
              // видео - звук не мерился ВООБЩЕ, а строка выглядела полной.
              var pub = pubs[k], t = pub && pub.track;
              if (!t || typeof t.getRTCStatsReport !== 'function') continue;
              var isAudio = String(pub.kind || t.kind || '').indexOf('audio') >= 0;
              if (isAudio) audios++;
              var rep = null;
              try { rep = await t.getRTCStatsReport(); } catch (e) { rep = null; }
              if (!rep || !rep.forEach) continue;
              var cur = null;
              rep.forEach(function (st) {
                  if (st.type !== 'inbound-rtp') return;
                  cur = {
                      lost: Number(st.packetsLost || 0),
                      recv: Number(st.packetsReceived || 0),
                      conceal: Number(st.concealedSamples || 0),
                      samples: Number(st.totalSamplesReceived || 0),
                      jbuf: Number(st.jitterBufferDelay || 0),
                      jemit: Number(st.jitterBufferEmittedCount || 0),
                      lvl: Number(st.audioLevel || 0),
                  };
              });
              if (!cur) continue;
              var sid = (pub.trackSid || pub.sid || (p.identity + ':' + k));
              var prev = rxPrev[sid] || {};
              rxPrev[sid] = cur;
              if (!Object.keys(prev).length) continue;   // первое окно - не с чем сравнить
              var loss = rxPct(cur, prev, 'lost', 'recv');
              var nm = (people[p.identity] && people[p.identity].name)
                    || human(p.name, p.identity);
              if (!isAudio) {
                  if (loss > RX_LOST_BAD) {
                      bad = true;
                      rows.push(nm + ' (видео): ' + loss.toFixed(1) + '% потерь');
                  }
                  continue;
              }
              // ДОЛЯ ДОРИСОВАННОГО: вот это и есть «рвётся».
              var conceal = rxPct(cur, prev, 'conceal', 'samples');
              //: `jitterBufferDelay` - НАКОПЛЕННАЯ сумма в секундах, а не «текущая
              //: задержка». Среднее по окну = прирост суммы / прирост числа кадров.
              var dj = Math.max(0, cur.jbuf - (prev.jbuf || 0));
              var de = Math.max(0, cur.jemit - (prev.jemit || 0));
              var jms = de ? (1000 * dj / de) : 0;
              if (cur.samples > (prev.samples || 0)) heard++;
              var mine = [];
              if (loss > RX_LOST_BAD) mine.push(loss.toFixed(1) + '% потерь');
              if (conceal > RX_CONCEAL_BAD) mine.push('дорисовано ' + conceal.toFixed(1) + '%');
              if (jms > RX_JBUF_BAD) mine.push('буфер ' + Math.round(jms) + ' мс');
              if (mine.length) { bad = true; rows.push(nm + ': ' + mine.join(', ')); }
              if (conceal > RX_CONCEAL_BAD && !worst) worst = nm;
          }
      }
      // ═══ «МЕНЯ НЕ СЛЫШНО» И «Я НЕ СЛЫШУ» - РАЗНЫЕ БЕДЫ, И ВТОРАЯ ВИДНА ОТСЮДА ═══
      // Все входящие звуковые дорожки без прироста сэмплов при живых соседях означают,
      // что до меня не доходит НИЧЕЙ звук. Это не требует жалобы человека - это факт.
      var quiet = (audios > 0 && heard === 0);
      rxLast = { bad: bad, why: rows.join(' · '), quiet: quiet, at: Date.now(),
                 worst: worst };
      try { window.__RX = rxLast; } catch (e) {}
      return rxLast;
  }

  //: КОГО ИМЕННО МЫ ПОСАДИЛИ. Возвращать надо РОВНО ИХ, а не всё видео подряд: у
  //: остальных слой выбирает `adaptiveStream` по размеру плитки, и наш «возврат» стал бы
  //: тихой отменой его работы - маленькое окно навсегда получало бы полное разрешение.
  var rxLowSids = {};

  function rxVidEl(pub) {
      //: Плитка этой дорожки. `vids` - наш же реестр окон (`addVideo`).
      var t = pub && pub.track;
      if (!t) return null;
      for (var i = 0; i < vids.length; i++) {
          if (vids[i].t === t) { try { return vids[i].el.querySelector('video'); } catch (e) {} }
      }
      return null;
  }

  function rxEachRemoteVideo(fn) {
      //: ОДИН ОБХОД НА ОБЕ СТОРОНЫ: две копии «как найти чужое видео» разошлись бы, и
      //: обратный путь однажды пропустил бы дорожку, которую прямой посадил (закон №40).
      if (!room) return 0;
      var n = 0, ps = [];
      room.remoteParticipants.forEach(function (p) { ps.push(p); });
      for (var i = 0; i < ps.length; i++) {
          var pubs = [], m = ps[i].trackPublications || ps[i].tracks;
          if (m && m.forEach) m.forEach(function (pub) { pubs.push(pub); });
          for (var k = 0; k < pubs.length; k++) {
              var pub = pubs[k];
              if (String(pub.kind || '').indexOf('video') < 0) continue;
              var sid = String(pub.trackSid || (pub.track && pub.track.sid) || '');
              if (!sid) continue;
              try { if (fn(pub, sid)) n++; } catch (e) {}
          }
      }
      return n;
  }

  function rxLowerVideo() {
      //: САДИМСЯ НА НИЖНИЙ СЛОЙ, А НЕ ОТКАЗЫВАЕМСЯ ОТ ВИДЕО. Человек пришёл смотреть
      //: показ экрана; отняв картинку целиком, мы решили бы за него. Simulcast для того
      //: и включён - у дорожки есть слои LOW/MEDIUM/HIGH, и слабому каналу берётся LOW.
      //: -> сколько дорожек посадили.
      if (!room || !LOW_ON_BAD) return 0;
      var Q = (LK.VideoQuality && LK.VideoQuality.LOW);
      if (Q === undefined || Q === null) return 0;
      var n = rxEachRemoteVideo(function (pub, sid) {
          if (typeof pub.setVideoQuality !== 'function') return false;
          pub.setVideoQuality(Q);
          rxLowSids[sid] = 1;          //: помним ИМЕННО ЭТУ - вернём тоже её
          return true;
      });
      if (n) console.log('[rtc] слабый приём: посадил ' + n + ' видео на нижний слой');
      return n;
  }

  function rxRestoreVideo() {
      //: ОБРАТНЫЙ ПУТЬ ОБЯЗАТЕЛЕН (закон №55). Связь выправилась - картинку возвращаем,
      //: иначе один плохой десятисекундный отрезок навсегда оставлял бы человека с
      //: мылом вместо показа, и понять почему он не смог бы ничем.
      //:
      //: ВОЗВРАЩАЕМ УПРАВЛЕНИЕ `adaptiveStream`, А НЕ ПРИБИВАЕМ К HIGH. У SDK эти два
      //: способа исключают друг друга: заданное качество отменяет выбор по размеру
      //: плитки, а заданный размер - выбор качества. Прибей мы HIGH, маленькое окно
      //: после первого же плохого отрезка навсегда тянуло бы полное разрешение - то
      //: есть «лечение» жгло бы полосу сильнее болезни. Размер берём у САМОГО элемента:
      //: это ровно то, чем adaptiveStream и руководствуется.
      if (!room) return 0;
      var n = rxEachRemoteVideo(function (pub, sid) {
          if (!rxLowSids[sid]) return false;      //: эту дорожку сажали не мы
          var el = rxVidEl(pub);
          var w = el && (el.clientWidth || el.videoWidth);
          var h = el && (el.clientHeight || el.videoHeight);
          if (typeof pub.setVideoDimensions === 'function' && w > 0 && h > 0) {
              pub.setVideoDimensions({ width: Math.round(w), height: Math.round(h) });
          } else if (typeof pub.setVideoQuality === 'function') {
              //: ЗАПАСНОЙ ПУТЬ, И ЕГО ЦЕНА НАЗВАНА: размера нет (окно скрыто, метод у
              //: этой сборки SDK отсутствует) - прибиваем HIGH. Это хуже адаптивного
              //: выбора, но лучше, чем оставить человека с нижним слоем навсегда.
              var Q = (LK.VideoQuality && LK.VideoQuality.HIGH);
              if (Q === undefined || Q === null) return false;
              pub.setVideoQuality(Q);
          } else {
              return false;
          }
          delete rxLowSids[sid];
          return true;
      });
      if (n) console.log('[rtc] приём выправился: вернул ' + n + ' видео');
      return n;
  }

  async function rxTick() {
      //: ГОВОРИМ ЧЕЛОВЕКУ ПРО ЕГО СОБСТВЕННЫЙ ПРИЁМ, а не молчим при зелёных цифрах.
      var r = null;
      try { r = await rxOnce(); } catch (e) { r = null; }
      if (!r) return;
      var box = $('rxq');
      if (r.quiet) {
          //: ЭТО СИЛЬНЕЕ ЛЮБОЙ ЖАЛОБЫ: соседи публикуют звук, а до нас не доходит ничей.
          if (box) box.textContent = 'Ты никого не слышишь: звук соседей до тебя не '
                                   + 'доходит. Проверь связь или перезайди в комнату.';
          if (box) box.style.display = '';
          return;
      }
      if (r.bad) {
          //: САЖАЕМ НА КАЖДОМ ПЛОХОМ ТИКЕ, А НЕ ОДИН РАЗ. Пока связь плохая, сосед может
          //: включить камеру - при «уже посадили, больше не трогаем» его дорожка пришла бы
          //: полным слоем ровно в тот момент, когда человеку и без неё тяжело.
          rxLowerVideo();
          if (box) {
              box.textContent = 'Связь слабая, звук рвётся (' + cut(r.why, 90) + '). '
                              + (rxIsLow() ? 'Видео убавил. ' : '')
                              + 'Если не помогло - выключи камеру и показ экрана.';
              box.style.display = '';
          }
          rxSaidAt = Date.now();
          return;
      }
      //: ВЫПРАВИЛОСЬ - СНИМАЕМ И ГОВОРИМ ЭТО. Строка, которая осталась висеть после
      //: того, как всё наладилось, читается как «до сих пор плохо».
      if (rxIsLow()) rxRestoreVideo();
      if (box && box.style.display !== 'none' && Date.now() - rxSaidAt > 8000) {
          box.textContent = ''; box.style.display = 'none';
      }
  }

  async function statsOnce() {
    if (!room || !connected) return;
    var rows = [];
    var ps = [];
    room.remoteParticipants.forEach(function (p) { ps.push(p); });
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      var pubs = [];
      var m = p.trackPublications || p.tracks;
      if (m && m.forEach) m.forEach(function (pub) { pubs.push(pub); });
      var got = null;
      for (var k = 0; k < pubs.length; k++) {
        var t = pubs[k].track;
        // ЧИСЛА БЕРЁМ У ТОГО, КТО ИХ ЗНАЕТ, И НЕ ВЫДУМЫВАЕМ, ЕСЛИ ОН МОЛЧИТ (закон №22):
        // у старого клиента этого метода нет вовсе, и «0% потерь» было бы враньём.
        if (!t || typeof t.getRTCStatsReport !== 'function') continue;
        var rep2 = null;
        try { rep2 = await t.getRTCStatsReport(); } catch (e) { rep2 = null; }
        if (!rep2 || !rep2.forEach) continue;
        var lost = 0, recv = 0, jit = 0, rtt = 0, seen = false;
        rep2.forEach(function (st) {
          if (st.type === 'inbound-rtp') {
            seen = true;
            lost += Number(st.packetsLost || 0);
            recv += Number(st.packetsReceived || 0);
            jit = Math.max(jit, Number(st.jitter || 0) * 1000);
          } else if (st.type === 'candidate-pair' && st.currentRoundTripTime) {
            rtt = Math.max(rtt, Number(st.currentRoundTripTime) * 1000);
          } else if (st.type === 'remote-inbound-rtp' && st.roundTripTime) {
            rtt = Math.max(rtt, Number(st.roundTripTime) * 1000);
          }
        });
        if (!seen) continue;
        var prev = statPrev[p.identity] || { lost: 0, recv: 0 };
        var dl = Math.max(0, lost - prev.lost), dr = Math.max(0, recv - prev.recv);
        statPrev[p.identity] = { lost: lost, recv: recv };
        got = { loss: (dl + dr) ? (100 * dl / (dl + dr)) : 0, jit: jit, rtt: rtt };
        break;
      }
      if (!got) continue;
      statLast[p.identity] = got;
      // ИМЯ БЕРЁМ ИЗ СПИСКА КОМНАТЫ, А НЕ У `nameOf`: та живёт в области видимости `go()`,
      // и модульная функция её не видит - вышло бы «nameOf is not a function» на первом
      // же тике, то есть строка связи не появилась бы НИ РАЗУ.
      var _nm = (people[p.identity] && people[p.identity].name)
             || human(p.name, p.identity);
      rows.push(statFmt(_nm, got));
    }
    var box = $('connq');
    if (box) {
      // МОЛЧАНИЕ КЛИЕНТА НАЗЫВАЕТСЯ ОДИН РАЗ, А НЕ КАЖДЫЕ ДЕСЯТЬ СЕКУНД.
      if (!rows.length && !statSaid) {
        statSaid = true;
        box.textContent = ps.length
          ? 'Связь: клиент не отдаёт статистику - цифр по участникам не будет.'
          : '';
      } else if (rows.length) {
        statSaid = false;
        box.textContent = 'Связь (за 10 с): ' + rows.join(' · ');
      }
    }
    return rows;
  }

  // ═══ ТИК ЖИВЁТ РЯДОМ С ЗАМЕРОМ, А НЕ ВНУТРИ ВЕТКИ ПОДПИСИ ═══
  // Собирает цифры КАЖДЫЙ (это его канал), а отправляет боту только админ: пришли снимок
  // все, в логе лежало бы N копий одного разговора. Внутри `if (initData)` тик был бы
  // невидим соседям - в частности, приходу нового участника, а это ровно тот момент,
  // когда его связь интересна.
  var _statTick = 0;
  async function statTick() {
    var rows = await statsOnce();
    // МОЙ ПРИЁМ СЧИТАЕТСЯ ТЕМ ЖЕ ТИКОМ, НО ЖИВЁТ ОТДЕЛЬНО: у него другой адресат (я, а
    // не админ), другой вопрос (что дошло ДО меня) и другое действие (убавить видео).
    try { await rxTick(); } catch (e) { console.warn('[rx] тик приёма:', e); }
    _statTick++;
    if (!initData || !iAmAdm || !rows || !rows.length || (_statTick % 6)) return;
    try {
      var r = await fetch(API + '/signal', {
        method: 'POST',
        headers: { 'X-Init-Data': initData, 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind: 'rtcstat', room: ROOM, rows: rows.slice(0, 20) }),
      });
      // ═══ НЕУДАЧА НЕ ЛОМАЕТ РАЗГОВОР, НО И НЕ ИСЧЕЗАЕТ БЕССЛЕДНО ═══
      // Строка связи на экране считается локально и работает при любом исходе, поэтому
      // человеку тут говорить нечего. А вот пустой `catch {}` означал бы, что «в логе нет
      // связи» и «Worker выложен старой версией и про `rtcstat` не знает» выглядят
      // одинаково, - а разбор начинается ровно с этого различия.
      if (!r.ok) console.warn('[rtcstat] ящик не принял: HTTP', r.status);
    } catch (e) { console.warn('[rtcstat] не отправилось:', e); }
  }
  // ПЕРВЫЙ ЗАМЕР - СРАЗУ, А НЕ ЧЕРЕЗ ОКНО. Ждать десять секунд пустой строки человек
  // читает как «статистики нет»; первое окно короче, и это честно - оно и правда короче.
  setTimeout(statTick, 1500);
  setInterval(statTick, STAT_EVERY);

  // СКОЛЬКО ЧЕЛОВЕК В КОМНАТЕ - ОТДЕЛЬНОЙ СТРОКОЙ И ВСЕГДА. Список из одной строки «Ты»
  // не отвечает на вопрос «я тут один или другие ещё не зашли»: это два разных решения -
  // ждать или звать людей. Число считается ПО ТОМУ ЖЕ объекту, что рисует список, а не
  // отдельным счётчиком - два счётчика разошлись бы на первом же выходе участника.
  function headcount() {
    var n = Object.keys(people).length;
    if (n <= 1) return 'В комнате: только ты';
    var tail = (n % 10 === 1 && n % 100 !== 11) ? 'человек'
             : ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'человека'
             : 'человек');
    return 'В комнате: ' + n + ' ' + tail;
  }

  // ═══════════════ КОТ КАК АВАТАР УЧАСТНИКА ═══════════════════════════════════════
  // ОДНА ГЕОМЕТРИЯ, ЧЕТЫРЕ ОСИ, НИКАКОГО ХРАНИЛИЩА. Рисовать N разных котов значило бы
  // держать N кусков разметки и править их по одному; вместо этого оси выводятся
  // ДЕТЕРМИНИРОВАННО из identity участника - тот же id даёт того же кота в любой сессии
  // и у любого зрителя, и хранить нечего вовсе.
  // ПОЧЕМУ НЕ АВАТАР TELEGRAM (решение Ren): `photo_url` приходит не всегда, у веб-гостя
  // его нет ВООБЩЕ, чтение пикселей с чужого домена требует прокси через Worker, а
  // доминирующий цвет фотографии - это обычно стена за спиной. То есть путь длиннее,
  // ломается чаще и даёт худший результат.
  var CAT_FUR = ['--cat-1', '--cat-2', '--cat-3', '--cat-4', '--cat-5', '--cat-6'];
  var CAT_PAT = ['plain', 'stripe', 'spot', 'socks'];
  var CAT_TOP = ['none', 'torn', 'bow', 'tuft'];

  //: FNV-1a: коротко, без зависимостей и одинаково на всех клиентах. Криптостойкость тут
  //: не нужна - нужна ПОВТОРЯЕМОСТЬ, и именно её проверяет проба.
  function catHash(id) {
    var h = 2166136261, t = String(id == null ? '' : id), i;
    for (i = 0; i < t.length; i++) {
      h ^= t.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h >>> 0;
  }

  //: -> {fur, pat, eye, top} | null. БЕЗ id КОТА НЕТ, И ЭТО НЕ ПАДЕНИЕ: у части событий
  //: SDK identity приходит пустым, и «нарисуем какого-нибудь» означало бы, что один и тот
  //: же человек показывается разными котами.
  function catAxes(id) {
    var t = String(id == null ? '' : id);
    if (!t) return null;
    var h = catHash(t);
    return {
      fur: CAT_FUR[h % CAT_FUR.length],
      pat: CAT_PAT[(h >>> 3) % CAT_PAT.length],
      eye: (h >>> 6) % 4,
      top: CAT_TOP[(h >>> 9) % CAT_TOP.length]
    };
  }

  //: ГЛАЗА - ЧЕТЫРЕ ФОРМЫ ОДНОЙ ГЕОМЕТРИИ. Дремота НЕ отдельная картинка: тот же элемент
  //: сжимается по вертикали классом `nap`, поэтому «бодрый» и «дремлющий» не могут
  //: разойтись между собой при правке.
  var CAT_EYE = [[2.6, 3.4], [3.2, 2.2], [3.0, 3.0], [2.0, 2.8]];

  function catSvg(id, size) {
    var a = catAxes(id);
    if (!a) return '';
    var e = CAT_EYE[a.eye], rx = e[0], ry = e[1];
    var fur = 'fill:var(' + a.fur + ')';
    var out = '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '">'
            + '<g class="c-body">';
    // УХО: НАДОРВАННОЕ - ЭТО ТА ЖЕ ФИГУРА С ВЫРЕЗОМ, а не второй рисунок.
    out += '<path class="c-ear" d="M14 26 L18 12 L28 20 Z"/>';
    out += (a.top === 'torn')
      ? '<path class="c-ear" d="M50 26 L46 12 L42 17 L45 19 L36 20 Z"/>'
      : '<path class="c-ear" d="M50 26 L46 12 L36 20 Z"/>';
    out += '<ellipse class="c-head" style="' + fur + '" cx="32" cy="34" rx="20" ry="17"/>';
    // УЗОР ЛЕЖИТ ПОВЕРХ ГОЛОВЫ И БЕРЁТ ЕЁ ЖЕ ЦВЕТ ПОД ДРУГОЙ ПРОЗРАЧНОСТЬЮ: свой цвет
    // означал бы седьмой токен и седьмую проверку контраста ни за чем.
    if (a.pat === 'stripe') {
      out += '<path d="M24 20 q3 6 0 12 M32 18 q3 7 0 14 M40 20 q3 6 0 12" '
           + 'style="stroke:var(' + a.fur + ');fill:none" stroke-width="2.4" '
           + 'stroke-linecap="round" opacity=".55"/>';
    } else if (a.pat === 'spot') {
      out += '<g style="' + fur + '" opacity=".5">'
           + '<ellipse cx="22" cy="24" rx="4" ry="3"/>'
           + '<ellipse cx="42" cy="26" rx="3" ry="2.4"/></g>';
    } else if (a.pat === 'socks') {
      out += '<ellipse style="' + fur + '" opacity=".45" cx="32" cy="45" rx="9" ry="5"/>';
    }
    out += '<g class="c-eyes">'
         + '<ellipse class="c-eye" cx="25" cy="32" rx="' + rx + '" ry="' + ry + '"/>'
         + '<ellipse class="c-eye" cx="39" cy="32" rx="' + rx + '" ry="' + ry + '"/></g>';
    out += '<path class="c-nose" d="M31 39 h2 l-1 1.6 Z"/>';
    out += '<path class="c-wh" d="M12 36 h8 M12 40 h8 M52 36 h-8 M52 40 h-8"/>';
    out += '<path class="c-tail" d="M52 44 q8 2 6 10"/>';
    if (a.top === 'bow') {
      out += '<path d="M40 15 l5 -4 v8 Z M46 15 l5 -4 v8 Z" style="fill:var(--acc-h)"/>';
    } else if (a.top === 'tuft') {
      out += '<path d="M30 18 q2 -7 5 -8 q-1 5 1 7" style="stroke:var(' + a.fur
           + ');fill:none" stroke-width="2" stroke-linecap="round"/>';
    }
    return out + '</g></svg>';
  }
  //: НАРУЖУ - ЧИСТОЙ ФУНКЦИЕЙ. Повторяемость кота нельзя увидеть чтением кода:
  //: любой хэш «выглядит детерминированным». Проба спрашивает ФАКТ.
  window.catSvg = catSvg;

  function draw() {
    var box = $('people');
    box.innerHTML = '';
    var ids = Object.keys(people);
    if (connected) sub(headcount());
    if (!ids.length) { box.innerHTML = '<div class="me">Пока никого</div>'; return; }
    ids.forEach(function (id) {
      var p = people[id];
      var row = document.createElement('div');
      row.className = 'p';
      // ОЧЕРЕДЬ СЛОВА - ЭТО ПОРЯДОК, А НЕ ФЛАЖОК: номер считается по времени поднятия,
      // иначе «кто раньше поднял» решает случайный порядок объекта.
      var q2 = ids.filter(function (x) { return people[x].hand; })
                  .sort(function (a, b) { return people[a].hand - people[b].hand; });
      var pos = q2.indexOf(id);
      // ═══ ЗНАЧОК ШУМОДАВА - ТОЛЬКО АДМИНУ, И ЭТО НЕ СЕКРЕТНОСТЬ, А ЧИСТОТА СПИСКА ═══
      // Остальным он не отвечает ни на один вопрос: своё состояние человек видит на своей
      // же кнопке, а чужое ему нечем изменить. Админу же это ЕДИНСТВЕННЫЙ способ увидеть
      // ФАКТ вместо своей отправленной просьбы.
      // «Неизвестно» отличается от «выключен»: сосед со старой страницей про шумодав не
      // рассказывает вовсе, и молчание не значит «у него выключено».
      var _rn = (iAmAdm && !p.me)
        ? (p.rnn === undefined ? '<span class="hand">🔇?</span> '
                               : (p.rnn ? '<span class="hand">🔇</span> ' : ''))
        : '';
      // ═══ «ОТОШЁЛ» ВИДЕН ВСЕМ, И ЭТО ВЕСЬ СМЫСЛ СТАТУСА ═══
      // Он отвечает соседям на вопрос «ждать ли от него ответа». Метка стоит РЯДОМ С
      // ИМЕНЕМ, а не в общем состоянии: то перетирается следующим сообщением.
      var _aw = p.away ? '<span class="hand">⏸ отошёл</span> ' : '';
      // КОТ - ПЕРЕД ИМЕНЕМ, И У ЭТОГО ЖЕ ЧЕЛОВЕКА ОН ЖЕ СТОИТ В УГЛУ (если это я).
      // Дремлет ровно тогда, когда человек отошёл: состояние одно, картинок две.
      var _cs = catSvg(id, 22);
      row.innerHTML = '<span class="dot' + (p.speaking ? ' on' : '') + '"></span>'
        + (_cs ? '<span class="pcat' + (p.away ? ' nap' : '') + '">' + _cs + '</span>' : '')
        + '<span class="nm"></span>'
        + (pos >= 0 ? '<span class="hand">✋ ' + (pos + 1) + '</span> ' : '')
        + _aw
        + _rn
        + '<span class="me">' + (p.me ? 'ты' : (p.muted ? 'микрофон выкл' : '')) + '</span>';
      row.querySelector('.nm').textContent = p.name;
      // ═══ ДЕЙСТВИЯ НАД УЧАСТНИКОМ ═══
      // СВОЯ СТРОКА ИХ НЕ ПОЛУЧАЕТ: «заглушить себя» это кнопка микрофона внизу, и второй
      // способ сделать то же самое разошёлся бы с ней при первой правке.
      if (!p.me) {
        var more = document.createElement('button');
        more.className = 'more';
        more.textContent = '⋯';
        more.onclick = function () {
          pactFor = (pactFor === id) ? '' : id;
          draw();
        };
        row.appendChild(more);
      }
      box.appendChild(row);
      if (pactFor === id && !p.me) box.appendChild(pactRow(id, p));
    });
  }

  //: ЧЬЁ МЕНЮ ДЕЙСТВИЙ СЕЙЧАС РАСКРЫТО. Одно на список: два раскрытых разом означали бы,
  //: что человек не видит, к кому относится кнопка, которую он вот-вот нажмёт.
  var pactFor = '';

  function pactRow(id, p) {
    var box = document.createElement('div');
    box.className = 'pact';
    var isRadio = (id === DJ_ID);
    if (isRadio) {
      // ═══ РАДИО - НЕ ЧЕЛОВЕК, И ЗДЕСЬ ДЕЙСТВИЕ НАСТОЯЩЕЕ ═══
      // Процессом владеет БОТ, значит «отсоединить» это не просьба, а команда: тот же
      // путь, что у кнопки «Выключить радио», и второй дороги мы не заводим (закон №40).
      var off = document.createElement('button');
      off.textContent = '⏹ Отсоединить радио';
      off.onclick = function () {
        pactFor = ''; draw();
        if (djOff) djOff();
        else say('Отсоединить радио может тот, кто вошёл из Telegram: у меня нет канала '
                 + 'к боту.', true);
      };
      box.appendChild(off);
      var nt = document.createElement('p');
      nt.className = 'me';
      nt.textContent = 'Радио - мой процесс, поэтому это настоящая команда, а не просьба.';
      box.appendChild(nt);
      return box;
    }
    // ═══ АДМИН МОЖЕТ ПО-НАСТОЯЩЕМУ, ОСТАЛЬНЫЕ - ПРОСЯТ ═══
    // Разница не в вежливости, а в том, ЧТО ФИЗИЧЕСКИ УМЕЕТ КЛИЕНТ: выключить чужой
    // микрофон у livekit-client двери нет вовсе, это только серверный вызов. Поэтому
    // админские кнопки идут через ящик к боту, а право всё равно проверяет ОН (закон
    // №32) - здесь решается лишь, что показывать.
    if (iAmAdm && admDo) {
      // ═══ ШУМОДАВ У УЧАСТНИКА - ПЕРЕКЛЮЧАТЕЛЬ, А НЕ ОДНОСТОРОННЯЯ КНОПКА (закон №55) ═══
      // Подпись называет РЕЗУЛЬТАТ тапа и считается от ФАКТИЧЕСКОГО состояния, которое
      // прислал он сам. Считай мы её от последней отправленной просьбы, кнопка врала бы
      // ровно у того, кто просьбу не исполнил или отменил у себя.
      // ГРАНИЦА НАЗВАНА ЧЕСТНО НИЖЕ, В ПОДПИСИ: это тоже просьба, только с настоящим
      // гейтом. Включает шумодав его страница, и выключить у себя он может всегда.
      var _rnOn = !!p.rnn;
      var rb = document.createElement('button');
      rb.className = 'adm';
      rb.textContent = _rnOn ? '🔊 Снять шумодав' : '🔇 Включить шумодав';
      rb.onclick = function () {
        pactFor = ''; draw();
        admDo(_rnOn ? 'rnn_off' : 'rnn_on', id, p.name);
      };
      box.appendChild(rb);
      // ═══ РЕАКЦИИ И ЗВУКИ - ПЕРЕКЛЮЧАТЕЛЬ, И ОБРАТНЫЙ ПУТЬ ОБЯЗАТЕЛЕН (закон №55) ═══
      // Заглушить человека навсегда одним тапом нельзя: он перестанет быть участником
      // разговора, а вернуть его будет нечем до конца созвона.
      var _fOff = !!funOff[String(id)];
      var fb = document.createElement('button');
      fb.className = 'adm';
      fb.textContent = _fOff ? '🔊 Вернуть реакции' : '🙊 Запретить реакции и звуки';
      fb.onclick = function () {
        pactFor = ''; draw();
        admDo(_fOff ? 'fun_on' : 'fun_off', id, p.name);
      };
      box.appendChild(fb);
      [['🔇 Заглушить', 'mute'], ['🚪 Отключить', 'kick'],
       ['👑 Сделать админом', 'admin']].forEach(function (a) {
        var b = document.createElement('button');
        b.className = 'adm';
        b.textContent = a[0];
        b.onclick = function () {
          pactFor = ''; draw();
          admDo(a[1], id, p.name);
        };
        box.appendChild(b);
      });
    }
    [['🔇 Попросить приглушиться', 'quiet'],
     ['🚪 Попросить выйти', 'bye']].forEach(function (a) {
      var b = document.createElement('button');
      b.textContent = a[0];
      b.onclick = function () {
        pactFor = ''; draw();
        //: ОТПРАВКА ЧЕРЕЗ ДВЕРЬ. Прежняя редакция звала `send` и `myLabel` НАПРЯМУЮ, а
        //: они живут в области `go()` - тап бросал `ReferenceError` и умирал молча.
        if (!roomSend) {
          say('Просьбу отправить нечем: соединение с комнатой ещё не поднялось. '
              + 'Подожди пару секунд и нажми снова.');
          return;
        }
        roomSend({ t: 'ask1', to: id, do: a[1],
                   by: (roomLabel ? roomLabel() : 'Кто-то') });
        say('Отправил ' + p.name + ': ' + (a[1] === 'quiet' ? 'приглушиться' : 'выйти')
            + '. Это просьба - решает он.');
      };
      box.appendChild(b);
    });
    // ═══ ЧЕСТНО ПРО ГРАНИЦУ, А НЕ МОЛЧА ═══
    // Серверного «замолчи» мы не шлём: для него нужен админский грант У КАЖДОГО, то есть
    // право выключать чужой микрофон кому угодно. Подпись, обещающая приказ там, где
    // отправлена просьба, хуже отсутствующей кнопки - человек решит, что сломалось.
    var note = document.createElement('p');
    note.className = 'me';
    // ТЕКСТ ОТВЕЧАЕТ СОСТОЯНИЮ, А НЕ ПОРЯДКУ СТРОК: у админа на экране стоят ОБА ряда
    // кнопок, и общая подпись «это просьбы» врала бы про верхний.
    note.textContent = iAmAdm
      ? ('Заглушить и отключить - настоящие: их выполняет сервер. Шумодав - просьба с '
         + 'настоящим гейтом: включает его страница участника, и выключить у себя он '
         + 'может всегда. Нижние - ПРОСЬБЫ: у него всплывёт окно, и он решает сам.')
      : ('Это ПРОСЬБЫ: у него всплывёт окно, и он решает сам. По-настоящему заглушить '
         + 'или отключить может только админ комнаты.');
    box.appendChild(note);
    return box;
  }

  // ИМЯ ЧЕЛОВЕКА, А НЕ ЕГО TELEGRAM-ID. Токен несёт `name` из подписи, но у токена,
  // выданного СТАРЫМ Worker'ом, там лежит uid - и комната показывала соседям столбик
  // голых чисел. Число вместо имени не сообщает НИЧЕГО и при этом светит чужой id,
  // поэтому оно заменяется словом, а не показывается «как есть».
  // ЧТО НАМ ВООБЩЕ РАЗРЕШИЛИ. JWT это base64 - клиент читает свой грант, не спрашивая
  // никого. Нужно вот зачем: страница и Worker выкладываются РАЗНЫМИ командами, и если
  // приехала новая страница со старым токеном, кнопка показа есть, а права нет. LiveKit
  // в этом случае НЕ отказывает - он ВИСИТ («waiting for pending publication promise
  // timed out»), и по этому тексту причину не угадать (живой случай Ren 25.08).
  function grantOf(token) {
    try {
      var b = String(token).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      var j = JSON.parse(decodeURIComponent(escape(atob(b + '='.repeat((4 - b.length % 4) % 4)))));
      return (j && j.video) || {};
    } catch (e) { return {}; }
  }

  function human(name, id) {
    var n = String(name == null ? '' : name).trim();
    if (!n || n === String(id) || /^\d{5,}$/.test(n)) return 'Гость';
    return n;
  }

  function upsert(id, patch) {
    people[id] = Object.assign(people[id] || { name: id, speaking: false, muted: false }, patch);
    draw();
  }

  // ═════════════════════════════════════════════════════════════════════════════════
  // ЗВУКОВЫЕ РЕАКЦИИ: СИНТЕЗ НА МЕСТЕ + КАНАЛ ДАННЫХ, А НЕ ВТОРАЯ АУДИО-ДОРОЖКА
  // ═════════════════════════════════════════════════════════════════════════════════
  // ПОЧЕМУ НЕ ДОРОЖКОЙ, ХОТЯ LiveKit ЭТО УМЕЕТ. У нас на `track_published` висит вебхук,
  // и бот ДОБИРАЕТ каждую новую аудио-дорожку в идущую запись - ради вошедших позже.
  // Саундборд, опубликованный дорожкой, попал бы туда же, а бюджет Egress это ТРИ дорожки
  // на комнату (`track_cpu_cost` 0.5 при `cpus: 2.0`), - то есть каждый «тынц» отнимал бы
  // место у живого человека, и узнали бы мы об этом по недостающему голосу в транскрипте.
  // Это механизм, а не вкусовщина.
  //
  // ПОЧЕМУ БЕЗ ФАЙЛОВ. Файлы пришлось бы выкладывать ОТДЕЛЬНОЙ командой от страницы, а
  // два артефакта, уезжающие врозь, у нас уже дважды расходились (страница против
  // Worker'а, грант показа экрана). Синтез такого класса не имеет вовсе: звук едет тем же
  // документом, что и кнопка.
  //
  // ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. Смеха нет: голос синтезом не подделать, а «смех», звучащий
  // как пила, хуже отсутствующей кнопки. Все восемь ниже - ударные и шум, они синтезом
  // получаются как есть, а не «похоже».
  var _AC = null, _MASTER = null;

  function actx() {
    if (!_AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { _AC = regCtx(new C(), 'звуки'); } catch (e) { return null; }
      _MASTER = _AC.createGain();
      // ═══ УРОВЕНЬ: 0.5 БЫЛО ТИХО, И ЭТО ЖИВОЙ ОТЗЫВ, А НЕ ВКУС ═══
      // Реакция звучит ПОВЕРХ разговора, у которого своя громкость, - и «гонг и остальные
      // очень тихие» означает, что её просто не слышно. Ставим 1.0 и держим пики у
      // источников: общий множитель ниже единицы отнимал половину у КАЖДОГО звука разом.
      _MASTER.gain.value = 1.0;
      _MASTER.connect(_AC.destination);
    }
    // БЕЗ ЖЕСТА БРАУЗЕР ДЕРЖИТ КОНТЕКСТ ПРИТОРМОЖЕННЫМ И МОЛЧА. `resume()` зовём без
    // ожидания: не успел к этому звуку - успеет к следующему, а срывать из-за него ПОКАЗ
    // реакции нельзя (у сигнала обязано быть два независимых пути дойти).
    try { if (_AC.state === 'suspended') _AC.resume(); } catch (e) {}
    return _AC;
  }

  function noise(ac, sec) {
    var n = Math.max(1, Math.floor(ac.sampleRate * sec));
    var b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  //: Шумовой удар: хлопок, щётка, тарелка. `exponentialRamp` в НОЛЬ уходить не умеет -
  //: отсюда 0.0001, а не 0 (иначе Web Audio молча не применит спад, и звук оборвётся
  //: щелчком).
  function burst(ac, t0, dur, gain, type, freq, q) {
    var s = ac.createBufferSource(); s.buffer = noise(ac, dur + 0.02);
    var f = ac.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq || 1200;
    if (q) f.Q.value = q;
    var g = ac.createGain();
    g.gain.setValueAtTime(Math.max(0.0001, gain), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(_MASTER);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }

  //: Тон с атакой и спадом. Атака в 8 мс нужна против щелчка: мгновенный старт с полной
  //: громкости слышен как треск, а не как нота.
  function tone(ac, t0, dur, gain, f0, f1, type) {
    var o = ac.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(_MASTER);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  // РЕЕСТР ОДИН НА КНОПКУ И НА ПРИЁМНИК: рисуем кнопки из него же, из него же читаем
  // пришедший id. Два списка разъехались бы, и половина комнаты слышала бы не то, что
  // написано на кнопке у соседа (закон №40).
  var SOUNDS = {
    clap: { e: '👏', t: 'Хлопки', p: function (ac, t) {
      // ═══ ВТОРОЙ ЗАХОД, И ОБА ПРЕЖНИХ ПРОМАХА НАЗВАНЫ ═══
      // (1) `bandpass` c Q=1.2 на коротком шуме - РЕЗОНАТОР: звенит на своей частоте, ухо
      // слышит тон, а не удар. (2) `highpass` на 320-700 Гц оставил ВЕСЬ низ, и вышло
      // «низко, на хлопки не похоже» (живой отзыв Ren).
      // ХЛОПОК ЖИВЁТ ВЫШЕ, ЧЕМ КАЖЕТСЯ: основная энергия ладоней - 1.5-4 кГц, а спад
      // 8-15 мс, не 35. Отсюда: срез снизу от 1.2 кГц, ОЧЕНЬ короткий удар и лёгкий
      // «хвост зала» после каждого - без него это щелчки мыши, а не аплодисменты.
      for (var i = 0; i < 28; i++) {
        // РАЗБРОС НЕРОВНЫЙ: в начале плотно, дальше реже - так хлопает зал, а ровная
        // сетка читается как метроном.
        var at = t + Math.pow(Math.random(), 0.5) * 1.15;
        burst(ac, at, 0.010 + Math.random() * 0.008, 0.55 + Math.random() * 0.35,
              'highpass', 1200 + Math.random() * 900, 0);
        burst(ac, at + 0.006, 0.045, 0.10 + Math.random() * 0.06, 'bandpass', 2400, 0.7);
      }
    } },
    drum: { e: '🥁', t: 'Дробь', p: function (ac, t) {
      // ═══ ПОЧЕМУ ПРЕЖНЯЯ БЫЛА «НЕ ПОХОЖА» ═══
      // `lowpass 260` на 50 мс - это глухой бубух, и двадцать таких подряд сливаются в
      // РОВНЫЙ ГУЛ. Барабанная дробь - это СУХИЕ короткие удары по пластику: середина и
      // верх (600 Гц - 5 кГц), длительность 8-14 мс, и они обязаны РАЗЛИЧАТЬСЯ поштучно.
      // Плюс дробь идёт ПАРАМИ (правая-левая) с лёгкой неровностью - ровная сетка звучит
      // машинно.
      var at = t, step = 0.075;
      while (at < t + 1.15) {
        burst(ac, at, 0.008 + Math.random() * 0.005, 0.34 + Math.random() * 0.16,
              'highpass', 700, 0);
        step = Math.max(0.022, step * 0.94);      // РАЗГОН: без него это метроном
        at += step * (0.9 + Math.random() * 0.2);
      }
      // ФИНАЛЬНЫЙ УДАР - ДРУГОЙ ПО ТЕМБРУ, иначе конец не читается как конец.
      burst(ac, at + 0.06, 0.09, 0.60, 'highpass', 400, 0);
      tone(ac, at + 0.06, 0.30, 0.30, 190, 70, 'sine');
      burst(ac, at + 0.06, 0.45, 0.22, 'highpass', 5500, 0);   // тарелка
    } },
    tyn: { e: '🥁', t: 'Тынц', p: function (ac, t) {
      tone(ac, t, 0.18, 0.30, 220, 90, 'sine');              // ба-
      tone(ac, t + 0.17, 0.18, 0.30, 175, 70, 'sine');       // -дум
      burst(ac, t + 0.34, 0.55, 0.20, 'highpass', 5200, 0);  // -тсс
    } },
    bell: { e: '🔔', t: 'Динь', p: function (ac, t) {
      // Колокол - это НЕСКОЛЬКО обертонов с разным спадом: одна синусоида звучит как
      // писк из микроволновки.
      tone(ac, t, 1.10, 0.34, 880, 880, 'sine');
      tone(ac, t, 0.90, 0.16, 1320, 1320, 'sine');
      tone(ac, t, 0.60, 0.05, 2640, 2640, 'sine');
    } },
    tada: { e: '🎺', t: 'Та-да', p: function (ac, t) {
      [523, 659, 784].forEach(function (f, i) {
        tone(ac, t + i * 0.085, 0.14, 0.30, f, f, 'triangle');
      });
      tone(ac, t + 0.26, 0.70, 0.34, 1047, 1047, 'triangle');
    } },
    buzz: { e: '📢', t: 'Гудок', p: function (ac, t) {
      tone(ac, t, 0.45, 0.28, 118, 108, 'square');
    } },
    pop: { e: '💧', t: 'Поп', p: function (ac, t) {
      tone(ac, t, 0.11, 0.38, 420, 950, 'sine');
    } },
    gong: { e: '⏰', t: 'Гонг', p: function (ac, t) {
      // ТРИ ОДИНАКОВЫХ СИНУСА ПОДРЯД - ЭТО БУДИЛЬНИК, А НЕ ГОНГ. У гонга ОДИН удар с
      // неровными обертонами и длинным хвостом; удар начинается шумом (било о металл),
      // дальше остаётся звон.
      burst(ac, t, 0.06, 0.34, 'lowpass', 1800, 0);
      [110, 164, 233, 311, 415].forEach(function (f, i) {
        tone(ac, t, 2.6 - i * 0.35, 0.30 / (i + 1.4), f, f * 0.995, 'sine');
      });
    } },
  };

  // ═══ ГОТОВЫЙ СЭМПЛ СИЛЬНЕЕ СИНТЕЗА, И ЭТО РЕШЕНИЕ REN ═══
  // «Хлопки звучат как писк, гонг тихий - синтез не справляется». Он и не справится:
  // хлопок это запись комнаты, а не осциллятор. Поэтому рядом со страницей может лежать
  // `snd/<id>.ogg`, и он ВЫИГРЫВАЕТ у синтеза.
  // МАНИФЕСТ, А НЕ ПРОБА КАЖДОГО ФАЙЛА: восемь HEAD-запросов на открытие комнаты ради
  // «а есть ли» - это восемь лишних кругов и восемь способов ошибиться. `deploy_room`
  // собирает список из КАТАЛОГА, то есть по факту наличия, а не по нашей памяти.
  // ФАЙЛОВ МОЖЕТ НЕ БЫТЬ ВОВСЕ - тогда работает то, что есть, и ничего не ломается.
  var SND_BUF = {};                 // id -> AudioBuffer (или null, если не вышло)
  var SND_FILES = null;             // список id, для которых файл ЕСТЬ

  //: ПОЧЕМУ ИГРАЕТ СИНТЕЗ - ОБЯЗАНО БЫТЬ НАПИСАНО, А НЕ ВЫЯСНЯТЬСЯ УГАДЫВАНИЕМ.
  //: Три круга живых прогонов ушли на «файлы лежат, а играет синтез» ровно потому, что
  //: КАЖДЫЙ сбой этой цепочки был проглочен: `.catch(){}` у манифеста, `.catch(){}` у
  //: загрузки, и `SND_BUF[id] = null` без единого слова. Отсюда одна переменная, которую
  //: видно и человеку в строке состояния, и пробе.
  var SND_DIAG = '';
  function sndSay(why) {
    SND_DIAG = why;
    window.__SND_DIAG = why;              // шов для браузерной пробы
    try { console.log('[snd] ' + why); } catch (e) {}
    //: ПРИЧИНА ПРИЕЗЖАЕТ ПОЗЖЕ ПЕРВОЙ ОТРИСОВКИ (манифест асинхронный), поэтому строку
    //: надо ПЕРЕРИСОВАТЬ. Без этого она появлялась бы только со следующим изменением
    //: звука - то есть почти никогда.
    try { if (typeof window.__paintAudio === 'function') window.__paintAudio(); } catch (e) {}
  }

  function sndManifest() {
    if (SND_FILES !== null) return Promise.resolve(SND_FILES);
    return fetch('snd/index.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) { sndSay('манифест snd/index.json: HTTP ' + r.status); return []; }
        return r.json().catch(function (e) {
          //: НЕ-JSON ЗДЕСЬ ЗНАЧИТ, ЧТО НАМ ОТДАЛИ НЕ ТО (страницу-заглушку, ошибку CDN).
          //: Прежняя редакция схлопывала это в «файлов нет», то есть отсутствие файлов и
          //: сломанную выкладку было НЕЧЕМ различить.
          sndSay('манифест не разобрался (' + String(e && e.message || e).slice(0, 60)
                 + ') - похоже, по этому адресу лежит не JSON');
          return [];
        });
      })
      .catch(function (e) {
        sndSay('манифест не доехал: ' + String(e && e.message || e).slice(0, 60));
        return [];
      })
      .then(function (j) {
        if (!Array.isArray(j)) { sndSay('манифест не список - беру синтез'); j = []; }
        else if (!j.length && !SND_DIAG) sndSay('манифест пуст: файлов не выложено');
        SND_FILES = j;
        return SND_FILES;
      });
  }

  // ═══ ДВЕРЬ, КОТОРУЮ НАПИСАЛИ И НЕ ОТКРЫЛИ (живой отказ Ren 30.08) ═══
  // `clap.ogg` и `drum.ogg` выложены (`deploy_room`: «звуков файлами: 2», CDN отдаёт 200
  // audio/ogg), а в комнате играл СИНТЕЗ. Причина не в кэше и не в выкладке: `sndManifest`
  // не вызывался НИ ИЗ ОДНОГО места - `SND_FILES` навсегда оставался `null`, и ветка
  // загрузки файла в `playSnd` была недостижима по построению. Закон №47 наизнанку: имя
  // без вызова выглядит рабочим механизмом. Инвариант теперь требует именно ВЫЗОВА.
  // ГРУЗИМ ЗАРАНЕЕ, А НЕ НА ПЕРВОМ ТАПЕ: файлы крошечные, а «первый хлопок синтезом,
  // остальные файлом» - это тот же сбой, только реже и потому неуловимее.
  var _SND_BOOTED = false;
  function sndBoot() {
    if (_SND_BOOTED) return;
    _SND_BOOTED = true;
    sndManifest().then(function (ids) {
      if (!ids.length) return;                    // причину уже назвал `sndManifest`
      var ac = actx();
      if (!ac) {
        //: КОНТЕКСТА ЕЩЁ НЕТ - НО ВТОРОЙ ПУТЬ ЕГО И НЕ ТРЕБУЕТ. Прежняя редакция просто
        //: уходила молча, и до первого тапа файлы не готовились ничем.
        _SND_BOOTED = false;
        sndSay('звуковой контекст ещё не поднят - готовлю файлы медиа-элементом');
        ids.forEach(function (id) { if (SOUNDS[id]) sndTryEl(id); });
        return;
      }
      ids.forEach(function (id) { if (SOUNDS[id]) sndLoad(ac, id); });
    });
  }

  //: ═══ ДВА ПУТИ ДЕКОДИРОВАНИЯ, ПОТОМУ ЧТО ОДИН ЕСТЬ НЕ ВЕЗДЕ ═══
  //: `decodeAudioData` и `<audio>` - РАЗНЫЕ конвейеры браузера, и формат, который не
  //: берёт первый, второй иногда играет. Какой именно путь мёртв у Telegram на Mac, из
  //: контейнера не установить (CDN закрыт, закон №48), поэтому мы не гадаем, а пробуем
  //: оба и НАЗЫВАЕМ исход. Второй путь идёт мимо `_MASTER` - у медиа-элемента своя
  //: громкость, и это цена, а не недосмотр.
  //: ОТКАЗ БОЛЬШЕ НЕ ВЕЧЕН. Было `SND_BUF[id] = null`, а условие повтора - `=== undefined`:
  //: одна неудача (сеть моргнула на входе в комнату) убивала файл до перезахода. Теперь
  //: помечается ТОЛЬКО то, что повтором не лечится, - формат, который платформа не берёт.
  var SND_EL = {};                  // id -> HTMLAudioElement (второй путь)
  var SND_DEAD = {};                // id -> true: формат не берётся, повторять нечего
  var SND_EL_BAD = {};              // id -> true: элемент есть, а играть браузер не даёт

  //: ═══ КАКИМ ПУТЁМ ЗВУК ПРАВДА СЫГРАЛ - ФАКТ, А НЕ НАМЕРЕНИЕ ═══
  //: Живой отчёт «у нажавшего синтез, у остальных файл» невозможно проверить, пока
  //: страница не говорит, ЧТО она сделала. Путей три (буфер / элемент / синтез), и
  //: различить их со стороны человека нельзя - хлопок звучит хлопком. Строка нужна
  //: РОВНО для следующего живого прогона: она отвечает на «где расходится» одним
  //: взглядом, вместо ещё одного круга рассуждений (законы №35 и №48).
  var SND_LAST = '';
  function sndPath(how) {
    SND_LAST = how;
    window.__SND_LAST = how;              // шов для браузерной пробы
    try { console.log('[snd] сыграл: ' + how); } catch (e) {}
  }

  //: ═══ ЧТО ИМЕННО УШЛО В ДЕКОДЕР - ФАКТ, А НЕ ДОГАДКА (требование Ren, пятый круг) ═══
  //: «Decoding failed» одинаково звучит у четырёх разных бед: не тот адрес (по нему
  //: лежит HTML страницы 404), обрезанный ответ, чужой кодек, отказ самого декодера.
  //: Пять кругов подряд мы гадали, потому что страница не говорила НИЧЕГО о том, что
  //: она держала в руках.
  //: ЗАМЕР В КОНТЕЙНЕРЕ (боевым путём страницы, Chromium 1194, файлы из репо):
  //:   clap 24008 байт, `4f 67 67 53` = «OggS», audio/ogg -> декодировано 2.0 с, 44100
  //:   drum 23815 байт, то же самое -> декодировано
  //: то есть ни файл, ни этот код не виноваты, и расходится ОКРУЖЕНИЕ. Значит следующий
  //: живой прогон обязан принести цифры, а не ещё одно «не играется».
  //: ЛЕНТА УХОДИТ В `bot.log` (закон №1): на телефоне консоли нет, а разбор идёт грепом.
  function sndFacts(id, r, b) {
    var f = { id: id, url: '' };
    try { f.url = new URL('snd/' + id + '.ogg', location.href).href; } catch (e) {}
    if (r) {
      f.status = r.status;
      try { f.ct = r.headers.get('content-type') || ''; } catch (e) {}
      try { f.cl = r.headers.get('content-length') || ''; } catch (e) {}
    }
    if (b) {
      f.bytes = b.byteLength;
      try {
        var u = new Uint8Array(b.slice(0, 8));
        f.head = Array.prototype.map.call(u, function (x) {
          return ('0' + x.toString(16)).slice(-2); }).join(' ');
        f.ascii = String.fromCharCode.apply(null, u).replace(/[^ -~]/g, '.');
      } catch (e) {}
    }
    return f;
  }
  function sndTell(f, extra) {
    var t = 'звук ' + f.id + ': HTTP ' + (f.status === undefined ? '?' : f.status)
          + ' · ' + (f.ct || 'без типа') + ' · ' + (f.bytes === undefined ? '?' : f.bytes)
          + ' байт · первые ' + (f.ascii || '?') + ' [' + (f.head || '?') + ']'
          + (extra ? ' · ' + extra : '') + ' · ' + f.url;
    try { diag(t); } catch (e) {}
    try { console.log('[snd] ' + t); } catch (e) {}
    return t;
  }

  function sndLoad(ac, id) {
    if (SND_BUF[id] !== undefined && SND_BUF[id] !== null) {
      return Promise.resolve(SND_BUF[id]);
    }
    if (SND_DEAD[id]) return Promise.resolve(null);
    var _r = null;
    return fetch('snd/' + id + '.ogg')
      .then(function (r) {
        _r = r;
        if (!r.ok) return Promise.reject(new Error('HTTP ' + r.status));
        return r.arrayBuffer();
      })
      .then(function (b) {
        if (!b || !b.byteLength) return Promise.reject(new Error('пустой файл'));
        //: ПЕРВЫЕ БАЙТЫ РЕШАЮТ БОЛЬШЕ, ЧЕМ ТИП ОТВЕТА: `OggS` - это звук, `<!do` - это
        //: страница вместо него, и второе означает НЕ ТОТ АДРЕС, а не «формат не тот».
        //: Названная причина здесь стоит дороже, чем ещё одна попытка.
        var f = sndFacts(id, _r, b);
        if (f.ascii && f.ascii.slice(0, 4) !== 'OggS') {
          sndTell(f, 'это НЕ ogg');
          sndSay('по адресу звука ' + id + ' лежит не звук (' + f.ascii.slice(0, 4)
                 + ') - адрес не тот, а не формат');
          return Promise.reject(new Error('не ogg: ' + f.ascii.slice(0, 4)));
        }
        window.__SND_FACTS = f;
        return ac.decodeAudioData(b).then(function (buf) {
          sndTell(f, 'декодирован: ' + buf.duration.toFixed(2) + ' с');
          return buf;
        }, function (e) {
          sndTell(f, 'decodeAudioData отказал: ' + (e && e.name || '?') + ' '
                     + (e && e.message || e) + ' · контекст ' + ac.sampleRate + ' Гц');
          return Promise.reject(e);
        });
      })
      .then(function (buf) { SND_BUF[id] = buf; return buf; })
      .catch(function (e) {
        var m = String((e && e.message) || e).slice(0, 70);
        //: НЕ ДЕКОДИРУЕТСЯ - ПРОБУЕМ МЕДИА-ЭЛЕМЕНТОМ. Если и он не берётся, формат тут
        //: не играется ничем, и это ОТДЕЛЬНЫЙ факт, который надо сказать вслух.
        return sndTryEl(id).then(function (ok) {
          if (ok) { sndSay('файл ' + id + ' не декодируется WebAudio (' + m
                           + '), играю его через <audio>'); return null; }
          SND_DEAD[id] = true;
          SND_BUF[id] = null;
          sndSay('файл ' + id + ' не играется ни WebAudio, ни <audio> (' + m
                 + ') - остаётся синтез');
          return null;
        });
      });
  }

  //: ВТОРОЙ ПУТЬ: медиа-элемент. Проверяем ФАКТ - дошло ли до воспроизведения, а не
  //: «мы позвали play()». `canplaythrough` без него зелен и на элементе, которому
  //: браузер потом откажет.
  function sndTryEl(id) {
    return new Promise(function (res) {
      var a = SND_EL[id];
      if (a) { res(true); return; }
      try { a = new Audio('snd/' + id + '.ogg'); } catch (e) { res(false); return; }
      a.preload = 'auto';
      var done = false;
      var fin = function (ok) {
        if (done) return;
        done = true;
        if (ok) SND_EL[id] = a;
        res(ok);
      };
      a.addEventListener('canplaythrough', function () { fin(true); });
      a.addEventListener('error', function () { fin(false); });
      setTimeout(function () { fin(false); }, 4000);
      try { a.load(); } catch (e) { fin(false); }
    });
  }

  //: ИГРАЕМ ВТОРЫМ ПУТЁМ. Копию элемента берём на каждый тап: один и тот же `<audio>`,
  //: перезапущенный до конца звука, обрывает сам себя - хлопки подряд слились бы в один.
  function sndPlayEl(id) {
    var a = SND_EL[id];
    if (!a) return false;
    try {
      var c = a.cloneNode(true);
      c.volume = 1.0;
      var pr = c.play();
      //: ═══ ОТКАЗ ВОСПРОИЗВЕДЕНИЯ - ЭТО НЕ «СЫГРАЛО» ═══
      //: Здесь стояло `pr.catch(function(){})`, то есть отказ глотался, а мы возвращали
      //: `true` - «сыграли». На устройстве, где элемент есть, а играть браузер не даёт,
      //: человек слышал ТИШИНУ, и синтез не включался никогда: признак вместо результата
      //: (закон №35). Отказ приходит асинхронно, поэтому чинить прошлое поздно - но
      //: следующий тап обязан знать правду, и он её получает.
      if (pr && pr.catch) {
        pr.catch(function (e) {
          SND_EL_BAD[id] = true;
          sndSay('файл ' + id + ' не проигрывается элементом ('
                 + String((e && e.name) || e).slice(0, 40) + ') - беру синтез');
        });
      }
      sndPath('файл (элемент)');
      return true;
    } catch (e) { return false; }
  }

  //: -> сыграл ли. Отвечаем ФАКТОМ, а не намерением: не поднялся контекст - вызывающий
  //: обязан знать, что человек ничего не услышал, и показать событие глазами.
  //: СКОЛЬКО ЖДЁМ ФАЙЛ, ПРЕЖДЕ ЧЕМ ЗАМЕНИТЬ ЕГО СИНТЕЗОМ. Меньше - тап звучит синтезом
  //: там, где файл вот-вот приедет; больше - человек успевает решить, что кнопка мёртвая.
  var SND_WAIT_MS = 350;

  function sndFromBuffer(ac, buf) {
    try {
      var src = ac.createBufferSource();
      src.buffer = buf; src.connect(_MASTER);
      src.start(ac.currentTime + 0.02);
      return true;
    } catch (e) { return false; }
  }

  function playSnd(id) {
    var s = SOUNDS[id];
    if (!s) return false;
    var ac = actx();
    if (!ac) return false;
    if (SND_BUF[id] && sndFromBuffer(ac, SND_BUF[id])) { sndPath('файл (буфер)'); return true; }
    //: ВТОРОЙ ПУТЬ РАВНОПРАВЕН ПЕРВОМУ: файл, который не берёт WebAudio, но играет
    //: медиа-элемент, - это ТОТ ЖЕ файл, а не «почти получилось».
    if (!SND_EL_BAD[id] && sndPlayEl(id)) return true;
    // ═══ СИНТЕЗ - ЗАПАСНОЙ ПУТЬ, А НЕ ПАРАЛЛЕЛЬНЫЙ (живой отказ Ren 31.08) ═══
    // СИМПТОМ БЫЛ ТОЧНЫЙ: у соседей играет файл, у САМОГО нажавшего - старый синтез.
    // Дверь при этом ОДНА (`playSnd` зовут оба пути), а расходились они ВНУТРИ неё:
    // буфер ещё не загружен -> мы запускали загрузку И ТУТ ЖЕ проваливались в синтез.
    // У нажавшего это первые секунды после входа (преднагрузка не успела), у соседей
    // сигнал приходит позже - и к тому моменту файл уже готов. Один и тот же тап звучал
    // по-разному на разных экранах.
    // ТЕПЕРЬ ФАЙЛ ИМЕЕТ ПРАВО ОПОЗДАТЬ НА `SND_WAIT_MS`, и синтез включается ТОЛЬКО если
    // он не успел: тишины в ответ на тап нет, а расхождение исчезает по построению.
    // ═══ ВТОРОЙ КРУГ ТОГО ЖЕ, И ПЕРВАЯ ПОЧИНКА БЫЛА МИМО (живой отказ Ren 31.08) ═══
    // «350 мс не помогли» - и правильно, потому что ждать мы начинали ТОЛЬКО когда
    // манифест УЖЕ прочитан: `known` требовал непустой `SND_FILES`, а он `null` ровно в
    // те первые секунды после входа, когда человек и жмёт кнопку. То есть механизм
    // ожидания был мёртв РОВНО В ТОМ ОКНЕ, ради которого писался, и тап проваливался в
    // синтез немедленно. Сосед в это же окно не попадает никогда: его сигнал приходит
    // позже, к тому времени манифест прочитан - отсюда «у нажавшего синтез, у остальных
    // файл» на ОДНОЙ И ТОЙ ЖЕ двери.
    // СТРОКА `if (SND_FILES === null) sndBoot();` ЗДЕСЬ БЫЛА ПУСТЫШКОЙ: `_SND_BOOTED`
    // уже true (панель реакций зовёт `sndBoot` при постройке), и вызов не делал НИЧЕГО.
    // ТЕПЕРЬ «ЕЩЁ НЕ ЗНАЕМ» СЧИТАЕТСЯ «МОЖЕТ БЫТЬ ФАЙЛ»: ждём его столько же, сколько
    // ждали бы известный, и синтез включаем, только если он не успел. Расхождение между
    // нажавшим и соседом исчезает по построению, а не по удаче тайминга.
    var known = (SND_FILES === null
                 || (!!SND_FILES && SND_FILES.indexOf(id) >= 0)) && !SND_DEAD[id];
    if (known) {
      var done = false;
      sndLoad(ac, id).then(function (b) {
        if (done) return;                    // синтез уже отыграл - второй звук не нужен
        done = true;
        if (b) { sndFromBuffer(ac, b); sndPath('файл (буфер, дождались)'); return; }
        sndPlayEl(id);
      });
      setTimeout(function () {
        if (done) return;
        done = true;
        if (!s.p) return;
        sndPath('синтез (файл не успел)');
        try { s.p(ac, actx().currentTime + 0.02); } catch (e) {}
      }, SND_WAIT_MS);
      return true;
    }
    if (!s.p) return false;
    sndPath('синтез (файла нет)');
    try { s.p(ac, ac.currentTime + 0.02); } catch (e) { return false; }
    return true;
  }

  //: СКОЛЬКО РЕАКЦИЙ ВИСИТ НА ЭКРАНЕ РАЗОМ. Без потолка десяток подряд закрыл бы список
  //: людей целиком - то есть «кто говорит» пропало бы ровно тогда, когда в комнате
  //: оживлённо.
  var POP_MAX = 5;

  function popup(txt) {
    var box = $('pops');
    if (!box) return;
    var d = document.createElement('div');
    d.className = 'pop';
    d.textContent = txt;
    box.appendChild(d);
    while (box.children.length > POP_MAX) box.removeChild(box.firstChild);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2700);
  }

  async function go() {
    stage('запрос токена');
    var r;
    try {
      if (WEB) {
        // ИМЯ СПРАШИВАЕМ, ЕСЛИ ЕГО НЕТ В ССЫЛКЕ: человек без Telegram нам не представлен
        // ничем, а соседям по комнате надо знать, кто говорит.
        var nm = q.get('name') || '';
        if (!nm) {
          stage(BOOT_ASKING);
          nm = ((await askText('Как тебя звать в комнате?', 'имя видят соседи')) || '')
                 .slice(0, 40);
          stage('запрос токена');
        }
        // ═══ СВОЁ МЕСТО ВОЗВРАЩАЕМ, А НЕ ЗАНИМАЕМ ВТОРОЕ ═══
        // Ссылка отдаёт десять мест, и перезагрузка (в том числе НАША, ради обновления
        // версии) съедала бы по одному. Строка места случайная, живёт ТОЛЬКО здесь и
        // наружу не уезжает - вернуть её может лишь этот браузер.
        var _seat = '';
        try { _seat = localStorage.getItem('rtc_seat_' + ROOM) || ''; } catch (e) {}
        r = await fetchT(API + '/rtc/web?t=' + encodeURIComponent(WEB)
                        + (nm ? '&name=' + encodeURIComponent(nm) : '')
                         + (_seat ? '&seat=' + encodeURIComponent(_seat) : ''), null, 15000);
      } else {
        r = await fetchT(API + '/rtc/token?room=' + encodeURIComponent(ROOM), {
          headers: { 'X-Init-Data': initData },
        }, 15000);
      }
    } catch (e) {
      sub('Сервер не ответил');
      say('Не достучался до ' + API + ': ' + (e && e.message || e), true);
      return;
    }
    var j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok || !j || !j.token) {
      sub('Войти не вышло');
      // ═══ ОТКАЗ НАЗЫВАЕТ ПРИЧИНУ ЧЕЛОВЕЧЕСКИ И ГОВОРИТ, ЧТО ДЕЛАТЬ ═══
      // ЖИВОЙ ОТКАЗ REN 28.08: «вход по браузерной ссылке не сработал» - и всё, что видел
      // человек, это код с машинным словом. А причины лечатся ПО-РАЗНОМУ: кончились
      // места по ссылке (просить новую), полна комната (это уже не про ссылку), подпись
      // не сошлась (новая не поможет вовсе), комнаты не подняты (это у нас).
      var WHY = {
        web_link_full: 'По этой ссылке уже вошли все, кому она даёт место. Попроси новую '
                       + 'ссылку у того, кто позвал.',
        web_room_full: 'В комнате уже максимум гостей по ссылкам. Новая ссылка не '
                       + 'поможет - это потолок самой комнаты.',
        // СТАРЫЙ КОД, КОТОРЫЙ НЫНЕШНИЙ Worker БОЛЬШЕ НЕ ОТДАЁТ. Строку оставляем
        // НАРОЧНО: страница и Worker выкладываются РАЗНЫМИ командами, и свежая страница
        // со старым Worker'ом - живой случай, стоивший нам круга уже дважды.
        web_used: 'Ссылка уже отработала. Попроси новую.',
        web_expired: 'Ссылка просрочена: у неё есть срок ВХОДА, не разговора. Попроси новую.',
        bad_web_sign: 'Подпись ссылки не сошлась - новая ссылка тут не поможет, это у нас. '
                      + 'Скажи об этом тому, кто звал.',
        bad_web_token: 'Ссылка испорчена - вероятно, скопировалась не целиком.',
        web_store: 'Не смогли отметить вход и поэтому не пускаем: пускать не отметив '
                   + 'значит открыть ссылку навсегда. Это у нас.',
        no_livekit: 'Комнаты сейчас не подняты. Это у нас, ссылка ни при чём.',
        no_initdata: 'Telegram не передал подпись. Открой комнату кнопкой из бота.',
      };
      var code = (j && j.error) || '';
      // ИМЯ ЗДЕСЬ НЕ ПРОИЗВОЛЬНОЕ, И ЭТО ЗАКОН №26: локальный `var` затеняет модульное имя
      // ВО ВСЕЙ функции, а не с места присвоения. Первая редакция звалась `human` - и
      // роняла `nameOf()` строкой ниже («human is not a function»), потому что модульная
      // функция `human(name, id)` в этой функции переставала существовать. Поймала это
      // браузерная проба, а не чтение: обе строки по отдельности выглядят верно.
      var why = WHY[code] || '';
      if (code === 'web_link_full' && j && j.cap) {
        why += ' (мест по ссылке: ' + j.cap + ', занято ' + (j.used || j.cap) + ')';
      }
      if (code === 'web_room_full' && j && j.cap) {
        why += ' (гостей по ссылкам в комнате: ' + (j.used || j.cap) + ' из ' + j.cap + ')';
      }
      // МАШИННЫЙ КОД ОСТАЁТСЯ РЯДОМ: по нему ищут в логах, и убрать его значит сделать
      // разбор дороже ради красоты строки.
      say((why || ('Сервер отказал: ' + (code || 'без причины')))
          + ' [' + r.status + ' ' + (code || '?') + ']', true);
      return;
    }
    // МЕСТО ЗАПОМИНАЕМ СРАЗУ: следующая перезагрузка вернёт его, а не займёт новое.
    // Ключ по комнате - у человека их бывает несколько, и общий ключ означал бы, что
    // вторая комната стирает место в первой.
    if (j && j.seat) {
      try { localStorage.setItem('rtc_seat_' + ROOM, String(j.seat)); } catch (e) {}
    }
    // ЧТО РАБОТАЕТ - ФАКТ С СЕРВЕРА, А НЕ ПРЕДПОЛОЖЕНИЕ СТРАНИЦЫ. Три состояния, и
    // «не знаем» это НЕ «работает»: бот публикует признак регулярно, и молчание бота
    // означает ровно то, что мы про запись ничего не знаем (fail-closed).
    CAPS = (j && j.caps) || null;
    // ═══ ЧАСЫ СЕРВЕРА, А НЕ ТЕЛЕФОНА ═══
    // Просьбы админа приезжают в метаданных с меткой, поставленной БОТОМ, а «свежая или
    // старая» считала страница по `Date.now()` СВОЕГО устройства. Часы на телефоне живут
    // своей жизнью: уход на четверть часа вперёд молча превращал свежую просьбу в
    // «старую, не исполняем» - ни ошибки, ни строки, кнопка админа просто не работает у
    // одного человека из десяти. Считаем поправку один раз и дальше меряем всё в
    // серверной шкале.
    // НЕ ПРИСЛАЛИ - РАБОТАЕМ КАК РАНЬШЕ И ГОВОРИМ ЭТО В КОНСОЛЬ: старый Worker живёт, а
    // молчаливый возврат к часам телефона был бы возвратом самой поломки.
    if (j && typeof j.now === 'number' && j.now > 1700000000) {
      SRV_SKEW = j.now - Date.now() / 1000;
    } else {
      console.warn('[rtc] Worker не прислал своё время - свежесть просьб считаю по часам '
                   + 'этого устройства; расхождение часов ломает их молча');
    }

    room = new LK.Room({
      // ВИДЕО ПОЯВИЛОСЬ (показ экрана и камера), значит адаптивный поток снова нужен:
      // он не гонит крупную картинку туда, где её негде показать.
      adaptiveStream: true,
      dynacast: true,             // не гоняем дорожки туда, где их никто не слушает
      // ═══ СВОИ ЧИСЛА ПУБЛИКАЦИИ, А НЕ ЧУЖИЕ УМОЛЧАНИЯ (закон №43) ═══
      // ЖИВАЯ ЖАЛОБА (боевой созвон 31.08): у Максима звук пропадал РЫВКАМИ, пока шли
      // камера и показ; выключили видео - стало нормально. То есть при нехватке полосы
      // резалось всё подряд, включая голос.
      // ДО ЭТОЙ ПРАВКИ `publishDefaults` У НАС НЕ БЫЛО ВООБЩЕ - ни битрейта, ни
      // simulcast, ни приоритетов: всё ехало на умолчаниях livekit-client. Это ровно
      // тот случай, ради которого записан закон №43: от чужого дефолта зависело,
      // выйдет ли голос наружу, а нашего числа рядом не стояло.
      publishDefaults: {
        // SIMULCAST ОБЯЗАТЕЛЕН: без него у дорожки один слой, и слабому получателю
        // нечего взять кроме полного - `adaptiveStream` остаётся без выбора.
        simulcast: true,
        // КАМЕРА: лицо в плитке размером с ладонь. 720p тут не читаемость, а расход:
        // при нехватке полосы он отнимается у голоса, а разглядеть в плитке всё равно
        // нечего. Потолок называем сами.
        videoEncoding: { maxBitrate: VID_CAM_BR, maxFramerate: VID_CAM_FPS },
        // ПОКАЗ ЭКРАНА: здесь решает ЧИТАЕМОСТЬ ТЕКСТА, а её держит РАЗРЕШЕНИЕ, не
        // частота кадров. Поэтому битрейт выше камеры, а кадров мало: статичный слайд
        // при 5 к/с читается так же, как при 30, и стоит вшестеро дешевле.
        screenShareEncoding: { maxBitrate: VID_SCR_BR, maxFramerate: VID_SCR_FPS },
        // ЧЕМ ЖЕРТВОВАТЬ, КОГДА ПОЛОСЫ НЕ ХВАТАЕТ. У камеры - разрешением (лицо
        // остаётся живым), у показа - частотой (текст остаётся читаемым). Ровно
        // противоположные ответы, и один на двоих был бы неверен для обоих.
        degradationPreference: 'maintain-framerate',
        // ЗВУК: 32 кбит/с речи хватает, и это НАШЕ число, а не то, что решит SDK.
        audioPreset: { maxBitrate: AUD_BR },
        dtx: true,                // в тишине не шлём ничего - полоса достаётся видео
        red: true,                // избыточность речи: потеря пакета не даёт щелчка
      },
      // ═══ ТРИ ФЛАГА ОБРАБОТКИ ЗВУКА - ОБЯЗАТЕЛЬНЫ ═══
      // Без echoCancellation комната с двух телефонов в одной комнате даёт вой; без
      // noiseSuppression в эфир едет кондиционер; без autoGainControl один участник
      // слышен шёпотом, другой криком. Это не «настройки по вкусу», а условие того,
      // чтобы разговором вообще можно было пользоваться.
      // ОДИН ОБЪЕКТ НА ВСЕ ТРИ МЕСТА (умолчания комнаты, явная просьба при включении
      // микрофона, починка после захвата). Три копии этих флагов разъехались бы, и
      // разбор «что мы вообще просили» упёрся бы в вопрос «которая из копий».
      audioCaptureDefaults: AUDIO_WANT,
    });

    // ЭТОТ БЛОК СТОИТ ДО РЕГИСТРАЦИИ СОБЫТИЙ НАРОЧНО: `room.connect()` ниже, а
    // подписка на дорожку радио приходит СРАЗУ после него - бот уже в комнате.
    // Объяви мы `DJ_ID` ниже по файлу, первый же `TrackSubscribed` сравнивал бы
    // identity с `undefined`, громкость не ставилась бы вовсе, и выглядело бы это
