    //: цепочки нет - ставим её БЕЗ подавления; вернули «обычный» и шумодав выключен -
    //: снимаем совсем, чтобы не держать обработку впустую.
    var voiceBusy = false;
    async function voiceSet(i, why) {
      if (voiceBusy) return;
      voiceBusy = true;
      var b = $('voice');
      if (b) b.disabled = true;
      var prev = voiceIdx;
      voiceIdx = ((i % VOICE_STEPS.length) + VOICE_STEPS.length) % VOICE_STEPS.length;
      var r = voiceRatio();
      voicePaint();
      try {
        if (RNN_PROC && RNN_PROC.setPitch) {
          RNN_PROC.setPitch(r);
          if (r === 1 && !RNN_ON) await rnnApply(false, why || 'голос вернули', true);
        } else if (r !== 1) {
          var ok = await rnnApply(false, why || 'голос', true);
          // ═══ НЕ ВЫШЛО - ВОЗВРАЩАЕМ ПОДПИСЬ К ФАКТУ ═══
          // Подпись «Голос: писклявый» над обычным голосом хуже отсутствующей фичи:
          // человек будет уверен, что его слышат иначе, и узнает обратное от соседей.
          void ok;
          if (!RNN_PROC) {
            voiceIdx = prev;
            voicePaint();
            say('Голос сменить не вышло: этот клиент не даёт подключить обработку к '
                + 'микрофону. Звук идёт как был.', true);
          }
        }
      } catch (e) {
        voiceIdx = prev;
        voicePaint();
        say('Голос сменить не вышло: ' + (e && e.message || e) + '. Звук идёт как был.',
            true);
      }
      if (b) b.disabled = false;
      voiceBusy = false;
    }

    // ═══ ПОКАЗ ЭКРАНА: КНОПКА ПО НАЛИЧИЮ МЕТОДА, А НЕ ПО ПЛАТФОРМЕ ═══
    // Живая проба (Ren 24.08): desktop отдаёт поток 2880x1448@30 со звуком вкладки,
    // Android - метода getDisplayMedia НЕТ ВООБЩЕ. Это не отказ в разрешении, а
    // отсутствие API: подсказывать нечего, включать нечего.
    // ПРОВЕРЯЕМ МЕТОД, А НЕ UserAgent: UA врёт (режим «для компьютеров» на телефоне),
    // наличие метода - факт.
    // ПРИЗНАК ОДИН НА СТРАНИЦУ (`HAS_DISPLAY`, объявлен выше): дефолт шумодава спрашивает
    // РОВНО ТО ЖЕ, что решает судьбу этой кнопки, и вторая копия проверки разошлась бы с
    // первой на первой правке.
    // ДВА УСЛОВИЯ, И ОНИ РАЗНЫЕ. Метод - что умеет КЛИЕНТ; грант - что разрешил СЕРВЕР.
    // Второе без первого бесполезно, первое без второго ВИСНЕТ вместо отказа.
    var g = grantOf(j.token), srcs = g.canPublishSources || [];
    var mayScreen = srcs.indexOf('screen_share') >= 0, mayCam = srcs.indexOf('camera') >= 0;
    // ═══ ЭКРАН - ТОЛЬКО ГДЕ ЕСТЬ МЕТОД, КАМЕРА - ВЕЗДЕ ═══
    // Прежняя редакция показывала камеру ТОЛЬКО там, где нет экрана, - как замену. Это
    // неверно: с компьютера тоже надо показать себя, особенно когда экран показывать
    // нечего. Делить по устройству оправдано лишь у экрана, где метода физически нет.
    var canScreen = HAS_DISPLAY && mayScreen;
    var canCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && mayCam;
    var showBtn = $('show'), camBtn = $('cam');

    if (!mayScreen && !mayCam) {
      // ГЛАВНОЕ СООБЩЕНИЕ ЭТОГО ЭКРАНА: причина НЕ в браузере и не в комнате.
      // НАЗЫВАЕМ ПРОВЕРЕННЫЙ ФАКТ И ГОВОРИМ, ЧЕМ ПРОВЕРИТЬ ПРИЧИНУ, А НЕ УТВЕРЖДАЕМ ЕЁ.
      // Прежняя редакция дописывала «Worker выложен старой версией» - это ДОГАДКА: тот
      // же пустой грант даёт и токен, выданный вчера, и смена политики выдачи. Факт у
      // нас ровно один - в токене нет права публикации.
      $('showhint').textContent = 'Показ выключен на сервере: в токене нет права '
        + 'публикации. Это у нас, не у тебя: смотреть чужой экран при этом можно. '
        + 'Проверить - tools/rtc_env.py, там видно, каким Worker\'ом выдан токен.';
    } else {
      if (canScreen) showBtn.style.display = '';
      if (canCam) camBtn.style.display = '';
      $('showhint').textContent = canScreen
        ? 'Смотреть чужой экран можно откуда угодно, показывать - с компьютера.'
        : 'Показ экрана у телефонов недоступен - такой возможности нет у мобильных '
          + 'браузеров. Запись экрана можно снять системой и прислать файлом в чат. '
          + 'Камера и просмотр чужого экрана работают отсюда.';
    }
    barLabel(showBtn, '🖥', 'Экран');

    // ═══ ПОРОГ СТОРОЖА ЗАВЕДОМО ВЫШЕ ВСЕХ ПОТОЛКОВ SDK ═══
    // ЖИВОЙ ОТКАЗ REN: «сервер не принял дорожку за 12 с», и после этого до перезахода не
    // работали НИ экран, НИ камера. Причина найдена исходником `livekit-client@2.7.2`, а
    // не рассуждением: у SDK свои таймауты на ОБЕИХ стадиях - `RTCEngine.addTrack` 10 с
    // («publication of local track timed out») и `PCTransportManager.negotiate` 15 с
    // (`peerConnectionTimeout`). Наши 12 с стояли РОВНО МЕЖДУ ними, то есть сторож резал
    // ЖИВОЕ окно негоциации и не давал дойти точному отказу SDK.
    // ПОЧЕМУ СТОРОЖ ВСЁ-ТАКИ НУЖЕН: два ожидания у SDK не ограничены ничем -
    // `getDisplayMedia` (человек выбирает источник, и это законно) и
    // `await this.republishPromise` в `setTrackEnabled` при переподключении. Второе как
    // раз и держит нас после аварии.
    // ЗНАЧИТ ОН СТРАХОВКА, А НЕ СУДЬЯ: 25 с (10 и 15 со слаком), а текст отказа берётся У
    // SDK, если тот успел ответить. Свой - только когда SDK не сказал ничего.
    var PUB_WATCHDOG_MS = PUB_WAIT_MS;

    // ═══ ПОСЛЕ НЕУДАЧНОЙ ПУБЛИКАЦИИ ДВИЖОК ВОЗВРАЩАЕТСЯ В РАБОЧЕЕ СОСТОЯНИЕ ═══
    // Провал негоциации у SDK зовёт `handleDisconnect('negotiation')`, движок уходит в
    // ПЕРЕПОДКЛЮЧЕНИЕ, а `setTrackEnabled` первым делом ждёт `republishPromise` - это
    // ОБЩЕЕ состояние, не по источнику. Отсюда «умерли обе кнопки»: камера ни при чём,
    // она просто ждёт того же.
    // ПОЭТОМУ ПОСЛЕ ОТКАЗА МЫ ЖДЁМ ФАКТА, А НЕ ПОКАЗЫВАЕМ ОШИБКУ И УХОДИМ. Ждём
    // ограниченно и смотрим `room.state` - именно его SDK выставляет в 'connected' по
    // завершении переподключения.
    function connOk() { return String(room.state || '') === 'connected'; }

    // ═══ НИ ОДНОГО ОЖИДАНИЯ SDK БЕЗ ПОТОЛКА - ЧЕТВЁРТЫЙ КРУГ ОДНОГО ДЕФЕКТА ═══
    // ЖИВОЙ ОТКАЗ REN 30.08: камера включена, тап по «Экран» - показ не идёт, кнопка
    // ЗАЛИПАЕТ СЕРОЙ, лечит только перезаход. Прежний сторож прикрывал ОЖИДАНИЕ
    // публикации и не прикрывал РАЗМАТЫВАНИЕ: в `catch` стояло `await sdkOff()` без
    // потолка, а `sdkOff()` идёт через тот же метод, который сейчас висит (у
    // livekit-client `setTrackEnabled` первым делом ждёт `republishPromise`, и он ОБЩИЙ
    // НА УЧАСТНИКА - поэтому живая камера вешает и экран, и микрофон). `btn.disabled =
    // false` живёт в `finally`, до которого исполнение не доходило ВООБЩЕ.
    // ПОЭТОМУ ПОТОЛОК ОДИН И ОБЩИЙ: любое обращение к SDK оборачивается им, и «висит»
    // превращается в НАЗВАННЫЙ отказ, а не в серую кнопку.
    function capped(p, what, ms) {
      var t = null;
      return Promise.race([
        Promise.resolve(p).then(function (v) { clearTimeout(t); return v; },
                                function (e) { clearTimeout(t); throw e; }),
        new Promise(function (_, rej) {
          t = setTimeout(function () {
            rej(new Error(what + ': за ' + Math.round((ms || PUB_WAIT_MS) / 1000)
                          + ' с ни ответа, ни отказа'));
          }, ms || PUB_WAIT_MS);
        })]);
    }

    async function settle(ms) {
      var t0 = Date.now();
      while (Date.now() - t0 < ms) {
        if (connOk()) return true;
        await new Promise(function (r) { setTimeout(r, 250); });
      }
      return connOk();
    }

    // РУЧНОЕ ПЕРЕПОДКЛЮЧЕНИЕ - КНОПКОЙ, А НЕ САМО. Оно рвёт звук у всех, кто в разговоре;
    // делать это за человека посреди фразы хуже самой болезни. Кнопка при этом ЕСТЬ, и
    // это и есть «без перезахода»: окно закрывать не нужно.
    // ═══ ЖДЁМ ДВИЖОК В ФОНЕ, А НЕ ДЕРЖА КНОПКУ ═══
    // Первая редакция ждала `settle` ПРЯМО в обработчике тапа, и кнопка оставалась серой
    // все двенадцать секунд - то есть лечение от западни само было маленькой западнёй.
    // Человеку кнопка нужна СРАЗУ (отказ мог быть разовым), а предложение переподключиться
    // догонит его само.
    function watchEngine(why) {
      settle(12000).then(function (ok) { if (!ok) offerRedo(why); },
                         function () { offerRedo(why); });
    }

    var _redoBtn = null;
    function offerRedo(why) {
      if (_redoBtn) { _redoBtn.style.display = ''; return; }
      var host = $('showhint');
      if (!host) return;
      _redoBtn = document.createElement('button');
      _redoBtn.id = 'redo';          // чтобы реестр переключателей её ВИДЕЛ
      _redoBtn.className = 'wide';
      _redoBtn.textContent = '🔌 Переподключиться';
      _redoBtn.onclick = async function () {
        _redoBtn.disabled = true;
        //: ═══ ТОКЕН БЕРЁМ СВЕЖИЙ, А НЕ ПЕРЕИСПОЛЬЗУЕМ ВХОДНОЙ ═══
        //: Здесь стоял `room.connect(j.url, j.token)` - тот самый токен, которым вошли, а
        //: он живёт 15 минут. То есть кнопка работала первые минуты, а дальше честно
        //: отправляла «открыть комнату заново из бота» - то есть за НОВЫМ ДОКУМЕНТОМ, а
        //: вместе с ним за новым запросом микрофона. Ровно отсюда и росли жалобы
        //: «страница перезагружается и снова просит микрофон».
        //: `rejoinRoom` - ОДНА ДВЕРЬ с автоматом: у неё свежий токен, потолок попыток,
        //: возврат микрофона в прежнее состояние и разбор отказа теми же словами.
        REJOIN.n = 0; REJOIN.at = 0;      // тап человека обнуляет наш потолок попыток
        var ok = await rejoinRoom('по кнопке');
        if (ok) _redoBtn.style.display = 'none';
        _redoBtn.disabled = false;
      };
      host.parentNode.insertBefore(_redoBtn, host.nextSibling);
      // ═══ ЛЕЧЕНИЕ ДОПИСЫВАЕТСЯ К ПРИЧИНЕ, А НЕ ЗАМЕНЯЕТ ЕЁ ═══
      // Поймала браузерная проба, а не чтение: `stopShow` честно говорил «у себя выключил,
      // сервер не подтвердил», а следом `offerRedo` затирал это своим текстом - человек
      // получал «нажми Переподключиться» и терял ЕДИНСТВЕННОЕ, что объясняло, видят его
      // соседи или нет. Диагноз и что делать нужны ОБА.
      var _was = ($('state').textContent || '').trim();
      say((_was ? _was + ' ' : '') + why
          + ' Соединение не вернулось само - нажми «Переподключиться», окно закрывать '
          + 'не надо.', true);
    }

    // ═══ ОДНА ДВЕРЬ НА ОБА ПОКАЗА, РАЗНЫЕ ТОЛЬКО ИСТОЧНИК И ПОДПИСЬ ═══
    // Две копии «включить/выключить» разошлись бы на первой правке (закон №40), а тут
    // цена расхождения - висящая дорожка, которую видно СОСЕДЯМ, а не нам.
    function toggler(btn, kind, offIcon, word) {
      var live = false;
      //: ЧЕМ ОТМЕНИТЬ ОЖИДАНИЕ ОКНА ВЫБОРА. Пока не ждём - null, и тап идёт обычным путём.
      var pickAbort = null;
      // ПОДПИСЬ И КЛАСС - ОДНОЙ ДВЕРЬЮ, ИЗ `live`. Пока их ставили по местам, ветка
      // отказа забывала их вернуть, и кнопка показывала «идёт показ» над мёртвой
      // дорожкой (живой отказ Ren).
      function paint() {
        btn.classList.toggle('on', live);
        barLabel(btn, live ? '⏹' : offIcon, word);
      }

      // ═══ КНОПКА ОЖИВАЕТ ПО ТАЙМЕРУ, А НЕ ТОЛЬКО В `finally` ═══
      // `finally` возвращает её лишь тогда, когда работа ЗАВЕРШИЛАСЬ, - а весь этот класс
      // багов про то, что она НЕ завершается. Страховка на секунду выше самого долгого
      // нашего ожидания. Живой отказ Ren: кнопка серая до перезахода.
      //
      // ═══ ЧАСЫ ЗАВОДЯТСЯ НА НАШУ РАБОТУ, А НЕ НА РАЗДУМЬЕ ЧЕЛОВЕКА ═══
      // Прежняя редакция ставила таймер ОДИН РАЗ, в момент тапа, на 29 секунд - а внутри
      // лежало ожидание окна выбора длиной до ШЕСТИДЕСЯТИ.
      // ЗДЕСЬ ЖЕ ЗАПИСАНА МОЯ СОБСТВЕННАЯ ОШИБКА В РАЗБОРЕ, ПОТОМУ ЧТО ЛОЖНЫЙ КОММЕНТАРИЙ
      // ЗАКРЫВАЕТ РАЗБОР НАДЁЖНЕЕ, ЧЕМ ЕГО ОТСУТСТВИЕ. Сперва я написал, что сторож
      // срабатывал посреди диалога и объявлял «клиент так и не ответил», зовя нажать ещё
      // раз (а повторный тап во время ожидания - это `pickAbort`, то есть отмена выбора).
      // ЭТО НЕВЕРНО, и проверено чтением прежней редакции, а не по памяти: первой строкой
      // у сторожа стоит `if (!btn.disabled) return`, а на время ожидания диалога кнопка
      // ЖИВА (`btn.disabled = false` + подпись «Отменить») - значит он выходил первой же
      // строкой, ложной фразы не давал и нажать ещё раз не звал. Седьмой заход, пойдя за
      // этим объяснением, искал бы строку, которой нет.
      // ЧТО ЛОМАЛОСЬ НА САМОМ ДЕЛЕ, И ЭТО МЕНЬШЕ: одноразовый таймер у долго выбиравшего
      // человека СГОРАЛ ВХОЛОСТУЮ на 29-й секунде, и дальше публикация шла БЕЗ страховки
      // вовсе. Основной потолок публикации при этом работал, поэтому кнопка возвращалась;
      // пропадал ровно тот запасной слой, который заведён под пути, которых мы ещё не
      // нашли, - и пропадал он ИЗБИРАТЕЛЬНО, у тех, кто выбирал окно дольше всех.
      // ЧЕСТНО ПРО ДОКАЗАННОСТЬ: наблюдаемой разницы в пробе у этой правки НЕТ - круг
      // «долгое раздумье» зелен и на старом коде. Она остаётся ОБОСНОВАННЫМ намерением:
      // страховка обязана покрывать нашу работу, а не сгорать на раздумье человека.
      var _wake = null;
      function wakeArm(ms) {
        clearTimeout(_wake);
        _wake = setTimeout(function () {
          _wake = null;
          if (!btn.disabled) return;
          btn.disabled = false;
          paint();
          say('Кнопка «' + word + '» отвисла: клиент так и не ответил. Нажми ещё раз - '
              + 'состояние у себя я вернул.', true);
        }, ms || (PUB_WAIT_MS + 4000));
      }
      function wakeOff() { clearTimeout(_wake); _wake = null; }

      // ВЫКЛЮЧЕНИЕ - ТОЖЕ ОБРАЩЕНИЕ К SDK, И ОНО ВИСНЕТ РОВНО ТАК ЖЕ. Половина потолков
      // хуже, чем ни одного: она создаёт впечатление, что путь прикрыт.
      function sdkOff(ms) {
        return capped(kind === 'screen'
          ? unpublishScreen()
          : room.localParticipant.setCameraEnabled(false),
          'снятие ' + word.toLowerCase(), ms);
      }

      // ═══ ЭКРАН БЕРЁТСЯ СИНХРОННО В САМОМ ТАПЕ, ДО ЛЮБОГО `await` ═══
      // ЖИВОЙ ФАКТ (Ren 30.08), и он асимметричен: экран -> камера работает, камера ->
      // экран НЕТ. Это и есть подпись механизма. `getDisplayMedia` требует ЖЕСТА
      // человека; `getUserMedia` для камеры с уже выданным разрешением - НЕ требует.
      // ГДЕ ТЕРЯЛСЯ ЖЕСТ - НЕ В НАШЕМ КОДЕ: у нас `setScreenShareEnabled` звался
      // синхронно из обработчика (первый `await` стоит ПОСЛЕ него). Ожидание живёт
      // ВНУТРИ livekit-client: `setTrackEnabled` первым делом ждёт незавершённую
      // публикацию (`republishPromise`, ОБЩИЙ на участника - поэтому живая камера вешает
      // и экран, и микрофон) и только ПОТОМ зовёт `getDisplayMedia`. После ожидания жест
      // уже протух, и запрос экрана НЕ РЕЗОЛВИТСЯ И НЕ РЕДЖЕКТИТСЯ - отсюда наша же
      // строка «за 25 с не пришло ни подтверждения, ни отказа». ПОТОЛКИ ТУТ БЕСПОЛЕЗНЫ
      // ПО ПОСТРОЕНИЮ: они превращают вечное ожидание в названный отказ, но показа от
      // этого не случается.
      // ПОЭТОМУ ПОРЯДОК ОБРАТНЫЙ: сперва САМИ берём поток (первым действием тапа,
      // синхронно), и только потом отдаём готовую дорожку в `publishTrack` - тот ничего
      // не захватывает, жеста не требует и ждать ему нечего.
      function grabScreen() {
        if (!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)) {
          return Promise.reject(new Error('этот клиент не умеет показывать экран'));
        }
        // ПОТОЛОК КАРТИНКИ ЗАДАН НАРОЧНО: 2880x1448@30 это десятки мегабит, а комната
        // живёт на общем канале песочницы. Читаемость текста даёт и 1080p.
        var _t0 = _now();
        //: КОНТРОЛЛЕР ЖИВЁТ РОВНО ОДИН ВЫЗОВ: спецификация запрещает переиспользовать его
        //: на втором `getDisplayMedia`, и общий на страницу однажды дал бы отказ там, где
        //: всё исправно.
        var _ctl = null;
        try { if (window.CaptureController) _ctl = new window.CaptureController(); }
        catch (e) { _ctl = null; }
        //: ═══ ЧТО ВЕРНУЛ САМ ВЫЗОВ - ОТДЕЛЬНАЯ СТРОКА ЛЕНТЫ (требование Ren) ═══
        //: Прежде исход `getDisplayMedia` был виден только КОСВЕННО: дошли мы до стадии
        //: «поток получен» или нет. А исходов ТРИ, и они требуют разного: вернул поток /
        //: отказал (человек закрыл окно, нет прав) / МОЛЧИТ (обещание не разрешилось и
        //: не отклонилось - беда вебвью, и чинить у себя нечего). Третий от первых двух
        //: по косвенным признакам не отличить, а именно он у нас и живой.
        //: ВЕШАЕМСЯ НА САМ ПРОМИС, А НЕ НА ГОНКУ: гонка кончается нашим потолком, и
        //: поздний ответ - если он вообще придёт - прошёл бы мимо ленты незамеченным.
        SCREEN_HUNG = 0;
        //: ═══ ТЕЛЕМЕТРИЯ СНИМАЕТСЯ ДО ВЫЗОВА, А НЕ ПОСЛЕ ═══
        //: ТРЕБОВАНИЕ REN 03.09: нужно понять, коррелируют ли зависания с БЫСТРЫМ тапом -
        //: это отличает гонку инициализации от съеденного жеста. Оба числа после вызова
        //: уже не снять: `visibilityState` меняется вместе с открытием пикера, а «сколько
        //: прошло от открытия аппки» к тому моменту включало бы и само ожидание.
        diag('платформа ' + PLAT + ' · от открытия аппки ' + (_now() - _appT0) + 'мс'
             + ' · вкладка ' + (document.visibilityState || '?')
             + ' · фокус ' + (document.hasFocus ? document.hasFocus() : '?')
             + ' · звук вкладки просим: ' + (WANT_TAB_AUDIO ? 'да' : 'нет')
             + ' · пикер: ' + (_ctl ? 'CaptureController' : 'без контроллера'));
        //: ═══ ЧТО ПРОСИМ У ПИКЕРА - РАЗНОЕ В БРАУЗЕРЕ И В ВЕБВЬЮ ═══
        //: ЗВУК ВКЛАДКИ ТОЛЬКО В НАСТОЯЩЕМ БРАУЗЕРЕ (ресёрч Ren 03.09): на macOS вебвью
        //: идёт через `SCContentSharingPicker`, а тот отдаёт video-only - отсюда и «одна
        //: дорожка вместо двух». Просить там звук значит гонять лишнюю ветку в нативном
        //: слое ровно того компонента, который у нас и виснет.
        //: `displaySurface` - ПОДСКАЗКА, А НЕ ОГРАНИЧЕНИЕ: по спецификации она говорит
        //: пикеру, что предложить первым, и человек по-прежнему волен выбрать окно или
        //: вкладку. Сужаем неоднозначность, а не отнимаем выбор.
        var _opt = {
          video: { width: { max: 1920 }, height: { max: 1080 }, frameRate: { max: 15 },
                   displaySurface: 'monitor' },
          audio: WANT_TAB_AUDIO
        };
        //: КОНТРОЛЛЕР - ТОЛЬКО ГДЕ ОН ЕСТЬ: чужое поле в опциях безобидно не везде, и
        //: платить неизвестным риском за необязательное улучшение незачем.
        if (_ctl) _opt.controller = _ctl;
        var _p = navigator.mediaDevices.getDisplayMedia(_opt);
        _p.then(function (st) {
          var n = 0;
          try { n = st.getTracks().length; } catch (e) {}
          diag('getDisplayMedia ВЕРНУЛ ПОТОК за ' + (_now() - _t0) + 'мс, дорожек ' + n);
          //: ВЕРНУЛСЯ ПОЗЖЕ НАШЕЙ СДАЧИ - ВЫЗОВ БОЛЬШЕ НЕ ВИСИТ, и следующий тап
          //: обязан идти обычным путём, а не упираться в нашу же метку.
          SCREEN_HUNG = 0;
        }, function (e) {
          diag('getDisplayMedia ОТКАЗАЛ за ' + (_now() - _t0) + 'мс: '
               + (e && e.name || 'ошибка') + ': ' + (e && e.message || e));
          SCREEN_HUNG = 0;
        });
        return _p;
      }

      // ЧТО МЫ ОПУБЛИКОВАЛИ САМИ - ПОМНИМ САМИ. `setScreenShareEnabled(false)` ведёт
      // СВОЁ состояние, и о наших публикациях он не знает; звать его на снятие значило
      // бы надеяться, что он их найдёт, - а цена ошибки видна СОСЕДЯМ, не нам.
      var myScreen = [];

      //: ═══ ЧТО ИМЕННО МЫ ДЕРЖИМ В РУКАХ - ФАКТ, А НЕ «поток получен» ═══
      //: «Дорожек 2» не отвечает ни на один вопрос разбора. Отвечают вид, метка
      //: (у показа это имя окна или вкладки), состояние и то, не погасил ли её кто-то
      //: между получением и публикацией: мёртвая дорожка публикуется молча и навсегда
      //: остаётся чёрным квадратом у соседей.
      function trackWord(t) {
        try {
          return (t.kind || '?') + '/' + (t.readyState || '?')
               + '/«' + String(t.label || '').slice(0, 40) + '»'
               + (t.muted ? '/muted' : '');
        } catch (e) { return '?'; }
      }
      //: СОСТОЯНИЕ КОМНАТЫ РЯДОМ С КАЖДОЙ ПУБЛИКАЦИЕЙ: «встало на публикации» и «встало
      //: на публикации, потому что соединение уже переподключалось» - разные починки, а
      //: по одной строке они неразличимы.
      function roomWord() {
        try {
          return 'room=' + String(room && room.state)
               + ' сеть=' + (navigator.onLine ? 'есть' : 'НЕТ');
        } catch (e) { return 'room=?'; }
      }

      async function publishScreen(stream) {
        var st = await stream;   // промис взят ДО await'ов, здесь он уже без жеста
        var LK = window.LivekitClient || window.LiveKitClient || {};
        var SRC = (LK.Track && LK.Track.Source) || {};
        var tracks = st.getTracks ? st.getTracks() : [];
        diag('дорожки: ' + tracks.map(trackWord).join(' + ') + ' · ' + roomWord());
        if (!tracks.length) throw new Error('пустой поток: браузер не отдал ни дорожки');
        myScreen = [];
        for (var i = 0; i < tracks.length; i++) {
          var t = tracks[i];
          // ЗВУК ВКЛАДКИ - СВОЙ ИСТОЧНИК: назови его картинкой, и LiveKit разложит его
          // соседям как видео, а грант проверяется ПО ИСТОЧНИКУ.
          var src = (t.kind === 'audio')
            ? (SRC.ScreenShareAudio || 'screen_share_audio')
            : (SRC.ScreenShare || 'screen_share');
          //: ═══ КАЖДАЯ ДОРОЖКА ОТДЕЛЬНОЙ СТРОКОЙ, И ЭТО НЕ ПОДРОБНОСТЬ РАДИ ПОДРОБНОСТИ
          //: Публикаций тут ДВЕ (картинка и звук вкладки), они идут ПОСЛЕДОВАТЕЛЬНО, и
          //: у SDK каждая - своя негоциация. «Публикация не прошла» без номера дорожки
          //: не говорит, встало на первой или на второй, а это разные причины: на первой
          //: - соединение, на второй - очередь за собственной первой.
          diag('публикую ' + (i + 1) + '/' + tracks.length + ' ' + src + ' ' + trackWord(t));
          var _t0 = _now();
          var pubd = await room.localParticipant.publishTrack(t, { source: src });
          diag('опубликована ' + (i + 1) + '/' + tracks.length + ' за '
               + (_now() - _t0) + 'мс · ' + roomWord());
          myScreen.push(pubd || t);
        }
        // ЧЕЛОВЕК ЗАКРЫЛ ПОКАЗ СРЕДСТВАМИ БРАУЗЕРА («Остановить доступ») - У НАС ЭТО
        // ТАКОЕ ЖЕ ВЫКЛЮЧЕНИЕ. Без этого кнопка осталась бы в «идёт показ» над мёртвой
        // дорожкой, а соседи видели бы застывший кадр.
        try {
          var vt = st.getVideoTracks ? st.getVideoTracks()[0] : null;
          if (vt) vt.addEventListener('ended', function () {
            if (!live) return;
            live = false; paint(); sweepVideos();
            unpublishScreen().catch(function () {});
            say('Показ экрана остановлен в браузере - снял и в комнате.', true);
          });
        } catch (e) {}
        return myScreen;
      }

      async function unpublishScreen() {
        var mine = myScreen; myScreen = [];
        // ═══ ОТКАЗ СНЯТИЯ НЕ ГЛОТАЕТСЯ: ЕГО ЖДЁТ ЧЕЛОВЕК ═══
        // Первая редакция ловила каждую ошибку в пустой `catch`, и `sdkOff` всегда
        // отвечал успехом - а значит ветка «у себя выключил, но сервер снятие не
        // подтвердил» не выполнялась НИ РАЗУ. Цена видна не нам: соседи продолжают
        // видеть картинку, а человек уверен, что показ снят. Поймала это проба, а не
        // чтение. Дорожки при этом гасим ВСЕ, даже если первая не снялась.
        var bad = null;
        for (var i = 0; i < mine.length; i++) {
          var it = mine[i], tr = (it && it.track) ? it.track : it;
          try { await room.localParticipant.unpublishTrack(tr, true); }
          catch (e) { bad = bad || e; }
          try { tr.stop(); } catch (e) {}
        }
        // СТРАХОВКА НА ЧУЖИЕ ПУБЛИКАЦИИ: если экран когда-то включили СТАРЫМ путём (или
        // это второй клиент того же человека), наш список пуст, а дорожка идёт. Снимаем
        // по ФАКТУ источника, а не по нашей памяти.
        try {
          var pubs = room.localParticipant.trackPublications
                  || room.localParticipant.tracks || new Map();
          var left = [];
          pubs.forEach(function (pub) {
            if (String(pub.source || '').indexOf('screen') >= 0 && pub.track) left.push(pub.track);
          });
          for (var j = 0; j < left.length; j++) {
            try { await room.localParticipant.unpublishTrack(left[j], true); }
            catch (e) { bad = bad || e; }
          }
        } catch (e) {}
        if (bad) throw bad;
        return true;
      }

      async function stopShow() {
        // ПОРЯДОК ЗДЕСЬ ЗНАЧИМ, И ЭТО ПОЙМАЛ БРАУЗЕРНЫЙ ПРОГОН. Сперва гасим САМИ
        // дорожки (пока публикации ещё на месте), потом отключаем источник: наоборот
        // `setScreenShareEnabled(false)` уже снял публикации, и явная остановка работала
        // ВХОЛОСТУЮ - счётчик остановленных дорожек показывал ноль. Незакрытая дорожка
        // держит захват, и следующий выбор источника ведёт себя непредсказуемо.
        stopLocalMedia(kind);
        // ═══ ЛОКАЛЬНО МЫ УЖЕ ВЫКЛЮЧЕНЫ, ЧТО БЫ НИ ОТВЕТИЛ SDK ═══
        // Захват снят строкой выше, значит честное состояние кнопки - «выключено», и
        // ставим его ДО просьбы к SDK. ПРЕЖНЯЯ РЕДАКЦИЯ ДЕЛАЛА НАОБОРОТ: на исключении
        // она оставляла live=true и класс `.on`, следующий тап снова шёл в остановку,
        // снова падал - и человек был заперт до перезахода (живой отказ Ren:
        // «waiting for pending publication promise timed out», кнопка залипает).
        live = false;
        // ОКНО УХОДИТ ВМЕСТЕ С ЗАХВАТОМ, А НЕ ЖДЁТ СОБЫТИЯ ОТ SDK: `LocalTrackUnpublished`
        // может прийти с уже обнулённым `pub.track` - тогда плитка остаётся тёмной
        // навсегда (живой отзыв 29.08). Уборка идёт по ФАКТУ мёртвой дорожки.
        sweepVideos();
        try {
          await sdkOff();
          sweepVideos();
          say('');
        } catch (e) {
          sweepVideos();
          // ГОВОРИМ РОВНО ТО, ЧТО ЗНАЕМ: у себя выключили, а снял ли публикацию сервер -
          // не знаем. Молчаливое «выключено» здесь было бы обещанием соседям, которое мы
          // не можем сдержать.
          say('У себя ' + word.toLowerCase() + ' выключил, но сервер снятие не подтвердил ('
              + (e && e.message || e) + '). Соседи могут ещё пару секунд видеть картинку.',
              true);
          watchEngine('Показ снят у себя, но соединение в переподключении.');
        }
      }

      // ═══ СТАДИЯ НАЗЫВАЕТСЯ ВСЛУХ, ИНАЧЕ СЛЕДУЮЩИЙ ЖИВОЙ ПРОГОН СНОВА НЕ ОТВЕТИТ ═══
      // Шесть кругов подряд разбор упирался в одно: «залипло, и непонятно, где». Стадий
      // всего три (запросил экран -> поток получен -> опубликовано), и та, на которой
      // встало, отвечает на вопрос сразу: нет второй - молчит `getDisplayMedia` (диалог
      // не открылся), нет третьей - молчит `publishTrack` (держит SDK).
      // ИМЯ СВОЁ, А НЕ `stage`: наверху уже живёт `stage()` - сторож ЗАГРУЗКИ страницы,
      // и второе имя того же вида читателю неразличимо, а при удалении внутреннего
      // вызовы молча поехали бы в чужой сторож и испортили бы его диагностику
      // (закон №26: локальное имя не совпадает с модульным). Поймал собственный `rtc17`.
      //: ═══ СТАДИЯ ОБЯЗАНА ДОЙТИ ДО ЧЕЛОВЕКА, А НЕ ТОЛЬКО ДО КОНСОЛИ ═══
      //: ЖИВОЙ ОТКАЗ Ren 31.08: «после камеры выбрал «весь экран» -> ничего, висит «Жду
      //: окно выбора экрана»». Диалог при этом ОТКРЫЛСЯ и человек в нём ВЫБРАЛ - то есть
      //: `getDisplayMedia` отработала, и висела уже ПУБЛИКАЦИЯ. А на экране оставалась
      //: подсказка ПЕРВОЙ стадии: `say()` пишет строку, и никто её не перебивал ещё
      //: двадцать пять секунд, до сторожа публикации.
      //: ЦЕНА ЭТОГО НЕ В КОСМЕТИКЕ: подпись НАЗЫВАЛА НЕ ТУ СТАДИЮ, и следующий разбор
      //: снова ушёл бы в окно выбора - в исправную половину. Стадии у нас посчитаны с
      //: прошлого захода, до человека они просто не доезжали. На телефоне консоли нет.
      var SHOW_SAY = {
        'запросил экран': '',            // первую стадию озвучивает мягкая подсказка
        'публикую дорожки': 'Экран взял, отдаю его комнате - это пара секунд.',
      };
      function showStage(what) {
        try { console.log('[показ] ' + what); } catch (e) {}
        try { window.__STAGE = (window.__STAGE || []); window.__STAGE.push(what); } catch (e) {}
        //: ═══ ТА ЖЕ СТАДИЯ УХОДИТ В bot.log ═══
        //: Первая стадия ОТКРЫВАЕТ ленту (обнуляет часы), последняя её ЗАКРЫВАЕТ - иначе
        //: отправка ждала бы тишины ещё секунду после того, как всё уже кончилось, а
        //: человек в это время успевает тапнуть снова.
        try {
          if (String(what).split(':')[0] === 'запросил экран') diagStart('показ');
          diag(what);
          if (String(what).split(':')[0] === 'опубликовано') diagFlush();
        } catch (e) {}
        try {
          var head = String(what).split(':')[0];
          if (head === 'поток получен') {
            say('Экран взял, отдаю его комнате - это пара секунд.', true);
          } else if (SHOW_SAY[head]) {
            say(SHOW_SAY[head], true);
          }
        } catch (e) {}
      }

      // ═══ ДИАЛОГ НЕ ОТКРЫЛСЯ - ГОВОРИМ ЭТО И ДАЁМ ВЫХОД ═══
      // ФАКТ (живой прогон Ren 31.08, две точки): при свежем заходе в Telegram WebView
      // диалог появляется, ПОСЛЕ включённой камеры - нет вовсе. Значит поддержка есть, а
      // ломается сочетание; из кода этого не установить (закон №48), но молчать нельзя.
      // Называем ОБА выхода: выключить камеру и попробовать снова, либо открыть комнату в
      // обычном браузере - там показ работает (тот же прогон).
      function sayNoPicker() {
        var camOn = false;
        try {
          camOn = !!(document.getElementById('cam')
                     && document.getElementById('cam').classList.contains('on'));
        } catch (e) {}
        //: ═══ ФРАЗА ПРЯМАЯ, ПОТОМУ ЧТО ОТВЕТ МЫ УЖЕ ЗНАЕМ (лента 01.09) ═══
        //: Раньше здесь стояло «окно не открылось» - и это ВЕРНО не всегда: у Ren оно
        //: как раз открылось, он выбрал окно, а промис не вернулся. Две разные вещи под
        //: одной фразой отправляли разбор искать диалог, который был.
        //: Различаем по ленте: дошли до «поток получен» - вызов ответил; не дошли -
        //: Telegram не отдал экран, и чинить это у себя нечем.
        var t = 'Telegram не отдал экран за ' + Math.round(SCREEN_PICK_MS / 1000) + ' с';
        t += camOn
          ? ' (у него это чаще всего при включённой камере - её можно выключить и'
            + ' попробовать снова).'
          : '. Выбрал ты окно или диалог не появился - ему всё равно: ответа нет.';
        //: ═══ ЛЕЧЕНИЕ ИДЁТ В ТОЙ ЖЕ ФРАЗЕ, ЧТО ДИАГНОЗ ═══
        //: Диагноз без выхода человек читает как «сломалось и всё»; выход отдельным
        //: сообщением затёр бы диагноз (`say` пишет в одну липкую строку).
        var _auto = planRejoin();
        t += _auto
          ? ' Перезахожу в комнату сам через ' + Math.round(REJOIN_WAIT_MS / 1000)
            + ' с: висящий запрос снимается только новым документом. Пару секунд тебя'
            + ' не будет слышно - если сейчас не время, жми «Не перезаходить».'
          : ' Перезаход уже пробовали, и он не помог - открывай комнату в браузере.';
        t += _auto ? '' : ' Открой комнату в браузере - там показ работает.';
        say(t, true);
        showBrowserWay();
      }

      //: ═══ ПЕРЕЗАХОД РУКОЙ: ТА ЖЕ ДВЕРЬ, ЧТО У АВТОМАТА ═══
      //: Сборку адреса делает `rejoinNow` на модульном уровне - см. её комментарий.
      //: Своя копия здесь разошлась бы с автоматической на первой же правке, и человек
      //: получил бы РАЗНЫЕ перезаходы от кнопки и от таймера (закон №40).
      function showRejoinWay() {
        var b = document.getElementById('rejoin');
        if (!b) return;
        b.style.display = '';
        b.textContent = '🔄 Перезайти в комнату';
        b.disabled = false;
        b.onclick = function () { b.disabled = true; rejoinNow(false); };
      }

      //: ═══ ПЕРЕЗАХОД САМ, С ОБЪЯСНЕНИЕМ И С ОТМЕНОЙ (требование Ren 03.09) ═══
      //: «Сейчас человек делает 5-6 перезаходов руками - это должно делаться само».
      //: ТРИ УСЛОВИЯ, И НИ ОДНО НЕ УКРАШЕНИЕ.
      //: (а) ПОТОЛОК. Пересборка документа не всесильна: у неё есть случаи, когда она не
      //: помогает, и тогда автоматика превращается в петлю перезаходов - это ХУЖЕ самого
      //: зависания. Поэтому сами перезаходим РОВНО ОДИН РАЗ за цепочку документов, а на
      //: второй говорим прямо, что перезаход не помог, и уводим в браузер.
      //: (б) ОТМЕНА. Перезаход рвёт соединение: пару секунд человека не слышно ВСЕЙ
      //: комнате, а он мог тапнуть показ посреди своей же фразы. Действие, которое
      //: делается за человека, обязано иметь выход (закон №55) - и цена названа словами,
      //: а не спрятана.
      //: (в) РЕШЕНИЕ ОТДЕЛЕНО ОТ РЕЧИ. `planRejoin` отвечает «беру перезаход на себя или
      //: нет», а текст собирает вызывающий ОДНОЙ строкой: два `say` подряд затирают друг
      //: друга, и человек прочитал бы только вторую половину.
      function planRejoin() {
        if (rejoinCount() >= REJOIN_AUTO_MAX) return false;
        var b = document.getElementById('rejoin');
        if (!b) return false;
        var t = setTimeout(function () { rejoinNow(true); }, REJOIN_WAIT_MS);
        b.style.display = '';
        b.disabled = false;
        b.textContent = '✖️ Не перезаходить';
        b.onclick = function () {
          clearTimeout(t);
          //: ОТМЕНА НЕ ЗАПИРАЕТ ЧЕЛОВЕКА: та же кнопка возвращается ручным перезаходом,
          //: то есть выход остаётся на месте, просто решение снова его.
          showRejoinWay();
          say('Не перезахожу. Показ экрана до перезахода не заработает - кнопка ниже '
              + 'сделает это, когда будешь готов.', true);
        };
        return true;
      }

      //: ═══ ПОВТОР ТЕМ ЖЕ ПОТОКОМ: ОКНО УЖЕ ВЫБРАНО, ВЫБИРАТЬ ЗАНОВО НЕЧЕГО ═══
      //: ТРЕБОВАНИЕ REN (6-й заход): «поток получен, а публикация не идёт - сказать это
      //: словами и предложить повтор, не оставляя серую кнопку». Сегодня отказ гасил
      //: захват, и человек шёл в диалог по второму кругу - а диалог как раз и есть то
      //: место, где половина попыток и теряется.
      //: ДЕРЖИМ ОГРАНИЧЕННО И ГОВОРИМ, КОГДА ОТПУСТИЛИ. Незакрытый захват - это «идёт
      //: доступ к экрану» в браузере над комнатой, где ничего не показывается: висеть
      //: вечно он не имеет права, а исчезнуть молча - тем более.
      var RETRY_KEEP_MS = 90000;
      var _retryBtn = null, _retryTimer = null;
      function dropRetry(stream, why) {
        clearTimeout(_retryTimer); _retryTimer = null;
        if (_retryBtn) { _retryBtn.style.display = 'none'; }
        if (stream && stream.getTracks) {
          try { stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); }
          catch (e) {}
        }
        if (why) say(why, true);
      }
      function offerShowRetry(stream) {
        //: ПРЕДЛАГАЕМ, ТОЛЬКО ЕСЛИ ЕСТЬ ЧТО ПОВТОРИТЬ. Мёртвую дорожку публиковать
        //: бессмысленно: у соседей она станет чёрным квадратом, а человек решит, что
        //: показ идёт (закон №35 - проверяем ФАКТ, а не то, что поток у нас в руке).
        var vt = null;
        try { vt = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null; }
        catch (e) { vt = null; }
        if (!vt || vt.readyState !== 'live') { dropRetry(stream, ''); return false; }
        var host = $('showhint');
        if (!host) { dropRetry(stream, ''); return false; }
        if (!_retryBtn) {
          _retryBtn = document.createElement('button');
          _retryBtn.id = 'showretry';       //: чтобы реестр переключателей её ВИДЕЛ
          _retryBtn.className = 'wide';
          host.appendChild(_retryBtn);
        }
        _retryBtn.textContent = '🔁 Повторить показ (окно уже выбрано)';
        _retryBtn.style.display = '';
        _retryBtn.onclick = async function () {
          _retryBtn.style.display = 'none';
          clearTimeout(_retryTimer); _retryTimer = null;
          diagStart('показ-повтор');
          diag('повтор тем же потоком: ' + trackWord(vt) + ' · ' + roomWord());
          btn.disabled = true; wakeArm();
          try {
            PUB_BUSY = word;
            await startShow(Promise.resolve(stream), true);
          } finally {
            if (PUB_BUSY === word) PUB_BUSY = '';
            wakeOff(); paint(); btn.disabled = false;
          }
        };
        clearTimeout(_retryTimer);
        _retryTimer = setTimeout(function () {
          dropRetry(stream, 'Отпустил экран - он висел выбранным, но не показанным. '
                          + 'Нажми «Экран» ещё раз, окно придётся выбрать заново.');
        }, RETRY_KEEP_MS);
        return true;
      }

      //: `again` - ПОВТОР УЖЕ ВЗЯТЫМ ПОТОКОМ: окно выбрано, диалога не будет, и ждать его
      //: (вместе со всей веткой отмены) значило бы ждать того, чего не случится.
      async function startShow(gotStream, again) {
        var lost = false, pub = null;
        // ═══ ПОКАЗ УЖЕ ИДЁТ - ГОВОРИМ ЭТО, А НЕ МОЛЧИМ ═══
        // Живой случай 29.08: человек открыл комнату с двух своих клиентов, показ пошёл с
        // первого, а попытка со второго не дала НИЧЕГО - ни картинки, ни отказа. Что там
        // отвечает SFU, из кода не установить (закон №48), но молчание - худший исход в
        // любом случае: человек жмёт кнопку и не знает, сломано у него или занято.
        // Смотрим на ФАКТ комнаты: если картинка такого рода уже идёт, называем чью.
        if (kind === 'screen') {
          var busy = '';
          try {
            vids.forEach(function (r) {
              if (busy || r.el.dataset.me === '1') return;
              busy = (r.el.dataset.nm || r.el.dataset.pid || 'кто-то');
            });
          } catch (e) {}
          if (busy) {
            say('Экран уже показывает ' + busy + '. Если это твой второй вход - показ идёт '
                + 'в том окне, и с этого он не начнётся: комната пускает по одной картинке '
                + 'от участника.', true);
          }
        }
        var stream = null;
        //: ═══ ПОВТОР ИДЁТ МИМО ДИАЛОГА: ЕГО УЖЕ ПРОШЛИ ═══
        //: Без этой ветки повтор снова ждал бы окно выбора шестьдесят секунд и сдался бы
        //: «диалог не открылся» - про диалог, которого мы и не просили.
        if (kind === 'screen' && again) {
          try { stream = await gotStream; } catch (e) { stream = null; }
          if (!stream) { say('Поток потерялся - нажми «Экран» ещё раз.', true); return; }
          showStage('поток получен (повтор): дорожек '
                    + (stream.getTracks ? stream.getTracks().length : '?'));
        } else if (kind === 'screen') {
          showStage('запросил экран');
          // МЯГКАЯ ПОДСКАЗКА НИЧЕГО НЕ ОТМЕНЯЕТ: она отвечает на вопрос «а оно вообще
          // работает?», который человек задаёт себе на седьмой секунде тишины.
          var _hint = setTimeout(function () {
            if (live) return;
            //: ═══ НА СЕДЬМОЙ СЕКУНДЕ ВЫХОД СТАНОВИТСЯ ВИДЕН, А ПОПЫТКА ИДЁТ ДАЛЬШЕ ═══
            //: ЗАМЕР REN 03.09: удачная попытка укладывается в 3-5 с (браузер 4053 мс,
            //: вебвью 3647 и 4852 мс). Значит после семи секунд ждать нечего - но и
            //: ПРЕРЫВАТЬ нечего: отменить `getDisplayMedia` нам всё равно нечем, а поток
            //: может доехать. Поэтому попытку не трогаем, а рядом кладём рабочий выход:
            //: доедет - работаем в Telegram, не доедет - человек уже не заперт.
            //: ДВАДЦАТЬ СЕКУНД МОЛЧАНИЯ И БЫЛИ ЖАЛОБОЙ: экраном делятся постоянно, и
            //: неизвестность на каждой попытке дороже самой неудачи.
            say('Обычно окно выбора появляется за 3-5 секунд. Здесь не появилось - '
                + 'попытку не прерываю, она ещё может дойти. Рядом кнопка открыть '
                + 'комнату в браузере: там показ экрана работает всегда.', true);
            showBrowserWay();
          }, SCREEN_HINT_MS);
          var _late = false, _quit = false;
          // ПОКА ЖДЁМ ДИАЛОГ, КНОПКА ЖИВА И НАЗЫВАЕТ, ЧТО СДЕЛАЕТ ТАП.
          btn.disabled = false;
          barLabel(btn, '✖️', 'Отменить');
          //: СТОРОЖ КНОПКИ СНЯТ НА ВРЕМЯ РАЗДУМЬЯ ЧЕЛОВЕКА - см. `wakeArm`. Здесь ждём
          //: НЕ клиента, а его, и выход у него есть: та же кнопка, подписанная «Отменить».
          wakeOff();
          try {
            stream = await Promise.race([gotStream, new Promise(function (_, rej) {
              pickAbort = function () {
                _quit = true;
                rej(new Error('ожидание окна выбора отменено'));
              };
              setTimeout(function () {
                _late = true;
                rej(new Error('окно выбора экрана так и не открылось'));
              }, SCREEN_PICK_MS);
            })]);
            pickAbort = null; btn.disabled = true; paint();
            clearTimeout(_hint);
            //: ОКНО ВЫБРАНО - НАЧАЛАСЬ НАША РАБОТА, ЗАВОДИМ ЧАСЫ ЗАНОВО.
            wakeArm();
            showStage('поток получен: дорожек ' + (stream.getTracks ? stream.getTracks().length : '?'));
            //: ПОЛУЧИЛОСЬ - ЗНАЧИТ БЮДЖЕТ АВТОПЕРЕЗАХОДА СНОВА ЦЕЛ (см. `rejoinClear`).
            rejoinClear();
          } catch (e) {
            pickAbort = null; btn.disabled = true;
            clearTimeout(_hint);
            live = false;
            // ПОТОК, ПРИШЕДШИЙ ПОЗЖЕ НАШЕЙ СДАЧИ, ГАСИМ - НО ТОЛЬКО КОГДА ОН ПРАВДА
            // ПРИШЁЛ. Прежняя редакция гасила его в общем `catch`, то есть могла убить
            // ЖИВОЙ захват, публикация которого ещё шла (подозрение Ren - верное).
            try {
              gotStream.then(function (st) {
                try { st.getTracks().forEach(function (t) { t.stop(); }); } catch (e2) {}
              }, function () {});
            } catch (e3) {}
            var _cancel = (e && (e.name === 'NotAllowedError' || e.name === 'AbortError'));
            //: ═══ ОТКАЗ УЛЕТАЕТ В ЛОГ ТОЖЕ, И ЭТО ГЛАВНАЯ ПОЛОВИНА ═══
            //: Отправлять только успех значило бы собрать ленту ровно про те прогоны,
            //: которые и так работают, - охрана пустоты в самой диагностике. Причина
            //: НАЗЫВАЕТСЯ словом, а не именем исключения: «человек нажал Отмену»,
            //: «диалог не открылся за минуту» и «браузер отказал» - три разные починки.
            diag('окно выбора не дало потока: ' + (_quit ? 'отменено тапом'
                 : _cancel ? 'человек закрыл окно выбора'
                 : _late ? 'диалог не открылся за ' + Math.round(SCREEN_PICK_MS / 1000) + ' с'
                 : ((e && e.name || 'ошибка') + ': ' + (e && e.message || e)))
                 + ' · ' + roomWord());
            diagFlush();
            //: ═══ МЫ СДАЛИСЬ, А ВЫЗОВ ОСТАЛСЯ ВИСЕТЬ - ЭТО НАДО ПОМНИТЬ ═══
            //: И потолок, и тап по «Отменить» отпускают НАШЕ ОЖИДАНИЕ; сам
            //: `getDisplayMedia` продолжает числиться у вебвью незакрытым, и следующий
            //: тап диалога уже не откроет (живой сценарий Ren, шаг 4). Отменить его
            //: нечем - у Web API такой двери нет вовсе, - но молчать об этом значит
            //: оставить человека тыкать в мёртвую кнопку до перезахода.
            //: МЕТКУ СТАВИМ, ТОЛЬКО ЕСЛИ ВЫЗОВ ПРАВДА ЕЩЁ ЖИВ: отказ самого браузера
            //: (`_cancel`) означает, что он вызов ЗАВЕРШИЛ, и запирать после него нечего.
            if (_quit || _late) { SCREEN_HUNG = Date.now(); }
            if (_quit) {
              say('Отменил ожидание. Сам запрос экрана Telegram не отпускает: отменить '
                  + 'его со страницы нечем. Следующий тап скажет, что делать.', true);
              return;
            }
            if (_cancel) { say('Показ отменён - окно не выбрано.', true); return; }
            if (_late) { sayNoPicker(); return; }
            say(devWhy(e, 'screen')
                || ('Экран взять не вышло (' + (e && e.name || 'ошибка') + '): '
                    + (e && e.message || e)), true);
            return;
          }
        }
        try {
          pub = (kind === 'screen')
            // ═══ ПОТОК УЖЕ У НАС В РУКАХ - ПУБЛИКУЕМ ЕГО, А НЕ ПРОСИМ SDK СХОДИТЬ ЗА НИМ
            // Почему так, см. `grabScreen` выше: `setScreenShareEnabled` внутри себя
            // ЖДЁТ незавершённую публикацию и только потом зовёт `getDisplayMedia` - а
            // после ожидания жеста человека уже нет, и запрос экрана не резолвится и не
            // реджектится. `publishTrack` ничего не захватывает и жеста не требует.
            ? publishScreen(stream)
            : room.localParticipant.setCameraEnabled(true);
          if (kind === 'screen') showStage('публикую дорожки');
          await Promise.race([pub, new Promise(function (_, rej) {
            setTimeout(function () {
              lost = true;
              // НИ СЛОВА О ПРИЧИНЕ: мы её не знаем. ПРЕЖНЯЯ РЕДАКЦИЯ УТВЕРЖДАЛА «старый
              // токен без права показа: у нас не выложен Worker» - и это было ЗАВЕДОМО
              // ЛОЖНО, потому что кнопка вообще показывается ТОЛЬКО когда в гранте есть
              // нужный источник (см. `grantOf` выше). То есть единственное, что мы к
              // этому моменту проверили, подсказка и отрицала.
              rej(new Error('за ' + Math.round(PUB_WATCHDOG_MS / 1000)
                            + ' с не пришло ни подтверждения, ни отказа (свои потолки у '
                            + 'клиента - 10 и 15 с, значит встало не на них)'));
            }, PUB_WATCHDOG_MS);
          })]);
          live = true; say('');
          //: ПОЛУЧИЛОСЬ - ПРЕДЛОЖЕНИЕ ПОВТОРА УБИРАЕМ, НО ПОТОК НЕ ТРОГАЕМ: он теперь
          //: публикуется, и `dropRetry` погасил бы ровно то, что сейчас видят соседи.
          clearTimeout(_retryTimer); _retryTimer = null;
          if (_retryBtn) _retryBtn.style.display = 'none';
          if (kind === 'screen') showStage('опубликовано');
        } catch (e) {
          //: ПУБЛИКАЦИЯ НЕ СОСТОЯЛАСЬ - ЭТО ТОТ САМЫЙ ПРОМЕЖУТОК, РАДИ КОТОРОГО ЛЕНТА И
          //: ЗАВЕДЕНА. `lost` отличает «сдались по нашему сторожу, операция ещё идёт» от
          //: «SDK честно отказал», и это разные починки: первое - очередь или негоциация,
          //: второе - права, кодек, состояние соединения.
          try {
            diag((lost ? 'СТОРОЖ: публикация не ответила' : 'публикация отказала') + ': '
                 + (e && e.name || 'ошибка') + ': ' + (e && e.message || e)
                 + ' · ' + roomWord());
            diagFlush();
          } catch (e8) {}
          if (lost) {
            // ОПЕРАЦИЯ ВСЁ ЕЩЁ ИДЁТ ВНУТРИ SDK. Просим ЕГО ЖЕ её свернуть - тем самым
            // методом, которым включали: только он умеет снять состояние «публикуется».
            // НО ЖДЁМ ОГРАНИЧЕННО: этот вызов встаёт в очередь ЗА висящей операцией и
            // виснет вместе с ней, а мы после него обязаны вернуть человеку кнопку.
            // Именно здесь и залипало (живой отказ Ren 30.08).
            // ═══ СТОРОЖ ПОЗДНЕЙ ПУБЛИКАЦИИ ВЗВОДИТСЯ ДО ОЖИДАНИЯ, А НЕ ПОСЛЕ ═══
            // ПОРЯДОК ЗДЕСЬ - ЧАСТЬ ПРАВИЛА, И ПРЕЖНИЙ БЫЛ НЕВЕРЕН. `sdkOff(4000)` ждёт
            // до четырёх секунд, и публикация может доехать РОВНО В ЭТО ОКНО: обработчик,
            // навешенный после, к тому моменту ещё не существует. Промис при этом уже
            // разрешён, и `.then` на нём сработает - но на четыре секунды позже, а всё
            // это время соседи видят картинку, которую человек считает выключенной.
            // Взводим первым: `.then` на ещё не разрешённом промисе ничего не стоит.
            try {
              pub.then(function () {
                if (live) return;
                try { stopLocalMedia(kind); } catch (e3) {}
                try { sdkOff(); } catch (e3) {}
                say('Дорожка доехала уже после отказа - снял её. Попробуй ещё раз.', true);
              }, function () {});
            } catch (e4) {}
            // ОПЕРАЦИЯ ВСЁ ЕЩЁ ИДЁТ ВНУТРИ SDK. Просим ЕГО ЖЕ её свернуть - тем самым
            // методом, которым включали: только он умеет снять состояние «публикуется».
            try { await sdkOff(4000); } catch (e2) {}
          }
          stopLocalMedia(kind);          // чтобы неудача не оставила захват висеть
          // ═══ ВЗЯТЫЙ ПОТОК ГАСИМ, ТОЛЬКО КОГДА ПОВТОРЯТЬ ИМ БОЛЬШЕ НЕЧЕГО ═══
          // ПОДОЗРЕНИЕ REN БЫЛО ВЕРНЫМ: на пути СТОРОЖА (`lost`) публикация ещё ИДЁТ и
          // может доехать, а мы уже гасили дорожку - то есть сами убивали живой захват и
          // делали повторную попытку заведомо бессмысленной.
          // ТЕПЕРЬ ШИРЕ: поток, который ещё жив, - это ВЫБРАННОЕ ОКНО, и выбрасывать его
          // значит отправить человека во второй раз туда, где половина попыток и теряется
          // (требование Ren, 6-й заход). Держим и предлагаем повтор; не пригодился -
          // отпускаем сами и ГОВОРИМ об этом (см. `offerShowRetry`).
          var _kept = false;
          if (kind === 'screen' && stream) {
            try { _kept = offerShowRetry(stream); } catch (e5) { _kept = false; }
          }
          if (!_kept && !lost && stream && stream.getTracks) {
            try { stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e5) {} }); }
            catch (e6) {}
          }
          live = false;
          // ═══ ОТКАЗ НАЗЫВАЕТ ИЗВЕСТНЫЙ ВЫХОД, А НЕ ТОЛЬКО ИМЯ ОШИБКИ ═══
          // Про сочетание «камера включена + показ экрана» у нас есть ЖИВОЙ ФАКТ: на
          // свежем заходе всё работает, после камеры - нет (два прогона Ren). Почему
          // так у платформы, из кода не установить (закон №48), но выход мы знаем, и
          // молчать о нём значит оставить человека перед именем исключения.
          var _camOn2 = false;
          try {
            _camOn2 = !!(kind === 'screen' && document.getElementById('cam')
                         && document.getElementById('cam').classList.contains('on'));
          } catch (e7) {}
          //: ИМЯ ОШИБКИ ПЕРЕВОДИТСЯ, А НЕ ПОКАЗЫВАЕТСЯ КАК ЕСТЬ. У `NotFoundError` и
          //: `NotReadableError` РАЗНЫЕ починки, и английская строка чужого SDK не говорит
          //: человеку ни первой, ни второй (живой случай 07.09).
          var _dw = devWhy(e, kind === 'screen' ? 'screen' : 'cam');
          say((_dw || ('Показать не вышло (' + (e && e.name || 'ошибка') + '): '
                       + (e && e.message || e)))
              + (_camOn2 ? ' Похоже на сочетание с камерой: выключи её и нажми «Экран» '
                         + 'ещё раз, либо открой комнату в браузере - там показ работает.'
                         : ''), true);
          if (_camOn2) showBrowserWay();
          // ═══ ВОЗВРАЩАЕМ ДВИЖОК, А НЕ ТОЛЬКО ПОКАЗЫВАЕМ ОШИБКУ ═══
          // Требование Ren по живому прогону: после неудачи и экран, и камера обязаны
          // включаться без перезахода. Ждём ФАКТА `room.state === 'connected'`, а не
          // «мы позвали и надеемся» (закон №35); не вернулось - даём кнопку.
          watchEngine('Показать не вышло, и соединение ушло в переподключение.');
        }
      }

      btn.onclick = async function () {
        // ДВА ОДНОВРЕМЕННЫХ ВЫЗОВА ОДНОГО ИСТОЧНИКА - ВТОРОЙ ИСТОЧНИК ТОЙ ЖЕ ОШИБКИ.
        // livekit-client ждёт незавершённую операцию и падает «waiting for pending
        // publication promise timed out»; нетерпеливый двойной тап по «Показать экран»
        // воспроизводит это без всякого таймаута.
        // ═══ ТАП ВО ВРЕМЯ ОЖИДАНИЯ ОКНА ВЫБОРА - ЭТО ОТМЕНА, А НЕ МЁРТВАЯ КНОПКА ═══
        // Пока мы ждём диалог, кнопка ЖИВА и подписана «Отменить»: человек, у которого
        // диалог не открылся, не должен сидеть перед серой кнопкой и гадать. Живой отказ
        // Ren 31.08 был ровно про это ощущение («кнопка залипает»).
        if (pickAbort) { pickAbort(); return; }
        if (btn.disabled) return;
        // ═══ ВИДЕО ЗАПРЕЩЕНО АДМИНОМ - НЕ ДЕЛАЕМ ВИД, ЧТО ТАП ЧТО-ТО НАЧАЛ ═══
        // НАСТОЯЩИЙ ГЕЙТ СТОИТ НА СЕРВЕРЕ (у участника закрыто право публиковать видео,
        // закон №32): сигнал мимо интерфейса всё равно не пройдёт, и эта проверка ничего
        // не охраняет. Она нужна ради ДРУГОГО - чтобы человек получил внятную причину, а
        // не английский отказ SDK про источник, которого ему не разрешали.
        if (vlockOn && !iAmAdm && !live) {
          say('Видео в комнате запрещено админом: включить камеру или показ экрана '
              + 'сейчас нельзя. Смотреть чужое видео при этом можно. Снять запрет может '
              + 'только админ.', true);
          return;
        }
        // ═══ СВОЯ ПУБЛИКАЦИЯ ЕЩЁ В ПОЛЁТЕ - НЕ СТАКАЕМ ВТОРУЮ ═══
        // Это и есть исходный механизм: у SDK публикация сериализуется на участника, и
        // вторая операция ждёт первую. Мы эти операции сами и запускаем, значит гадать не
        // нужно - знаем точно. Молча встать в очередь значило бы повторить ту же западню.
        if (PUB_BUSY && PUB_BUSY !== word) {
          say('Сейчас включается ' + PUB_BUSY.toLowerCase() + ' - дождись и нажми «'
              + word + '» ещё раз. Два включения разом клиент не тянет: второе встаёт в '
              + 'очередь за первым и может не дождаться.'
              + (PUB_BUSY === 'Микрофон'
                 ? ' Микрофон включается сам при входе; если он застрял, помогает '
                   + 'перезаход в комнату.' : ''), true);
          return;
        }
        // ═══ ЗАПРОС ЭКРАНА - ПЕРВОЕ ДЕЙСТВИЕ ТАПА, ДО ЕДИНОГО `await` ═══
        // Жест человека живёт ровно до первого ожидания (см. `grabScreen`). Здесь мы ещё
        // ВНУТРИ жеста, поэтому берём поток сами; всё остальное - `btn.disabled`,
        // таймеры, ожидания SDK - идёт ПОСЛЕ. Порядок этих двух строк и есть починка:
        // поменяй их местами, и «камера -> экран» снова повиснет молча.
        //: ═══ ПРЕДЫДУЩИЙ ЗАПРОС ЭКРАНА ЕЩЁ ВИСИТ - ВТОРОЙ ТАП В ТУ ЖЕ ТИШИНУ НЕ ИДЁТ
        //: ЖИВОЙ СЦЕНАРИЙ REN, шаги 4-5: после повисшего вызова диалог больше НЕ
        //: ОТКРЫВАЕТСЯ, и лечит это только перезаход в комнату. Отменить висящий
        //: `getDisplayMedia` со страницы нельзя (у Web API нет ни `AbortSignal`, ни
        //: другого способа), поэтому единственное честное - НЕ делать вид, что тап
        //: что-то начал: назвать причину и дать два выхода, которые правда работают.
        if (kind === 'screen' && !live && SCREEN_HUNG) {
          diag('второй тап при висящем запросе: молчит ' 
               + Math.round((Date.now() - SCREEN_HUNG) / 1000) + ' с - диалог не откроется');
          diagFlush();
          say('Прошлый запрос экрана Telegram так и не закрыл, и новый диалог он уже не '
              + 'откроет. Со страницы отменить его нечем. Два рабочих выхода: перезайти '
              + 'в комнату (кнопка ниже) либо открыть её в браузере.', true);
          showBrowserWay();
          showRejoinWay();
          return;
        }
        var _screen = null;
        if (kind === 'screen' && !live) {
          try {
            _screen = grabScreen();
            // ОТКАЗ ЧЕЛОВЕКА («Отмена» в окне выбора) - НЕ ОШИБКА И НЕ ПАДЕНИЕ СТРАНИЦЫ.
            // Без этого обработчика браузер напишет unhandled rejection в консоль, а мы
            // об отмене узнаем ниже, из `await`.
            _screen.catch(function () {});
          } catch (e) { _screen = Promise.reject(e); }
        }
        btn.disabled = true;
        wakeArm();
        try {
          PUB_BUSY = word;
          if (live) await stopShow(); else await startShow(_screen);
        } catch (e) {
          // СЮДА ПОПАДАТЬ НЕ ДОЛЖНЫ - но если попали, кнопка обязана ожить всё равно.
          say('Не вышло: ' + (e && e.message || e), true);
        } finally {
          // ═══ КНОПКА ВОЗВРАЩАЕТСЯ В СОСТОЯНИЕ, СООТВЕТСТВУЮЩЕЕ `live`, ВСЕГДА ═══
          if (PUB_BUSY === word) PUB_BUSY = '';
          wakeOff();
          paint();
          btn.disabled = false;
        }
      };

      //: ═══ РЕГИСТРИРУЕМСЯ У ЗАПРЕТА ВИДЕО ═══
      //: `stopShow` объявлена ниже по файлу, и это законно: объявления функций всплывают,
      //: а зовётся она уже после сборки. Отдаём именно ЕЁ, а не `stopLocalMedia`: у
      //: показа экрана дорожек две, окно надо убрать, а состояние кнопки - вернуть.
      VID_CTL[kind] = {
        btn: btn,
        isLive: function () { return live; },
        forceOff: function () { return stopShow(); },
      };
    }

    // ЯВНАЯ ОСТАНОВКА ЛОКАЛЬНЫХ ДОРОЖЕК. Ищем среди своих публикаций те, что относятся к
    // этому виду, и зовём stop() на КАЖДОЙ - у показа экрана их две (картинка и звук
    // вкладки), и забытая вторая держит захват.
    function stopLocalMedia(kind) {
      try {
        var pubs = room.localParticipant.trackPublications
                || room.localParticipant.tracks || new Map();
        pubs.forEach(function (pub) {
          var src = String(pub.source || '');
          var mine = (kind === 'screen')
            ? (src.indexOf('screen') >= 0)
            : (src === 'camera');
          if (!mine || !pub.track) return;
          try { pub.track.stop(); } catch (e) {}
          var ms = pub.track.mediaStreamTrack;
          if (ms) { try { ms.stop(); } catch (e) {} }
        });
      } catch (e) {}
    }

    toggler(showBtn, 'screen', '🖥', 'Экран');
    toggler(camBtn, 'camera', '📷', 'Камера');

    // ═══ ЗАПРЕТ ВИДЕО НА ЭКРАНЕ: ПРИЧИНА НАЗЫВАЕТСЯ, А НЕ ГАСИТСЯ МОЛЧА (закон №36) ═══
    // Исчезнувшая кнопка читается как «функции нет», серая без объяснения - как поломка.
    // Поэтому кнопка ОСТАЁТСЯ на месте, гаснет, и рядом стоит строка с причиной.
    // АДМИНОВ ЗАПРЕТ НЕ КАСАЕТСЯ, И ЭТО НЕ ПРИВИЛЕГИЯ: самая частая причина его поставить
    // - «я показываю, остальные отвлекают», и запретить заодно себе значило бы выключить
    // ровно тот доклад, ради которого запрет и ставили. Сервер закрывает права ТЕМ ЖЕ
    // списком (`keep=adm`), то есть экран и права не расходятся.
    vlockPaint = function () {
      var off = vlockOn && !iAmAdm;
      ['screen', 'camera'].forEach(function (k) {
        var c = VID_CTL[k];
        if (!c || !c.btn) return;
        // ВОЗВРАЩАЕМ ТОЛЬКО ТО, ЧТО ГАСИЛИ САМИ. Голое `disabled = off` оживило бы кнопку
        // посреди чужой операции: переключатель держит её серой всё время публикации, и
        // мы бы отменили эту защиту, ничего о ней не зная (тот же приём, что у реестра
        // посаженных дорожек в замере приёма).
        if (off) { c.btn.disabled = true; c.btn.dataset.vlk = '1'; }
        else if (c.btn.dataset.vlk === '1') {
          c.btn.disabled = false;
          delete c.btn.dataset.vlk;
        }
      });
      if (off) {
        // ═══ СЕРВЕР ПОГАСИЛ ПЕРЕДАЧУ, А ЗАХВАТ ОСТАЛСЯ БЫ ЖИТЬ ═══
        // `MutePublishedTrack` снимает публикацию, но камера у человека продолжала бы
        // гореть, а над экраном висеть «идёт доступ к экрану» - система говорила бы одно,
        // а комната видела другое. Гасим СВОЕЙ ЖЕ дверью, чтобы кнопка и окно пришли в
        // согласие с фактом.
        ['screen', 'camera'].forEach(function (k) {
          var c = VID_CTL[k];
          if (!c || !c.isLive()) return;
          try { Promise.resolve(c.forceOff()).catch(function () {}); } catch (e) {}
        });
      }
      $('vlockwhy').textContent = !vlockOn ? ''
        : (iAmAdm
           ? 'Запрет видео включён: камеры и показ экрана выключены у всех, кроме '
             + 'админов. Снять - кнопкой «Разрешить видео снова» в твоей карточке.'
           : 'Админ запретил видео: включить камеру или показ экрана сейчас нельзя. '
             + 'Смотреть чужое видео при этом можно.');
    };
    // ПЕРВАЯ ОТРИСОВКА ЗДЕСЬ, А НЕ ТОЛЬКО ПО СОБЫТИЮ: метаданные с запретом приезжают
    // ВМЕСТЕ С ВХОДОМ, то есть `showRec` мог отработать РАНЬШЕ этой строки - и вошедший
    // при живом запрете увидел бы обычные кнопки. Тот же порядок уже стоил круга у
    // подписи записи (закон №35: смотрим на состояние, а не на порядок строк).
    vlockPaint();

    // ═══ РУКА И ОЧЕРЕДЬ СЛОВА - ПО КАНАЛУ ДАННЫХ LIVEKIT ═══
    // Он идёт по тому же соединению, что звук: это на порядок быстрее опроса нашего ящика
    // раз в 1.2-3 секунды, и ради трёх кнопок второй транспорт заводить незачем.
    var handUp = false;
    function send(obj) {
      try {
        room.localParticipant.publishData(
          new TextEncoder().encode(JSON.stringify(obj)), { reliable: true });
      } catch (e) {}
    }
    // ═══ СТАТУС «ОТОШЁЛ» ПОЛУЧАЕТ СВОЙ КАНАЛ ЗДЕСЬ, ГДЕ ЖИВЁТ `send` ═══
    // Дверь объявлена НАВЕРХУ (её зовут `micSet` и кнопка), а отправка - тут: объявить её
    // снаружи значило бы звать `send` из области, где его нет, - ровно тот класс, который
    // на этом файле уже четырежды уносил половину страницы молчаливым ReferenceError.
    awaySend = function () {
      upsert(room.localParticipant.identity, { away: awayOn });
      send({ t: 'away', on: awayOn });
    };
    $('away').onclick = function () {
      awaySet(!awayOn, awayOn ? 'Ты снова на связи - метка снята у всех.'
                              : 'Отметил: ты отошёл. Соседи это видят и не ждут ответа. '
                                + 'Снимется само, как только включишь микрофон.');
    };
    // ПОСЛЕ RELOAD СТАТУС ВОССТАНОВЛЕН ИЗ ПАМЯТИ, НО КОМНАТА О НЁМ ЕЩЁ НЕ ЗНАЕТ:
    // канал данных не хранит ничего, и молчание тут читалось бы как «вернулся».
    if (awayOn) awaySend();
    awayPaint();

    $('hand').onclick = function () {
      handUp = !handUp;
      $('hand').classList.toggle('on', handUp);
      $('hand').textContent = handUp ? '✋ Опустить руку' : '✋ Поднять руку';
      upsert(room.localParticipant.identity, { hand: handUp ? Date.now() : 0 });
      send({ t: 'hand', up: handUp });
    };
    // ЗАГЛУШИТЬ ВСЕХ - ПРОСЬБА, А НЕ ПРИКАЗ, И ЭТО СКАЗАНО ЧЕСТНО. Серверного «замолчи»
    // мы не шлём: для него нужен админский грант у каждого, а это право выключать чужой
    // микрофон кому угодно. Клиенты глушат СЕБЯ сами; тот, кто не захочет, останется
    // слышен - для лекции этого достаточно, для принуждения нет.
    $('hush').style.display = '';
    $('hush').onclick = function () { send({ t: 'hush' }); say('Попросил всех приглушиться.'); };

    //: КАК НАС ЗОВУТ ДЛЯ ОСТАЛЬНЫХ. В `people` мы записаны словом «Ты» - его нельзя ни
    //: рассылать, ни ставить в подпись таймера: у соседа «поставил Ты» не значит ничего.
    function myLabel() {
      return human(room.localParticipant.name, room.localParticipant.identity);
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // Часы у телефонов расходятся на минуты, и абсолютная метка показала бы одному

    // пятиминутного таймера не значит ничего.
    var tmrEnd = 0, tmrBy = '', tmrTick = null, tmrFired = false;

    function stopTmrLoop() { if (tmrTick) { clearInterval(tmrTick); tmrTick = null; } }

    // ═══ ОДИН МЕХАНИЗМ «ДОГНАТЬ ВОШЕДШЕГО ПОЗЖЕ» НА ВСЁ ОБЩЕЕ СОСТОЯНИЕ ═══
    // Канал данных доставляет ТОЛЬКО тем, кто уже в комнате. Значит у каждого общего

    // человек, у которого «у всех график BTC, а у меня пусто» (закон №40).
    var BEAT_MS = 5000;
    var beats = {};
    function beat(key, fn) {
        stopBeat(key);
        if (!fn) return;
        beats[key] = setInterval(function () {
            var m = fn();
            if (m) send(m); else stopBeat(key);
        }, BEAT_MS);
    }
    function stopBeat(key) {
        if (key === undefined) {                 // без имени - погасить всё (выход/сброс)
            Object.keys(beats).forEach(stopBeat);
            return;
        }
        if (beats[key]) { clearInterval(beats[key]); delete beats[key]; }
    }
    function tmrMenu(on) { $('tmrset').style.display = on ? '' : 'none'; }

    function tmrPaint() {
      var bar = $('tmrbar');
      if (!tmrEnd) { bar.style.display = 'none'; bar.className = 'tmr'; return; }
      var left = Math.max(0, Math.round((tmrEnd - Date.now()) / 1000));
      bar.style.display = '';
      if (left > 0) {
        bar.className = 'tmr';
        bar.textContent = '⏱ ' + Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2)
          + (tmrBy ? ' · поставил ' + tmrBy : '');
        return;
      }
      bar.className = 'tmr fin';
      bar.textContent = '⏱ Время вышло' + (tmrBy ? ' · таймер ' + tmrBy : '');
      if (tmrFired) return;
      tmrFired = true;
      stopTmrLoop();
      stopBeat('tmr');
      $('tmr').classList.remove('on');
      // У КОНЦА ТАЙМЕРА ДВА НЕЗАВИСИМЫХ СПОСОБА ДОЙТИ. Звук может не сыграть вовсе -

      setTimeout(function () {
        if (!tmrFired) return;
        tmrEnd = 0;
        tmrPaint();
      }, 15000);

    //: mine=true - таймер ставим МЫ, значит на нас же сердцебиение.
    function tmrSet(sec, by, mine) {
      stopTmrLoop();
      stopBeat('tmr');
      tmrFired = false;
      if (!(sec > 0)) {                       // ноль и меньше - снятие
        tmrEnd = 0;
        tmrBy = '';
        $('tmr').classList.remove('on');
        tmrPaint();
        return;

      // СЕРДЦЕБИЕНИЕ - РАДИ ВОШЕДШИХ ПОЗЖЕ. Канал данных доставляет только тем, кто уже в

      // ЧЕСТНАЯ ГРАНИЦА: уйдёт поставивший - повтор прекратится, но у тех, кто уже
      // получил остаток, таймер досчитает и прозвонит сам; не увидят его только те, кто
      // войдёт ПОСЛЕ его ухода.
      beat('tmr', function () {
        var left = Math.round((tmrEnd - Date.now()) / 1000);
        if (left <= 0) return null;              // вернул null - повтор гасится сам
        return { t: 'tmr', left: left, by: myLabel() };
      });
    }

    var SYMS = [['BTC', 'BINANCE:BTCUSDT'], ['ETH', 'BINANCE:ETHUSDT'],

    //: ═══ ЧТО ИМЕННО ПОКАЗАНО КОМНАТЕ: ВИДЖЕТ - ОБЩИЙ, КАК И СИМВОЛ ═══
    //: Локальным его делать нельзя: смысл общего холста в том, что все смотрят ОДНО и

    //: смениться в любой день, а узнаем мы об этом от человека. Не загрузилось за

    var DL_EMBED = 'https://defillama.com/chart/{p}?theme=dark';
    var WIDGETS = {

      dl: { nm: '🦙 DefiLlama', kind: 'frame', find: true,

            //: хуже отсутствия виджета». Теперь форма известна ФАКТОМ, а не выведена.
            //: ТИП (protocol/chain/…) НАХОДИТ БОТ по человеческому слову через их
