        var host = $('showhint');
        if (!host) { dropRetry(stream, ''); return false; }
        if (!_retryBtn) {
          _retryBtn = document.createElement('button');
          _retryBtn.id = 'showretry';       //: чтобы реестр переключателей её ВИДЕЛ
          _retryBtn.className = 'wide';
          host.appendChild(_retryBtn);
        }
        _retryBtn.textContent = '🔁 Повторить показ (окно уже выбрано)';
        _retryBtn.style.display = '';
        _retryBtn.onclick = async function () {
          _retryBtn.style.display = 'none';
          clearTimeout(_retryTimer); _retryTimer = null;
          diagStart('показ-повтор');
          diag('повтор тем же потоком: ' + trackWord(vt) + ' · ' + roomWord());
          btn.disabled = true; wakeArm();
          try {
            PUB_BUSY = word;
            await startShow(Promise.resolve(stream), true);
          } finally {
            if (PUB_BUSY === word) PUB_BUSY = '';
            wakeOff(); paint(); btn.disabled = false;
          }
        };
        clearTimeout(_retryTimer);
        _retryTimer = setTimeout(function () {
          dropRetry(stream, 'Отпустил экран - он висел выбранным, но не показанным. '
                          + 'Нажми «Экран» ещё раз, окно придётся выбрать заново.');
        }, RETRY_KEEP_MS);
        return true;
      }

      //: `again` - ПОВТОР УЖЕ ВЗЯТЫМ ПОТОКОМ: окно выбрано, диалога не будет, и ждать его
      //: (вместе со всей веткой отмены) значило бы ждать того, чего не случится.
      async function startShow(gotStream, again) {
        var lost = false, pub = null;
        // ═══ ПОКАЗ УЖЕ ИДЁТ - ГОВОРИМ ЭТО, А НЕ МОЛЧИМ ═══
        // Живой случай 29.08: человек открыл комнату с двух своих клиентов, показ пошёл с
        // первого, а попытка со второго не дала НИЧЕГО - ни картинки, ни отказа. Что там
        // отвечает SFU, из кода не установить (закон №48), но молчание - худший исход в
        // любом случае: человек жмёт кнопку и не знает, сломано у него или занято.
        // Смотрим на ФАКТ комнаты: если картинка такого рода уже идёт, называем чью.
        if (kind === 'screen') {
          var busy = '';
          try {
            vids.forEach(function (r) {
              if (busy || r.el.dataset.me === '1') return;
              busy = (r.el.dataset.nm || r.el.dataset.pid || 'кто-то');
            });
          } catch (e) {}
          if (busy) {
            say('Экран уже показывает ' + busy + '. Если это твой второй вход - показ идёт '
                + 'в том окне, и с этого он не начнётся: комната пускает по одной картинке '
                + 'от участника.', true);
          }
        }
        var stream = null;
        //: ═══ ПОВТОР ИДЁТ МИМО ДИАЛОГА: ЕГО УЖЕ ПРОШЛИ ═══
        //: Без этой ветки повтор снова ждал бы окно выбора шестьдесят секунд и сдался бы
        //: «диалог не открылся» - про диалог, которого мы и не просили.
        if (kind === 'screen' && again) {
          try { stream = await gotStream; } catch (e) { stream = null; }
          if (!stream) { say('Поток потерялся - нажми «Экран» ещё раз.', true); return; }
          showStage('поток получен (повтор): дорожек '
                    + (stream.getTracks ? stream.getTracks().length : '?'));
        } else if (kind === 'screen') {
          showStage('запросил экран');
          // МЯГКАЯ ПОДСКАЗКА НИЧЕГО НЕ ОТМЕНЯЕТ: она отвечает на вопрос «а оно вообще
          // работает?», который человек задаёт себе на седьмой секунде тишины.
          var _hint = setTimeout(function () {
            if (live) return;
            //: ═══ НА СЕДЬМОЙ СЕКУНДЕ ВЫХОД СТАНОВИТСЯ ВИДЕН, А ПОПЫТКА ИДЁТ ДАЛЬШЕ ═══
            //: ЗАМЕР REN 03.09: удачная попытка укладывается в 3-5 с (браузер 4053 мс,
            //: вебвью 3647 и 4852 мс). Значит после семи секунд ждать нечего - но и
            //: ПРЕРЫВАТЬ нечего: отменить `getDisplayMedia` нам всё равно нечем, а поток
            //: может доехать. Поэтому попытку не трогаем, а рядом кладём рабочий выход:
            //: доедет - работаем в Telegram, не доедет - человек уже не заперт.
            //: ДВАДЦАТЬ СЕКУНД МОЛЧАНИЯ И БЫЛИ ЖАЛОБОЙ: экраном делятся постоянно, и
            //: неизвестность на каждой попытке дороже самой неудачи.
            say('Обычно окно выбора появляется за 3-5 секунд. Здесь не появилось - '
                + 'попытку не прерываю, она ещё может дойти. Рядом кнопка открыть '
                + 'комнату в браузере: там показ экрана работает всегда.', true);
            showBrowserWay();
          }, SCREEN_HINT_MS);
          var _late = false, _quit = false;
          // ПОКА ЖДЁМ ДИАЛОГ, КНОПКА ЖИВА И НАЗЫВАЕТ, ЧТО СДЕЛАЕТ ТАП.
          btn.disabled = false;
          barLabel(btn, '✖️', 'Отменить');
          //: СТОРОЖ КНОПКИ СНЯТ НА ВРЕМЯ РАЗДУМЬЯ ЧЕЛОВЕКА - см. `wakeArm`. Здесь ждём
          //: НЕ клиента, а его, и выход у него есть: та же кнопка, подписанная «Отменить».
          wakeOff();
          try {
            stream = await Promise.race([gotStream, new Promise(function (_, rej) {
              pickAbort = function () {
                _quit = true;
                rej(new Error('ожидание окна выбора отменено'));
              };
              setTimeout(function () {
                _late = true;
                rej(new Error('окно выбора экрана так и не открылось'));
              }, SCREEN_PICK_MS);
            })]);
            pickAbort = null; btn.disabled = true; paint();
            clearTimeout(_hint);
            //: ОКНО ВЫБРАНО - НАЧАЛАСЬ НАША РАБОТА, ЗАВОДИМ ЧАСЫ ЗАНОВО.
            wakeArm();
            showStage('поток получен: дорожек ' + (stream.getTracks ? stream.getTracks().length : '?'));
          } catch (e) {
            pickAbort = null; btn.disabled = true;
            clearTimeout(_hint);
            live = false;
            // ПОТОК, ПРИШЕДШИЙ ПОЗЖЕ НАШЕЙ СДАЧИ, ГАСИМ - НО ТОЛЬКО КОГДА ОН ПРАВДА
            // ПРИШЁЛ. Прежняя редакция гасила его в общем `catch`, то есть могла убить
            // ЖИВОЙ захват, публикация которого ещё шла (подозрение Ren - верное).
            try {
              gotStream.then(function (st) {
                try { st.getTracks().forEach(function (t) { t.stop(); }); } catch (e2) {}
              }, function () {});
            } catch (e3) {}
            var _cancel = (e && (e.name === 'NotAllowedError' || e.name === 'AbortError'));
            //: ═══ ОТКАЗ УЛЕТАЕТ В ЛОГ ТОЖЕ, И ЭТО ГЛАВНАЯ ПОЛОВИНА ═══
            //: Отправлять только успех значило бы собрать ленту ровно про те прогоны,
            //: которые и так работают, - охрана пустоты в самой диагностике. Причина
            //: НАЗЫВАЕТСЯ словом, а не именем исключения: «человек нажал Отмену»,
            //: «диалог не открылся за минуту» и «браузер отказал» - три разные починки.
            diag('окно выбора не дало потока: ' + (_quit ? 'отменено тапом'
                 : _cancel ? 'человек закрыл окно выбора'
                 : _late ? 'диалог не открылся за ' + Math.round(SCREEN_PICK_MS / 1000) + ' с'
                 : ((e && e.name || 'ошибка') + ': ' + (e && e.message || e)))
                 + ' · ' + roomWord());
            diagFlush();
            //: ═══ МЫ СДАЛИСЬ, А ВЫЗОВ ОСТАЛСЯ ВИСЕТЬ - ЭТО НАДО ПОМНИТЬ ═══
            //: И потолок, и тап по «Отменить» отпускают НАШЕ ОЖИДАНИЕ; сам
            //: `getDisplayMedia` продолжает числиться у вебвью незакрытым, и следующий
            //: тап диалога уже не откроет (живой сценарий Ren, шаг 4). Отменить его
            //: нечем - у Web API такой двери нет вовсе, - но молчать об этом значит
            //: оставить человека тыкать в мёртвую кнопку до перезахода.
            //: МЕТКУ СТАВИМ, ТОЛЬКО ЕСЛИ ВЫЗОВ ПРАВДА ЕЩЁ ЖИВ: отказ самого браузера
            //: (`_cancel`) означает, что он вызов ЗАВЕРШИЛ, и запирать после него нечего.
            if (_quit || _late) { SCREEN_HUNG = Date.now(); }
            if (_quit) {
              say('Отменил ожидание. Сам запрос экрана Telegram не отпускает: отменить '
                  + 'его со страницы нечем. Следующий тап скажет, что делать.', true);
              return;
            }
            if (_cancel) { say('Показ отменён - окно не выбрано.', true); return; }
            if (_late) { sayNoPicker(); return; }
            say('Экран взять не вышло (' + (e && e.name || 'ошибка') + '): '
                + (e && e.message || e), true);
            return;
          }
        }
        try {
          pub = (kind === 'screen')
            // ═══ ПОТОК УЖЕ У НАС В РУКАХ - ПУБЛИКУЕМ ЕГО, А НЕ ПРОСИМ SDK СХОДИТЬ ЗА НИМ
            // Почему так, см. `grabScreen` выше: `setScreenShareEnabled` внутри себя
            // ЖДЁТ незавершённую публикацию и только потом зовёт `getDisplayMedia` - а
            // после ожидания жеста человека уже нет, и запрос экрана не резолвится и не
            // реджектится. `publishTrack` ничего не захватывает и жеста не требует.
            ? publishScreen(stream)
            : room.localParticipant.setCameraEnabled(true);
          if (kind === 'screen') showStage('публикую дорожки');
          await Promise.race([pub, new Promise(function (_, rej) {
            setTimeout(function () {
              lost = true;
              // НИ СЛОВА О ПРИЧИНЕ: мы её не знаем. ПРЕЖНЯЯ РЕДАКЦИЯ УТВЕРЖДАЛА «старый
              // токен без права показа: у нас не выложен Worker» - и это было ЗАВЕДОМО
              // ЛОЖНО, потому что кнопка вообще показывается ТОЛЬКО когда в гранте есть
              // нужный источник (см. `grantOf` выше). То есть единственное, что мы к
              // этому моменту проверили, подсказка и отрицала.
              rej(new Error('за ' + Math.round(PUB_WATCHDOG_MS / 1000)
                            + ' с не пришло ни подтверждения, ни отказа (свои потолки у '
                            + 'клиента - 10 и 15 с, значит встало не на них)'));
            }, PUB_WATCHDOG_MS);
          })]);
          live = true; say('');
          //: ПОЛУЧИЛОСЬ - ПРЕДЛОЖЕНИЕ ПОВТОРА УБИРАЕМ, НО ПОТОК НЕ ТРОГАЕМ: он теперь
          //: публикуется, и `dropRetry` погасил бы ровно то, что сейчас видят соседи.
          clearTimeout(_retryTimer); _retryTimer = null;
          if (_retryBtn) _retryBtn.style.display = 'none';
          if (kind === 'screen') showStage('опубликовано');
        } catch (e) {
          //: ПУБЛИКАЦИЯ НЕ СОСТОЯЛАСЬ - ЭТО ТОТ САМЫЙ ПРОМЕЖУТОК, РАДИ КОТОРОГО ЛЕНТА И
          //: ЗАВЕДЕНА. `lost` отличает «сдались по нашему сторожу, операция ещё идёт» от
          //: «SDK честно отказал», и это разные починки: первое - очередь или негоциация,
          //: второе - права, кодек, состояние соединения.
          try {
            diag((lost ? 'СТОРОЖ: публикация не ответила' : 'публикация отказала') + ': '
                 + (e && e.name || 'ошибка') + ': ' + (e && e.message || e)
                 + ' · ' + roomWord());
            diagFlush();
          } catch (e8) {}
          if (lost) {
            // ОПЕРАЦИЯ ВСЁ ЕЩЁ ИДЁТ ВНУТРИ SDK. Просим ЕГО ЖЕ её свернуть - тем самым
            // методом, которым включали: только он умеет снять состояние «публикуется».
            // НО ЖДЁМ ОГРАНИЧЕННО: этот вызов встаёт в очередь ЗА висящей операцией и
            // виснет вместе с ней, а мы после него обязаны вернуть человеку кнопку.
            // Именно здесь и залипало (живой отказ Ren 30.08).
            // ═══ СТОРОЖ ПОЗДНЕЙ ПУБЛИКАЦИИ ВЗВОДИТСЯ ДО ОЖИДАНИЯ, А НЕ ПОСЛЕ ═══
            // ПОРЯДОК ЗДЕСЬ - ЧАСТЬ ПРАВИЛА, И ПРЕЖНИЙ БЫЛ НЕВЕРЕН. `sdkOff(4000)` ждёт
            // до четырёх секунд, и публикация может доехать РОВНО В ЭТО ОКНО: обработчик,
            // навешенный после, к тому моменту ещё не существует. Промис при этом уже
            // разрешён, и `.then` на нём сработает - но на четыре секунды позже, а всё
            // это время соседи видят картинку, которую человек считает выключенной.
            // Взводим первым: `.then` на ещё не разрешённом промисе ничего не стоит.
            try {
              pub.then(function () {
                if (live) return;
                try { stopLocalMedia(kind); } catch (e3) {}
                try { sdkOff(); } catch (e3) {}
                say('Дорожка доехала уже после отказа - снял её. Попробуй ещё раз.', true);
              }, function () {});
            } catch (e4) {}
            // ОПЕРАЦИЯ ВСЁ ЕЩЁ ИДЁТ ВНУТРИ SDK. Просим ЕГО ЖЕ её свернуть - тем самым
            // методом, которым включали: только он умеет снять состояние «публикуется».
            try { await sdkOff(4000); } catch (e2) {}
          }
          stopLocalMedia(kind);          // чтобы неудача не оставила захват висеть
          // ═══ ВЗЯТЫЙ ПОТОК ГАСИМ, ТОЛЬКО КОГДА ПОВТОРЯТЬ ИМ БОЛЬШЕ НЕЧЕГО ═══
          // ПОДОЗРЕНИЕ REN БЫЛО ВЕРНЫМ: на пути СТОРОЖА (`lost`) публикация ещё ИДЁТ и
          // может доехать, а мы уже гасили дорожку - то есть сами убивали живой захват и
          // делали повторную попытку заведомо бессмысленной.
          // ТЕПЕРЬ ШИРЕ: поток, который ещё жив, - это ВЫБРАННОЕ ОКНО, и выбрасывать его
          // значит отправить человека во второй раз туда, где половина попыток и теряется
          // (требование Ren, 6-й заход). Держим и предлагаем повтор; не пригодился -
          // отпускаем сами и ГОВОРИМ об этом (см. `offerShowRetry`).
          var _kept = false;
          if (kind === 'screen' && stream) {
            try { _kept = offerShowRetry(stream); } catch (e5) { _kept = false; }
          }
          if (!_kept && !lost && stream && stream.getTracks) {
            try { stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e5) {} }); }
            catch (e6) {}
          }
          live = false;
          // ═══ ОТКАЗ НАЗЫВАЕТ ИЗВЕСТНЫЙ ВЫХОД, А НЕ ТОЛЬКО ИМЯ ОШИБКИ ═══
          // Про сочетание «камера включена + показ экрана» у нас есть ЖИВОЙ ФАКТ: на
          // свежем заходе всё работает, после камеры - нет (два прогона Ren). Почему
          // так у платформы, из кода не установить (закон №48), но выход мы знаем, и
          // молчать о нём значит оставить человека перед именем исключения.
          var _camOn2 = false;
          try {
            _camOn2 = !!(kind === 'screen' && document.getElementById('cam')
                         && document.getElementById('cam').classList.contains('on'));
          } catch (e7) {}
          say('Показать не вышло (' + (e && e.name || 'ошибка') + '): '
              + (e && e.message || e)
              + (_camOn2 ? ' Похоже на сочетание с камерой: выключи её и нажми «Экран» '
                         + 'ещё раз, либо открой комнату в браузере - там показ работает.'
                         : ''), true);
          if (_camOn2) showBrowserWay();
          // ═══ ВОЗВРАЩАЕМ ДВИЖОК, А НЕ ТОЛЬКО ПОКАЗЫВАЕМ ОШИБКУ ═══
          // Требование Ren по живому прогону: после неудачи и экран, и камера обязаны
          // включаться без перезахода. Ждём ФАКТА `room.state === 'connected'`, а не
          // «мы позвали и надеемся» (закон №35); не вернулось - даём кнопку.
          watchEngine('Показать не вышло, и соединение ушло в переподключение.');
        }
      }

      btn.onclick = async function () {
        // ДВА ОДНОВРЕМЕННЫХ ВЫЗОВА ОДНОГО ИСТОЧНИКА - ВТОРОЙ ИСТОЧНИК ТОЙ ЖЕ ОШИБКИ.
        // livekit-client ждёт незавершённую операцию и падает «waiting for pending
        // publication promise timed out»; нетерпеливый двойной тап по «Показать экран»
        // воспроизводит это без всякого таймаута.
        // ═══ ТАП ВО ВРЕМЯ ОЖИДАНИЯ ОКНА ВЫБОРА - ЭТО ОТМЕНА, А НЕ МЁРТВАЯ КНОПКА ═══
        // Пока мы ждём диалог, кнопка ЖИВА и подписана «Отменить»: человек, у которого
        // диалог не открылся, не должен сидеть перед серой кнопкой и гадать. Живой отказ
        // Ren 31.08 был ровно про это ощущение («кнопка залипает»).
        if (pickAbort) { pickAbort(); return; }
        if (btn.disabled) return;
        // ═══ СВОЯ ПУБЛИКАЦИЯ ЕЩЁ В ПОЛЁТЕ - НЕ СТАКАЕМ ВТОРУЮ ═══
        // Это и есть исходный механизм: у SDK публикация сериализуется на участника, и
        // вторая операция ждёт первую. Мы эти операции сами и запускаем, значит гадать не
        // нужно - знаем точно. Молча встать в очередь значило бы повторить ту же западню.
        if (PUB_BUSY && PUB_BUSY !== word) {
          say('Сейчас включается ' + PUB_BUSY.toLowerCase() + ' - дождись и нажми «'
              + word + '» ещё раз. Два включения разом клиент не тянет: второе встаёт в '
              + 'очередь за первым и может не дождаться.'
              + (PUB_BUSY === 'Микрофон'
                 ? ' Микрофон включается сам при входе; если он застрял, помогает '
                   + 'перезаход в комнату.' : ''), true);
          return;
        }
        // ═══ ЗАПРОС ЭКРАНА - ПЕРВОЕ ДЕЙСТВИЕ ТАПА, ДО ЕДИНОГО `await` ═══
        // Жест человека живёт ровно до первого ожидания (см. `grabScreen`). Здесь мы ещё
        // ВНУТРИ жеста, поэтому берём поток сами; всё остальное - `btn.disabled`,
        // таймеры, ожидания SDK - идёт ПОСЛЕ. Порядок этих двух строк и есть починка:
        // поменяй их местами, и «камера -> экран» снова повиснет молча.
        //: ═══ ПРЕДЫДУЩИЙ ЗАПРОС ЭКРАНА ЕЩЁ ВИСИТ - ВТОРОЙ ТАП В ТУ ЖЕ ТИШИНУ НЕ ИДЁТ
        //: ЖИВОЙ СЦЕНАРИЙ REN, шаги 4-5: после повисшего вызова диалог больше НЕ
        //: ОТКРЫВАЕТСЯ, и лечит это только перезаход в комнату. Отменить висящий
        //: `getDisplayMedia` со страницы нельзя (у Web API нет ни `AbortSignal`, ни
        //: другого способа), поэтому единственное честное - НЕ делать вид, что тап
        //: что-то начал: назвать причину и дать два выхода, которые правда работают.
        if (kind === 'screen' && !live && SCREEN_HUNG) {
          diag('второй тап при висящем запросе: молчит ' 
               + Math.round((Date.now() - SCREEN_HUNG) / 1000) + ' с - диалог не откроется');
          diagFlush();
          say('Прошлый запрос экрана Telegram так и не закрыл, и новый диалог он уже не '
              + 'откроет. Со страницы отменить его нечем. Два рабочих выхода: перезайти '
              + 'в комнату (кнопка ниже) либо открыть её в браузере.', true);
          showBrowserWay();
          showRejoinWay();
          return;
        }
        var _screen = null;
        if (kind === 'screen' && !live) {
          try {
            _screen = grabScreen();
            // ОТКАЗ ЧЕЛОВЕКА («Отмена» в окне выбора) - НЕ ОШИБКА И НЕ ПАДЕНИЕ СТРАНИЦЫ.
            // Без этого обработчика браузер напишет unhandled rejection в консоль, а мы
            // об отмене узнаем ниже, из `await`.
            _screen.catch(function () {});
          } catch (e) { _screen = Promise.reject(e); }
        }
        btn.disabled = true;
        wakeArm();
        try {
          PUB_BUSY = word;
          if (live) await stopShow(); else await startShow(_screen);
        } catch (e) {
          // СЮДА ПОПАДАТЬ НЕ ДОЛЖНЫ - но если попали, кнопка обязана ожить всё равно.
          say('Не вышло: ' + (e && e.message || e), true);
        } finally {
          // ═══ КНОПКА ВОЗВРАЩАЕТСЯ В СОСТОЯНИЕ, СООТВЕТСТВУЮЩЕЕ `live`, ВСЕГДА ═══
          if (PUB_BUSY === word) PUB_BUSY = '';
          wakeOff();
          paint();
          btn.disabled = false;
        }
      };
    }

    // ЯВНАЯ ОСТАНОВКА ЛОКАЛЬНЫХ ДОРОЖЕК. Ищем среди своих публикаций те, что относятся к
    // этому виду, и зовём stop() на КАЖДОЙ - у показа экрана их две (картинка и звук
    // вкладки), и забытая вторая держит захват.
    function stopLocalMedia(kind) {
      try {
        var pubs = room.localParticipant.trackPublications
                || room.localParticipant.tracks || new Map();
        pubs.forEach(function (pub) {
          var src = String(pub.source || '');
          var mine = (kind === 'screen')
            ? (src.indexOf('screen') >= 0)
            : (src === 'camera');
          if (!mine || !pub.track) return;
          try { pub.track.stop(); } catch (e) {}
          var ms = pub.track.mediaStreamTrack;
          if (ms) { try { ms.stop(); } catch (e) {} }
        });
      } catch (e) {}
    }

    toggler(showBtn, 'screen', '🖥', 'Экран');
    toggler(camBtn, 'camera', '📷', 'Камера');

    // ═══ РУКА И ОЧЕРЕДЬ СЛОВА - ПО КАНАЛУ ДАННЫХ LIVEKIT ═══
    // Он идёт по тому же соединению, что звук: это на порядок быстрее опроса нашего ящика
    // раз в 1.2-3 секунды, и ради трёх кнопок второй транспорт заводить незачем.
    var handUp = false;
    function send(obj) {
      try {
        room.localParticipant.publishData(
          new TextEncoder().encode(JSON.stringify(obj)), { reliable: true });
      } catch (e) {}
    }
    // ═══ СТАТУС «ОТОШЁЛ» ПОЛУЧАЕТ СВОЙ КАНАЛ ЗДЕСЬ, ГДЕ ЖИВЁТ `send` ═══
    // Дверь объявлена НАВЕРХУ (её зовут `micSet` и кнопка), а отправка - тут: объявить её
    // снаружи значило бы звать `send` из области, где его нет, - ровно тот класс, который
    // на этом файле уже четырежды уносил половину страницы молчаливым ReferenceError.
    awaySend = function () {
      upsert(room.localParticipant.identity, { away: awayOn });
      send({ t: 'away', on: awayOn });
    };
    $('away').onclick = function () {
      awaySet(!awayOn, awayOn ? 'Ты снова на связи - метка снята у всех.'
                              : 'Отметил: ты отошёл. Соседи это видят и не ждут ответа. '
                                + 'Снимется само, как только включишь микрофон.');
    };
    // ПОСЛЕ RELOAD СТАТУС ВОССТАНОВЛЕН ИЗ ПАМЯТИ, НО КОМНАТА О НЁМ ЕЩЁ НЕ ЗНАЕТ:
    // канал данных не хранит ничего, и молчание тут читалось бы как «вернулся».
    if (awayOn) awaySend();
    awayPaint();

    $('hand').onclick = function () {
      handUp = !handUp;
      $('hand').classList.toggle('on', handUp);
      $('hand').textContent = handUp ? '✋ Опустить руку' : '✋ Поднять руку';
      upsert(room.localParticipant.identity, { hand: handUp ? Date.now() : 0 });
      send({ t: 'hand', up: handUp });
    };
    // ЗАГЛУШИТЬ ВСЕХ - ПРОСЬБА, А НЕ ПРИКАЗ, И ЭТО СКАЗАНО ЧЕСТНО. Серверного «замолчи»
    // мы не шлём: для него нужен админский грант у каждого, а это право выключать чужой
    // микрофон кому угодно. Клиенты глушат СЕБЯ сами; тот, кто не захочет, останется
    // слышен - для лекции этого достаточно, для принуждения нет.
    $('hush').style.display = '';
    $('hush').onclick = function () { send({ t: 'hush' }); say('Попросил всех приглушиться.'); };

    //: КАК НАС ЗОВУТ ДЛЯ ОСТАЛЬНЫХ. В `people` мы записаны словом «Ты» - его нельзя ни
    //: рассылать, ни ставить в подпись таймера: у соседа «поставил Ты» не значит ничего.
    function myLabel() {
      return human(room.localParticipant.name, room.localParticipant.identity);
    }
    //: ДВЕРЬ НАРУЖУ ЗАПОЛНЯЕТСЯ ЗДЕСЬ, РЯДОМ С ТЕМ, ЧТО ОНА ОТДАЁТ. Тот же приём, что у
    //: `admDo`: верхний уровень не имеет доступа к области `go()`, а половина кнопок
    //: комнаты живёт именно там.
    roomSend = send;
    roomLabel = myLabel;
    roomAsk = ask;
    //: СПИСОК СЛОТОВ СПРАШИВАЕМ ОДИН РАЗ, ПОСЛЕ ПОДКЛЮЧЕНИЯ. Раньше кнопок нет, потому
    //: что нет двери, - и это честнее пустого ряда, который потом наполнится.
    (function () {
      var b = document.getElementById('slotsave');
      if (b) b.onclick = slotSave;
      slotsPaint();
      if (!freeOk()) return;              // на мобиле слотов нет вовсе - незачем и спрашивать
      ask({ kind: 'rtclay', room: ROOM, act: 'lay_list' }, 'Смотрю сохранённые раскладки…')
        .then(slotsFrom).catch(function () {});
    })();
    function nameOf(p) {
      var rec = people[p.identity];
      return (rec && rec.name && !rec.me) ? rec.name : human(p.name, p.identity);
    }

    // ТЕМП СВОЙ И ЧУЖОЙ СЧИТАЮТСЯ ОТДЕЛЬНО, И ЭТО НЕ ПЕРЕСТРАХОВКА. Свой бережёт соседей
    // от нашей же залипшей кнопки; чужой бережёт НАС от того, у кого она залипла, - и
    // одним счётчиком это не закрыть, потому что у них разные владельцы.
    var lastReact = 0, lastFrom = {};
    function canReact() {
      // ЗАПРЕТ АДМИНА СТОИТ ЗДЕСЬ, В ОДНОЙ ДВЕРИ НА ЭМОДЗИ И ЗВУКИ. Две копии проверки
      // разошлись бы на первой правке, и заглушенный продолжал бы слать что-нибудь одно.
      // ЭТО НЕ ЗАЩИТА, А ЧЕСТНОСТЬ: настоящий запрет исполняют ПОЛУЧАТЕЛИ, здесь мы
      // просто не делаем вид, что кнопка сработала.
      if (iAmFunOff()) { funPaint(); return false; }
      var now = Date.now();
      if (now - lastReact < 600) return false;
      lastReact = now;
      return true;
    }
    function floodOk(id) {
      var now = Date.now();
      if (now - (lastFrom[id] || 0) < 600) return false;
      lastFrom[id] = now;
      return true;
    }

    // ═══ ЭМОДЗИ-РЕАКЦИИ: ТОЛЬКО КАНАЛ ДАННЫХ, НИ БАЙТА ЗВУКА ═══
    // Реакция обязана работать и у того, кто молчит с выключенным микрофоном, и у
    // веб-гостя без Telegram: ящик бота тут не участвует вовсе, поэтому и гейта нет.
    ['👍', '❤️', '😂', '🔥', '🤔', '😮', '🙏', '🎉'].forEach(function (e) {
      var b = document.createElement('button');
      b.className = 'emo';
      b.textContent = e;
      b.onclick = function () {
        if (!canReact()) return;
        popup('Ты  ' + e);
        send({ t: 'react', e: e });
      };
      $('emos').appendChild(b);
    });

    // МАНИФЕСТ СПРАШИВАЕМ ЗДЕСЬ ЖЕ, ГДЕ РИСУЕМ КНОПКИ: рядом с местом, где звук
    // понадобится, и до первого тапа. Без этого вызова файлы на CDN лежали мёртвым
    // грузом, а играл синтез (живой отказ 30.08).
    sndBoot();

    Object.keys(SOUNDS).forEach(function (id) {
      var s = SOUNDS[id];
      var b = document.createElement('button');
      b.className = 'snd';
      b.textContent = s.e + ' ' + s.t;
      b.onclick = function () {
        if (!canReact()) return;
        // ЗВУК ИГРАЕТ И У ОТПРАВИТЕЛЯ. Иначе он не знает, сработала ли кнопка, жмёт
        // второй раз - и у остальных играет дважды.
        playSnd(id);
        popup('Ты  ' + s.e + ' ' + s.t);
        send({ t: 'snd', s: id });
      };
      $('snds').appendChild(b);
    });
    // ГРАНИЦА НАЗЫВАЕТСЯ СРАЗУ: звук идёт каналом данных, а пишется МИКРОФОН. Человек,
    // который «поставил аплодисменты в запись», узнал бы об этом только из транскрипта.
    $('reacthint').textContent = 'Слышат все, кто сейчас в комнате. В запись реакции не '
      + 'попадают: они идут отдельным каналом, а не через микрофон.';

    // ═══════════════════════════════════════════════════════════════════════════════
    // ТАЙМЕР: ПЕРЕДАЁМ ОСТАТОК, А НЕ МОМЕНТ КОНЦА
    // ═══════════════════════════════════════════════════════════════════════════════
    // Часы у телефонов расходятся на минуты, и абсолютная метка показала бы одному
    // «осталось 4:59», другому «время вышло» - причём выглядело бы это как наш баг.
    // Остаток от расхождения часов не зависит вовсе: каждый считает СВОЙ дедлайн от
    // своего же «сейчас», а задержка канала данных (десятки миллисекунд) для
    // пятиминутного таймера не значит ничего.
    var tmrEnd = 0, tmrBy = '', tmrTick = null, tmrFired = false;

    function stopTmrLoop() { if (tmrTick) { clearInterval(tmrTick); tmrTick = null; } }

    // ═══ ОДИН МЕХАНИЗМ «ДОГНАТЬ ВОШЕДШЕГО ПОЗЖЕ» НА ВСЁ ОБЩЕЕ СОСТОЯНИЕ ═══
    // Канал данных доставляет ТОЛЬКО тем, кто уже в комнате. Значит у каждого общего
    // состояния (таймер, график) обязан быть повтор - и это ОДНО правило, а не по копии
    // на фичу: две копии разъехались бы периодом и условием остановки, а заметил бы это
    // человек, у которого «у всех график BTC, а у меня пусто» (закон №40).
    var BEAT_MS = 5000;
    var beats = {};
    function beat(key, fn) {
        stopBeat(key);
        if (!fn) return;
        beats[key] = setInterval(function () {
            var m = fn();
            if (m) send(m); else stopBeat(key);
        }, BEAT_MS);
    }
    function stopBeat(key) {
        if (key === undefined) {                 // без имени - погасить всё (выход/сброс)
            Object.keys(beats).forEach(stopBeat);
            return;
        }
        if (beats[key]) { clearInterval(beats[key]); delete beats[key]; }
    }
    function tmrMenu(on) { $('tmrset').style.display = on ? '' : 'none'; }

    function tmrPaint() {
      var bar = $('tmrbar');
      if (!tmrEnd) { bar.style.display = 'none'; bar.className = 'tmr'; return; }
      var left = Math.max(0, Math.round((tmrEnd - Date.now()) / 1000));
      bar.style.display = '';
      if (left > 0) {
        bar.className = 'tmr';
        bar.textContent = '⏱ ' + Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2)
          + (tmrBy ? ' · поставил ' + tmrBy : '');
        return;
      }
      bar.className = 'tmr fin';
      bar.textContent = '⏱ Время вышло' + (tmrBy ? ' · таймер ' + tmrBy : '');
      if (tmrFired) return;
      tmrFired = true;
      stopTmrLoop();
      stopBeat('tmr');
      $('tmr').classList.remove('on');
      // У КОНЦА ТАЙМЕРА ДВА НЕЗАВИСИМЫХ СПОСОБА ДОЙТИ. Звук может не сыграть вовсе -
      // браузер держит аудио-контекст, пока человек ничего не нажимал, - и тогда
      // единственным сигналом остаётся строка. Полагаться на один было бы обещанием.
      playSnd('gong');
      popup('⏰ Время вышло');
      // СТРОКА ГАСНЕТ САМА, НО НЕ СРАЗУ: тот, кто смотрел в другое окно, обязан успеть
      // её увидеть.
      setTimeout(function () {
        if (!tmrFired) return;
        tmrEnd = 0;
        tmrPaint();
      }, 15000);
    }

    //: mine=true - таймер ставим МЫ, значит на нас же сердцебиение.
    function tmrSet(sec, by, mine) {
      stopTmrLoop();
      stopBeat('tmr');
      tmrFired = false;
      if (!(sec > 0)) {                       // ноль и меньше - снятие
        tmrEnd = 0;
        tmrBy = '';
        $('tmr').classList.remove('on');
        tmrPaint();
        return;
      }
      tmrEnd = Date.now() + sec * 1000;
      tmrBy = by || '';
      $('tmr').classList.add('on');
      tmrTick = setInterval(tmrPaint, 500);
      tmrPaint();
      if (!mine) return;
      // СЕРДЦЕБИЕНИЕ - РАДИ ВОШЕДШИХ ПОЗЖЕ. Канал данных доставляет только тем, кто уже в
      // комнате: без повтора человек, зашедший на второй минуте, не увидел бы таймера
      // ВООБЩЕ (тот же класс, что рассылка признака записи вместо метаданных комнаты).
      // ЧЕСТНАЯ ГРАНИЦА: уйдёт поставивший - повтор прекратится, но у тех, кто уже
      // получил остаток, таймер досчитает и прозвонит сам; не увидят его только те, кто
      // войдёт ПОСЛЕ его ухода.
      beat('tmr', function () {
        var left = Math.round((tmrEnd - Date.now()) / 1000);
        if (left <= 0) return null;              // вернул null - повтор гасится сам
        return { t: 'tmr', left: left, by: myLabel() };
      });
    }

    // ═════════════════════════════════════════════════════════════════════════════
    // ГРАФИК: ОДИН НА КОМНАТУ, МЕНЯЕТ ЛЮБОЙ, И ВИДНО КТО
    // ═════════════════════════════════════════════════════════════════════════════

            // отсюда и бессмысленная ось.
            // ПОЧЕМУ ЭТО ХУЖЕ КРИВОЙ ПОДПИСИ: пара - состояние КОМНАТЫ, оно уезжает всем
            // сердцебиением. Смена внутри виджета ЛОКАЛЬНА и невидима остальным - один
            // человек смотрит на AAVE, все прочие на BTC, и заметить это нечем. Ровно
            // тот класс, ради которого записан закон №40: у одной функции одна дверь.
            // ЧТО ПОТЕРЯЛИ И ЧЕМ ВЕРНУЛИ: индикаторы и сравнение. Сохранять их мы всё
            // равно не умеем (бесплатный embed не отдаёт наружу ни одного объекта -
            // ни `widget`, ни `save()`), поэтому под графиком стоит кнопка открыть эту
            // же пару у TradingView, где есть всё и где это личное дело смотрящего.
            hide_side_toolbar: true, hide_top_toolbar: true, allow_symbol_change: false,
            save_image: false, autosize: true,
          });
          host.appendChild(sc);
        }
      }
      if (!chSym) {
        // ДОСКА ОСТАЁТСЯ - ОНА ПОЛЕЗНА И САМА ПО СЕБЕ. Убрали график, чтобы чертить схему
        // на чистом поле, а не чтобы закрыть панель.
        $('chartwho').textContent = 'Графика нет - чистая доска. Выбери пару, если нужен '
          + 'график: его увидят все, кто в комнате.';
        outBtn('');
        return;
      }
      // ПОДПИСЬ ОБНОВЛЯЕТСЯ ВСЕГДА - ОНА ДЕШЁВАЯ И МЕНЯЕТСЯ ЧАЩЕ ГРАФИКА (кто поставил).
      $('chartwho').textContent = chSym + ' · ' + chTf
        + (chBy ? ' · поставил ' + chBy : '');
      // ИНДИКАТОРЫ И СРАВНЕНИЕ ЖИВУТ У НИХ, И ЭТО ЧЕСТНЕЕ ВТОРОЙ ДВЕРИ ВНУТРИ ВИДЖЕТА:
      // там это ЛИЧНОЕ дело смотрящего и никого не вводит в заблуждение, а внутри нашего
      // общего графика оно молча расходилось с тем, что видят остальные.
      outBtn('🌐 Открыть ' + chSym + ' на TradingView',
             'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(chSym));
    }

    //: ═══ ЧУЖОЙ ВИДЖЕТ: НЕ ЗАГРУЗИЛСЯ - ГОВОРИМ ЭТО, А НЕ ПОКАЗЫВАЕМ ПУСТОТУ ═══
    //: X-Frame-Options двух наших фреймовых доменов ПРОВЕРЕН живьём (замер Ren с прода
    //: 31.08: заголовка нет ни у geckoterminal, ни у embed.polymarket), но полагаться на
    //: это навсегда нельзя: правило у них может смениться в любой день, а мы узнаем об
    //: этом от человека. Поэтому здесь механизм, а не обещание: ждём `load` ограниченное
    //: время и, не дождавшись, НАЗЫВАЕМ причину и даём кнопку открыть у них. Пустой
    //: прямоугольник читается как «комната сломалась», и разбор уходит в нашу сторону.
    var wgtBuilt = '';

    function wgtPaint(box) {
      var w = WIDGETS[wgt];
      var want = wgt + '|' + wgtVal;
      if (!w) { wgt = 'tv'; chBuilt = null; wgtBuilt = ''; return; }
      if (want === wgtBuilt) { wgtWho(); return; }
      wgtBuilt = want;
      chBuilt = null;                     // в коробке чужое - при возврате пересобрать
      var keep = $('draw');               // ДОСКА ЖИВЁТ ПОВЕРХ ЛЮБОГО ВИДЖЕТА
      [].slice.call(box.children).forEach(function (c) {
        if (c !== keep) box.removeChild(c);
      });
      if (w.kind === 'img') {
        var im = document.createElement('img');
        im.style.cssText = 'position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%';
        im.alt = w.nm;
        im.onerror = function () { wgtFail('картинка не загрузилась'); };
        im.src = w.url(wgtVal);
        box.insertBefore(im, keep);
        //: КНОПКА ПЕРЕСТАВЛЯЕТСЯ И ЗДЕСЬ: у ветки картинки свой `return`, и без этого на
        //: экране осталась бы кнопка ПРЕДЫДУЩЕГО виджета, ведущая не туда.
        outBtn('🌐 Открыть ' + (w.nm || 'виджет') + ' в браузере', w.url(wgtVal));
        wgtWho();
        return;
      }
      if (!wgtVal) {
        $('chartwho').textContent = w.nm + ': нечего показывать - нужен '
          + (w.hint || 'адрес');
        return;
      }
      var fr = document.createElement('iframe');
      fr.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
      fr.setAttribute('referrerpolicy', 'no-referrer');
      var done = false;
      fr.onload = function () { done = true; };
      // ЖДЁМ ФАКТ, А НЕ НАДЕЕМСЯ. При запрете во фрейме `onload` у части браузеров
      // приходит на страницу-ошибку, у части не приходит вовсе - поэтому решает ТАЙМЕР,
      // и он же покрывает случай «домен просто не ответил».
      setTimeout(function () {
        if (!done) wgtFail('домен не отдал страницу во фрейм за ' + (WGT_WAIT_MS / 1000) + ' с');
      }, WGT_WAIT_MS);
      //: ═══ СНАЧАЛА В ДОКУМЕНТ, ПОТОМ АДРЕС - ИНАЧЕ ЧУЖОЙ ГРАФИК РИСУЕТСЯ В НОЛЬ ═══
      //: ЖИВОЙ ОТКАЗ REN 02.09: по прямому адресу пула GeckoTerminal карточка с ценой
      //: есть, «Powered by GeckoTerminal» есть, а САМО ПОЛЕ ГРАФИКА пустое. Механизм наш:
      //: `src` ставился ДО `insertBefore`, то есть загрузка начиналась у элемента, которого
      //: в документе ещё нет - у него нет и коробки. Статическая разметка (карточка) потом
      //: спокойно перетекает по месту, а CANVAS, посчитанный при нулевом размере, так
      //: нулевым и остаётся: перерисовать себя ему нечем, событий об изменении размера у
      //: чужой страницы никто не шлёт. `loading="lazy"` тянул туда же и не давал НИЧЕГО:
      //: фрейм рождается только когда человек уже выбрал виджет, откладывать нечего.
      box.insertBefore(fr, keep);
      //: ═══ ВЫХОД В БРАУЗЕР СТОИТ ВСЕГДА, А НЕ ТОЛЬКО ПРИ ОТКАЗЕ ═══
      //: ЖИВОЙ ОТКАЗ REN 03.09: в браузере виджет рисуется целиком, в Telegram WebView на
      //: том же адресе - ЧЁРНЫЙ ПРЯМОУГОЛЬНИК. Мы этого НЕ ВИДИМ и увидеть не можем:
      //: `onload` у фрейма приходит, страница чужая, заглянуть внутрь нам не даёт правило
      //: происхождения. То есть `wgtFail` тут не сработает НИКОГДА - он про «не
      //: загрузилось», а здесь загрузилось и осталось чёрным.
      //: Значит единственный честный ответ - держать выход ПОД РУКОЙ заранее, а не
      //: показывать его по событию, которого не будет.
      outBtn('🌐 Открыть ' + (w.nm || 'виджет') + ' в браузере', w.url(wgtVal));
      var _bx = box.getBoundingClientRect();
      //: РАЗМЕР КОРОБКИ - ФАКТ, А НЕ ДОГАДКА. Ноль здесь означает, что чужой странице
      //: нечего измерять, и следующий разбор начинается с этой строки, а не с их сайта.
      diag('виджет', wgt + ' ' + Math.round(_bx.width) + 'x' + Math.round(_bx.height)
                     + (_bx.width < 2 || _bx.height < 2 ? ' - КОРОБКА ПУСТАЯ' : ''));
      fr.src = w.url(wgtVal);
      wgtWho();
    }

    function wgtWho() {
      var w = WIDGETS[wgt] || {};
      $('chartwho').textContent = (w.nm || wgt) + (wgtVal ? ' · ' + wgtVal : '')
        + (wgtBy ? ' · поставил ' + wgtBy : '');
    }

    // ═══ КНОПКА «ОТКРЫТЬ ОТДЕЛЬНО» - ОДНА ДВЕРЬ НА ДВУХ ВЫЗЫВАЮЩИХ (закон №40) ═══
    // Её зовут отказ чужого виджета и график (индикаторы TradingView живут только у них).
    // Две копии «как показать кнопку и куда она ведёт» разошлись бы на первой правке.
    // ССЫЛКА КНОПКОЙ, А НЕ СОВЕТОМ «СКОПИРУЙ АДРЕС»: адресной строки в Telegram нет.
    function outBtn(label, url) {
      var b = document.getElementById('wgtout');
      if (!b) {
        if (!label) return;             // нечего показывать - нечего и создавать
        b = document.createElement('button');
        b.id = 'wgtout'; b.className = 'wide';
        $('crypto').insertBefore(b, $('syms'));
      }
      if (!label) { b.style.display = 'none'; return; }
      b.textContent = label;
      b.style.display = '';
      b.onclick = function () {
        try { if (tg && tg.openLink) { tg.openLink(url); return; } } catch (e) {}
        try { window.open(url, '_blank'); } catch (e2) {}
      };
    }

    function wgtFail(why) {
      var w = WIDGETS[wgt] || {};
      $('chartwho').textContent = w.nm + ' не открылся: ' + why
        + '. Похоже, у них закрыт показ во фрейме - открой у них и вернись.';
      //: ВТОРОЙ ФОРМУЛИРОВКИ У ОДНОЙ КНОПКИ НЕ ЗАВОДИМ: она уже стоит с момента создания
      //: фрейма и ведёт туда же. Меняющаяся под рукой подпись читается как ДРУГАЯ кнопка.
      outBtn('🌐 Открыть ' + (w.nm || 'виджет') + ' в браузере',
             w.url ? w.url(wgtVal) : '');
    }

    //: ВЫБОР ВИДЖЕТА - ОБЩИЙ НА КОМНАТУ, КАК И СИМВОЛ. Едет тем же каналом данных и тем
    //: же сердцебиением, что график: вошедший позже обязан увидеть то же, что остальные.
    function wgtSet(k, val, by, mine) {
      if (!WIDGETS[k]) return;
      //: ВИДЖЕТ ЗАНИМАЕТ ТУ ЖЕ ПОВЕРХНОСТЬ, ЧТО ГРАФИК, - и правило у них одно.
      if (mine && !maySurface()) { surfDeny(); return; }
      //: ЧИСТКА СТОИТ В ДВЕРИ, А НЕ У КАЖДОГО ВХОДА. Входов два - своя кнопка и чужое
      //: сообщение, - и две копии правила «что считать годным адресом» разошлись бы на
      //: первой правке (закон №40); разошлись бы молча, потому что оба входа продолжали
      //: бы работать.
      var v2 = wgtValOk(val);
      if ((val || '') && !v2) {
        //: ОТБРОШЕННОЕ НАЗЫВАЕТСЯ. Молча вернуть график значит оставить человека в
        //: уверенности, что виджет включён у всех, кроме него.
        say('Адрес «' + cut(val, 120) + '» не похож на путь виджета - не ставлю.', true);
        return;
      }
      var changed = (k !== wgt || v2 !== wgtVal);
      wgt = k; wgtVal = v2; wgtBy = by || '';
      if (changed) { wgtBuilt = ''; chBuilt = null; }
      outBtn('');
      // Панель открывается по тем же правилам, что у графика: явный выбор человека
      // («закрыл руками») и замок сильнее нашего желания показать.
      if (!chOpen && !chShut && !(lockOn && !iAmAdm)) chOpen = true;
      chartPaint();
      if (!mine) return;
      // ═══ СЕРДЦЕБИЕНИЕ ОБЯЗАНО ВОЗВРАЩАТЬ СООБЩЕНИЕ, А НЕ СЛАТЬ ЕГО САМО ═══
      // `beat` устроен так: `var m = fn(); if (m) send(m); else stopBeat(key)`. Колбэк,
      // который шлёт сам и возвращает undefined, отработает РОВНО ОДИН РАЗ и погасит
      // собственный повтор - то есть вошедший позже виджета не увидит, ради чего повтор
      // и заводился. Ошибка тихая: у всех, кто уже в комнате, всё выглядит верно.
      if (wgt === 'tv') {
        // Возврат к графику: повторять нечего - у вошедшего позже TradingView стоит по
        // умолчанию, а состояние пары догоняет своим сердцебиением `chart`.
        stopBeat('wgt');
        send({ t: 'wgt', k: 'tv', v: '', by: myLabel() });
        return;
      }
      beat('wgt', function () {
        return wgt !== 'tv' ? { t: 'wgt', k: wgt, v: wgtVal, by: myLabel() } : null;
      });
      send({ t: 'wgt', k: wgt, v: wgtVal, by: myLabel() });
    }

    function chartSet(sym, tf, by, mine) {
      //: ═══ ПРАВО ПРОВЕРЯЕТСЯ В ДВЕРИ, А НЕ У ЧЕТЫРНАДЦАТИ КНОПОК ═══
      //: Мест, откуда сюда заходят своим тапом, больше десятка (кнопки пар, свой символ,
      //: «убрать»), и гейт по местам вызова однажды забыли бы в одном - а выглядело бы
      //: это как случайно работающий обход. У получателя стоит свой (см. `onData`).
      if (mine && !maySurface()) { surfDeny(); return; }
      // ═══ ПУСТАЯ ПАРА - ЭТО «УБРАТЬ ГРАФИК», А НЕ ПРОМАХ ═══
      // Доска полезна и БЕЗ графика (схему чертят на чистом поле), а обратного пути у
      // выбора пары не было вовсе: выбрал BTC - и живи с ним. Это четвёртая фича подряд,
      // которую можно включить и нельзя выключить, - см. правило про обратный путь.
      if (sym === null) {
        chSym = ''; chBy = by || '';
        chartPaint();
        if (mine) {
          stopBeat('chart');
          send({ t: 'chart', sym: '', tf: chTf, by: myLabel() });
        }
        return;
      }
      var s2 = symOk(sym), t2 = tfOk(tf) || chTf;
      if (sym && !s2) {
        // ОТБРОШЕННОЕ НАЗЫВАЕТСЯ. Молча проигнорировать чужой символ значит оставить
        // соседа в уверенности, что у всех обновилось.
        say('Пара «' + cut(sym, 60) + '» не похожа на тикер - не меняю.', true);
        return;
      }
      chSym = s2; chTf = t2; chBy = by || '';
      // ═══ ЗАМОК РЕШАЕТ СОСТОЯНИЕ, А НЕ ТОЛЬКО ОТРИСОВКУ (живой отказ Ren 30.08) ═══
      // Здесь стояло безусловное «прислали график - открываем панель», и `lockOn` не
      // спрашивали ВООБЩЕ. А тот, кто поставил пару, шлёт `{t:'chart'}` сердцебиением
      // каждые пять секунд, - поэтому у вошедшего позже панель возвращалась сама: закрыл
      // у себя, через пять секунд снова открыта; админ жал «Убрать» второй раз с тем же
      // исходом. Замок, живущий только в `lockPaint`, чинил КАРТИНКУ, пока состояние
      // писали мимо него. Админу панель оставляем - он и отпирает.
      // ═══ ЧУЖОЙ ГРАФИК НЕ РАСПАХИВАЕТ ПАНЕЛЬ ТОМУ, КТО ЕЁ ЗАКРЫЛ (замечание Ren) ═══
      // Панель ЛОКАЛЬНАЯ: её открывает и закрывает каждый у себя. А сюда приходит чужое
      // состояние графика, и прежняя редакция открывала панель ВСЕМ - то есть один
      // человек занимал пол-экрана остальным, и закрыть это было нельзя: сердцебиение
      // идёт раз в пять секунд и открывало её заново.
      // ЯВНЫЙ ВЫБОР ЧЕЛОВЕКА СИЛЬНЕЕ ДЕФОЛТА: не открывал и не закрывал - показываем
      // (иначе поставивший график был бы с ним один); закрыл руками - уважаем.
      if (s2 && !chOpen && !chShut && !(lockOn && !iAmAdm)) chOpen = true;
      chartPaint();
      if (!mine) return;
      beat('chart', function () {
        return chSym ? { t: 'chart', sym: chSym, tf: chTf, by: myLabel() } : null;
      });
      send({ t: 'chart', sym: chSym, tf: chTf, by: myLabel() });
    }

    function paintSymBtns() {
      paintWgtBtns();
      [].slice.call($('syms').children).forEach(function (b) {
        b.classList.toggle('on', !!b.dataset.sym && b.dataset.sym === chSym);
      });
      var off = $('symoff');
      if (off) off.style.display = chSym ? '' : 'none';
      [].slice.call($('tfs').children).forEach(function (b) {
        b.classList.toggle('on', b.dataset.tf === chTf);
      });
    }

    //: ═══ РЯД ВЫБОРА ВИДЖЕТА ═══
    //: Обратный путь у каждого - возврат на «График» (правило №55): виджет, который
    //: можно включить и нельзя выключить, занял бы холст до конца созвона. Поэтому
    //: TradingView стоит В ТОМ ЖЕ ряду обычной кнопкой, а не прячется под «убрать».
    Object.keys(WIDGETS).forEach(function (k) {
      var w = WIDGETS[k];
      //: ВЫКЛЮЧЕННЫЙ ВИДЖЕТ НЕ РИСУЕТСЯ ВОВСЕ, А ПРИЧИНА УХОДИТ В КОНСОЛЬ. Показать его
      //: серым значило бы обещать функцию, которой нет; промолчать совсем - оставить
      //: следующего читателя гадать, куда делась лама.
      if (w.off) { try { console.log('[виджет] ' + k + ' выключен: ' + w.off); } catch (e) {} return; }
      var b = document.createElement('button');
      b.className = 'chip'; b.dataset.wgt = k; b.textContent = w.nm;
      b.onclick = async function () {
        if (k === 'tv') { wgtSet('tv', '', 'Ты', true); return; }
        // Повторный тап по выбранному виджету возвращает график - тот же обратный ход,
        // что у пар, и лежит он там же, где прямой.
        if (wgt === k) { wgtSet('tv', '', 'Ты', true); return; }
        if (!w.hint) { wgtSet(k, '', 'Ты', true); return; }
        //: СПРАШИВАЕМ ПО-ЧЕЛОВЕЧЕСКИ, А ВНУТРЕННИЙ АДРЕС НАХОДИТ БОТ. Тикер и слова
        //: названия - это то, чем человек думает; путь пула и slug рынка - то, чем
        //: думает чужой API. Перевод между ними живёт у бота (`rtc_widget`), потому что
        //: там уже лежит правило «что мы показываем под этим тикером» (закон №40).
        var v = await askText(w.ask || w.nm, w.hint);
        if (!v) return;
        await wgtFind(k, v);
      };
      $('wgts').appendChild(b);
    });

    //: ═══ ПОИСК АДРЕСА: БОТ ИЩЕТ, СТРАНИЦА ПОКАЗЫВАЕТ ═══
    //: ГОТОВЫЙ АДРЕС ПРОПУСКАЕТСЯ МИМО ЧУЖОГО API - НО РЕШАЕТ ЭТО БОТ, а не страница:
    //: у каждого `*_find` быстрая ветка отвечает мгновенно, наружу не ходя. Здесь стояла
    //: ВТОРАЯ копия того же правила, и она разъехалась с первой - разбор ниже.
    //: НЕ ДОСТУЧАЛИСЬ ДО БОТА - СТАВИМ КАК НАПИСАНО И ГОВОРИМ ЭТО. Отказ был бы хуже:
    //: рабочий путь ломается из-за неработающего (тот же довод, что у своего символа).
    async function wgtFind(k, q) {
      var w = WIDGETS[k] || {};
      if (!w.find) { wgtSet(k, q, 'Ты', true); return; }
      //: ═══ «ЭТО УЖЕ ГОТОВЫЙ АДРЕС» РЕШАЕТ БОТ, А НЕ СТРАНИЦА (закон №40) ═══
      //: ЖИВОЙ ОТКАЗ REN 02.09: «PONS» не резолвился ВООБЩЕ, и в `bot.log` не было НИ
      //: ОДНОЙ строки `[rtcwgt]` - сигнал не уходил. Здесь стоял обход `wgtValOk(q)`,
      //: и он отвечал не на тот вопрос: `wgtValOk` это САНИТАЙЗЕР («из этой строки
      //: нельзя выйти в чужой домен»), а обход спрашивал «человек уже назвал путь?».
      //: Слово из букв безопасно, поэтому обход срабатывал на ЛЮБОМ вводе - проверено
      //: исполнением той же регулярки: PONS, aave, ethereum, hyperliquid - все «ДА».
      //: То есть резолвер не запускался НИ РАЗУ с самого его появления.
      //: Правило «готовый путь пропустить мимо чужого API» никуда не делось - оно живёт
      //: У БОТА, в каждом `*_find` отдельной быстрой веткой (`looks_like_address`,
      //: разбор ссылки, `^protocol|chain/`), и там оно отвечает мгновенно, не ходя
      //: наружу. Две копии одного правила разъехались бы - эта уже разъехалась.
      //: `wgtValOk` остаётся ровно тем, чем и был: проверкой ЗНАЧЕНИЯ у получателя.
      if (!roomAsk) {
        //: НЕ ДОСТУЧАЛИСЬ - СТАВИМ КАК НАПИСАНО И ГОВОРИМ ЭТО. Молчаливая постановка
        //: сырого слова адресом и была тем, что человек видел как «не резолвится».
        say('Ещё подключаюсь - ставлю как написано, без поиска.', true);
        wgtSet(k, q, 'Ты', true);
        return;
      }
      var res = await roomAsk({ kind: 'rtcwgt', room: ROOM, w: k, nm2: q }, 'Ищу…');
      if (res && res.v) { wgtSet(k, res.v, 'Ты', true); return; }
      //: НЕСКОЛЬКО ПОПАДАНИЙ - ЭТО ВЫБОР, А НЕ ОТКАЗ (требование Ren). У токена почти
      //: всегда несколько пулов, у события - несколько рынков; отказать значит вернуть
      //: работу человеку, у которого нужных данных нет вовсе.
      if (res && res.picks && res.picks.length) { wgtPick(k, res.picks); return; }
      if (res) return;                    // бот ответил и уже назвал причину
      say('Бот не ответил - ставлю как написано.');
      wgtSet(k, q, 'Ты', true);
    }

    //: ВЫБОР ЖИВЁТ В ТОЙ ЖЕ КАРТОЧКЕ, ЧТО И ВОПРОС: второй экран под список означал бы
    //: третье место, где человек может застрять, и свой обратный путь у каждого.
    function wgtPick(k, picks) {
      var box = $('ask1'), row = $('askrow'), inp = $('askin');
      if (!box || !row) return;
      $('asktitle').textContent = 'Нашёл несколько - выбери:';
      inp.style.display = 'none';
      row.innerHTML = '';
      picks.slice(0, 8).forEach(function (p) {
        var b = document.createElement('button');
        b.className = 'pre';
        b.textContent = p.label || p.v;
        b.onclick = function () { wgtClose(); wgtSet(k, p.v, 'Ты', true); };
        row.appendChild(b);
      });
      var no = document.createElement('button');
      no.className = 'pre'; no.textContent = 'Отмена';
      no.onclick = function () { wgtClose(); };
      row.appendChild(no);
      box.style.display = '';
    }

    //: ВОЗВРАЩАЕМ КАРТОЧКУ В ИСХОДНЫЙ ВИД. Не вернуть - и следующий вопрос («как назвать
    //: слот?») пришёл бы без поля ввода, с чужими кнопками: карточка одна на всех.
    function wgtClose() {
      var box = $('ask1'), row = $('askrow'), inp = $('askin');
      if (!box) return;
      box.style.display = 'none';
      if (inp) inp.style.display = '';
      if (row) {
        row.innerHTML = '';
        ['askok', 'askno'].forEach(function (id, i) {
          var b = document.createElement('button');
          b.id = id; b.className = 'pre';
          b.textContent = i ? 'Отмена' : 'Готово';
          row.appendChild(b);
        });
        askWire();
      }
    }

    function paintWgtBtns() {
      [].slice.call($('wgts').children).forEach(function (b) {
        b.classList.toggle('on', b.dataset.wgt === wgt);
      });
      //: ПАРЫ И ТАЙМФРЕЙМЫ ОТНОСЯТСЯ К ГРАФИКУ И БОЛЬШЕ НИ К ЧЕМУ. Оставь мы их видимыми
      //: под GeckoTerminal - тап по «BTC» молча ничего бы не менял, а это ровно тот
      //: случай, когда кнопка врёт увереннее отсутствующей.
      var tv = (wgt === 'tv');
      $('syms').style.display = tv ? '' : 'none';
      $('tfs').style.display = tv ? '' : 'none';
    }

    SYMS.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = p[0]; b.dataset.sym = p[1];
      // ПОВТОРНЫЙ ТАП ПО ВЫБРАННОЙ ПАРЕ СНИМАЕТ ЕЁ: у выбора обязан быть обратный ход,
      // и он должен лежать там же, где прямой, - иначе его ищут и не находят.
      b.onclick = function () {
        if (chSym === p[1]) chartSet(null, chTf, 'Ты', true);
        else chartSet(p[1], chTf, 'Ты', true);
      };
      $('syms').appendChild(b);
    });
    var bOther = document.createElement('button');
    bOther.className = 'chip'; bOther.textContent = '✏️ Свой символ';
    //: ═══ СИМВОЛ РЕЗОЛВИТ БОТ, А НЕ СТРАНИЦА ═══
    //: Прежняя редакция брала строку человека и совала её в виджет как есть: «pepe» и
    //: «$PEPE» превращались в мёртвый график, а «ake» - в чужую монету. Правило «что
    //: человек имел в виду под этим тикером» у нас УЖЕ ЕСТЬ и оно точное (`pick_coin`
    //: с приоритетом по капе, `_try_stock` для акций), и живёт оно у бота. Заведи
    //: страница своё - на карточке в чате была бы одна монета, а на графике в комнате
    //: другая, и разошлись бы они молча (закон №40, живой прецедент $AKE против $CAKE).
    //: НЕ ДОСТУЧАЛИСЬ - СТАВИМ КАК НАПИСАНО, И ГОВОРИМ ЭТО. Отказ был бы хуже: биржевой
    //: символ вида `BINANCE:ARBUSDT` человек пишет верно, и запрещать его из-за молчания
    //: бота значит ломать рабочий путь ради неработающего.
    bOther.onclick = async function () {
      var v = await askText('Какой символ показать?',
                            '«btc», «pepe», «AAPL» или готовое BINANCE:ARBUSDT');
      if (!v) return;
      if (!roomAsk) { chartSet(v, chTf, 'Ты', true); return; }
      var res = await roomAsk({ kind: 'rtcsym', room: ROOM, nm2: v }, 'Ищу символ…');
      if (res && res.sym) { chartSet(res.sym, chTf, 'Ты', true); return; }
      if (res) return;                    // бот ответил и уже назвал причину
      say('Бот не ответил про символ - ставлю как написано.');
      chartSet(v, chTf, 'Ты', true);
    };
    $('syms').appendChild(bOther);
    // ЯВНАЯ КНОПКА РЯДОМ С НЕЯВНЫМ ПОВТОРНЫМ ТАПОМ. Повторный тап - для тех, кто его
    // угадает; кнопка - для всех остальных. Показывается ТОЛЬКО когда есть что убирать:
    // «убрать график» на пустой доске отвечает не на тот вопрос.
    var bOff = document.createElement('button');
    bOff.className = 'chip'; bOff.id = 'symoff'; bOff.textContent = '✖️ Убрать график';
    bOff.style.display = 'none';
    bOff.onclick = function () { chartSet(null, chTf, 'Ты', true); };
    $('syms').appendChild(bOff);
    TFS.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = p[0]; b.dataset.tf = p[1];
      b.onclick = function () { if (chSym) chartSet(chSym, p[1], 'Ты', true); };
      $('tfs').appendChild(b);
    });
    // ═════════════════════════════════════════════════════════════════════════════
    // СОВМЕСТНЫЙ ХОЛСТ ПОВЕРХ ГРАФИКА
    // ═════════════════════════════════════════════════════════════════════════════
    // ПОЧЕМУ СВОЙ СЛОЙ, А НЕ РАЗМЕТКА TRADINGVIEW. Бесплатный виджет свою разметку наружу
    // не отдаёт вовсе, а Charting Library, которая отдаёт, - платная лицензия. Значит
    // либо свой холст, либо ничего.
    //
    // ═══ КООРДИНАТЫ ДОЛЕЙ, А НЕ ПИКСЕЛЕЙ - ЭТО НЕСУЩЕЕ, А НЕ АККУРАТНОСТЬ ═══
    // У меня телефон 390 px, у соседа десктоп 1200. Пошли мы пиксели - его «вот этот
    // уровень» лёг бы у меня на треть экрана левее, то есть указывал бы на другую цену.
    // Доли (0..1) от коробки графика переносятся между экранами без единой поправки.
    //
    // ЧТО ЕДЕТ В КАНАЛ. Штрихи ПРИРАЩЕНИЯМИ и пачками (не по точке на каждое движение
    // пальца - это залило бы канал), полный штрих не пересылается никогда.
    var CV_MAX = 400;            // штрихов на комнату: без потолка холст растёт вечно
    var CV_PTS = 400;            // точек в штрихе
    var CV_BATCH = 120;          // мс между пачками точек
    var strokes = [], curId = 0, cur = null, tool = 'pen', drawOn = false;
    var outbox = null, batchT = null, tips = {};

    function myColor(id) {
      // ЦВЕТ ВЫВОДИТСЯ ИЗ IDENTITY, А НЕ РАЗДАЁТСЯ ПО ОЧЕРЕДИ: у всех в комнате он обязан
      // получиться ОДИН И ТОТ ЖЕ, иначе «синюю линию нарисовал Ваня» у соседа окажется
      // зелёной. Раздача по порядку входа этого не даёт - порядок у каждого свой.
      var h = 0, str = String(id || '');
      for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
      return 'hsl(' + h + ',85%,62%)';
    }

    function cvFit() {
      var c = $('draw'), b = $('chartbox');
      if (!c || !b) return null;
      var r = b.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (!r.width || !r.height) return null;
      if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) {
        c.width = Math.round(r.width * dpr);
        c.height = Math.round(r.height * dpr);
      }
      return { c: c, w: r.width, h: r.height, dpr: dpr, box: r };
    }

    function cvDraw() {
      var f = cvFit();
      if (!f) return;
      var g = f.c.getContext('2d');
      g.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
      g.clearRect(0, 0, f.w, f.h);
      g.lineCap = 'round';
      g.lineJoin = 'round';
      strokes.forEach(function (st) {
        var p = st.p || [];
        if (!p.length) return;
        g.strokeStyle = st.c;
        g.fillStyle = st.c;
        g.lineWidth = 2.5;
        if (st.k === 'text') {
          g.font = '600 14px -apple-system,Segoe UI,Roboto,sans-serif';
          g.fillText(String(st.x || '').slice(0, 60), p[0][0] * f.w, p[0][1] * f.h);
          return;
        }
        g.beginPath();
        g.moveTo(p[0][0] * f.w, p[0][1] * f.h);
        for (var i = 1; i < p.length; i++) g.lineTo(p[i][0] * f.w, p[i][1] * f.h);
        g.stroke();
        if (st.k === 'arrow' && p.length > 1) {
          // СТРЕЛКА - ЭТО ЛИНИЯ ПЛЮС ДВА ШТРИХА НА КОНЦЕ, а не отдельный инструмент с
          // отдельным протоколом: чем меньше видов штриха, тем меньше мест разойтись.
          var a = p[p.length - 2], b2 = p[p.length - 1];
          var ang = Math.atan2((b2[1] - a[1]) * f.h, (b2[0] - a[0]) * f.w);
          var x2 = b2[0] * f.w, y2 = b2[1] * f.h;
          g.beginPath();
          g.moveTo(x2, y2);
          g.lineTo(x2 - 11 * Math.cos(ang - 0.4), y2 - 11 * Math.sin(ang - 0.4));
          g.moveTo(x2, y2);
          g.lineTo(x2 - 11 * Math.cos(ang + 0.4), y2 - 11 * Math.sin(ang + 0.4));
          g.stroke();
        }
      });
      // ИМЯ РЯДОМ С ЧУЖИМ КУРСОРОМ: без него линия появляется «сама», и понять, кто
      // сейчас чертит, нельзя.
      var now = Date.now();
      Object.keys(tips).forEach(function (k) {
        var t = tips[k];
        if (now - t.at > 2200) { delete tips[k]; return; }
        g.fillStyle = t.c;
        g.font = '600 11px -apple-system,Segoe UI,Roboto,sans-serif';
        g.fillText(t.n, t.x * f.w + 8, t.y * f.h - 6);
      });
    }

    function cvApply(m, who, nm) {
      // ДЕДУП ПО ID ШТРИХА. История догоняет вошедшего кусками и может прийти дважды -
      // от двоих сразу; без дедупа линии удвоились бы и потолстели.
      if (m.t === 'd') {
        var id = String(m.id || '').slice(0, 40);
        if (!id) return;
        var st = null;
        for (var i = strokes.length - 1; i >= 0; i--) if (strokes[i].id === id) { st = strokes[i]; break; }
        if (!st) {
          if (strokes.length >= CV_MAX) strokes.shift();
          // ═══ ЦВЕТ БЕРЁТСЯ ИЗ ID ШТРИХА, А НЕ У ОТПРАВИТЕЛЯ СООБЩЕНИЯ ═══
          // Пока штрихи ездят только «в прямом эфире», отправитель и автор совпадают, и
          // разница невидима. Но историю вошедшему позже пересылает КТО-ТО ОДИН - и по
          // цвету отправителя все чужие линии стали бы ЕГО цветом, то есть доска у
          // новичка выглядела бы иначе, чем у всех остальных.
          st = { id: id, c: myColor(id.split('|')[0] || who),
                 k: String(m.k || 'pen').slice(0, 6), p: [],
                 x: String(m.x || '').slice(0, 60) };
          strokes.push(st);
        }
        var pts = (m.p || []).slice(0, CV_PTS);
        // У ЛИНИИ И СТРЕЛКИ КОНЕЦ ЗАМЕНЯЕТСЯ, А НЕ ДОПИСЫВАЕТСЯ: иначе «резиновая» линия
        // оставляла бы за собой веер промежуточных положений.
        if (st.k === 'line' || st.k === 'arrow') st.p = pts;
        else st.p = st.p.concat(pts).slice(-CV_PTS);
        if (st.p.length && nm) {
          tips[who] = { n: nm, c: st.c, x: st.p[st.p.length - 1][0],
                        y: st.p[st.p.length - 1][1], at: Date.now() };
        }
      } else if (m.t === 'dx') {
        var kill = {};
        (m.ids || []).forEach(function (x) { kill[String(x)] = 1; });
        strokes = strokes.filter(function (x) { return !kill[x.id]; });
      } else if (m.t === 'dc') {
        // ОЧИСТКА БЫВАЕТ ДВУХ РОДОВ, И ЭТО РАЗНЫЕ ПРАВА. Свои штрихи человек убирает
        // молча; ЧУЖИЕ - только явной кнопкой, и она НАЗЫВАЕТ, кто это сделал: стёртая
        // без объяснения чужая работа читается как сбой.
        if (m.all) {
          strokes = [];
          // ПОДПИСИ ЧУЖИХ КУРСОРОВ ЖИВУТ ОТДЕЛЬНО ОТ ШТРИХОВ, и «очистить» обязано снести
          // и их: имя, висящее над пустой доской, читается как недостёртый штрих. Поймано
          // пробой - после очистки на холсте оставались непрозрачные пиксели.
          tips = {};
          if (nm) popup(nm + '  🧹 очистил доску');
        } else {
          strokes = strokes.filter(function (x) { return x.id.indexOf(who + '|') !== 0; });
        }
      }
      cvDraw();
    }

    //: Отдать историю доски вошедшему позже. Кусками: у канала данных сообщение не
    //: резиновое, а сотня штрихов в одном пакете его просто не пролезет.
    //: ДЕДУП НА ПРИЁМЕ (по id штриха) делает лишние копии безвредными - поэтому отвечать
    //: могут все, у кого есть история, и договариваться о «главном» не нужно.
    function cvSendHistory() {
      var CH = 20;
      for (var i = 0; i < strokes.length; i += CH) {
        send({ t: 'dh', s: strokes.slice(i, i + CH).map(function (st) {
          return { id: st.id, k: st.k, x: st.x, p: st.p };
        }) });
      }
    }

    function flush() {
      if (!outbox) return;
      send(outbox);
      outbox = null;
    }
    function pushPts(pts) {
      if (!cur) return;
      if (!outbox) outbox = { t: 'd', id: cur.id, k: cur.k, p: [] };
      outbox.p = (cur.k === 'line' || cur.k === 'arrow') ? pts.slice() : outbox.p.concat(pts);
      if (!batchT) {
        // ПАЧКАМИ, А НЕ ПО ТОЧКЕ НА КАЖДОЕ ДВИЖЕНИЕ: палец даёт под сотню событий в
        // секунду, и по одному сообщению на каждое канал данных встанет колом.
        batchT = setTimeout(function () { batchT = null; flush(); }, CV_BATCH);
      }
    }

    function xy(e) {
      var f = cvFit();
      if (!f) return null;
      return [Math.max(0, Math.min(1, (e.clientX - f.box.left) / f.w)),
              Math.max(0, Math.min(1, (e.clientY - f.box.top) / f.h))];
    }

    var cvEl = $('draw');
    // ПОДПИСЬ СПРАШИВАЕТСЯ НАШИМ ОКНОМ, А ОНО АСИНХРОННО - отсюда `async`. Прежний
    // `prompt` был синхронным и в вебвью Telegram просто не показывался.
    cvEl.addEventListener('pointerdown', async function (e) {
      if (!drawOn) return;
      //: ДОСКА - ТА ЖЕ ОБЩАЯ ПОВЕРХНОСТЬ, ЧТО ГРАФИК. Гейт стоит здесь, в начале своего
      //: штриха: ниже расходятся три инструмента (кисть, ластик, подпись), и правило
      //: пришлось бы повторить трижды. У получателя стоит свой (см. `onData`).
      if (!maySurface()) { surfDeny(); return; }
      var p = xy(e);
      if (!p) return;
      e.preventDefault();
      var me = room.localParticipant.identity;
      if (tool === 'erase') {
        var kill = strokes.filter(function (st) {
          return (st.p || []).some(function (q) {
            return Math.abs(q[0] - p[0]) < 0.035 && Math.abs(q[1] - p[1]) < 0.05;
          });
        }).map(function (st) { return st.id; });
        if (!kill.length) return;
        cvApply({ t: 'dx', ids: kill }, me, '');
        send({ t: 'dx', ids: kill });
        return;
      }
      if (tool === 'text') {
        var v = '';
        v = ((await askText('Что подписать?', 'коротко, до 60 символов')) || '').slice(0, 60);
        if (!v.trim()) return;
        var tid = me + '|' + (++curId);
        var msg = { t: 'd', id: tid, k: 'text', x: v, p: [[+p[0].toFixed(4), +p[1].toFixed(4)]] };
        cvApply(msg, me, '');
        send(msg);
        return;
      }
      cur = { id: me + '|' + (++curId), k: tool, p: [p] };
      cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(p)] }, me, '');
      pushPts([rd(p)]);
      try { cvEl.setPointerCapture(e.pointerId); } catch (e3) {}
    });
    function rd(p) { return [+p[0].toFixed(4), +p[1].toFixed(4)]; }
    cvEl.addEventListener('pointermove', function (e) {
      if (!drawOn || !cur) return;
      var p = xy(e);
      if (!p) return;
      e.preventDefault();
      var me = room.localParticipant.identity;
      if (cur.k === 'line' || cur.k === 'arrow') {
        cur.p = [cur.p[0], p];
        cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(cur.p[0]), rd(p)] }, me, '');
        pushPts([rd(cur.p[0]), rd(p)]);
      } else {
        cur.p.push(p);
        cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(p)] }, me, '');
        pushPts([rd(p)]);
      }
    });
    function endStroke() {
      if (!cur) return;
      cur = null;
      if (batchT) { clearTimeout(batchT); batchT = null; }
      flush();                 // ХВОСТ ПАЧКИ ДОСЫЛАЕМ СРАЗУ: иначе конец линии не доедет
    }
    cvEl.addEventListener('pointerup', endStroke);
    cvEl.addEventListener('pointercancel', endStroke);
    cvEl.addEventListener('pointerleave', endStroke);

    [['✏️', 'pen'], ['📏', 'line'], ['➡️', 'arrow'], ['🔤', 'text'], ['🧽', 'erase']]
      .forEach(function (p) {
        var b = document.createElement('button');
        b.className = 'chip'; b.textContent = p[0]; b.dataset.k = p[1];
        b.onclick = function () {
          // ТАП ПО АКТИВНОМУ ИНСТРУМЕНТУ ВЫКЛЮЧАЕТ РИСОВАНИЕ. Без этого выйти из режима
          // рисования было бы нечем, а холст ловит тапы и не пускает их к графику.
          if (drawOn && tool === p[1]) { drawOn = false; } else { drawOn = true; tool = p[1]; }
          paintTools();
        };
        $('tools2').appendChild(b);
      });
    var bMine = document.createElement('button');
    bMine.className = 'chip'; bMine.textContent = '↩️ Моё';
    bMine.onclick = function () {

    };
    $('tools2').appendChild(bMine);
    var bAll = document.createElement('button');
    bAll.className = 'chip'; bAll.textContent = '🧹 Всё';
    bAll.onclick = function () {

    $('tools2').appendChild(bAll);

    function paintTools() {
      [].slice.call($('tools2').children).forEach(function (b) {

      });

    paintTools();
    window.addEventListener('resize', cvDraw);

    // ═══ ЗАМОК АДМИНА: ПАНЕЛЬ УБИРАЕТСЯ У ВСЕХ, А НЕ ПРОСТО ЗАКРЫВАЕТСЯ У СЕБЯ ═══
    // Кнопка, которая после замка молча ничего не делает, читается как поломка (закон
    // №36): вместо неё стоит СТРОКА с причиной. Админу кнопка остаётся - он и отпирает.
    lockPaint = function () {
      var b = $('chart');
      var off = lockOn && !iAmAdm;
      b.style.display = off ? 'none' : '';
      // ═══ УБИРАЕТСЯ СОДЕРЖИМОЕ, А КНОПКА ВТОРИЧНА (живой отказ Ren 30.08) ═══
      // Прежняя редакция ставила `chOpen = false` и звала перерисовку строкой ниже, под
      // условием `if (lockOn && chOpen)` - а `chOpen` к этому моменту УЖЕ был false.
      // Условие не выполнялось НИКОГДА, `chartPaint()` не звался, и у не-админа
      // пропадала ровно КНОПКА, при том что доска и график оставались на экране. То есть
      // замок делал ровно обратное тому, ради чего он есть.
      // ПОЭТОМУ ПЕРЕРИСОВКА БЕЗУСЛОВНА: она идемпотентна и ничего не стоит, а экономия
      // на ней покупала класс багов (тот же вывод, что у отрисовки самого замка).
      if (off) chOpen = false;
      $('lockwhy').textContent = lockOn
        ? ('Доску и график убрал админ комнаты.'
           + (iAmAdm ? ' Вернуть - кнопкой в админском блоке.' : ''))
        : '';
      chartPaint();
    };
    lockPaint();

    $('chart').onclick = function () {
      chOpen = !chOpen;
      chShut = !chOpen;          // закрыл руками - чужой график больше не распахнёт
      chartPaint();
      // ОТКРЫЛИ ПУСТУЮ ПАНЕЛЬ - СПРАШИВАЕМ У КОМНАТЫ, ЧТО ТАМ УЖЕ ЕСТЬ. Сердцебиение
      // догонит и само, но ждать до пяти секунд перед пустым экраном человек прочитает
      // как «не работает».
      if (chOpen && !chSym) send({ t: 'ask' });
    };

    // ═══ ОЧЕРЕДЬ ВОПРОСОВ И ГОЛОСОВАНИЕ: КАНАЛОМ ДАННЫХ, КАК РУКА И ТАЙМЕР ═══
    // ВЕДУЩЕГО В КОМНАТЕ НЕТ, И ЗАВОДИТЬ ЕГО РАДИ ЭТИХ ДВУХ КАРТОЧЕК Я НЕ СТАЛ. Порядок
    // вопросов задают ГОЛОСА, а не тот, кто громче; голосование открывает любой, и рядом
    // написано, кто. Это та же граница, что у «заглушить всех»: просьба, а не приказ.
    var ama = [];           // [{id, who, nm, x, v:{identity:1}, done:0, ts}]
    var poll = null;        // {id, q, mkt, by, v:{identity:'y'|'n'|'a'}}
    var AMA_MAX = 40;

    function amaSort() {
      // ГОЛОСА, ПОТОМ ВРЕМЯ. Отвеченные уходят вниз: очередь отвечает на вопрос «кто
      // следующий», а не «что тут было».
      ama.sort(function (a, b) {
        if (!!a.done !== !!b.done) return a.done ? 1 : -1;
        var d = Object.keys(b.v || {}).length - Object.keys(a.v || {}).length;
        return d || (a.ts - b.ts);
      });
    }

    function amaPaint() {
      amaSort();
      var box = $('amalist');
      box.innerHTML = '';
      var me = room.localParticipant.identity;
      ama.forEach(function (q, i) {
        var row = document.createElement('div');
        row.className = 'q' + (q.done ? ' done' : '');
        var n = document.createElement('div');
        n.className = 'qn';
        n.textContent = q.done ? '✓' : (i + 1) + '.';
        var t = document.createElement('div');
        t.className = 'qt';
        t.textContent = q.x;
        var w = document.createElement('div');
        w.className = 'qw';
        w.textContent = q.nm || '';
        t.appendChild(document.createElement('br'));
        t.appendChild(w);
        var up = document.createElement('button');
        var mine = !!(q.v || {})[me];
        up.className = mine ? 'on' : '';
        up.textContent = '👍 ' + Object.keys(q.v || {}).length;
        up.onclick = function () { amaApply({ op: 'vote', id: q.id }, me, ''); send({ t: 'ama', op: 'vote', id: q.id }); };
        row.appendChild(n); row.appendChild(t); row.appendChild(up);
        // ОТМЕТИТЬ ОТВЕЧЕННЫМ МОЖЕТ ЛЮБОЙ (ведущего нет), СНЯТЬ ВОПРОС - ТОЛЬКО АВТОР:
        // чужой вопрос стирать нельзя, а «на него ответили» это факт всей комнаты.
        var dn = document.createElement('button');
        dn.textContent = q.done ? '↩️' : '✅';
        dn.onclick = function () { amaApply({ op: 'done', id: q.id }, me, ''); send({ t: 'ama', op: 'done', id: q.id }); };
        row.appendChild(dn);
        if (q.who === me) {
          var del = document.createElement('button');
          del.textContent = '✕';
          del.onclick = function () { amaApply({ op: 'del', id: q.id }, me, ''); send({ t: 'ama', op: 'del', id: q.id }); };
          row.appendChild(del);
        }
        box.appendChild(row);
      });
      $('amanote').textContent = ama.length
        ? 'Порядок задают голоса. ✅ - отвечено, ✕ - снять свой вопрос.'
        : 'Вопросов пока нет. Задай первый - остальные проголосуют, и порядок сложится сам.';
    }

    function amaApply(m, who, nm) {
      var op = m.op;
      if (op === 'add') {
        if (ama.length >= AMA_MAX) return;
        if (ama.some(function (q) { return q.id === m.id; })) return;   // дедуп по id
        ama.push({ id: String(m.id).slice(0, 24), who: who, nm: String(nm || '').slice(0, 40),
                   x: String(m.x || '').slice(0, 200), v: {}, done: 0, ts: Number(m.ts) || Date.now() });
      } else {
        var q = null;
        ama.forEach(function (r) { if (r.id === m.id) q = r; });
        if (!q) return;
        // ГОЛОС СЧИТАЕТСЯ ПО IDENTITY ОТПРАВИТЕЛЯ, А НЕ ПО ПОЛЮ СООБЩЕНИЯ. Поле пришло бы
        // от клиента, и один человек накрутил бы себе сколько угодно голосов, не открывая
        // ничего сложнее консоли (закон №32: гейт у действия).
        if (op === 'vote') { if (q.v[who]) delete q.v[who]; else q.v[who] = 1; }
        if (op === 'done') q.done = q.done ? 0 : 1;
        if (op === 'del' && q.who === who) ama = ama.filter(function (r) { return r.id !== q.id; });
      }
      amaPaint();
    }

    //: ═══ ГОЛОСОВАНИЕ ВСПЛЫВАЕТ У ВСЕХ САМО, КАК ГРАФИК И ВИДЖЕТЫ (Ren 01.09) ═══
    //: Живой отказ: голосование открыл один, а остальным приходилось самим лезть в
    //: «Ещё» → «Голосование» - то есть узнать о нём было неоткуда. Спросить комнату и
    //: не показать ей вопрос - это фича, работающая ровно у того, кто её включил.
    //: МЕХАНИЗМ БЕРЁМ ТОТ ЖЕ, ЧТО У ПАРЫ (`chOpen`/`chShut`), А НЕ ВТОРОЙ ПОХОЖИЙ:
    //: две копии правила «когда панель открывается сама» разошлись бы на первой правке.
    //: ЗАМОК СЮДА НЕ ВХОДИТ НАРОЧНО: он про доску и график - общую ПОВЕРХНОСТЬ, которой
    //: мешают выступающему. Голосование поверхности не занимает, это вопрос и три кнопки.
    var pollShut = false;
    function pollOpenIfNeeded() {
      var c = $('poll');
      if (!c || !poll) return;
      if (pollShut) return;                  //: закрыл руками - уважаем
      if (c.style.display !== 'none') return;
      c.style.display = '';
      $('pollbtn').classList.toggle('on', true);
    }

    function pollPaint() {
      var card = $('poll');
      if (!poll) {
        $('pollq').textContent = '';
        $('pollmkt').textContent = '';
        $('pollbtns').innerHTML = '';
        $('polltal').innerHTML = '';
        $('pollnote').textContent = 'Голосования сейчас нет. Напиши вопрос - комната ответит '
          + 'да/нет. Ссылка на рынок Polymarket покажет рядом, что думает рынок.';
        $('pq').style.display = '';
        $('pgo').style.display = '';
        return;
      }
      $('pq').style.display = 'none';
      $('pgo').style.display = 'none';
      $('pollq').textContent = poll.q;
      $('pollmkt').textContent = poll.mkt || '';
      var me = room.localParticipant.identity;
      var mine = (poll.v || {})[me] || '';
      var opts = [['y', '👍 Да'], ['n', '👎 Нет'], ['a', '🤷 Воздержусь']];
      var bts = $('pollbtns');
      bts.innerHTML = '';
      opts.forEach(function (o) {
        var b = document.createElement('button');
        b.className = 'pre' + (mine === o[0] ? ' on' : '');
        b.textContent = o[1];
        b.onclick = function () { pollApply({ op: 'vote', v: o[0] }, me); send({ t: 'poll', op: 'vote', v: o[0] }); };
        bts.appendChild(b);
      });
      var vals = Object.keys(poll.v || {}).map(function (k) { return poll.v[k]; });
      var tot = vals.length || 1;
      var tal = $('polltal');
      tal.innerHTML = '';
      opts.forEach(function (o) {
        var n = vals.filter(function (v) { return v === o[0]; }).length;
        var line = document.createElement('div');
        line.className = 'me';
        line.textContent = o[1] + ' - ' + n + ' (' + Math.round(n * 100 / tot) + '%)';
        var bar = document.createElement('div');
        bar.className = 'bar' + (o[0] === 'n' ? ' n' : (o[0] === 'a' ? ' a' : ''));
        bar.style.width = Math.max(2, Math.round(n * 100 / tot)) + '%';
        tal.appendChild(line);
        tal.appendChild(bar);
      });
      var stop = document.createElement('button');
      stop.className = 'pre';
      stop.textContent = '⏹ Закрыть голосование';
      stop.onclick = function () { pollApply({ op: 'close' }, me); send({ t: 'poll', op: 'close' }); };
      tal.appendChild(stop);
      $('pollnote').textContent = 'Открыл: ' + (poll.by || '') + '. Голосовали: ' + vals.length
        + '. Свой голос можно поменять.';
    }

    function pollApply(m, who, nm) {
      if (m.op === 'open') {
        poll = { id: String(m.id).slice(0, 24), q: String(m.q || '').slice(0, 140),
                 mkt: String(m.mkt || '').slice(0, 200), by: String(nm || m.by || '').slice(0, 40), v: {} };
      } else if (!poll) {
        return;
      } else if (m.op === 'vote') {
        if (['y', 'n', 'a'].indexOf(m.v) < 0) return;
        poll.v[who] = m.v;
      } else if (m.op === 'close') {
        poll = null;
      } else if (m.op === 'mkt') {
        poll.mkt = String(m.mkt || '').slice(0, 200);
      }
      pollPaint();
      //: ВОПРОС ПОЯВИЛСЯ - ПАНЕЛЬ ОТКРЫВАЕТСЯ САМА. Отрисовать её в закрытой панели
      //: значит спросить комнату и не показать ей вопрос.
      pollOpenIfNeeded();
    }

    $('amabtn').onclick = function () {
      var c = $('ama');
      var on = c.style.display === 'none';
      c.style.display = on ? '' : 'none';
      $('amabtn').classList.toggle('on', on);
      if (on) { amaPaint(); send({ t: 'ask' }); }

    $('ago').onclick = function () {
      var v = $('aq').value.trim();
      if (!v) return;
      var me = room.localParticipant.identity;
      var m = { op: 'add', id: me.slice(0, 8) + '-' + Date.now().toString(36), x: v, ts: Date.now() };
      amaApply(m, me, myLabel());
      send({ t: 'ama', op: 'add', id: m.id, x: v, ts: m.ts, nm: myLabel() });
      $('aq').value = '';
    };
    $('pollbtn').onclick = function () {
      var c = $('poll');
      var on = c.style.display === 'none';
      c.style.display = on ? '' : 'none';
      //: ЗАКРЫЛ РУКАМИ - ЗАПОМИНАЕМ, И ЧУЖОЕ ГОЛОСОВАНИЕ БОЛЬШЕ ЕГО НЕ РАСПАХНЁТ.
      //: Явный выбор человека сильнее дефолта - та же граница, что у панели графика

      pollShut = !on;

    };
    $('pgo').onclick = async function () {
      var v = $('pq').value.trim();

      var me = room.localParticipant.identity;
