<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Голосовая комната</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.7.2/dist/livekit-client.umd.min.js"></script>
<style>
  :root { --bg:#101014; --fg:#e8e8ec; --mut:#8b8b96; --ok:#3ddc84; --bad:#ff5a5f; --card:#1b1b21; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px 14px 90px; background:var(--bg); color:var(--fg);
         font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:17px; margin:0 0 2px; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 14px; }
  .card { background:var(--card); border-radius:12px; padding:10px 12px; margin:10px 0; }
  .p { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .dot { width:9px; height:9px; border-radius:50%; background:#3a3a44; flex:0 0 auto; }
  .dot.on { background:var(--ok); box-shadow:0 0 0 4px rgba(61,220,132,.18); }
  .nm { flex:1; font-size:14px; }
  /* ВТОРАЯ СТРОКА ОБЯЗАНА БЫТЬ ВТОРОЙ: без `pre-line` перенос схлопнулся бы в пробел,
     и подробности слиплись бы с сутью - ровно та стена текста, которую убираем. */
  .me { color:var(--mut); font-size:12px; white-space:pre-line; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
         background:#16161c; display:flex; gap:10px; }
  button { flex:1; padding:14px; font-size:15px; font-weight:600; border:0; border-radius:12px;
           background:#3a7afe; color:#fff; }
  button.off { background:#3a3a44; }
  button.leave { background:#4a2226; color:#ff9aa0; flex:0 0 40%; }
  button:active { opacity:.85; }
  #state { font-size:13px; color:var(--mut); margin:8px 0 0; }
  button.wide { width:100%; margin:6px 0; background:#25252e; font-weight:500; font-size:14px; }
  button.wide.on { background:#3a7afe; }
  #screens video { width:100%; border-radius:10px; margin:8px 0; background:#000; }
  .hand { color:#ffd166; font-size:12px; }
  .err { color:var(--bad); }
  /* ИНДИКАТОР ЗАПИСИ ВИДЕН БЕЗ ПОИСКА ГЛАЗАМИ: он про то, что разговор сохраняется, и
     прятать его среди служебных строк нельзя. Мигание - чтобы он не читался как ярлык. */
  .rec { margin:0 0 12px; padding:8px 10px; border-radius:10px; background:#3a1d20;
         color:#ff9aa0; font-size:13px; font-weight:600; }
  .rec::before { content:'⏺ '; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  /* ФИЛЬТРЫ КАТАЛОГА ЖИВУТ ВНУТРИ СВОЕЙ КАРТОЧКИ, А НЕ ОТДЕЛЬНЫМ БЛОКОМ (закон №37):
     ряд чипов, стоящий сам по себе, на первой же прокрутке уезжает под соседа, и от
     кнопок остаётся нижняя половина. */
  .chip { flex:0 0 auto; width:auto; padding:8px 12px; margin:0 6px 6px 0; font-size:13px;
          font-weight:500; background:#25252e; border-radius:999px; }
  .chip.on { background:#3a7afe; }
  #rchips { display:flex; flex-wrap:wrap; }
  #rlist { max-height:46vh; overflow-y:auto; }
  button.station { display:flex; align-items:center; gap:10px; text-align:left; }
  button.station img { width:26px; height:26px; border-radius:6px; object-fit:cover;
                       flex:0 0 auto; background:#16161c; }
</style>
</head>
<body>
<h1 id="title">Голосовая комната</h1>
<p class="sub" id="sub">Подключаюсь…</p>
<p id="recbar" class="rec" style="display:none"></p>
<div class="card" id="people"></div>
<div id="screens"></div>
<p id="state"></p>

<div id="tools" class="card">
  <button id="hand" class="wide">✋ Поднять руку</button>
  <button id="show" class="wide" style="display:none"></button>
  <button id="cam" class="wide" style="display:none">📷 Показать камеру</button>
  <button id="hush" class="wide" style="display:none">🤫 Заглушить всех, кроме говорящего</button>
  <button id="rec" class="wide" style="display:none">⏺ Записать созвон</button>
  <button id="dj" class="wide" style="display:none">📻 Включить радио</button>
  <!-- ГРОМКОСТЬ РАДИО - У КАЖДОГО СВОЯ. Ползунок появляется вместе с дорожкой радио и
       исчезает вместе с ней: регулятор того, чего не играет, читается как «сломано». -->
  <div id="djvol" style="display:none">
    <label class="me" for="djv" id="djvlab"></label>
    <input id="djv" type="range" min="0" max="100" step="5">
  </div>
  <p class="me" id="showhint"></p>
  <!-- ПРИЧИНА, ПО КОТОРОЙ КНОПКИ НЕТ, ЖИВЁТ РЯДОМ С МЕСТОМ, ГДЕ ЕЁ ЖДУТ. Общая
       строка состояния тут не годится: её перетирает следующее сообщение, и
       объяснение исчезает через секунду - проверено браузером, чтением не видно. -->
  <p class="me" id="recwhy"></p>
  <button id="rnn" class="wide" style="display:none">🔇 Подавить шум</button>
  <p class="me" id="audiodbg"></p>
</div>

<!-- КАТАЛОГ СТАНЦИЙ. Список приезжает ОТ БОТА: у него уже есть и фильтры, и
     переводы подписей, и белый список источников. Второй клиент каталога прямо
     отсюда разошёлся бы с Медиаплеером на первой правке (закон №40). -->
<div class="card" id="radio" style="display:none">
  <!-- ПОИСК ПО НАЗВАНИЮ. Живой прогон Ren: «Спокойное радио» не попадает ни под один
       жанровый чип, и без поиска до него не добраться вовсе. Ищет БОТ тем же каталогом,
       что и фильтры - второй клиент radio-browser прямо отсюда разошёлся бы с плеером. -->
  <input id="rq" type="search" autocomplete="off" spellcheck="false"
         placeholder="Поиск станции по названию">
  <div id="rchips"></div>
  <div id="rlist"></div>
  <p class="me" id="rnote"></p>
</div>

<div id="bar">
  <button id="mic">🎙 Выключить микрофон</button>
  <button id="out" class="leave">Выйти</button>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var tg = (window.Telegram || {}).WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var VERSION = 'cbb27c3309c2';
  // ═══ ДОГОВОР, А НЕ ВЕРСИЯ ═══
  // Версия меняется на каждой правке страницы и значит «есть свежее». Договор - это
  // ФОРМАТ провода: форма токена, имена ручек, поля ответа. Он поднимается ТОЛЬКО когда
  // старая страница физически не может работать с новым Worker'ом, и тогда предлагать ей
  // «обновись» бессмысленно - надо честно сказать, что она мертва. Число обязано
  // совпадать с RTC_CONTRACT в worker/search.js.
  var PAGE_CONTRACT = 1;
  var q = new URLSearchParams(location.search);
  // АДРЕС ЭНДПОИНТА И ИМЯ КОМНАТЫ - ПАРАМЕТРАМИ ССЫЛКИ, а не вшиты при сборке. Страница
  // ОДНА на всех ботов и на любую комнату; вшитое имя означало бы отдельную выкладку под
  // каждую, а вшитый адрес - что страница, выложенная до появления Worker'а, остаётся
  // немой до следующего деплоя (этот класс мы уже ловили у плеера).
  var API = (q.get('api') || 'https://hara-search.laynenorstrud.workers.dev').replace(/\/+$/, '');
  var ROOM = (q.get('room') || '').toLowerCase();

  function say(t, bad) {
    var el = $('state');
    el.textContent = t || '';
    el.className = bad ? 'err' : '';
  }
  function sub(t) { $('sub').textContent = t; }
  var connected = false;

  if (!ROOM) { sub('Комната не указана'); say('В ссылке нет параметра room.', true); return; }
  $('title').textContent = 'Комната: ' + ROOM;

  if (!window.LivekitClient) {
    sub('Не загрузился клиент');
    say('Библиотека комнаты не доехала - проверь сеть и открой заново.', true);
    return;
  }
  var LK = window.LivekitClient;

  // ПРИЧИНЫ ОТКАЗА РАЗДЕЛЕНЫ. «Нет адреса», «Telegram не передал подпись» и «сервер не
  // ответил» лечатся по-разному, и одна фраза на три случая час вела бы разбор не туда
  // (живой урок плеера).
  if (!API || API.indexOf('{{') === 0) {
    sub('Нет адреса сервера');
    say('Страница выложена без адреса эндпоинта. Это у нас: сперва worker_deploy.deploy().',
        true);
    return;
  }
  // ДВА СПОСОБА ВОЙТИ, И ОНИ РАЗНЫЕ ПО ТОМУ, ЧТО ДОКАЗЫВАЮТ. Подпись Telegram доказывает
  // ЧЕЛОВЕКА; разовая ссылка доказывает только то, что её выдали мы. Второе слабее, и в
  // комнате это помечено - участники должны понимать, кто с ними.
  var WEB = q.get('web') || '';
  var initData = (tg && tg.initData) || '';
  // ЧТО СЕЙЧАС УМЕЕТ СЕРВЕР. null означает «не знаем» и трактуется как «нельзя»:
  // показать кнопку по незнанию значит вернуть ровно ту, что обещала лишнее.
  var CAPS = null;
  if (!initData && !WEB) {
    sub('Нет подписи Telegram');
    say('Открой комнату кнопкой из бота: без подписи сервер не знает, кто ты. '
        + 'Либо попроси разовую ссылку - по ней можно войти и без Telegram.', true);
    return;
  }

  // ═══ ФЛАГИ ОБРАБОТКИ ЗВУКА ═══
  // Без echoCancellation комната с двух телефонов рядом даёт вой; без noiseSuppression в
  // эфир едет кондиционер; без autoGainControl один слышен шёпотом, другой криком. Это не
  // «настройки по вкусу», а условие того, чтобы разговором вообще можно было пользоваться.
  //
  // ═══ voiceIsolation МЫ САМИ ЖЕ И ПОТЕРЯЛИ, И ЭТО НАЙДЕНО ПО ИСХОДНИКУ SDK ═══
  // У livekit-client свои умолчания захвата (`audioDefaults` в defaults.ts тега 2.7.2):
  // autoGainControl, echoCancellation, noiseSuppression И voiceIsolation - все true.
  // `audioCaptureDefaults` в опциях комнаты ЗАМЕНЯЕТ этот объект ЦЕЛИКОМ, а не мержится
  // по полям, - то есть, выписав «свои три флага», мы молча выкинули четвёртый. А он тут
  // самый уместный: voiceIsolation это отдельная ML-модель под голос, и РОВНЫЙ ГУЛ (живой
  // случай Ren) - ровно её работа. Классический наш класс: «явно задали» оказалось УЖЕ,
  // чем «не трогали».
  // ФЛАГ, КОТОРОГО БРАУЗЕР НЕ ЗНАЕТ, БЕЗОПАСЕН: неизвестные имена в getUserMedia
  // отбрасываются, а не роняют захват. Поэтому его отсутствие в отчёте - НЕ повод кричать.
  var AUDIO_WANT = { echoCancellation: true, noiseSuppression: true, autoGainControl: true,
                     voiceIsolation: true };
  //: Что обязано быть у ЛЮБОГО браузера. По этим трём судим строго; voiceIsolation -
  //: только показываем, если он о нём вообще сообщает.
  var AUDIO_MUST = ['noiseSuppression', 'echoCancellation', 'autoGainControl'];

  var room = null, people = {}, micOn = true, recOn = false, djOn = false;

  // СОСТОЯНИЕ ЗАПИСИ ЧИТАЕТСЯ У КОМНАТЫ, А НЕ ХРАНИТСЯ У НАС. Свой флажок разошёлся бы с
  // сервером на первом же падении Egress, и кнопка предлагала бы остановить то, что уже
  // не пишется. Метаданные ставит БОТ - он же владеет записью (закон №40: одна дверь).
  var lastMeta = '';
  function showRec(meta) {
    // ПОСЛЕДНЕЕ СОСТОЯНИЕ ПОМНИМ, потому что кнопка появляется ПОЗЖЕ первой отрисовки:
    // порядок строк в `go()` не должен решать, что написано на кнопке. Вошедший при
    // идущей записи видел «⏺ Записать созвон», хотя тап её ОСТАНОВИТ, - подпись врала о
    // последствии (поймано браузерным прогоном, чтением кода не видно).
    if (meta !== undefined) lastMeta = meta || '';
    var m = null;
    try { m = JSON.parse(lastMeta || '{}'); } catch (e) { m = null; }
    recOn = !!(m && m.rec);
    var bar = $('recbar');
    bar.style.display = recOn ? '' : 'none';
    if (recOn) {
      bar.textContent = 'Идёт запись созвона' + (m && m.by ? ' (включил: ' + m.by + ')' : '')
        + '. Транскрипт придёт в чат тому, кто её остановит.';
    }
    var btn = $('rec');
    if (btn.style.display !== 'none') {
      btn.classList.toggle('on', recOn);
      btn.textContent = recOn ? '⏹ Остановить запись' : '⏺ Записать созвон';
    }
    // РАДИО ЖИВЁТ В ТЕХ ЖЕ МЕТАДАННЫХ, И ЭТО НЕ ЭКОНОМИЯ ПОЛЯ. Признак «что играет»
    // обязан доезжать до вошедшего ПОЗЖЕ ровно так же, как признак записи: рассылка по
    // каналу данных молчала бы именно ему.
    djOn = !!(m && m.dj);
    var d = $('dj');
    if (d.style.display !== 'none') {
      d.classList.toggle('on', djOn);
      d.textContent = djOn ? ('⏹ Выключить радио (' + m.dj + ')') : '📻 Включить радио';
    }
  }

  // СКОЛЬКО ЧЕЛОВЕК В КОМНАТЕ - ОТДЕЛЬНОЙ СТРОКОЙ И ВСЕГДА. Список из одной строки «Ты»
  // не отвечает на вопрос «я тут один или другие ещё не зашли»: это два разных решения -
  // ждать или звать людей. Число считается ПО ТОМУ ЖЕ объекту, что рисует список, а не
  // отдельным счётчиком - два счётчика разошлись бы на первом же выходе участника.
  function headcount() {
    var n = Object.keys(people).length;
    if (n <= 1) return 'В комнате: только ты';
    var tail = (n % 10 === 1 && n % 100 !== 11) ? 'человек'
             : ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'человека'
             : 'человек');
    return 'В комнате: ' + n + ' ' + tail;
  }

  function draw() {
    var box = $('people');
    box.innerHTML = '';
    var ids = Object.keys(people);
    if (connected) sub(headcount());
    if (!ids.length) { box.innerHTML = '<div class="me">Пока никого</div>'; return; }
    ids.forEach(function (id) {
      var p = people[id];
      var row = document.createElement('div');
      row.className = 'p';
      // ОЧЕРЕДЬ СЛОВА - ЭТО ПОРЯДОК, А НЕ ФЛАЖОК: номер считается по времени поднятия,
      // иначе «кто раньше поднял» решает случайный порядок объекта.
      var q2 = ids.filter(function (x) { return people[x].hand; })
                  .sort(function (a, b) { return people[a].hand - people[b].hand; });
      var pos = q2.indexOf(id);
      row.innerHTML = '<span class="dot' + (p.speaking ? ' on' : '') + '"></span>'
        + '<span class="nm"></span>'
        + (pos >= 0 ? '<span class="hand">✋ ' + (pos + 1) + '</span> ' : '')
        + '<span class="me">' + (p.me ? 'ты' : (p.muted ? 'микрофон выкл' : '')) + '</span>';
      row.querySelector('.nm').textContent = p.name;
      box.appendChild(row);
    });
  }

  // ИМЯ ЧЕЛОВЕКА, А НЕ ЕГО TELEGRAM-ID. Токен несёт `name` из подписи, но у токена,
  // выданного СТАРЫМ Worker'ом, там лежит uid - и комната показывала соседям столбик
  // голых чисел. Число вместо имени не сообщает НИЧЕГО и при этом светит чужой id,
  // поэтому оно заменяется словом, а не показывается «как есть».
  // ЧТО НАМ ВООБЩЕ РАЗРЕШИЛИ. JWT это base64 - клиент читает свой грант, не спрашивая
  // никого. Нужно вот зачем: страница и Worker выкладываются РАЗНЫМИ командами, и если
  // приехала новая страница со старым токеном, кнопка показа есть, а права нет. LiveKit
  // в этом случае НЕ отказывает - он ВИСИТ («waiting for pending publication promise
  // timed out»), и по этому тексту причину не угадать (живой случай Ren 25.08).
  function grantOf(token) {
    try {
      var b = String(token).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      var j = JSON.parse(decodeURIComponent(escape(atob(b + '='.repeat((4 - b.length % 4) % 4)))));
      return (j && j.video) || {};
    } catch (e) { return {}; }
  }

  function human(name, id) {
    var n = String(name == null ? '' : name).trim();
    if (!n || n === String(id) || /^\d{5,}$/.test(n)) return 'Гость';
    return n;
  }

  function upsert(id, patch) {
    people[id] = Object.assign(people[id] || { name: id, speaking: false, muted: false }, patch);
    draw();
  }

  async function go() {
    var r;
    try {
      if (WEB) {
        // ИМЯ СПРАШИВАЕМ, ЕСЛИ ЕГО НЕТ В ССЫЛКЕ: человек без Telegram нам не представлен
        // ничем, а соседям по комнате надо знать, кто говорит.
        var nm = q.get('name') || '';
        if (!nm) { try { nm = (prompt('Как тебя звать в комнате?') || '').slice(0, 40); } catch (e) {} }
        r = await fetch(API + '/rtc/web?t=' + encodeURIComponent(WEB)
                        + (nm ? '&name=' + encodeURIComponent(nm) : ''));
      } else {
        r = await fetch(API + '/rtc/token?room=' + encodeURIComponent(ROOM), {
          headers: { 'X-Init-Data': initData },
        });
      }
    } catch (e) {
      sub('Сервер не ответил');
      say('Не достучался до ' + API + ': ' + (e && e.message || e), true);
      return;
    }
    var j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok || !j || !j.token) {
      sub('Войти не вышло');
      // ОТКАЗ НАЗЫВАЕТ ПРИЧИНУ СЕРВЕРА, А НЕ «ошибка». Код без текста это чёрный ящик.
      say('Сервер отказал (' + r.status + '): ' + ((j && (j.why || j.error)) || 'без причины'),
          true);
      return;
    }
    // ЧТО РАБОТАЕТ - ФАКТ С СЕРВЕРА, А НЕ ПРЕДПОЛОЖЕНИЕ СТРАНИЦЫ. Три состояния, и
    // «не знаем» это НЕ «работает»: бот публикует признак регулярно, и молчание бота
    // означает ровно то, что мы про запись ничего не знаем (fail-closed).
    CAPS = (j && j.caps) || null;

    room = new LK.Room({
      // ВИДЕО ПОЯВИЛОСЬ (показ экрана и камера), значит адаптивный поток снова нужен:
      // он не гонит крупную картинку туда, где её негде показать.
      adaptiveStream: true,
      dynacast: true,             // не гоняем дорожки туда, где их никто не слушает
      // ═══ ТРИ ФЛАГА ОБРАБОТКИ ЗВУКА - ОБЯЗАТЕЛЬНЫ ═══
      // Без echoCancellation комната с двух телефонов в одной комнате даёт вой; без
      // noiseSuppression в эфир едет кондиционер; без autoGainControl один участник
      // слышен шёпотом, другой криком. Это не «настройки по вкусу», а условие того,
      // чтобы разговором вообще можно было пользоваться.
      // ОДИН ОБЪЕКТ НА ВСЕ ТРИ МЕСТА (умолчания комнаты, явная просьба при включении
      // микрофона, починка после захвата). Три копии этих флагов разъехались бы, и
      // разбор «что мы вообще просили» упёрся бы в вопрос «которая из копий».
      audioCaptureDefaults: AUDIO_WANT,
    });

    // ЭТОТ БЛОК СТОИТ ДО РЕГИСТРАЦИИ СОБЫТИЙ НАРОЧНО: `room.connect()` ниже, а
    // подписка на дорожку радио приходит СРАЗУ после него - бот уже в комнате.
    // Объяви мы `DJ_ID` ниже по файлу, первый же `TrackSubscribed` сравнивал бы
    // identity с `undefined`, громкость не ставилась бы вовсе, и выглядело бы это
    // как «ползунок не работает». Тот же класс, что подпись кнопки записи, которая
    // зависела от порядка строк, а не от состояния.
    // ═══════════════ ГРОМКОСТЬ РАДИО ═══════════════
    // РАДИО - ФОН ПОД РАЗГОВОР, И ЭТО ЕГО СМЫСЛ, А НЕ НАСТРОЙКА ПО ВКУСУ. Вровень с
    // голосами оно мешает ровно тому, ради чего люди собрались.
    // ПОЧЕМУ КЛИЕНТСКАЯ СТОРОНА: у LiveKit громкость чужой дорожки живёт у СЛУШАТЕЛЯ
    // (`RemoteAudioTrack.setVolume`), серверной ручки «этому участнику тише» нет вовсе - и
    // правильно, что нет: одному фон мешает, другому нет, и решать это за всех нельзя.
    var DJ_ID = 'bot-dj';                 // identity бота-диджея, тот же, что в rtc_dj.py
    var DJ_VOL_DEFAULT = 25;              // проценты: заметно тише голоса (условие Ren)
    var djTrack = null;
    var djVol = DJ_VOL_DEFAULT;
    try {
        // ВЫБОР ЧЕЛОВЕКА ПЕРЕЖИВАЕТ ПЕРЕОТКРЫТИЕ: комнату открывают по несколько раз за
        // созвон, и каждый раз двигать ползунок заново - это работа, переложенная на него.
        var _sv = localStorage.getItem('rtc_dj_vol');
        if (_sv !== null && _sv !== '') djVol = Math.max(0, Math.min(100, parseInt(_sv, 10) || 0));
    } catch (e) { }

    function isDj(p) {
        return !!p && String(p.identity || '') === DJ_ID;
    }

    function applyDjVolume() {
        if (!djTrack || !djTrack.setVolume) return false;
        try { djTrack.setVolume(djVol / 100); return true; } catch (e) { return false; }
    }

    function showDjVol(on) {
        var box = $('djvol');
        if (!box) return;
        box.style.display = on ? '' : 'none';
        if (!on) return;
        var sl = $('djv');
        sl.value = String(djVol);
        $('djvlab').textContent = 'Громкость радио: ' + djVol + '% (фоном под разговор)';
        sl.oninput = function () {
            djVol = parseInt(sl.value, 10) || 0;
            $('djvlab').textContent = 'Громкость радио: ' + djVol + '% (фоном под разговор)';
            // ПРИМЕНЯЕМ СРАЗУ, А НЕ ПО ОТПУСКАНИЮ: человек ведёт ползунок и слушает, что
            // получается, - иначе он подбирает значение вслепую.
            applyDjVolume();
            try { localStorage.setItem('rtc_dj_vol', String(djVol)); } catch (e) { }
        };
    }

    room.on(LK.RoomEvent.ParticipantConnected, function (p) {
      upsert(p.identity, { name: human(p.name, p.identity) });
    });
    room.on(LK.RoomEvent.ParticipantDisconnected, function (p) {
      if (isDj(p)) { djTrack = null; showDjVol(false); }
      delete people[p.identity]; draw();
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, function (track, _pub2, p2) {
      if (track.kind === 'audio') {
        // РАДИО ВЫКЛЮЧИЛИ - ПОЛЗУНОК УХОДИТ ВМЕСТЕ С НИМ. Регулятор громкости того, чего
        // не играет, читается как «сломано»: человек двигает его и ничего не происходит.
        if (isDj(p2) || track === djTrack) { djTrack = null; showDjVol(false); }
        return;
      }
      if (track.kind !== 'video') return;
      // ЧУЖОЕ ВИДЕО УБИРАЕТСЯ, КОГДА ЕГО ПЕРЕСТАЛИ ДАВАТЬ. Оставленный чёрный
      // прямоугольник читается как «зависло».
      var nodes = $('screens').querySelectorAll('video');
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].dataset.sid === (track.sid || '')) nodes[i].remove();
      }
    });
    room.on(LK.RoomEvent.TrackSubscribed, function (track, _pub, p) {
      if (track.kind === 'video') {
        // СМОТРЕТЬ ЧУЖОЙ ЭКРАН УМЕЮТ ВСЕ, ВКЛЮЧАЯ МОБИЛЬНЫЕ: это обычное входящее видео.
        // Ограничение касается только ОТДАЧИ - там у мобильных браузеров нет самого API.
        var v = track.attach();
        v.setAttribute('playsinline', ''); v.muted = true; v.autoplay = true;
        v.dataset.sid = track.sid || '';
        $('screens').appendChild(v);
        say((p && p.name ? p.name : 'Участник') + ' показывает экран.');
        return;
      }
      if (track.kind === 'audio') {
        // ЗВУК ИГРАЕТ ЭЛЕМЕНТОМ, КОТОРЫЙ МЫ ДЕРЖИМ САМИ: на iOS элемент, не привязанный к
        // DOM, браузер вправе выгрузить, и участник замолкает без единой ошибки.
        var el = track.attach();
        el.setAttribute('playsinline', '');
        el.style.display = 'none';
        document.body.appendChild(el);
        // ═══ РАДИО ИГРАЕТ ФОНОМ, А НЕ ВРОВЕНЬ С ГОЛОСАМИ ═══
        // Живой прогон Ren: «мы делали радио, чтобы играло ФОНОМ под разговор - тихо».
        // Громкость КЛИЕНТСКАЯ и у каждого своя: серверной ручки «сделай этому участнику
        // тише» у LiveKit нет, да она и не нужна - одному фон мешает, другому нет.
        // СТАВИТСЯ СРАЗУ ПРИ ПОДПИСКЕ, А НЕ ПОСЛЕ ПЕРВОГО ДВИЖЕНИЯ ПОЛЗУНКА: иначе первые
        // секунды радио бьёт по ушам, и человек лезет искать регулятор уже раздражённым.
        if (isDj(p)) { djTrack = track; applyDjVolume(); showDjVol(true); }
      }
    });
    room.on(LK.RoomEvent.ActiveSpeakersChanged, function (spk) {
      var now = {};
      spk.forEach(function (p) { now[p.identity] = true; });
      Object.keys(people).forEach(function (id) { people[id].speaking = !!now[id]; });
      draw();
    });
    // ═══ ИНДИКАТОР ЗАПИСИ - ИЗ МЕТАДАННЫХ КОМНАТЫ, А НЕ ИЗ РАССЫЛКИ ПО КАНАЛУ ДАННЫХ ═══
    // Рассылку не услышит тот, кто зашёл ПОЗЖЕ, то есть индикатор молчал бы ровно тому,
    // кого он должен предупредить. Метаданные LiveKit отдаёт каждому при входе и шлёт
    // всем при смене - это состояние комнаты, а не чьё-то сообщение.
    room.on(LK.RoomEvent.RoomMetadataChanged, function (m) { showRec(m); });
    room.on(LK.RoomEvent.TrackMuted, function (_pub, p) { upsert(p.identity, { muted: true }); });
    room.on(LK.RoomEvent.TrackUnmuted, function (_pub, p) { upsert(p.identity, { muted: false }); });
    room.on(LK.RoomEvent.Disconnected, function (reason) {
      connected = false;
      sub('Отключился');
      say('Соединение закрыто' + (reason ? ' (' + reason + ')' : '') + '.');
    });
    // ПЕРЕПОДКЛЮЧЕНИЕ НАЗЫВАЕТСЯ ВСЛУХ: молчащая комната и комната, которая сейчас
    // вернётся, для человека выглядят одинаково, а ждать стоит только во второй.
    room.on(LK.RoomEvent.Reconnecting, function () { say('Связь прервалась, возвращаюсь…'); });
    room.on(LK.RoomEvent.Reconnected, function () { say(''); });

    try {
      await room.connect(j.url, j.token);
      // ФЛАГИ ПЕРЕДАЮТСЯ ЯВНО, А НЕ ТОЛЬКО ЧЕРЕЗ УМОЛЧАНИЯ КОМНАТЫ. Умолчания SDK
      // мержит со своими, и «мы же попросили в конструкторе» - это рассуждение, а не
      // гарантия: у аргумента приоритет выше, и он снимает вопрос целиком.
      await room.localParticipant.setMicrophoneEnabled(true, AUDIO_WANT);
    } catch (e) {
      sub('Не подключился');
      say('LiveKit: ' + (e && e.message || e), true);
      return;
    }
    connected = true;
    // ЗАПИСЬ МОГЛА НАЧАТЬСЯ ДО НАШЕГО ВХОДА, И ЭТО ГЛАВНЫЙ СЛУЧАЙ, РАДИ КОТОРОГО
    // индикатор живёт в метаданных: вошедший позже обязан узнать о записи сразу, а не
    // остаться единственным, кто о ней не знает.
    showRec(room.metadata);

    // ═══ ЧТО БРАУЗЕР ПРИМЕНИЛ НА САМОМ ДЕЛЕ ═══
    // Мы ПРОСИМ echoCancellation/noiseSuppression/autoGainControl в audioCaptureDefaults,
    // но просьба и факт - разные вещи: часть клиентов молча игнорирует флаг, а на части
    // платформ обработку делает ОС и браузер её отключает. Живой случай (Ren 25.08): у
    // собеседницы шёл РОВНЫЙ ГУЛ, с которым встроенное подавление обязано справляться, -
    // значит вопрос не «слабое ли оно», а «включилось ли вообще».
    // getSettings() отдаёт ПРИМЕНЁННЫЕ значения, и печатаем мы их НА СТРАНИЦЕ, а не в
    // консоль: до консоли на телефоне не добраться.
    function micTrack() {
      var pubs = room.localParticipant.trackPublications
              || room.localParticipant.tracks || new Map();
      var out = null;
      pubs.forEach(function (pub) {
        if (String(pub.source || '') !== 'microphone' || !pub.track) return;
        out = pub.track.mediaStreamTrack || null;
      });
      return out;
    }

    // ═══ ЧТО БРАУЗЕР ВООБЩЕ УМЕЕТ ═══
    // ЖИВОЙ ПРОГОН (Ren): «шумодав не сообщает · эхо вкл · громкость не сообщает · 96000 Гц
    // · до браузера дошло не то». Моя прежняя строка обвиняла НАС - будто флаги потерялись
    // по дороге. Но 96000 Гц это чистая улика: конвейер обработки Chrome работает на 48
    // кГц, и родная частота устройства означает, что обработки НЕТ ВОВСЕ. А `getSettings()`
    // молчит про noiseSuppression ровно тогда, когда браузер такого флага НЕ ЗНАЕТ (так
    // ведёт себя Safari: у него из трёх есть только echoCancellation).
    // ЗНАЧИТ ИСХОДОВ ТРИ, А НЕ ДВА, И ПУТАТЬ ИХ НЕЛЬЗЯ: «браузер не умеет» (лечится только
    // своим шумодавом, встроенного там нет в принципе), «умеет, но до него не дошло» (это
    // НАШ баг) и «дошло, но выключено» (чиним на месте). Одна фраза на три случая - ровно
    // та подмена причины, из-за которой мы уже теряли круги.
    function canDo(k) {
      try {
        var sup = (navigator.mediaDevices && navigator.mediaDevices.getSupportedConstraints)
          ? navigator.mediaDevices.getSupportedConstraints() : null;
        // НЕ СПРОСИТЬ - НЕ ЗНАЧИТ «НЕ УМЕЕТ». Отсутствие самого метода это отдельный
        // случай, и объявлять по нему браузер неумелым было бы выдумкой.
        return sup ? !!sup[k] : null;
      } catch (e) { return null; }
    }

    function flagLine(o) {
      var f = function (k) {
        if (k in o) return o[k] ? 'вкл' : 'ВЫКЛ';
        // ОТСУТСТВИЕ ПОЛЯ РАЗБИРАЕТСЯ ДО КОНЦА, а не сваливается в «не сообщает»: браузер,
        // который такого флага не знает, и браузер, который знает и молчит, - разные миры.
        var c = canDo(k);
        return c === false ? 'НЕ УМЕЕТ' : 'не сообщает';
      };
      // ═══ ГЛАВНОЕ - КТО ДАВИТ ШУМ ПРЯМО СЕЙЧАС, А НЕ ПЕРЕЧЕНЬ ФЛАГОВ ═══
      // ЖИВОЙ ПРОГОН REN 26.08 (вторая половина): строка раздулась и повторяла одно и то же
      // трижды - «встроенный шумодав НЕ УМЕЕТ», потом «браузер НЕ УМЕЕТ: noiseSuppression»,
      // потом «встроенного подавления тут нет». Три формулировки одного факта не добавляют
      // ничего, кроме длины, и в них теряется ответ на единственный вопрос: слышно ли меня
      // нормально. Отсюда правило: СУТЬ ОДНОЙ СТРОКОЙ, подробности - только когда что-то
      // не работает.
      // ИМЯ ТОГО, КТО РАБОТАЕТ, А НЕ СПИСОК ТОГО, ЧЕГО НЕТ: «шумодав: RNNoise» отвечает
      // сразу и на «есть ли он», и на «чей он».
      var _ns = RNN_ON ? 'RNNoise' : f('noiseSuppression');
      return 'шумодав: ' + _ns + ' · эхо ' + f('echoCancellation')
        + ' · ' + (o.sampleRate ? Math.round(o.sampleRate / 1000) + ' кГц' : '? кГц');
    }

    // ═══ НАШ ШУМОДАВ - СВОЯ СТРОКА, И ОНА ПЕРЕРИСОВЫВАЕТСЯ ПО ТАПУ ═══
    // Состояние браузера меряется один раз при захвате, а наш RNNoise человек включает и
    // выключает - значит строка обязана следовать за ним, иначе она отвечает на вчерашний
    // вопрос. Текст храним отдельно от браузерной части: смешав их в одну строку, мы
    // получили бы то же самое, только длиннее.
    // ХРАНИМ ИСХОДНЫЕ НАСТРОЙКИ, А НЕ ГОТОВУЮ СТРОКУ. Строка зависит от `RNN_ON` (кто
    // именно давит шум), а он меняется по кнопке - сохранённый текст отвечал бы на
    // вчерашний вопрос, и мы получили бы ровно ту поломку, которую чиним.
    var AUDIO_GOT = null;
    var AUDIO_TXT = '';

    // ВТОРАЯ СТРОКА - ТОЛЬКО КОГДА ЕСТЬ ЧТО СКАЗАТЬ. Совет уйти в обычный браузер нужен,
    // ПОКА наш шумодав выключен; после включения он предлагает лечить то, что уже вылечено
    // (замечание Ren). Подробности про флаги - тоже только при поломке.
    var AUDIO_HINT = '';

    function paintAudio() {
      var box = $('audiodbg');
      if (!box) return;
      if (AUDIO_GOT) AUDIO_TXT = flagLine(AUDIO_GOT);
      box.textContent = AUDIO_TXT + (RNN_ON ? '' : (AUDIO_HINT ? '\n' + AUDIO_HINT : ''));
    }

    async function audioFacts() {
      var box = $('audiodbg');
      try {
        var ms = micTrack();
        if (!ms) { box.textContent = 'микрофон ещё не опубликован'; return; }

        // ═══ ЧТО МЫ ПОПРОСИЛИ У БРАУЗЕРА НА САМОМ ДЕЛЕ ═══
        // getConstraints() отдаёт то, с чем дорожка реально захвачена, AUDIO_WANT - то,
        // что мы просили. Расходятся ПРИ ПОДДЕРЖИВАЕМОМ флаге - значит между нами и
        // браузером кто-то вмешался, и это НАШ баг. Расходятся при неподдерживаемом -
        // это свойство браузера, и кричать тут не о чем.
        var asked = {};
        try { asked = (ms.getConstraints && ms.getConstraints()) || {}; } catch (e) {}
        var lost = [], cant = [];
        AUDIO_MUST.forEach(function (k) {
          var sup = canDo(k);
          if (sup === false) { cant.push(k); return; }
          if (!(k in asked)) { if (sup) lost.push(k + ': не дошло'); return; }
          var v = (asked[k] && typeof asked[k] === 'object') ? asked[k].ideal : asked[k];
          if (v !== AUDIO_WANT[k]) lost.push(k + ': просили ' + AUDIO_WANT[k] + ', ушло ' + v);
        });

        var got = (ms.getSettings && ms.getSettings()) || {};
        // ═══ ПРИМЕНИЛОСЬ НЕ ТО - ЧИНИМ, А НЕ КОНСТАТИРУЕМ ═══
        // Живой случай (Ren): ровный гул, с которым встроенное подавление обязано
        // справляться. Значит вопрос был не «слабое ли оно», а «включилось ли вообще»;
        // если браузер сказал ВЫКЛ, у нас есть ровно один законный ход - попросить ещё
        // раз через applyConstraints и СКАЗАТЬ, помогло ли.
        var bad = AUDIO_MUST.filter(function (k) { return (k in got) && !got[k]; });
        var fixed = '';
        if (bad.length && ms.applyConstraints) {
          try {
            await ms.applyConstraints(AUDIO_WANT);
            got = (ms.getSettings && ms.getSettings()) || got;
            var still = bad.filter(function (k) { return (k in got) && !got[k]; });
            fixed = still.length ? (' · чинил, НЕ ПОМОГЛО: ' + still.join(', '))
                                 : ' · было выключено, включил на ходу';
          } catch (e) {
            fixed = ' · починить не дал: ' + (e && e.name || e);
          }
        }

        // ЧАСТОТА И КАНАЛЫ - УЛИКА, А НЕ УКРАШЕНИЕ: конвейер обработки Chrome работает на
        // 48 кГц, и родная частота устройства (96 кГц у внешних карт) означает сырой
        // захват без обработки. Мы sampleRate/channelCount НЕ ЗАДАЁМ НИГДЕ - это видно по
        // AUDIO_WANT, - поэтому цифра говорит о выборе браузера, а не о нашей просьбе.
        // СУТЬ - ПЕРВОЙ СТРОКОЙ И КОРОТКО. Подробности приписываются ТОЛЬКО когда что-то
        // не так: на исправном звуке человеку не нужен перечень применённых флагов.
        AUDIO_GOT = got;
        AUDIO_TXT = flagLine(got);
        AUDIO_HINT = '';
        if (fixed) AUDIO_HINT += fixed.replace(/^ · /, '');
        if (lost.length) {
          AUDIO_HINT += (AUDIO_HINT ? ' · ' : '')
            + '⚠️ НАШ БАГ, не дошло до браузера (' + lost.join('; ') + ')';
        }

        // ═══ СВОЙ ШУМОДАВ ПРЕДЛАГАЕМ ТОЛЬКО ТАМ, ГДЕ ВСТРОЕННОГО НЕТ ═══
        // Умеет браузер - берём встроенное: оно работает в одном контуре с эхо и АРУ,
        // стоит дешевле и не греет телефон. Кнопка «подавить шум» рядом с уже работающим
        // подавлением была бы предложением обработать сигнал дважды.
        var noNS = canDo('noiseSuppression') === false;
        var rnnBtn = $('rnn');
        if (noNS && rnnBtn) {
          rnnBtn.style.display = '';
          rnnBtn.onclick = function () { rnnToggle(rnnBtn); };
          // ЧЕСТНЫЙ СОВЕТ, А НЕ ТОЛЬКО КНОПКА (требование Ren): у нашего шумодава своя
          // цена, а браузер ту же работу делает лучше и даром. Человек вправе выбрать.
          // СОВЕТ ЖИВЁТ ВО ВТОРОЙ СТРОКЕ И ГАСНЕТ, КОГДА RNNoise ВКЛЮЧЁН: предлагать уйти
          // в браузер человеку, который уже включил наш шумодав, - это предлагать лечить
          // вылеченное (замечание Ren).
          AUDIO_HINT += (AUDIO_HINT ? ' · ' : '')
            + 'встроенного подавления тут нет: включи «Подавить шум» либо открой комнату '
            + 'в обычном браузере - там оно есть и работает лучше';
        }

    }

    // fetch, ни importScripts - оттуда его не достать никак.
    async function rnnBytes() {
      var r = await fetch(new URL('rnnoise.wasm', location.href).href, { cache: 'force-cache' });
      if (!r.ok) throw new Error('rnnoise.wasm: HTTP ' + r.status);
      return await r.arrayBuffer();
    }

    // КОД ОБРАБОТЧИКА ЖИВЁТ СТРОКОЙ И ГРУЗИТСЯ ЧЕРЕЗ Blob: отдельный файл пришлось бы
    // выкладывать третьим артефактом и держать в согласии со страницей - лишний способ
    // разъехаться (класс «страница и Worker выкладываются разными командами»).
    var RNN_WORKLET = `
class RnnProc extends AudioWorkletProcessor {
  constructor(opts) {
    super();
    this.N = 480;              // RNNoise работает кадрами по 480 сэмплов при 48 кГц
    this.inBuf = new Float32Array(0);
    this.outBuf = new Float32Array(0);
    this.ready = false;
    this.bypass = false;
    const bytes = opts.processorOptions.wasm;
    // ДВА ИМПОРТА, И ВТОРОЙ - НАСТОЯЩИЙ memcpy. Заглушка-пустышка «работала» и давала
    // правдоподобные числа на проверке в node: копирования не было, а вывод выглядел
    // верным. Проба, не воспроизводящая контракт, врёт убедительнее отсутствующей.
    WebAssembly.instantiate(bytes, { a: {
      a: () => 0,
      b: (dst, src, n) => {
        new Uint8Array(this.mem.buffer).copyWithin(dst, src, src + n);
        return dst;
      },
    } }).then((res) => {
      const e = res.instance.exports;
      this.e = e; this.mem = e.c;
      if (e.d) e.d();
      this.st = e.f();          // rnnoise_create
      this.ptr = e.g(this.N * 4);
      this.ready = true;
      this.port.postMessage({ ready: true });
    }).catch((err) => {
      // НЕ СОБРАЛОСЬ - ПРОПУСКАЕМ ЗВУК КАК ЕСТЬ И ГОВОРИМ ОБ ЭТОМ. Молчащий процессор
      // означал бы тишину в комнате, а это хуже любого шума.
      this.bypass = true;
      this.port.postMessage({ error: String(err && err.message || err) });
    });
  }
  process(inputs, outputs) {
    const inp = inputs[0], out = outputs[0];
    if (!inp || !inp[0] || !out || !out[0]) return true;
    const src = inp[0], dst = out[0];
    if (this.bypass || !this.ready) { dst.set(src); return true; }
    // КВАНТ WEBAUDIO - 128 СЭМПЛОВ, КАДР RNNOISE - 480: без буфера они не сходятся ни
    // при каком раскладе, и «почти работает» тут означает треск.
    const merged = new Float32Array(this.inBuf.length + src.length);
    merged.set(this.inBuf); merged.set(src, this.inBuf.length);
    this.inBuf = merged;
    while (this.inBuf.length >= this.N) {
      const frame = this.inBuf.subarray(0, this.N);
      const h = new Float32Array(this.mem.buffer, this.ptr, this.N);
      // RNNoise ЖДЁТ МАСШТАБ int16, А WEBAUDIO ДАЁТ [-1,1]. Без множителя модель видит
      // сигнал в 32 тысячи раз тише и считает его тишиной - то есть глушит всё.
      for (let i = 0; i < this.N; i++) h[i] = frame[i] * 32768;
      this.e.j(this.st, this.ptr, this.ptr);
      const o = new Float32Array(this.mem.buffer, this.ptr, this.N);
      const chunk = new Float32Array(this.N);
      for (let i = 0; i < this.N; i++) chunk[i] = o[i] / 32768;
      const grown = new Float32Array(this.outBuf.length + this.N);
      grown.set(this.outBuf); grown.set(chunk, this.outBuf.length);
      this.outBuf = grown;
      this.inBuf = this.inBuf.subarray(this.N);
    }
    if (this.outBuf.length >= dst.length) {
      dst.set(this.outBuf.subarray(0, dst.length));
      this.outBuf = this.outBuf.subarray(dst.length);
    } else {
      // ПЕРВЫЕ КВАНТЫ ВЫХОДА ЕЩЁ НЕТ - ОТДАЁМ ТИШИНУ, А НЕ СЫРОЙ ВХОД: подмешать
      // необработанный кусок значит вернуть тот самый шум ровно на старте.
      dst.fill(0);
    }
    return true;
  }
}
registerProcessor('rnn-denoise', RnnProc);
`;

    // ПРОЦЕССОР В ФОРМЕ, КОТОРУЮ ЖДЁТ LIVEKIT: init/processedTrack/destroy.
    function rnnProcessor(bytes) {
      var node = null, ctx = null, srcNode = null, dstNode = null, ownCtx = null;
      return {
        name: 'rnnoise',
        async init(opts) {
          // ═══ 48 кГц ДЕЛАЕМ САМИ, А НЕ ТРЕБУЕМ ОТ ЧУЖОГО КОНТЕКСТА ═══
          // ЖИВОЙ ОТКАЗ REN 26.08: «нужен 48 кГц, а контекст на 96000 - звук идёт как
          // был». Десктопный Telegram отдаёт контекст на 96 кГц, и на Маке подавления не
          // было НИ ОДНИМ способом: встроенного там нет вовсе, а наш отказывался.
          // 48 кГц - УСЛОВИЕ РАБОТЫ МОДЕЛИ, а не пожелание: она обучена на кадрах 480
          // сэмплов при 48 кГц, и на другой частоте это не «чуть хуже», а другой звук.
          // РЕСЕМПЛИТ БРАУЗЕР, А НЕ МЫ: `createMediaStreamSource` на контексте с ДРУГОЙ
          // частотой пересчитывает поток сам, штатно и без нашего кода. Писать ресемплер
          // в worklet значило бы завести свою копию того, что платформа уже делает.
          // ПОРЯДОК ЗНАЧИМ: СПЕРВА ЧУЖОЙ, ЕСЛИ ОН УЖЕ ГОДЕН. На клиентах, где контекст
          // LiveKit и так 48 кГц (обычный браузер), поведение остаётся ПРЕЖНИМ бит-в-бит, и
          // второго звукового контекста мы не заводим вовсе - лишний контекст это лишний
          // ресемплер, лишняя память и лишний способ сломаться там, где всё работало.
          ctx = null;
          if (opts.audioContext && opts.audioContext.sampleRate === 48000) {
            ctx = opts.audioContext;
          }
          if (!ctx) {
            try {
              var _own = new (window.AudioContext || window.webkitAudioContext)(
                { sampleRate: 48000 });
              // ПРОВЕРЯЕМ ФАКТ, А НЕ ПРОСЬБУ: часть браузеров молча отдаёт контекст на
              // своей частоте, проигнорировав аргумент, - и тогда мы получили бы ту же
              // поломку, только без сообщения.
              if (_own.sampleRate === 48000) { ctx = _own; ownCtx = _own; }
              else { try { _own.close(); } catch (e) {} }
            } catch (e) {
              // Браузер отказал в частоте - скажем об этом ниже, честной строкой.
            }
          }
          if (!ctx || ctx.sampleRate !== 48000) {
            // ОТКАЗ НАЗЫВАЕТ ЧАСТОТУ, КОТОРАЯ У ЧЕЛОВЕКА ЕСТЬ, а не наш внутренний null:
            // «нужен 48, а у тебя 96» - это факт, с которым можно что-то делать, «получилось
            // null» - наша кухня.
            var _have = (ctx && ctx.sampleRate)
              || (opts.audioContext && opts.audioContext.sampleRate) || '?';
            throw new Error('нужен 48 кГц, а тут ' + _have
                            + ' - браузер не дал пересчитать');
          }
          // СВОЙ КОНТЕКСТ НАДО РАЗБУДИТЬ: созданный до жеста человека он стоит suspended, и
          // дорожка молчала бы при полностью исправной цепочке.
          if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
          var url = URL.createObjectURL(new Blob([RNN_WORKLET], { type: 'text/javascript' }));
          try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
          node = new AudioWorkletNode(ctx, 'rnn-denoise', {
            numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1],
            processorOptions: { wasm: bytes },
          });
          node.port.onmessage = function (ev) {
            if (ev.data && ev.data.error) say('Шумодав не собрался: ' + ev.data.error
                                              + ' - звук идёт как был.', true);
          };
          srcNode = ctx.createMediaStreamSource(new MediaStream([opts.track]));
          dstNode = ctx.createMediaStreamDestination();
          srcNode.connect(node); node.connect(dstNode);
          this.processedTrack = dstNode.stream.getAudioTracks()[0];
        },
        async restart(opts) { await this.destroy(); await this.init(opts); },
        async destroy() {
          try { srcNode && srcNode.disconnect(); } catch (e) {}
          try { node && node.disconnect(); } catch (e) {}
          // СВОЙ КОНТЕКСТ ЗАКРЫВАЕМ, ЧУЖОЙ - НИКОГДА: контекст LiveKit держит весь звук
          // комнаты, и закрыв его, мы оглушили бы человека целиком.
          if (ownCtx) { try { ownCtx.close(); } catch (e) {} }
          node = srcNode = dstNode = ownCtx = ctx = null;
        },
      };
    }

    async function rnnToggle(btn) {
      var pub = null;
      room.localParticipant.trackPublications.forEach(function (p) {
        if (String(p.source || '') === 'microphone' && p.track) pub = p;
      });
      if (!pub || !pub.track.setProcessor) {
        say('Этот клиент не умеет подключать шумодав к дорожке.', true); return;
      }
      btn.disabled = true;
      try {
        if (RNN_ON) {
          await pub.track.stopProcessor();
          RNN_ON = false;
          say('Шумодав выключен.');
        } else {
          say('Включаю шумодав, это пара секунд…');
          await pub.track.setProcessor(rnnProcessor(await rnnBytes()));
          RNN_ON = true;
          say('Шумодав включён. Если станет глухо - выключи той же кнопкой.');
        }
      } catch (e) {
        // ОСТАЁМСЯ НА ИСХОДНОЙ ДОРОЖКЕ: шум мешает, тишина означает «меня нет».
        RNN_ON = false;
        say('Шумодав не включился: ' + (e && e.message || e) + ' - звук идёт как был.', true);
      }
      btn.classList.toggle('on', RNN_ON);
      btn.textContent = RNN_ON ? '🔊 Выключить шумодав' : '🔇 Подавить шум';
      btn.disabled = false;
      // СТРОКА СЛЕДУЕТ ЗА СОСТОЯНИЕМ, А НЕ ЗА ПОРЯДКОМ СТРОК. Без этого человек включал
      // шумодав и продолжал читать, что шумодава нет: строка меряет БРАУЗЕР и обновляется
      // один раз при захвате, а наш RNNoise живёт по кнопке.
      paintAudio();
    }

    // ═══ ПОКАЗ ЭКРАНА: КНОПКА ПО НАЛИЧИЮ МЕТОДА, А НЕ ПО ПЛАТФОРМЕ ═══
    // Живая проба (Ren 24.08): desktop отдаёт поток 2880x1448@30 со звуком вкладки,
    // Android - метода getDisplayMedia НЕТ ВООБЩЕ. Это не отказ в разрешении, а
    // отсутствие API: подсказывать нечего, включать нечего.
    // ПРОВЕРЯЕМ МЕТОД, А НЕ UserAgent: UA врёт (режим «для компьютеров» на телефоне),
    // наличие метода - факт.
    var md = navigator.mediaDevices || {};

    // Второе без первого бесполезно, первое без второго ВИСНЕТ вместо отказа.
    var g = grantOf(j.token), srcs = g.canPublishSources || [];
    var mayScreen = srcs.indexOf('screen_share') >= 0, mayCam = srcs.indexOf('camera') >= 0;
    // ═══ ЭКРАН - ТОЛЬКО ГДЕ ЕСТЬ МЕТОД, КАМЕРА - ВЕЗДЕ ═══
    // Прежняя редакция показывала камеру ТОЛЬКО там, где нет экрана, - как замену. Это
    // неверно: с компьютера тоже надо показать себя, особенно когда экран показывать
    // нечего. Делить по устройству оправдано лишь у экрана, где метода физически нет.
    var canScreen = !!md.getDisplayMedia && mayScreen;
    var canCam = !!md.getUserMedia && mayCam;
    var showBtn = $('show'), camBtn = $('cam');

    if (!mayScreen && !mayCam) {
      // ГЛАВНОЕ СООБЩЕНИЕ ЭТОГО ЭКРАНА: причина НЕ в браузере и не в комнате.
      $('showhint').textContent = 'Показ выключен на сервере: токен выдан без права '
        + 'публикации. Это у нас - Worker выложен старой версией, лечится '
        + 'worker_deploy.deploy(). Смотреть чужой экран при этом можно.';
    } else {
      if (canScreen) showBtn.style.display = '';
      if (canCam) camBtn.style.display = '';
      $('showhint').textContent = canScreen
        ? 'Смотреть чужой экран можно откуда угодно, показывать - с компьютера.'

          + 'браузеров. Запись экрана можно снять системой и прислать файлом в чат. '
          + 'Камера и просмотр чужого экрана работают отсюда.';
    }
    showBtn.textContent = '🖥 Показать экран';

    // ═══ ОДНА ДВЕРЬ НА ОБА ПОКАЗА, РАЗНЫЕ ТОЛЬКО ИСТОЧНИК И ПОДПИСЬ ═══
    // Две копии «включить/выключить» разошлись бы на первой правке (закон №40), а тут
    // цена расхождения - висящая дорожка, которую видно СОСЕДЯМ, а не нам.
    function toggler(btn, kind, onLabel, offLabel) {

          try {

            // `unpublishTrack(sharing)`, где `sharing` было БУЛЕВЫМ - в SDK уезжало
            // `true` вместо дорожки, и публикация не снималась ВООБЩЕ: у себя кнопка
            // менялась, у соседей картинка оставалась (живой отказ Ren 25.08). Отсюда же
            // рос второй симптом - старый поток не освобождался, и следующий выбор

            // дорожки (пока публикации ещё на месте), потом отключаем источник: наоборот
            // `setScreenShareEnabled(false)` уже снял публикации, и явная остановка
            // работала ВХОЛОСТУЮ - счётчик остановленных дорожек показывал ноль.
            // Незакрытая дорожка держит захват, браузер считает источник занятым, и
            // следующий выбор источника ведёт себя непредсказуемо (живой отказ Ren 25.08).
            stopLocalMedia(kind);
            if (kind === 'screen') await room.localParticipant.setScreenShareEnabled(false);

          } catch (e) {
            say('Не удалось остановить показ: ' + (e && e.message || e), true);

          var pub = (kind === 'screen')
            // ПОТОЛОК КАРТИНКИ ЗАДАН НАРОЧНО: 2880x1448@30 это десятки мегабит, а комната
            // живёт на общем канале песочницы. Читаемость текста даёт и 1080p.
            ? room.localParticipant.setScreenShareEnabled(

            : room.localParticipant.setCameraEnabled(true);

          stopLocalMedia(kind);          // чтобы неудача не оставила захват висеть
          live = false; btn.classList.remove('on'); btn.textContent = offLabel;
          say('Показать не вышло (' + (e && e.name || 'ошибка') + '): '
              + (e && e.message || e), true);
        }
      };
    }

    // вкладки), и забытая вторая держит захват.
    function stopLocalMedia(kind) {
      try {
        var pubs = room.localParticipant.trackPublications
                || room.localParticipant.tracks || new Map();
        pubs.forEach(function (pub) {
          var src = String(pub.source || '');
          var mine = (kind === 'screen')
            ? (src.indexOf('screen') >= 0)
            : (src === 'camera');
          if (!mine || !pub.track) return;
          try { pub.track.stop(); } catch (e) {}
          var ms = pub.track.mediaStreamTrack;
          if (ms) { try { ms.stop(); } catch (e) {} }

      } catch (e) {}
    }

    toggler(showBtn, 'screen', '⏹ Остановить показ', '🖥 Показать экран');
    toggler(camBtn, 'camera', '⏹ Выключить камеру', '📷 Показать камеру');

    // ═══ РУКА И ОЧЕРЕДЬ СЛОВА - ПО КАНАЛУ ДАННЫХ LIVEKIT ═══
    // Он идёт по тому же соединению, что звук: это на порядок быстрее опроса нашего ящика
    // раз в 1.2-3 секунды, и ради трёх кнопок второй транспорт заводить незачем.
    var handUp = false;
    function send(obj) {
      try {
        room.localParticipant.publishData(
          new TextEncoder().encode(JSON.stringify(obj)), { reliable: true });
      } catch (e) {}
    }
    $('hand').onclick = function () {
      handUp = !handUp;
      $('hand').classList.toggle('on', handUp);
      $('hand').textContent = handUp ? '✋ Опустить руку' : '✋ Поднять руку';
      upsert(room.localParticipant.identity, { hand: handUp ? Date.now() : 0 });
      send({ t: 'hand', up: handUp });
    };
    // ЗАГЛУШИТЬ ВСЕХ - ПРОСЬБА, А НЕ ПРИКАЗ, И ЭТО СКАЗАНО ЧЕСТНО. Серверного «замолчи»
    // мы не шлём: для него нужен админский грант у каждого, а это право выключать чужой
    // микрофон кому угодно. Клиенты глушат СЕБЯ сами; тот, кто не захочет, останется
    // слышен - для лекции этого достаточно, для принуждения нет.
    $('hush').style.display = '';
    $('hush').onclick = function () { send({ t: 'hush' }); say('Попросил всех приглушиться.'); };

    // ═══ ЗАПИСЬ: КНОПКА ЖМЁТ БОТА, А НЕ LIVEKIT ═══
    // Ключом от Egress владеет БОТ - он же потом идёт за файлами и сшивает транскрипт.
    // Дай мы это право странице или Worker'у, ответ на вопрос «кто управляет записью»
    // стал бы двойным. Отсюда путь: сигнал в ящик -> бот забирает (1.2-3 с) -> кладёт
    // ответ -> мы его показываем. Задержку НАЗЫВАЕМ, а не прячем за крутилкой.
    // ВЕБ-ГОСТЮ КНОПКИ НЕТ ВОВСЕ: ящик принимает только подпись Telegram, и кнопка,
    // которая молча ничего не делает, хуже отсутствующей.
    // КНОПКА ЕСТЬ ТОЛЬКО ТАМ, ГДЕ ЕЙ ЕСТЬ ЧЕМ ОТВЕТИТЬ. Живой прогон Ren: Egress отдавал
    // 401, кнопка стояла на месте, и каждый тап давал непонятную ошибку. Обещание без
    // механизма хуже отсутствия функции. Но и молча исчезнуть она не имеет права -
    // исчезнувшая кнопка читается как «функции нет вовсе» (закон №36), поэтому причина
    // стоит СТРОКОЙ. Признак приезжает вместе с токеном, лишнего запроса нет.
    var canRec = CAPS ? CAPS.record : null;
    if (initData && canRec !== true) {
      var w = (CAPS && CAPS.why) || 'бот не сообщил, работает ли запись';
      $('recwhy').textContent = 'Записать созвон сейчас нельзя: ' + w
        + '. Кнопки поэтому нет - она бы обещала то, чего нет.';
    }
    if (initData && canRec === true) {
      var recBtn = $('rec');
      recBtn.style.display = '';
      showRec();          // кнопка появилась - подпись обязана отвечать состоянию комнаты
      recBtn.onclick = async function () {
        recBtn.disabled = true;
        say(recOn ? 'Останавливаю запись…' : 'Прошу бота начать запись…');
        await ask({ kind: 'rtcrec', room: ROOM });
        recBtn.disabled = false;
      };
    }

    // ОДНА ДВЕРЬ «ПОЛОЖИТЬ СИГНАЛ И ДОЖДАТЬСЯ ОТВЕТА» НА ВСЕ КНОПКИ КОМНАТЫ. Две копии
    // этого круга разошлись бы на первой правке - например, одна научилась бы объяснять
    // `bad_kind`, а вторая продолжала бы показывать человеку машинный код (закон №40).
    async function ask(body) {
      try {
        var r = await fetch(API + '/signal', {
          method: 'POST',
          headers: { 'X-Init-Data': initData, 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        var j = await r.json();
        if (!r.ok || !j || !j.id) {
          // ДВА РАЗНЫХ МИРА ПОД ОДНИМ КОДОМ 400. `bad_kind` означает, что Worker выложен
          // СТАРОЙ версией и про эту кнопку не знает вовсе, - это у нас, лечится деплоем,
          // и человеку незачем гадать. Тот же класс, что уже дважды стоил круга: страница
          // и Worker выкладываются разными командами.
          var why = (j && (j.why || j.error)) || 'без причины';
          say(why === 'bad_kind'
              ? 'Эта кнопка не подключена: Worker выложен старой версией и про неё не '
                + 'знает. Это у нас - worker_deploy.deploy().'
              : 'Бот не принял просьбу (' + r.status + '): ' + why, true);
          return false;
        }
        // ОТВЕТ БОТА ВОЗВРАЩАЕТСЯ НАВЕРХ ЦЕЛИКОМ: каталогу станций нужен не факт
        // «дошло», а сами данные. Раньше дверь отдавала true/false, и второй вызывающий
        // завёл бы себе свой круг опроса - две копии разошлись бы на первой правке.
        return await waitRec(j.id);
      } catch (e) {
        say('Не достучался до бота: ' + (e && e.message || e), true);
        return false;
      }
    }

    // ═══ РАДИО В КОМНАТУ: ТОТ ЖЕ ЯЩИК, ЧТО У ЗАПИСИ ═══
    // СТАНЦИЮ ИЩЕТ БОТ, А НЕ МЫ. Отсюда уезжает самое большее НАЗВАНИЕ; адрес потока
    // резолвится на нашей стороне тем же каталогом, что питает Медиаплеер. Пусти мы
    // адрес из аппки - белый список источников (что вообще можно публиковать в комнату)
    // обходился бы одной строкой в консоли.
    if (initData) {
      var djBtn = $('dj');
      djBtn.style.display = '';
      showRec();
      djBtn.onclick = async function () {
        if (djOn) {
          djBtn.disabled = true;
          say('Выключаю радио…');
          await ask({ kind: 'rtcdj', room: ROOM });
          djBtn.disabled = false;
          return;
        }
        // НЕ СПРАШИВАЕМ БУКВЫ ТАМ, ГДЕ ЕСТЬ СПИСОК. Ввод названия руками был работой,
        // переложенной на человека: у нас есть готовый каталог со странами, жанрами,
        // обложками и его же избранным.
        var panel = $('radio');
        if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
        panel.style.display = '';
        await openRadio('');
      };
      // ═══ ПОИСК: ЖДЁМ, ПОКА ЧЕЛОВЕК ДОПЕЧАТАЕТ ═══
      // Каждый запрос идёт ЧЕРЕЗ ЯЩИК (1.2-3 с), и посылать его на каждую букву значило бы
      // очередь из десяти просьб на слово «спокойное», из которых нужна последняя. Пауза
      // после последнего нажатия - и один запрос вместо десяти.
      var rqT = null;
      $('rq').oninput = function () {
        if (rqT) clearTimeout(rqT);
        var v = $('rq').value.trim();
        rqT = setTimeout(function () {
          // ПУСТАЯ СТРОКА - ЭТО НЕ ПОИСК ПУСТОТЫ, А ВОЗВРАТ К ФИЛЬТРАМ: человек стёр
          // запрос, и список обязан вернуться туда, откуда он ушёл.
          openRadio(v ? 'q:' + v : '');
        }, 600);
      };
    }

    // ═══ КАТАЛОГ СТАНЦИЙ: ФИЛЬТРЫ И СПИСОК ПРИЕЗЖАЮТ ОТ БОТА ═══
    // ПОДПИСИ ТОЖЕ ЕГО: он знает язык человека, а вторая таблица «страны и жанры» здесь
    // означала бы, что в комнате и в плеере со временем окажутся разные наборы.
    async function openRadio(key) {
      $('rnote').textContent = 'Спрашиваю каталог у бота, это пара секунд…';
      var res = await ask({ kind: 'rtcdj', room: ROOM, list: key || 'c:ru' });
      if (!res) { $('rnote').textContent = 'Каталог не приехал. Попробуй ещё раз.'; return; }
      var chips = $('rchips');
      chips.innerHTML = '';
      (res.chips || []).forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'chip' + (c.k === res.key ? ' on' : '');
        b.textContent = c.label;
        b.onclick = function () {
          // ТАП ПО ФИЛЬТРУ СТИРАЕТ ЗАПРОС. Иначе на экране одновременно «ищу Спокойное» и
          // подсвеченный чип «Джаз» - два разных ответа на вопрос «что я сейчас вижу».
          $('rq').value = '';
          openRadio(c.k);
        };
        chips.appendChild(b);
      });
      var list = $('rlist');
      list.innerHTML = '';
      (res.stations || []).forEach(function (st) {
        var b = document.createElement('button');
        b.className = 'wide station';
        // ОБЛОЖКА - УКРАШЕНИЕ, И ЕЁ ОТСУТСТВИЕ НЕ ИМЕЕТ ПРАВА ЛОМАТЬ СТРОКУ: битую
        // картинку прячем, а не оставляем пустой квадрат (тот же приём, что в плеере).
        if (st.fav) {
          var im = document.createElement('img');
          im.src = st.fav;
          im.onerror = function () { im.style.display = 'none'; };
          b.appendChild(im);
        }
        var sp = document.createElement('span');
        sp.textContent = st.name + (st.country ? ' · ' + st.country : '');
        b.appendChild(sp);
        b.onclick = async function () {
          $('rnote').textContent = 'Включаю ' + st.name + '…';
          // ЕДЕТ ИДЕНТИФИКАТОР, А НЕ АДРЕС: поток резолвит бот, и белый список
          // источников остаётся непроходимым.
          await ask({ kind: 'rtcdj', room: ROOM, st: st.id });
          $('radio').style.display = 'none';
        };
        list.appendChild(b);
      });
      // ПУСТО И «КАТАЛОГ МОЛЧИТ» - РАЗНЫЕ ВЕЩИ, И ОБЕ НАЗЫВАЮТСЯ СВОИМИ СЛОВАМИ.
      $('rnote').textContent = res.why
        || ((res.stations || []).length ? '' : 'Здесь пусто - выбери другой фильтр.');
    }

    // ОТВЕТ ЗАБИРАЕМ ИЗ ЯЩИКА, А НЕ СЧИТАЕМ РАБОТУ СДЕЛАННОЙ ПО ФАКТУ ОТПРАВКИ (закон
    // №35): «сигнал положен» и «бот записывает» - разные утверждения, и второе бывает
    // ложным (нет ключей, никто не включил микрофон, Egress не поднят).
    async function waitRec(id) {
      for (var i = 0; i < 20; i++) {
        await new Promise(function (ok) { setTimeout(ok, 1200); });
        var res = null;
        try {
          var rr = await fetch(API + '/result?id=' + encodeURIComponent(id),
                               { headers: { 'X-Init-Data': initData } });
          res = await rr.json();
        } catch (e) { continue; }
        if (!res || res.state !== 'done') continue;
        var note = (res.res && res.res.note) || '';
        if (note) say(note);
        return res.res || {};
      }
      // МОЛЧАНИЕ НАЗЫВАЕТСЯ МОЛЧАНИЕМ. Крутилка без конца читается как «сломалось», а
      // индикатор записи придёт сам, когда бот дойдёт: он живёт в метаданных комнаты.
      say('Бот пока не ответил. Если запись пойдёт, наверху появится красная строка.');
      return null;
    }

    room.on(LK.RoomEvent.DataReceived, function (payload, p) {
      var m = null;
      try { m = JSON.parse(new TextDecoder().decode(payload)); } catch (e) { return; }
      if (!m || !m.t) return;
      if (m.t === 'hand' && p) upsert(p.identity, { hand: m.up ? Date.now() : 0 });
      if (m.t === 'hush') {
        micOn = false;
        try { room.localParticipant.setMicrophoneEnabled(false); } catch (e) {}
        $('mic').textContent = '🎙 Включить микрофон';
        $('mic').classList.add('off');
        say('Ведущий попросил тишины - твой микрофон выключен.');
      }
    });

    upsert(room.localParticipant.identity, { name: 'Ты', me: true });
    room.remoteParticipants.forEach(function (p) {
      upsert(p.identity, { name: human(p.name, p.identity) });
    });
    draw();          // строку «В комнате: N» рисует draw(), чтобы счёт был один на всех
    say('');
  }

  $('mic').onclick = async function () {
    if (!room) return;
    micOn = !micOn;
    try { await room.localParticipant.setMicrophoneEnabled(micOn); } catch (e) {}
    $('mic').textContent = micOn ? '🎙 Выключить микрофон' : '🔇 Включить микрофон';
    $('mic').className = micOn ? '' : 'off';
    upsert(room.localParticipant.identity, { muted: !micOn });
  };
  $('out').onclick = async function () {
    try { if (room) await room.disconnect(); } catch (e) {}
    // ЗАКРЫВАЕМ АППКУ САМИ: человек, нажавший «Выйти», ждёт возврата в чат, а не пустого
    // экрана с надписью «отключился».
    try { if (tg && tg.close) tg.close(); } catch (e) {}
  };

  // ═══ ОБНОВЛЕНИЯ: СПРАШИВАЕМ WORKER'А, А НЕ ФАЙЛ РЯДОМ СО СТРАНИЦЕЙ ═══
  // ЗАЧЕМ ПЕРЕДЕЛАНО. Прежняя редакция читала `version.txt`, лежащий В ТОМ ЖЕ каталоге,
  // что и страница. Он попадает в ТОТ ЖЕ кэш вебвью и отвечает так же устарело - то есть
  // старая страница спрашивала у старого файла, свежа ли она, и получала «да».
  // Мы трое выгружали Telegram руками после каждой выкладки; человек, который не
  // закрывает приложение неделями, живёт со страницей двухнедельной давности и жалуется
  // на баги, которые мы давно починили. Worker - живой API на ДРУГОМ хосте, его ответ
  // вебвью не кэширует, и знает он ровно то, что мы ему сказали при деплое.
  //
  // ПРОВЕРКА ПРИ КАЖДОМ ОТКРЫТИИ, А НЕ РАЗ В СУТКИ: комнату открывают редко, и «раз в
  // сутки» на таком ритме означает «почти никогда».
  //
  // ТРИ ИСХОДА, И ОНИ РАЗНЫЕ ПО ДЕЙСТВИЮ:
  //   свежая        - работаем молча;
  //   есть новее    - ГОВОРИМ об этом и перезагружаемся с пробитием кэша. Молча моргнуть
  //                   страницей нельзя: человек не поймёт, что произошло;
  //   несовместимая - НЕ РАБОТАЕМ ВОВСЕ и говорим, что делать. Попытка «всё равно
  //                   попробовать» даёт отказы, выглядящие как поломка комнаты, - а это
  //                   ровно та подмена причины, из-за которой мы уже теряли круги.
  var RELOAD_KEY = 'hara_room_reloaded';

  function verdictVersion(j) {
    // ЧИСТАЯ ФУНКЦИЯ РЕШЕНИЯ: её и проверяет браузерная проба. Логика, размазанная по
    // колбэкам, проверяется только глазами, а глазами мы этот файл уже трижды читали
    // неверно.
    if (!j || j.error) return { act: 'skip' };          // Worker не знает - не мешаем
    var mine = Number(PAGE_CONTRACT), min = Number(j.min_page || 0);
    if (min && mine < min) return { act: 'dead' };
    var ver = String(j.ver || '').trim();
    if (!ver || VERSION.indexOf('{{') === 0 || ver === VERSION) return { act: 'ok' };
    var once = null;
    try { once = sessionStorage.getItem(RELOAD_KEY); } catch (e) {}
    // УЖЕ ПЕРЕЗАГРУЖАЛИСЬ РАДИ ЭТОЙ ВЕРСИИ И ВСЁ РАВНО СТАРЫЕ - значит сами себя обновить
    // НЕ МОЖЕМ (вебвью отдаёт свою копию). Второй круг перезагрузок ничего не изменит, а
    // человек будет смотреть на мигающий экран.
    if (once === ver) return { act: 'stuck', ver: ver };
    return { act: 'reload', ver: ver };
  }

  async function checkVersion() {
    var j = null;
    try {
      var r = await fetch(API + '/appver?app=room&t=' + encodeURIComponent(VERSION),
                          { cache: 'no-store' });
      j = await r.json();
    } catch (e) { j = null; }
    var v = verdictVersion(j);
    if (v.act === 'ok' || v.act === 'skip') return true;
    if (v.act === 'dead') {
      sub('Версия устарела');
      say('Эта страница старее, чем нужно серверу, и обновление её не вылечит. '
          + 'Закрой окно и открой комнату заново из бота - кнопка там всегда свежая.', true);
      return false;
    }
    if (v.act === 'stuck') {
      sub('Не могу обновиться сам');
      say('Есть свежая версия, но Telegram отдаёт мне свою старую копию. Закрой окно и '
          + 'открой комнату заново из бота; если не поможет - выгрузи Telegram из памяти.',
          true);
      return false;
    }
    // ГОВОРИМ ДО ТОГО, КАК МОРГНЁМ. Перезагрузка без объяснения читается как сбой.
    sub('Есть обновление');
    say('Обновляю страницу до свежей версии…');
    try { sessionStorage.setItem(RELOAD_KEY, v.ver); } catch (e) {}
    var _q = null;
    try { _q = new URLSearchParams(location.search); } catch (e) { _q = null; }
    if (_q) { _q.set('v', v.ver); }
    setTimeout(function () {
      location.replace(location.pathname + '?'
        + (_q ? _q.toString() : 'v=' + encodeURIComponent(v.ver)) + location.hash);
    }, 700);
    return false;
  }

  (async function () {
    // ПРОВЕРКА ВЕРСИИ ИДЁТ ДО ПОДКЛЮЧЕНИЯ, А НЕ ПАРАЛЛЕЛЬНО С НИМ: несовместимая страница
    // не должна успеть попросить токен - отказ приедет человеку раньше объяснения.
    if (await checkVersion()) await go();
  })();
})();
</script>
</body>
</html>
