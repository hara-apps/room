  // ═══ ГОТОВЫЙ СЭМПЛ СИЛЬНЕЕ СИНТЕЗА, И ЭТО РЕШЕНИЕ REN ═══
  // «Хлопки звучат как писк, гонг тихий - синтез не справляется». Он и не справится:
  // хлопок это запись комнаты, а не осциллятор. Поэтому рядом со страницей может лежать
  // `snd/<id>.ogg`, и он ВЫИГРЫВАЕТ у синтеза.
  // МАНИФЕСТ, А НЕ ПРОБА КАЖДОГО ФАЙЛА: восемь HEAD-запросов на открытие комнаты ради
  // «а есть ли» - это восемь лишних кругов и восемь способов ошибиться. `deploy_room`
  // собирает список из КАТАЛОГА, то есть по факту наличия, а не по нашей памяти.
  // ФАЙЛОВ МОЖЕТ НЕ БЫТЬ ВОВСЕ - тогда работает то, что есть, и ничего не ломается.
  var SND_BUF = {};                 // id -> AudioBuffer (или null, если не вышло)
  var SND_FILES = null;             // список id, для которых файл ЕСТЬ

  //: ПОЧЕМУ ИГРАЕТ СИНТЕЗ - ОБЯЗАНО БЫТЬ НАПИСАНО, А НЕ ВЫЯСНЯТЬСЯ УГАДЫВАНИЕМ.
  //: Три круга живых прогонов ушли на «файлы лежат, а играет синтез» ровно потому, что
  //: КАЖДЫЙ сбой этой цепочки был проглочен: `.catch(){}` у манифеста, `.catch(){}` у
  //: загрузки, и `SND_BUF[id] = null` без единого слова. Отсюда одна переменная, которую
  //: видно и человеку в строке состояния, и пробе.
  var SND_DIAG = '';
  function sndSay(why) {
    SND_DIAG = why;
    window.__SND_DIAG = why;              // шов для браузерной пробы
    try { console.log('[snd] ' + why); } catch (e) {}
    //: ПРИЧИНА ПРИЕЗЖАЕТ ПОЗЖЕ ПЕРВОЙ ОТРИСОВКИ (манифест асинхронный), поэтому строку
    //: надо ПЕРЕРИСОВАТЬ. Без этого она появлялась бы только со следующим изменением
    //: звука - то есть почти никогда.
    try { if (typeof window.__paintAudio === 'function') window.__paintAudio(); } catch (e) {}
  }

  function sndManifest() {
    if (SND_FILES !== null) return Promise.resolve(SND_FILES);
    return fetch('snd/index.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) { sndSay('манифест snd/index.json: HTTP ' + r.status); return []; }
        return r.json().catch(function (e) {
          //: НЕ-JSON ЗДЕСЬ ЗНАЧИТ, ЧТО НАМ ОТДАЛИ НЕ ТО (страницу-заглушку, ошибку CDN).
          //: Прежняя редакция схлопывала это в «файлов нет», то есть отсутствие файлов и
          //: сломанную выкладку было НЕЧЕМ различить.
          sndSay('манифест не разобрался (' + String(e && e.message || e).slice(0, 60)
                 + ') - похоже, по этому адресу лежит не JSON');
          return [];
        });
      })
      .catch(function (e) {
        sndSay('манифест не доехал: ' + String(e && e.message || e).slice(0, 60));
        return [];
      })
      .then(function (j) {
        if (!Array.isArray(j)) { sndSay('манифест не список - беру синтез'); j = []; }
        else if (!j.length && !SND_DIAG) sndSay('манифест пуст: файлов не выложено');
        SND_FILES = j;
        return SND_FILES;
      });
  }

  // ═══ ДВЕРЬ, КОТОРУЮ НАПИСАЛИ И НЕ ОТКРЫЛИ (живой отказ Ren 30.08) ═══
  // `clap.ogg` и `drum.ogg` выложены (`deploy_room`: «звуков файлами: 2», CDN отдаёт 200
  // audio/ogg), а в комнате играл СИНТЕЗ. Причина не в кэше и не в выкладке: `sndManifest`
  // не вызывался НИ ИЗ ОДНОГО места - `SND_FILES` навсегда оставался `null`, и ветка
  // загрузки файла в `playSnd` была недостижима по построению. Закон №47 наизнанку: имя
  // без вызова выглядит рабочим механизмом. Инвариант теперь требует именно ВЫЗОВА.
  // ГРУЗИМ ЗАРАНЕЕ, А НЕ НА ПЕРВОМ ТАПЕ: файлы крошечные, а «первый хлопок синтезом,
  // остальные файлом» - это тот же сбой, только реже и потому неуловимее.
  var _SND_BOOTED = false;
  function sndBoot() {
    if (_SND_BOOTED) return;
    _SND_BOOTED = true;
    sndManifest().then(function (ids) {
      if (!ids.length) return;                    // причину уже назвал `sndManifest`
      var ac = actx();
      if (!ac) {
        //: КОНТЕКСТА ЕЩЁ НЕТ - НО ВТОРОЙ ПУТЬ ЕГО И НЕ ТРЕБУЕТ. Прежняя редакция просто
        //: уходила молча, и до первого тапа файлы не готовились ничем.
        _SND_BOOTED = false;
        sndSay('звуковой контекст ещё не поднят - готовлю файлы медиа-элементом');
        ids.forEach(function (id) { if (SOUNDS[id]) sndTryEl(id); });
        return;
      }
      ids.forEach(function (id) { if (SOUNDS[id]) sndLoad(ac, id); });
    });
  }

  //: ═══ ДВА ПУТИ ДЕКОДИРОВАНИЯ, ПОТОМУ ЧТО ОДИН ЕСТЬ НЕ ВЕЗДЕ ═══
  //: `decodeAudioData` и `<audio>` - РАЗНЫЕ конвейеры браузера, и формат, который не
  //: берёт первый, второй иногда играет. Какой именно путь мёртв у Telegram на Mac, из
  //: контейнера не установить (CDN закрыт, закон №48), поэтому мы не гадаем, а пробуем
  //: оба и НАЗЫВАЕМ исход. Второй путь идёт мимо `_MASTER` - у медиа-элемента своя
  //: громкость, и это цена, а не недосмотр.
  //: ОТКАЗ БОЛЬШЕ НЕ ВЕЧЕН. Было `SND_BUF[id] = null`, а условие повтора - `=== undefined`:
  //: одна неудача (сеть моргнула на входе в комнату) убивала файл до перезахода. Теперь
  //: помечается ТОЛЬКО то, что повтором не лечится, - формат, который платформа не берёт.
  var SND_EL = {};                  // id -> HTMLAudioElement (второй путь)
  var SND_DEAD = {};                // id -> true: формат не берётся, повторять нечего
  var SND_EL_BAD = {};              // id -> true: элемент есть, а играть браузер не даёт

  //: ═══ КАКИМ ПУТЁМ ЗВУК ПРАВДА СЫГРАЛ - ФАКТ, А НЕ НАМЕРЕНИЕ ═══
  //: Живой отчёт «у нажавшего синтез, у остальных файл» невозможно проверить, пока
  //: страница не говорит, ЧТО она сделала. Путей три (буфер / элемент / синтез), и
  //: различить их со стороны человека нельзя - хлопок звучит хлопком. Строка нужна
  //: РОВНО для следующего живого прогона: она отвечает на «где расходится» одним
  //: взглядом, вместо ещё одного круга рассуждений (законы №35 и №48).
  var SND_LAST = '';
  function sndPath(how) {
    SND_LAST = how;
    window.__SND_LAST = how;              // шов для браузерной пробы
    try { console.log('[snd] сыграл: ' + how); } catch (e) {}
  }

  //: ═══ ЧТО ИМЕННО УШЛО В ДЕКОДЕР - ФАКТ, А НЕ ДОГАДКА (требование Ren, пятый круг) ═══
  //: «Decoding failed» одинаково звучит у четырёх разных бед: не тот адрес (по нему
  //: лежит HTML страницы 404), обрезанный ответ, чужой кодек, отказ самого декодера.
  //: Пять кругов подряд мы гадали, потому что страница не говорила НИЧЕГО о том, что
  //: она держала в руках.
  //: ЗАМЕР В КОНТЕЙНЕРЕ (боевым путём страницы, Chromium 1194, файлы из репо):
  //:   clap 24008 байт, `4f 67 67 53` = «OggS», audio/ogg -> декодировано 2.0 с, 44100
  //:   drum 23815 байт, то же самое -> декодировано
  //: то есть ни файл, ни этот код не виноваты, и расходится ОКРУЖЕНИЕ. Значит следующий
  //: живой прогон обязан принести цифры, а не ещё одно «не играется».
  //: ЛЕНТА УХОДИТ В `bot.log` (закон №1): на телефоне консоли нет, а разбор идёт грепом.
  function sndFacts(id, r, b) {
    var f = { id: id, url: '' };
    try { f.url = new URL('snd/' + id + '.ogg', location.href).href; } catch (e) {}
    if (r) {
      f.status = r.status;
      try { f.ct = r.headers.get('content-type') || ''; } catch (e) {}
      try { f.cl = r.headers.get('content-length') || ''; } catch (e) {}
    }
    if (b) {
      f.bytes = b.byteLength;
      try {
        var u = new Uint8Array(b.slice(0, 8));
        f.head = Array.prototype.map.call(u, function (x) {
          return ('0' + x.toString(16)).slice(-2); }).join(' ');
        f.ascii = String.fromCharCode.apply(null, u).replace(/[^ -~]/g, '.');
      } catch (e) {}
    }
    return f;
  }
  function sndTell(f, extra) {
    var t = 'звук ' + f.id + ': HTTP ' + (f.status === undefined ? '?' : f.status)
          + ' · ' + (f.ct || 'без типа') + ' · ' + (f.bytes === undefined ? '?' : f.bytes)
          + ' байт · первые ' + (f.ascii || '?') + ' [' + (f.head || '?') + ']'
          + (extra ? ' · ' + extra : '') + ' · ' + f.url;
    //: МЕТКА ЯВНАЯ: без неё строка уехала бы под ярлыком того, кто последним открыл
    //: ленту, и `grep "[диаг] звук"` не нашёл бы её ни при какой исправности звука.
    try { diag(t, 'звук'); } catch (e) {}
    try { console.log('[snd] ' + t); } catch (e) {}
    return t;
  }

  function sndLoad(ac, id) {
    if (SND_BUF[id] !== undefined && SND_BUF[id] !== null) {
      return Promise.resolve(SND_BUF[id]);
    }
    if (SND_DEAD[id]) return Promise.resolve(null);
    var _r = null;
    return fetch('snd/' + id + '.ogg')
      .then(function (r) {
        _r = r;
        if (!r.ok) return Promise.reject(new Error('HTTP ' + r.status));
        return r.arrayBuffer();
      })
      .then(function (b) {
        if (!b || !b.byteLength) return Promise.reject(new Error('пустой файл'));
        //: ПЕРВЫЕ БАЙТЫ РЕШАЮТ БОЛЬШЕ, ЧЕМ ТИП ОТВЕТА: `OggS` - это звук, `<!do` - это
        //: страница вместо него, и второе означает НЕ ТОТ АДРЕС, а не «формат не тот».
        //: Названная причина здесь стоит дороже, чем ещё одна попытка.
        var f = sndFacts(id, _r, b);
        if (f.ascii && f.ascii.slice(0, 4) !== 'OggS') {
          sndTell(f, 'это НЕ ogg');
          sndSay('по адресу звука ' + id + ' лежит не звук (' + f.ascii.slice(0, 4)
                 + ') - адрес не тот, а не формат');
          return Promise.reject(new Error('не ogg: ' + f.ascii.slice(0, 4)));
        }
        window.__SND_FACTS = f;
        return ac.decodeAudioData(b).then(function (buf) {
          sndTell(f, 'декодирован: ' + buf.duration.toFixed(2) + ' с');
          return buf;
        }, function (e) {
          sndTell(f, 'decodeAudioData отказал: ' + (e && e.name || '?') + ' '
                     + (e && e.message || e) + ' · контекст ' + ac.sampleRate + ' Гц');
          return Promise.reject(e);
        });
      })
      .then(function (buf) { SND_BUF[id] = buf; return buf; })
      .catch(function (e) {
        var m = String((e && e.message) || e).slice(0, 70);
        //: НЕ ДЕКОДИРУЕТСЯ - ПРОБУЕМ МЕДИА-ЭЛЕМЕНТОМ. Если и он не берётся, формат тут
        //: не играется ничем, и это ОТДЕЛЬНЫЙ факт, который надо сказать вслух.
        return sndTryEl(id).then(function (ok) {
          if (ok) { sndSay('файл ' + id + ' не декодируется WebAudio (' + m
                           + '), играю его через <audio>'); return null; }
          SND_DEAD[id] = true;
          SND_BUF[id] = null;
          sndSay('файл ' + id + ' не играется ни WebAudio, ни <audio> (' + m
                 + ') - остаётся синтез');
          return null;
        });
      });
  }

  //: ВТОРОЙ ПУТЬ: медиа-элемент. Проверяем ФАКТ - дошло ли до воспроизведения, а не
  //: «мы позвали play()». `canplaythrough` без него зелен и на элементе, которому
  //: браузер потом откажет.
  function sndTryEl(id) {
    return new Promise(function (res) {
      var a = SND_EL[id];
      if (a) { res(true); return; }
      try { a = new Audio('snd/' + id + '.ogg'); } catch (e) { res(false); return; }
      a.preload = 'auto';
      var done = false;
      var fin = function (ok) {
        if (done) return;
        done = true;
        if (ok) SND_EL[id] = a;
        res(ok);
      };
      a.addEventListener('canplaythrough', function () { fin(true); });
      a.addEventListener('error', function () { fin(false); });
      setTimeout(function () { fin(false); }, 4000);
      try { a.load(); } catch (e) { fin(false); }
    });
  }

  //: ИГРАЕМ ВТОРЫМ ПУТЁМ. Копию элемента берём на каждый тап: один и тот же `<audio>`,
  //: перезапущенный до конца звука, обрывает сам себя - хлопки подряд слились бы в один.
  function sndPlayEl(id) {
    var a = SND_EL[id];
    if (!a) return false;
    try {
      var c = a.cloneNode(true);
      c.volume = 1.0;
      var pr = c.play();
      //: ═══ ОТКАЗ ВОСПРОИЗВЕДЕНИЯ - ЭТО НЕ «СЫГРАЛО» ═══
      //: Здесь стояло `pr.catch(function(){})`, то есть отказ глотался, а мы возвращали
      //: `true` - «сыграли». На устройстве, где элемент есть, а играть браузер не даёт,
      //: человек слышал ТИШИНУ, и синтез не включался никогда: признак вместо результата
      //: (закон №35). Отказ приходит асинхронно, поэтому чинить прошлое поздно - но
      //: следующий тап обязан знать правду, и он её получает.
      if (pr && pr.catch) {
        pr.catch(function (e) {
          SND_EL_BAD[id] = true;
          sndSay('файл ' + id + ' не проигрывается элементом ('
                 + String((e && e.name) || e).slice(0, 40) + ') - беру синтез');
        });
      }
      sndPath('файл (элемент)');
      return true;
    } catch (e) { return false; }
  }

  //: -> сыграл ли. Отвечаем ФАКТОМ, а не намерением: не поднялся контекст - вызывающий
  //: обязан знать, что человек ничего не услышал, и показать событие глазами.
  //: СКОЛЬКО ЖДЁМ ФАЙЛ, ПРЕЖДЕ ЧЕМ ЗАМЕНИТЬ ЕГО СИНТЕЗОМ. Меньше - тап звучит синтезом
  //: там, где файл вот-вот приедет; больше - человек успевает решить, что кнопка мёртвая.
  var SND_WAIT_MS = 350;

  //: ═══ ЗДЕСЬ И РВАЛОСЬ: `start()` НА СПЯЩЕМ КОНТЕКСТЕ НЕ БРОСАЕТ И НЕ ЗВУЧИТ ═══
  //: ЗАМЕР REN 07.09 закрыл половину вопроса фактом: `звук clap: HTTP 200 · audio/ogg ·
  //: 24008 байт · первые OggS · декодирован: 2.00 с`. То есть скачивание и декодирование
  //: проходят, и семь кругов мы искали в загрузке, которая исправна.
  //: МЕХАНИЗМ: у приторможенного контекста ВРЕМЯ СТОИТ. `createBufferSource().start()`
  //: спокойно принимает заказ, ничего не бросает - и человек не слышит НИЧЕГО, а мы
  //: печатали `сыграл: файл (буфер)` и возвращали `true`. Признак вместо результата
  //: (закон №35), причём самый убедительный: и файл на месте, и вызов прошёл.
  //: В СПЯЩИЙ КОНТЕКСТ НЕ ПЛАНИРУЕМ ВОВСЕ. Запланированный звук доиграл бы САМ, проснись
  //: контекст через секунду, - и тогда поверх него уже звучал бы запасной путь, то есть
  //: один тап давал бы два удара. Просим проснуться и честно отвечаем «не сыграл».
  function sndFromBuffer(ac, buf) {
    if (!ctxRunning(ac)) { ctxWake(ac); return false; }
    try {
      var src = ac.createBufferSource();
      src.buffer = buf; src.connect(_MASTER);
      src.start(ac.currentTime + 0.02);
      return true;
    } catch (e) { return false; }
  }

  function playSnd(id) {
    var s = SOUNDS[id];
    if (!s) return false;
    var ac = actx();
    if (!ac) return false;
    //: ═══ КОНТЕКСТ НЕ БЕЖИТ - ЧЕРЕЗ WEB AUDIO НЕ СЫГРАЕТ НИ ОДИН ПУТЬ ═══
    //: И буфер, и синтез идут ОДНИМ контекстом: пока он спит, «запасной путь» - это тот
    //: же самый молчащий путь под другим именем. Единственный НЕЗАВИСИМЫЙ конвейер здесь
    //: - медиа-элемент: у него свои правила разблокировки, и он иногда играет там, где
    //: Web Audio перебит системой (`interrupted` у WebKit).
    //: НЕ СЫГРАЛО НИ ОДНИМ - ГОВОРИМ ЭТО. Тишина в ответ на тап читается как «кнопка
    //: сломана», и человек жмёт снова; строка называет причину и что с ней делать.
    if (!ctxRunning(ac)) {
      ctxWake(ac);
      if (!SND_EL_BAD[id] && sndPlayEl(id)) return true;
      sndSay('звук приторможен браузером (' + (ctxState(ac) || '?')
             + ') - коснись экрана, и он включится');
      return false;
    }
    if (SND_BUF[id] && sndFromBuffer(ac, SND_BUF[id])) { sndPath('файл (буфер)'); return true; }
    //: ВТОРОЙ ПУТЬ РАВНОПРАВЕН ПЕРВОМУ: файл, который не берёт WebAudio, но играет
    //: медиа-элемент, - это ТОТ ЖЕ файл, а не «почти получилось».
    if (!SND_EL_BAD[id] && sndPlayEl(id)) return true;
    // ═══ СИНТЕЗ - ЗАПАСНОЙ ПУТЬ, А НЕ ПАРАЛЛЕЛЬНЫЙ (живой отказ Ren 31.08) ═══
    // СИМПТОМ БЫЛ ТОЧНЫЙ: у соседей играет файл, у САМОГО нажавшего - старый синтез.
    // Дверь при этом ОДНА (`playSnd` зовут оба пути), а расходились они ВНУТРИ неё:
    // буфер ещё не загружен -> мы запускали загрузку И ТУТ ЖЕ проваливались в синтез.
    // У нажавшего это первые секунды после входа (преднагрузка не успела), у соседей
    // сигнал приходит позже - и к тому моменту файл уже готов. Один и тот же тап звучал
    // по-разному на разных экранах.
    // ТЕПЕРЬ ФАЙЛ ИМЕЕТ ПРАВО ОПОЗДАТЬ НА `SND_WAIT_MS`, и синтез включается ТОЛЬКО если
    // он не успел: тишины в ответ на тап нет, а расхождение исчезает по построению.
    // ═══ ВТОРОЙ КРУГ ТОГО ЖЕ, И ПЕРВАЯ ПОЧИНКА БЫЛА МИМО (живой отказ Ren 31.08) ═══
    // «350 мс не помогли» - и правильно, потому что ждать мы начинали ТОЛЬКО когда
    // манифест УЖЕ прочитан: `known` требовал непустой `SND_FILES`, а он `null` ровно в
    // те первые секунды после входа, когда человек и жмёт кнопку. То есть механизм
    // ожидания был мёртв РОВНО В ТОМ ОКНЕ, ради которого писался, и тап проваливался в
    // синтез немедленно. Сосед в это же окно не попадает никогда: его сигнал приходит
    // позже, к тому времени манифест прочитан - отсюда «у нажавшего синтез, у остальных
    // файл» на ОДНОЙ И ТОЙ ЖЕ двери.
    // СТРОКА `if (SND_FILES === null) sndBoot();` ЗДЕСЬ БЫЛА ПУСТЫШКОЙ: `_SND_BOOTED`
    // уже true (панель реакций зовёт `sndBoot` при постройке), и вызов не делал НИЧЕГО.
    // ТЕПЕРЬ «ЕЩЁ НЕ ЗНАЕМ» СЧИТАЕТСЯ «МОЖЕТ БЫТЬ ФАЙЛ»: ждём его столько же, сколько
    // ждали бы известный, и синтез включаем, только если он не успел. Расхождение между
    // нажавшим и соседом исчезает по построению, а не по удаче тайминга.
    var known = (SND_FILES === null
                 || (!!SND_FILES && SND_FILES.indexOf(id) >= 0)) && !SND_DEAD[id];
    if (known) {
      var done = false;
      sndLoad(ac, id).then(function (b) {
        if (done) return;                    // синтез уже отыграл - второй звук не нужен
        done = true;
        //: СОСТОЯНИЕ ПРОВЕРЯЕТСЯ В МОМЕНТ ИГРЫ, А НЕ ПРИ ЗАКАЗЕ: между тапом и приездом
        //: файла человек мог свернуть аппку, и контекст успел уснуть.
        if (b && sndFromBuffer(ac, b)) { sndPath('файл (буфер, дождались)'); return; }
        sndPlayEl(id);
      });
      setTimeout(function () {
        if (done) return;
        done = true;
        if (!s.p) return;
        if (!ctxRunning(ac)) { ctxWake(ac); sndPlayEl(id); return; }
        sndPath('синтез (файл не успел)');
        try { s.p(ac, actx().currentTime + 0.02); } catch (e) {}
      }, SND_WAIT_MS);
      return true;
    }
    if (!s.p) return false;
    sndPath('синтез (файла нет)');
    try { s.p(ac, ac.currentTime + 0.02); } catch (e) { return false; }
    return true;
  }

  //: СКОЛЬКО РЕАКЦИЙ ВИСИТ НА ЭКРАНЕ РАЗОМ. Без потолка десяток подряд закрыл бы список
  //: людей целиком - то есть «кто говорит» пропало бы ровно тогда, когда в комнате
  //: оживлённо.
  var POP_MAX = 5;

  function popup(txt) {
    var box = $('pops');
    if (!box) return;
    var d = document.createElement('div');
    d.className = 'pop';
    d.textContent = txt;
    box.appendChild(d);
    while (box.children.length > POP_MAX) box.removeChild(box.firstChild);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2700);
  }

  // ═══════════════════════════════════════════════════════════════════════════════════
  //: ВОЗВРАТ В КОМНАТУ БЕЗ ПЕРЕЗАГРУЗКИ СТРАНИЦЫ
  // ═══════════════════════════════════════════════════════════════════════════════════
  //: ЖИВОЙ ОТКАЗ 07.09, ПОДТВЕРЖДЁННЫЙ ЧИСЛОМ: один веб-гость вошёл ШЕСТЬ раз
  //: (3 × CLIENT_REQUEST_LEAVE, 3 × PEER_CONNECTION_DISCONNECTED), в комнате 14 стартов
  //: сессий на 15 закрытий, из них 4 обрыва соединения. Состав: 17 сессий Android 10,
  //: 6 iOS 18.7, 4 WKWebView. Люди говорят: «экран погас - связь оборвалась; вернулся -
  //: страница ПЕРЕЗАГРУЗИЛАСЬ и снова просит микрофон».
  //:
  //: ПОЧЕМУ ПЕРЕЗАГРУЖАЛАСЬ - ОТВЕТ ПО КОДУ, А НЕ ДОГАДКА. Дороги назад не было ВОВСЕ:
  //:   • `RoomEvent.Disconnected` говорил «Соединение закрыто» и НЕ ДЕЛАЛ НИЧЕГО;
  //:   • единственная кнопка возврата переиспользовала ТОТ ЖЕ токен входа, а он живёт
  //:     15 минут - её же комментарий отправлял «открыть комнату заново из бота»;
  //:   • «заново из бота» - это НОВЫЙ ДОКУМЕНТ, а вместе с ним новый запрос микрофона.
  //: То есть перезагрузку выбирал не вебвью, а человек, которому мы не оставили выбора.
  //:
  //: ЧТО ЛЕЧИТ ИМЕННО ЭТО: разрешение на микрофон живёт у ДОКУМЕНТА. Пока документ жив,
  //: `setMicrophoneEnabled(true)` не спрашивает ничего - значит возврат на месте не
  //: только быстрее, он ещё и не трогает разрешение.
  var WEB_NAME = '';          // имя веб-гостя: спрашиваем ОДИН раз за жизнь страницы
  var LAST_TOK = null;        // последний ответ токен-двери (нужен адрес LiveKit)
  var REJOIN = { busy: false, n: 0, at: 0 };
  //: ЧЕЛОВЕК УШЁЛ САМ - ЭТО НЕ ОБРЫВ, И ПУТАТЬ ИХ НЕЛЬЗЯ НИ В ОДНУ СТОРОНУ. Кнопка
  //: «Выйти» приходит в тот же `Disconnected`, что и упавшая сеть; без этого признака
  //: автомат тащил бы человека обратно в комнату, из которой он только что вышел.
  var LEFT = false;
  //: ПОТОЛОК ПОПЫТОК ЕСТЬ, И ОН НЕ КОСМЕТИКА: без него страница на мёртвой сети крутит
  //: возврат бесконечно, грея телефон и жгя чужие лимиты. Кончились - остаётся кнопка,
  //: то есть решение возвращается человеку.
  var REJOIN_MAX = 4;
  var REJOIN_GAP_MS = 2500;

  async function getToken(again) {
    //: ОДНА ДВЕРЬ НА ВХОД И НА ВОЗВРАТ (закон №40). Вторая копия «как получить токен»
    //: разошлась бы ровно там, где её труднее всего заметить: в ветке веб-гостя, у
    //: которой своё место, своё имя и свой потолок. -> {r, j}.
    var r;
    if (WEB) {
      // ИМЯ СПРАШИВАЕМ, ЕСЛИ ЕГО НЕТ В ССЫЛКЕ: человек без Telegram нам не представлен
      // ничем, а соседям по комнате надо знать, кто говорит.
      //: НА ВОЗВРАТЕ НЕ СПРАШИВАЕМ НИКОГДА: он и так только что представился, а карточка
      //: посреди оборвавшегося разговора читается как новый вход.
      var nm = WEB_NAME || q.get('name') || '';
      if (!nm && !again) {
        stage(BOOT_ASKING);
        nm = ((await askText('Как тебя звать в комнате?', 'имя видят соседи')) || '')
               .slice(0, 40);
        stage('запрос токена');
      }
      WEB_NAME = nm;
      // ═══ СВОЁ МЕСТО ВОЗВРАЩАЕМ, А НЕ ЗАНИМАЕМ ВТОРОЕ ═══
      // Ссылка отдаёт десять мест, и перезагрузка (в том числе НАША, ради обновления
      // версии) съедала бы по одному. Строка места случайная, живёт ТОЛЬКО здесь и
      // наружу не уезжает - вернуть её может лишь этот браузер.
      var _seat = '';
      try { _seat = localStorage.getItem('rtc_seat_' + ROOM) || ''; } catch (e) {}
      r = await fetchT(API + '/rtc/web?t=' + encodeURIComponent(WEB)
                      + (nm ? '&name=' + encodeURIComponent(nm) : '')
                       + (_seat ? '&seat=' + encodeURIComponent(_seat) : ''), null, 15000);
    } else {
      r = await fetchT(API + '/rtc/token?room=' + encodeURIComponent(ROOM), {
        headers: { 'X-Init-Data': initData },
      }, 15000);
    }
    var j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    // МЕСТО ЗАПОМИНАЕМ СРАЗУ: следующая перезагрузка вернёт его, а не займёт новое.
    // Ключ по комнате - у человека их бывает несколько, и общий ключ означал бы, что
    // вторая комната стирает место в первой.
    if (j && j.seat) {
      try { localStorage.setItem('rtc_seat_' + ROOM, String(j.seat)); } catch (e) {}
    }
    if (j && j.token) LAST_TOK = j;
    return { r: r, j: j };
  }

  //: ═══ ВОЗВРАТ БЕРЁТ СВЕЖИЙ ТОКЕН, А НЕ ПЕРЕИСПОЛЬЗУЕТ ВХОДНОЙ ═══
  //: Входной живёт 15 минут - ровно поэтому прежняя кнопка возврата работала только
  //: первые минуты, а дальше честно говорила «открой заново из бота». Свежий токен
  //: снимает ограничение целиком, и та же дверь годится и через час.
  async function rejoinRoom(why) {
    if (!room) return false;
    if (String(room.state || '') === 'connected') return true;
    if (REJOIN.busy) return false;
    if (Date.now() - REJOIN.at < REJOIN_GAP_MS) return false;
    if (REJOIN.n >= REJOIN_MAX) {
      say('Связь не возвращается (' + why + '). Нажми «Переподключиться» - или открой '
          + 'комнату заново из бота.', true);
      try { offerRejoinBtn(); } catch (e) {}
      return false;
    }
    REJOIN.busy = true; REJOIN.at = Date.now(); REJOIN.n++;
    var _mic = micOn;
    try {
      say('Связь пропала (' + why + '), возвращаюсь…');
      var t = await getToken(true);
      if (!t.j || !t.j.token) {
        say('Вернуться не вышло: ' + (tokenWhy(t.r, t.j) || 'сервер не отдал токен')
            + ' Нажми «Переподключиться».', true);
        try { offerRejoinBtn(); } catch (e) {}
        return false;
      }
      //: ОТКЛЮЧАЕМСЯ ЯВНО ПЕРЕД ВХОДОМ: у SDK может остаться недоживший сокет, и второй
      //: `connect` на нём отвечает не отказом, а зависанием - тем самым, из-за которого
      //: страницу и перезагружали.
      try { await room.disconnect(); } catch (e) {}
      await room.connect(t.j.url, t.j.token);
      connected = true;
      //: МИКРОФОН ВОЗВРАЩАЕМ В ТО СОСТОЯНИЕ, В КАКОМ ОН БЫЛ. У нового подключения новый
      //: локальный участник, и дорожки надо публиковать заново; разрешение при этом не
      //: спрашивается - документ тот же.
      if (_mic) { try { await micSet(true); } catch (e) {} }
      REJOIN.n = 0;
      say('');
      try { diag('вернулся в комнату (' + why + ')', 'сон'); } catch (e) {}
      return true;
    } catch (e) {
      say('Вернуться не вышло: ' + (typeof lkWhy === 'function' ? lkWhy(e, '') 
          : String((e && e.message) || e)) + ' Нажми «Переподключиться».', true);
      try { offerRejoinBtn(); } catch (e2) {}
      return false;
    } finally {
      REJOIN.busy = false;
    }
  }

  //: КНОПКА ВОЗВРАТА ЖИВЁТ НА МОДУЛЬНОМ УРОВНЕ, А НЕ ВНУТРИ `go()`. Её зовут и автомат, и
  //: обработчик отключения, и оба стоят ВЫШЕ `go()` по коду: объявленная внутри, она дала
  //: бы `ReferenceError` и унесла всё, что регистрируется ниже (этот класс на этой
  //: странице стоил уже семи заходов).
  var _rejoinBtn = null;
  function offerRejoinBtn() {
    if (_rejoinBtn) { _rejoinBtn.style.display = ''; return; }
    var host = $('showhint');
    if (!host || !host.parentNode) return;
    _rejoinBtn = document.createElement('button');
    _rejoinBtn.id = 'rejoin';
    _rejoinBtn.className = 'wide';
    _rejoinBtn.textContent = '🔌 Переподключиться';
    _rejoinBtn.onclick = async function () {
      _rejoinBtn.disabled = true;
      REJOIN.n = 0; REJOIN.at = 0;      // тап человека обнуляет наш потолок попыток
      var ok = await rejoinRoom('по кнопке');
      _rejoinBtn.disabled = false;
      if (ok) _rejoinBtn.style.display = 'none';
    };
    host.parentNode.insertBefore(_rejoinBtn, host.nextSibling);
  }

  function tokenWhy(r, j) {
    //: -> человеческая причина отказа токен-двери | ''. Вынесено из `go()`, чтобы возврат
    //: объяснялся теми же словами, что и вход: две редакции одного отказа разъехались бы,
    //: и человек читал бы про «кончились места» в одном случае и код в другом.
    var WHY = {
      web_link_full: 'По этой ссылке уже вошли все, кому она даёт место. Попроси новую '
                     + 'ссылку у того, кто позвал.',
      web_room_full: 'В комнате уже максимум гостей по ссылкам. Новая ссылка не '
                     + 'поможет - это потолок самой комнаты.',
      // СТАРЫЙ КОД, КОТОРЫЙ НЫНЕШНИЙ Worker БОЛЬШЕ НЕ ОТДАЁТ. Строку оставляем
      // НАРОЧНО: страница и Worker выкладываются РАЗНЫМИ командами, и свежая страница
      // со старым Worker'ом - живой случай, стоивший нам круга уже дважды.
      web_used: 'Ссылка уже отработала. Попроси новую.',
      web_expired: 'Ссылка просрочена: у неё есть срок ВХОДА, не разговора. Попроси новую.',
      bad_web_sign: 'Подпись ссылки не сошлась - новая ссылка тут не поможет, это у нас. '
                    + 'Скажи об этом тому, кто звал.',
      bad_web_token: 'Ссылка испорчена - вероятно, скопировалась не целиком.',
      web_store: 'Не смогли отметить вход и поэтому не пускаем: пускать не отметив '
                 + 'значит открыть ссылку навсегда. Это у нас.',
      no_livekit: 'Комнаты сейчас не подняты. Это у нас, ссылка ни при чём.',

        // RNNoise мы САМИ просим `noiseSuppression=false` (один подавитель за раз), и
        // сверка с `AUDIO_WANT` кричала бы «НАШ БАГ» на собственном верном решении.
        var _want = audioWant();
        AUDIO_MUST.forEach(function (k) {
          var sup = canDo(k);
          if (sup === false) { cant.push(k); return; }
          if (!(k in asked)) { if (sup) lost.push(k + ': не дошло'); return; }
          var v = (asked[k] && typeof asked[k] === 'object') ? asked[k].ideal : asked[k];
          if (v !== _want[k]) lost.push(k + ': просили ' + _want[k] + ', ушло ' + v);
        });

        var got = (ms.getSettings && ms.getSettings()) || {};
        // ═══ ПРИМЕНИЛОСЬ НЕ ТО - ЧИНИМ, А НЕ КОНСТАТИРУЕМ ═══
        // Живой случай (Ren): ровный гул, с которым встроенное подавление обязано
        // справляться. Значит вопрос был не «слабое ли оно», а «включилось ли вообще»;
        // если браузер сказал ВЫКЛ, у нас есть ровно один законный ход - попросить ещё
        // раз через applyConstraints и СКАЗАТЬ, помогло ли.
        // ═══ АРУ ЧИНИМ ТЕМ ЖЕ БЕЗОПАСНЫМ ПУТЁМ, ЧТО И ОСТАЛЬНОЕ ═══
        // ЖИВОЙ ЗАМЕР REN: пик амплитуды 1.456 при норме 1.0 - микрофон изредка
        // перегружается, и это болезнь АРУ, а не шумодава. Просить её надо там же, где
        // остальные флаги, и ОДНОЙ дверью: `applyConstraints` на живой дорожке, без
        // единого переиздания публикации (класс Б1).
        var bad = AUDIO_MUST.filter(function (k) {
          return (k in got) && got[k] !== _want[k];
        });
        var fixed = '';
        if (bad.length) {
          var r = await applyAudio(_want);
          got = r.got || got;
          fixed = r.kind === 'ok' ? ' · было не то, включил на ходу'
                : r.kind === 'threw' ? (' · починить не дал: ' + r.why)
                : (' · чинил, НЕ ПОМОГЛО: ' + (r.why || 'браузер промолчал'));
        }

        // ЧАСТОТА И КАНАЛЫ - УЛИКА, А НЕ УКРАШЕНИЕ: конвейер обработки Chrome работает на
        // 48 кГц, и родная частота устройства (96 кГц у внешних карт) означает сырой
        // захват без обработки. Мы sampleRate/channelCount НЕ ЗАДАЁМ НИГДЕ - это видно по
        // AUDIO_WANT, - поэтому цифра говорит о выборе браузера, а не о нашей просьбе.
        // СУТЬ - ПЕРВОЙ СТРОКОЙ И КОРОТКО. Подробности приписываются ТОЛЬКО когда что-то
        // не так: на исправном звуке человеку не нужен перечень применённых флагов.
        AUDIO_GOT = got;
        AUDIO_TXT = flagLine(got);
        AUDIO_HINT = '';
        if (fixed) AUDIO_HINT += fixed.replace(/^ · /, '');
        if (lost.length) {
          AUDIO_HINT += (AUDIO_HINT ? ' · ' : '')
            + '⚠️ НАШ БАГ, не дошло до браузера (' + lost.join('; ') + ')';
        }

        // ═══ КНОПКИ ШУМОДАВА БОЛЬШЕ НЕТ, И ЭТО РЕШЕНИЕ, А НЕ ПОТЕРЯ (ТЗ Ren 08.09) ═══
        // «У человека НЕТ ручек. Единственный переключатель на странице - «Микрофон»».
        // Шумодав включается САМ (`rnnBoot`), модель выбирается фактом SIMD и живой
        // занятостью кванта, а не тапом. Кнопка была нужна, пока выбор был спорным;
        // спор закрыт замером, и оставленный переключатель означал бы, что мы просим
        // человека решать за нас вопрос, на который у нас есть числа.
        // ГОЛОС ОСТАЁТСЯ КНОПКОЙ: это ВЫРАЗИТЕЛЬНОЕ средство, а не настройка качества -
        // «правильного» значения у него не существует, и решать тут правда человеку.
        // ПОЯВЛЯЕТСЯ ОН ТАМ ЖЕ, ГДЕ РАНЬШЕ: живой микрофон - условие обоих (без него
        // менять нечего), и `got` тут как раз о нём.
        var _vb = $('voice');
        if (_vb) {
          _vb.style.display = '';
          _vb.onclick = function () { voiceSet(voiceIdx + 1, 'тап'); };
          voicePaint();
        }

        // ═══ ПОДАВЛЕНИЯ НЕТ НИ У КОГО - ЭТО ЕДИНСТВЕННЫЙ СЛУЧАЙ, ГДЕ СОВЕТ РАБОТАЕТ ═══
        // Встроенного у этого клиента нет (десктопный Telegram отдаёт сырой захват), и
        // если наш тоже не встал - человек фонит и не знает об этом, а сделать он может
        // ровно одно: открыть ту же комнату в обычном браузере, где встроенное есть.
        // МОЛЧАНИЕ ЗДЕСЬ И ЕСТЬ МОЛЧАЛИВЫЙ ОТКАЗ (п.8 ТЗ): человек остался без обработки
        // и без единого слова о том, почему и что делать.
        // ПРО КНОПКУ БОЛЬШЕ НЕ ГОВОРИМ: её нет, и совет «включи «Подавить шум»» вёл бы к
        // переключателю, которого не существует. Гасится совет в `paintAudio` по `RNN_ON`
        // - предлагать лечить вылеченное значит учить не читать наши подсказки.
        if (canDo('noiseSuppression') === false) {
          AUDIO_HINT += (AUDIO_HINT ? ' · ' : '')
            + 'встроенного подавления тут нет: если и наш не включится, открой комнату '
            + 'в обычном браузере - там оно есть';
        }

        // ═══ ГРОМКОСТЬ НЕ ВЫРАВНИВАЕТСЯ - ЭТО СЛЫШНО, И ПОЧИНИТЬ ЭТО МОЖЕМ НЕ МЫ ═══
        // ЖИВОЙ ЗАМЕР REN: пик амплитуды 1.456 при норме 1.0, то есть микрофон изредка
        // перегружается (1% кадров), и АРУ не работает. Перегрузка случается ДО нас, в
        // цепочке захвата: ни шумодав, ни applyConstraints её не лечат - лечит убавленное
        // усиление в системе. Молчать об этом нельзя: человек слышит хрип и думает на
        // связь, а чинить надо ползунок у себя.
        if (got.autoGainControl === false || canDo('autoGainControl') === false) {
          AUDIO_HINT += (AUDIO_HINT ? ' · ' : '')
            + 'громкость не выравнивается (АРУ выключена): если микрофон перегружается и '
            + 'хрипит, убавь усиление в настройках системы - отсюда это не чинится';
        }
        paintAudio();
        // ЗАМЕР ПЕРЕГРУЗА ИДЁТ ВСЕГДА, А НЕ ТОЛЬКО ПРИ ВЫКЛЮЧЕННОМ ШУМОДАВЕ: хрип живёт в
        // цепочке ЗАХВАТА и от нашей обработки не зависит.
        if (!clipTimer) clipTimer = setInterval(clipTick, NS.CLIP_MS);
        rnnBoot();
      } catch (e) { box.textContent = 'настройки звука не спросить: ' + e; }
    }

    // ═══ ДЕФОЛТЫ РАЗНЫЕ, И РАЗНИЦА НЕ В ВЕЖЛИВОСТИ, А В ЦЕНЕ ОШИБКИ ═══
    // ДЕСКТОП - ВКЛЮЧАЕМ САМИ. Прежнее правило («браузер умеет - берём встроенное») было
    // верным ровно наполовину и ОТМЕНЕНО ЗАМЕРОМ, а не вкусом: живой сэмпл (Ren 27.08)
    // дал разброс уровня фона 11.5 дБ и 74% его энергии в полосе речи - шум
    // НЕСТАЦИОНАРНЫЙ, и встроенное подавление, рассчитанное на ровный, его не берёт.
    // Человек при этом фонит и НЕ ЗНАЕТ ОБ ЭТОМ: слышат его соседи. Кнопка, до которой
    // надо догадаться дойти, такую задачу не решает.
    // МОБИЛА - НЕ ВКЛЮЧАЕМ. Там цена в процессоре заметна, а сторож может и опоздать:
    // рвущийся звук хуже шумного. Вместо этого меряем фон и предлагаем в один тап.
    // РЕШЕНИЕ ЧЕЛОВЕКА СИЛЬНЕЕ АВТОМАТИКИ И ПЕРЕЖИВАЕТ ВХОД: выключил руками - не
    // включаем и не предлагаем. Просьба админа сильнее: он человек, а не правило.
    var rnnBooted = false;
    function rnnBoot() {
      if (rnnBooted) return;
      rnnBooted = true;
      // ═══ РАЗВИЛКИ ПО КЛАССУ УСТРОЙСТВА ЗДЕСЬ БОЛЬШЕ НЕТ, И ЭТО РЕШЕНИЕ ═══
      // Прежняя редакция включала шумодав сама только на десктопе (`HAS_DISPLAY`), а
      // телефону лишь ПРЕДЛАГАЛА по замеру фона. Правило отменено: современный телефон
      // тянет лучше старого ноутбука, и «десктоп» бывает разный. Пригодность устройство
      // доказывает РАБОТОЙ - сторож занятости кванта ниже снимет модель за пять секунд
      // перегруза и скажет об этом числом.
      // ШУМОДАВ ТЕПЕРЬ АВТОМАТИЧЕСКИЙ У ВСЕХ, и наблюдатель фона (`watchStart`) больше не
      // нужен: он существовал ровно затем, чтобы ПРЕДЛОЖИТЬ то, что теперь включается
      // само. Остаётся он только у того, кто подавление себе выключил.
      if (dnWanted() === 'off') { watchStart(); return; }

    }

    setTimeout(audioFacts, 800);

    // ═══════════════════ СВОЙ ШУМОДАВ (RNNoise) ═══════════════════
    // РАЗНИЦА МЕЖДУ КЛИЕНТАМИ ПОДТВЕРЖДЕНА ФАКТОМ (Ren 25.08, один код, два клиента):
    //   Mac Telegram (WebView): шумодав НЕ УМЕЕТ · 96000 Гц - обработки нет вовсе;
    //   обычный браузер:        шумодав вкл · эхо вкл · громкость вкл · 48000 Гц.
    //
    // ПРЕЖНЕЕ ПРАВИЛО «БРАУЗЕР УМЕЕТ - БЕРЁМ ВСТРОЕННОЕ» ОТМЕНЕНО ЗАМЕРОМ, И ЭТО
    // ЗАПИСАНО ЗДЕСЬ, ЧТОБЫ ЧЕРЕЗ ПОЛГОДА ЕГО НЕ «ВЕРНУЛИ КАК БЫЛО». Оно опиралось на
    // посылку «встроенное дешевле и лучше», и первая половина верна до сих пор, а вторая
    // - нет: разбор живого сэмпла (Maxim_noise.ogg, Ren 27.08) дал разброс уровня фона
    // 11.5 дБ и 74% энергии в 100-1000 Гц. Такой шум НЕСТАЦИОНАРНЫЙ и лежит в полосе
    // речи; встроенные подавители рассчитаны на ровный фон и его не берут. Двойная
    // обработка при этом не нужна и вредна, поэтому при живом RNNoise встроенное
    // ВЫКЛЮЧАЕТСЯ (`audioWant`), а не работает поверх.
    //
    // ГРАНИЦА ПОСЛЕДСТВИЙ НАЗВАНА ЧЕСТНО: теперь дефолт десктопа ТРОГАЕТСЯ, и поломка
    // здесь задевает не только того, кто нажал. Поэтому каждый шаг fail-open, отказ виден
    // строкой, а сторож процессора умеет снять шумодав сам.
    //

    // setProcessor - остаёмся на ИСХОДНОЙ дорожке и говорим причину. Тишина в эфире хуже
    // шума: шум мешает, а тишину человек читает как «меня не слышно вовсе».
    // (`RNN_ON` объявлен снаружи комнаты: его читает `showRec`, который выполняется до
    // подключения. Объявление здесь было бы `ReferenceError` на каждом таком входе.)

    // WASM ЗАГРУЖАЕТСЯ ГЛАВНЫМ ПОТОКОМ И ЕДЕТ В WORKLET БАЙТАМИ: в AudioWorklet нет ни
    // fetch, ни importScripts - оттуда его не достать никак.
    async function dnBytes(which) {
      var f = (DN[which] || DN.rnnoise).wasm;
      var r = await fetch(new URL(f, location.href).href, { cache: 'force-cache' });
      if (!r.ok) throw new Error(f + ': HTTP ' + r.status);
      return await r.arrayBuffer();
    }

    //: ═══ ОБВЯЗКА GTCRN - ТЕКСТ, КОТОРЫЙ КЛЕИТСЯ С ОБРАБОТЧИКОМ В ОДИН МОДУЛЬ ═══
    //: Emscripten-обвязка это 12 КБ чужого JS, и в шаблонную строку внутри HTML её класть
    //: нельзя: там живые обратные кавычки и `${`, то есть страница ломалась бы молча на
    //: первой же пересборке чужого пакета. Она едет ОБЫЧНЫМ файлом рядом со страницей и
    //: той же командой выкладки, что wasm, - разъехаться им нечем.
    async function dnGlue(which) {
      var f = (DN[which] || {}).glue;
      if (!f) return '';
      var r = await fetch(new URL(f, location.href).href, { cache: 'force-cache' });
      if (!r.ok) throw new Error(f + ': HTTP ' + r.status);
      return await r.text();
    }

    //: ═══ SIMD СПРАШИВАЕТСЯ У БРАУЗЕРА В РАНТАЙМЕ, А НЕ ВЫВОДИТСЯ ИЗ УСТРОЙСТВА ═══
    //: ЗАМЕР 08.09 ОТМЕНИЛ ОЧЕВИДНУЮ РАЗВИЛКУ: наличие SIMD едет со СБОРКОЙ Chrome/WebView,
    //: а WebView на Android обновляется из Play Store отдельно от системы - значит по
    //: версии Android его не угадать вовсе. Плюс современный телефон тянет лучше старого
    //: ноутбука, и делить по классу устройства значило бы отнять GTCRN у тех, кто его
    //: тянет. Устройство доказывает пригодность РАБОТОЙ (сторож занятости ниже), а не
    //: моделью в userAgent.
    //: БАЙТЫ КАНОНИЧЕСКИЕ (wasm-feature-detect): крошечный модуль с одной SIMD-инструкцией.
    //: Своя первая редакция этой пробы отвечала `false` на node, где SIMD ЕСТЬ, - то есть
    //: отобрала бы GTCRN у всех и молча.
    var _simd = null;
    function hasSimd() {
      if (_simd !== null) return _simd;
      try {
        _simd = WebAssembly.validate(new Uint8Array([
          0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 96, 0, 0, 3, 2, 1, 0,
          10, 9, 1, 7, 0, 65, 0, 253, 15, 26, 11,
        ]));
      } catch (e) { _simd = false; }
      return _simd;
    }

    //: КАКАЯ МОДЕЛЬ ПОЙДЁТ ПО УМОЛЧАНИЮ. Ровно два исхода и ровно один признак.
    function dnPick() { return hasSimd() ? 'gtcrn' : 'rnnoise'; }

    //: ═══ ЧТО ВЫБРАЛ АДМИН ПРО СВОЙ СОБСТВЕННЫЙ МИКРОФОН ═══
    //: Ключ читается У ВСЕХ, а ставится только с админской панели. Снимут человеку права -
    //: его выбор продолжит действовать на ЕГО микрофон, и это честно: он про своё
    //: устройство, а не про чужие.
    function dnPrefGet() {
      try { return localStorage.getItem(DN_PREF_KEY) || ''; } catch (e) { return ''; }
    }
    function dnPref(v) {
      try { localStorage.setItem(DN_PREF_KEY, v); } catch (e) {}
    }
    //: ЧТО ДОЛЖНО РАБОТАТЬ: выбор человека, приведённый к тому, что устройство ТЯНЕТ.
    //: GTCRN без SIMD не запустится ФИЗИЧЕСКИ, поэтому сохранённый выбор здесь не спорит
    //: с реальностью, а уступает ей - и это будет сказано строкой, а не молча.
    function dnWanted() {
      var w = dnPrefGet();
      if (w === 'off') return 'off';
      var which = (w && DN[w]) ? w : dnPick();
      if (DN[which].simd && !hasSimd()) which = 'rnnoise';
      return which;
    }
    //: ЧТО ТЯНУТЬ ПЕРЕД ЗАПУСКОМ ЦЕПОЧКИ. Обвязка тянется ТОЛЬКО под ту модель, которой
    //: она нужна: платить за неё там, где SIMD нет, значит качать код, который не
    //: запустится ни при каком раскладе.
    async function dnPlan() {
      var which = dnWanted();
      if (which === 'off') return { model: '', wasm: null };
      try {
        return await dnLoad(which);
      } catch (e) {
        //: ═══ МОДЕЛЬ НЕ ЗАГРУЗИЛАСЬ - ЭТО ПРИЧИНА, А НЕ КОНЕЦ РАЗГОВОРА (п.8 ТЗ) ═══
        //: Файлы моделей выкладываются ОТДЕЛЬНОЙ командой от страницы, и разъехаться им
        //: есть чем: свежая страница на старой выкладке спросит `gtcrn.wasm`, получит
        //: HTML и упадёт. Без запасной ступени это означало бы «шумодава нет ни у кого,
        //: у кого есть SIMD» - при живом RNNoise рядом. Ступень МОЛЧА не срабатывает:
        //: строка в [диаг] называет и модель, и причину.
        var why = String((e && e.message) || e);
        try { diag('модель ' + which + ' не загрузилась: ' + why, 'звук'); } catch (e2) {}
        if (which === 'rnnoise') throw e;
        var plan = await dnLoad('rnnoise');
        plan.fellBack = which + ' -> rnnoise: ' + why;
        return plan;
      }
    }
    async function dnLoad(which) {
      var plan = { model: which, wasm: await dnBytes(which) };
      if (DN[which].glue) plan.glue = await dnGlue(which);
      return plan;
    }

    // КОД ОБРАБОТЧИКА ЖИВЁТ СТРОКОЙ И ГРУЗИТСЯ ЧЕРЕЗ Blob: отдельный файл пришлось бы
    // выкладывать третьим артефактом и держать в согласии со страницей - лишний способ
    // разъехаться (класс «страница и Worker выкладываются разными командами»).
    var RNN_WORKLET = `
class RnnProc extends AudioWorkletProcessor {
  constructor(opts) {
    super();
    this.N = 480;              // RNNoise работает кадрами по 480 сэмплов при 48 кГц
    this.inBuf = new Float32Array(0);
    this.outBuf = new Float32Array(0);
    this.ready = false;
    this.bypass = false;
    // ═══ ДВЕ СТУПЕНИ В ОДНОМ ОБРАБОТЧИКЕ, И ЭТО НЕ ЭКОНОМИЯ, А ОГРАНИЧЕНИЕ SDK ═══
    // У livekit-client дорожка держит РОВНО ОДИН процессор: setProcessor снимает
    // предыдущий. Значит «сдвиг высоты отдельным процессором рядом с шумодавом»
    // невозможен по построению - второй выключил бы первый МОЛЧА, и человек получил бы
    // писклявый голос вместо подавления, не поняв почему. Ступени идут в этом порядке:
    // сперва чистим шум с ЖИВОГО голоса, потом двигаем высоту.

          // LiveKit и так 48 кГц (обычный браузер), поведение остаётся ПРЕЖНИМ бит-в-бит, и
          // второго звукового контекста мы не заводим вовсе - лишний контекст это лишний
          // ресемплер, лишняя память и лишний способ сломаться там, где всё работало.
          ctx = null;
          if (opts.audioContext && opts.audioContext.sampleRate === 48000) {
            ctx = opts.audioContext;
          }
          if (!ctx) {
            try {
              var _own = new (window.AudioContext || window.webkitAudioContext)(
                { sampleRate: 48000 });
              // ПРОВЕРЯЕМ ФАКТ, А НЕ ПРОСЬБУ: часть браузеров молча отдаёт контекст на
              // своей частоте, проигнорировав аргумент, - и тогда мы получили бы ту же
              // поломку, только без сообщения.
              // РЕГИСТРИРУЕМ ТОЛЬКО ПРИНЯТЫЙ: отвергнутый мы закрываем строкой ниже,
              // и будить закрытый - значит копить в реестре мусор, который на каждом
              // возврате из фона будет честно докладывать «closed».
              //
              // РЕЕСТР - УДОБСТВО БУДИЛЬНИКА, А НЕ УСЛОВИЕ РАБОТЫ ШУМОДАВА, И ПОРЯДОК
              // СТРОК ЭТО ЗАКРЕПЛЯЕТ. Прежняя редакция писала `ctx = regCtx(...)`, то
              // есть ставила диагностику НА ПУТИ звука: споткнись `regCtx` (её нет в
              // этом окружении, она упала, её вынесли) - исключение уходило в общий
              // `catch`, контекст оставался ВИСЕТЬ незакрытым, а человек слышал
              // «браузер не дал пересчитать» про полностью исправный браузер. То же
              // правило уже записано у замера приёма: не собрался прибор - теряем
              // ОТЧЁТ, а не подавление.
              if (_own.sampleRate === 48000) {
                ctx = _own; ownCtx = _own;
                try { regCtx(_own, 'шумодав'); } catch (e) {}
              }
              else { try { _own.close(); } catch (e) {} }
            } catch (e) {
              // Браузер отказал в частоте - скажем об этом ниже, честной строкой.
            }
          }
          if (!ctx || ctx.sampleRate !== 48000) {
            // ОТКАЗ НАЗЫВАЕТ ЧАСТОТУ, КОТОРАЯ У ЧЕЛОВЕКА ЕСТЬ, а не наш внутренний null:
            // «нужен 48, а у тебя 96» - это факт, с которым можно что-то делать, «получилось
            // null» - наша кухня.
            var _have = (ctx && ctx.sampleRate)
              || (opts.audioContext && opts.audioContext.sampleRate) || '?';
            throw new Error('нужен 48 кГц, а тут ' + _have
                            + ' - браузер не дал пересчитать');
          }
          // ═══ КОНТЕКСТ НАДО РАЗБУДИТЬ, И ЖДАТЬ ЕГО ВЕЧНО НЕЛЬЗЯ ═══
          // Созданный до жеста человека он стоит `suspended`, а suspended-контекст НЕ
          // ОБРАБАТЫВАЕТ ЗВУК ВООБЩЕ - то есть в комнату уехала бы тишина при полностью
          // исправной цепочке. Это хуже любого шума: шум мешает, тишину человек читает
          // как «меня не слышно».
          // ЖИВОЙ ОТКАЗ, ПОЙМАННЫЙ БРАУЗЕРНОЙ ПРОБОЙ: с автоматическим включением при
          // входе жеста НЕТ ВОВСЕ, и `resume()` не разрешается НИКОГДА - обещание висит,
          // кнопка остаётся заблокированной, и выглядит это как намертво сломанный
          // шумодав. Пока включение было только по тапу, беды не было видно: тап и есть
          // жест. Поэтому ждём ОГРАНИЧЕННО и проверяем ФАКТ (`state`), а не то, что вызов
          // вернулся: `resume()` вправе разрешиться, оставив контекст спящим.
          if (ctx.state === 'suspended') {
            try {
              await Promise.race([ctx.resume(),
                                  new Promise(function (r) { setTimeout(r, 1200); })]);
            } catch (e) {}
          }
          if (ctx.state !== 'running') {
            throw new Error('браузер не запускает обработку звука без твоего действия - '
                            + 'коснись экрана');
          }
          // ОБВЯЗКА И ОБРАБОТЧИК - ОДИН МОДУЛЬ, А НЕ ДВА addModule: `Module` и
          // `GtcrnProcessor` живут в области СВОЕГО модуля, и вторым вызовом обработчик
          // их не увидел бы вовсе.
          var _src = (plan.glue ? plan.glue + '\n' : '') + RNN_WORKLET;
          var url = URL.createObjectURL(new Blob([_src], { type: 'text/javascript' }));
          try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
          node = new AudioWorkletNode(ctx, 'rnn-denoise', {
            numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1],
            processorOptions: { wasm: plan.wasm || null, model: plan.model || '',
                                pitch: Number(pitch) || 1 },
          });
          var _self = this;
          node.port.onmessage = function (ev) {
            if (!ev.data) return;
            if (ev.data.error) say('Шумодав не собрался: ' + ev.data.error
                                   + ' - звук идёт как был.', true);
            //: ФАКТ СОБРАННОЙ МОДЕЛИ ПРИХОДИТ ОТТУДА, ГДЕ ОНА СОБРАЛАСЬ.
            if (typeof ev.data.model === 'string' && ev.data.N) {
              _self.model = ev.data.model;
              _self.N = ev.data.N;
              _self.have[ev.data.model] = true;
              //: ═══ СТРОКУ ПЕЧАТАЕТ ТОТ, КТО УЗНАЛ ФАКТ (закон №35, п.8 ТЗ) ═══
              //: Моделей две, и какая встала - решают SIMD, сохранённый выбор человека и
              //: запасная ступень загрузки; по коду страницы на это не ответить, отвечает
              //: только прогон. Печатать сразу после `setProcessor` было НЕЛЬЗЯ: доклад
              //: приходит сообщением порта ПОЗЖЕ, и там стояло бы наше намерение вместо
              //: факта. Строка едет в `bot.log`, где идёт разбор: до консоли телефона на
              //: созвоне не добраться.
              try {
                diag('модель ' + ev.data.model + ' · кадр ' + ev.data.N + ' сэмплов · SIMD '
                     + (hasSimd() ? 'есть' : 'нет')
                     + (_self.fellBack ? ' · запасная ступень: ' + _self.fellBack : ''),
                     'звук');
              } catch (e2) {}
            }
            if (typeof ev.data.load === 'number' && _self.onLoad) {
              _self.onLoad(ev.data.load, ev.data.model || _self.model);
            }
          };
          this.srcTrack = opts.track;
          srcNode = ctx.createMediaStreamSource(new MediaStream([opts.track]));
          dstNode = ctx.createMediaStreamDestination();
          srcNode.connect(node); node.connect(dstNode);
          // ═══ ДВА АНАЛИЗАТОРА - ЭТО «ДО» И «ПОСЛЕ» В ОДНУ И ТУ ЖЕ СЕКУНДУ ═══
          // Замер «до включения, потом после» пришлось бы разносить во времени, а фон за
          // эти секунды меняется сам (он у нас нестационарный - с этого и начался разбор).
          // Здесь оба берутся из ОДНОГО сигнала одновременно, и разница означает ровно
          // работу шумодава, а не смену обстановки.
          // ЗАМЕР - ДИАГНОСТИКА, А НЕ ПРОДУКТ: не собрались анализаторы - теряем ОТЧЁТ,
          // а не подавление. Уронить здесь весь шумодав ради строки «-14 дБ» значило бы
          // выключить работающую фичу из-за неработающего прибора.
          try {
            this.anIn = ctx.createAnalyser();
            this.anIn.fftSize = 1024; this.anIn.smoothingTimeConstant = 0;
            this.anOut = ctx.createAnalyser();
            this.anOut.fftSize = 1024; this.anOut.smoothingTimeConstant = 0;
            srcNode.connect(this.anIn); node.connect(this.anOut);
          } catch (e) {
            this.anIn = this.anOut = null;
            console.warn('[rnn] замер эффекта недоступен:', e);
          }
          this.processedTrack = dstNode.stream.getAudioTracks()[0];
        },
        async restart(opts) { await this.destroy(); await this.init(opts); },
        async destroy() {
          this.onLoad = null;
          this.srcTrack = null;
          this.anIn = this.anOut = null;
          try { srcNode && srcNode.disconnect(); } catch (e) {}
          try { node && node.disconnect(); } catch (e) {}
          // СВОЙ КОНТЕКСТ ЗАКРЫВАЕМ, ЧУЖОЙ - НИКОГДА: контекст LiveKit держит весь звук
          // комнаты, и закрыв его, мы оглушили бы человека целиком.
          if (ownCtx) { try { ownCtx.close(); } catch (e) {} }
          node = srcNode = dstNode = ownCtx = ctx = null;
        },
      };
    }

    //: ЖИВОЙ ПРОЦЕССОР. Нужен ради ДВУХ вещей, которых больше взять негде: исходной
    //: дорожки захвата (на ней и только на ней имеет смысл applyConstraints) и двух
    //: анализаторов, дающих «фон до» и «фон после» в одну и ту же секунду.
    var RNN_PROC = null;
    var rnnBusy = false;

    function micPub() {
      var out = null;
      room.localParticipant.trackPublications.forEach(function (p) {
        if (String(p.source || '') === 'microphone' && p.track) out = p;
      });
      return out;
    }

    // ═══ ЧТО МЫ ХОТИМ ОТ БРАУЗЕРА ПРЯМО СЕЙЧАС ═══
    // ОДИН ПОДАВИТЕЛЬ ЗА РАЗ. Встроенный и наш решают одну задачу, и включённые вместе
    // они не складываются, а мешают: первый съедает то, на чём обучен второй, и голос
    // глохнет раньше шума. Поэтому при живом RNNoise просим `noiseSuppression=false`, а
    // при выключенном возвращаем `true` - обе стороны, а не одна (закон №55).
    // ЭХО - ВСЕГДА И БЕЗУСЛОВНО: без него комната с двух телефонов рядом даёт вой, и это
    // не зависит ни от какого шумодава.
    function audioWant() {
      var w = {};
      Object.keys(AUDIO_WANT).forEach(function (k) { w[k] = AUDIO_WANT[k]; });
      w.echoCancellation = true;
      w.noiseSuppression = !RNN_ON;
      return w;
    }

    // ═══ ОДНА ДВЕРЬ НА ЛЮБУЮ ПРАВКУ НАСТРОЕК ЖИВОЙ ДОРОЖКИ ═══
    // ПУБЛИКАЦИЯ НЕ ПЕРЕСОЗДАЁТСЯ НИ ПРИ КАКОМ ИЗМЕНЕНИИ ФЛАГОВ. Путь
    // unpublish -> publish это ровно класс Б1: `Promise.race` отменяет ОЖИДАНИЕ, а
    // операция внутри SDK продолжается, источник числится «публикуется», и следующий тап
    // падает «waiting for pending publication promise timed out». Мы это чинили, и второй
    // дороги, по которой оно вернётся, здесь нет.
    // ПРОСЬБА - НЕ ФАКТ (закон №35): после applyConstraints ПЕРЕЧИТЫВАЕМ настройки. У
    // браузера три поведения, и они разные для человека: применил / отказал ошибкой /
    // СОГЛАСИЛСЯ И НИЧЕГО НЕ СДЕЛАЛ. Последнее самое коварное - вызов проходит, а звук
    // прежний, и без перечитывания мы отрапортовали бы успех.
    async function applyAudio(want) {
      // ИСТОЧНИК, А НЕ ОБРАБОТАННАЯ ДОРОЖКА: у дорожки из MediaStreamAudioDestinationNode
      // нет ни эха, ни АРУ, и просьба ушла бы в никуда - молча.
      var t = (RNN_PROC && RNN_PROC.srcTrack) || micTrack();
      if (!t || !t.applyConstraints) return { ok: false, why: 'дорожки захвата нет', got: {} };
      var ask = {};
      Object.keys(want).forEach(function (k) {
        // НЕИЗВЕСТНЫЙ БРАУЗЕРУ ФЛАГ НЕ ПРОСИМ ВОВСЕ: часть браузеров на такой набор
        // отвечает OverconstrainedError и не применяет НИЧЕГО - то есть один лишний ключ
        // отменял бы и остальные.
        if (canDo(k) !== false) ask[k] = want[k];
      });
      // ═══ ТРИ ИСХОДА, И СХЛОПНУТЬ ИХ В ДВА НЕЛЬЗЯ ═══
      // «Отказал ошибкой» и «согласился и ничего не сделал» - разные миры для человека:
      // в первом браузер что-то не умеет и говорит об этом, во втором вызов проходит, а
      // звук прежний. Схлопнув их, мы отправили бы разбор не туда - и ровно это поймала
      // браузерная проба, когда первая редакция этой двери вернула одно слово на оба.
      try {
        await t.applyConstraints(ask);
      } catch (e) {
        return { kind: 'threw', ok: false, why: (e && e.name) || String(e),
                 got: (t.getSettings && t.getSettings()) || {} };
      }
      var got = (t.getSettings && t.getSettings()) || {};
      var bad = Object.keys(ask).filter(function (k) {
        return (k in got) && got[k] !== ask[k];
      });
      return { kind: bad.length ? 'silent' : 'ok', ok: !bad.length,
               why: bad.length ? bad.join(', ') : '', got: got };
    }

    // ═════════════ ЗАМЕР ФОНА: ОДНА МАШИНКА НА ДЕТЕКТОР И НА ОТЧЁТ ═════════════
    // Обе задачи спрашивают одно и то же - какой у человека фон В ПАУЗАХ речи. Две копии
    // этого счёта разошлись бы порогом «что считать паузой», и тогда предложение на
    // мобиле опиралось бы на один фон, а отчёт «-14 дБ» на другой (закон №40).
    function newStat() { return { all: [], db: [], low: [] }; }

    // ТЕЛО ПЕРЕЕХАЛО НАВЕРХ (`frameDbTop`): его зовёт и замер уровня микрофона, который
    // живёт на верхнем уровне страницы. Оставить его здесь значило бы завести ШЕСТОЙ
    // случай «объявлено внутри, зовётся снаружи» - ровно тот класс, что уже пять раз
    // уносил половину страницы ReferenceError'ом.
    var frameDb = frameDbTop;

    // ДОЛЯ ЭНЕРГИИ В 100-1000 Гц - ЭТО НЕ УКРАШЕНИЕ ОТЧЁТА, А ПРИЗНАК «МЕШАЕТ РЕЧИ».
    // Шум, лежащий выше 4 кГц, человек слышит как шипение и разбирать речь оно почти не
    // мешает; шум В ПОЛОСЕ РЕЧИ (живой сэмпл: 74%) съедает именно разборчивость.
    function lowShare(an, fbuf) {
      an.getFloatFrequencyData(fbuf);
      var hz = (an.context.sampleRate / 2) / fbuf.length;
      var lo = 0, all = 0;
      for (var i = 1; i < fbuf.length; i++) {
        var f = i * hz;
        if (f > 8000) break;
        if (fbuf[i] <= -180) continue;              // пустой бин
        var pw = Math.pow(10, fbuf[i] / 10);
        all += pw;
        if (f >= NS.LOW_HZ[0] && f <= NS.LOW_HZ[1]) lo += pw;
      }
      return all > 0 ? lo / all : 0;
    }

    // ПОРОГ ПАУЗЫ ПЛАВАЮЩИЙ И СЧИТАЕТСЯ ОТ СОБСТВЕННОГО МАКСИМУМА ЗА ОКНО. Абсолютное
    // число означало бы «у половины людей не работает»: усиление микрофона у всех своё, и
    // -45 dBFS у одного это фон, у другого - крик. Окно короткое (последние ~200 кадров,
    // то есть 10 секунд), иначе один хлопок дверью навсегда поднял бы планку и вся речь
    // после него считалась бы паузой.
    function feed(st, an, tbuf, fbuf) {
      var d = frameDb(an, tbuf);
      st.all.push(d);
      if (st.all.length > 200) st.all.shift();
      var mx = -120;
      for (var i = 0; i < st.all.length; i++) if (st.all[i] > mx) mx = st.all[i];
      if (d > mx - NS.SPEECH_GAP_DB) return;        // это речь, а не пауза
      st.db.push(d);
      st.low.push(lowShare(an, fbuf));
      if (st.db.length > 600) { st.db.shift(); st.low.shift(); }
    }

    function verdict(st) {
      if (st.db.length < NS.MIN_PAUSES) return null;
      var s = st.db.slice().sort(function (a, b) { return a - b; });
      var q = function (x) { return s[Math.min(s.length - 1, Math.floor(x * (s.length - 1)))]; };
      var sum = 0;
      for (var i = 0; i < st.low.length; i++) sum += st.low[i];
      // РАЗБРОС - ЭТО p90-p10, А НЕ max-min: одиночный щелчок не должен объявлять ровный
      // гул нестационарным, иначе предложение вылезало бы у всех подряд.
      return { db: q(0.5), spread: q(0.9) - q(0.1), low: sum / st.low.length,
               n: st.db.length };
    }

    // ═══ НАБЛЮДАТЕЛЬ ФОНА И ПРЕДЛОЖЕНИЕ УДАЛЕНЫ ВМЕСТЕ СО СВОЕЙ ПРИЧИНОЙ ═══
    // Он существовал ровно затем, чтобы ПРЕДЛОЖИТЬ шумодав там, где мы не включали его
    // сами - то есть на телефоне. Теперь подавление автоматическое у всех, и предлагать
    // нечего: единственный, у кого его нет, выключил его СВОИМ выбором, и повторный
    // вопрос это не забота, а спор. Мёртвая машинерия хуже отсутствующей - она врёт
    // читателю кода, будто предложение ещё бывает.
    // ЧТО ИЗ НЕГО ОСТАЛОСЬ ЖИТЬ: `newStat`/`feed`/`verdict` выше - на них стоит замер
    // «фон до и после» (`gainStart`), и он к предложению отношения не имеет.
    //
    // ═══ И ОСТАЛСЯ АНАЛИЗАТОР - НО УЖЕ ДЛЯ ДРУГОГО ВОПРОСА ═══
    // На нём стоит детектор ПЕРЕГРУЗА микрофона (`clipTick`), а перегруз случается ДО нас,
    // в цепочке захвата, и от наличия шумодава не зависит вовсе. Пока цепочка стоит,
    // источник даёт `RNN_PROC.anIn`; когда её нет (подавление выключено и голос не
    // меняли) - брать сигнал больше неоткуда, и удали мы это вместе с предложением,
    // детектор перегруза замолчал бы МОЛЧА у того единственного, кто выключил шумодав.
    var WATCH = null;

    function watchStop() {
      if (!WATCH) return;
      try { WATCH.src.disconnect(); } catch (e) {}
      try { WATCH.ctx.close(); } catch (e) {}
      WATCH = null;
    }

    function watchStart() {
      watchStop();
      // ЦЕПОЧКА ЕСТЬ - ИСТОЧНИК УЖЕ ЕСТЬ. Второй анализатор того же сигнала это лишний
      // контекст, лишняя память и лишний способ сломаться там, где всё работает.
      if (RNN_PROC && RNN_PROC.anIn) return;
      var t = micTrack();
      if (!t) return;
      try {
        // 48 кГц ЗДЕСЬ НЕ НУЖНЫ: это условие работы МОДЕЛИ, а пик амплитуды считается на
        // любой частоте.
        var ctx = regCtx(new (window.AudioContext || window.webkitAudioContext)(),
                         'перегруз микрофона');
        var an = ctx.createAnalyser();
        an.fftSize = 1024; an.smoothingTimeConstant = 0;
        var src = ctx.createMediaStreamSource(new MediaStream([t]));
        src.connect(an);
        WATCH = { ctx: ctx, an: an, src: src };
      } catch (e) {
        // НЕ ПОЛУЧИЛОСЬ МЕРИТЬ - ЭТО НЕ ПОЛОМКА РАЗГОВОРА. Молчим в интерфейсе и говорим
        // в консоль: строка про перегруз просто не появится.
        console.warn('[rnn] анализатор перегруза не завёлся:', e);
      }
    }

    //: СТОРОЖ СНЯЛ ПОДАВЛЕНИЕ - ВТОРОЙ РАЗ НЕ ВКЛЮЧАЕМ. Без этого получился бы круг
    //: «сторож снял - автоматика включила - сторож снял», и человек слышал бы мигание.
    var rnnOffered = false;

    // ═══ СКОЛЬКО ОН СНЯЛ - ЗАМЕР, А НЕ ФЛАГ «ВКЛЮЧЕНО» (закон №35) ═══
    // «Шумодав включён» верно и тогда, когда он не сделал ничего: модель могла не подойти
    // источнику, и человек продолжал бы фонить, считая себя вылеченным. Отчёт называет
    // ЧИСЛО, а нулевой результат - называет нулевым.
    var gainTimer = 0;
    function gainStop() { if (gainTimer) { clearInterval(gainTimer); gainTimer = 0; } }

    function gainStart() {
      gainStop();
      var pr = RNN_PROC;
      if (!pr || !pr.anIn || !pr.anOut) return;
      var a = newStat(), b = newStat();
      var tb = new Float32Array(pr.anIn.fftSize);
      var fb = new Float32Array(pr.anIn.frequencyBinCount);
      var left = Math.round(NS.GAIN_SEC * 1000 / NS.TICK_MS);
      gainTimer = setInterval(function () {
        if (!RNN_ON || RNN_PROC !== pr) { gainStop(); return; }
        // ПАУЗЫ ВЫБИРАЕМ ПО ВХОДУ, А ЗАМЕРЯЕМ ОБА. Выбери мы их по выходу - шумодав сам
        // решал бы, что считать паузой, и отчёт хвалил бы себя.
        var before = a.db.length;
        feed(a, pr.anIn, tb, fb);
        if (a.db.length > before) feed(b, pr.anOut, tb, fb);
        if (--left > 0) return;
        gainStop();
        var va = verdict(a), vb = verdict(b);
        if (!va || !vb) {
          // МОЛЧАНИЕ ТУТ ЧЕСТНЕЕ ВЫДУМАННОГО ЧИСЛА: пауз не набралось, мерить нечего.
          return;
        }
        var d = va.db - vb.db;
        if (d >= NS.GAIN_MIN_DB) {
          say('Шумодав работает: фон −' + Math.round(d) + ' дБ.');
        } else {
          say('Шумодав включён, но фон упал всего на ' + Math.round(d)
              + ' дБ - на этом источнике он не помогает. Выключить можно той же кнопкой.',
              true);
        }
      }, NS.TICK_MS);
    }

    // ═══ ПЕРЕГРУЗ МИКРОФОНА: МЕРИМ СИГНАЛ, А НЕ ЧИТАЕМ ФЛАГ ═══
    // Смотрим НА ИСТОЧНИК в обоих состояниях: при выключенном шумодаве это анализатор
    // наблюдателя фона, при включённом - входной анализатор процессора. Перегруз
    // случается ДО нас, в цепочке захвата, и от того, обрабатываем мы звук или нет, он
    // не зависит - значит и мерить его надо одинаково.
    var CLIP = { n: 0, hit: 0, said: false }, clipTimer = 0;

    function clipTick() {
      var an = (RNN_PROC && RNN_PROC.anIn) || (WATCH && WATCH.an) || null;
      if (!an) return;
      var buf = new Float32Array(an.fftSize);
      an.getFloatTimeDomainData(buf);
      var pk = 0;
      for (var i = 0; i < buf.length; i++) {
        var v = buf[i] < 0 ? -buf[i] : buf[i];
        if (v > pk) pk = v;
      }
      CLIP.n++;
      if (pk >= NS.CLIP_PEAK) CLIP.hit++;
      // ОКНО СКОЛЬЗЯЩЕЕ: за час разговора один хриплый эпизод не должен висеть в строке
      // до конца созвона, а свежий - обязан появиться.
      if (CLIP.n > 600) { CLIP.n = 300; CLIP.hit = Math.round(CLIP.hit / 2); }
      if (CLIP.n < NS.CLIP_MIN) return;
      var share = CLIP.hit / CLIP.n;
      // ДВА ПОРОГА, КАК У СТОРОЖА ПРОЦЕССОРА: строка, мигающая на границе, читается как
      // случайная и перестаёт что-либо значить.
      var bad = share >= NS.CLIP_SHARE;
      var okAgain = share <= NS.CLIP_SHARE / 2;
      if (bad === CLIP.said || (!bad && !okAgain)) return;
      CLIP.said = bad;
      AUDIO_CLIP = bad
        ? ('микрофон перегружается: ' + (share * 100).toFixed(1) + '% кадров упираются в '
           + 'потолок. АРУ этого не лечит - убавь усиление микрофона в настройках системы')
        : '';
      paintAudio();
    }

    // ═══ СТОРОЖ ПРОЦЕССОРА: ДВА ПОРОГА, ЧТОБЫ НЕ ХЛОПАТЬ ═══
    // Доклад приходит раз в секунду из самого worklet'а, поэтому счёт докладов и есть
    // счёт секунд. Между `CPU_OK` и `CPU_BAD` счётчик НЕ РАСТЁТ И НЕ СБРАСЫВАЕТСЯ - это и
    // есть гистерезис: на границе сторож молчит вместо того, чтобы включать и выключать.
    var cpuBad = 0;
    function cpuOnLoad(load, model) {
      if (load >= NS.CPU_BAD) cpuBad += 1;
      else if (load <= NS.CPU_OK) { cpuBad = 0; return; }
      if (cpuBad < NS.CPU_HOLD_SEC) return;
      cpuBad = 0;
      var pct = Math.round(load * 100);
      var now = model || (RNN_PROC && RNN_PROC.model) || '';
      // ═══ ОТКАТ ПО ЖИВОЙ ЗАНЯТОСТИ, А НЕ ПО КЛАССУ УСТРОЙСТВА ═══
      // Тяжёлая модель уступает лёгкой, лёгкая - снимается совсем. Решает ФАКТ работы на
      // ЭТОМ устройстве: «десктоп» бывает разный, и запас у GTCRN всего ×2.7 - у него
      // срыв кванта ближе, чем у RNNoise с ×10.6.
      if (now === 'gtcrn') {
        // ЛЕГЧЕ, А НЕ ВЫКЛЮЧИТЬ: у RNNoise занятость в 2.5 раза ниже, и шанс, что
        // устройство её потянет, настоящий. Выключить сразу значило бы отнять подавление
        // у того, кому оно нужно, не попробовав дешёвый путь.
        diag('перегруз ' + pct + '% звукового потока ' + NS.CPU_HOLD_SEC
             + ' с подряд -> GTCRN снят, иду на RNNoise', 'шумодав');
        dnSwitch('rnnoise', 'устройство не тянет GTCRN (' + pct + '% звукового потока)');
        return;
      }
      // ЛЕГЧЕ УЖЕ НЕКУДА - СНИМАЕМ И ГОВОРИМ. Захлебнувшаяся обработка это не «чуть хуже
      // качество», это рвущийся звук: сначала снимаем, потом объясняем.
      // И БОЛЬШЕ НЕ ПРЕДЛАГАЕМ: `rnnApply(false)` заводит наблюдателя фона заново, а фон
      // никуда не делся - без этой строки получился бы круг «сторож снял - детектор
      // предложил - человек включил - сторож снял».
      rnnOffered = true;
      diag('перегруз ' + pct + '% звукового потока на RNNoise -> подавление снято',
           'шумодав');
      rnnApply(false, 'устройство не справляется');
      say('Шумодав выключен: устройство не справляется (обработка съедала ' + pct
          + '% звукового потока). Звук идёт как был.', true);
    }

    //: ═══ АДМИНСКИЙ ВЫБОР МОДЕЛИ: ТОЛЬКО СВОЙ МИКРОФОН, И ПОДПИСЬ ГОВОРИТ ЭТО ═══
    //: ТРЕБОВАНИЕ REN ДОСЛОВНО: «действует ТОЛЬКО на микрофон самого админа, на других не
    //: влияет никак… Подпись должна это говорить прямо, иначе прочтут как «включить
    //: всем»». Поэтому в порт уходит СВОЯ цепочка, ни одного сообщения в комнату отсюда
    //: не идёт, а строка под кнопкой называет границу словами.
    //: ПЕРЕБОР ИЗ ТРЁХ: авто (решает SIMD и живая занятость) -> GTCRN -> RNNoise ->
    //: выключен -> снова авто. Круг замкнут, то есть обратный путь есть у КАЖДОГО
    //: значения (закон №55), и «вернуть как было» это тап, а не чистка localStorage.
    var DN_CYCLE = ['', 'gtcrn', 'rnnoise', 'off'];
    dnPaint = function () {
      var b = $('dnpick'), w = $('dnpickwhy');
      if (!b) return;
      if (!iAmAdm) { b.style.display = 'none'; if (w) w.textContent = ''; return; }
      b.style.display = '';
      var pref = dnPrefGet();
      //: ПОКАЗЫВАЕМ И ВЫБОР, И ФАКТ. «Авто» само по себе не отвечает на вопрос «чем меня
      //: сейчас чистят», а именно он тут и нужен: сравнивать две модели на записи можно
      //: только зная, какая играла. Факт берём у живого процессора, а не у выбора - они
      //: расходятся законно (нет SIMD, откат по занятости).
      var live = (RNN_ON && RNN_PROC && RNN_PROC.model) || '';
      var name = pref === 'off' ? 'выключен'
               : pref === '' ? ('авто' + (live ? ' · ' + DN[live].human : ''))
               : (DN[pref] ? DN[pref].human : pref);
      b.textContent = '🎛 Мой шумодав: ' + name;
      if (!w) return;
      var why = 'Это про ТВОЙ микрофон и больше ничей: у остальных ничего не меняется.';
      //: РАСХОЖДЕНИЕ ВЫБОРА С ФАКТОМ НАЗЫВАЕТСЯ, А НЕ МОЛЧИТ (ТЗ п.8). Иначе админ
      //: сравнивал бы «GTCRN против RNNoise», слушая RNNoise в обоих случаях.
      if (pref && pref !== 'off' && live && live !== pref) {
        why += ' Выбран ' + (DN[pref] ? DN[pref].human : pref) + ', а работает '
             + DN[live].human
             + (DN[pref] && DN[pref].simd && !hasSimd()
                ? ': у этого браузера нет SIMD, GTCRN тут не запустится.'
                : ': сняли по занятости звукового потока.');
      } else if (pref && pref !== 'off' && !live) {
        why += ' Выбран ' + (DN[pref] ? DN[pref].human : pref)
             + ', но подавление сейчас не работает.';
      }
      w.textContent = why;
    };
    dnCycle = async function () {
      var i = DN_CYCLE.indexOf(dnPrefGet());
      var next = DN_CYCLE[(i < 0 ? 0 : i + 1) % DN_CYCLE.length];
      dnPref(next);
      //: ПУСТОЙ ВЫБОР («авто») - ЭТО ТОЖЕ РЕШЕНИЕ, И ЕГО НАДО ПРИМЕНИТЬ: `dnWanted`
      //: превратит его в модель по SIMD, а не оставит как есть.
      await dnSwitch(next === '' ? dnWanted() : next, 'выбор админа');
      dnPaint();
    };

    //: ═══ КТО ПОПРОСИЛ: ЧЕЛОВЕК ИЛИ МЕХАНИЗМ ═══
    //: Разница видна не нам, а ЧЕЛОВЕКУ: на своё действие он ждёт ответа сразу («включаю,
    //: пара секунд»), а на автоматику - объяснения ПРИЧИНЫ («выключен: устройство не
    //: справляется»). Раньше признаком было слово «тап», и вместе с кнопкой оно исчезло
    //: бы молча - каждая из четырёх строк ниже начала бы врать про то, кто это сделал.
    var BY_HAND = { 'выбор': 1, 'выбор админа': 1 };
    function byHand(why) { return !!BY_HAND[String(why || '')]; }

    //: ═══ СМЕНА МОДЕЛИ БЕЗ ПЕРЕСБОРКИ ЦЕПОЧКИ ═══
    //: Цепочка стоит - шлём сообщение в порт: пересоздание процессора рвёт публикацию
    //: микрофона, то есть откат под нагрузкой стоил бы паузы в разговоре ровно тогда,
    //: когда у человека и так рвётся звук. Цепочки нет - поднимаем её обычным путём.
    //: МОЛЧАЛИВОГО ОТКАЗА НЕТ НИ В ОДНОЙ ВЕТКЕ: не переключилось - НАЗЫВАЕМ причину.
    async function dnSwitch(which, why) {
      if (which !== 'off' && DN[which] && DN[which].simd && !hasSimd()) {
        say('«' + DN[which].human + '» тут не запустится: браузер без SIMD.', true);
        return false;
      }
      if (which === 'off') { await rnnApply(false, why || 'выбор'); return true; }
      if (!RNN_ON || !RNN_PROC) return await rnnApply(true, why || 'выбор');
      try {
        await RNN_PROC.setModel(which);
        cpuBad = 0;
        if (why) say('Шумодав: ' + DN[which].human + ' (' + why + ').');
        return true;
      } catch (e) {
        say('Не переключил шумодав на ' + DN[which].human + ': '
            + String((e && e.message) || e), true);
        return false;
      }
    }

    // СТРОКА СЛЕДУЕТ ЗА СОСТОЯНИЕМ, А НЕ ЗА ПОРЯДКОМ СТРОК: браузерная часть меряется
    // один раз при захвате, а наш шумодав может смениться посреди созвона (откат по
    // занятости кванта) - и человек обязан увидеть, ЧЕМ его чистят сейчас.
    function rnnPaint() { paintAudio(); if (dnPaint) dnPaint(); }

    // ═══ СОСТОЯНИЕ РАССЫЛАЕМ САМИ: АДМИН ВИДИТ ФАКТ, А НЕ СВОЮ ЖЕ ПРОСЬБУ ═══
    // Бот знает только то, что попросил, - а включает шумодав КЛИЕНТ и вправе не смочь
    // (нет wasm, не тот sampleRate, человек выключил обратно). Показывать админу
    // отправленную просьбу вместо факта значило бы врать ровно тем способом, ради
    // которого этот экран и заводится.
    function rnnSay() {
      try { upsert(room.localParticipant.identity, { rnn: RNN_ON }); } catch (e) {}
      send({ t: 'rnn', on: RNN_ON });
    }

    // ═══════════ ОДНА ДВЕРЬ НА ВСЕ ПУТИ ВКЛЮЧЕНИЯ ═══════════
    // Автоматика входа, сторож занятости кванта, смена голоса и админский выбор модели
    // обязаны делать ОДНО И ТО ЖЕ: иначе, например, автоматика включила бы шумодав,
    // забыв снять встроенный, и мы получили бы двойную обработку (закон №40).
    async function rnnApply(on, why, force) {
      on = !!on;
      var pub = micPub();
      if (!pub || !pub.track || !pub.track.setProcessor) {
        if (byHand(why)) say('Этот клиент не умеет подключать шумодав к дорожке.', true);
        return false;
      }
      if (rnnBusy || (on === RNN_ON && !force)) { rnnPaint(); return on === RNN_ON; }
      rnnBusy = true;
      // ═══ ЦЕПОЧКА НУЖНА, ЕСЛИ НУЖНА ХОТЬ ОДНА ЕЁ СТУПЕНЬ ═══
      // Раньше решал ровно `on`, и сдвиг высоты был бы доступен только вместе с
      // подавлением - то есть смена голоса молча включала бы человеку обработку, о
      // которой он не просил.
      var _pitch = voiceRatio();
      var _need = on || _pitch !== 1;
      var _wasOn = RNN_ON;
      try {
        if (_need) {
          watchStop();
          if (on && byHand(why)) say('Включаю шумодав, это пара секунд…');
          // БАЙТЫ МОДЕЛИ ТЯНЕМ ТОЛЬКО ПОД ПОДАВЛЕНИЕ: цепочка ради одного сдвига высоты
          // не должна качать модель и поднимать нейросеть в звуковом потоке.
          var proc = rnnProcessor(on ? await dnPlan() : null, _pitch);
          proc.onLoad = cpuOnLoad;
          // setProcessor ПОДМЕНЯЕТ ДОРОЖКУ У ОТПРАВИТЕЛЯ, А НЕ ПЕРЕИЗДАЁТ ПУБЛИКАЦИЮ.
          // Именно поэтому переключение здесь безопасно и во время показа экрана, и
          // посреди разговора: сама публикация микрофона не трогается вовсе.
          await pub.track.setProcessor(proc);
          RNN_PROC = proc;
          RNN_ON = on;
          cpuBad = 0;
          await applyAudio(audioWant());
          // ЗАМЕР ЭФФЕКТА - ПРО ПОДАВЛЕНИЕ, И БЕЗ НЕГО ЕМУ НЕЧЕГО МЕРИТЬ: «фон -14 дБ»
          // над одним сдвигом высоты было бы числом без механизма (закон №22).
          if (on) gainStart(); else gainStop();
          if (on && why && !byHand(why)) say('Шумодав включён (' + why + ').');
        } else {
          gainStop();
          await pub.track.stopProcessor();
          RNN_PROC = null;
          RNN_ON = false;
          await applyAudio(audioWant());
          watchStart();
          // ГОВОРИМ ВСЕГДА, А НЕ ТОЛЬКО ПО СВОЕМУ ТАПУ. Шумодав снимает ещё сторож
          // процессора и админ, и молчаливое снятие человек услышит как «шум вернулся
          // сам» - то есть пойдёт чинить микрофон. «Никаких уведомлений» из ТЗ - это про
          // АДМИНА, которому не докладывают о чужом локальном выборе, а не про хозяина
          // микрофона.
          // НО ТОЛЬКО ЕСЛИ ОН ПРАВДА БЫЛ ВКЛЮЧЁН: цепочка могла стоять ради ГОЛОСА, и
          // «шумодав выключен» тому, у кого его не было, отправляет искать поломку там,
          // где ничего не менялось.
          if (_wasOn) {
            say(byHand(why) ? 'Шумодав выключен.'
                              : ('Шумодав выключен (' + (why || 'не мной') + ').'));
          }
        }
      } catch (e) {
        // ОСТАЁМСЯ НА ИСХОДНОЙ ДОРОЖКЕ И ВОЗВРАЩАЕМ ВСТРОЕННОЕ ПОДАВЛЕНИЕ: уйти
        // одновременно без нашего и без браузерного значило бы оставить человека в эфире
        // хуже, чем он был до тапа.
        RNN_ON = false; RNN_PROC = null;
        // ═══ СНИМАЕМ ПРОЦЕССОР ЯВНО, А НЕ НАДЕЕМСЯ НА SDK ═══
        // `init` мог упасть ПОСЛЕ того, как livekit-client уже подменил дорожку у
        // отправителя, - проверить это из контейнера нечем (закон №48), а цена ошибки
        // здесь ТИШИНА В ЭФИРЕ: обработанной дорожки нет, а исходная уже не публикуется.
        // Один безусловный `stopProcessor` делает вопрос неважным: что бы SDK ни успел,
        // публикуется источник.
        try { await pub.track.stopProcessor(); } catch (e2) {}
        try { await applyAudio(audioWant()); } catch (e2) {}
        // ═══ БРАУЗЕР НЕ ДАЁТ ЗАПУСТИТЬ ЗВУК БЕЗ ЖЕСТА - ЭТО НЕ ПОЛОМКА, А ОЖИДАНИЕ ═══
        // Авто-включение при входе идёт БЕЗ жеста по построению, и на таком клиенте
        // красная строка вылезала бы при КАЖДОМ заходе - то есть сторож кричал бы всегда,
        // и на него перестали бы смотреть. Ждём первого касания и включаем молча; строка
        // при этом всё равно есть, но спокойная и объясняющая, а не отказ.
        var _needGesture = String((e && e.message) || '').indexOf('без твоего действия') >= 0;
        if (_needGesture && why === 'по умолчанию') {
          rnnArmGesture();
          say('Шумодав включится при первом касании экрана: раньше браузер обработку '
              + 'звука не запускает. Пока идёт встроенное подавление.');
        } else {
          // МОЛЧАЛИВЫХ ФОЛБЭКОВ ЗДЕСЬ НЕТ: неудачу видно строкой, а не по звуку. И строка
          // называет ТО НАПРАВЛЕНИЕ, которое не вышло: «не включился» над упавшим
          // ВЫКЛЮЧЕНИЕМ отправляет человека искать не ту поломку - тем более что снять
          // шумодав могли не он, а сторож процессора или админ.
          say((on ? 'Шумодав не включился (' : 'Шумодав не выключился (')
              + (e && e.message || e) + '). Звук идёт как был.', true);
        }
        watchStart();
      }
      rnnBusy = false;
      rnnPaint();
      rnnSay();
      return RNN_ON === on;
    }

    // ═══ ЖДЁМ ПЕРВОГО КАСАНИЯ И ПРОБУЕМ СНОВА - ОДИН РАЗ ═══
    // Условие, из-за которого мы не смогли включиться, снимается РОВНО ЖЕСТОМ, и ждать
    // его дешевле, чем требовать от человека найти кнопку. Слушатель одноразовый: второй
    // отказ уже не про жест, и крутить его по кругу значит скрывать настоящую причину.
    var gestureArmed = false;
    function rnnArmGesture() {
      if (gestureArmed) return;
      gestureArmed = true;
      var fire = function () {
        document.removeEventListener('pointerdown', fire, true);
        document.removeEventListener('keydown', fire, true);
        // СОСТОЯНИЕ МОГЛО ПОМЕНЯТЬСЯ, ПОКА МЫ ЖДАЛИ ЖЕСТА: шумодав мог подняться сам
        // (второй заход `rnnBoot`) либо админ мог выбрать себе «выключен». Перепроверяем,
        // а не включаем вслепую.
        if (RNN_ON || dnWanted() === 'off') return;
        rnnApply(true, 'по умолчанию');
      };
      document.addEventListener('pointerdown', fire, true);
      document.addEventListener('keydown', fire, true);
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // ИЗМЕНЕНИЕ ГОЛОСА: ТА ЖЕ ЦЕПОЧКА, ЧТО У ШУМОДАВА, И ДО publishTrack
    // ═══════════════════════════════════════════════════════════════════════════════
    // ГДЕ ИМЕННО ЭТО ВСТРАИВАЕТСЯ (ответ по коду, а не намерение): у livekit-client
    // дорожка держит РОВНО ОДИН процессор, `setProcessor` снимает предыдущий. Значит
    // отдельный «процессор высоты» рядом с шумодавом невозможен - он выключил бы его
    // МОЛЧА. Обе ступени живут в одном worklet'е и меняются сообщением в порт, без
    // пересборки цепочки: пересоздание рвало бы публикацию микрофона на каждом тапе.
    //
    // СКОЛЬКО ЭТО СТОИТ ПО CPU - НЕ ОЦЕНКА, А ЗАМЕР НА ТОМ САМОМ УСТРОЙСТВЕ. Worklet уже
    // докладывает `load` (долю бюджета звукового потока за секунду), а `cpuOnLoad` уже
    // снимает обработку на телефоне при пяти секундах подряд выше 0.80. То есть цена
    // МЕРИТСЯ и сама себя ограничивает; порядок величин при этом известен и без замера:
    // сдвиг - десяток операций на сэмпл против нейросети RNNoise, которая идёт рядом.
    //
    // СУБТИТРЫ ПОЙДУТ ПО ИЗМЕНЁННОМУ ГОЛОСУ, И ЭТО СКАЗАНО ЧЕЛОВЕКУ. Распознавание
    // подписано на ОПУБЛИКОВАННУЮ дорожку, а `setProcessor` подменяет именно её.
    function voicePaint() {
      var b = $('voice');
      if (!b) return;
      var st = VOICE_STEPS[voiceIdx] || VOICE_STEPS[0];
      // ПОДПИСЬ ПОКАЗЫВАЕТ ТЕКУЩЕЕ, А НЕ РЕЗУЛЬТАТ ТАПА: у перебора из пяти значений
      // «что будет дальше» не отвечает на вопрос «в каком я сейчас» (то же исключение
      // из правила подписей, что у «Раскладки»).
      b.textContent = '🎭 Голос: ' + st.name;
      b.classList.toggle('on', voiceIdx !== 0);
      var w = $('voicewhy');
      if (!w) return;
      w.textContent = voiceIdx === 0
        ? 'Голос можно изменить: слышат все, кроме тебя, - проверь на записи.'
        : ('Тебя слышат как «' + st.name + '» - все, кроме тебя самого. Проверь на '
           + 'записи созвона. Субтитры пойдут по изменённому голосу, так что распознавание '
           + 'будет хуже. Сбросить - тапами до «обычный».');
    }

    //: ОДНА ДВЕРЬ НА СМЕНУ ГОЛОСА. Живая цепочка получает новое значение сообщением;
