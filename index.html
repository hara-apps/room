          say('Показать не вышло (' + (e && e.name || 'ошибка') + '): '
              + (e && e.message || e), true);
        }
      };
    }

    // ЯВНАЯ ОСТАНОВКА ЛОКАЛЬНЫХ ДОРОЖЕК. Ищем среди своих публикаций те, что относятся к
    // этому виду, и зовём stop() на КАЖДОЙ - у показа экрана их две (картинка и звук
    // вкладки), и забытая вторая держит захват.
    function stopLocalMedia(kind) {
      try {
        var pubs = room.localParticipant.trackPublications
                || room.localParticipant.tracks || new Map();
        pubs.forEach(function (pub) {
          var src = String(pub.source || '');
          var mine = (kind === 'screen')
            ? (src.indexOf('screen') >= 0)
            : (src === 'camera');
          if (!mine || !pub.track) return;
          try { pub.track.stop(); } catch (e) {}
          var ms = pub.track.mediaStreamTrack;
          if (ms) { try { ms.stop(); } catch (e) {} }
        });
      } catch (e) {}
    }

    toggler(showBtn, 'screen', '⏹ Остановить показ', '🖥 Показать экран');
    toggler(camBtn, 'camera', '⏹ Выключить камеру', '📷 Показать камеру');

    // ═══ РУКА И ОЧЕРЕДЬ СЛОВА - ПО КАНАЛУ ДАННЫХ LIVEKIT ═══
    // Он идёт по тому же соединению, что звук: это на порядок быстрее опроса нашего ящика
    // раз в 1.2-3 секунды, и ради трёх кнопок второй транспорт заводить незачем.
    var handUp = false;
    function send(obj) {
      try {
        room.localParticipant.publishData(
          new TextEncoder().encode(JSON.stringify(obj)), { reliable: true });
      } catch (e) {}
    }
    $('hand').onclick = function () {
      handUp = !handUp;
      $('hand').classList.toggle('on', handUp);
      $('hand').textContent = handUp ? '✋ Опустить руку' : '✋ Поднять руку';
      upsert(room.localParticipant.identity, { hand: handUp ? Date.now() : 0 });
      send({ t: 'hand', up: handUp });
    };
    // ЗАГЛУШИТЬ ВСЕХ - ПРОСЬБА, А НЕ ПРИКАЗ, И ЭТО СКАЗАНО ЧЕСТНО. Серверного «замолчи»
    // мы не шлём: для него нужен админский грант у каждого, а это право выключать чужой
    // микрофон кому угодно. Клиенты глушат СЕБЯ сами; тот, кто не захочет, останется
    // слышен - для лекции этого достаточно, для принуждения нет.
    $('hush').style.display = '';
    $('hush').onclick = function () { send({ t: 'hush' }); say('Попросил всех приглушиться.'); };

    //: КАК НАС ЗОВУТ ДЛЯ ОСТАЛЬНЫХ. В `people` мы записаны словом «Ты» - его нельзя ни
    //: рассылать, ни ставить в подпись таймера: у соседа «поставил Ты» не значит ничего.
    function myLabel() {
      return human(room.localParticipant.name, room.localParticipant.identity);
    }
    function nameOf(p) {
      var rec = people[p.identity];
      return (rec && rec.name && !rec.me) ? rec.name : human(p.name, p.identity);
    }

    // ТЕМП СВОЙ И ЧУЖОЙ СЧИТАЮТСЯ ОТДЕЛЬНО, И ЭТО НЕ ПЕРЕСТРАХОВКА. Свой бережёт соседей
    // от нашей же залипшей кнопки; чужой бережёт НАС от того, у кого она залипла, - и
    // одним счётчиком это не закрыть, потому что у них разные владельцы.
    var lastReact = 0, lastFrom = {};
    function canReact() {
      var now = Date.now();
      if (now - lastReact < 600) return false;
      lastReact = now;
      return true;
    }
    function floodOk(id) {
      var now = Date.now();
      if (now - (lastFrom[id] || 0) < 600) return false;
      lastFrom[id] = now;
      return true;
    }

    // ═══ ЭМОДЗИ-РЕАКЦИИ: ТОЛЬКО КАНАЛ ДАННЫХ, НИ БАЙТА ЗВУКА ═══
    // Реакция обязана работать и у того, кто молчит с выключенным микрофоном, и у
    // веб-гостя без Telegram: ящик бота тут не участвует вовсе, поэтому и гейта нет.
    ['👍', '❤️', '😂', '🔥', '🤔', '😮', '🙏', '🎉'].forEach(function (e) {
      var b = document.createElement('button');
      b.className = 'emo';
      b.textContent = e;
      b.onclick = function () {
        if (!canReact()) return;
        popup('Ты  ' + e);
        send({ t: 'react', e: e });
      };
      $('emos').appendChild(b);
    });

    Object.keys(SOUNDS).forEach(function (id) {
      var s = SOUNDS[id];
      var b = document.createElement('button');
      b.className = 'snd';
      b.textContent = s.e + ' ' + s.t;
      b.onclick = function () {
        if (!canReact()) return;
        // ЗВУК ИГРАЕТ И У ОТПРАВИТЕЛЯ. Иначе он не знает, сработала ли кнопка, жмёт
        // второй раз - и у остальных играет дважды.
        playSnd(id);
        popup('Ты  ' + s.e + ' ' + s.t);
        send({ t: 'snd', s: id });
      };
      $('snds').appendChild(b);
    });
    // ГРАНИЦА НАЗЫВАЕТСЯ СРАЗУ: звук идёт каналом данных, а пишется МИКРОФОН. Человек,
    // который «поставил аплодисменты в запись», узнал бы об этом только из транскрипта.
    $('reacthint').textContent = 'Слышат все, кто сейчас в комнате. В запись реакции не '
      + 'попадают: они идут отдельным каналом, а не через микрофон.';

    // ═══════════════════════════════════════════════════════════════════════════════
    // ТАЙМЕР: ПЕРЕДАЁМ ОСТАТОК, А НЕ МОМЕНТ КОНЦА
    // ═══════════════════════════════════════════════════════════════════════════════
    // Часы у телефонов расходятся на минуты, и абсолютная метка показала бы одному
    // «осталось 4:59», другому «время вышло» - причём выглядело бы это как наш баг.
    // Остаток от расхождения часов не зависит вовсе: каждый считает СВОЙ дедлайн от
    // своего же «сейчас», а задержка канала данных (десятки миллисекунд) для
    // пятиминутного таймера не значит ничего.
    var tmrEnd = 0, tmrBy = '', tmrTick = null, tmrFired = false;

    function stopTmrLoop() { if (tmrTick) { clearInterval(tmrTick); tmrTick = null; } }

    // ═══ ОДИН МЕХАНИЗМ «ДОГНАТЬ ВОШЕДШЕГО ПОЗЖЕ» НА ВСЁ ОБЩЕЕ СОСТОЯНИЕ ═══
    // Канал данных доставляет ТОЛЬКО тем, кто уже в комнате. Значит у каждого общего
    // состояния (таймер, график) обязан быть повтор - и это ОДНО правило, а не по копии
    // на фичу: две копии разъехались бы периодом и условием остановки, а заметил бы это
    // человек, у которого «у всех график BTC, а у меня пусто» (закон №40).
    var BEAT_MS = 5000;
    var beats = {};
    function beat(key, fn) {
        stopBeat(key);
        if (!fn) return;
        beats[key] = setInterval(function () {
            var m = fn();
            if (m) send(m); else stopBeat(key);
        }, BEAT_MS);
    }
    function stopBeat(key) {
        if (key === undefined) {                 // без имени - погасить всё (выход/сброс)
            Object.keys(beats).forEach(stopBeat);
            return;
        }
        if (beats[key]) { clearInterval(beats[key]); delete beats[key]; }
    }
    function tmrMenu(on) { $('tmrset').style.display = on ? '' : 'none'; }

    function tmrPaint() {
      var bar = $('tmrbar');
      if (!tmrEnd) { bar.style.display = 'none'; bar.className = 'tmr'; return; }
      var left = Math.max(0, Math.round((tmrEnd - Date.now()) / 1000));
      bar.style.display = '';
      if (left > 0) {
        bar.className = 'tmr';
        bar.textContent = '⏱ ' + Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2)
          + (tmrBy ? ' · поставил ' + tmrBy : '');
        return;
      }
      bar.className = 'tmr fin';
      bar.textContent = '⏱ Время вышло' + (tmrBy ? ' · таймер ' + tmrBy : '');
      if (tmrFired) return;
      tmrFired = true;
      stopTmrLoop();
      stopBeat('tmr');
      $('tmr').classList.remove('on');
      // У КОНЦА ТАЙМЕРА ДВА НЕЗАВИСИМЫХ СПОСОБА ДОЙТИ. Звук может не сыграть вовсе -
      // браузер держит аудио-контекст, пока человек ничего не нажимал, - и тогда
      // единственным сигналом остаётся строка. Полагаться на один было бы обещанием.
      playSnd('gong');
      popup('⏰ Время вышло');
      // СТРОКА ГАСНЕТ САМА, НО НЕ СРАЗУ: тот, кто смотрел в другое окно, обязан успеть
      // её увидеть.
      setTimeout(function () {
        if (!tmrFired) return;
        tmrEnd = 0;
        tmrPaint();
      }, 15000);
    }

    //: mine=true - таймер ставим МЫ, значит на нас же сердцебиение.
    function tmrSet(sec, by, mine) {
      stopTmrLoop();
      stopBeat('tmr');
      tmrFired = false;
      if (!(sec > 0)) {                       // ноль и меньше - снятие
        tmrEnd = 0;
        tmrBy = '';
        $('tmr').classList.remove('on');
        tmrPaint();
        return;
      }
      tmrEnd = Date.now() + sec * 1000;
      tmrBy = by || '';
      $('tmr').classList.add('on');
      tmrTick = setInterval(tmrPaint, 500);
      tmrPaint();
      if (!mine) return;
      // СЕРДЦЕБИЕНИЕ - РАДИ ВОШЕДШИХ ПОЗЖЕ. Канал данных доставляет только тем, кто уже в
      // комнате: без повтора человек, зашедший на второй минуте, не увидел бы таймера
      // ВООБЩЕ (тот же класс, что рассылка признака записи вместо метаданных комнаты).
      // ЧЕСТНАЯ ГРАНИЦА: уйдёт поставивший - повтор прекратится, но у тех, кто уже
      // получил остаток, таймер досчитает и прозвонит сам; не увидят его только те, кто
      // войдёт ПОСЛЕ его ухода.
      beat('tmr', function () {
        var left = Math.round((tmrEnd - Date.now()) / 1000);
        if (left <= 0) return null;              // вернул null - повтор гасится сам
        return { t: 'tmr', left: left, by: myLabel() };
      });
    }

    // ═════════════════════════════════════════════════════════════════════════════
    // ГРАФИК: ОДИН НА КОМНАТУ, МЕНЯЕТ ЛЮБОЙ, И ВИДНО КТО
    // ═════════════════════════════════════════════════════════════════════════════
    // ВЕДУЩЕГО В ЭТОЙ КОМНАТЕ НЕТ КАК ПОНЯТИЯ, и заводить его ради одной кнопки значило
    // бы городить права там, где у нас всё построено на договорённости («заглушить всех»
    // это просьба, а не приказ). Поэтому пару меняет любой, а рядом ИМЯ того, кто
    // поменял: спорить о том, кто сбил график, не придётся.
    //
    // ВИДЖЕТ НЕ УМЕЕТ МЕНЯТЬ СИМВОЛ НА ЛЕТУ. У бесплатного встраиваемого графика нет
    // наружного JS-API (платная Charting Library - другая история и другие деньги),
    // поэтому смена пары это ПЕРЕСОЗДАНИЕ. Отсюда же берётся мигание при переключении -
    // это свойство виджета, а не наша недоделка.
    var SYMS = [['BTC', 'BINANCE:BTCUSDT'], ['ETH', 'BINANCE:ETHUSDT'],
                ['SOL', 'BINANCE:SOLUSDT'], ['TON', 'BINANCE:TONUSDT'],
                ['DXY', 'TVC:DXY'], ['GOLD', 'TVC:GOLD']];
    var TFS = [['5м', '5'], ['15м', '15'], ['1ч', '60'], ['4ч', '240'], ['D', 'D']];
    var chSym = '', chTf = '60', chBy = '', chOpen = false;

    //: СИМВОЛ ЧИСТИТСЯ, ПОТОМУ ЧТО ПРИХОДИТ ОТ КЛИЕНТА И УЕЗЖАЕТ В ЧУЖОЙ ВИДЖЕТ. Строка
    //: из канала данных - это строка, которую написал сосед, а не мы; пустить её как есть
    //: значит дать ему решать, что подставится в конфиг у всех остальных.
    function symOk(x) {
      var v = String(x || '').toUpperCase().replace(/[^A-Z0-9:_.\-]/g, '').slice(0, 24);
      return /^[A-Z0-9_.\-]{2,}(:[A-Z0-9_.\-]{2,})?$/.test(v) ? v : '';
    }
    function tfOk(x) {
      var v = String(x || '').toUpperCase().slice(0, 4);
      return /^(1|3|5|15|30|60|120|240|D|W|M)$/.test(v) ? v : '';
    }

    function chartPaint() {
      var box = $('chartbox');
      $('crypto').style.display = chOpen ? '' : 'none';
      $('chart').classList.toggle('on', chOpen);
      if (!chOpen) return;
      // ХОЛСТ ПЕРЕЖИВАЕТ ПЕРЕСОЗДАНИЕ ГРАФИКА: он лежит В ТОЙ ЖЕ коробке, и снеси мы её
      // целиком - вместе с чужим графиком стёрлись бы все чужие штрихи.
      var keep = $('draw');
      [].slice.call(box.children).forEach(function (c) { if (c !== keep) box.removeChild(c); });
      if (!chSym) {
        $('chartwho').textContent = 'Выбери пару - график увидят все, кто в комнате.';
        return;
      }
      var host = document.createElement('div');
      host.style.cssText = 'position:absolute;inset:0';
      box.insertBefore(host, keep);
      var sc = document.createElement('script');
      sc.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
      sc.async = true;
      sc.text = JSON.stringify({
        symbol: chSym, interval: chTf, theme: 'dark', style: '1', locale: 'ru',
        hide_side_toolbar: true, hide_top_toolbar: false, allow_symbol_change: false,
        save_image: false, autosize: true,
      });
      host.appendChild(sc);
      $('chartwho').textContent = chSym + ' · ' + chTf
        + (chBy ? ' · поставил ' + chBy : '');
      paintSymBtns();
    }

    function chartSet(sym, tf, by, mine) {
      var s2 = symOk(sym), t2 = tfOk(tf) || chTf;
      if (sym && !s2) {
        // ОТБРОШЕННОЕ НАЗЫВАЕТСЯ. Молча проигнорировать чужой символ значит оставить
        // соседа в уверенности, что у всех обновилось.
        say('Пара «' + String(sym).slice(0, 20) + '» не похожа на тикер - не меняю.', true);
        return;
      }
      chSym = s2; chTf = t2; chBy = by || '';
      if (s2 && !chOpen) chOpen = true;      // прислали график - открываем панель
      chartPaint();
      if (!mine) return;
      beat('chart', function () {
        return chSym ? { t: 'chart', sym: chSym, tf: chTf, by: myLabel() } : null;
      });
      send({ t: 'chart', sym: chSym, tf: chTf, by: myLabel() });
    }

    function paintSymBtns() {
      [].slice.call($('syms').children).forEach(function (b) {
        b.classList.toggle('on', b.dataset.sym === chSym);
      });
      [].slice.call($('tfs').children).forEach(function (b) {
        b.classList.toggle('on', b.dataset.tf === chTf);
      });
    }

    SYMS.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = p[0]; b.dataset.sym = p[1];
      b.onclick = function () { chartSet(p[1], chTf, 'Ты', true); };
      $('syms').appendChild(b);
    });
    var bOther = document.createElement('button');
    bOther.className = 'chip'; bOther.textContent = '✏️ Своя';
    bOther.onclick = function () {
      var v = '';
      try { v = prompt('Пара как в TradingView, например BINANCE:ARBUSDT') || ''; } catch (e) {}
      if (v.trim()) chartSet(v.trim(), chTf, 'Ты', true);
    };
    $('syms').appendChild(bOther);
    TFS.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = p[0]; b.dataset.tf = p[1];
      b.onclick = function () { if (chSym) chartSet(chSym, p[1], 'Ты', true); };
      $('tfs').appendChild(b);
    });
    // ═════════════════════════════════════════════════════════════════════════════
    // СОВМЕСТНЫЙ ХОЛСТ ПОВЕРХ ГРАФИКА
    // ═════════════════════════════════════════════════════════════════════════════
    // ПОЧЕМУ СВОЙ СЛОЙ, А НЕ РАЗМЕТКА TRADINGVIEW. Бесплатный виджет свою разметку наружу
    // не отдаёт вовсе, а Charting Library, которая отдаёт, - платная лицензия. Значит
    // либо свой холст, либо ничего.
    //
    // ═══ КООРДИНАТЫ ДОЛЕЙ, А НЕ ПИКСЕЛЕЙ - ЭТО НЕСУЩЕЕ, А НЕ АККУРАТНОСТЬ ═══
    // У меня телефон 390 px, у соседа десктоп 1200. Пошли мы пиксели - его «вот этот
    // уровень» лёг бы у меня на треть экрана левее, то есть указывал бы на другую цену.
    // Доли (0..1) от коробки графика переносятся между экранами без единой поправки.
    //
    // ЧТО ЕДЕТ В КАНАЛ. Штрихи ПРИРАЩЕНИЯМИ и пачками (не по точке на каждое движение
    // пальца - это залило бы канал), полный штрих не пересылается никогда.
    var CV_MAX = 400;            // штрихов на комнату: без потолка холст растёт вечно
    var CV_PTS = 400;            // точек в штрихе
    var CV_BATCH = 120;          // мс между пачками точек
    var strokes = [], curId = 0, cur = null, tool = 'pen', drawOn = false;
    var outbox = null, batchT = null, tips = {};

    function myColor(id) {
      // ЦВЕТ ВЫВОДИТСЯ ИЗ IDENTITY, А НЕ РАЗДАЁТСЯ ПО ОЧЕРЕДИ: у всех в комнате он обязан
      // получиться ОДИН И ТОТ ЖЕ, иначе «синюю линию нарисовал Ваня» у соседа окажется
      // зелёной. Раздача по порядку входа этого не даёт - порядок у каждого свой.
      var h = 0, str = String(id || '');
      for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
      return 'hsl(' + h + ',85%,62%)';
    }

    function cvFit() {
      var c = $('draw'), b = $('chartbox');
      if (!c || !b) return null;
      var r = b.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (!r.width || !r.height) return null;
      if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) {
        c.width = Math.round(r.width * dpr);
        c.height = Math.round(r.height * dpr);
      }
      return { c: c, w: r.width, h: r.height, dpr: dpr, box: r };
    }

    function cvDraw() {
      var f = cvFit();
      if (!f) return;
      var g = f.c.getContext('2d');
      g.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
      g.clearRect(0, 0, f.w, f.h);
      g.lineCap = 'round';
      g.lineJoin = 'round';
      strokes.forEach(function (st) {
        var p = st.p || [];
        if (!p.length) return;
        g.strokeStyle = st.c;
        g.fillStyle = st.c;
        g.lineWidth = 2.5;
        if (st.k === 'text') {
          g.font = '600 14px -apple-system,Segoe UI,Roboto,sans-serif';
          g.fillText(String(st.x || '').slice(0, 60), p[0][0] * f.w, p[0][1] * f.h);
          return;
        }
        g.beginPath();
        g.moveTo(p[0][0] * f.w, p[0][1] * f.h);
        for (var i = 1; i < p.length; i++) g.lineTo(p[i][0] * f.w, p[i][1] * f.h);
        g.stroke();
        if (st.k === 'arrow' && p.length > 1) {
          // СТРЕЛКА - ЭТО ЛИНИЯ ПЛЮС ДВА ШТРИХА НА КОНЦЕ, а не отдельный инструмент с
          // отдельным протоколом: чем меньше видов штриха, тем меньше мест разойтись.
          var a = p[p.length - 2], b2 = p[p.length - 1];
          var ang = Math.atan2((b2[1] - a[1]) * f.h, (b2[0] - a[0]) * f.w);
          var x2 = b2[0] * f.w, y2 = b2[1] * f.h;
          g.beginPath();
          g.moveTo(x2, y2);
          g.lineTo(x2 - 11 * Math.cos(ang - 0.4), y2 - 11 * Math.sin(ang - 0.4));
          g.moveTo(x2, y2);
          g.lineTo(x2 - 11 * Math.cos(ang + 0.4), y2 - 11 * Math.sin(ang + 0.4));
          g.stroke();
        }
      });
      // ИМЯ РЯДОМ С ЧУЖИМ КУРСОРОМ: без него линия появляется «сама», и понять, кто
      // сейчас чертит, нельзя.
      var now = Date.now();
      Object.keys(tips).forEach(function (k) {
        var t = tips[k];
        if (now - t.at > 2200) { delete tips[k]; return; }
        g.fillStyle = t.c;
        g.font = '600 11px -apple-system,Segoe UI,Roboto,sans-serif';
        g.fillText(t.n, t.x * f.w + 8, t.y * f.h - 6);
      });
    }

    function cvApply(m, who, nm) {
      // ДЕДУП ПО ID ШТРИХА. История догоняет вошедшего кусками и может прийти дважды -
      // от двоих сразу; без дедупа линии удвоились бы и потолстели.
      if (m.t === 'd') {
        var id = String(m.id || '').slice(0, 40);
        if (!id) return;
        var st = null;
        for (var i = strokes.length - 1; i >= 0; i--) if (strokes[i].id === id) { st = strokes[i]; break; }
        if (!st) {
          if (strokes.length >= CV_MAX) strokes.shift();
          // ═══ ЦВЕТ БЕРЁТСЯ ИЗ ID ШТРИХА, А НЕ У ОТПРАВИТЕЛЯ СООБЩЕНИЯ ═══
          // Пока штрихи ездят только «в прямом эфире», отправитель и автор совпадают, и
          // разница невидима. Но историю вошедшему позже пересылает КТО-ТО ОДИН - и по
          // цвету отправителя все чужие линии стали бы ЕГО цветом, то есть доска у
          // новичка выглядела бы иначе, чем у всех остальных.
          st = { id: id, c: myColor(id.split('|')[0] || who),
                 k: String(m.k || 'pen').slice(0, 6), p: [],
                 x: String(m.x || '').slice(0, 60) };
          strokes.push(st);
        }
        var pts = (m.p || []).slice(0, CV_PTS);
        // У ЛИНИИ И СТРЕЛКИ КОНЕЦ ЗАМЕНЯЕТСЯ, А НЕ ДОПИСЫВАЕТСЯ: иначе «резиновая» линия
        // оставляла бы за собой веер промежуточных положений.
        if (st.k === 'line' || st.k === 'arrow') st.p = pts;
        else st.p = st.p.concat(pts).slice(-CV_PTS);
        if (st.p.length && nm) {
          tips[who] = { n: nm, c: st.c, x: st.p[st.p.length - 1][0],
                        y: st.p[st.p.length - 1][1], at: Date.now() };
        }
      } else if (m.t === 'dx') {
        var kill = {};
        (m.ids || []).forEach(function (x) { kill[String(x)] = 1; });
        strokes = strokes.filter(function (x) { return !kill[x.id]; });
      } else if (m.t === 'dc') {
        // ОЧИСТКА БЫВАЕТ ДВУХ РОДОВ, И ЭТО РАЗНЫЕ ПРАВА. Свои штрихи человек убирает
        // молча; ЧУЖИЕ - только явной кнопкой, и она НАЗЫВАЕТ, кто это сделал: стёртая
        // без объяснения чужая работа читается как сбой.
        if (m.all) {
          strokes = [];
          // ПОДПИСИ ЧУЖИХ КУРСОРОВ ЖИВУТ ОТДЕЛЬНО ОТ ШТРИХОВ, и «очистить» обязано снести
          // и их: имя, висящее над пустой доской, читается как недостёртый штрих. Поймано
          // пробой - после очистки на холсте оставались непрозрачные пиксели.
          tips = {};
          if (nm) popup(nm + '  🧹 очистил доску');
        } else {
          strokes = strokes.filter(function (x) { return x.id.indexOf(who + '|') !== 0; });
        }
      }
      cvDraw();
    }

    //: Отдать историю доски вошедшему позже. Кусками: у канала данных сообщение не
    //: резиновое, а сотня штрихов в одном пакете его просто не пролезет.
    //: ДЕДУП НА ПРИЁМЕ (по id штриха) делает лишние копии безвредными - поэтому отвечать
    //: могут все, у кого есть история, и договариваться о «главном» не нужно.
    function cvSendHistory() {
      var CH = 20;
      for (var i = 0; i < strokes.length; i += CH) {
        send({ t: 'dh', s: strokes.slice(i, i + CH).map(function (st) {
          return { id: st.id, k: st.k, x: st.x, p: st.p };
        }) });
      }
    }

    function flush() {
      if (!outbox) return;
      send(outbox);
      outbox = null;
    }
    function pushPts(pts) {
      if (!cur) return;
      if (!outbox) outbox = { t: 'd', id: cur.id, k: cur.k, p: [] };
      outbox.p = (cur.k === 'line' || cur.k === 'arrow') ? pts.slice() : outbox.p.concat(pts);
      if (!batchT) {
        // ПАЧКАМИ, А НЕ ПО ТОЧКЕ НА КАЖДОЕ ДВИЖЕНИЕ: палец даёт под сотню событий в
        // секунду, и по одному сообщению на каждое канал данных встанет колом.
        batchT = setTimeout(function () { batchT = null; flush(); }, CV_BATCH);
      }
    }

    function xy(e) {
      var f = cvFit();
      if (!f) return null;
      return [Math.max(0, Math.min(1, (e.clientX - f.box.left) / f.w)),
              Math.max(0, Math.min(1, (e.clientY - f.box.top) / f.h))];
    }

    var cvEl = $('draw');
    cvEl.addEventListener('pointerdown', function (e) {
      if (!drawOn) return;
      var p = xy(e);
      if (!p) return;
      e.preventDefault();
      var me = room.localParticipant.identity;
      if (tool === 'erase') {
        var kill = strokes.filter(function (st) {
          return (st.p || []).some(function (q) {
            return Math.abs(q[0] - p[0]) < 0.035 && Math.abs(q[1] - p[1]) < 0.05;
          });
        }).map(function (st) { return st.id; });
        if (!kill.length) return;
        cvApply({ t: 'dx', ids: kill }, me, '');
        send({ t: 'dx', ids: kill });
        return;
      }
      if (tool === 'text') {
        var v = '';
        try { v = (prompt('Что подписать?') || '').slice(0, 60); } catch (e2) {}
        if (!v.trim()) return;
        var tid = me + '|' + (++curId);
        var msg = { t: 'd', id: tid, k: 'text', x: v, p: [[+p[0].toFixed(4), +p[1].toFixed(4)]] };
        cvApply(msg, me, '');
        send(msg);
        return;
      }
      cur = { id: me + '|' + (++curId), k: tool, p: [p] };
      cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(p)] }, me, '');
      pushPts([rd(p)]);
      try { cvEl.setPointerCapture(e.pointerId); } catch (e3) {}
    });
    function rd(p) { return [+p[0].toFixed(4), +p[1].toFixed(4)]; }
    cvEl.addEventListener('pointermove', function (e) {
      if (!drawOn || !cur) return;
      var p = xy(e);
      if (!p) return;
      e.preventDefault();
      var me = room.localParticipant.identity;
      if (cur.k === 'line' || cur.k === 'arrow') {
        cur.p = [cur.p[0], p];
        cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(cur.p[0]), rd(p)] }, me, '');
        pushPts([rd(cur.p[0]), rd(p)]);
      } else {
        cur.p.push(p);
        cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(p)] }, me, '');
        pushPts([rd(p)]);
      }
    });
    function endStroke() {
      if (!cur) return;
      cur = null;
      if (batchT) { clearTimeout(batchT); batchT = null; }
      flush();                 // ХВОСТ ПАЧКИ ДОСЫЛАЕМ СРАЗУ: иначе конец линии не доедет
    }
    cvEl.addEventListener('pointerup', endStroke);
    cvEl.addEventListener('pointercancel', endStroke);
    cvEl.addEventListener('pointerleave', endStroke);

    [['✏️', 'pen'], ['📏', 'line'], ['➡️', 'arrow'], ['🔤', 'text'], ['🧽', 'erase']]
      .forEach(function (p) {
        var b = document.createElement('button');
        b.className = 'chip'; b.textContent = p[0]; b.dataset.k = p[1];
        b.onclick = function () {
          // ТАП ПО АКТИВНОМУ ИНСТРУМЕНТУ ВЫКЛЮЧАЕТ РИСОВАНИЕ. Без этого выйти из режима
          // рисования было бы нечем, а холст ловит тапы и не пускает их к графику.
          if (drawOn && tool === p[1]) { drawOn = false; } else { drawOn = true; tool = p[1]; }
          paintTools();
        };
        $('tools2').appendChild(b);
      });
    var bMine = document.createElement('button');
    bMine.className = 'chip'; bMine.textContent = '↩️ Моё';
    bMine.onclick = function () {
      var me = room.localParticipant.identity;
      cvApply({ t: 'dc', all: false }, me, '');
      send({ t: 'dc', all: false });
    };
    $('tools2').appendChild(bMine);
    var bAll = document.createElement('button');
    bAll.className = 'chip'; bAll.textContent = '🧹 Всё';
    bAll.onclick = function () {
      cvApply({ t: 'dc', all: true }, room.localParticipant.identity, '');
      send({ t: 'dc', all: true });
      popup('Ты  🧹 очистил доску');
    };
    $('tools2').appendChild(bAll);

    function paintTools() {
      [].slice.call($('tools2').children).forEach(function (b) {
        b.classList.toggle('on', !!b.dataset.k && drawOn && b.dataset.k === tool);
      });
      $('draw').classList.toggle('on', drawOn);
      $('drawhint').textContent = drawOn
        ? 'Рисуешь. Тап по тому же инструменту - выйти и вернуть график под палец.'
        : 'Рисуют все сразу, каждый своим цветом. Доска живёт и без графика: под ней '
          + 'можно ничего не открывать.';
    }
    paintTools();
    window.addEventListener('resize', cvDraw);

    $('chart').onclick = function () {
      chOpen = !chOpen;
      chartPaint();
      // ОТКРЫЛИ ПУСТУЮ ПАНЕЛЬ - СПРАШИВАЕМ У КОМНАТЫ, ЧТО ТАМ УЖЕ ЕСТЬ. Сердцебиение
      // догонит и само, но ждать до пяти секунд перед пустым экраном человек прочитает
      // как «не работает».
      if (chOpen && !chSym) send({ t: 'ask' });
    };

    // ═══ ОЧЕРЕДЬ ВОПРОСОВ И ГОЛОСОВАНИЕ: КАНАЛОМ ДАННЫХ, КАК РУКА И ТАЙМЕР ═══
    // ВЕДУЩЕГО В КОМНАТЕ НЕТ, И ЗАВОДИТЬ ЕГО РАДИ ЭТИХ ДВУХ КАРТОЧЕК Я НЕ СТАЛ. Порядок
    // вопросов задают ГОЛОСА, а не тот, кто громче; голосование открывает любой, и рядом
    // написано, кто. Это та же граница, что у «заглушить всех»: просьба, а не приказ.
    var ama = [];           // [{id, who, nm, x, v:{identity:1}, done:0, ts}]
    var poll = null;        // {id, q, mkt, by, v:{identity:'y'|'n'|'a'}}
    var AMA_MAX = 40;

    function amaSort() {
      // ГОЛОСА, ПОТОМ ВРЕМЯ. Отвеченные уходят вниз: очередь отвечает на вопрос «кто
      // следующий», а не «что тут было».
      ama.sort(function (a, b) {
        if (!!a.done !== !!b.done) return a.done ? 1 : -1;
        var d = Object.keys(b.v || {}).length - Object.keys(a.v || {}).length;
        return d || (a.ts - b.ts);
      });
    }

    function amaPaint() {
      amaSort();
      var box = $('amalist');
      box.innerHTML = '';
      var me = room.localParticipant.identity;
      ama.forEach(function (q, i) {
        var row = document.createElement('div');
        row.className = 'q' + (q.done ? ' done' : '');
        var n = document.createElement('div');
        n.className = 'qn';
        n.textContent = q.done ? '✓' : (i + 1) + '.';
        var t = document.createElement('div');
        t.className = 'qt';
        t.textContent = q.x;
        var w = document.createElement('div');
        w.className = 'qw';
        w.textContent = q.nm || '';
        t.appendChild(document.createElement('br'));
        t.appendChild(w);
        var up = document.createElement('button');
        var mine = !!(q.v || {})[me];
        up.className = mine ? 'on' : '';
        up.textContent = '👍 ' + Object.keys(q.v || {}).length;
        up.onclick = function () { amaApply({ op: 'vote', id: q.id }, me, ''); send({ t: 'ama', op: 'vote', id: q.id }); };
        row.appendChild(n); row.appendChild(t); row.appendChild(up);
        // ОТМЕТИТЬ ОТВЕЧЕННЫМ МОЖЕТ ЛЮБОЙ (ведущего нет), СНЯТЬ ВОПРОС - ТОЛЬКО АВТОР:
        // чужой вопрос стирать нельзя, а «на него ответили» это факт всей комнаты.
        var dn = document.createElement('button');
        dn.textContent = q.done ? '↩️' : '✅';
        dn.onclick = function () { amaApply({ op: 'done', id: q.id }, me, ''); send({ t: 'ama', op: 'done', id: q.id }); };
        row.appendChild(dn);
        if (q.who === me) {
          var del = document.createElement('button');
          del.textContent = '✕';
          del.onclick = function () { amaApply({ op: 'del', id: q.id }, me, ''); send({ t: 'ama', op: 'del', id: q.id }); };
          row.appendChild(del);
        }
        box.appendChild(row);
      });
      $('amanote').textContent = ama.length
        ? 'Порядок задают голоса. ✅ - отвечено, ✕ - снять свой вопрос.'
        : 'Вопросов пока нет. Задай первый - остальные проголосуют, и порядок сложится сам.';
    }

    function amaApply(m, who, nm) {
      var op = m.op;
      if (op === 'add') {
        if (ama.length >= AMA_MAX) return;
        if (ama.some(function (q) { return q.id === m.id; })) return;   // дедуп по id
        ama.push({ id: String(m.id).slice(0, 24), who: who, nm: String(nm || '').slice(0, 40),
                   x: String(m.x || '').slice(0, 200), v: {}, done: 0, ts: Number(m.ts) || Date.now() });
      } else {
        var q = null;
        ama.forEach(function (r) { if (r.id === m.id) q = r; });
        if (!q) return;
        // ГОЛОС СЧИТАЕТСЯ ПО IDENTITY ОТПРАВИТЕЛЯ, А НЕ ПО ПОЛЮ СООБЩЕНИЯ. Поле пришло бы
        // от клиента, и один человек накрутил бы себе сколько угодно голосов, не открывая
        // ничего сложнее консоли (закон №32: гейт у действия).
        if (op === 'vote') { if (q.v[who]) delete q.v[who]; else q.v[who] = 1; }
        if (op === 'done') q.done = q.done ? 0 : 1;
        if (op === 'del' && q.who === who) ama = ama.filter(function (r) { return r.id !== q.id; });
      }
      amaPaint();
    }

    function pollPaint() {
      var card = $('poll');
      if (!poll) {
        $('pollq').textContent = '';
        $('pollmkt').textContent = '';
        $('pollbtns').innerHTML = '';
        $('polltal').innerHTML = '';
        $('pollnote').textContent = 'Голосования сейчас нет. Напиши вопрос - комната ответит '
          + 'да/нет. Ссылка на рынок Polymarket покажет рядом, что думает рынок.';
        $('pq').style.display = '';
        $('pgo').style.display = '';
        return;
      }
      $('pq').style.display = 'none';
      $('pgo').style.display = 'none';
      $('pollq').textContent = poll.q;
      $('pollmkt').textContent = poll.mkt || '';
      var me = room.localParticipant.identity;
      var mine = (poll.v || {})[me] || '';
      var opts = [['y', '👍 Да'], ['n', '👎 Нет'], ['a', '🤷 Воздержусь']];
      var bts = $('pollbtns');
      bts.innerHTML = '';
      opts.forEach(function (o) {
        var b = document.createElement('button');
        b.className = 'pre' + (mine === o[0] ? ' on' : '');
        b.textContent = o[1];
        b.onclick = function () { pollApply({ op: 'vote', v: o[0] }, me); send({ t: 'poll', op: 'vote', v: o[0] }); };
        bts.appendChild(b);
      });
      var vals = Object.keys(poll.v || {}).map(function (k) { return poll.v[k]; });
      var tot = vals.length || 1;
      var tal = $('polltal');
      tal.innerHTML = '';
      opts.forEach(function (o) {
        var n = vals.filter(function (v) { return v === o[0]; }).length;
        var line = document.createElement('div');
        line.className = 'me';
        line.textContent = o[1] + ' - ' + n + ' (' + Math.round(n * 100 / tot) + '%)';
        var bar = document.createElement('div');
        bar.className = 'bar' + (o[0] === 'n' ? ' n' : (o[0] === 'a' ? ' a' : ''));
        bar.style.width = Math.max(2, Math.round(n * 100 / tot)) + '%';
        tal.appendChild(line);
        tal.appendChild(bar);
      });
      var stop = document.createElement('button');
      stop.className = 'pre';
      stop.textContent = '⏹ Закрыть голосование';
      stop.onclick = function () { pollApply({ op: 'close' }, me); send({ t: 'poll', op: 'close' }); };
      tal.appendChild(stop);
      $('pollnote').textContent = 'Открыл: ' + (poll.by || '') + '. Голосовали: ' + vals.length
        + '. Свой голос можно поменять.';
    }

    function pollApply(m, who, nm) {
      if (m.op === 'open') {
        poll = { id: String(m.id).slice(0, 24), q: String(m.q || '').slice(0, 140),
                 mkt: String(m.mkt || '').slice(0, 200), by: String(nm || m.by || '').slice(0, 40), v: {} };
      } else if (!poll) {
        return;
      } else if (m.op === 'vote') {
        if (['y', 'n', 'a'].indexOf(m.v) < 0) return;
        poll.v[who] = m.v;
      } else if (m.op === 'close') {
        poll = null;
      } else if (m.op === 'mkt') {
        poll.mkt = String(m.mkt || '').slice(0, 200);
      }
      pollPaint();
    }

    $('amabtn').onclick = function () {
      var c = $('ama');
      var on = c.style.display === 'none';
      c.style.display = on ? '' : 'none';
      $('amabtn').classList.toggle('on', on);
      if (on) { amaPaint(); send({ t: 'ask' }); }
    };
    $('ago').onclick = function () {
      var v = $('aq').value.trim();
      if (!v) return;
      var me = room.localParticipant.identity;
      var m = { op: 'add', id: me.slice(0, 8) + '-' + Date.now().toString(36), x: v, ts: Date.now() };
      amaApply(m, me, myLabel());
      send({ t: 'ama', op: 'add', id: m.id, x: v, ts: m.ts, nm: myLabel() });
      $('aq').value = '';
    };
    $('pollbtn').onclick = function () {
      var c = $('poll');
      var on = c.style.display === 'none';
      c.style.display = on ? '' : 'none';
      $('pollbtn').classList.toggle('on', on);
      if (on) { pollPaint(); send({ t: 'ask' }); }
    };
    $('pgo').onclick = async function () {
      var v = $('pq').value.trim();
      if (!v) return;
      var me = room.localParticipant.identity;
      var id = me.slice(0, 8) + '-' + Date.now().toString(36);
      pollApply({ op: 'open', id: id, q: v }, me, myLabel());
      send({ t: 'poll', op: 'open', id: id, q: v, by: myLabel() });
      $('pq').value = '';
      // РЫНОК РЕЗОЛВИТ БОТ, А НЕ СТРАНИЦА. У нас нет ни ключа, ни права ходить в чужой
      // API прямо отсюда, а главное - разбор ссылки и цена обязаны быть ТЕ ЖЕ, что в
      // карточке рынка в личке: вторая копия правила разошлась бы с первой (закон №40).
      if (initData && /polymarket\.com|^[a-z0-9-]{6,}$/i.test(v)) {
        $('pollnote').textContent = 'Спрашиваю рынок у бота, это пара секунд…';
        var res = await ask({ kind: 'rtcpoll', room: ROOM, q: v });
        if (res && res.mkt) {
          pollApply({ op: 'mkt', mkt: res.mkt }, me);
          send({ t: 'poll', op: 'mkt', mkt: res.mkt });
        } else {
          pollPaint();
        }
      }
    };

    [1, 3, 5, 10, 15].forEach(function (mm) {
      var b = document.createElement('button');
      b.className = 'pre';
      b.textContent = mm + ' мин';
      b.onclick = function () {
        tmrMenu(false);
        tmrSet(mm * 60, 'Ты', true);
        send({ t: 'tmr', left: mm * 60, by: myLabel() });
      };
      $('tmrset').appendChild(b);
    });
    var tmrOff = document.createElement('button');
    tmrOff.className = 'pre';
    tmrOff.textContent = '⏹ Снять';
    tmrOff.onclick = function () {
      tmrMenu(false);
      tmrSet(0);
      send({ t: 'tmr', left: 0 });
    };
    $('tmrset').appendChild(tmrOff);
    $('tmr').onclick = function () { tmrMenu($('tmrset').style.display === 'none'); };

    // ═══════════════════════════════════════════════════════════════════════════════
    // ЖИВЫЕ СУБТИТРЫ
    // ═══════════════════════════════════════════════════════════════════════════════
    // КНОПКА ЖМЁТ БОТА, как и запись: ключ SpeechKit в статическую страницу класть нельзя,
    // а стриминговый API у него только gRPC - ни страница, ни Worker так не умеют.
    // ВЕБ-ГОСТЮ КНОПКИ НЕТ: ящик принимает только подпись Telegram, и немая кнопка хуже
    // отсутствующей. Ленту он при этом ВИДИТ - она едет каналом данных, который у него
    // есть, и лишать его текста было бы наказанием без причины.
    if (initData) {
      var subBtn = $('subbtn');
      subBtn.style.display = '';
      showRec();                   // подпись обязана отвечать состоянию комнаты, а не порядку строк
      subBtn.onclick = async function () {
        subBtn.disabled = true;
        say(subOn ? 'Прошу бота выключить субтитры…' : 'Прошу бота включить субтитры…');
        await ask({ kind: 'rtcsub', room: ROOM });
        subBtn.disabled = false;
      };
    } else {
      $('subwhy').textContent = 'Субтитры включает тот, кто вошёл из Telegram. Тебе они '
        + 'будут видны, как только их включат.';
    }

    //: СКОЛЬКО РЕПЛИК ДЕРЖИМ. Разговор идёт часами, и держать его целиком в DOM незачем -
    //: на телефоне это заметно.
    var SUB_KEEP = 60;
    var subCur = {};               // незакрытая реплика КАЖДОГО говорящего, по identity
    //: СТРОКА-ПОДСКАЗКА И СТРОКА-ИЗВЕСТИЕ ЖИВУТ В ОДНОМ МЕСТЕ, НО СТИРАЮТСЯ ПО-РАЗНОМУ.
    //: «Слушаю...» - заглушка до первой реплики, её первая же реплика и снимает. А
    //: «бюджет на исходе» присылает БОТ, и стереть его следующей фразой значит показать
    //: предупреждение о деньгах ровно на те секунды, пока никто не говорит.

    function subLine(who, nm, txt, final) {
      var box = $('subs');
      $('subbox').style.display = '';
      var row = subCur[who];
      if (!row || row.dataset.fin === '1') {
        row = document.createElement('div');
        row.className = 'sl part';
        row.innerHTML = '<span class="who"></span> <span class="tx"></span>';
        box.appendChild(row);
        subCur[who] = row;
      }
      // ИМЯ БЕРЁТСЯ ИЗ ПОЛЯ, А НЕ У ОТПРАВИТЕЛЯ. Отправитель тут ВСЕГДА бот, и подпись у
      // каждой реплики оказалась бы «📝 Субтитры» - тот же класс, что цвет штриха доски.
      row.querySelector('.who').textContent = nm || who;
      row.querySelector('.tx').textContent = txt;
      row.className = 'sl ' + (final ? 'fin' : 'part');
      if (final) row.dataset.fin = '1';
      while (box.children.length > SUB_KEEP) box.removeChild(box.firstChild);
      // ПРОКРУТКА ТОЛЬКО ЕСЛИ ЧЕЛОВЕК И ТАК ВНИЗУ: утащить его с середины разговора,
      // который он перечитывает, - это отнять у него ленту.
      if (box.scrollHeight - box.scrollTop - box.clientHeight < 60) {
        box.scrollTop = box.scrollHeight;
      }
      if (!subSticky) $('subnote').textContent = '';
    }

    // ═══ ЗАПИСЬ: КНОПКА ЖМЁТ БОТА, А НЕ LIVEKIT ═══
    // Ключом от Egress владеет БОТ - он же потом идёт за файлами и сшивает транскрипт.
    // Дай мы это право странице или Worker'у, ответ на вопрос «кто управляет записью»
    // стал бы двойным. Отсюда путь: сигнал в ящик -> бот забирает (1.2-3 с) -> кладёт
    // ответ -> мы его показываем. Задержку НАЗЫВАЕМ, а не прячем за крутилкой.
    // ВЕБ-ГОСТЮ КНОПКИ НЕТ ВОВСЕ: ящик принимает только подпись Telegram, и кнопка,
    // которая молча ничего не делает, хуже отсутствующей.
    // КНОПКА ЕСТЬ ТОЛЬКО ТАМ, ГДЕ ЕЙ ЕСТЬ ЧЕМ ОТВЕТИТЬ. Живой прогон Ren: Egress отдавал
    // 401, кнопка стояла на месте, и каждый тап давал непонятную ошибку. Обещание без
    // механизма хуже отсутствия функции. Но и молча исчезнуть она не имеет права -
    // исчезнувшая кнопка читается как «функции нет вовсе» (закон №36), поэтому причина
    // стоит СТРОКОЙ. Признак приезжает вместе с токеном, лишнего запроса нет.
    var canRec = CAPS ? CAPS.record : null;
    if (initData && canRec !== true) {
      var w = (CAPS && CAPS.why) || 'бот не сообщил, работает ли запись';
      $('recwhy').textContent = 'Записать созвон сейчас нельзя: ' + w
        + '. Кнопки поэтому нет - она бы обещала то, чего нет.';
    }
    if (initData && canRec === true) {
      var recBtn = $('rec');
      recBtn.style.display = '';
      showRec();          // кнопка появилась - подпись обязана отвечать состоянию комнаты
      recBtn.onclick = async function () {
        recBtn.disabled = true;
        say(recOn ? 'Останавливаю запись…' : 'Прошу бота начать запись…');
        await ask({ kind: 'rtcrec', room: ROOM });
        recBtn.disabled = false;
      };
    }

    // ОДНА ДВЕРЬ «ПОЛОЖИТЬ СИГНАЛ И ДОЖДАТЬСЯ ОТВЕТА» НА ВСЕ КНОПКИ КОМНАТЫ. Две копии
    // этого круга разошлись бы на первой правке - например, одна научилась бы объяснять
    // `bad_kind`, а вторая продолжала бы показывать человеку машинный код (закон №40).
    async function ask(body) {
      try {
        var r = await fetch(API + '/signal', {
          method: 'POST',
          headers: { 'X-Init-Data': initData, 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        var j = await r.json();
        if (!r.ok || !j || !j.id) {
          // ДВА РАЗНЫХ МИРА ПОД ОДНИМ КОДОМ 400. `bad_kind` означает, что Worker выложен
          // СТАРОЙ версией и про эту кнопку не знает вовсе, - это у нас, лечится деплоем,
          // и человеку незачем гадать. Тот же класс, что уже дважды стоил круга: страница
          // и Worker выкладываются разными командами.
          var why = (j && (j.why || j.error)) || 'без причины';
          say(why === 'bad_kind'
              ? 'Эта кнопка не подключена: Worker выложен старой версией и про неё не '
                + 'знает. Это у нас - worker_deploy.deploy().'
              : 'Бот не принял просьбу (' + r.status + '): ' + why, true);
          return false;
        }
        // ОТВЕТ БОТА ВОЗВРАЩАЕТСЯ НАВЕРХ ЦЕЛИКОМ: каталогу станций нужен не факт
        // «дошло», а сами данные. Раньше дверь отдавала true/false, и второй вызывающий
        // завёл бы себе свой круг опроса - две копии разошлись бы на первой правке.
        return await waitRec(j.id);
      } catch (e) {
        say('Не достучался до бота: ' + (e && e.message || e), true);
        return false;
      }
    }

    // ═══ ПОРТФЕЛЬ ДОКЛАДЧИКА: ТОЛЬКО ПО ЯВНОМУ ТАПУ ЕГО ВЛАДЕЛЬЦА ═══
    // СНИМОК СОБИРАЕТ БОТ (у него привязанные счета и ключ DeBank), А ПУБЛИКУЕТ СТРАНИЦА.
    // Так согласие встроено в устройство, а не обещано словами: бот физически не может
    // показать комнате чужой счёт - он отдаёт текст ТОМУ, КТО НАЖАЛ, и дальше решает он.
    // ВЕБ-ГОСТЮ КНОПОК НЕТ: ящик принимает только подпись Telegram, а счетов у него у нас
    // нет вовсе - кнопка, которой нечем ответить, хуже отсутствующей.
    if (initData) {
      $('portbtns').style.display = '';
      var portGo = async function (mode, btn) {
        btn.disabled = true;
        $('port').style.display = '';
        $('portnote').textContent = 'Собираю счёт, это пара секунд…';
        var res = await ask({ kind: 'rtcport', room: ROOM, mode: mode });
        btn.disabled = false;
        if (!res || !res.text) {
          // ОТКАЗ НАЗЫВАЕТ ПРИЧИНУ. «Не получилось» тут значит четыре разных вещи (нет
          // привязанного счёта, DeBank молчит, ты не в этой комнате, счёт пуст), и лечатся
          // они по-разному.
          $('portnote').textContent = (res && res.note) || 'Счёт не собрался. Причина не приехала.';
          return;
        }
        $('portnote').textContent = '';
        // ПОКАЗЫВАЕМ У СЕБЯ ТЕМ ЖЕ КОДОМ, ЧТО И У СОСЕДЕЙ: вторая ветка «а вот это моё»
        // разошлась бы с первой на первой же правке (закон №40).
        send({ t: 'port', x: res.text });
        onData(new TextEncoder().encode(JSON.stringify({ t: 'port', x: res.text })),
               room.localParticipant);
      };
      $('portsh').onclick = function () { portGo('share', $('portsh')); };
      $('portusd').onclick = function () { portGo('usd', $('portusd')); };
    }

    // ═══ РАДИО В КОМНАТУ: ТОТ ЖЕ ЯЩИК, ЧТО У ЗАПИСИ ═══
    // СТАНЦИЮ ИЩЕТ БОТ, А НЕ МЫ. Отсюда уезжает самое большее НАЗВАНИЕ; адрес потока
    // резолвится на нашей стороне тем же каталогом, что питает Медиаплеер. Пусти мы
    // адрес из аппки - белый список источников (что вообще можно публиковать в комнату)
    // обходился бы одной строкой в консоли.
    if (initData) {
      var djBtn = $('dj');
      djBtn.style.display = '';
      showRec();
      djBtn.onclick = async function () {
        if (djOn) {
          djBtn.disabled = true;
          say('Выключаю радио…');
          await ask({ kind: 'rtcdj', room: ROOM });
          djBtn.disabled = false;
          return;
        }
        // НЕ СПРАШИВАЕМ БУКВЫ ТАМ, ГДЕ ЕСТЬ СПИСОК. Ввод названия руками был работой,
        // переложенной на человека: у нас есть готовый каталог со странами, жанрами,
        // обложками и его же избранным.
        var panel = $('radio');
        if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
        panel.style.display = '';
        await openRadio('');
      };
      // ═══ ПОИСК: ЖДЁМ, ПОКА ЧЕЛОВЕК ДОПЕЧАТАЕТ ═══
      // Каждый запрос идёт ЧЕРЕЗ ЯЩИК (1.2-3 с), и посылать его на каждую букву значило бы
      // очередь из десяти просьб на слово «спокойное», из которых нужна последняя. Пауза
      // после последнего нажатия - и один запрос вместо десяти.
      var rqT = null;
      $('rq').oninput = function () {
        if (rqT) clearTimeout(rqT);
        var v = $('rq').value.trim();
        rqT = setTimeout(function () {
          // ПУСТАЯ СТРОКА - ЭТО НЕ ПОИСК ПУСТОТЫ, А ВОЗВРАТ К ФИЛЬТРАМ: человек стёр
          // запрос, и список обязан вернуться туда, откуда он ушёл.
          openRadio(v ? 'q:' + v : '');
        }, 600);
      };
    }

    // ═══ КАТАЛОГ СТАНЦИЙ: ФИЛЬТРЫ И СПИСОК ПРИЕЗЖАЮТ ОТ БОТА ═══
    // ПОДПИСИ ТОЖЕ ЕГО: он знает язык человека, а вторая таблица «страны и жанры» здесь
    // означала бы, что в комнате и в плеере со временем окажутся разные наборы.
    async function openRadio(key) {
      $('rnote').textContent = 'Спрашиваю каталог у бота, это пара секунд…';
      var res = await ask({ kind: 'rtcdj', room: ROOM, list: key || 'c:ru' });
      if (!res) { $('rnote').textContent = 'Каталог не приехал. Попробуй ещё раз.'; return; }
      var chips = $('rchips');
      chips.innerHTML = '';
      (res.chips || []).forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'chip' + (c.k === res.key ? ' on' : '');
        b.textContent = c.label;
        b.onclick = function () {
          // ТАП ПО ФИЛЬТРУ СТИРАЕТ ЗАПРОС. Иначе на экране одновременно «ищу Спокойное» и
          // подсвеченный чип «Джаз» - два разных ответа на вопрос «что я сейчас вижу».
          $('rq').value = '';
          openRadio(c.k);
        };
        chips.appendChild(b);
      });
      var list = $('rlist');
      list.innerHTML = '';
      (res.stations || []).forEach(function (st) {
        var b = document.createElement('button');
        b.className = 'wide station';
        // ОБЛОЖКА - УКРАШЕНИЕ, И ЕЁ ОТСУТСТВИЕ НЕ ИМЕЕТ ПРАВА ЛОМАТЬ СТРОКУ: битую
        // картинку прячем, а не оставляем пустой квадрат (тот же приём, что в плеере).
        if (st.fav) {
          var im = document.createElement('img');
          im.src = st.fav;
          im.onerror = function () { im.style.display = 'none'; };
          b.appendChild(im);
        }
        var sp = document.createElement('span');
        sp.textContent = st.name + (st.country ? ' · ' + st.country : '');
        b.appendChild(sp);
        b.onclick = async function () {
          $('rnote').textContent = 'Включаю ' + st.name + '…';
          // ЕДЕТ ИДЕНТИФИКАТОР, А НЕ АДРЕС: поток резолвит бот, и белый список
          // источников остаётся непроходимым.
          await ask({ kind: 'rtcdj', room: ROOM, st: st.id });
          $('radio').style.display = 'none';
        };
        list.appendChild(b);
      });
      // ПУСТО И «КАТАЛОГ МОЛЧИТ» - РАЗНЫЕ ВЕЩИ, И ОБЕ НАЗЫВАЮТСЯ СВОИМИ СЛОВАМИ.
      $('rnote').textContent = res.why
        || ((res.stations || []).length ? '' : 'Здесь пусто - выбери другой фильтр.');
    }

    // ОТВЕТ ЗАБИРАЕМ ИЗ ЯЩИКА, А НЕ СЧИТАЕМ РАБОТУ СДЕЛАННОЙ ПО ФАКТУ ОТПРАВКИ (закон
    // №35): «сигнал положен» и «бот записывает» - разные утверждения, и второе бывает
    // ложным (нет ключей, никто не включил микрофон, Egress не поднят).
    async function waitRec(id) {
      for (var i = 0; i < 20; i++) {
        await new Promise(function (ok) { setTimeout(ok, 1200); });
        var res = null;
        try {
          var rr = await fetch(API + '/result?id=' + encodeURIComponent(id),
                               { headers: { 'X-Init-Data': initData } });
          res = await rr.json();
        } catch (e) { continue; }
        if (!res || res.state !== 'done') continue;
        var note = (res.res && res.res.note) || '';
        if (note) say(note);
        return res.res || {};
      }
      // МОЛЧАНИЕ НАЗЫВАЕТСЯ МОЛЧАНИЕМ. Крутилка без конца читается как «сломалось», а
      // индикатор записи придёт сам, когда бот дойдёт: он живёт в метаданных комнаты.
      say('Бот пока не ответил. Если запись пойдёт, наверху появится красная строка.');
      return null;
    }

    function onData(payload, p) {
      var m = null;
      try { m = JSON.parse(new TextDecoder().decode(payload)); } catch (e) { return; }
      if (!m || !m.t) return;
      if (m.t === 'hand' && p) upsert(p.identity, { hand: m.up ? Date.now() : 0 });
      if (m.t === 'react' && p && floodOk(p.identity)) {
        // ЭМОДЗИ РЕЖЕМ ПО ДЛИНЕ: в поле приходит строка от клиента, и «реакцией» на
        // килобайт текста можно было бы закрыть соседу пол-экрана.
        popup(nameOf(p) + '  ' + String(m.e || '').slice(0, 8));
      }
      if (m.t === 'snd' && p && floodOk(p.identity)) {
        var _s = SOUNDS[m.s];
        if (_s) {
          playSnd(m.s);
          popup(nameOf(p) + '  ' + _s.e + ' ' + _s.t);
        } else {
          // ЗВУК, КОТОРОГО МЫ НЕ ЗНАЕМ, - ЭТО СТАРАЯ СТРАНИЦА У НАС, А НЕ ошибка соседа.
          // Молча проглотить нельзя: у него играет, у нас тихо, и он решит, что сломался
          // микрофон, - то есть пойдёт чинить исправное.
          popup(nameOf(p) + '  🔊 звук из новой версии - обнови страницу');
        }
      }
      if ((m.t === 'd' || m.t === 'dx' || m.t === 'dc') && p) {
        cvApply(m, p.identity, nameOf(p));
      }
      if (m.t === 'dh' && p) {
        // ИСТОРИЯ ПРИМЕНЯЕТСЯ ТЕМ ЖЕ КОДОМ, ЧТО И ЖИВОЙ ШТРИХ. Отдельная ветка «а вот
        // это из истории» была бы вторым ответом на вопрос «как лечь штриху» и разошлась
        // бы с первым (закон №40); имя не передаём - подпись у чужого курсора относится
        // к тому, кто чертит СЕЙЧАС.
        (m.s || []).slice(0, 60).forEach(function (st) {
          cvApply({ t: 'd', id: st.id, k: st.k, x: st.x, p: st.p }, p.identity, '');
        });
      }
      if (m.t === 'sub') {
        // РЕПЛИКУ ПРИСЫЛАЕТ БОТ, А ГОВОРИТ ЧЕЛОВЕК: `who`/`nm` из ПОЛЕЙ сообщения.
        subLine(String(m.who || '').slice(0, 64), String(m.nm || '').slice(0, 60),
                String(m.x || '').slice(0, 400), !!m.f);
      }
      if (m.t === 'subnote') {
        // ИЗВЕСТИЕ О СУБТИТРАХ ОТ БОТА (бюджет на исходе, субтитры выключились). Молча
        // выключившиеся субтитры человек читает как поломку, поэтому причина СТОИТ НА
        // ЭКРАНЕ и переживает следующую реплику.
        subNote(String(m.x || '').slice(0, 200), true);
      }
      if (m.t === 'ama' && p) amaApply(m, p.identity, nameOf(p));
      if (m.t === 'poll' && p) pollApply(m, p.identity, nameOf(p));
      if (m.t === 'amast' && p) {
        // СНИМОК ОЧЕРЕДИ ДЛЯ ВОШЕДШЕГО ПОЗЖЕ. Голоса приезжают КАРТОЙ, а не числом:
        // число нельзя ни проверить, ни изменить своим тапом - «👍 7» превратилось бы в
        // «👍 8» у одного и осталось «7» у всех остальных.
        if (!ama.length) {
          ama = (m.s || []).slice(0, AMA_MAX).map(function (q) {
            return { id: String(q.id || '').slice(0, 24), who: String(q.who || '').slice(0, 64),
                     nm: String(q.nm || '').slice(0, 40), x: String(q.x || '').slice(0, 200),
                     v: (q.v && typeof q.v === 'object') ? q.v : {}, done: q.done ? 1 : 0,
                     ts: Number(q.ts) || 0 };
          });
          amaPaint();
        }
      }
      if (m.t === 'pollst' && p && !poll && m.s) {
        poll = { id: String(m.s.id || '').slice(0, 24), q: String(m.s.q || '').slice(0, 140),
                 mkt: String(m.s.mkt || '').slice(0, 200), by: String(m.s.by || '').slice(0, 40),
                 v: (m.s.v && typeof m.s.v === 'object') ? m.s.v : {} };
        pollPaint();
      }
      if (m.t === 'port' && p) {
        // ПОРТФЕЛЬ ПОКАЗЫВАЕТСЯ ТОЛЬКО ТЕМ, КТО СЕЙЧАС В КОМНАТЕ, И НЕ ДОГОНЯЕТ ВОШЕДШИХ
        // ПОЗЖЕ - НАРОЧНО. Это чужие деньги: человек показал их тем, с кем говорил, а не
        // всем, кто заглянет за следующий час. Поэтому в ответе на `ask` его нет.
        $('port').style.display = '';
        var pb = $('portbox');
        pb.innerHTML = '';
        var h = document.createElement('div');
        h.className = 'nm';
        h.textContent = '💼 ' + nameOf(p);
        pb.appendChild(h);
        var body = document.createElement('div');
        body.className = 'me';
        body.textContent = String(m.x || '').slice(0, 900);
        pb.appendChild(body);
        $('portnote').textContent = 'Показал сам, по своему тапу. Вошедшим позже это не '
          + 'достанется - карточка живёт только у тех, кто сейчас в комнате.';
      }
      if (m.t === 'chart' && p) {
        chartSet(m.sym, m.tf, nameOf(p), false);
      }
      // «ЧТО У ВАС ТАМ?» - ОТВЕЧАЕТ ТОЛЬКО ТОТ, У КОГО СОСТОЯНИЕ ЕСТЬ. Ответ идёт всем
      // (адресной посылки у канала нет), и это не беда: у остальных он просто совпадёт с
      // тем, что уже нарисовано.
      if (m.t === 'ask') {
        if (chSym) send({ t: 'chart', sym: chSym, tf: chTf, by: myLabel() });
        if (tmrEnd > Date.now()) {
          send({ t: 'tmr', left: Math.round((tmrEnd - Date.now()) / 1000), by: myLabel() });
        }
        if (strokes.length) cvSendHistory();
        if (ama.length) send({ t: 'amast', s: ama.slice(0, AMA_MAX) });
        if (poll) send({ t: 'pollst', s: poll });
      }
      if (m.t === 'tmr') {
        // ЧУЖОЙ ТАЙМЕР ЗАМЕНЯЕТ НАШ, А НЕ ВСТАЁТ ВТОРЫМ: таймер тут один на комнату, и
        // два разом означали бы, что «время вышло» не сообщает ничего.
        tmrSet(Number(m.left) || 0, (p ? nameOf(p) : (m.by || '')), false);
      }
      if (m.t === 'hush') {
        micOn = false;
        try { room.localParticipant.setMicrophoneEnabled(false); } catch (e) {}
        $('mic').textContent = '🎙 Включить микрофон';
        $('mic').classList.add('off');
        say('Ведущий попросил тишины - твой микрофон выключен.');
      }
    }
    // ДВЕРЬ ОДНА, И ПОЭТОМУ У НЕЁ ЕСТЬ ИМЯ. Свой же портфель мы показываем ТЕМ ЖЕ
    // разбором, что и чужой: вторая ветка «а вот это моё» разошлась бы с первой на первой
    // же правке, и человек видел бы у себя не то, что видят соседи (закон №40).
    room.on(LK.RoomEvent.DataReceived, onData);

    // ВОШЁЛ - СПРОСИЛ, ЧТО В КОМНАТЕ УЖЕ ЕСТЬ. Сердцебиение догнало бы и само, но до
    // пяти секунд перед пустым графиком человек читает как «не работает», а доску
    // сердцебиение не догоняет вовсе - она слишком большая, чтобы слать её по кругу.
    setTimeout(function () { try { send({ t: 'ask' }); } catch (e) {} }, 900);
    upsert(room.localParticipant.identity, { name: 'Ты', me: true });
    room.remoteParticipants.forEach(function (p) {
      upsert(p.identity, { name: human(p.name, p.identity) });
    });
    draw();          // строку «В комнате: N» рисует draw(), чтобы счёт был один на всех
    say('');
  }

  $('mic').onclick = async function () {
    if (!room) return;
    micOn = !micOn;
    try { await room.localParticipant.setMicrophoneEnabled(micOn); } catch (e) {}
    $('mic').textContent = micOn ? '🎙 Выключить микрофон' : '🔇 Включить микрофон';
    $('mic').className = micOn ? '' : 'off';
    upsert(room.localParticipant.identity, { muted: !micOn });
  };
  $('out').onclick = async function () {
    try { if (room) await room.disconnect(); } catch (e) {}
    // ЗАКРЫВАЕМ АППКУ САМИ: человек, нажавший «Выйти», ждёт возврата в чат, а не пустого
    // экрана с надписью «отключился».
    try { if (tg && tg.close) tg.close(); } catch (e) {}
  };

  // ═══ ОБНОВЛЕНИЯ: СПРАШИВАЕМ WORKER'А, А НЕ ФАЙЛ РЯДОМ СО СТРАНИЦЕЙ ═══
  // ЗАЧЕМ ПЕРЕДЕЛАНО. Прежняя редакция читала `version.txt`, лежащий В ТОМ ЖЕ каталоге,
  // что и страница. Он попадает в ТОТ ЖЕ кэш вебвью и отвечает так же устарело - то есть
  // старая страница спрашивала у старого файла, свежа ли она, и получала «да».
  // Мы трое выгружали Telegram руками после каждой выкладки; человек, который не
  // закрывает приложение неделями, живёт со страницей двухнедельной давности и жалуется
  // на баги, которые мы давно починили. Worker - живой API на ДРУГОМ хосте, его ответ
  // вебвью не кэширует, и знает он ровно то, что мы ему сказали при деплое.
  //
  // ПРОВЕРКА ПРИ КАЖДОМ ОТКРЫТИИ, А НЕ РАЗ В СУТКИ: комнату открывают редко, и «раз в
  // сутки» на таком ритме означает «почти никогда».
  //
  // ТРИ ИСХОДА, И ОНИ РАЗНЫЕ ПО ДЕЙСТВИЮ:
  //   свежая        - работаем молча;
  //   есть новее    - ГОВОРИМ об этом и перезагружаемся с пробитием кэша. Молча моргнуть
  //                   страницей нельзя: человек не поймёт, что произошло;
  //   несовместимая - НЕ РАБОТАЕМ ВОВСЕ и говорим, что делать. Попытка «всё равно
  //                   попробовать» даёт отказы, выглядящие как поломка комнаты, - а это
  //                   ровно та подмена причины, из-за которой мы уже теряли круги.
  var RELOAD_KEY = 'hara_room_reloaded';

  function verdictVersion(j) {
    // ЧИСТАЯ ФУНКЦИЯ РЕШЕНИЯ: её и проверяет браузерная проба. Логика, размазанная по
    // колбэкам, проверяется только глазами, а глазами мы этот файл уже трижды читали
    // неверно.
    if (!j || j.error) return { act: 'skip' };          // Worker не знает - не мешаем
    var mine = Number(PAGE_CONTRACT), min = Number(j.min_page || 0);
    if (min && mine < min) return { act: 'dead' };
    var ver = String(j.ver || '').trim();
    if (!ver || VERSION.indexOf('{{') === 0 || ver === VERSION) return { act: 'ok' };
    var once = null;
    try { once = sessionStorage.getItem(RELOAD_KEY); } catch (e) {}
    // УЖЕ ПЕРЕЗАГРУЖАЛИСЬ РАДИ ЭТОЙ ВЕРСИИ И ВСЁ РАВНО СТАРЫЕ - значит сами себя обновить
    // НЕ МОЖЕМ (вебвью отдаёт свою копию). Второй круг перезагрузок ничего не изменит, а
    // человек будет смотреть на мигающий экран.
    if (once === ver) return { act: 'stuck', ver: ver };
    return { act: 'reload', ver: ver };
  }

  async function checkVersion() {
    var j = null;
    try {
      var r = await fetch(API + '/appver?app=room&t=' + encodeURIComponent(VERSION),
                          { cache: 'no-store' });
      j = await r.json();
    } catch (e) { j = null; }
    var v = verdictVersion(j);
    if (v.act === 'ok' || v.act === 'skip') return true;
    if (v.act === 'dead') {
      sub('Версия устарела');
      say('Эта страница старее, чем нужно серверу, и обновление её не вылечит. '
          + 'Закрой окно и открой комнату заново из бота - кнопка там всегда свежая.', true);
      return false;
    }
    if (v.act === 'stuck') {
      sub('Не могу обновиться сам');
      say('Есть свежая версия, но Telegram отдаёт мне свою старую копию. Закрой окно и '
          + 'открой комнату заново из бота; если не поможет - выгрузи Telegram из памяти.',
          true);
      return false;
    }
    // ГОВОРИМ ДО ТОГО, КАК МОРГНЁМ. Перезагрузка без объяснения читается как сбой.
    sub('Есть обновление');
    say('Обновляю страницу до свежей версии…');
    try { sessionStorage.setItem(RELOAD_KEY, v.ver); } catch (e) {}
    var _q = null;
    try { _q = new URLSearchParams(location.search); } catch (e) { _q = null; }
    if (_q) { _q.set('v', v.ver); }
    setTimeout(function () {
      location.replace(location.pathname + '?'
        + (_q ? _q.toString() : 'v=' + encodeURIComponent(v.ver)) + location.hash);
    }, 700);
    return false;
  }

  (async function () {
    // ПРОВЕРКА ВЕРСИИ ИДЁТ ДО ПОДКЛЮЧЕНИЯ, А НЕ ПАРАЛЛЕЛЬНО С НИМ: несовместимая страница
    // не должна успеть попросить токен - отказ приедет человеку раньше объяснения.
    if (await checkVersion()) await go();
  })();
})();
</script>
