        var sup = (navigator.mediaDevices && navigator.mediaDevices.getSupportedConstraints)
          ? navigator.mediaDevices.getSupportedConstraints() : null;
        // НЕ СПРОСИТЬ - НЕ ЗНАЧИТ «НЕ УМЕЕТ». Отсутствие самого метода это отдельный
        // случай, и объявлять по нему браузер неумелым было бы выдумкой.
        return sup ? !!sup[k] : null;
      } catch (e) { return null; }
    }

    function flagLine(o) {
      var f = function (k) {
        if (k in o) return o[k] ? 'вкл' : 'ВЫКЛ';
        // ОТСУТСТВИЕ ПОЛЯ РАЗБИРАЕТСЯ ДО КОНЦА, а не сваливается в «не сообщает»: браузер,
        // который такого флага не знает, и браузер, который знает и молчит, - разные миры.
        var c = canDo(k);
        return c === false ? 'НЕ УМЕЕТ' : 'не сообщает';
      };
      // ═══ ГЛАВНОЕ - КТО ДАВИТ ШУМ ПРЯМО СЕЙЧАС, А НЕ ПЕРЕЧЕНЬ ФЛАГОВ ═══
      // ЖИВОЙ ПРОГОН REN 26.08 (вторая половина): строка раздулась и повторяла одно и то же
      // трижды - «встроенный шумодав НЕ УМЕЕТ», потом «браузер НЕ УМЕЕТ: noiseSuppression»,
      // потом «встроенного подавления тут нет». Три формулировки одного факта не добавляют
      // ничего, кроме длины, и в них теряется ответ на единственный вопрос: слышно ли меня
      // нормально. Отсюда правило: СУТЬ ОДНОЙ СТРОКОЙ, подробности - только когда что-то
      // не работает.
      // ИМЯ ТОГО, КТО РАБОТАЕТ, А НЕ СПИСОК ТОГО, ЧЕГО НЕТ: «шумодав: RNNoise» отвечает
      // сразу и на «есть ли он», и на «чей он».
      var _ns = RNN_ON ? 'RNNoise' : f('noiseSuppression');
      return 'шумодав: ' + _ns + ' · эхо ' + f('echoCancellation')
        + ' · ' + (o.sampleRate ? Math.round(o.sampleRate / 1000) + ' кГц' : '? кГц');
    }

    // ═══ НАШ ШУМОДАВ - СВОЯ СТРОКА, И ОНА ПЕРЕРИСОВЫВАЕТСЯ ПО ТАПУ ═══
    // Состояние браузера меряется один раз при захвате, а наш RNNoise человек включает и
    // выключает - значит строка обязана следовать за ним, иначе она отвечает на вчерашний
    // вопрос. Текст храним отдельно от браузерной части: смешав их в одну строку, мы
    // получили бы то же самое, только длиннее.
    // ХРАНИМ ИСХОДНЫЕ НАСТРОЙКИ, А НЕ ГОТОВУЮ СТРОКУ. Строка зависит от `RNN_ON` (кто
    // именно давит шум), а он меняется по кнопке - сохранённый текст отвечал бы на
    // вчерашний вопрос, и мы получили бы ровно ту поломку, которую чиним.
    var AUDIO_GOT = null;
    var AUDIO_TXT = '';

    // ВТОРАЯ СТРОКА - ТОЛЬКО КОГДА ЕСТЬ ЧТО СКАЗАТЬ. Совет уйти в обычный браузер нужен,
    // ПОКА наш шумодав выключен; после включения он предлагает лечить то, что уже вылечено
    // (замечание Ren). Подробности про флаги - тоже только при поломке.
    var AUDIO_HINT = '';
    //: ПЕРЕГРУЗ ЖИВЁТ ОТДЕЛЬНОЙ СТРОКОЙ И НЕ ГАСНЕТ ВМЕСТЕ С ШУМОДАВОМ. Остальные
    //: подробности при живом RNNoise прячутся (они про встроенное подавление, которое мы
    //: сами и выключили), а хрип - про ЗАХВАТ: он остаётся при любом шумодаве, и молчать
    //: о нём именно тогда, когда человек включил обработку, значит соврать умолчанием.
    var AUDIO_CLIP = '';

    function paintAudio() {
      var box = $('audiodbg');
      if (!box) return;
      if (AUDIO_GOT) AUDIO_TXT = flagLine(AUDIO_GOT);
      var rest = [];
      if (!RNN_ON && AUDIO_HINT) rest.push(AUDIO_HINT);
      if (AUDIO_CLIP) rest.push(AUDIO_CLIP);
      box.textContent = AUDIO_TXT + (rest.length ? '\n' + rest.join(' · ') : '');
    }

    //: СКОЛЬКО РАЗ ЖДЁМ МИКРОФОН. Публикация идёт своим темпом (разрешение, устройство,
    //: сеть), и на 800 мс её может ещё не быть. Раньше это стоило одной строки в
    //: диагностике, теперь - ВСЕЙ машинки: авто-включение и наблюдатель фона живут за
    //: этим же входом, и молчаливый ранний возврат означал бы, что шумодав не заводится
    //: НИКОГДА, а в интерфейсе про это ни слова.
    var AUDIO_TRIES = 12;

    async function audioFacts() {
      var box = $('audiodbg');
      try {
        var ms = micTrack();
        if (!ms) {
          box.textContent = 'микрофон ещё не опубликован';
          if (AUDIO_TRIES-- > 0) { setTimeout(audioFacts, 700); return; }
          // ЖДАЛИ ДЕСЯТЬ СЕКУНД И НЕ ДОЖДАЛИСЬ - ЭТО УЖЕ НЕ «ПОДОЖДИ», А ФАКТ.
          box.textContent = 'микрофон так и не опубликовался - шумодава и замера фона не '
            + 'будет. Проверь разрешение на микрофон.';
          return;
        }

        // ═══ ЧТО МЫ ПОПРОСИЛИ У БРАУЗЕРА НА САМОМ ДЕЛЕ ═══
        // getConstraints() отдаёт то, с чем дорожка реально захвачена, AUDIO_WANT - то,
        // что мы просили. Расходятся ПРИ ПОДДЕРЖИВАЕМОМ флаге - значит между нами и
        // браузером кто-то вмешался, и это НАШ баг. Расходятся при неподдерживаемом -
        // это свойство браузера, и кричать тут не о чем.
        var asked = {};
        try { asked = (ms.getConstraints && ms.getConstraints()) || {}; } catch (e) {}
        var lost = [], cant = [];
        // СВЕРЯЕМСЯ С ТЕМ, ЧЕГО ХОТИМ СЕЙЧАС, А НЕ С ЗАХВАТНЫМ УМОЛЧАНИЕМ. При живом
        // RNNoise мы САМИ просим `noiseSuppression=false` (один подавитель за раз), и
        // сверка с `AUDIO_WANT` кричала бы «НАШ БАГ» на собственном верном решении.
        var _want = audioWant();
        AUDIO_MUST.forEach(function (k) {
          var sup = canDo(k);
          if (sup === false) { cant.push(k); return; }
          if (!(k in asked)) { if (sup) lost.push(k + ': не дошло'); return; }
          var v = (asked[k] && typeof asked[k] === 'object') ? asked[k].ideal : asked[k];
          if (v !== _want[k]) lost.push(k + ': просили ' + _want[k] + ', ушло ' + v);
        });

        var got = (ms.getSettings && ms.getSettings()) || {};
        // ═══ ПРИМЕНИЛОСЬ НЕ ТО - ЧИНИМ, А НЕ КОНСТАТИРУЕМ ═══
        // Живой случай (Ren): ровный гул, с которым встроенное подавление обязано

          // Созданный до жеста человека он стоит `suspended`, а suspended-контекст НЕ
          // ОБРАБАТЫВАЕТ ЗВУК ВООБЩЕ - то есть в комнату уехала бы тишина при полностью
          // исправной цепочке. Это хуже любого шума: шум мешает, тишину человек читает
          // как «меня не слышно».
          // ЖИВОЙ ОТКАЗ, ПОЙМАННЫЙ БРАУЗЕРНОЙ ПРОБОЙ: с автоматическим включением при
          // входе жеста НЕТ ВОВСЕ, и `resume()` не разрешается НИКОГДА - обещание висит,
          // кнопка остаётся заблокированной, и выглядит это как намертво сломанный
          // шумодав. Пока включение было только по тапу, беды не было видно: тап и есть
          // жест. Поэтому ждём ОГРАНИЧЕННО и проверяем ФАКТ (`state`), а не то, что вызов
          // вернулся: `resume()` вправе разрешиться, оставив контекст спящим.
          if (ctx.state === 'suspended') {
            try {
              await Promise.race([ctx.resume(),
                                  new Promise(function (r) { setTimeout(r, 1200); })]);
            } catch (e) {}
          }
          if (ctx.state !== 'running') {
            throw new Error('браузер не запускает обработку звука без твоего действия - '
                            + 'нажми «Подавить шум» руками');
          }
          var url = URL.createObjectURL(new Blob([RNN_WORKLET], { type: 'text/javascript' }));
          try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
          node = new AudioWorkletNode(ctx, 'rnn-denoise', {
            numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1],
            processorOptions: { wasm: bytes },
          });
          var _self = this;
          node.port.onmessage = function (ev) {
            if (ev.data && ev.data.error) say('Шумодав не собрался: ' + ev.data.error
                                              + ' - звук идёт как был.', true);
            if (ev.data && typeof ev.data.load === 'number' && _self.onLoad) {
              _self.onLoad(ev.data.load);
            }
          };
          this.srcTrack = opts.track;
          srcNode = ctx.createMediaStreamSource(new MediaStream([opts.track]));
          dstNode = ctx.createMediaStreamDestination();
          srcNode.connect(node); node.connect(dstNode);
          // ═══ ДВА АНАЛИЗАТОРА - ЭТО «ДО» И «ПОСЛЕ» В ОДНУ И ТУ ЖЕ СЕКУНДУ ═══
          // Замер «до включения, потом после» пришлось бы разносить во времени, а фон за
          // эти секунды меняется сам (он у нас нестационарный - с этого и начался разбор).
          // Здесь оба берутся из ОДНОГО сигнала одновременно, и разница означает ровно
          // работу шумодава, а не смену обстановки.
          // ЗАМЕР - ДИАГНОСТИКА, А НЕ ПРОДУКТ: не собрались анализаторы - теряем ОТЧЁТ,
          // а не подавление. Уронить здесь весь шумодав ради строки «-14 дБ» значило бы
          // выключить работающую фичу из-за неработающего прибора.
          try {
            this.anIn = ctx.createAnalyser();
            this.anIn.fftSize = 1024; this.anIn.smoothingTimeConstant = 0;
            this.anOut = ctx.createAnalyser();
            this.anOut.fftSize = 1024; this.anOut.smoothingTimeConstant = 0;
            srcNode.connect(this.anIn); node.connect(this.anOut);
          } catch (e) {
            this.anIn = this.anOut = null;
            console.warn('[rnn] замер эффекта недоступен:', e);
          }
          this.processedTrack = dstNode.stream.getAudioTracks()[0];
        },
        async restart(opts) { await this.destroy(); await this.init(opts); },
        async destroy() {
          this.onLoad = null;
          this.srcTrack = null;
          this.anIn = this.anOut = null;
          try { srcNode && srcNode.disconnect(); } catch (e) {}
          try { node && node.disconnect(); } catch (e) {}
          // СВОЙ КОНТЕКСТ ЗАКРЫВАЕМ, ЧУЖОЙ - НИКОГДА: контекст LiveKit держит весь звук
          // комнаты, и закрыв его, мы оглушили бы человека целиком.
          if (ownCtx) { try { ownCtx.close(); } catch (e) {} }
          node = srcNode = dstNode = ownCtx = ctx = null;
        },
      };
    }

    //: ЖИВОЙ ПРОЦЕССОР. Нужен ради ДВУХ вещей, которых больше взять негде: исходной
    //: дорожки захвата (на ней и только на ней имеет смысл applyConstraints) и двух
    //: анализаторов, дающих «фон до» и «фон после» в одну и ту же секунду.
    var RNN_PROC = null;
    var rnnBusy = false;

    function micPub() {
      var out = null;
      room.localParticipant.trackPublications.forEach(function (p) {
        if (String(p.source || '') === 'microphone' && p.track) out = p;
      });
      return out;
    }

    // ═══ ЧТО МЫ ХОТИМ ОТ БРАУЗЕРА ПРЯМО СЕЙЧАС ═══
    // ОДИН ПОДАВИТЕЛЬ ЗА РАЗ. Встроенный и наш решают одну задачу, и включённые вместе
    // они не складываются, а мешают: первый съедает то, на чём обучен второй, и голос
    // глохнет раньше шума. Поэтому при живом RNNoise просим `noiseSuppression=false`, а
    // при выключенном возвращаем `true` - обе стороны, а не одна (закон №55).
    // ЭХО - ВСЕГДА И БЕЗУСЛОВНО: без него комната с двух телефонов рядом даёт вой, и это
    // не зависит ни от какого шумодава.
    function audioWant() {
      var w = {};
      Object.keys(AUDIO_WANT).forEach(function (k) { w[k] = AUDIO_WANT[k]; });
      w.echoCancellation = true;
      w.noiseSuppression = !RNN_ON;
      return w;
    }

    // ═══ ОДНА ДВЕРЬ НА ЛЮБУЮ ПРАВКУ НАСТРОЕК ЖИВОЙ ДОРОЖКИ ═══
    // ПУБЛИКАЦИЯ НЕ ПЕРЕСОЗДАЁТСЯ НИ ПРИ КАКОМ ИЗМЕНЕНИИ ФЛАГОВ. Путь
    // unpublish -> publish это ровно класс Б1: `Promise.race` отменяет ОЖИДАНИЕ, а
    // операция внутри SDK продолжается, источник числится «публикуется», и следующий тап
    // падает «waiting for pending publication promise timed out». Мы это чинили, и второй
    // дороги, по которой оно вернётся, здесь нет.
    // ПРОСЬБА - НЕ ФАКТ (закон №35): после applyConstraints ПЕРЕЧИТЫВАЕМ настройки. У
    // браузера три поведения, и они разные для человека: применил / отказал ошибкой /
    // СОГЛАСИЛСЯ И НИЧЕГО НЕ СДЕЛАЛ. Последнее самое коварное - вызов проходит, а звук
    // прежний, и без перечитывания мы отрапортовали бы успех.
    async function applyAudio(want) {
      // ИСТОЧНИК, А НЕ ОБРАБОТАННАЯ ДОРОЖКА: у дорожки из MediaStreamAudioDestinationNode
      // нет ни эха, ни АРУ, и просьба ушла бы в никуда - молча.
      var t = (RNN_PROC && RNN_PROC.srcTrack) || micTrack();
      if (!t || !t.applyConstraints) return { ok: false, why: 'дорожки захвата нет', got: {} };
      var ask = {};
      Object.keys(want).forEach(function (k) {
        // НЕИЗВЕСТНЫЙ БРАУЗЕРУ ФЛАГ НЕ ПРОСИМ ВОВСЕ: часть браузеров на такой набор
        // отвечает OverconstrainedError и не применяет НИЧЕГО - то есть один лишний ключ
        // отменял бы и остальные.
        if (canDo(k) !== false) ask[k] = want[k];
      });
      // ═══ ТРИ ИСХОДА, И СХЛОПНУТЬ ИХ В ДВА НЕЛЬЗЯ ═══
      // «Отказал ошибкой» и «согласился и ничего не сделал» - разные миры для человека:
      // в первом браузер что-то не умеет и говорит об этом, во втором вызов проходит, а
      // звук прежний. Схлопнув их, мы отправили бы разбор не туда - и ровно это поймала
      // браузерная проба, когда первая редакция этой двери вернула одно слово на оба.
      try {
        await t.applyConstraints(ask);
      } catch (e) {
        return { kind: 'threw', ok: false, why: (e && e.name) || String(e),
                 got: (t.getSettings && t.getSettings()) || {} };
      }
      var got = (t.getSettings && t.getSettings()) || {};
      var bad = Object.keys(ask).filter(function (k) {
        return (k in got) && got[k] !== ask[k];
      });
      return { kind: bad.length ? 'silent' : 'ok', ok: !bad.length,
               why: bad.length ? bad.join(', ') : '', got: got };
    }

    // ═════════════ ЗАМЕР ФОНА: ОДНА МАШИНКА НА ДЕТЕКТОР И НА ОТЧЁТ ═════════════
    // Обе задачи спрашивают одно и то же - какой у человека фон В ПАУЗАХ речи. Две копии
    // этого счёта разошлись бы порогом «что считать паузой», и тогда предложение на
    // мобиле опиралось бы на один фон, а отчёт «-14 дБ» на другой (закон №40).
    function newStat() { return { all: [], db: [], low: [] }; }

    function frameDb(an, tbuf) {
      an.getFloatTimeDomainData(tbuf);
      var s = 0;
      for (var i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i];
      var rms = Math.sqrt(s / tbuf.length);
      return rms > 1e-8 ? 20 * Math.log10(rms) : -120;
    }

    // ДОЛЯ ЭНЕРГИИ В 100-1000 Гц - ЭТО НЕ УКРАШЕНИЕ ОТЧЁТА, А ПРИЗНАК «МЕШАЕТ РЕЧИ».
    // Шум, лежащий выше 4 кГц, человек слышит как шипение и разбирать речь оно почти не
    // мешает; шум В ПОЛОСЕ РЕЧИ (живой сэмпл: 74%) съедает именно разборчивость.
    function lowShare(an, fbuf) {
      an.getFloatFrequencyData(fbuf);
      var hz = (an.context.sampleRate / 2) / fbuf.length;
      var lo = 0, all = 0;
      for (var i = 1; i < fbuf.length; i++) {
        var f = i * hz;
        if (f > 8000) break;
        if (fbuf[i] <= -180) continue;              // пустой бин
        var pw = Math.pow(10, fbuf[i] / 10);
        all += pw;
        if (f >= NS.LOW_HZ[0] && f <= NS.LOW_HZ[1]) lo += pw;
      }
      return all > 0 ? lo / all : 0;
    }

    // ПОРОГ ПАУЗЫ ПЛАВАЮЩИЙ И СЧИТАЕТСЯ ОТ СОБСТВЕННОГО МАКСИМУМА ЗА ОКНО. Абсолютное
    // число означало бы «у половины людей не работает»: усиление микрофона у всех своё, и
    // -45 dBFS у одного это фон, у другого - крик. Окно короткое (последние ~200 кадров,
    // то есть 10 секунд), иначе один хлопок дверью навсегда поднял бы планку и вся речь
    // после него считалась бы паузой.
    function feed(st, an, tbuf, fbuf) {
      var d = frameDb(an, tbuf);
      st.all.push(d);
      if (st.all.length > 200) st.all.shift();
      var mx = -120;
      for (var i = 0; i < st.all.length; i++) if (st.all[i] > mx) mx = st.all[i];
      if (d > mx - NS.SPEECH_GAP_DB) return;        // это речь, а не пауза
      st.db.push(d);
      st.low.push(lowShare(an, fbuf));
      if (st.db.length > 600) { st.db.shift(); st.low.shift(); }
    }

    function verdict(st) {
      if (st.db.length < NS.MIN_PAUSES) return null;
      var s = st.db.slice().sort(function (a, b) { return a - b; });
      var q = function (x) { return s[Math.min(s.length - 1, Math.floor(x * (s.length - 1)))]; };
      var sum = 0;
      for (var i = 0; i < st.low.length; i++) sum += st.low[i];
      // РАЗБРОС - ЭТО p90-p10, А НЕ max-min: одиночный щелчок не должен объявлять ровный
      // гул нестационарным, иначе предложение вылезало бы у всех подряд.
      return { db: q(0.5), spread: q(0.9) - q(0.1), low: sum / st.low.length,
               n: st.db.length };
    }

    // ═══ НАБЛЮДАТЕЛЬ ФОНА. ЖИВЁТ, ПОКА ШУМОДАВ ВЫКЛЮЧЕН, И ТОЛЬКО ТОГДА ═══
    // Включён - предлагать нечего, а лишний анализатор на телефоне это лишняя работа.
    // СВОЙ КОНТЕКСТ, И ЕМУ НЕ НУЖНЫ 48 кГц: 48 - условие работы МОДЕЛИ (она обучена на
    // кадрах 480 сэмплов), а уровень и доля полосы считаются на любой частоте, потому что
    // границы бинов берутся из `ctx.sampleRate`.
    var WATCH = null, rnnOffered = false;

    function watchStop() {
      if (!WATCH) return;
      try { clearInterval(WATCH.timer); } catch (e) {}
      try { WATCH.src.disconnect(); } catch (e) {}
      try { WATCH.ctx.close(); } catch (e) {}
      WATCH = null;
    }

    function watchStart() {
      watchStop();
      if (RNN_ON) return;
      var t = micTrack();
      if (!t) return;
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var an = ctx.createAnalyser();
        an.fftSize = 1024; an.smoothingTimeConstant = 0;
        var src = ctx.createMediaStreamSource(new MediaStream([t]));
        src.connect(an);
        WATCH = { ctx: ctx, an: an, src: src, st: newStat(), hold: 0,
                  tbuf: new Float32Array(an.fftSize),
                  fbuf: new Float32Array(an.frequencyBinCount), timer: 0 };
        WATCH.timer = setInterval(watchTick, NS.TICK_MS);
      } catch (e) {
        // НЕ ПОЛУЧИЛОСЬ МЕРИТЬ - ЭТО НЕ ПОЛОМКА РАЗГОВОРА. Молчим в интерфейсе и
        // говорим в консоль: предложение просто не появится.
        console.warn('[rnn] наблюдатель фона не завёлся:', e);
      }
    }

    function watchTick() {
      if (!WATCH) return;
      feed(WATCH.st, WATCH.an, WATCH.tbuf, WATCH.fbuf);
      var v = verdict(WATCH.st);
      if (!v) return;
      // ТРИ ПРИЗНАКА РАЗОМ, А НЕ ОДИН ГРОМКИЙ. Просто громкий фон встроенное подавление
      // берёт; берёт оно и ровный. Не берёт оно РОВНО ЭТО СОЧЕТАНИЕ - заметный уровень,
      // прыгающий, и в полосе речи (живой разбор Ren 27.08).
      var noisy = v.db > NS.FLOOR_DB && v.spread >= NS.SPREAD_DB && v.low >= NS.LOW_SHARE;
      WATCH.hold = noisy ? (WATCH.hold + NS.TICK_MS / 1000) : 0;
      if (WATCH.hold < NS.HOLD_SEC) return;
      rnnOffer(v);
      // ПРЕДЛОЖИЛИ (ИЛИ РЕШИЛИ НЕ ПРЕДЛАГАТЬ) - БОЛЬШЕ МЕРИТЬ НЕЧЕГО. Наблюдатель,
      // крутящийся до конца созвона ради вопроса, на который ответ уже дан, - это работа
      // впустую на телефоне, ради которого мы и не включаем шумодав сами.
      if (rnnOffered || HAS_DISPLAY || rnnPrefGet()) watchStop();
    }

    // ═══ ПРЕДЛОЖЕНИЕ - ОДИН РАЗ ЗА СЕССИЮ И ТОЛЬКО ТАМ, ГДЕ ОНО УМЕСТНО ═══
    // На десктопе шумодав уже включён сам, предлагать нечего. Человеку, выключившему его
    // руками, не предлагаем ВООБЩЕ: он решил, и повторный вопрос это не забота, а спор.
    function rnnOffer(v) {
      if (rnnOffered || RNN_ON || HAS_DISPLAY || rnnPrefGet()) return;
      rnnOffered = true;
      var box = $('rnnoffer');
      if (!box) return;
      box.style.display = '';
      box.textContent = '';
      var t = document.createElement('span');
      // ЦИФРЫ, А НЕ «У ВАС ШУМНО»: человек вправе не согласиться, и тогда ему нужно
      // видеть, на чём основано предложение.
      t.textContent = 'Шумно: фон ' + Math.round(v.db) + ' дБ, скачет на '
        + Math.round(v.spread) + ' дБ, ' + Math.round(v.low * 100)
        + '% его энергии там же, где речь - встроенное подавление такой не берёт. ';
      box.appendChild(t);
      var b = document.createElement('button');
      b.textContent = '🔇 Включить шумодав';
      b.onclick = function () {
        box.style.display = 'none';
        rnnPref('on');
        rnnApply(true, 'по предложению');
      };
      box.appendChild(b);
    }

    // ═══ СКОЛЬКО ОН СНЯЛ - ЗАМЕР, А НЕ ФЛАГ «ВКЛЮЧЕНО» (закон №35) ═══
    // «Шумодав включён» верно и тогда, когда он не сделал ничего: модель могла не подойти
    // источнику, и человек продолжал бы фонить, считая себя вылеченным. Отчёт называет
    // ЧИСЛО, а нулевой результат - называет нулевым.
    var gainTimer = 0;
    function gainStop() { if (gainTimer) { clearInterval(gainTimer); gainTimer = 0; } }

    function gainStart() {
      gainStop();
      var pr = RNN_PROC;
      if (!pr || !pr.anIn || !pr.anOut) return;
      var a = newStat(), b = newStat();
      var tb = new Float32Array(pr.anIn.fftSize);
      var fb = new Float32Array(pr.anIn.frequencyBinCount);
      var left = Math.round(NS.GAIN_SEC * 1000 / NS.TICK_MS);
      gainTimer = setInterval(function () {
        if (!RNN_ON || RNN_PROC !== pr) { gainStop(); return; }
        // ПАУЗЫ ВЫБИРАЕМ ПО ВХОДУ, А ЗАМЕРЯЕМ ОБА. Выбери мы их по выходу - шумодав сам
        // решал бы, что считать паузой, и отчёт хвалил бы себя.
        var before = a.db.length;
        feed(a, pr.anIn, tb, fb);
        if (a.db.length > before) feed(b, pr.anOut, tb, fb);
        if (--left > 0) return;
        gainStop();
        var va = verdict(a), vb = verdict(b);
        if (!va || !vb) {
          // МОЛЧАНИЕ ТУТ ЧЕСТНЕЕ ВЫДУМАННОГО ЧИСЛА: пауз не набралось, мерить нечего.
          return;
        }
        var d = va.db - vb.db;
        if (d >= NS.GAIN_MIN_DB) {
          say('Шумодав работает: фон −' + Math.round(d) + ' дБ.');
        } else {
          say('Шумодав включён, но фон упал всего на ' + Math.round(d)
              + ' дБ - на этом источнике он не помогает. Выключить можно той же кнопкой.',
              true);
        }
      }, NS.TICK_MS);
    }

    // ═══ ПЕРЕГРУЗ МИКРОФОНА: МЕРИМ СИГНАЛ, А НЕ ЧИТАЕМ ФЛАГ ═══
    // Смотрим НА ИСТОЧНИК в обоих состояниях: при выключенном шумодаве это анализатор
    // наблюдателя фона, при включённом - входной анализатор процессора. Перегруз
    // случается ДО нас, в цепочке захвата, и от того, обрабатываем мы звук или нет, он
    // не зависит - значит и мерить его надо одинаково.
    var CLIP = { n: 0, hit: 0, said: false }, clipTimer = 0;

    function clipTick() {
      var an = (RNN_PROC && RNN_PROC.anIn) || (WATCH && WATCH.an) || null;
      if (!an) return;
      var buf = new Float32Array(an.fftSize);
      an.getFloatTimeDomainData(buf);
      var pk = 0;
      for (var i = 0; i < buf.length; i++) {
        var v = buf[i] < 0 ? -buf[i] : buf[i];
        if (v > pk) pk = v;
      }
      CLIP.n++;
      if (pk >= NS.CLIP_PEAK) CLIP.hit++;
      // ОКНО СКОЛЬЗЯЩЕЕ: за час разговора один хриплый эпизод не должен висеть в строке
      // до конца созвона, а свежий - обязан появиться.
      if (CLIP.n > 600) { CLIP.n = 300; CLIP.hit = Math.round(CLIP.hit / 2); }
      if (CLIP.n < NS.CLIP_MIN) return;
      var share = CLIP.hit / CLIP.n;
      // ДВА ПОРОГА, КАК У СТОРОЖА ПРОЦЕССОРА: строка, мигающая на границе, читается как
      // случайная и перестаёт что-либо значить.
      var bad = share >= NS.CLIP_SHARE;
      var okAgain = share <= NS.CLIP_SHARE / 2;
      if (bad === CLIP.said || (!bad && !okAgain)) return;
      CLIP.said = bad;
      AUDIO_CLIP = bad
        ? ('микрофон перегружается: ' + (share * 100).toFixed(1) + '% кадров упираются в '
           + 'потолок. АРУ этого не лечит - убавь усиление микрофона в настройках системы')
        : '';
      paintAudio();
    }

    // ═══ СТОРОЖ ПРОЦЕССОРА: ДВА ПОРОГА, ЧТОБЫ НЕ ХЛОПАТЬ ═══
    // Доклад приходит раз в секунду из самого worklet'а, поэтому счёт докладов и есть
    // счёт секунд. Между `CPU_OK` и `CPU_BAD` счётчик НЕ РАСТЁТ И НЕ СБРАСЫВАЕТСЯ - это и
    // есть гистерезис: на границе сторож молчит вместо того, чтобы включать и выключать.
    var cpuBad = 0, cpuWarned = false;
    function cpuOnLoad(load) {
      if (load >= NS.CPU_BAD) cpuBad += 1;
      else if (load <= NS.CPU_OK) { cpuBad = 0; return; }
      if (cpuBad < NS.CPU_HOLD_SEC) return;
      cpuBad = 0;
      var pct = Math.round(load * 100);
      if (!HAS_DISPLAY) {
        // НА ТЕЛЕФОНЕ РЕШАЕМ САМИ И ГОВОРИМ ОБ ЭТОМ. Захлебнувшаяся обработка это не
        // «чуть хуже качество», это рвущийся звук: сначала снимаем, потом объясняем.
        // И БОЛЬШЕ НЕ ПРЕДЛАГАЕМ: `rnnApply(false)` заводит наблюдателя фона заново, а
        // фон никуда не делся - без этой строки получился бы круг «сторож снял -
        // детектор предложил - человек включил - сторож снял».
        rnnOffered = true;
        rnnApply(false, 'устройство не справляется');
        say('Шумодав выключен: устройство не справляется (обработка съедала ' + pct
            + '% звукового потока). Звук идёт как был.', true);
        return;
      }
      if (cpuWarned) return;
      cpuWarned = true;
      // НА ДЕСКТОПЕ РЕШАЕТ ЧЕЛОВЕК: там запас есть почти всегда, и снятое за спиной
      // подавление он заметит по звуку, а не по нашей строке.
      var box = $('rnnoffer');
      if (!box) return;
      box.style.display = '';
      box.textContent = '';
      var t = document.createElement('span');
      t.textContent = 'Шумодав ест ' + pct + '% звукового потока - устройство на пределе, '
        + 'звук может рваться. ';
      box.appendChild(t);
      var b = document.createElement('button');
      b.textContent = '🔊 Выключить шумодав';
      b.onclick = function () {
        box.style.display = 'none';
        rnnPref('off');
        rnnApply(false, 'по предупреждению');
      };
      box.appendChild(b);
    }

    // ═══ ЧТО ЧЕЛОВЕК РЕШИЛ САМ - ПЕРЕЖИВАЕТ ВХОД И ВЫХОД ═══
    // «Уважать» решение только внутри одной сессии значит переспрашивать при каждом
    // заходе: автоматика включала бы шумодав заново, и человек выключал бы его снова.
    function rnnPref(v) { try { localStorage.setItem(RNN_PREF_KEY, v); } catch (e) {} }
    function rnnPrefGet() {
      try { return localStorage.getItem(RNN_PREF_KEY) || ''; } catch (e) { return ''; }
    }

    function rnnPaint() {
      var btn = $('rnn');
      if (btn) {
        btn.classList.toggle('on', RNN_ON);
        btn.textContent = RNN_ON ? '🔊 Выключить шумодав' : '🔇 Подавить шум';
      }
      // СТРОКА СЛЕДУЕТ ЗА СОСТОЯНИЕМ, А НЕ ЗА ПОРЯДКОМ СТРОК: браузерная часть меряется
      // один раз при захвате, наш шумодав живёт по кнопке.
      paintAudio();
    }

    // ═══ СОСТОЯНИЕ РАССЫЛАЕМ САМИ: АДМИН ВИДИТ ФАКТ, А НЕ СВОЮ ЖЕ ПРОСЬБУ ═══
    // Бот знает только то, что попросил, - а включает шумодав КЛИЕНТ и вправе не смочь
    // (нет wasm, не тот sampleRate, человек выключил обратно). Показывать админу
    // отправленную просьбу вместо факта значило бы врать ровно тем способом, ради
    // которого этот экран и заводится.
    function rnnSay() {
      try { upsert(room.localParticipant.identity, { rnn: RNN_ON }); } catch (e) {}
      send({ t: 'rnn', on: RNN_ON });
    }

    // ═══════════ ОДНА ДВЕРЬ НА ВСЕ ЧЕТЫРЕ ПУТИ ВКЛЮЧЕНИЯ ═══════════
    // Тап человека, автоматика десктопа, просьба админа и сторож процессора обязаны
    // делать ОДНО И ТО ЖЕ: иначе, например, автоматика включила бы шумодав, забыв снять
    // встроенный, и мы получили бы двойную обработку у половины комнаты (закон №40).
    async function rnnApply(on, why) {
      on = !!on;
      var pub = micPub();
      if (!pub || !pub.track || !pub.track.setProcessor) {
        if (why === 'тап') say('Этот клиент не умеет подключать шумодав к дорожке.', true);
        return false;
      }
      if (rnnBusy || on === RNN_ON) { rnnPaint(); return on === RNN_ON; }
      rnnBusy = true;
      var btn = $('rnn');
      if (btn) btn.disabled = true;
      try {
        if (on) {
          watchStop();
          if (why === 'тап') say('Включаю шумодав, это пара секунд…');
          var proc = rnnProcessor(await rnnBytes());
          proc.onLoad = cpuOnLoad;
          // setProcessor ПОДМЕНЯЕТ ДОРОЖКУ У ОТПРАВИТЕЛЯ, А НЕ ПЕРЕИЗДАЁТ ПУБЛИКАЦИЮ.
          // Именно поэтому переключение здесь безопасно и во время показа экрана, и
          // посреди разговора: сама публикация микрофона не трогается вовсе.
          await pub.track.setProcessor(proc);
          RNN_PROC = proc;
          RNN_ON = true;
          cpuBad = 0;
          await applyAudio(audioWant());
          gainStart();
          if (why && why !== 'тап') say('Шумодав включён (' + why + ').');
        } else {
          gainStop();
          await pub.track.stopProcessor();
          RNN_PROC = null;
          RNN_ON = false;
          await applyAudio(audioWant());
          watchStart();
          // ГОВОРИМ ВСЕГДА, А НЕ ТОЛЬКО ПО СВОЕМУ ТАПУ. Шумодав снимает ещё сторож
          // процессора и админ, и молчаливое снятие человек услышит как «шум вернулся
          // сам» - то есть пойдёт чинить микрофон. «Никаких уведомлений» из ТЗ - это про
          // АДМИНА, которому не докладывают о чужом локальном выборе, а не про хозяина
          // микрофона.
          say(why === 'тап' ? 'Шумодав выключен.'
                            : ('Шумодав выключен (' + (why || 'не мной') + ').'));
        }
      } catch (e) {
        // ОСТАЁМСЯ НА ИСХОДНОЙ ДОРОЖКЕ И ВОЗВРАЩАЕМ ВСТРОЕННОЕ ПОДАВЛЕНИЕ: уйти
        // одновременно без нашего и без браузерного значило бы оставить человека в эфире
        // хуже, чем он был до тапа.
        RNN_ON = false; RNN_PROC = null;
        // ═══ СНИМАЕМ ПРОЦЕССОР ЯВНО, А НЕ НАДЕЕМСЯ НА SDK ═══
        // `init` мог упасть ПОСЛЕ того, как livekit-client уже подменил дорожку у
        // отправителя, - проверить это из контейнера нечем (закон №48), а цена ошибки
        // здесь ТИШИНА В ЭФИРЕ: обработанной дорожки нет, а исходная уже не публикуется.
        // Один безусловный `stopProcessor` делает вопрос неважным: что бы SDK ни успел,
        // публикуется источник.
        try { await pub.track.stopProcessor(); } catch (e2) {}
        try { await applyAudio(audioWant()); } catch (e2) {}
        // ═══ БРАУЗЕР НЕ ДАЁТ ЗАПУСТИТЬ ЗВУК БЕЗ ЖЕСТА - ЭТО НЕ ПОЛОМКА, А ОЖИДАНИЕ ═══
        // Авто-включение при входе идёт БЕЗ жеста по построению, и на таком клиенте
        // красная строка вылезала бы при КАЖДОМ заходе - то есть сторож кричал бы всегда,
        // и на него перестали бы смотреть. Ждём первого касания и включаем молча; строка
        // при этом всё равно есть, но спокойная и объясняющая, а не отказ.
        var _needGesture = String((e && e.message) || '').indexOf('без твоего действия') >= 0;
        if (_needGesture && why === 'по умолчанию') {
          rnnArmGesture();
          say('Шумодав включится при первом касании экрана: раньше браузер обработку '
              + 'звука не запускает. Пока идёт встроенное подавление.');
        } else {
          // МОЛЧАЛИВЫХ ФОЛБЭКОВ ЗДЕСЬ НЕТ: неудачу видно строкой, а не по звуку. И строка
          // называет ТО НАПРАВЛЕНИЕ, которое не вышло: «не включился» над упавшим
          // ВЫКЛЮЧЕНИЕМ отправляет человека искать не ту поломку - тем более что снять
          // шумодав могли не он, а сторож процессора или админ.
          say((on ? 'Шумодав не включился (' : 'Шумодав не выключился (')
              + (e && e.message || e) + '). Звук идёт как был.', true);
        }
        watchStart();
      }
      if (btn) btn.disabled = false;
      rnnBusy = false;
      rnnPaint();
      rnnSay();
      return RNN_ON === on;
    }

    // ═══ ЖДЁМ ПЕРВОГО КАСАНИЯ И ПРОБУЕМ СНОВА - ОДИН РАЗ ═══
    // Условие, из-за которого мы не смогли включиться, снимается РОВНО ЖЕСТОМ, и ждать
    // его дешевле, чем требовать от человека найти кнопку. Слушатель одноразовый: второй
    // отказ уже не про жест, и крутить его по кругу значит скрывать настоящую причину.
    var gestureArmed = false;
    function rnnArmGesture() {
      if (gestureArmed) return;
      gestureArmed = true;
      var fire = function () {
        document.removeEventListener('pointerdown', fire, true);
        document.removeEventListener('keydown', fire, true);
        // РЕШЕНИЕ ЧЕЛОВЕКА МОГЛО ПОМЕНЯТЬСЯ, ПОКА МЫ ЖДАЛИ: он мог нажать «Подавить шум»
        // сам либо, наоборот, выключить. Перепроверяем, а не включаем вслепую.
        if (RNN_ON || rnnPrefGet() === 'off') return;
        rnnApply(true, 'по умолчанию');
      };
      document.addEventListener('pointerdown', fire, true);
      document.addEventListener('keydown', fire, true);
    }

    // ТАП ЧЕЛОВЕКА - ЭТО РЕШЕНИЕ, И ОНО ЗАПОМИНАЕТСЯ. Автоматика после него молчит
    // навсегда; админ может попросить снова - он человек, а не правило.
    async function rnnToggle() {
      rnnPref(RNN_ON ? 'off' : 'on');
      await rnnApply(!RNN_ON, 'тап');
    }

    // ═══ ПРОСЬБА АДМИНА: ПРИМЕНЯЕМ ЗДЕСЬ, ПРОЧИТАНА ОНА БЫЛА В showRec ═══
    rnnPump = function () {
      var w = rnnWant;
      rnnWant = null;
      if (!w) return;
      // ЛОКАЛЬНОЕ РЕШЕНИЕ ПОБЕЖДАЕТ - НО НЕ ЗАДНИМ ЧИСЛОМ. Просьба свежее его, значит
      // админ действовал ПОСЛЕ и знает, что делает; выключить обратно человек может тем
      // же тапом, и уведомления об этом никто не получит.
      rnnApply(w.on, w.by ? ('просьба: ' + w.by) : 'просьба админа');
    };

    // ═══ ПОКАЗ ЭКРАНА: КНОПКА ПО НАЛИЧИЮ МЕТОДА, А НЕ ПО ПЛАТФОРМЕ ═══
    // Живая проба (Ren 24.08): desktop отдаёт поток 2880x1448@30 со звуком вкладки,
    // Android - метода getDisplayMedia НЕТ ВООБЩЕ. Это не отказ в разрешении, а
    // отсутствие API: подсказывать нечего, включать нечего.
    // ПРОВЕРЯЕМ МЕТОД, А НЕ UserAgent: UA врёт (режим «для компьютеров» на телефоне),
    // наличие метода - факт.
    // ПРИЗНАК ОДИН НА СТРАНИЦУ (`HAS_DISPLAY`, объявлен выше): дефолт шумодава спрашивает
    // РОВНО ТО ЖЕ, что решает судьбу этой кнопки, и вторая копия проверки разошлась бы с
    // первой на первой правке.
    // ДВА УСЛОВИЯ, И ОНИ РАЗНЫЕ. Метод - что умеет КЛИЕНТ; грант - что разрешил СЕРВЕР.
    // Второе без первого бесполезно, первое без второго ВИСНЕТ вместо отказа.
    var g = grantOf(j.token), srcs = g.canPublishSources || [];
    var mayScreen = srcs.indexOf('screen_share') >= 0, mayCam = srcs.indexOf('camera') >= 0;
    // ═══ ЭКРАН - ТОЛЬКО ГДЕ ЕСТЬ МЕТОД, КАМЕРА - ВЕЗДЕ ═══
    // Прежняя редакция показывала камеру ТОЛЬКО там, где нет экрана, - как замену. Это
    // неверно: с компьютера тоже надо показать себя, особенно когда экран показывать
    // нечего. Делить по устройству оправдано лишь у экрана, где метода физически нет.
    var canScreen = HAS_DISPLAY && mayScreen;
    var canCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && mayCam;
    var showBtn = $('show'), camBtn = $('cam');

    if (!mayScreen && !mayCam) {
      // ГЛАВНОЕ СООБЩЕНИЕ ЭТОГО ЭКРАНА: причина НЕ в браузере и не в комнате.
      // НАЗЫВАЕМ ПРОВЕРЕННЫЙ ФАКТ И ГОВОРИМ, ЧЕМ ПРОВЕРИТЬ ПРИЧИНУ, А НЕ УТВЕРЖДАЕМ ЕЁ.
      // Прежняя редакция дописывала «Worker выложен старой версией» - это ДОГАДКА: тот
      // же пустой грант даёт и токен, выданный вчера, и смена политики выдачи. Факт у
      // нас ровно один - в токене нет права публикации.
      $('showhint').textContent = 'Показ выключен на сервере: в токене нет права '
        + 'публикации. Это у нас, не у тебя: смотреть чужой экран при этом можно. '
        + 'Проверить - tools/rtc_env.py, там видно, каким Worker\'ом выдан токен.';
    } else {
      if (canScreen) showBtn.style.display = '';
      if (canCam) camBtn.style.display = '';
      $('showhint').textContent = canScreen
        ? 'Смотреть чужой экран можно откуда угодно, показывать - с компьютера.'
        : 'Показ экрана у телефонов недоступен - такой возможности нет у мобильных '
          + 'браузеров. Запись экрана можно снять системой и прислать файлом в чат. '
          + 'Камера и просмотр чужого экрана работают отсюда.';
    }
    barLabel(showBtn, '🖥', 'Экран');

    // ═══ ПОРОГ СТОРОЖА ЗАВЕДОМО ВЫШЕ ВСЕХ ПОТОЛКОВ SDK ═══
    // ЖИВОЙ ОТКАЗ REN: «сервер не принял дорожку за 12 с», и после этого до перезахода не
    // работали НИ экран, НИ камера. Причина найдена исходником `livekit-client@2.7.2`, а
    // не рассуждением: у SDK свои таймауты на ОБЕИХ стадиях - `RTCEngine.addTrack` 10 с
    // («publication of local track timed out») и `PCTransportManager.negotiate` 15 с
    // (`peerConnectionTimeout`). Наши 12 с стояли РОВНО МЕЖДУ ними, то есть сторож резал
    // ЖИВОЕ окно негоциации и не давал дойти точному отказу SDK.
    // ПОЧЕМУ СТОРОЖ ВСЁ-ТАКИ НУЖЕН: два ожидания у SDK не ограничены ничем -
    // `getDisplayMedia` (человек выбирает источник, и это законно) и
    // `await this.republishPromise` в `setTrackEnabled` при переподключении. Второе как
    // раз и держит нас после аварии.
    // ЗНАЧИТ ОН СТРАХОВКА, А НЕ СУДЬЯ: 25 с (10 и 15 со слаком), а текст отказа берётся У
    // SDK, если тот успел ответить. Свой - только когда SDK не сказал ничего.
    var PUB_WATCHDOG_MS = 25000;

    // ═══ ПОСЛЕ НЕУДАЧНОЙ ПУБЛИКАЦИИ ДВИЖОК ВОЗВРАЩАЕТСЯ В РАБОЧЕЕ СОСТОЯНИЕ ═══
    // Провал негоциации у SDK зовёт `handleDisconnect('negotiation')`, движок уходит в
    // ПЕРЕПОДКЛЮЧЕНИЕ, а `setTrackEnabled` первым делом ждёт `republishPromise` - это
    // ОБЩЕЕ состояние, не по источнику. Отсюда «умерли обе кнопки»: камера ни при чём,
    // она просто ждёт того же.
    // ПОЭТОМУ ПОСЛЕ ОТКАЗА МЫ ЖДЁМ ФАКТА, А НЕ ПОКАЗЫВАЕМ ОШИБКУ И УХОДИМ. Ждём
    // ограниченно и смотрим `room.state` - именно его SDK выставляет в 'connected' по
    // завершении переподключения.
    function connOk() { return String(room.state || '') === 'connected'; }

    async function settle(ms) {
      var t0 = Date.now();
      while (Date.now() - t0 < ms) {
        if (connOk()) return true;
        await new Promise(function (r) { setTimeout(r, 250); });
      }
      return connOk();
    }

    // РУЧНОЕ ПЕРЕПОДКЛЮЧЕНИЕ - КНОПКОЙ, А НЕ САМО. Оно рвёт звук у всех, кто в разговоре;
    // делать это за человека посреди фразы хуже самой болезни. Кнопка при этом ЕСТЬ, и
    // это и есть «без перезахода»: окно закрывать не нужно.
    // ═══ ЖДЁМ ДВИЖОК В ФОНЕ, А НЕ ДЕРЖА КНОПКУ ═══
    // Первая редакция ждала `settle` ПРЯМО в обработчике тапа, и кнопка оставалась серой
    // все двенадцать секунд - то есть лечение от западни само было маленькой западнёй.
    // Человеку кнопка нужна СРАЗУ (отказ мог быть разовым), а предложение переподключиться
    // догонит его само.
    function watchEngine(why) {
      settle(12000).then(function (ok) { if (!ok) offerRedo(why); },
                         function () { offerRedo(why); });
    }

    var _redoBtn = null;
    function offerRedo(why) {
      if (_redoBtn) { _redoBtn.style.display = ''; return; }
      var host = $('showhint');
      if (!host) return;
      _redoBtn = document.createElement('button');
      _redoBtn.id = 'redo';          // чтобы реестр переключателей её ВИДЕЛ
      _redoBtn.className = 'wide';
      _redoBtn.textContent = '🔌 Переподключиться';
      _redoBtn.onclick = async function () {
        _redoBtn.disabled = true;
        say('Переподключаюсь…');
        try {
          await room.disconnect();
          // ТОТ ЖЕ ТОКЕН, ЧТО И НА ВХОДЕ: он живёт 15 минут и в самом частом случае
          // (авария вскоре после входа) ещё годен. Протух - говорим это ПРЯМО, а не
          // «не получилось»: лечится он не повтором, а новым входом из бота.
          await room.connect(j.url, j.token);
          await room.localParticipant.setMicrophoneEnabled(true, AUDIO_WANT);
          say('');
          _redoBtn.style.display = 'none';
        } catch (e) {
          var m = String((e && e.message) || e);
          say(/expire|invalid|token/i.test(m)
              ? 'Токен входа протух - открой комнату заново из бота, кнопка там всегда '
                + 'свежая. (' + m + ')'
              : 'Переподключиться не вышло: ' + m, true);
        }
        _redoBtn.disabled = false;
      };
      host.parentNode.insertBefore(_redoBtn, host.nextSibling);
      // ═══ ЛЕЧЕНИЕ ДОПИСЫВАЕТСЯ К ПРИЧИНЕ, А НЕ ЗАМЕНЯЕТ ЕЁ ═══
      // Поймала браузерная проба, а не чтение: `stopShow` честно говорил «у себя выключил,
      // сервер не подтвердил», а следом `offerRedo` затирал это своим текстом - человек
      // получал «нажми Переподключиться» и терял ЕДИНСТВЕННОЕ, что объясняло, видят его
      // соседи или нет. Диагноз и что делать нужны ОБА.
      var _was = ($('state').textContent || '').trim();
      say((_was ? _was + ' ' : '') + why
          + ' Соединение не вернулось само - нажми «Переподключиться», окно закрывать '
          + 'не надо.', true);
    }

    // ═══ ОДНА ДВЕРЬ НА ОБА ПОКАЗА, РАЗНЫЕ ТОЛЬКО ИСТОЧНИК И ПОДПИСЬ ═══
    // Две копии «включить/выключить» разошлись бы на первой правке (закон №40), а тут
    // цена расхождения - висящая дорожка, которую видно СОСЕДЯМ, а не нам.
    function toggler(btn, kind, offIcon, word) {
      var live = false;
      // ПОДПИСЬ И КЛАСС - ОДНОЙ ДВЕРЬЮ, ИЗ `live`. Пока их ставили по местам, ветка
      // отказа забывала их вернуть, и кнопка показывала «идёт показ» над мёртвой
      // дорожкой (живой отказ Ren).
      function paint() {
        btn.classList.toggle('on', live);
        barLabel(btn, live ? '⏹' : offIcon, word);
      }

      function sdkOff() {
        return kind === 'screen'
          ? room.localParticipant.setScreenShareEnabled(false)
          : room.localParticipant.setCameraEnabled(false);
      }

      async function stopShow() {
        // ПОРЯДОК ЗДЕСЬ ЗНАЧИМ, И ЭТО ПОЙМАЛ БРАУЗЕРНЫЙ ПРОГОН. Сперва гасим САМИ
        // дорожки (пока публикации ещё на месте), потом отключаем источник: наоборот
        // `setScreenShareEnabled(false)` уже снял публикации, и явная остановка работала
        // ВХОЛОСТУЮ - счётчик остановленных дорожек показывал ноль. Незакрытая дорожка
        // держит захват, и следующий выбор источника ведёт себя непредсказуемо.
        stopLocalMedia(kind);
        // ═══ ЛОКАЛЬНО МЫ УЖЕ ВЫКЛЮЧЕНЫ, ЧТО БЫ НИ ОТВЕТИЛ SDK ═══
        // Захват снят строкой выше, значит честное состояние кнопки - «выключено», и
        // ставим его ДО просьбы к SDK. ПРЕЖНЯЯ РЕДАКЦИЯ ДЕЛАЛА НАОБОРОТ: на исключении
        // она оставляла live=true и класс `.on`, следующий тап снова шёл в остановку,
        // снова падал - и человек был заперт до перезахода (живой отказ Ren:
        // «waiting for pending publication promise timed out», кнопка залипает).
        live = false;
        // ОКНО УХОДИТ ВМЕСТЕ С ЗАХВАТОМ, А НЕ ЖДЁТ СОБЫТИЯ ОТ SDK: `LocalTrackUnpublished`
        // может прийти с уже обнулённым `pub.track` - тогда плитка остаётся тёмной
        // навсегда (живой отзыв 29.08). Уборка идёт по ФАКТУ мёртвой дорожки.
        sweepVideos();
        try {
          await sdkOff();
          sweepVideos();
          say('');
        } catch (e) {
          sweepVideos();
          // ГОВОРИМ РОВНО ТО, ЧТО ЗНАЕМ: у себя выключили, а снял ли публикацию сервер -
          // не знаем. Молчаливое «выключено» здесь было бы обещанием соседям, которое мы
          // не можем сдержать.
          say('У себя ' + word.toLowerCase() + ' выключил, но сервер снятие не подтвердил ('
              + (e && e.message || e) + '). Соседи могут ещё пару секунд видеть картинку.',
              true);
          watchEngine('Показ снят у себя, но соединение в переподключении.');
        }
      }

      async function startShow() {
        var lost = false, pub = null;
        // ═══ ПОКАЗ УЖЕ ИДЁТ - ГОВОРИМ ЭТО, А НЕ МОЛЧИМ ═══
        // Живой случай 29.08: человек открыл комнату с двух своих клиентов, показ пошёл с
        // первого, а попытка со второго не дала НИЧЕГО - ни картинки, ни отказа. Что там
        // отвечает SFU, из кода не установить (закон №48), но молчание - худший исход в
        // любом случае: человек жмёт кнопку и не знает, сломано у него или занято.
        // Смотрим на ФАКТ комнаты: если картинка такого рода уже идёт, называем чью.
        if (kind === 'screen') {
          var busy = '';
          try {
            vids.forEach(function (r) {
              if (busy || r.el.dataset.me === '1') return;
              busy = (r.el.dataset.nm || r.el.dataset.pid || 'кто-то');
            });
          } catch (e) {}
          if (busy) {
            say('Экран уже показывает ' + busy + '. Если это твой второй вход - показ идёт '
                + 'в том окне, и с этого он не начнётся: комната пускает по одной картинке '
                + 'от участника.', true);
          }
        }
        try {
          pub = (kind === 'screen')
            // ПОТОЛОК КАРТИНКИ ЗАДАН НАРОЧНО: 2880x1448@30 это десятки мегабит, а комната
            // живёт на общем канале песочницы. Читаемость текста даёт и 1080p.
            ? room.localParticipant.setScreenShareEnabled(
                true, { audio: true, resolution: { width: 1920, height: 1080, frameRate: 15 } })
            : room.localParticipant.setCameraEnabled(true);
          await Promise.race([pub, new Promise(function (_, rej) {
            setTimeout(function () {
              lost = true;
              // НИ СЛОВА О ПРИЧИНЕ: мы её не знаем. ПРЕЖНЯЯ РЕДАКЦИЯ УТВЕРЖДАЛА «старый
              // токен без права показа: у нас не выложен Worker» - и это было ЗАВЕДОМО
              // ЛОЖНО, потому что кнопка вообще показывается ТОЛЬКО когда в гранте есть
              // нужный источник (см. `grantOf` выше). То есть единственное, что мы к
              // этому моменту проверили, подсказка и отрицала.
              rej(new Error('за ' + Math.round(PUB_WATCHDOG_MS / 1000)
                            + ' с не пришло ни подтверждения, ни отказа (свои потолки у '
                            + 'клиента - 10 и 15 с, значит встало не на них)'));
            }, PUB_WATCHDOG_MS);
          })]);
          live = true; say('');
        } catch (e) {
          if (lost) {
            // ОПЕРАЦИЯ ВСЁ ЕЩЁ ИДЁТ ВНУТРИ SDK. Просим ЕГО ЖЕ её свернуть - тем самым
            // методом, которым включали: только он умеет снять состояние «публикуется».
            try { await sdkOff(); } catch (e2) {}
            // А ЕСЛИ ОНА ВСЁ-ТАКИ ДОЕДЕТ ПОЗЖЕ - СНИМАЕМ И ЕЁ. Иначе человек показывает
            // экран, будучи уверенным, что не показывает, и выключить нечем.
            try {
              pub.then(function () {
                if (live) return;
                try { stopLocalMedia(kind); } catch (e3) {}
                try { sdkOff(); } catch (e3) {}
                say('Дорожка доехала уже после отказа - снял её. Попробуй ещё раз.', true);
              }, function () {});
            } catch (e4) {}
          }
          stopLocalMedia(kind);          // чтобы неудача не оставила захват висеть
          live = false;
          say('Показать не вышло (' + (e && e.name || 'ошибка') + '): '
              + (e && e.message || e), true);
          // ═══ ВОЗВРАЩАЕМ ДВИЖОК, А НЕ ТОЛЬКО ПОКАЗЫВАЕМ ОШИБКУ ═══
          // Требование Ren по живому прогону: после неудачи и экран, и камера обязаны
          // включаться без перезахода. Ждём ФАКТА `room.state === 'connected'`, а не
          // «мы позвали и надеемся» (закон №35); не вернулось - даём кнопку.
          watchEngine('Показать не вышло, и соединение ушло в переподключение.');
        }
      }

      btn.onclick = async function () {
        // ДВА ОДНОВРЕМЕННЫХ ВЫЗОВА ОДНОГО ИСТОЧНИКА - ВТОРОЙ ИСТОЧНИК ТОЙ ЖЕ ОШИБКИ.
        // livekit-client ждёт незавершённую операцию и падает «waiting for pending
        // publication promise timed out»; нетерпеливый двойной тап по «Показать экран»
        // воспроизводит это без всякого таймаута.
        if (btn.disabled) return;
        btn.disabled = true;
        try {
          if (live) await stopShow(); else await startShow();
        } catch (e) {
          // СЮДА ПОПАДАТЬ НЕ ДОЛЖНЫ - но если попали, кнопка обязана ожить всё равно.
          say('Не вышло: ' + (e && e.message || e), true);
        } finally {
          // ═══ КНОПКА ВОЗВРАЩАЕТСЯ В СОСТОЯНИЕ, СООТВЕТСТВУЮЩЕЕ `live`, ВСЕГДА ═══
          paint();
          btn.disabled = false;
        }
      };
    }

    // ЯВНАЯ ОСТАНОВКА ЛОКАЛЬНЫХ ДОРОЖЕК. Ищем среди своих публикаций те, что относятся к
    // этому виду, и зовём stop() на КАЖДОЙ - у показа экрана их две (картинка и звук
    // вкладки), и забытая вторая держит захват.
    function stopLocalMedia(kind) {
      try {
        var pubs = room.localParticipant.trackPublications
                || room.localParticipant.tracks || new Map();
        pubs.forEach(function (pub) {
          var src = String(pub.source || '');
          var mine = (kind === 'screen')
            ? (src.indexOf('screen') >= 0)
            : (src === 'camera');
          if (!mine || !pub.track) return;
          try { pub.track.stop(); } catch (e) {}
          var ms = pub.track.mediaStreamTrack;
          if (ms) { try { ms.stop(); } catch (e) {} }
        });
      } catch (e) {}
    }

    toggler(showBtn, 'screen', '🖥', 'Экран');
    toggler(camBtn, 'camera', '📷', 'Камера');

    // ═══ РУКА И ОЧЕРЕДЬ СЛОВА - ПО КАНАЛУ ДАННЫХ LIVEKIT ═══
    // Он идёт по тому же соединению, что звук: это на порядок быстрее опроса нашего ящика
    // раз в 1.2-3 секунды, и ради трёх кнопок второй транспорт заводить незачем.
    var handUp = false;
    function send(obj) {
      try {
        room.localParticipant.publishData(
          new TextEncoder().encode(JSON.stringify(obj)), { reliable: true });
      } catch (e) {}
    }
    $('hand').onclick = function () {
      handUp = !handUp;
      $('hand').classList.toggle('on', handUp);
      $('hand').textContent = handUp ? '✋ Опустить руку' : '✋ Поднять руку';
      upsert(room.localParticipant.identity, { hand: handUp ? Date.now() : 0 });
      send({ t: 'hand', up: handUp });
    };
    // ЗАГЛУШИТЬ ВСЕХ - ПРОСЬБА, А НЕ ПРИКАЗ, И ЭТО СКАЗАНО ЧЕСТНО. Серверного «замолчи»
    // мы не шлём: для него нужен админский грант у каждого, а это право выключать чужой
    // микрофон кому угодно. Клиенты глушат СЕБЯ сами; тот, кто не захочет, останется
    // слышен - для лекции этого достаточно, для принуждения нет.
    $('hush').style.display = '';
    $('hush').onclick = function () { send({ t: 'hush' }); say('Попросил всех приглушиться.'); };

    //: КАК НАС ЗОВУТ ДЛЯ ОСТАЛЬНЫХ. В `people` мы записаны словом «Ты» - его нельзя ни
    //: рассылать, ни ставить в подпись таймера: у соседа «поставил Ты» не значит ничего.
    function myLabel() {
      return human(room.localParticipant.name, room.localParticipant.identity);
    }
    function nameOf(p) {
      var rec = people[p.identity];
      return (rec && rec.name && !rec.me) ? rec.name : human(p.name, p.identity);
    }

    // ТЕМП СВОЙ И ЧУЖОЙ СЧИТАЮТСЯ ОТДЕЛЬНО, И ЭТО НЕ ПЕРЕСТРАХОВКА. Свой бережёт соседей
    // от нашей же залипшей кнопки; чужой бережёт НАС от того, у кого она залипла, - и
    // одним счётчиком это не закрыть, потому что у них разные владельцы.
    var lastReact = 0, lastFrom = {};
    function canReact() {
      // ЗАПРЕТ АДМИНА СТОИТ ЗДЕСЬ, В ОДНОЙ ДВЕРИ НА ЭМОДЗИ И ЗВУКИ. Две копии проверки
      // разошлись бы на первой правке, и заглушенный продолжал бы слать что-нибудь одно.
      // ЭТО НЕ ЗАЩИТА, А ЧЕСТНОСТЬ: настоящий запрет исполняют ПОЛУЧАТЕЛИ, здесь мы
      // просто не делаем вид, что кнопка сработала.
      if (iAmFunOff()) { funPaint(); return false; }
      var now = Date.now();
      if (now - lastReact < 600) return false;
      lastReact = now;
      return true;
    }
    function floodOk(id) {
      var now = Date.now();
      if (now - (lastFrom[id] || 0) < 600) return false;
      lastFrom[id] = now;
      return true;
    }

    // ═══ ЭМОДЗИ-РЕАКЦИИ: ТОЛЬКО КАНАЛ ДАННЫХ, НИ БАЙТА ЗВУКА ═══
    // Реакция обязана работать и у того, кто молчит с выключенным микрофоном, и у
    // веб-гостя без Telegram: ящик бота тут не участвует вовсе, поэтому и гейта нет.
    ['👍', '❤️', '😂', '🔥', '🤔', '😮', '🙏', '🎉'].forEach(function (e) {
      var b = document.createElement('button');
      b.className = 'emo';
      b.textContent = e;
      b.onclick = function () {
        if (!canReact()) return;
        popup('Ты  ' + e);
        send({ t: 'react', e: e });
      };
      $('emos').appendChild(b);
    });

    Object.keys(SOUNDS).forEach(function (id) {
      var s = SOUNDS[id];
      var b = document.createElement('button');
      b.className = 'snd';
      b.textContent = s.e + ' ' + s.t;
      b.onclick = function () {
        if (!canReact()) return;
        // ЗВУК ИГРАЕТ И У ОТПРАВИТЕЛЯ. Иначе он не знает, сработала ли кнопка, жмёт
        // второй раз - и у остальных играет дважды.
        playSnd(id);
        popup('Ты  ' + s.e + ' ' + s.t);
        send({ t: 'snd', s: id });
      };
      $('snds').appendChild(b);
    });
    // ГРАНИЦА НАЗЫВАЕТСЯ СРАЗУ: звук идёт каналом данных, а пишется МИКРОФОН. Человек,
    // который «поставил аплодисменты в запись», узнал бы об этом только из транскрипта.
    $('reacthint').textContent = 'Слышат все, кто сейчас в комнате. В запись реакции не '
      + 'попадают: они идут отдельным каналом, а не через микрофон.';

    // ═══════════════════════════════════════════════════════════════════════════════
    // ТАЙМЕР: ПЕРЕДАЁМ ОСТАТОК, А НЕ МОМЕНТ КОНЦА
    // ═══════════════════════════════════════════════════════════════════════════════
    // Часы у телефонов расходятся на минуты, и абсолютная метка показала бы одному
    // «осталось 4:59», другому «время вышло» - причём выглядело бы это как наш баг.
    // Остаток от расхождения часов не зависит вовсе: каждый считает СВОЙ дедлайн от
    // своего же «сейчас», а задержка канала данных (десятки миллисекунд) для
    // пятиминутного таймера не значит ничего.
    var tmrEnd = 0, tmrBy = '', tmrTick = null, tmrFired = false;

    function stopTmrLoop() { if (tmrTick) { clearInterval(tmrTick); tmrTick = null; } }

    // ═══ ОДИН МЕХАНИЗМ «ДОГНАТЬ ВОШЕДШЕГО ПОЗЖЕ» НА ВСЁ ОБЩЕЕ СОСТОЯНИЕ ═══
    // Канал данных доставляет ТОЛЬКО тем, кто уже в комнате. Значит у каждого общего
    // состояния (таймер, график) обязан быть повтор - и это ОДНО правило, а не по копии
    // на фичу: две копии разъехались бы периодом и условием остановки, а заметил бы это
    // человек, у которого «у всех график BTC, а у меня пусто» (закон №40).
    var BEAT_MS = 5000;
    var beats = {};
    function beat(key, fn) {
        stopBeat(key);
        if (!fn) return;
        beats[key] = setInterval(function () {
            var m = fn();
            if (m) send(m); else stopBeat(key);
        }, BEAT_MS);
    }
    function stopBeat(key) {
        if (key === undefined) {                 // без имени - погасить всё (выход/сброс)
            Object.keys(beats).forEach(stopBeat);
            return;
        }
        if (beats[key]) { clearInterval(beats[key]); delete beats[key]; }
    }
    function tmrMenu(on) { $('tmrset').style.display = on ? '' : 'none'; }

    function tmrPaint() {
      var bar = $('tmrbar');
      if (!tmrEnd) { bar.style.display = 'none'; bar.className = 'tmr'; return; }
      var left = Math.max(0, Math.round((tmrEnd - Date.now()) / 1000));
      bar.style.display = '';
      if (left > 0) {
        bar.className = 'tmr';
        bar.textContent = '⏱ ' + Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2)
          + (tmrBy ? ' · поставил ' + tmrBy : '');
        return;
      }
      bar.className = 'tmr fin';
      bar.textContent = '⏱ Время вышло' + (tmrBy ? ' · таймер ' + tmrBy : '');
      if (tmrFired) return;
      tmrFired = true;
      stopTmrLoop();
      stopBeat('tmr');
      $('tmr').classList.remove('on');
      // У КОНЦА ТАЙМЕРА ДВА НЕЗАВИСИМЫХ СПОСОБА ДОЙТИ. Звук может не сыграть вовсе -
      // браузер держит аудио-контекст, пока человек ничего не нажимал, - и тогда
      // единственным сигналом остаётся строка. Полагаться на один было бы обещанием.
      playSnd('gong');
      popup('⏰ Время вышло');
      // СТРОКА ГАСНЕТ САМА, НО НЕ СРАЗУ: тот, кто смотрел в другое окно, обязан успеть
      // её увидеть.
      setTimeout(function () {
        if (!tmrFired) return;
        tmrEnd = 0;
        tmrPaint();
      }, 15000);
    }

    //: mine=true - таймер ставим МЫ, значит на нас же сердцебиение.
    function tmrSet(sec, by, mine) {
      stopTmrLoop();
      stopBeat('tmr');
      tmrFired = false;
      if (!(sec > 0)) {                       // ноль и меньше - снятие
        tmrEnd = 0;
        tmrBy = '';
        $('tmr').classList.remove('on');
        tmrPaint();
        return;
      }
      tmrEnd = Date.now() + sec * 1000;
      tmrBy = by || '';
      $('tmr').classList.add('on');
      tmrTick = setInterval(tmrPaint, 500);
      tmrPaint();
      if (!mine) return;
      // СЕРДЦЕБИЕНИЕ - РАДИ ВОШЕДШИХ ПОЗЖЕ. Канал данных доставляет только тем, кто уже в
      // комнате: без повтора человек, зашедший на второй минуте, не увидел бы таймера
      // ВООБЩЕ (тот же класс, что рассылка признака записи вместо метаданных комнаты).
      // ЧЕСТНАЯ ГРАНИЦА: уйдёт поставивший - повтор прекратится, но у тех, кто уже
      // получил остаток, таймер досчитает и прозвонит сам; не увидят его только те, кто
      // войдёт ПОСЛЕ его ухода.
      beat('tmr', function () {
        var left = Math.round((tmrEnd - Date.now()) / 1000);
        if (left <= 0) return null;              // вернул null - повтор гасится сам
        return { t: 'tmr', left: left, by: myLabel() };
      });
    }

    // ═════════════════════════════════════════════════════════════════════════════
    // ГРАФИК: ОДИН НА КОМНАТУ, МЕНЯЕТ ЛЮБОЙ, И ВИДНО КТО
    // ═════════════════════════════════════════════════════════════════════════════
    // ВЕДУЩЕГО В ЭТОЙ КОМНАТЕ НЕТ КАК ПОНЯТИЯ, и заводить его ради одной кнопки значило
    // бы городить права там, где у нас всё построено на договорённости («заглушить всех»
    // это просьба, а не приказ). Поэтому пару меняет любой, а рядом ИМЯ того, кто
    // поменял: спорить о том, кто сбил график, не придётся.
    //
    // ВИДЖЕТ НЕ УМЕЕТ МЕНЯТЬ СИМВОЛ НА ЛЕТУ. У бесплатного встраиваемого графика нет
    // наружного JS-API (платная Charting Library - другая история и другие деньги),
    // поэтому смена пары это ПЕРЕСОЗДАНИЕ. Отсюда же берётся мигание при переключении -
    // это свойство виджета, а не наша недоделка.
    var SYMS = [['BTC', 'BINANCE:BTCUSDT'], ['ETH', 'BINANCE:ETHUSDT'],
                ['SOL', 'BINANCE:SOLUSDT'], ['TON', 'BINANCE:TONUSDT'],
                ['DXY', 'TVC:DXY'], ['GOLD', 'TVC:GOLD']];
    var TFS = [['5м', '5'], ['15м', '15'], ['1ч', '60'], ['4ч', '240'], ['D', 'D']];
    var chSym = '', chTf = '60', chBy = '', chOpen = false;

    //: СИМВОЛ ЧИСТИТСЯ, ПОТОМУ ЧТО ПРИХОДИТ ОТ КЛИЕНТА И УЕЗЖАЕТ В ЧУЖОЙ ВИДЖЕТ. Строка
    //: из канала данных - это строка, которую написал сосед, а не мы; пустить её как есть
    //: значит дать ему решать, что подставится в конфиг у всех остальных.
    function symOk(x) {
      var v = String(x || '').toUpperCase().replace(/[^A-Z0-9:_.\-]/g, '').slice(0, 24);
      return /^[A-Z0-9_.\-]{2,}(:[A-Z0-9_.\-]{2,})?$/.test(v) ? v : '';
    }
    function tfOk(x) {
      var v = String(x || '').toUpperCase().slice(0, 4);
      return /^(1|3|5|15|30|60|120|240|D|W|M)$/.test(v) ? v : '';
    }

    // ═══ ВИДЖЕТ ПЕРЕСОБИРАЕТСЯ ТОЛЬКО КОГДА МЕНЯЮТСЯ ЕГО ВХОДЫ ═══
    // ЖИВОЙ ОТКАЗ REN: «график пересоздаётся у ВСЕХ при любом действии» - мигание,
    // сброшенный масштаб, потерянное место на свечах. Механизм наш и виден по коду:
    // владелец графика шлёт `{t:'chart'}` СЕРДЦЕБИЕНИЕМ раз в пять секунд (чтобы догнать
    // вошедшего позже), каждый получатель звал `chartSet` -> `chartPaint`, а тот СНОСИЛ
    // коробку и заново грузил скрипт TradingView. То есть у всех, кроме владельца, график
    // рождался заново каждые пять секунд - и любой штрих или `ask` добавлял ещё один раз.
    // Виджет тут ни при чём: наружного API у бесплатного встраиваемого графика нет, и
    // сменить символ «на лету» правда нельзя, - но и пересобирать его при НЕИЗМЕННЫХ
    // символе и таймфрейме незачем. `chBuilt` помнит, ЧТО реально стоит в коробке.
    var chBuilt = '';
    function chartPaint() {
      var box = $('chartbox');
      $('crypto').style.display = chOpen ? '' : 'none';
      $('chart').classList.toggle('on', chOpen);
      if (!chOpen) return;
      paintSymBtns();
      var want = chSym ? (chSym + '|' + chTf) : '';
      if (want !== chBuilt) {
        // ХОЛСТ ПЕРЕЖИВАЕТ ПЕРЕСОЗДАНИЕ ГРАФИКА: он лежит В ТОЙ ЖЕ коробке, и снеси мы её
        // целиком - вместе с чужим графиком стёрлись бы все чужие штрихи.
        var keep = $('draw');
        [].slice.call(box.children).forEach(function (c) {
          if (c !== keep) box.removeChild(c);
        });
        chBuilt = want;
        if (want) {
          var host = document.createElement('div');
          host.className = 'tvhost';
          host.style.cssText = 'position:absolute;inset:0';
          box.insertBefore(host, keep);
          var sc = document.createElement('script');
          sc.src = 'https://s3.tradingview.com/external-embedding/'
                 + 'embed-widget-advanced-chart.js';
          sc.async = true;
          sc.text = JSON.stringify({
            symbol: chSym, interval: chTf, theme: 'dark', style: '1', locale: 'ru',
            hide_side_toolbar: true, hide_top_toolbar: false, allow_symbol_change: false,
            save_image: false, autosize: true,
          });
          host.appendChild(sc);
        }
      }
      if (!chSym) {
        // ДОСКА ОСТАЁТСЯ - ОНА ПОЛЕЗНА И САМА ПО СЕБЕ. Убрали график, чтобы чертить схему
        // на чистом поле, а не чтобы закрыть панель.
        $('chartwho').textContent = 'Графика нет - чистая доска. Выбери пару, если нужен '
          + 'график: его увидят все, кто в комнате.';
        return;
      }
      // ПОДПИСЬ ОБНОВЛЯЕТСЯ ВСЕГДА - ОНА ДЕШЁВАЯ И МЕНЯЕТСЯ ЧАЩЕ ГРАФИКА (кто поставил).
      $('chartwho').textContent = chSym + ' · ' + chTf
        + (chBy ? ' · поставил ' + chBy : '');
    }

    function chartSet(sym, tf, by, mine) {
      // ═══ ПУСТАЯ ПАРА - ЭТО «УБРАТЬ ГРАФИК», А НЕ ПРОМАХ ═══
      // Доска полезна и БЕЗ графика (схему чертят на чистом поле), а обратного пути у
      // выбора пары не было вовсе: выбрал BTC - и живи с ним. Это четвёртая фича подряд,
      // которую можно включить и нельзя выключить, - см. правило про обратный путь.
      if (sym === null) {
        chSym = ''; chBy = by || '';
        chartPaint();
        if (mine) {
          stopBeat('chart');
          send({ t: 'chart', sym: '', tf: chTf, by: myLabel() });
        }
        return;
      }
      var s2 = symOk(sym), t2 = tfOk(tf) || chTf;
      if (sym && !s2) {
        // ОТБРОШЕННОЕ НАЗЫВАЕТСЯ. Молча проигнорировать чужой символ значит оставить
        // соседа в уверенности, что у всех обновилось.
        say('Пара «' + String(sym).slice(0, 20) + '» не похожа на тикер - не меняю.', true);
        return;
      }
      chSym = s2; chTf = t2; chBy = by || '';
      if (s2 && !chOpen) chOpen = true;      // прислали график - открываем панель
      chartPaint();
      if (!mine) return;
      beat('chart', function () {
        return chSym ? { t: 'chart', sym: chSym, tf: chTf, by: myLabel() } : null;
      });
      send({ t: 'chart', sym: chSym, tf: chTf, by: myLabel() });
    }

    function paintSymBtns() {
      [].slice.call($('syms').children).forEach(function (b) {
        b.classList.toggle('on', !!b.dataset.sym && b.dataset.sym === chSym);
      });
      var off = $('symoff');
      if (off) off.style.display = chSym ? '' : 'none';
      [].slice.call($('tfs').children).forEach(function (b) {
        b.classList.toggle('on', b.dataset.tf === chTf);
      });
    }

    SYMS.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = p[0]; b.dataset.sym = p[1];
      // ПОВТОРНЫЙ ТАП ПО ВЫБРАННОЙ ПАРЕ СНИМАЕТ ЕЁ: у выбора обязан быть обратный ход,
      // и он должен лежать там же, где прямой, - иначе его ищут и не находят.
      b.onclick = function () {
        if (chSym === p[1]) chartSet(null, chTf, 'Ты', true);
        else chartSet(p[1], chTf, 'Ты', true);
      };
      $('syms').appendChild(b);
    });
    var bOther = document.createElement('button');
    bOther.className = 'chip'; bOther.textContent = '✏️ Своя';
    bOther.onclick = function () {
      var v = '';
      try { v = prompt('Пара как в TradingView, например BINANCE:ARBUSDT') || ''; } catch (e) {}
      if (v.trim()) chartSet(v.trim(), chTf, 'Ты', true);
    };
    $('syms').appendChild(bOther);
    // ЯВНАЯ КНОПКА РЯДОМ С НЕЯВНЫМ ПОВТОРНЫМ ТАПОМ. Повторный тап - для тех, кто его
    // угадает; кнопка - для всех остальных. Показывается ТОЛЬКО когда есть что убирать:
    // «убрать график» на пустой доске отвечает не на тот вопрос.
    var bOff = document.createElement('button');
    bOff.className = 'chip'; bOff.id = 'symoff'; bOff.textContent = '✖️ Убрать график';
    bOff.style.display = 'none';
    bOff.onclick = function () { chartSet(null, chTf, 'Ты', true); };
    $('syms').appendChild(bOff);
    TFS.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = p[0]; b.dataset.tf = p[1];
      b.onclick = function () { if (chSym) chartSet(chSym, p[1], 'Ты', true); };
      $('tfs').appendChild(b);
    });
    // ═════════════════════════════════════════════════════════════════════════════
    // СОВМЕСТНЫЙ ХОЛСТ ПОВЕРХ ГРАФИКА
    // ═════════════════════════════════════════════════════════════════════════════
    // ПОЧЕМУ СВОЙ СЛОЙ, А НЕ РАЗМЕТКА TRADINGVIEW. Бесплатный виджет свою разметку наружу
    // не отдаёт вовсе, а Charting Library, которая отдаёт, - платная лицензия. Значит
    // либо свой холст, либо ничего.
    //
    // ═══ КООРДИНАТЫ ДОЛЕЙ, А НЕ ПИКСЕЛЕЙ - ЭТО НЕСУЩЕЕ, А НЕ АККУРАТНОСТЬ ═══
    // У меня телефон 390 px, у соседа десктоп 1200. Пошли мы пиксели - его «вот этот
    // уровень» лёг бы у меня на треть экрана левее, то есть указывал бы на другую цену.
    // Доли (0..1) от коробки графика переносятся между экранами без единой поправки.
    //
    // ЧТО ЕДЕТ В КАНАЛ. Штрихи ПРИРАЩЕНИЯМИ и пачками (не по точке на каждое движение
    // пальца - это залило бы канал), полный штрих не пересылается никогда.
    var CV_MAX = 400;            // штрихов на комнату: без потолка холст растёт вечно
    var CV_PTS = 400;            // точек в штрихе
    var CV_BATCH = 120;          // мс между пачками точек
    var strokes = [], curId = 0, cur = null, tool = 'pen', drawOn = false;
    var outbox = null, batchT = null, tips = {};

    function myColor(id) {
      // ЦВЕТ ВЫВОДИТСЯ ИЗ IDENTITY, А НЕ РАЗДАЁТСЯ ПО ОЧЕРЕДИ: у всех в комнате он обязан
      // получиться ОДИН И ТОТ ЖЕ, иначе «синюю линию нарисовал Ваня» у соседа окажется
      // зелёной. Раздача по порядку входа этого не даёт - порядок у каждого свой.
      var h = 0, str = String(id || '');
      for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
      return 'hsl(' + h + ',85%,62%)';
    }

    function cvFit() {
      var c = $('draw'), b = $('chartbox');
      if (!c || !b) return null;
      var r = b.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (!r.width || !r.height) return null;
      if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) {
        c.width = Math.round(r.width * dpr);
        c.height = Math.round(r.height * dpr);
      }
      return { c: c, w: r.width, h: r.height, dpr: dpr, box: r };
    }

    function cvDraw() {
      var f = cvFit();
      if (!f) return;
      var g = f.c.getContext('2d');
      g.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
      g.clearRect(0, 0, f.w, f.h);
      g.lineCap = 'round';
      g.lineJoin = 'round';
      strokes.forEach(function (st) {
        var p = st.p || [];
        if (!p.length) return;
        g.strokeStyle = st.c;
        g.fillStyle = st.c;
        g.lineWidth = 2.5;
        if (st.k === 'text') {
          g.font = '600 14px -apple-system,Segoe UI,Roboto,sans-serif';
          g.fillText(String(st.x || '').slice(0, 60), p[0][0] * f.w, p[0][1] * f.h);
          return;
        }
        g.beginPath();
        g.moveTo(p[0][0] * f.w, p[0][1] * f.h);
        for (var i = 1; i < p.length; i++) g.lineTo(p[i][0] * f.w, p[i][1] * f.h);
        g.stroke();
        if (st.k === 'arrow' && p.length > 1) {
          // СТРЕЛКА - ЭТО ЛИНИЯ ПЛЮС ДВА ШТРИХА НА КОНЦЕ, а не отдельный инструмент с
          // отдельным протоколом: чем меньше видов штриха, тем меньше мест разойтись.
          var a = p[p.length - 2], b2 = p[p.length - 1];
          var ang = Math.atan2((b2[1] - a[1]) * f.h, (b2[0] - a[0]) * f.w);
          var x2 = b2[0] * f.w, y2 = b2[1] * f.h;
          g.beginPath();
          g.moveTo(x2, y2);
          g.lineTo(x2 - 11 * Math.cos(ang - 0.4), y2 - 11 * Math.sin(ang - 0.4));
          g.moveTo(x2, y2);
          g.lineTo(x2 - 11 * Math.cos(ang + 0.4), y2 - 11 * Math.sin(ang + 0.4));
          g.stroke();
        }
      });
      // ИМЯ РЯДОМ С ЧУЖИМ КУРСОРОМ: без него линия появляется «сама», и понять, кто
      // сейчас чертит, нельзя.
      var now = Date.now();
      Object.keys(tips).forEach(function (k) {
        var t = tips[k];
        if (now - t.at > 2200) { delete tips[k]; return; }
        g.fillStyle = t.c;
        g.font = '600 11px -apple-system,Segoe UI,Roboto,sans-serif';
        g.fillText(t.n, t.x * f.w + 8, t.y * f.h - 6);
      });
    }

    function cvApply(m, who, nm) {
      // ДЕДУП ПО ID ШТРИХА. История догоняет вошедшего кусками и может прийти дважды -
      // от двоих сразу; без дедупа линии удвоились бы и потолстели.
      if (m.t === 'd') {
        var id = String(m.id || '').slice(0, 40);
        if (!id) return;
        var st = null;
        for (var i = strokes.length - 1; i >= 0; i--) if (strokes[i].id === id) { st = strokes[i]; break; }
        if (!st) {
          if (strokes.length >= CV_MAX) strokes.shift();
          // ═══ ЦВЕТ БЕРЁТСЯ ИЗ ID ШТРИХА, А НЕ У ОТПРАВИТЕЛЯ СООБЩЕНИЯ ═══
          // Пока штрихи ездят только «в прямом эфире», отправитель и автор совпадают, и
          // разница невидима. Но историю вошедшему позже пересылает КТО-ТО ОДИН - и по
          // цвету отправителя все чужие линии стали бы ЕГО цветом, то есть доска у
          // новичка выглядела бы иначе, чем у всех остальных.
          st = { id: id, c: myColor(id.split('|')[0] || who),
                 k: String(m.k || 'pen').slice(0, 6), p: [],
                 x: String(m.x || '').slice(0, 60) };
          strokes.push(st);
        }
        var pts = (m.p || []).slice(0, CV_PTS);
        // У ЛИНИИ И СТРЕЛКИ КОНЕЦ ЗАМЕНЯЕТСЯ, А НЕ ДОПИСЫВАЕТСЯ: иначе «резиновая» линия
        // оставляла бы за собой веер промежуточных положений.
        if (st.k === 'line' || st.k === 'arrow') st.p = pts;
        else st.p = st.p.concat(pts).slice(-CV_PTS);
        if (st.p.length && nm) {
          tips[who] = { n: nm, c: st.c, x: st.p[st.p.length - 1][0],
                        y: st.p[st.p.length - 1][1], at: Date.now() };
        }
      } else if (m.t === 'dx') {
        var kill = {};
        (m.ids || []).forEach(function (x) { kill[String(x)] = 1; });
        strokes = strokes.filter(function (x) { return !kill[x.id]; });
      } else if (m.t === 'dc') {
        // ОЧИСТКА БЫВАЕТ ДВУХ РОДОВ, И ЭТО РАЗНЫЕ ПРАВА. Свои штрихи человек убирает
        // молча; ЧУЖИЕ - только явной кнопкой, и она НАЗЫВАЕТ, кто это сделал: стёртая
        // без объяснения чужая работа читается как сбой.
        if (m.all) {
          strokes = [];
          // ПОДПИСИ ЧУЖИХ КУРСОРОВ ЖИВУТ ОТДЕЛЬНО ОТ ШТРИХОВ, и «очистить» обязано снести
          // и их: имя, висящее над пустой доской, читается как недостёртый штрих. Поймано
          // пробой - после очистки на холсте оставались непрозрачные пиксели.
          tips = {};
          if (nm) popup(nm + '  🧹 очистил доску');
        } else {
          strokes = strokes.filter(function (x) { return x.id.indexOf(who + '|') !== 0; });
        }
      }
      cvDraw();
    }

    //: Отдать историю доски вошедшему позже. Кусками: у канала данных сообщение не
    //: резиновое, а сотня штрихов в одном пакете его просто не пролезет.
    //: ДЕДУП НА ПРИЁМЕ (по id штриха) делает лишние копии безвредными - поэтому отвечать
    //: могут все, у кого есть история, и договариваться о «главном» не нужно.
    function cvSendHistory() {
      var CH = 20;
      for (var i = 0; i < strokes.length; i += CH) {
        send({ t: 'dh', s: strokes.slice(i, i + CH).map(function (st) {
          return { id: st.id, k: st.k, x: st.x, p: st.p };
        }) });
      }
    }

    function flush() {
      if (!outbox) return;
      send(outbox);
      outbox = null;
    }
    function pushPts(pts) {
      if (!cur) return;
      if (!outbox) outbox = { t: 'd', id: cur.id, k: cur.k, p: [] };
      outbox.p = (cur.k === 'line' || cur.k === 'arrow') ? pts.slice() : outbox.p.concat(pts);
      if (!batchT) {
        // ПАЧКАМИ, А НЕ ПО ТОЧКЕ НА КАЖДОЕ ДВИЖЕНИЕ: палец даёт под сотню событий в
        // секунду, и по одному сообщению на каждое канал данных встанет колом.
        batchT = setTimeout(function () { batchT = null; flush(); }, CV_BATCH);
      }
    }

    function xy(e) {
      var f = cvFit();
      if (!f) return null;
      return [Math.max(0, Math.min(1, (e.clientX - f.box.left) / f.w)),
              Math.max(0, Math.min(1, (e.clientY - f.box.top) / f.h))];
    }

    var cvEl = $('draw');
    cvEl.addEventListener('pointerdown', function (e) {
      if (!drawOn) return;
      var p = xy(e);
      if (!p) return;
      e.preventDefault();
      var me = room.localParticipant.identity;
      if (tool === 'erase') {
        var kill = strokes.filter(function (st) {
          return (st.p || []).some(function (q) {
            return Math.abs(q[0] - p[0]) < 0.035 && Math.abs(q[1] - p[1]) < 0.05;
          });
        }).map(function (st) { return st.id; });
        if (!kill.length) return;
        cvApply({ t: 'dx', ids: kill }, me, '');
        send({ t: 'dx', ids: kill });
        return;
      }
      if (tool === 'text') {
        var v = '';
        try { v = (prompt('Что подписать?') || '').slice(0, 60); } catch (e2) {}
        if (!v.trim()) return;
        var tid = me + '|' + (++curId);
        var msg = { t: 'd', id: tid, k: 'text', x: v, p: [[+p[0].toFixed(4), +p[1].toFixed(4)]] };
        cvApply(msg, me, '');
        send(msg);
        return;
      }
      cur = { id: me + '|' + (++curId), k: tool, p: [p] };
      cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(p)] }, me, '');
      pushPts([rd(p)]);
      try { cvEl.setPointerCapture(e.pointerId); } catch (e3) {}
    });
    function rd(p) { return [+p[0].toFixed(4), +p[1].toFixed(4)]; }
    cvEl.addEventListener('pointermove', function (e) {
      if (!drawOn || !cur) return;
      var p = xy(e);
      if (!p) return;
      e.preventDefault();
      var me = room.localParticipant.identity;
      if (cur.k === 'line' || cur.k === 'arrow') {
        cur.p = [cur.p[0], p];
        cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(cur.p[0]), rd(p)] }, me, '');
        pushPts([rd(cur.p[0]), rd(p)]);
      } else {
        cur.p.push(p);
        cvApply({ t: 'd', id: cur.id, k: cur.k, p: [rd(p)] }, me, '');
        pushPts([rd(p)]);
      }
    });
    function endStroke() {
      if (!cur) return;
      cur = null;
      if (batchT) { clearTimeout(batchT); batchT = null; }
      flush();                 // ХВОСТ ПАЧКИ ДОСЫЛАЕМ СРАЗУ: иначе конец линии не доедет
    }
    cvEl.addEventListener('pointerup', endStroke);
    cvEl.addEventListener('pointercancel', endStroke);
    cvEl.addEventListener('pointerleave', endStroke);

    [['✏️', 'pen'], ['📏', 'line'], ['➡️', 'arrow'], ['🔤', 'text'], ['🧽', 'erase']]
      .forEach(function (p) {
        var b = document.createElement('button');
        b.className = 'chip'; b.textContent = p[0]; b.dataset.k = p[1];
        b.onclick = function () {
          // ТАП ПО АКТИВНОМУ ИНСТРУМЕНТУ ВЫКЛЮЧАЕТ РИСОВАНИЕ. Без этого выйти из режима
          // рисования было бы нечем, а холст ловит тапы и не пускает их к графику.
          if (drawOn && tool === p[1]) { drawOn = false; } else { drawOn = true; tool = p[1]; }
          paintTools();
        };
        $('tools2').appendChild(b);
      });
    var bMine = document.createElement('button');
    bMine.className = 'chip'; bMine.textContent = '↩️ Моё';
    bMine.onclick = function () {
      var me = room.localParticipant.identity;
      cvApply({ t: 'dc', all: false }, me, '');
      send({ t: 'dc', all: false });
    };
    $('tools2').appendChild(bMine);
    var bAll = document.createElement('button');
    bAll.className = 'chip'; bAll.textContent = '🧹 Всё';
    bAll.onclick = function () {
      cvApply({ t: 'dc', all: true }, room.localParticipant.identity, '');
      send({ t: 'dc', all: true });
      popup('Ты  🧹 очистил доску');
    };
    $('tools2').appendChild(bAll);

    function paintTools() {
      [].slice.call($('tools2').children).forEach(function (b) {
        b.classList.toggle('on', !!b.dataset.k && drawOn && b.dataset.k === tool);
      });
      $('draw').classList.toggle('on', drawOn);
      $('drawhint').textContent = drawOn
        ? 'Рисуешь. Тап по тому же инструменту - выйти и вернуть график под палец.'
        : 'Рисуют все сразу, каждый своим цветом. Доска живёт и без графика: под ней '
          + 'можно ничего не открывать.';
    }
    paintTools();
    window.addEventListener('resize', cvDraw);

    // ═══ ЗАМОК АДМИНА: ПАНЕЛЬ УБИРАЕТСЯ У ВСЕХ, А НЕ ПРОСТО ЗАКРЫВАЕТСЯ У СЕБЯ ═══
    // Кнопка, которая после замка молча ничего не делает, читается как поломка (закон
    // №36): вместо неё стоит СТРОКА с причиной. Админу кнопка остаётся - он и отпирает.
    lockPaint = function () {
      var b = $('chart');
      var off = lockOn && !iAmAdm;
      b.style.display = off ? 'none' : '';
      $('lockwhy').textContent = lockOn
        ? ('Доску и график убрал админ комнаты.'
           + (iAmAdm ? ' Вернуть - кнопкой в админском блоке.' : ''))
        : '';
      if (lockOn && chOpen) { chOpen = false; chartPaint(); }
    };
    lockPaint();

    $('chart').onclick = function () {
      chOpen = !chOpen;
      chartPaint();
      // ОТКРЫЛИ ПУСТУЮ ПАНЕЛЬ - СПРАШИВАЕМ У КОМНАТЫ, ЧТО ТАМ УЖЕ ЕСТЬ. Сердцебиение
      // догонит и само, но ждать до пяти секунд перед пустым экраном человек прочитает
      // как «не работает».
      if (chOpen && !chSym) send({ t: 'ask' });
    };

    // ═══ ОЧЕРЕДЬ ВОПРОСОВ И ГОЛОСОВАНИЕ: КАНАЛОМ ДАННЫХ, КАК РУКА И ТАЙМЕР ═══
    // ВЕДУЩЕГО В КОМНАТЕ НЕТ, И ЗАВОДИТЬ ЕГО РАДИ ЭТИХ ДВУХ КАРТОЧЕК Я НЕ СТАЛ. Порядок
    // вопросов задают ГОЛОСА, а не тот, кто громче; голосование открывает любой, и рядом
    // написано, кто. Это та же граница, что у «заглушить всех»: просьба, а не приказ.
    var ama = [];           // [{id, who, nm, x, v:{identity:1}, done:0, ts}]
    var poll = null;        // {id, q, mkt, by, v:{identity:'y'|'n'|'a'}}
    var AMA_MAX = 40;

    function amaSort() {
      // ГОЛОСА, ПОТОМ ВРЕМЯ. Отвеченные уходят вниз: очередь отвечает на вопрос «кто
      // следующий», а не «что тут было».
      ama.sort(function (a, b) {
        if (!!a.done !== !!b.done) return a.done ? 1 : -1;
        var d = Object.keys(b.v || {}).length - Object.keys(a.v || {}).length;
        return d || (a.ts - b.ts);
      });
    }

    function amaPaint() {
      amaSort();
      var box = $('amalist');
      box.innerHTML = '';
      var me = room.localParticipant.identity;
      ama.forEach(function (q, i) {
        var row = document.createElement('div');
        row.className = 'q' + (q.done ? ' done' : '');
        var n = document.createElement('div');
        n.className = 'qn';
        n.textContent = q.done ? '✓' : (i + 1) + '.';
        var t = document.createElement('div');
