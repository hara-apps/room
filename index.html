<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Харма · Комнаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Lora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.7.2/dist/livekit-client.umd.min.js"></script>
<style>
  /* ═══ ХАРМА · КОМНАТЫ: ВСЯ ПАЛИТРА ТОКЕНАМИ, НИ ОДНОГО ЦВЕТА В ПРАВИЛАХ ═══
     ПОЧЕМУ ТЁМНАЯ ИНВЕРСИЯ, А НЕ СВЕТЛЫЙ МОК: под видео светлый фон не годится - плитки
     на нём читаются дырами, а час созвона на светлом утомляет глаза. Значит берём ТУ ЖЕ
     лавандовую гамму, но тёмной стороной; светлая остаётся выбором человека (ниже).
     ЗАЧЕМ ТОКЕНЫ ВООБЩЕ: до этой правки в файле жили 34 зашитых цвета мимо шести
     переменных - и `#3a7afe` (акцент, самый частый) не был среди них ВОВСЕ. Тема,
     собранная из литералов по местам, не переключается ни одним способом. */
  :root {
    --grad-a:#1c1233; --grad-b:#2e1065;      /* мягкий градиент фона, 160deg */
    --bg:#1c1233;                            /* сплошной фон под градиентом */
    --fg:#ffffff;                            /* основной текст */
    --mut:#b8a8d4;                           /* второстепенный */
    --card:rgba(255,255,255,.04);            /* плитка */
    --line:rgba(139,92,246,.22);             /* её граница */
    /* ═══ ЗАЛИВКА И ОБВОДКА - РАЗНЫЕ ТОКЕНЫ, И ЭТО СЧИТАЛОСЬ, А НЕ КАЗАЛОСЬ ═══
       Фирменный #8b5cf6 хорош ЛИНИЕЙ (обводка плитки, полоса, кот): на фоне он даёт
       3.6-4.2:1 при пороге 3:1 для нетекстовых элементов - проходит. А белым ТЕКСТОМ на
       нём выходит 4.23:1 при пороге 4.5:1 для обычного текста - НЕ проходит, и подписи
       кнопок у нас именно обычный текст (13-15px). Поэтому под заливку берётся тон
       глубже: #7c3aed даёт белому 5.70:1 и остаётся тем же фиолетовым. Один токен на обе
       роли означал бы либо блёклую линию, либо нечитаемую кнопку. */
    --acc:#7c3aed;                           /* ЗАЛИВКА кнопки: белый на ней 5.70:1 */
    --acc-line:#8b5cf6;                      /* ЛИНИЯ: обводка, полоса, кот */
    --acc-h:#a78bfa;                         /* подсветка и текст: 5.6-6.5:1 на тёмном */
    --ok:#10b981;                            /* говорит - обводкой плитки */
    --bad:#ec4899;                           /* идёт запись - точкой и заливкой */
    --bad-ink:#f472b6;                       /* тот же смысл ТЕКСТОМ: 5.75:1 */
    --soft:rgba(255,255,255,.07);            /* спокойная кнопка */
    --soft-2:rgba(255,255,255,.12);          /* выключенная */
    --ink-on-acc:#ffffff;                    /* текст на акценте */
    --veil:rgba(0,0,0,.55);                  /* подпись поверх видео */
    --bar-bg:rgba(28,18,51,.92);             /* нижняя полоса */
    --warm:#fbbf24;                          /* рука */
    --cool:#a78bfa;                          /* таймер */
    --shadow:rgba(0,0,0,.35);
    /* ═══ ШЕСТЬ ОКРАСОВ КОТА - ТОКЕНАМИ, А НЕ ЛИТЕРАЛАМИ В КОДЕ ═══
       Кот теперь АВАТАР участника: он рисуется у имени и обязан читаться на ОБЕИХ темах.
       Числа посчитаны, а не подобраны на глаз (порог 3:1 для нетекстового):
       сирень 6.52, мята 11.99, песок 10.63, роза 6.70, небо 6.98, дым 11.95. */
    --cat-1:#a78bfa; --cat-2:#5eead4; --cat-3:#fbbf24;
    --cat-4:#f472b6; --cat-5:#60a5fa; --cat-6:#cbd5e1;
    --h-font:Fraunces,Georgia,"Times New Roman",serif;
    --t-font:Lora,Georgia,"Times New Roman",serif;
    --m-font:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  /* СВЕТЛАЯ - ТЕ ЖЕ ТОКЕНЫ, ДРУГИЕ ЗНАЧЕНИЯ. Ни одного отдельного правила: разойдись
     они, светлая тема отставала бы от тёмной на каждой правке (закон №40). */
  :root[data-theme="light"] {
    --grad-a:#faf7ff; --grad-b:#f3edfa;
    --bg:#faf7ff; --fg:#2e1065; --mut:#6b5b8a;
    --card:rgba(46,16,101,.045); --line:rgba(139,92,246,.28);
    --soft:rgba(46,16,101,.07); --soft-2:rgba(46,16,101,.13);
    --veil:rgba(46,16,101,.62); --bar-bg:rgba(250,247,255,.94);
    /* НА СВЕТЛОМ ТЕ ЖЕ РОЛИ ТРЕБУЮТ ДРУГИХ ЧИСЕЛ: #ec4899 текстом даёт здесь 3.07:1,
       #b45309 - 4.38:1, оба ниже порога. Считано, а не подобрано на глаз. */
    /* «ГОВОРИТ» - ОБВОДКА, И НА СВЕТЛОМ ФОНЕ ЯРКИЙ #10b981 ДАЁТ 2.21:1 при пороге 3:1
       для нетекстовых элементов: обводку было бы просто не видно. Тот же смысл, другое
       число - #059669 (3.28:1). Это ровно то, ради чего контраст СЧИТАЮТ, а не смотрят:
       на тёмном фоне первый выглядел отлично и молча ломался на светлом. */
    --ok:#059669;                            /* 3.28:1 на светлом */
    --bad-ink:#9d174d;                       /* 6.87:1 */
    --warm:#92400e;                          /* 6.18:1 */
    --cool:#6d28d9;                          /* 6.19:1 */
    --shadow:rgba(46,16,101,.12);
    /* ТЕ ЖЕ ШЕСТЬ ОКРАСОВ, ДРУГИЕ ЧИСЛА: на светлом ярко-мятный даёт 1.5:1 - кота просто
       не было бы видно. Контраст против #faf7ff: 5.38 / 5.16 / 4.74 / 5.70 / 6.32 / 7.15. */
    --cat-1:#7c3aed; --cat-2:#0f766e; --cat-3:#b45309;
    --cat-4:#be185d; --cat-5:#1d4ed8; --cat-6:#475569;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* ГРАДИЕНТ ЖИВЁТ НА BODY И ЗАКРЕПЛЁН: `fixed` не даёт ему прокручиваться вместе со
     списком - иначе на длинной комнате низ экрана оказывается другого цвета, чем верх.
     СПЛОШНОЙ `--bg` ПОД НИМ ОБЯЗАТЕЛЕН: градиент рисуется на своей области, а за её
     пределами (резинка прокрутки на iOS) виден именно он. */
  body { margin:0; padding:16px 14px 90px; color:var(--fg);
         background:var(--bg);
         background-image:linear-gradient(160deg, var(--grad-a) 0%, var(--grad-b) 100%);
         background-attachment:fixed;
         font:15px/1.5 var(--t-font); }
  /* ШРИФТ - ПРОСЬБА, А НЕ УСЛОВИЕ РАБОТЫ. Google Fonts может не доехать (сеть, блокировка,
     вебвью без доступа), и тогда страница обязана остаться читаемой: у каждого семейства
     системный запасной в самом токене. */
  h1 { font-size:19px; margin:0 0 2px; font-family:var(--h-font); font-weight:600;
       letter-spacing:.2px; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 14px; }
  .room { color:var(--mut); font-size:13px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:10px 12px; margin:10px 0; }
  .p { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--soft-2); flex:0 0 auto; }
  .dot.on { background:var(--ok); box-shadow:0 0 0 4px rgba(16,185,129,.20); }
  .nm { flex:1; font-size:14px; }
  /* ВТОРАЯ СТРОКА ОБЯЗАНА БЫТЬ ВТОРОЙ: без `pre-line` перенос схлопнулся бы в пробел,
     и подробности слиплись бы с сутью - ровно та стена текста, которую убираем. */
  .me { color:var(--mut); font-size:12px; white-space:pre-line; }
  /* ═══ ПОЛЗУНОК - ОТДЕЛЬНАЯ СТРОКА НА ВСЮ ШИРИНУ, ПОДПИСЬ НАД НИМ ═══
     ЖИВОЙ ОТКАЗ REN (скриншот дважды): «при 10% шкала слева, при 300% справа, трек
     уезжает из-под пальца». Причина не в самом ползунке, а в СОСЕДЕ: подпись и трек
     стояли в одной строке, а длина подписи меняется вместе со значением («Громкость
     голосов: 10%» против «...300% (усиление - если собеседника еле слышно)»). Строка
     переливалась, и трек ездил вместе с ней - то есть ловить пальцем приходилось
     движущуюся мишень. Лечится не отступами, а СТРУКТУРОЙ: подпись своей строкой,
     трек своей и во всю ширину, ширина не зависит от текста НИКАК. */
  .volrow { margin:6px 0 2px; }
  .volrow label { display:block; margin:0 0 4px; }
  .volrow input[type=range] {
    display:block; width:100%; margin:0; box-sizing:border-box;
    /* ПАЛЕЦ ТОЛЩЕ КУРСОРА: тонкий трек на телефоне ловится через раз. */
    height:26px; accent-color:var(--acc); }
  /* ═══ ЗАГОЛОВОК РАЗДЕЛА - ЭТО ЗАГОЛОВОК, А НЕ СЕРЫЙ ТЕКСТ НА ПЛАШКЕ ═══
     Живой отзыв Ren 30.08: строка «Ты админ комнаты» читалась «серой плашкой во всю
     ширину, как выделенный мышью текст». Фон при этом был из палитры (`--card`), а
     ошибка - в РОЛИ: мелкий приглушённый текст, занимающий всю ширину карточки, и есть
     ровно то, как браузер рисует выделение. Заголовку нужен вес и цвет, а карточке -
     признак раздела слева, чтобы блок читался как секция, а не как выделенный кусок. */
  .hd { margin:0 0 8px; font-family:var(--h-font); font-size:13px; font-weight:600;
        letter-spacing:.01em; color:var(--cool); }
  #admin { border-left:3px solid var(--acc-line); }
  /* ИМЯ КОМНАТЫ И ЦИФРЫ - МОНОШИРИННЫМ: их СЧИТЫВАЮТ и переносят, а не читают. */
  code, .mono { font-family:var(--m-font); font-size:.92em; }
  /* НИЖНЯЯ ПОЛОСА - ЭТО ТО, ЧЕМ ПОЛЬЗУЮТСЯ В КАЖДОМ СОЗВОНЕ, и её кнопок стало шесть.
     Подписи ужимаются до иконки на узком экране: «🎙 Микрофон» в 320 px рядом с пятью
     соседями превращается в многоточие, а иконка читается всегда. */
  #bar { position:fixed; left:0; right:0; bottom:0; padding:10px 10px calc(10px + env(safe-area-inset-bottom));
         background:var(--bar-bg); backdrop-filter:blur(10px); display:flex; gap:6px; }
  button { flex:1; padding:14px; font-size:15px; font-weight:600; border:0; border-radius:12px;
           background:var(--acc); color:var(--ink-on-acc); }
  /* НЕЙТРАЛЬНАЯ ПО УМОЛЧАНИЮ, СИНЯЯ - КОГДА ВКЛЮЧЕНА. Шесть одинаково ярких кнопок
     читаются как экран, где всё одинаково важно, то есть где ничего не важно. */
  #bar button { padding:12px 6px; font-size:13px; overflow:hidden; white-space:nowrap;
                text-overflow:clip; background:var(--soft); color:var(--fg); }
  #bar button.on { background:var(--acc); color:var(--ink-on-acc); }
  @media (max-width: 420px) { #bar button .lbl { display:none; } }
  button.off { background:var(--soft-2); color:var(--fg); }
  button.leave { background:rgba(236,72,153,.18); color:var(--bad-ink); flex:0 0 22%; }
  button:active { opacity:.85; }
  #state { font-size:13px; color:var(--mut); margin:8px 0 0; }
  button.wide { width:100%; margin:6px 0; background:var(--soft); color:var(--fg);
                font-weight:500; font-size:14px; }
  button.wide.on { background:var(--acc); color:var(--ink-on-acc); }
  /* РАСКЛАДКИ ВИДЕО. «Авто» - одно видео во всю ширину, два и больше - сетка; «крупно» -
     говорящий большой, остальные лентой снизу. Как в Zoom и Meet устроено ЭТО, а не их
     пиксели: человек выбирает, на что смотреть, а не мирится с тем, что выбрали за него. */
  #screens { display:flex; flex-direction:column; }
  #screens .vwrap { position:relative; margin:8px 0; }
  #screens video { width:100%; display:block; border-radius:10px; background:#000; }
  /* ПЛИТКА В ЛАВАНДОВОЙ ГРАНИЦЕ, ГОВОРЯЩИЙ - ОБВОДКОЙ. Кто говорит, видно ПЕРИМЕТРОМ,
     а не подписью: взгляд ловит его боковым зрением, не читая. */
  #screens .vwrap { border-radius:12px; outline:1px solid var(--line); outline-offset:-1px; }
  #screens .vwrap.speaking { outline:2px solid var(--ok); }
  #screens .vnm { position:absolute; left:6px; bottom:6px; padding:2px 8px; font-size:12px;
                  border-radius:999px; background:var(--veil); color:#fff; }
  #screens.grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #screens.grid .vwrap { margin:0; }
  #screens.spk { display:flex; flex-direction:column; }
  #screens.spk .vwrap.big { order:0; height:var(--bigh, 46vh);
                            width:var(--bigw, 100%); margin-left:auto; margin-right:auto; }
  /* УГОЛОК ТЯНЕТ ОБА РАЗМЕРА СРАЗУ - как окно в системе. Полоса под окном умела только
     высоту, и «свободный размер» им был невыразим. */
  #vgrip { position:absolute; right:2px; bottom:2px; width:22px; height:22px;
           cursor:nwse-resize; border-radius:6px; touch-action:none; z-index:3;
           background:linear-gradient(135deg, transparent 42%, var(--line) 42%,
                      var(--line) 58%, transparent 58%);
           opacity:.85; }
  #screens.spk .vwrap.big video { height:100%; object-fit:contain; }
  #screens.spk .vwrap.small { order:2; width:34%; display:inline-block; }
  #screens.spk .strip { order:2; display:flex; gap:6px; overflow-x:auto; }
  /* ═══ СВОБОДНЫЙ ХОЛСТ: ОКНА ТАСКАЮТСЯ И ТЯНУТСЯ, КАК В СИСТЕМЕ ═══
     РАСКЛАДКА ЛОКАЛЬНАЯ - в комнату не уезжает ни байта: человек двигает СВОЙ экран и
     никого не трогает. Высота холста задана явно: у absolute-детей своей высоты нет, и
     без неё контейнер схлопнулся бы в ноль вместе со всеми окнами. */
  #screens.free { position:relative; display:block; height:var(--freeh, 62vh);
                  min-height:220px; overflow:hidden;
                  background:var(--soft); border-radius:12px; }
  #screens.free .vwrap { position:absolute; margin:0; touch-action:none; }
  #screens.free .vwrap video { width:100%; height:100%; object-fit:contain; }
  /* ЗАГОЛОВОК - ЭТО РУЧКА, И ОН ОБЯЗАН БЫТЬ ВИДЕН. Тащить за само видео нельзя: тап по
     нему это уже действие (закрепить, развернуть), и два смысла на одном жесте
     кончаются тем, что не работает ни один. */
  #screens.free .vnm { cursor:grab; top:0; left:0; right:0; bottom:auto;
                       border-radius:12px 12px 0 0; padding:4px 8px;
                       background:var(--veil); touch-action:none; }
  #screens.free .vnm:active { cursor:grabbing; }
  #screens.free .wgrip { position:absolute; right:1px; bottom:1px; width:20px; height:20px;
                         cursor:nwse-resize; touch-action:none; z-index:4; opacity:.9;
                         background:linear-gradient(135deg, transparent 42%, var(--line) 42%,
                                    var(--line) 58%, transparent 58%); }
  /* КРИПТО-ПАНЕЛЬ НА ХОЛСТЕ - ТАКОЕ ЖЕ ОКНО. Иначе «доска и график» остались бы
     единственным, что нельзя подвинуть, и холст был бы наполовину свободным. */
  #screens.free #crypto { position:absolute; margin:0; touch-action:none;
                          overflow:auto; z-index:2; }
  /* ДЕЛИТЕЛЬ - РАЗМЕР ТОЛЬКО У СЕБЯ. Он не едет в комнату ни одним байтом: человек
     подстраивает СВОЙ экран и никого не двигает. Полоса широкая нарочно - пальцем в
     четыре пикселя не попасть. */
  #vsplit { order:1; height:16px; margin:2px 0; cursor:row-resize; border-radius:8px;
            background:var(--soft); position:relative; touch-action:none; }
  #vsplit::after { content:''; position:absolute; left:50%; top:50%; width:44px; height:4px;
                   margin:-2px 0 0 -22px; border-radius:2px; background:var(--acc-h); }
  #screens .vpin { position:absolute; right:6px; top:6px; padding:2px 7px; font-size:12px;
                   line-height:18px; border-radius:8px; border:0; cursor:pointer;
                   background:var(--veil); color:#fff; }
  #screens .vwrap.pinned .vpin { background:var(--acc); color:var(--ink-on-acc); }
  /* СЛОВО У ЗАКРЕПЛЕНИЯ - ТАМ, ГДЕ ЕМУ ХВАТАЕТ МЕСТА, И ЭТО ЗАМЕР, А НЕ ВКУС.
     ЖИВОЙ ОТЗЫВ REN: «трижды не понял, что оно делает». Значок один и тот же у
     «сделать крупным» и у «снять», поэтому подпись обязана называть РЕЗУЛЬТАТ ТАПА -
     то же правило, что у развёртки. Но плитка в полосе это 34% ширины (на 320px
     экране ~109px), а кнопка со словом занимает ~75px при отступе 44px справа - она
     вылезла бы за край соседа. Поэтому слово стоит на ЛЮБОЙ плитке, кроме узкой
     полосы: в сетке (там кнопка и появляется впервые) и на крупном окне место есть,
     а в полосе остаётся значок и `title`. */
  #screens .vpin .vpw { display:none; }
  #screens .vwrap:not(.small) .vpin .vpw { display:inline; margin-left:4px; }
  /* ═══ ВО ВЕСЬ ЭКРАН - ЭТО ПЛОЩАДЬ MINI APP, А НЕ ЭКРАН УСТРОЙСТВА ═══
     ТРЕБОВАНИЕ REN: «когда показывают экран или камеру, развернуть это окно на всю
     площадь Mini App». Системный Fullscreen API в вебвью Telegram доступен не везде и
     на части клиентов молча ничего не делает - а мы уже стояли на том, что «попросили»
     и «применилось» разные вещи. Своё перекрытие `position:fixed` работает ВЕЗДЕ, где
     работает сама страница, и снимается тем же тапом. */
  #screens .vwrap.vfull { position:fixed; left:0; top:0; right:0; bottom:0; width:auto;
                          height:auto; margin:0; z-index:60; border-radius:0;
                          background:#000; }
  #screens .vwrap.vfull video { width:100%; height:100%; object-fit:contain;
                                border-radius:0; }
  /* СОСЕДЕЙ НЕ ПРЯЧЕМ ПРАВИЛОМ ВИДА `body > *:not(#screens)`: оно опирается на то, где
     `#screens` лежит в разметке, и первая же перестановка обёртки спрятала бы САМО
     развёрнутое окно. Непрозрачное `fixed` во весь экран и так перекрывает всё, включая
     тапы: под ним ничего не нажать по построению. */
  #screens .vfs { position:absolute; right:6px; top:6px; padding:2px 7px; font-size:12px;
                  line-height:18px; border-radius:8px; border:0; cursor:pointer;
                  background:var(--veil); color:#fff; }
  /* ДВЕ КНОПКИ В УГЛУ НЕ НАЕЗЖАЮТ ДРУГ НА ДРУГА: закрепление уходит левее развёртки. */
  #screens .vwrap.haspin .vpin { right:44px; }
  #screens .vwrap.vfull .vfs { z-index:61; }
  /* СО СЛОВОМ КНОПКА ШИРЕ ЗНАЧКА: иначе подпись обрежется, и «Свернуть»
     превратится в ещё один непонятный символ. */
  .vwrap .vfs.wide { width:auto; padding:0 8px; font-size:12px; }
  .hand { color:var(--warm); font-size:12px; }
  .err { color:var(--bad); }
  /* ИНДИКАТОР ЗАПИСИ ВИДЕН БЕЗ ПОИСКА ГЛАЗАМИ: он про то, что разговор сохраняется, и
     прятать его среди служебных строк нельзя. Мигание - чтобы он не читался как ярлык. */
  .rec { margin:0 0 12px; padding:8px 10px; border-radius:10px;
         background:rgba(236,72,153,.16); border:1px solid rgba(236,72,153,.35);
         color:var(--bad-ink); font-size:13px; font-weight:600; }
  .rec::before { content:'⏺ '; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  /* ФИЛЬТРЫ КАТАЛОГА ЖИВУТ ВНУТРИ СВОЕЙ КАРТОЧКИ, А НЕ ОТДЕЛЬНЫМ БЛОКОМ (закон №37):
     ряд чипов, стоящий сам по себе, на первой же прокрутке уезжает под соседа, и от
     кнопок остаётся нижняя половина. */
  .chip { flex:0 0 auto; width:auto; padding:8px 12px; margin:0 6px 6px 0; font-size:13px;
          font-weight:500; background:var(--soft); color:var(--fg); border-radius:999px; }
  .chip.on { background:var(--acc); color:var(--ink-on-acc); }
  #rchips { display:flex; flex-wrap:wrap; }
  #rlist { max-height:46vh; overflow-y:auto; }
  button.station { display:flex; align-items:center; gap:10px; text-align:left; }
  button.station img { width:26px; height:26px; border-radius:6px; object-fit:cover;
                       flex:0 0 auto; background:var(--soft); }
  /* ТАЙМЕР СТОИТ ТАМ ЖЕ, ГДЕ ИНДИКАТОР ЗАПИСИ, И ПО ТОЙ ЖЕ ПРИЧИНЕ: это состояние ВСЕЙ
     комнаты, а не кнопка одного человека. Цвет другой - запись и таймер не должны
     читаться как одно и то же событие. */
  .tmr { margin:0 0 12px; padding:8px 10px; border-radius:10px;
         background:rgba(139,92,246,.14); border:1px solid var(--line);
         color:var(--cool); font-size:13px; font-weight:600; }
  .tmr.fin { background:rgba(236,72,153,.16); color:var(--bad-ink); }
  /* РЕАКЦИИ - ОДИН РЯД КРУГЛЫХ КНОПОК, А НЕ СТОЛБИК НА ВСЮ ШИРИНУ: тап по ним идёт
     посреди разговора, и семь широких кнопок отодвинули бы список людей за экран. */
  #emos, #snds, #tmrset { display:flex; flex-wrap:wrap; }
  button.emo { flex:0 0 auto; width:auto; padding:7px 11px; margin:0 6px 6px 0;
               font-size:19px; line-height:1; background:var(--soft); color:var(--fg); border-radius:999px; }
  button.snd { flex:0 0 auto; width:auto; padding:7px 11px; margin:0 6px 6px 0;
               font-size:13px; font-weight:500; background:var(--soft); color:var(--fg); border-radius:999px; }
  /* Ряд «Готово / Отмена» у своего окна ввода: ОТМЕНА ОБЯЗАТЕЛЬНА - окно, из которого
     нельзя выйти, это западня, а спрашиваем мы посреди разговора. */
  #askrow { display:flex; gap:8px; margin-top:8px; }
  #ask1 p { margin:0 0 8px; font-weight:600; }
  button.pre { flex:0 0 auto; width:auto; padding:8px 12px; margin:0 6px 6px 0;
               font-size:13px; font-weight:500; background:var(--soft); color:var(--fg); border-radius:999px; }
  /* ВСПЛЫВАЮЩИЕ РЕАКЦИИ ЖИВУТ НАД НИЖНЕЙ ПОЛОСОЙ И НЕ ЛОВЯТ ТАПЫ (`pointer-events:none`):
     иначе чужая реакция, пролетающая над кнопкой микрофона, съедала бы нажатие. */
  /* ГРАФИК И ХОЛСТ ЖИВУТ В ОДНОЙ КОРОБКЕ, И ЭТО НЕ ОФОРМЛЕНИЕ: холст рисуется ПОВЕРХ
     графика, значит его координаты обязаны считаться от ЭТОЙ коробки, а не от экрана.
     `position:relative` тут - несущая конструкция. */
  #chartbox { position:relative; width:100%; height:56vw; max-height:340px; min-height:190px;
              border-radius:10px; overflow:hidden; background:rgba(0,0,0,.25); }
  #chartbox iframe { width:100%; height:100%; border:0; display:block; }
  /* ХОЛСТ ЛОВИТ ТАПЫ ТОЛЬКО КОГДА РИСУЮТ. Иначе он накрыл бы график целиком, и
     прокрутить или увеличить свечи стало бы нельзя - мы бы сломали то, поверх чего
     рисуем. */
  /* ЯВНЫЕ 100% ОБЯЗАТЕЛЬНЫ, И ОДНОГО `inset:0` ЗДЕСЬ НЕ ХВАТАЕТ. `canvas` - ЗАМЕЩАЕМЫЙ
     элемент: при `width:auto` он берёт свой intrinsic-размер 300x150 и растянутым НЕ
     становится, в отличие от div'а с теми же правилами. Живьём это выглядело так: холст
     есть, `pointer-events:auto` стоит, а `elementFromPoint` в середине графика отдаёт
     `chartbox` - то есть рисование не работало вовсе. Чтением кода не видно, поймано
     браузерной пробой. */
  #draw { position:absolute; inset:0; width:100%; height:100%;
          touch-action:none; pointer-events:none; }
  #draw.on { pointer-events:auto; }
  #chartwho { color:var(--mut); font-size:12px; margin:6px 0 0; }
  /* ЛЕНТА СУБТИТРОВ. Прокручивается сама вниз и не растёт бесконечно: разговор идёт
     часами, а держать его целиком в DOM незачем. */
  #subs { max-height:34vh; overflow-y:auto; }
  .sl { padding:4px 0; font-size:14px; line-height:1.35; }
  .sl .who { font-weight:600; font-size:12px; }
  /* ПАРТИАЛ ПРИГЛУШЁН, ФИНАЛ - ОСНОВНЫМ ЦВЕТОМ. Страница тёмная, поэтому «чёрным» здесь
     означает «полным контрастом»: человек должен ВИДЕТЬ, что распознавание ещё идёт, а
     не гадать, всё ли это, что он сказал. */
  .sl.part { color:var(--mut); font-style:italic; }
  .sl.fin { color:var(--fg); }
  /* ПОЛЯ ВВОДА НОВЫХ КАРТОЧЕК. Свой класс, а не правило на `input` целиком: у радио
     поле уже своё и выглядит как выглядит, а перекрасить чужой экран заодно с новым -
     это правка, о которой никто не просил. */
  input.tin { width:100%; padding:11px 12px; font-size:14px; border:0; border-radius:10px;
              background:var(--soft); color:var(--fg); margin:4px 0 6px; }
  input.tin::placeholder { color:var(--mut); }
  /* ОЧЕРЕДЬ ВОПРОСОВ. Номер слева - это ПОРЯДОК, в котором до них дойдут, поэтому он
     считается по голосам, а не по времени прихода. */
  /* ДЕЙСТВИЯ НАД УЧАСТНИКОМ. Три точки справа, меню разворачивается ПОД строкой - так
     видно, к КОМУ оно относится; всплывающее поверх списка накрывало бы соседей. */
  .p .more { flex:0 0 auto; width:auto; padding:4px 9px; margin:0; font-size:15px;
             line-height:1; background:transparent; color:var(--mut); font-weight:700; }
  .pact { padding:2px 0 8px 19px; }
  .pact button { width:auto; padding:6px 10px; margin:0 6px 6px 0; font-size:12px;
                 font-weight:500; background:var(--soft); color:var(--fg); border-radius:999px; }
  .pact .me { margin:2px 0 0; }
  #amalist { max-height:38vh; overflow-y:auto; }
  .q { display:flex; align-items:flex-start; gap:8px; padding:7px 0; }
  .q .qn { flex:0 0 auto; color:var(--mut); font-size:12px; min-width:16px; padding-top:3px; }
  .q .qt { flex:1; font-size:14px; }
  .q .qw { color:var(--mut); font-size:12px; }
  .q.done .qt { color:var(--mut); text-decoration:line-through; }
  .q button { flex:0 0 auto; width:auto; padding:5px 9px; margin:0; font-size:12px;
              font-weight:600; background:var(--soft); color:var(--fg); border-radius:999px; }
  .q button.on { background:var(--acc); color:var(--ink-on-acc); }
  /* ГОЛОСОВАНИЕ: РЯД КНОПОК И РЯД ПОЛОС. Полоса отвечает на вопрос «кого больше» быстрее
     любого числа, но число рядом обязано быть - «примерно поровну» решения не принимает. */
  #pollbtns { display:flex; flex-wrap:wrap; }
  .bar { height:8px; border-radius:999px; background:var(--acc-line); min-width:2px; margin:3px 0 6px; }
  .bar.n { background:var(--bad); }
  .bar.a { background:var(--soft-2); }
  #pops { position:fixed; left:0; right:0; bottom:78px; padding:0 14px; display:flex;
          flex-direction:column; align-items:center; gap:4px; pointer-events:none; z-index:5; }
  .pop { background:var(--bar-bg); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:14px;
         max-width:92%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
         animation:rise 2.6s ease-out forwards; }
  @keyframes rise { 0% { opacity:0; transform:translateY(8px); } 12% { opacity:1; transform:none; }
                    75% { opacity:1; } 100% { opacity:0; transform:translateY(-10px); } }
  /* ═══ КОТ В УГЛУ: МАЛЕНЬКИЙ, СПОКОЙНЫЙ, ВЫКЛЮЧАЕМЫЙ ═══
     Он живёт НАД шапкой справа и не мешает ничему: полоса кнопок внизу, карточки слева.
     Мигает он РЕДКО - анимация, дёргающаяся каждую секунду, на часовом созвоне
     превращается в раздражитель, а не в характер. */
  #cat { position:absolute; top:8px; right:10px; pointer-events:none; z-index:2;
         opacity:.92; transition:opacity .3s; }
  #cat.off { display:none; }
  /* ═══ КОТ РЯДОМ С ИМЕНЕМ - ТА ЖЕ ГЕОМЕТРИЯ, ДРУГОЙ РАЗМЕР ═══
     Он не украшение списка, а способ узнать соседа с одного взгляда: имена бывают
     похожими («Ren» и «Rena»), а кот у каждого свой и не меняется между заходами. */
  .pcat { width:22px; height:22px; flex:0 0 auto; display:block; }
  .pcat.nap { opacity:.65; }
  .c-head { fill:var(--acc-line); }
  .c-ear { fill:var(--acc-h); }
  .c-eye { fill:var(--bg); animation:blink 7s infinite; }
  .c-nose { fill:var(--bg); }
  .c-wh { stroke:var(--acc-h); stroke-width:1.2; stroke-linecap:round; opacity:.7; }
  .c-tail { stroke:var(--acc-line); stroke-width:4; stroke-linecap:round; fill:none;
            transform-origin:52px 44px; animation:tail 4s ease-in-out infinite; }
  @keyframes blink { 0%,94%,100% { transform:scaleY(1); } 96% { transform:scaleY(.1); } }
  .c-eyes { transform-origin:center 32px; }
  @keyframes tail { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(-14deg); } }
  /* СОБЫТИЯ КОМНАТЫ: КОТ ОТВЕЧАЕТ КОРОТКИМ ДВИЖЕНИЕМ И ВОЗВРАЩАЕТСЯ. Класс снимается
     по `animationend`, поэтому «застрять» в подпрыгнувшем состоянии он не может. */
  #cat.hop .c-body { animation:hop .6s ease-out; }
  @keyframes hop { 0%,100% { transform:translateY(0); } 35% { transform:translateY(-7px); } }
  #cat.purr .c-body { animation:purr .8s ease-in-out; }
  @keyframes purr { 0%,100% { transform:rotate(0deg); } 30% { transform:rotate(-6deg); }
                    65% { transform:rotate(5deg); } }
  /* ТИШИНА: кот дремлет - глаза щёлочками. Это НЕ анимация, а состояние: дремать он может
     минутами, и мигающая картинка всё это время была бы шумом. */
  .nap .c-eyes { transform:scaleY(.12); }
  .nap .c-eye { animation:none; }
</style>
</head>
<body>
<!-- ═══ КОТ: СВОЙ SVG, БЕЗ КАРТИНОК И БИБЛИОТЕК ═══
     Внешняя картинка это ещё один запрос, который может не доехать (сеть, блокировка,
     кэш вебвью), и тогда в углу висит битая иконка - хуже, чем ничего. SVG едет вместе
     со страницей и рисуется всегда. Анимации - CSS: они не занимают ни главный поток,
     ни звуковой, а на созвоне это не мелочь.
     `aria-hidden` и `pointer-events:none` НАРОЧНО: это украшение, оно не должно ни
     перехватывать тапы по кнопкам под ним, ни читаться скринридером как содержимое. -->
<!-- КОТ В УГЛУ - ЭТО МОЙ КОТ, ТОТ ЖЕ, ЧТО СТОИТ У МОЕГО ИМЕНИ В СПИСКЕ. Он собирается
     КОДОМ из моего identity (см. `catSvg`), поэтому статики здесь нет: две копии одной
     геометрии разошлись бы на первой правке, и человек видел бы у себя одного кота, а
     соседи у него - другого (закон №40). -->
<div id="cat" aria-hidden="true"></div>
<h1 id="title">Харма · Комнаты</h1>
<p class="room" id="roomline"></p>
<p class="sub" id="sub">Подключаюсь…</p>
<!-- ЗВУК ЗАБЛОКИРОВАН БРАУЗЕРОМ: полоса стоит ПЕРВОЙ и во всю ширину. Человек, который
     никого не слышит, не должен её искать - он в этот момент уверен, что сломан созвон,
     а не что нужен один тап. Живой блокер (Ren 30.08): A слышит B, B не слышит A, после
     перезахода меняются местами - это ровно «кому повезло тапнуть до прихода дорожки». -->
<div id="soundbar" style="display:none">
  <button id="sound" class="wide">🔊 Включить звук</button>
  <p class="me" id="soundwhy"></p>
</div>
<p id="recbar" class="rec" style="display:none"></p>
<p id="tmrbar" class="tmr" style="display:none"></p>
<div class="card" id="people"></div>
<div id="screens"></div>
<p id="state"></p>

<!-- СУБТИТРЫ ВЫШЕ КРИПТО-ПАНЕЛИ: их читают ПОКА ГОВОРЯТ, а график открывают раз за
     созвон. Свёрнуты, пока не включены. -->
<div class="card" id="subbox" style="display:none">
  <div id="subs"></div>
  <p class="me" id="subnote"></p>
</div>

<!-- КРИПТО-ПАНЕЛЬ. Свёрнута по умолчанию: график занимает пол-экрана, а комнату
     открывают ради разговора - разворачивает тот, кому он нужен. -->
<div class="card" id="crypto" style="display:none">
  <div id="chartbox"><canvas id="draw"></canvas></div>
  <p class="me" id="chartwho"></p>
  <!-- ЧТО ПОКАЗАНО КОМНАТЕ. Ряд стоит НАД пресетами пар: сперва «что смотрим», потом
       «что именно» - иначе кнопки пар читаются как относящиеся к любому виджету. -->
  <div id="wgts"></div>
  <div id="syms"></div>
  <div id="tfs"></div>
  <div id="tools2"></div>
  <p class="me" id="drawhint"></p>
  <!-- ПОРТФЕЛЬ - ТОЛЬКО ПО ЯВНОМУ ТАПУ ЕГО ВЛАДЕЛЬЦА, И ДВЕ КНОПКИ ЗДЕСЬ НЕ ДЛЯ
       УДОБСТВА: «доли» и «доли и суммы» это два РАЗНЫХ решения о том, что человек
       показывает комнате, и выбирать за него нельзя. -->
  <div id="portbtns" style="display:none">
    <button id="portsh" class="pre">💼 Мой счёт: доли</button>
    <button id="portusd" class="pre">💼 Мой счёт: доли и суммы</button>
  </div>
</div>

<!-- ПОРТФЕЛЬ ДОКЛАДЧИКА. Появляется ТОЛЬКО после того, как человек сам его показал:
     каталога «чьи счета в комнате» нет и быть не должно. -->
<div class="card" id="port" style="display:none">
  <div id="portbox"></div>
  <p class="me" id="portnote"></p>
</div>

<!-- ГОЛОСОВАНИЕ КОМНАТЫ. Рядом с рынком Polymarket, когда он привязан: «рынок говорит
     62%, комната говорит 40%» - это и есть тот ответ, ради которого голосуют. -->
<!-- ═══ СВОЙ ВВОД ВМЕСТО `prompt` ═══
     ЖИВОЙ ОТКАЗ REN 31.08: GeckoTerminal и Polymarket не открывались ВОВСЕ - тап, и
     ничего, даже механизм отказа за 8 секунд не срабатывал. Причина ровно одна и видна
     по коду: это ЕДИНСТВЕННЫЕ два виджета с `hint`, то есть единственные, кому нужен
     адрес, - и спрашивали мы его через `window.prompt`. В вебвью Telegram он не
     показывается: возвращает null сразу, наш код читает пустую строку и МОЛЧА выходит.
     Индекс страха адреса не требует и потому работал.
     `prompt` тут не «некрасив», а НЕ РАБОТАЕТ, и лечится это своим окном - тем же, каким
     мы уже спрашиваем вопрос комнате. -->
<div class="card" id="ask1" style="display:none">
  <p id="asktitle"></p>
  <input id="askin" class="tin" type="text" maxlength="200" autocomplete="off">
  <div id="askrow">
    <button id="askok" class="pre">Готово</button>
    <button id="askno" class="pre">Отмена</button>
  </div>
</div>

<div class="card" id="poll" style="display:none">
  <p id="pollq"></p>
  <p class="me" id="pollmkt"></p>
  <div id="pollbtns"></div>
  <div id="polltal"></div>
  <input id="pq" class="tin" type="text" maxlength="140" autocomplete="off"
         placeholder="Вопрос комнате (или ссылка на рынок Polymarket)">
  <button id="pgo" class="wide">🗳 Спросить комнату</button>
  <p class="me" id="pollnote"></p>
</div>

<!-- ОЧЕРЕДЬ ВОПРОСОВ (AMA). Порядок задают голоса, а не тот, кто громче. -->
<div class="card" id="ama" style="display:none">
  <div id="amalist"></div>
  <input id="aq" class="tin" type="text" maxlength="200" autocomplete="off"
         placeholder="Твой вопрос">
  <button id="ago" class="wide">🙋 В очередь</button>
  <p class="me" id="amanote"></p>
</div>

<!-- РЕАКЦИИ ВЫШЕ СЛУЖЕБНЫХ КНОПОК: по ним тапают посреди чужой реплики, не отводя
     взгляда от списка людей, а «показать экран» ищут глазами один раз за созвон. -->
<!-- ═══ ЧАСТОЕ НА ВИДУ, РЕДКОЕ ЗА ОДНОЙ КНОПКОЙ ═══

    inp.value = val || '';

    try { inp.focus(); } catch (e) {}

  function fetchT(url, opts, ms) {
    var ac = null;
    try { ac = new AbortController(); } catch (e) { ac = null; }
    var o = {};
    for (var k in (opts || {})) if (Object.prototype.hasOwnProperty.call(opts, k)) o[k] = opts[k];

    var t = setTimeout(function () { try { if (ac) ac.abort(); } catch (e) {} }, ms || 15000);

  // по полям, - то есть, выписав «свои три флага», мы молча выкинули четвёртый. А он тут

  // чем «не трогали».

  // отбрасываются, а не роняют захват. Поэтому его отсутствие в отчёте - НЕ повод кричать.
  // ═══ ПОТОЛКИ ВИДЕО И ЗВУКА: НАШИ ЧИСЛА, И АРИФМЕТИКА СТОИТ РЯДОМ ═══
  // ПОЧЕМУ ЭТО ВООБЩЕ ВАЖНО. SFU не сжимает - он ПЕРЕСЫЛАЕТ, поэтому один показ экрана

  // ЧИСЛА ВЫВЕДЕНЫ, А НЕ ВЗЯТЫ НА ГЛАЗ:

  //
  // ПОКАЗ ЭКРАНА: БИТРЕЙТ ВЫШЕ, КАДРОВ МЕНЬШЕ. Читаемость текста держит РАЗРЕШЕНИЕ, а не

  var VID_CAM_BR = 600 * 1000, VID_CAM_FPS = 20;

  // ПОПРАВКА К ОЖИДАНИЮ, И ОНА ВАЖНА: `degradationPreference` НЕ ЗАЩИЩАЕТ ЗВУК ОТ ВИДЕО.

  // частотой. Полосу между дорожками делит распределитель браузера, и ему говорят
  // ДРУГИМ полем: `priority`/`networkPriority` у кодировки отправителя.

  // ДЕЛАЕМ ЭТО ЧЕРЕЗ НАТИВНЫЙ `RTCRtpSender`, А НЕ ЧЕРЕЗ ОПЦИЮ SDK. Набор опций у
  // livekit-client меняется от версии к версии, а `getParameters/setParameters` - это

  // «применилось» - разные утверждения, а решение о качестве связи принимают по второму.

  function senderOf(pub) {

      //: спрашиваем несколько мест и НЕ придумываем, если не нашли.
      try {
          if (!pub) return null;
          if (pub.sender && pub.sender.getParameters) return pub.sender;
          var t = pub.track;
          if (t && t.sender && t.sender.getParameters) return t.sender;
      } catch (e) {}
      return null;
  }

  async function tunePriorities() {
      //: -> строка словами. Голосу high, картинке low; у камеры жертвуем разрешением,
      //: у показа - частотой (текст обязан остаться читаемым).
      if (!room || !room.localParticipant) return '';
      var pubs = [], m = room.localParticipant.trackPublications
                      || room.localParticipant.tracks;
      if (m && m.forEach) m.forEach(function (p) { pubs.push(p); });
      var asked = 0, got = 0, notes = [];

          if (!snd || typeof snd.setParameters !== 'function') continue;
          var kind = (pub.kind || (pub.track && pub.track.kind) || '').toString();
          var isAudio = kind.indexOf('audio') >= 0;
          var isScreen = String(pub.source || '').indexOf('screen') >= 0;
          //: ЧТО ЭТО ЗА КАРТИНКА - ГОВОРИМ КОДЕКУ ПРЯМО, А НЕ НАДЕЕМСЯ, ЧТО ОН УГАДАЕТ.
          //: `contentHint` - стандартная ручка WebRTC на самой дорожке: `detail` велит
          //: беречь РЕЗКОСТЬ (жертвуя плавностью), `motion` - наоборот. Для показа экрана

          //: обратный: лицо живое, и рваная картинка хуже мягкой.
          //: СТАВИТСЯ РЯДОМ С `degradationPreference`, потому что это одно решение,
          //: сказанное в двух местах: подсказка - кодеку, предпочтение - распределителю.
          try {
              var mst = pub.track && pub.track.mediaStreamTrack;
              if (mst && 'contentHint' in mst) {

          try { pr = snd.getParameters(); } catch (e) { continue; }
          if (!pr || !pr.encodings || !pr.encodings.length) continue;
          //: `degradationPreference` живёт НА ПАРАМЕТРАХ, а не в кодировке - это частая
          //: ошибка, и поставленный не туда он молча не действует.

                                                            : 'maintain-framerate';

               + (notes.length ? ' (' + notes.join('; ') + ')' : '');
      console.log('[rtc] ' + line);
      return line;
  }

  // ═══ ЖИВЁТ НА ВЕРХНЕМ УРОВНЕ, А НЕ ВНУТРИ `go()` (закон №26 в JS) ═══

    return v.slice(0, n) + '…(обрезано, всего ' + v.length + ' симв)';

  var NS = {

             + 'значит бот и Worker живы.');

    if (m) {

               + 'сигнальном порту LiveKit не умеет, рабочий вид «wss://домен» без порта.');

  var DJ_VOL_DEFAULT = 20;              // слышно, но под разговор; убавляется ползунком

  var djSids = {};                      // sid -> 1, пока звук диджея у нас на странице

  //: ═══ БРАУЗЕР МОЖЕТ НЕ ДАТЬ ИГРАТЬ ЗВУК, И ДЕЛАЕТ ЭТО МОЛЧА ═══

  //: полные, ICE встал. Значит ломалась не публикация, а ВОСПРОИЗВЕДЕНИЕ у слушателя.

  //: причину: молчащий созвон человек читает как поломку продукта, а не как один тап.
  var SOUND_OK = true;

  function soundPaint(why) {
    var bar = document.getElementById('soundbar');

    bar.style.display = SOUND_OK ? 'none' : '';
    var w = document.getElementById('soundwhy');
    if (w) {

        : (why || 'Браузер не разрешил проигрывать звук без твоего касания - поэтому '

  //: ФАКТ, А НЕ НАМЕРЕНИЕ (закон №35): после `startAudio()` ПЕРЕСПРАШИВАЕМ у комнаты.

  async function soundStart() {
    if (!room) return false;
    try {
      if (typeof room.startAudio === 'function') await room.startAudio();
    } catch (e) {
      soundPaint('Браузер отказал: ' + String((e && e.message) || e).slice(0, 90)
                 + '. Попробуй ещё раз - тап должен быть по самой кнопке.');
      return false;
    }
    SOUND_OK = (room.canPlaybackAudio !== false);
    soundPaint();
    if (SOUND_OK) say('');
    return SOUND_OK;
  }

  //: проверить нечем, значит показать поломку на ровном месте.
  function soundCheck() {
    if (!room) return;
    var ok = (room.canPlaybackAudio !== false);
    if (ok === SOUND_OK) { soundPaint(); return; }
    SOUND_OK = ok;

    try {
      console.log('[sound] canPlaybackAudio=' + ok);
    } catch (e) {}
  }

  // ═══ ВОЗВРАТ ИЗ ФОНА: iOS УСЫПЛЯЕТ ЗВУК, И ДО ЭТОЙ ПРАВКИ МЫ НЕ СЛУШАЛИ НИЧЕГО ═══
  // ФАКТ ПО КОДУ: `visibilitychange` не встречался на странице НИ РАЗУ. А контекстов
  // Web Audio у нас ЧЕТЫРЕ, и два из них стоят прямо в пути звука:
  //   `voxCtx`  - усиление голосов. Наш же комментарий рядом говорит: включённый
  //               однажды, он остаётся ЕДИНСТВЕННОЙ дорогой звука. Уснул - человек не

  // и не помогло - показываем ту же полосу «Включить звук», которая уже есть под жест.
  // ═══ РЕЕСТР КОНТЕКСТОВ: ПЕРЕЧИСЛЯТЬ ИХ РУКОЙ В `wakeAudio` НЕЛЬЗЯ ═══
  // Часть контекстов создаётся ВНУТРИ `go()` (детектор шума), и модульная функция их
  // просто не видит - `try/catch` вокруг такого обращения превращает поломку в ТИШИНУ,
  // а не в ошибку: будильник исправно «работает» и никого не будит. Поэтому контекст
  // ЗАПИСЫВАЕТСЯ ПРИ СОЗДАНИИ, и будильник ходит по реестру, а не по памяти автора.
  var AUDIO_CTXS = [];

  function regCtx(ctx, name) {
      //: -> тот же ctx (чтобы можно было писать `var c = regCtx(new Ctx(), 'имя')`).
      try {
          if (!ctx) return ctx;
          for (var i = 0; i < AUDIO_CTXS.length; i++) {
              if (AUDIO_CTXS[i].ctx === ctx) return ctx;
          }
          AUDIO_CTXS.push({ ctx: ctx, name: name });
          try { window.__CTXS = AUDIO_CTXS.length; } catch (e) {}
      } catch (e) {}
      return ctx;

      if (!ctx) return;
      var st = '';
      try { st = String(ctx.state || ''); } catch (e) { return; }
      if (st !== 'suspended') { out.push(name + ':' + (st || '?')); return; }
      try {
          var r = ctx.resume();
          if (r && r.then) r.then(function () {}, function () {});
      } catch (e) {}
      //: ПЕРЕЧИТЫВАЕМ ЧУТЬ ПОЗЖЕ: `resume()` может разрешиться, оставив контекст спящим
      //: (у нас это уже ловилось на входе без жеста), и «позвали» тут не ответ.
      setTimeout(function () {
          var st2 = '';
          try { st2 = String(ctx.state || ''); } catch (e) {}
          console.log('[wake] ' + name + ': ' + st + ' -> ' + (st2 || '?'));
      }, 250);
      out.push(name + ':будим');
  }

  function wakeAudio(why) {
      //: -> строка словами. Одна дверь на ВСЕ контексты: разбуди мы только тот, о котором
      //: вспомнили, следующий остался бы спать, и симптом («звук рвётся после возврата»)
      //: не изменился бы - то есть правка выглядела бы сделанной и не работала.
      var out = [];
      for (var ci = 0; ci < AUDIO_CTXS.length; ci++) {

      }

      //: к нему отношения не имеют: элементы <audio> могли встать сами по себе.

      try {

          for (var i = 0; i < els.length; i++) {

      document.addEventListener('visibilitychange', function () {
          if (document.hidden) return;

      //: `pageshow` ЛОВИТ ВОЗВРАТ ИЗ BFCACHE, КОТОРОГО `visibilitychange` НЕ ДАЁТ.

      // метке «убрать весь звук радио» выполнимо даже когда реестр разошёлся с DOM.

      // Поставь человек усиление и войди кто-то следующим - тот звучал бы тише всех
      // остальных, и выглядело бы это как «регулятор действует не на всех».
      if (!isDjTrack) { try { applyVoxVolume(); } catch (e) {} }

  function detachTrack(track) {

      var sid = String(track.sid || '');

      // ЗОВЁМ И РОДНОЙ `detach` SDK, И УБИРАЕМ ИЗ DOM САМИ. Одного `detach` мало: он
      // отвязывает поток, но элемент остаётся, и браузер вправе доиграть буфер.
      try {
          (track.detach ? (track.detach() || []) : []).forEach(function (e) {
              if (e && e.remove) { e.remove(); n++; }
          });
      } catch (e) {}

          try { e.pause(); } catch (e2) {}
          try { e.srcObject = null; } catch (e2) {}
          if (e && e.remove) { e.remove(); n++; }
      });

      delete djSids[sid];
      return n;
  }

  //: СНЯТЬ ВЕСЬ ЗВУК РАДИО, СКОЛЬКО БЫ ДОРОЖЕК ОТ НЕГО НИ ОСТАЛОСЬ. Идём двумя путями и
  //: оба нужны: по реестру (знаем sid) и ПО DOM (элемент помечен `data-dj`). Второй - на
  //: случай, когда реестр разошёлся с тем, что звучит: именно этот случай четыре раза
  //: подряд и приезжал живым отказом, а «у меня всё сходится» его не ловит.
  function dropDjAudio() {
      var n = 0;
      Object.keys(djSids).forEach(function (sid) {
          (attached[sid] || []).forEach(function (e) {
              try { e.pause(); } catch (e2) {}
              try { e.srcObject = null; } catch (e2) {}
              if (e && e.remove) { e.remove(); n++; }
          });
          delete attached[sid];
          delete djSids[sid];
      });
      var left = document.querySelectorAll('audio[data-dj="1"]');
      for (var i = 0; i < left.length; i++) {
          try { left[i].pause(); } catch (e3) {}
          try { left[i].srcObject = null; } catch (e3) {}
          left[i].remove(); n++;
      }
      return n;
  }

  //: ВЫКЛЮЧИТЬ РАДИО. Провязывается там, где есть `ask`; до этого честно говорит, что
  //: не может, - а не молчит (молчание после тапа читается как «сломалось»).
  var djOff = null;
  //: АДМИНСКОЕ ДЕЙСТВИЕ НАД УЧАСТНИКОМ. Той же дорогой и по той же причине: настоящий
  //: mute/kick умеет ТОЛЬКО серверный API LiveKit, а ключ к нему есть у бота.
  var admDo = null;
  //: ПРОСЬБА К БОТУ ЧЕРЕЗ ЯЩИК. Шестой случай того же класса: `ask` живёт внутри `go()`,
  //: а кнопки раскладок стоят на верхнем уровне и звались бы до подключения. Не
  //: провязано - кнопка НАЗЫВАЕТ причину, а не молчит.
  var roomAsk = null;

  //: ═══ ОТПРАВКА В КОМНАТУ - ДВЕРЬ НАРУЖУ, А НЕ ИМЯ ИЗ ЧУЖОЙ ОБЛАСТИ (пятый случай) ═══
  //: ЖИВОЙ БЛОКЕР (Ren 30.08): «Попросить приглушиться» и «Попросить выйти» не работали
  //: ВООБЩЕ - адресату не приходило ничего, окна не всплывало. Причина не в канале и не в
  //: приёмнике: обработчик кнопки стоит в `pactBox` НА ВЕРХНЕМ УРОВНЕ, а `send` и
  //: `myLabel` объявлены ВНУТРИ `go()` - тап бросал `ReferenceError`, и он же съедал
  //: остаток обработчика. Это ПЯТЫЙ случай одного класса на этом файле (`subSticky`,
  //: `subNote`, `dropDj`, `funPaint`, теперь `send`), поэтому лечится он не переносом
  //: строки, а дверью: `go()` кладёт сюда свою отправку, верхний уровень зовёт её.
  //: НЕ ГОТОВА - ГОВОРИМ ЭТО (закон №36): молчание после тапа человек читает как поломку.
  var roomSend = null, roomLabel = null;

  function dropDj() {
      // ВЫКЛЮЧЕНИЕ РАДИО - СОСТОЯНИЕ КОМНАТЫ, А НЕ СОБЫТИЕ ПОДПИСКИ. `TrackUnsubscribed`
      // может не прийти вовсе (процесс убит, соединение оборвалось), а признак `dj` в
      // метаданных приходит ВСЕМ и ВСЕГДА - на него и опираемся.
      // СНИМАЕМ ВСЁ РАДИО, А НЕ ПОСЛЕДНЮЮ ДОРОЖКУ: см. `dropDjAudio`.
      dropDjAudio();
      djTrack = null;
      showDjVol(false);
  }

  // ═════════════════════════════════════════════════════════════════════════════
  // ГРОМКОСТЬ ГОЛОСОВ: ДО 100% - ЭЛЕМЕНТОМ, ВЫШЕ - WEB AUDIO
  // ═════════════════════════════════════════════════════════════════════════════
  //: ═══ ЧТО МЫ ПРОВЕРИЛИ ПО КОДУ, ПРЕЖДЕ ЧЕМ ДЕЛАТЬ РУЧКУ ═══
  //: (1) Воспроизведение мы НЕ ЗАНИЖАЕМ: `attachTrack` вешает элемент как есть, а
  //:     `.volume` трогает ТОЛЬКО дорожки радио (`audio[data-dj="1"]`). Голоса звучат
  //:     на 1.0 - то есть на максимуме, который вообще умеет `<audio>`.
  //: (2) RNNoise и АРУ живут на стороне ГОВОРЯЩЕГО, а не слушателя: они меняют то, что
  //:     уезжает в комнату, и «тихо у меня» ими не лечится в принципе. Зато они могут
  //:     сделать тихим ГОВОРЯЩЕГО - и это уже видно на строке звука у него.
  //: Отсюда вывод: ползунок 0..100% был бы ручкой, которая не может решить названную
  //: задачу, - он уже на потолке. Значит либо выше ста, либо ручки нет вовсе.
  //:
  //: ═══ ПОЧЕМУ УСИЛЕНИЕ ВКЛЮЧАЕТСЯ ТОЛЬКО СВЕРХ 100% ═══
  //: `createMediaElementSource` ЗАБИРАЕТ звук элемента в граф НАВСЕГДА: пока контекст
  //: не запущен, звука нет ВООБЩЕ. А в вебвью Telegram контекст без жеста человека
  //: остаётся `suspended` - это мы уже проходили на шумодаве. Значит тихий звук мы
  //: рискуем променять на ПОЛНУЮ тишину, и делать это без спроса нельзя.
  //: Ниже 100% граф не нужен вовсе (элемент умеет сам), выше - нужен, и там уже есть
  //: жест: человек ТЯНЕТ ползунок. Не завёлся - возвращаем 100% и ГОВОРИМ причину.
  var voxVol = 100, voxCtx = null, voxNodes = {}, voxWhy = '';
  try {
    var _vv = parseInt(localStorage.getItem('rtc_vox_vol'), 10);
    if (_vv >= 10 && _vv <= 300) voxVol = _vv;
  } catch (e) {}

  function voxBoost(el) {
      //: Один элемент - один узел. Повторный `createMediaElementSource` на том же
      //: элементе бросает InvalidStateError, и это не теория: перерисовка списка зовёт
      //: применение громкости на каждом обновлении.
      var key = el.__voxKey || (el.__voxKey = 'v' + Math.random().toString(36).slice(2));
      if (voxNodes[key]) return voxNodes[key];
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { voxWhy = 'браузер не умеет Web Audio'; return null; }
      try {
          if (!voxCtx) voxCtx = regCtx(new Ctx(), 'голоса');
          var srcNode = voxCtx.createMediaElementSource(el);
          var g = voxCtx.createGain();
          srcNode.connect(g); g.connect(voxCtx.destination);
          voxNodes[key] = g;
          return g;
      } catch (e) {
          voxWhy = (e && e.name) || 'усилитель не собрался';
          return null;
      }
  }

  function voxEls() {
      //: РАДИО СЮДА НЕ ВХОДИТ: у него своя шкала и свой смысл (фон под разговор).
      //: Сложи их в один регулятор - и «сделать голоса громче» подняло бы фон вместе с
      //: ними, то есть разборчивость осталась бы прежней.
      var out = [];
      var els = document.querySelectorAll('audio');
      for (var i = 0; i < els.length; i++) {
          if (els[i].dataset && els[i].dataset.dj === '1') continue;
          out.push(els[i]);
      }
      return out;
  }

  function applyVoxVolume() {
      var els = voxEls(), i;
      if (voxVol <= 100) {
          //: ГРАФ НЕ ТРОГАЕМ ВОВСЕ, пока он не нужен: включённый однажды, он остаётся
          //: единственной дорогой звука, и его сбой стал бы нашим.
          for (i = 0; i < els.length; i++) {
              try { els[i].volume = Math.max(0, Math.min(1, voxVol / 100)); } catch (e) {}
              var g0 = els[i].__voxKey && voxNodes[els[i].__voxKey];
              if (g0) { try { g0.gain.value = 1; } catch (e2) {} }
          }
          return true;
      }
      var okAny = false;
      for (i = 0; i < els.length; i++) {
          try { els[i].volume = 1; } catch (e) {}
          var g = voxBoost(els[i]);
          if (!g) continue;
          try { g.gain.value = voxVol / 100; okAny = true; } catch (e2) {}
      }
      //: КОНТЕКСТ ЗАПУСКАЕМ ЯВНО: жест у нас есть - человек тянет ползунок. Проверяем
      //: ФАКТ (`state`), а не то, что вызов вернулся: `suspended` не обрабатывает звук.
      if (voxCtx && voxCtx.state !== 'running') {
          try { voxCtx.resume(); } catch (e) {}
      }
      return okAny || !els.length;
  }

  function voxPaint() {
      var box = $('voxvol');
      if (!box) return;
      box.style.display = '';
      var sl = $('voxv');
      sl.value = String(voxVol);
      voxLab();
      sl.oninput = function () {
          voxVol = Math.max(10, Math.min(300, parseInt(sl.value, 10) || 100));
          var ok = applyVoxVolume();
          if (!ok && voxVol > 100) {
              //: НЕ СМОГЛИ УСИЛИТЬ - ВОЗВРАЩАЕМ ТО, ЧТО ТОЧНО РАБОТАЕТ, И НАЗЫВАЕМ
              //: ПРИЧИНУ. Оставить ползунок наверху при мёртвом усилителе значило бы
              //: показать человеку «300%» над неизменившимся звуком.
              voxVol = 100; sl.value = '100'; applyVoxVolume();
          }
          voxLab();
          try { localStorage.setItem('rtc_vox_vol', String(voxVol)); } catch (e) {}
      };
  }

  //: ПОКАЗЫВАЕМ СРАЗУ, А НЕ ПО СОБЫТИЮ: у ползунка радио есть повод появляться и
  //: исчезать (дорожка радио), а голоса в комнате есть ВСЕГДА - значит и регулятор
  //: обязан быть на месте до того, как человек начнёт искать, почему тихо.
  //: Разметка стоит ВЫШЕ скрипта в том же документе, поэтому элемент уже существует.
  try { voxPaint(); } catch (e) { }

  function voxLab() {
      var t = 'Громкость голосов: ' + voxVol + '%';
      if (voxVol > 100) t += ' (усиление - если собеседника еле слышно)';
      else if (voxVol < 100) t += ' (у каждого своя)';
      else t += ' (обычная; тяни вправо, если тихо)';
      if (voxWhy && voxVol <= 100) t += ' · усилитель не завёлся: ' + voxWhy;
      $('voxvlab').textContent = t;
  }

  function applyDjVolume() {
      // ГРОМКОСТЬ ТОЖЕ КО ВСЕМУ, ЧТО ЗВУЧИТ. Ползунок, двигающий одну дорожку из двух,
      // выглядит как «регулятор не работает»: человек тянет вниз, а фон остаётся.
      var did = false;
      if (djTrack && djTrack.setVolume) {
          try { djTrack.setVolume(djVol / 100); did = true; } catch (e) {}
      }
      var els = document.querySelectorAll('audio[data-dj="1"]');
      for (var i = 0; i < els.length; i++) {
          try { els[i].volume = Math.max(0, Math.min(1, djVol / 100)); did = true; } catch (e2) {}
      }
      return did;
  }

  // ═══ ШКАЛА ГРОМКОСТИ ЛОГАРИФМИЧЕСКАЯ, И НАЧИНАЕТСЯ ОНА С 0.1% ═══
  // ПЕРВЫЙ ЗАХОД (шаг 1% внизу, 5% наверху) отменён живым прогоном Ren: «даже 1% громко».
  // Это не придирка, а свойство слуха: громкость воспринимается ЛОГАРИФМИЧЕСКИ, и на
  // линейной шкале весь фоновый диапазон умещается в одно-два первых деления - то есть
  // его там нет вовсе. Тридцать делений по ~2 дБ покрывают 60 дБ: от 0.1% до 100%.
  //: позиция 0 - ВЫКЛЮЧЕНО (настоящий ноль, а не «очень тихо»);
  //: позиции 1..30 - от 0.1% до 100%, каждый шаг умножает громкость на ~1.26.
  var VOL_POS_MAX = 30;

  function volOfPos(pos) {
    pos = Math.max(0, Math.min(VOL_POS_MAX, parseInt(pos, 10) || 0));
    if (pos <= 0) return 0;
    var v = 100 * Math.pow(10, -3 * (1 - (pos - 1) / (VOL_POS_MAX - 1)));
    // ТОЧНОСТЬ ОКРУГЛЕНИЯ ЗАВИСИТ ОТ МЕСТА НА ШКАЛЕ, и это не педантизм: до десятой доли
    // первые ШЕСТЬ делений схлопывались в три одинаковых числа, и ползунок читался как
    // сломанный - двигаешь, а цифра та же. Наверху шкалы вторая цифра, наоборот, шум.
    return v < 1 ? Math.round(v * 100) / 100 : Math.round(v * 10) / 10;
  }

  function posOfVol(vol) {
    vol = Math.max(0, Math.min(100, parseFloat(vol) || 0));
    if (vol <= 0) return 0;
    var p = 1 + Math.round((Math.log(vol / 100) / Math.log(10) / 3 + 1) * (VOL_POS_MAX - 1));
    return Math.max(1, Math.min(VOL_POS_MAX, p));
  }

  //: ЧИСЛО ЧЕЛОВЕКУ: внизу шкалы десятая доля процента - значащая цифра, наверху она шум.
  function fmtVol(v) {
    if (!v) return 'выкл';
    // БЕЗ ХВОСТОВЫХ НУЛЕЙ: «0.10%» и «0.1%» это одно число, а второе читается быстрее.
    return (v < 1 ? String(Math.round(v * 100) / 100)
                  : String(Math.round(v))) + '%';
  }

  function showDjVol(on) {
      var box = $('djvol');
      if (!box) return;
      box.style.display = on ? '' : 'none';
      if (!on) return;
      var sl = $('djv');
      sl.value = String(posOfVol(djVol));
      // ПОДПИСЬ НАЗЫВАЕТ ВЫХОД, А НЕ ТОЛЬКО СОСТОЯНИЕ: человек, которому радио мешает,
      // должен видеть, что это чинится здесь же, а не выключением радио всей комнате.
      $('djvlab').textContent = 'Громкость радио: ' + fmtVol(djVol)
          + ' (у каждого своя - тяни, если мешает)';
      sl.oninput = function () {
          djVol = volOfPos(sl.value);
          $('djvlab').textContent = 'Громкость радио: ' + fmtVol(djVol)
            + ' (фоном под разговор)';
          // ПРИМЕНЯЕМ СРАЗУ, А НЕ ПО ОТПУСКАНИЮ: человек ведёт ползунок и слушает, что
          // получается, - иначе он подбирает значение вслепую.
          applyDjVolume();
          try { localStorage.setItem('rtc_dj_vol', String(djVol)); } catch (e) { }
      };
  }


  // ═══ ДВЕ РАЗНЫЕ ВЕЩИ, И ДО ЭТОЙ ПРАВКИ ОНИ БЫЛИ ОДНОЙ КНОПКОЙ ═══
  // РАСПОЗНАВАНИЕ - общее на комнату, идёт на сервере и СТОИТ ДЕНЕГ: включил один, платят
  // все. ПОКАЗ ЛЕНТЫ - личное дело каждого: кому-то текст мешает, кто-то пришёл слушать.
  // Склеенные в одну кнопку, они означали, что человек не может убрать ленту у себя, не
  // выключив распознавание ВСЕЙ комнате.
  var subShow = true;
  try {
    var _ss = localStorage.getItem('rtc_sub_show');
    if (_ss === '0') subShow = false;         // выбор переживает переоткрытие комнаты
  } catch (e) {}

  function subBoxPaint() {
    // ЛЕНТА ВИДНА, КОГДА ЕСТЬ ЧТО ПОКАЗЫВАТЬ И ЧЕЛОВЕК ЭТОГО ХОЧЕТ. Два условия, и оба
    // обязательны: распознавание выключено - показывать нечего; скрыл сам - не навязываем.
    $('subbox').style.display = (subOn && subShow) ? '' : 'none';
    var b = $('subshow');
    if (b) {
      b.style.display = subOn ? '' : 'none';
      b.classList.toggle('on', subShow);
      b.textContent = subShow ? '🙈 Скрыть ленту у себя' : '👁 Показать ленту';
    }
  }

  function subNote(txt, sticky) {
    $('subnote').textContent = txt || '';
    subSticky = !!sticky && !!txt;
    subBoxPaint();
  }

  // СОСТОЯНИЕ ЗАПИСИ ЧИТАЕТСЯ У КОМНАТЫ, А НЕ ХРАНИТСЯ У НАС. Свой флажок разошёлся бы с
  // сервером на первом же падении Egress, и кнопка предлагала бы остановить то, что уже
  // не пишется. Метаданные ставит БОТ - он же владеет записью (закон №40: одна дверь).
  var lastMeta = '';
  // КТО Я И ЧТО МНЕ РАЗРЕШЕНО - ДВА РАЗНЫХ ФАКТА. Первый знает LiveKit (identity в
  // токене), второй живёт в метаданных комнаты и ставится БОТОМ: страница о правах не
  // решает ничего, она только показывает (закон №32).
  var myIdent = '';
  var iAmAdm = false;
  //: ЗАПИСЬ ВООБЩЕ ВОЗМОЖНА (Egress ответил) - ЭТО ОТДЕЛЬНЫЙ ФАКТ ОТ ПРАВА НА НЕЁ.
  //: Схлопни их - и в комнате без Egress админ видел бы кнопку, которая не работает,
  //: а у не-админа она пропадала бы по «неверной» причине.
  var recCan = false;
  var lockOn = false;
  // ЗАМОК КАСАЕТСЯ ПАНЕЛИ, КОТОРАЯ ЖИВЁТ В ДРУГОЙ ОБЛАСТИ ВИДИМОСТИ. Крючок вместо
  // прямого вызова: showRec работает и ДО подключения, когда панели ещё нет вовсе.
  var lockPaint = function () {};
  function showRec(meta) {
    // ПОСЛЕДНЕЕ СОСТОЯНИЕ ПОМНИМ, потому что кнопка появляется ПОЗЖЕ первой отрисовки:
    // порядок строк в `go()` не должен решать, что написано на кнопке. Вошедший при
    // идущей записи видел «⏺ Записать созвон», хотя тап её ОСТАНОВИТ, - подпись врала о
    // последствии (поймано браузерным прогоном, чтением кода не видно).
    if (meta !== undefined) lastMeta = meta || '';
    var m = null;
    try { m = JSON.parse(lastMeta || '{}'); } catch (e) { m = null; }
    recOn = !!(m && m.rec);
    var bar = $('recbar');
    bar.style.display = recOn ? '' : 'none';
    if (recOn) {
      bar.textContent = 'Идёт запись созвона' + (m && m.by ? ' (включил: ' + m.by + ')' : '')
        + '. Транскрипт придёт в чат тому, кто её остановит.';
    }
    var btn = $('rec');
    //: ═══ ЗАПИСЬ - ПРАВО АДМИНА, И РЕШАЕТСЯ ЭТО ЗДЕСЬ, А НЕ ПРИ СТАРТЕ ═══
    //: Право приходит МЕТАДАННЫМИ, то есть позже первой отрисовки: реши мы один раз при
    //: входе, у админа кнопки бы не было, потому что список ещё не приехал.
    //: КНОПКУ ПРЯЧЕМ, НО ПРИЧИНУ ГОВОРИМ (закон №36): кнопка, которая ВСЕГДА отвечает
    //: «это может только админ», хуже отсутствующей, а исчезнувшая молча читается как
    //: «функции нет». Строка живёт рядом с местом, где кнопку ищут.
    //: ПРАВО ВСЁ РАВНО ПРОВЕРЯЕТ БОТ (закон №32) - здесь мы решаем только, что показывать.
    if (recCan && !maySurface()) {
      btn.style.display = 'none';
      $('recwhy').textContent = 'Записывать созвон может только админ комнаты - это '
        + 'голоса всех, кто в ней. Кнопки поэтому нет.';

    w.appendChild(v);
    // ПОДПИСЬ ОБЯЗАТЕЛЬНА У СВОЕГО ОКНА: без неё человек видит свой же экран внутри
    // своего экрана и решает, что это чужой показ (и наоборот).
    var tag = document.createElement('span');
    tag.className = 'vnm';
    tag.textContent = mine ? 'Ты · так тебя видят' : (nm || 'Участник');
    // ИМЯ ЛЕЖИТ НА САМОМ ОКНЕ: по нему отвечаем на вопрос «а кто уже показывает».
    if (!mine) w.dataset.nm = (nm || 'Участник');
    w.appendChild(tag);
    // ═══ ЗАКРЕПИТЬ - ЭТО МЕСТНОЕ РЕШЕНИЕ, А НЕ КОМАНДА КОМНАТЕ ═══
    // Кому смотреть крупно, каждый решает себе: «крупно говорящий» хорош на созвоне и
    // мешает, когда смотришь чужой экран и слушаешь автора. Ничего не рассылаем.
    var pin = document.createElement('button');
    pin.className = 'vpin';
    //: ЗНАЧОК И СЛОВО - РАЗНЫЕ УЗЛЫ: подпись правится ОДНОЙ дверью `pinLabel`, а
    //: `textContent` на всей кнопке стёр бы слово вместе со значком (ровно так уже
    //: терялась подпись у кнопок нижней полосы).
    pin.appendChild(document.createTextNode('📌'));
    var pinw = document.createElement('span');
    pinw.className = 'vpw';
    pin.appendChild(pinw);
    pin.onclick = function (ev) {
      ev.stopPropagation();
      //: КЛЮЧ СЧИТАЕТ ОДНА ДВЕРЬ (закон №40): копий этого правила было ТРИ, и после
      //: разведения своих окон по источнику они разошлись бы - закрепление экрана
      //: цеплялось бы за камеру, потому что ключ у них тут остался бы общим.
      var key = freeKey(w);
      layPin = (layPin === key || !key) ? '' : key;
      //: ЗАКРЕПЛЕНИЕ ПЕРЕВОДИТ РАСКЛАДКУ ВСЕГДА, А НЕ ТОЛЬКО ИЗ «АВТО». Стояло
      //: `layPin && layMode === 'auto'`, и у человека, выбравшего «сетку» РУКАМИ, тап по
      //: 📌 не менял НИ ОДНОГО пикселя: `layPin` записывался, а режим оставался сеткой,
      //: где крупного окна нет по построению. Это ровно та жалоба Ren («ни фиксации в
      //: рамке, ни поверх других окон»), только в состоянии, которое мы не проверяли.
      //: Человек только что сказал, ЧТО смотреть крупно - значит раскладка следует за
      //: ним, а не спорит; обратный путь есть у обоих (тот же 📌 и кнопка «Раскладка»),
      //: и реплика прямо называет, что остальные ушли полосой.
      if (layPin) layMode = 'spk';
      laySave();
      layPaint();
      //: ЖИВОЙ ОТЗЫВ REN: «нажимаешь - ничего видимого не происходит». Так и было:
      //: при ОДНОМ окне «крупно» выглядит ровно как обычный вид, и слово «закрепил»
      //: описывало то, чего человек не видит. Теперь фраза называет ПОСЛЕДСТВИЕ, а сама
      //: кнопка появляется только там, где последствие есть (см. `layPaint`).
      say(layPin
          ? ('Это окно теперь крупное, остальные - полосой снизу. Только у тебя: '
             + 'комнате ничего не ушло. Снять - тот же 📌 Снять. '
             + 'Развернуть на всю площадь - соседняя ⛶.')
          //: «КАК ОБЫЧНО» БЫЛО НЕТОЧНО: закрепление ПЕРЕВОДИТ раскладку в «крупно», а
          //: снятие её не возвращает - остаётся «крупно», где большим идёт говорящий.
          //: Это законное состояние, но назвать его надо: иначе человек, пришедший из
          //: сетки, ищет, почему сетка не вернулась, и решает, что сломано снятие.
          : ('Закрепление снял. Раскладка осталась «крупно» - большим идёт говорящий; '
             + 'сменить её кнопкой «Раскладка» в «Ещё».'));
    };
    w.appendChild(pin);
    pinLabel(w);
    // ═══ ВО ВЕСЬ ЭКРАН - ОТДЕЛЬНАЯ КНОПКА, А НЕ ВТОРОЙ СМЫСЛ У ЗАКРЕПЛЕНИЯ ═══
    // ТРЕБОВАНИЕ REN: показывают экран или камеру - надо развернуть ЭТО окно на всю
    // площадь. Закрепление отвечает на другой вопрос («кого показывать крупно, когда
    // говорят несколько»), и вешать на него второе значение значило бы получить кнопку,
    // про которую снова непонятно, что она делает.
    var fs = document.createElement('button');
    fs.className = 'vfs';
    fs.textContent = '⛶';
    fs.title = 'Развернуть окно на всю площадь';
    fs.onclick = function (ev) {
      ev.stopPropagation();
      vfsSet(w);
      //: ПЕРЕСБОРКА ПОСЛЕ ВОЗВРАТА - ОБЯЗАТЕЛЬНАЯ ПОЛОВИНА: свободный холст расставляет
      //: окна координатами, и снятое при развороте надо вернуть, а не оставить окно
      //: лежать по умолчанию сетки поверх чужих.
      layPaint();
    };
    w.appendChild(fs);
    $('screens').appendChild(w);
    vids.push({ t: track, el: w });
    layPaint();
  }

  function dropVideo(track) {
    for (var i = vids.length - 1; i >= 0; i--) {
      if (vids[i].t !== track) continue;
      try { track.detach(vids[i].el.querySelector('video')); } catch (e) {}
      vfsForget(vids[i].el);
      vids[i].el.remove();
      vids.splice(i, 1);
    }
    layPaint();
  }

  // ═══ ПЛИТКА УБИРАЕТСЯ ПО ФАКТУ МЁРТВОЙ ДОРОЖКИ, А НЕ ПО ПРИХОДУ СОБЫТИЯ ═══
  // Живой отзыв 29.08: камеру и показ экрана выключили, а тёмные плитки остались. Класс
  // тот же, что был у звука радио (Б3): источник сняли, ОКНО забыли. Событие тут не
  // опора: `LocalTrackUnpublished` приходит с `pub.track`, а к моменту его прихода SDK
  // мог уже обнулить ссылку - тогда `dropVideo(undefined)` не находит НИЧЕГО и плитка
  // живёт дальше. Ни ошибки, ни строки в консоли.
  // ПОЭТОМУ ПРОВЕРЯЕМ РЕЗУЛЬТАТ (закон №35): дорожка, чей `MediaStreamTrack` перешёл в
  // `ended`, показывать больше нечего - окно уходит независимо от того, дошло событие
  // или нет. Уборка идемпотентна и стоит один проход по списку окон.
  function sweepVideos() {
    var dead = [];
    vids.forEach(function (r) {
      var mst = null;
      try { mst = r.t && r.t.mediaStreamTrack; } catch (e) { mst = null; }
      // НЕТ `mediaStreamTrack` - НЕ ПОВОД СНОСИТЬ: у части версий SDK его нет вовсе, и
      // слепая уборка убрала бы ЖИВОЕ чужое видео. Сносим только доказанно мёртвое.
      if (mst && mst.readyState === 'ended') dead.push(r.t);
    });
    dead.forEach(dropVideo);
    return dead.length;
  }

  // ═══ МИКРОФОН: ОДНА ДВЕРЬ, И СОСТОЯНИЕ МЕНЯЕТСЯ ТОЛЬКО ПОСЛЕ УСПЕХА ═══
  // Мест, где мы дёргаем микрофон, ТРИ: кнопка внизу, адресная просьба «приглушись» и
  // общее «тишина». Во всех трёх стояло `micOn = false; try { ... } catch (e) {}` - то
  // есть подпись менялась ПЕРЕД вызовом, а отказ SDK съедался МОЛЧА. Отказ там не
  // теоретический: ровно этим путём приходит `waiting for pending publication promise
  // timed out`, если публикация ещё идёт, - и человек видел переключившуюся кнопку над
  // работающим микрофоном. Это тот же класс, что залипшая кнопка показа (закон №55:
  // обратный путь обязан быть проверен), только тише - у показа хотя бы был текст.
  // ВЕРДИКТ ПО ФАКТУ (закон №35): состояние берём у SDK после вызова, а не из намерения.
    // ═══ «silence detected on local audio track» - ЧЬЯ ЭТО ТРЕВОГА И ЛОЖНАЯ ЛИ ═══
  // ВОПРОС REN 31.08: строка горит при ИСПРАВНОМ микрофоне. Она НЕ наша - её печатает
  // сам livekit-client: после публикации он ~200 мс слушает опубликованную дорожку и,
  // не найдя ни одного ненулевого сэмпла, предупреждает. Это ПРЕДУПРЕЖДЕНИЕ, а не
  // ошибка: на звук оно не влияет, дорожка уходит как уходила.
  // ПОЧЕМУ ОНО МОЖЕТ БЫТЬ ЛОЖНЫМ ИМЕННО У НАС: публикуется дорожка ПОСЛЕ шумодава
  // (`setProcessor` подменяет её выход), а наш worklet собирает кадр RNNoise из 480
  // сэмплов при кванте WebAudio в 128 - первые кванты он копит и отдаёт тишину. Плюс
  // человек в момент публикации обычно молчит. Оба случая дают ровно эту строку.
  // СПОРИТЬ С НЕЙ НЕЛЬЗЯ, А ИЗМЕРИТЬ МОЖНО: печатаем СВОЙ уровень в ТО ЖЕ окно. Дальше
  // это не рассуждение, а два числа рядом - и следующий живой прогон отвечает сам.
  //: УРОВЕНЬ КАДРА В дБ. Наверху, потому что читателей ДВА и один из них - на верхнем
  //: уровне страницы (замер после публикации микрофона).
  function frameDbTop(an, tbuf) {
    an.getFloatTimeDomainData(tbuf);
    var s = 0;
    for (var i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i];
    var rms = Math.sqrt(s / tbuf.length);
    return rms > 1e-8 ? 20 * Math.log10(rms) : -120;
  }

  function micLevelFact() {
    try {
      var ac = actx();
      if (!ac || !room || !room.localParticipant) return;
      var pub = null;
      var pubs = room.localParticipant.trackPublications
              || room.localParticipant.tracks || new Map();
      pubs.forEach(function (p) {
        if (!pub && String(p.source || '') === 'microphone' && p.track) pub = p;
      });
      var ms = pub && pub.track && pub.track.mediaStreamTrack;
      if (!ms) return;
      var an = ac.createAnalyser();
      an.fftSize = 2048;
      var src = ac.createMediaStreamSource(new MediaStream([ms]));
      src.connect(an);
      var buf = new Float32Array(an.fftSize), peak = -120, n = 0;
      var t = setInterval(function () {
        peak = Math.max(peak, frameDbTop(an, buf));
        if (++n < 20) return;                 // ~400 мс: окно проверки SDK внутри него
        clearInterval(t);
        try { src.disconnect(); } catch (e) {}
        var proc = !!window.__PROC;
        console.log('[mic] уровень после публикации: ' + Math.round(peak)
                    + ' дБ · шумодав=' + (proc ? 'вкл' : 'выкл')
                    + ' · если SDK в это же окно написал «silence detected», а тут не -120,'
                    + ' его тревога ЛОЖНАЯ');
        try { window.__MICDB = peak; } catch (e) {}
      }, 20);
    } catch (e) {}
  }

  async function micSet(want, why) {
    if (!room) return false;
    try {
      // ═══ ТРЕТЬЯ ДВЕРЬ ПУБЛИКАЦИИ, И ОНА БЫЛА БЕЗ ПОТОЛКА (живой отказ Ren 30.08) ═══
      // «В одной сессии виден и старый текст «waiting for pending publication promise
      // timed out», и новый про 25 с» - значит путей два, и один непокрыт. Вот он:
      // `republishPromise` у SDK ОБЩИЙ НА УЧАСТНИКА, а не на источник, поэтому живая
      // камера подвешивает и микрофон тоже. Экран и камера обёрнуты сторожем, микрофон
      // не был - и висел без конца, а дойдя, отдавал сырой текст SDK человеку.
      // ОТКАЗ ПО ПОТОЛКУ - НАШ И НАЗЫВАЕТСЯ НАШИМИ СЛОВАМИ, а не чужой строкой.
      // ФЛАГИ ЗАХВАТА ПЕРЕДАЁМ ЯВНО И ЗДЕСЬ: включение после mute ПЕРЕСОЗДАЁТ дорожку,
      // и «умолчания комнаты доедут» - это рассуждение, а не гарантия (у аргумента
      // приоритет выше). Один и тот же объект на все три места, где мы просим звук.
      var _mp = want ? room.localParticipant.setMicrophoneEnabled(true, AUDIO_WANT)
                     : room.localParticipant.setMicrophoneEnabled(false);
      var _late = false;
      await Promise.race([_mp, new Promise(function (_, rej) {
        setTimeout(function () {
          _late = true;
          rej(new Error('микрофон не ответил за ' + Math.round(PUB_WAIT_MS / 1000)
                        + ' с (у клиента идёт другая публикация - экран или камера)'));
        }, PUB_WAIT_MS);
      })]);
      if (_late) return false;              // до сюда не доходим, но пусть будет явно
      if (want) micLevelFact();
    } catch (e) {
      // ОПЕРАЦИЯ ВСЁ ЕЩЁ ИДЁТ ВНУТРИ SDK, И ОНА МОЖЕТ ДОЕХАТЬ ПОЗЖЕ. Тогда кнопка обязана
      // догнать факт: молча разошедшаяся подпись хуже отказа - человек говорит в
      // выключенный микрофон, глядя на «включён». Спрашиваем У SDK, а не ставим намерение.
      try {
        if (_late && _mp) _mp.then(function () {
          try { micOn = !!room.localParticipant.isMicrophoneEnabled; } catch (e3) {}
          micPaint();
          say('Микрофон всё-таки переключился - кнопка обновлена.');
        }, function () {});
      } catch (e4) {}
      // ИСТИННОЕ СОСТОЯНИЕ СПРАШИВАЕМ У SDK, А НЕ ДОГАДЫВАЕМСЯ: у части отказов дорожка
      // всё-таки переключается, и «вернуть как было» соврало бы во второй раз.
      try { micOn = !!room.localParticipant.isMicrophoneEnabled; } catch (e2) {}
      micPaint();
      say((why ? why + ' ' : '') + 'Микрофон переключить не вышло ('
          + (e && e.message || e) + '). Кнопка показывает то, что есть на самом деле.',
          true);
      return false;
    }
    micOn = want;
    micPaint();
    // ═══ ЗАГОВОРИЛ - ЗНАЧИТ ВЕРНУЛСЯ ═══
    // Требовать за это отдельный тап значит копить забытые метки: человек включает
    // микрофон, чтобы ответить, и в этот момент «отошёл» рядом с его именем уже врёт.
    // СНИМАЕМ ТОЛЬКО ПРИ ВКЛЮЧЕНИИ И ТОЛЬКО ПОСЛЕ УСПЕХА: отказ SDK сюда не доходит.
    if (want && awayOn) awaySet(false, 'Микрофон включён - снял метку «отошёл».');
    if (why) say(why);
    try { upsert(room.localParticipant.identity, { muted: !micOn }); } catch (e) {}
    return true;
  }

  function micPaint() {
    var b = document.getElementById('mic');
    if (!b) return;
    b.className = micOn ? 'on' : 'off';
    barLabel(b, micOn ? '🎙' : '🔇', 'Микрофон');
  }

  // ═══ СВОБОДНЫЙ ХОЛСТ: ГДЕ ЛЕЖИТ КАКОЕ ОКНО ═══
  // ХРАНИМ У СЕБЯ И В ДОЛЯХ, А НЕ В ПИКСЕЛЯХ. Человек открывает комнату с ноутбука и с
  // планшета, и пиксели с одного экрана на другом кладут окно за край - вернуть его
  // будет нечем, потому что тащить станет не за что. Доли переносятся.
  var layFree = {};

  function freeLoad() {
    try {
      layFree = JSON.parse(localStorage.getItem('rtc_lay_free') || '{}') || {};
    } catch (e) { layFree = {}; }
    if (typeof layFree !== 'object' || !layFree) layFree = {};
  }

  // ═══ ИМЕНОВАННЫЕ СЛОТЫ РАСКЛАДКИ ═══
  // ЧТО ХРАНИТСЯ - ДОЛИ И РЕЖИМ, А НЕ КАРТИНКА. Слот, помнящий только координаты, при
  // загрузке в режиме «сетка» не сделал бы НИЧЕГО: доли там не применяются, и человек
  // решил бы, что слот пустой. Поэтому режим едет вместе с ними и ставится первым.
  var slotNames = [];

  function slotsPaint() {
    var box = document.getElementById('slots');
    if (!box) return;
    // КНОПОК НЕТ ТАМ, ГДЕ РАССТАВЛЯТЬ НЕЧЕМ. На мобиле свободной раскладки не бывает
    // (см. `freeOk`), и «сохранить раскладку» сохраняло бы сетку под именем - то есть
    // обещало бы то, что не выполнится.
    box.style.display = freeOk() ? '' : 'none';
    var lst = document.getElementById('slotlist');
    if (!lst) return;
    lst.innerHTML = '';
    slotNames.forEach(function (nm) {
      var b = document.createElement('button');
      b.className = 'chip'; b.textContent = '🔲 ' + nm;
      b.onclick = function () { slotLoad(nm); };
      lst.appendChild(b);
      var x = document.createElement('button');
      x.className = 'chip'; x.textContent = '✖️';
      x.title = 'Убрать «' + nm + '»';
      // ОБРАТНЫЙ ПУТЬ У КАЖДОГО СЛОТА, А НЕ ОДИН НА ВСЕ. Пять заготовок и одна кнопка
      // «стереть всё» - это не обратный ход, а другая операция.
      x.onclick = function () { slotDrop(nm); };
      lst.appendChild(x);
    });
  }

  // ПОВОРОТ ПЛАНШЕТА МЕНЯЕТ ОТВЕТ `freeOk`, И РЯД ОБЯЗАН ЗА НИМ ПОЙТИ. Посчитай мы его
  // один раз при входе - человек, повернувший устройство, остался бы либо с кнопкой,
  // которая ничего не сохранит, либо без кнопки при рабочем холсте.
  window.addEventListener('resize', function () {
    try { slotsPaint(); } catch (e) {}
  });

  function slotsFrom(res) {
    if (!res || !res.slots) return;
    slotNames = [].slice.call(res.slots).map(String);
    slotsPaint();
  }

  async function slotSave() {
    if (!roomAsk) { say('Ещё подключаюсь - слоты будут через секунду.', true); return; }
    var nm = await askText('Как назвать раскладку?', 'например «планёрка»');
    if (!nm) return;
    // ШЛЁМ ТО, ЧТО ПРАВДА СТОИТ НА ЭКРАНЕ. Собрать «как должно быть» отдельной формулой
    // значило бы завести второй ответ на вопрос «где лежат окна» (закон №40).
    var res = await roomAsk({ kind: 'rtclay', room: ROOM, act: 'lay_save', nm2: nm,
                             mode: layMode, lay: JSON.stringify(layFree) },
                            'Сохраняю раскладку…');
    slotsFrom(res);
  }

  async function slotLoad(nm) {
    if (!roomAsk) { say('Ещё подключаюсь - слоты будут через секунду.', true); return; }
    var res = await roomAsk({ kind: 'rtclay', room: ROOM, act: 'lay_load', nm2: nm },
                            'Загружаю раскладку…');
    if (!res || !res.lay) return;                 // причину бот уже назвал сам
    var lay = null;
    try { lay = JSON.parse(res.lay); } catch (e) { lay = null; }
    if (!lay || typeof lay !== 'object') {
      say('Раскладка «' + nm + '» пришла в непонятном виде - не применяю.', true);
      return;
    }
    // РЕЖИМ ПЕРВЫМ, КООРДИНАТЫ ВТОРЫМИ: иначе доли лягут в память и не применятся, и
    // тап по слоту выглядел бы как «ничего не произошло».
    if (res.mode && LAY_NAMES[res.mode]) layMode = freeOk() ? res.mode : 'grid';
    layFree = lay;
    freeSave(); laySave(); layPaint();
    say('Раскладка «' + nm + '»: окон ' + Object.keys(lay).length + '.');
  }

  async function slotDrop(nm) {
    if (!roomAsk) return;
    var res = await roomAsk({ kind: 'rtclay', room: ROOM, act: 'lay_drop', nm2: nm },
                            'Убираю раскладку…');
    slotsFrom(res);
  }

  function freeSave() {
    try { localStorage.setItem('rtc_lay_free', JSON.stringify(layFree)); } catch (e) {}
  }

  //: КЛЮЧ ОКНА. Для видео это участник (или «@me»), для крипто-панели - её имя. Ключ
  //: обязан пережить перезаход, поэтому берётся от СУЩНОСТИ, а не от порядка в списке:
  //: порядок меняется при каждом входе-выходе, и раскладка уехала бы к соседу.
  //: ═══ У СВОИХ ОКОН КЛЮЧ РАЗНЫЙ, ИНАЧЕ КАМЕРА САДИТСЯ НА ЭКРАН (живой отказ Ren 01.09)
  //: «Включил показ, потом камеру - экран исчезает с холста, хотя кнопка показывает, что
  //: он включён.» Механизм: у ОБОИХ своих окон не было `pid` (он есть только у чужих), и
  //: ключ выходил один и тот же - `@me`. На свободном холсте это значит ОДНУ сохранённую
  //: рамку на два окна: второе ложится ровно на первое и накрывает его целиком. Плитка
  //: жива, дорожка публикуется, соседи её видят - не видит только сам показывающий.
  //: ИСТОЧНИК БЕРЁМ У ДОРОЖКИ, А НЕ У ПОДПИСИ: подпись пишет человек, источник знает SDK.
  function freeKey(el) {
    if (!el) return '';
    if (el.id === 'crypto') return '@crypto';
    if (el.dataset.pid) return el.dataset.pid;
    if (el.dataset.me !== '1') return '';
    //: СТАРЫЙ КЛЮЧ `@me` СОХРАНЁН ЗА КАМЕРОЙ НАРОЧНО: у людей уже лежат сохранённые
    //: раскладки (localStorage и именованные слоты), и смени мы ключ у обоих окон -
    //: разъехалось бы то, что человек ставил руками. Камера - частый случай, она и
    //: остаётся под прежним именем; у показа ключ свой.
    return el.dataset.src === 'screen' ? '@me:screen' : '@me';
  }

  //: РАСКЛАДКА ПО УМОЛЧАНИЮ - ЛЕСЕНКОЙ, А НЕ СТОПКОЙ. Положи мы все окна в одну точку,
  //: человек увидел бы ОДНО окно и решил, что остальные пропали.
  function freeDefault(i) {
    var step = 0.06 * (i % 5);
    return { x: 0.04 + step, y: 0.04 + step, w: 0.46, h: 0.42 };
  }

  //: ОКНА ХОЛСТА = ВИДЕО + КРИПТО-ПАНЕЛЬ. Список собирается в ОДНОМ месте: разойдись
  //: он с тем, что реально лежит в контейнере, - часть окон осталась бы неподвижной, и
  //: выглядело бы это как «у меня не таскается вот это».
  function freeEls() {
    var out = [];
    vids.forEach(function (r) { out.push(r.el); });
    var cr = $('crypto');
    if (cr && cr.style.display !== 'none' && cr.parentNode === $('screens')) out.push(cr);
    return out;
  }

  //: ═══ ВЫХОД СО СВОБОДНОГО ХОЛСТА ОБЯЗАН СНЯТЬ КООРДИНАТЫ (закон №55) ═══
  //: ЖИВОЙ ОТКАЗ REN (скриншот): «свободно» -> «авто» - окна вылетают за рамку, раскладка
  //: разваливается. `freeApply` ставит окнам ИНЛАЙНОВЫЕ left/top/width/height в пикселях,
  //: а сетка и «крупно» раскладывают их своими правилами - но инлайн сильнее класса, и
  //: окна оставались стоять по старым точкам холста. Обратный путь у переключателя был
  //: наполовину: включить умел, выключить - нет.
  //: ДВЕРЬ ОДНА, ПОТОМУ ЧТО СНИМАТЬ НАДО РОВНО ТО ЖЕ, ЧТО СТАВИЛИ: две копии списка
  //: свойств разошлись бы на первой добавленной координате, и остаток снова уезжал бы.
  var FREE_PROPS = ['left', 'top', 'width', 'height'];
  function freeClear(el) {
    if (!el || !el.style) return;
    for (var i = 0; i < FREE_PROPS.length; i++) el.style.removeProperty(FREE_PROPS[i]);
  }

  function freeApply() {
    var box = $('screens');
    var W = box.clientWidth || 1, H = box.clientHeight || 1;
    freeEls().forEach(function (el, i) {
      var k = freeKey(el);
      var r = (k && layFree[k]) || freeDefault(i);
      // ПОТОЛКИ И ПОЛЫ НЕ УКРАШЕНИЕ: без нижнего окно схлопывается в ноль и тянуть его
      // станет не за что, без верхнего оно уезжает за холст и теряется целиком.
      var w = Math.max(0.12, Math.min(1, r.w || 0.46));
      var h = Math.max(0.12, Math.min(1, r.h || 0.42));
      var x = Math.max(0, Math.min(1 - w, r.x || 0));
      var y = Math.max(0, Math.min(1 - h, r.y || 0));
      el.style.left = (x * W) + 'px';
      el.style.top = (y * H) + 'px';
      el.style.width = (w * W) + 'px';
      el.style.height = (h * H) + 'px';
      freeGrip(el);
    });
  }

  //: ОДНА РУЧКА НА ОКНО. Вешаем ОДИН РАЗ и метим сам элемент: `layPaint` зовётся на
  //: каждое событие комнаты, и без метки на окне за час созвона накопились бы сотни
  //: обработчиков на одном и том же уголке.
  function freeGrip(el) {
    if (el.dataset.freewired === '1') return;
    el.dataset.freewired = '1';
    var g = document.createElement('div');
    g.className = 'wgrip';
    g.title = 'Тяни за угол - размер. Двойной тап по заголовку - вернуть окно на место';
    el.appendChild(g);
    freeDrag(g, el, 'size');
    var head = el.querySelector('.vnm');
    if (!head && el.id === 'crypto') {
      head = document.createElement('span');
      head.className = 'vnm';
      head.textContent = '📈 График и доска';
      el.insertBefore(head, el.firstChild);
    }
    if (head) {
      freeDrag(head, el, 'move');
      // ═══ ОБРАТНЫЙ ПУТЬ У КАЖДОГО ОКНА, А НЕ ТОЛЬКО У ВСЕЙ РАСКЛАДКИ (закон №55) ═══
      // «Авто» сбрасывает ВСЁ; двойной тап возвращает на место ОДНО, которое человек
      // только что уронил за край. Без него единственный выход - снести и свою работу.
      head.addEventListener('dblclick', function () {
        var k = freeKey(el);
        if (k) { delete layFree[k]; freeSave(); }
