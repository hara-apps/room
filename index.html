  // объявлено ЗДЕСЬ: `subSticky` и `subNote` внутри комнаты давали `ReferenceError` и
  // уносили полстраницы, а `dropDj` внутри комнаты просто НЕ ВЫЗЫВАЛСЯ - я даже прикрыл
  // его `typeof dropDj === 'function'`, и проверка молча возвращала false. Такой guard
  // ХУЖЕ падения: он превращает поломку в тишину, а тишина здесь означает «у нажавшего
  // радио продолжает играть». Guard снят, объявления переехали.
  // ═══════════════ ГРОМКОСТЬ РАДИО ═══════════════
  // РАДИО - ФОН ПОД РАЗГОВОР, И ЭТО ЕГО СМЫСЛ, А НЕ НАСТРОЙКА ПО ВКУСУ. Вровень с
  // голосами оно мешает ровно тому, ради чего люди собрались.
  // ПОЧЕМУ КЛИЕНТСКАЯ СТОРОНА: у LiveKit громкость чужой дорожки живёт у СЛУШАТЕЛЯ
  // (`RemoteAudioTrack.setVolume`), серверной ручки «этому участнику тише» нет вовсе - и
  // правильно, что нет: одному фон мешает, другому нет, и решать это за всех нельзя.
  var DJ_ID = 'bot-dj';                 // identity бота-диджея, тот же, что в rtc_dj.py
  // ПРОЦЕНТЫ, И ЭТО ДРОБНОЕ ЧИСЛО: у логарифмической шкалы низ начинается с 0.1%, а
  // целое там округлялось бы в ноль, то есть в «радио не играет».
  var DJ_VOL_DEFAULT = 2;               // фоном под разговор (замер Ren: 1% уже громко)
  var djTrack = null;
  var djVol = DJ_VOL_DEFAULT;
  try {
      // ВЫБОР ЧЕЛОВЕКА ПЕРЕЖИВАЕТ ПЕРЕОТКРЫТИЕ: комнату открывают по несколько раз за
      // созвон, и каждый раз двигать ползунок заново - это работа, переложенная на него.
      var _sv = localStorage.getItem('rtc_dj_vol');
      // parseFloat, А НЕ parseInt: сохранённые 0.4% иначе прочитались бы нулём, и радио
      // молча замолкало бы при каждом переоткрытии комнаты.
      if (_sv !== null && _sv !== '') {
        djVol = Math.max(0, Math.min(100, parseFloat(_sv) || 0));
      }
  } catch (e) { }

  function isDj(p) {
      return !!p && String(p.identity || '') === DJ_ID;
  }

  //: ЧТО МЫ ПРИКРЕПИЛИ К СТРАНИЦЕ, ТО МЫ ОБЯЗАНЫ И СНЯТЬ. `track.attach()` создаёт
  //: <audio>, и до этой правки он оставался в DOM НАВСЕГДА: снималась подписка, гас
  //: ползунок, а элемент продолжал жить. Живой отказ Ren (третий раз): «выключил радио -
  //: у остальных пропало, у меня играет». Осиротевший элемент - единственный механизм на
  //: клиенте, который даёт звук ПОСЛЕ того, как дорожки уже нет; заодно повторная
  //: подписка на ту же дорожку плодила ВТОРОЙ элемент, то есть двойной звук.
  var attached = {};                    // sid -> [элементы]
  //: ═══ ЧЬИХ ДОРОЖЕК МЫ ДЕРЖИМ ЗВУК ═══
  //: ЧЕТВЁРТЫЙ ЗАХОД ПРО РАДИО, И ПРИЧИНА БЫЛА В ЭТОМ. `dropDj` снимал ОДНУ запомненную
  //: дорожку (`djTrack`), а их за созвон бывает НЕСКОЛЬКО: каждая смена станции - это
  //: новый процесс, новый вход и новый sid. Порядок событий у клиентов РАЗНЫЙ, и когда
  //: `TrackSubscribed` новой приходил РАНЬШЕ `TrackUnsubscribed` старой, `djTrack` уже
  //: указывал на новую - старый элемент не снимал никто и он играл дальше. Отсюда и
  //: «у ЧАСТИ участников»: это не везение, а гонка порядка событий.
  //: ПОЭТОМУ ПОМНИМ ВСЕ ДОРОЖКИ ДИДЖЕЯ, а не последнюю.
  var djSids = {};                      // sid -> 1, пока звук диджея у нас на странице

  function attachTrack(track, isDjTrack) {
      var sid = String(track.sid || ('x' + Math.random()));
      detachTrack(track);               // второй элемент на ту же дорожку - двойной звук
      var el = track.attach();
      el.setAttribute('playsinline', '');
      el.style.display = 'none';
      // ПОМЕТКА В САМОМ ЭЛЕМЕНТЕ, А НЕ ТОЛЬКО В РЕЕСТРЕ: реестр живёт в памяти вкладки и
      // теряется при любой нашей ошибке, а элемент - это то, что РЕАЛЬНО звучит. По этой
      // метке «убрать весь звук радио» выполнимо даже когда реестр разошёлся с DOM.
      if (isDjTrack) { el.dataset.dj = '1'; djSids[sid] = 1; }
      document.body.appendChild(el);
      attached[sid] = (attached[sid] || []).concat([el]);
      return el;
  }

  function detachTrack(track) {
      if (!track) return 0;
      var sid = String(track.sid || '');
      var n = 0;
      // ЗОВЁМ И РОДНОЙ `detach` SDK, И УБИРАЕМ ИЗ DOM САМИ. Одного `detach` мало: он
      // отвязывает поток, но элемент остаётся, и браузер вправе доиграть буфер.
      try {
          (track.detach ? (track.detach() || []) : []).forEach(function (e) {
              if (e && e.remove) { e.remove(); n++; }
          });
      } catch (e) {}
      (attached[sid] || []).forEach(function (e) {
          try { e.pause(); } catch (e2) {}
          try { e.srcObject = null; } catch (e2) {}
          if (e && e.remove) { e.remove(); n++; }
      });
      delete attached[sid];
      delete djSids[sid];
      return n;
  }

  //: СНЯТЬ ВЕСЬ ЗВУК РАДИО, СКОЛЬКО БЫ ДОРОЖЕК ОТ НЕГО НИ ОСТАЛОСЬ. Идём двумя путями и
  //: оба нужны: по реестру (знаем sid) и ПО DOM (элемент помечен `data-dj`). Второй - на
  //: случай, когда реестр разошёлся с тем, что звучит: именно этот случай четыре раза
  //: подряд и приезжал живым отказом, а «у меня всё сходится» его не ловит.
  function dropDjAudio() {
      var n = 0;
      Object.keys(djSids).forEach(function (sid) {
          (attached[sid] || []).forEach(function (e) {
              try { e.pause(); } catch (e2) {}
              try { e.srcObject = null; } catch (e2) {}
              if (e && e.remove) { e.remove(); n++; }
          });
          delete attached[sid];
          delete djSids[sid];
      });
      var left = document.querySelectorAll('audio[data-dj="1"]');
      for (var i = 0; i < left.length; i++) {
          try { left[i].pause(); } catch (e3) {}
          try { left[i].srcObject = null; } catch (e3) {}
          left[i].remove(); n++;
      }
      return n;
  }

  //: ВЫКЛЮЧИТЬ РАДИО. Провязывается там, где есть `ask`; до этого честно говорит, что
  //: не может, - а не молчит (молчание после тапа читается как «сломалось»).
  var djOff = null;
  //: АДМИНСКОЕ ДЕЙСТВИЕ НАД УЧАСТНИКОМ. Той же дорогой и по той же причине: настоящий
  //: mute/kick умеет ТОЛЬКО серверный API LiveKit, а ключ к нему есть у бота.
  var admDo = null;

  function dropDj() {
      // ВЫКЛЮЧЕНИЕ РАДИО - СОСТОЯНИЕ КОМНАТЫ, А НЕ СОБЫТИЕ ПОДПИСКИ. `TrackUnsubscribed`
      // может не прийти вовсе (процесс убит, соединение оборвалось), а признак `dj` в
      // метаданных приходит ВСЕМ и ВСЕГДА - на него и опираемся.
      // СНИМАЕМ ВСЁ РАДИО, А НЕ ПОСЛЕДНЮЮ ДОРОЖКУ: см. `dropDjAudio`.
      dropDjAudio();
      djTrack = null;
      showDjVol(false);
  }

  function applyDjVolume() {
      // ГРОМКОСТЬ ТОЖЕ КО ВСЕМУ, ЧТО ЗВУЧИТ. Ползунок, двигающий одну дорожку из двух,
      // выглядит как «регулятор не работает»: человек тянет вниз, а фон остаётся.
      var did = false;
      if (djTrack && djTrack.setVolume) {
          try { djTrack.setVolume(djVol / 100); did = true; } catch (e) {}
      }
      var els = document.querySelectorAll('audio[data-dj="1"]');
      for (var i = 0; i < els.length; i++) {
          try { els[i].volume = Math.max(0, Math.min(1, djVol / 100)); did = true; } catch (e2) {}
      }
      return did;
  }

  // ═══ ШКАЛА ГРОМКОСТИ ЛОГАРИФМИЧЕСКАЯ, И НАЧИНАЕТСЯ ОНА С 0.1% ═══
  // ПЕРВЫЙ ЗАХОД (шаг 1% внизу, 5% наверху) отменён живым прогоном Ren: «даже 1% громко».
  // Это не придирка, а свойство слуха: громкость воспринимается ЛОГАРИФМИЧЕСКИ, и на
  // линейной шкале весь фоновый диапазон умещается в одно-два первых деления - то есть
  // его там нет вовсе. Тридцать делений по ~2 дБ покрывают 60 дБ: от 0.1% до 100%.
  //: позиция 0 - ВЫКЛЮЧЕНО (настоящий ноль, а не «очень тихо»);
  //: позиции 1..30 - от 0.1% до 100%, каждый шаг умножает громкость на ~1.26.
  var VOL_POS_MAX = 30;

  function volOfPos(pos) {
    pos = Math.max(0, Math.min(VOL_POS_MAX, parseInt(pos, 10) || 0));
    if (pos <= 0) return 0;
    var v = 100 * Math.pow(10, -3 * (1 - (pos - 1) / (VOL_POS_MAX - 1)));
    // ТОЧНОСТЬ ОКРУГЛЕНИЯ ЗАВИСИТ ОТ МЕСТА НА ШКАЛЕ, и это не педантизм: до десятой доли
    // первые ШЕСТЬ делений схлопывались в три одинаковых числа, и ползунок читался как
    // сломанный - двигаешь, а цифра та же. Наверху шкалы вторая цифра, наоборот, шум.
    return v < 1 ? Math.round(v * 100) / 100 : Math.round(v * 10) / 10;
  }

  function posOfVol(vol) {
    vol = Math.max(0, Math.min(100, parseFloat(vol) || 0));
    if (vol <= 0) return 0;
    var p = 1 + Math.round((Math.log(vol / 100) / Math.log(10) / 3 + 1) * (VOL_POS_MAX - 1));
    return Math.max(1, Math.min(VOL_POS_MAX, p));
  }

  //: ЧИСЛО ЧЕЛОВЕКУ: внизу шкалы десятая доля процента - значащая цифра, наверху она шум.
  function fmtVol(v) {
    if (!v) return 'выкл';
    // БЕЗ ХВОСТОВЫХ НУЛЕЙ: «0.10%» и «0.1%» это одно число, а второе читается быстрее.
    return (v < 1 ? String(Math.round(v * 100) / 100)
                  : String(Math.round(v))) + '%';
  }

  function showDjVol(on) {
      var box = $('djvol');
      if (!box) return;
      box.style.display = on ? '' : 'none';
      if (!on) return;
      var sl = $('djv');
      sl.value = String(posOfVol(djVol));
      $('djvlab').textContent = 'Громкость радио: ' + fmtVol(djVol) + ' (фоном под разговор)';
      sl.oninput = function () {
          djVol = volOfPos(sl.value);
          $('djvlab').textContent = 'Громкость радио: ' + fmtVol(djVol)
            + ' (фоном под разговор)';
          // ПРИМЕНЯЕМ СРАЗУ, А НЕ ПО ОТПУСКАНИЮ: человек ведёт ползунок и слушает, что
          // получается, - иначе он подбирает значение вслепую.
          applyDjVolume();
          try { localStorage.setItem('rtc_dj_vol', String(djVol)); } catch (e) { }
      };
  }


  // ═══ ДВЕ РАЗНЫЕ ВЕЩИ, И ДО ЭТОЙ ПРАВКИ ОНИ БЫЛИ ОДНОЙ КНОПКОЙ ═══
  // РАСПОЗНАВАНИЕ - общее на комнату, идёт на сервере и СТОИТ ДЕНЕГ: включил один, платят
  // все. ПОКАЗ ЛЕНТЫ - личное дело каждого: кому-то текст мешает, кто-то пришёл слушать.
  // Склеенные в одну кнопку, они означали, что человек не может убрать ленту у себя, не
  // выключив распознавание ВСЕЙ комнате.
  var subShow = true;
  try {
    var _ss = localStorage.getItem('rtc_sub_show');
    if (_ss === '0') subShow = false;         // выбор переживает переоткрытие комнаты
  } catch (e) {}

  function subBoxPaint() {
    // ЛЕНТА ВИДНА, КОГДА ЕСТЬ ЧТО ПОКАЗЫВАТЬ И ЧЕЛОВЕК ЭТОГО ХОЧЕТ. Два условия, и оба
    // обязательны: распознавание выключено - показывать нечего; скрыл сам - не навязываем.
    $('subbox').style.display = (subOn && subShow) ? '' : 'none';
    var b = $('subshow');
    if (b) {
      b.style.display = subOn ? '' : 'none';
      b.classList.toggle('on', subShow);
      b.textContent = subShow ? '🙈 Скрыть ленту у себя' : '👁 Показать ленту';
    }
  }

  function subNote(txt, sticky) {
    $('subnote').textContent = txt || '';
    subSticky = !!sticky && !!txt;
    subBoxPaint();
  }

  // СОСТОЯНИЕ ЗАПИСИ ЧИТАЕТСЯ У КОМНАТЫ, А НЕ ХРАНИТСЯ У НАС. Свой флажок разошёлся бы с
  // сервером на первом же падении Egress, и кнопка предлагала бы остановить то, что уже
  // не пишется. Метаданные ставит БОТ - он же владеет записью (закон №40: одна дверь).
  var lastMeta = '';
  // КТО Я И ЧТО МНЕ РАЗРЕШЕНО - ДВА РАЗНЫХ ФАКТА. Первый знает LiveKit (identity в
  // токене), второй живёт в метаданных комнаты и ставится БОТОМ: страница о правах не
  // решает ничего, она только показывает (закон №32).
  var myIdent = '';
  var iAmAdm = false;
  var lockOn = false;
  // ЗАМОК КАСАЕТСЯ ПАНЕЛИ, КОТОРАЯ ЖИВЁТ В ДРУГОЙ ОБЛАСТИ ВИДИМОСТИ. Крючок вместо
  // прямого вызова: showRec работает и ДО подключения, когда панели ещё нет вовсе.
  var lockPaint = function () {};
  function showRec(meta) {
    // ПОСЛЕДНЕЕ СОСТОЯНИЕ ПОМНИМ, потому что кнопка появляется ПОЗЖЕ первой отрисовки:
    // порядок строк в `go()` не должен решать, что написано на кнопке. Вошедший при
    // идущей записи видел «⏺ Записать созвон», хотя тап её ОСТАНОВИТ, - подпись врала о
    // последствии (поймано браузерным прогоном, чтением кода не видно).
    if (meta !== undefined) lastMeta = meta || '';
    var m = null;
    try { m = JSON.parse(lastMeta || '{}'); } catch (e) { m = null; }
    recOn = !!(m && m.rec);
    var bar = $('recbar');
    bar.style.display = recOn ? '' : 'none';
    if (recOn) {
      bar.textContent = 'Идёт запись созвона' + (m && m.by ? ' (включил: ' + m.by + ')' : '')
        + '. Транскрипт придёт в чат тому, кто её остановит.';
    }
    var btn = $('rec');
    if (btn.style.display !== 'none') {
      btn.classList.toggle('on', recOn);
      btn.textContent = recOn ? '⏹ Остановить запись' : '⏺ Записать созвон';
    }
    // РАДИО ЖИВЁТ В ТЕХ ЖЕ МЕТАДАННЫХ, И ЭТО НЕ ЭКОНОМИЯ ПОЛЯ. Признак «что играет»
    // обязан доезжать до вошедшего ПОЗЖЕ ровно так же, как признак записи: рассылка по
    // каналу данных молчала бы именно ему.
    // СУБТИТРЫ - ПРИЗНАК КОМНАТЫ, А НЕ ЛИЧНАЯ НАСТРОЙКА. Они стоят денег и генерятся
    // ОДИН РАЗ на всех, кто их видит: включил один - идут у всех, и вошедший позже
    // обязан это увидеть (рассылка по каналу данных до него не дошла бы).
    subOn = !!(m && m.subs);
    var _subBy = (m && typeof m.subs === 'string' && m.subs !== '1') ? m.subs : '';
    var sb = $('subbtn');
    if (sb.style.display !== 'none') {
      sb.classList.toggle('on', subOn);
      sb.textContent = subOn ? '⏹ Выключить распознавание' : '📝 Включить распознавание';
    }
    // ЧЕСТНО ПРО ДЕНЬГИ И ПРО ГРАНИЦУ, А НЕ МОЛЧА. Человек должен понимать, что он
    // включает общее и платное, а прячет - своё и бесплатное.
    $('subwhy').textContent = subOn
      ? ('Распознавание включено' + (_subBy ? ' (' + _subBy + ')' : '')
         + ' - платит комната. Показ ленты каждый настраивает себе.')
      : (initData ? 'Распознавание выключено. Включит любой - платит комната.'
                  : 'Распознавание включает тот, кто вошёл из Telegram.');
    subBoxPaint();
    if (subOn && !$('subs').children.length && !subSticky) {
      subNote('Слушаю. Реплики появятся здесь: серым - пока распознаётся, '
        + 'обычным - готовое.', false);
    }
    // ВЫКЛЮЧИЛИ СУБТИТРЫ - СНИМАЕМ И ЛИПКОЕ ИЗВЕСТИЕ: оно относилось к прошлому запуску,
    // и «бюджет исчерпан» над выключённой лентой отвечает не на тот вопрос.
    if (!subOn) subSticky = false;
    var _wasDj = djOn;
    djOn = !!(m && m.dj);
    // ПРИЗНАК СНЯЛИ - СНИМАЕМ И ЗВУК, НЕ ДОЖИДАЯСЬ СОБЫТИЯ ПОДПИСКИ. Именно у того, кто
    // НАЖАЛ «выключить», событие может не прийти: его страница в этот момент занята кругом
    // через ящик, а процесс на песочнице уже убит. Остальные тем временем замолкают по
    // `TrackUnsubscribed` - отсюда и «у всех пропало, у меня играет».
    if (_wasDj && !djOn) dropDj();
    var d = $('dj');
    if (d.style.display !== 'none') {
      d.classList.toggle('on', djOn);
      d.textContent = djOn ? ('⏹ Выключить радио (' + m.dj + ')') : '📻 Включить радио';
    }
    // ═══ АДМИН КОМНАТЫ: СПИСОК ЖИВЁТ В МЕТАДАННЫХ, А НЕ У НАС ═══
    // Он обязан доезжать до вошедшего ПОЗЖЕ ровно так же, как признак записи, - рассылка
    // по каналу данных молчала бы именно ему. Сравнение ТОЧНОЕ (закон №11): identity у
    // веб-гостя начинается с `web-`, и подстрочный матч однажды выдал бы ему права.
    var _adm = (m && m.adm) || [];
    iAmAdm = !!(myIdent && _adm.map(String).indexOf(String(myIdent)) >= 0);
    $('admin').style.display = iAmAdm ? '' : 'none';
    // ЗАМОК - ПЕРЕКЛЮЧАТЕЛЬ (закон №55): подпись называет РЕЗУЛЬТАТ тапа, а не имя
    // состояния, иначе запертую доску нечем отпереть и совместная работа кончается.
    var _wasLock = lockOn;
    lockOn = !!(m && m.lock);
    $('admlock').textContent = lockOn ? '🔓 Вернуть доску и график'
                                      : '🔒 Убрать доску и график';
    // ═══ КРАСИМ ВСЕГДА, А НЕ ТОЛЬКО НА СМЕНЕ ЗНАЧЕНИЯ ═══
    // Здесь стояло `if (lockOn !== _wasLock || meta === undefined)`, то есть отрисовка
    // зависела от того, совпало ли прошлое состояние с новым. Совпасть оно может по
    // множеству причин, к замку отношения не имеющих (второй клиент того же человека,
    // догон метаданных при входе, повторная доставка), и тогда экран остаётся прежним
    // при верном состоянии - ровно то, о чём отчёт 29.08: «бот сказал убрал, а доска
    // осталась». Отрисовка ничего не стоит и идемпотентна; экономия на ней покупала
    // класс багов, который нечем увидеть.
    void _wasLock;
    lockPaint();
    // ═══ ПРОСЬБА АДМИНА ПРО ШУМОДАВ: ЧИТАЕМ ЗДЕСЬ, ПРИМЕНЯЕМ В go() ═══
    // Метаданные - ЕДИНСТВЕННЫЙ канал от бота до чужого клиента (серверного «включи ему
    // шумодав» у LiveKit нет вовсе), и он же единственный, кто догоняет вошедшего позже.
    // МЕТКА ВРЕМЕНИ ОБЯЗАТЕЛЬНА, И БЕЗ НЕЁ ФИЧА РАБОТАЕТ НАОБОРОТ: эта функция вызывается
    // при КАЖДОЙ смене ЛЮБОГО соседнего признака (запись, радио, замок, субтитры), то
    // есть одна и та же просьба приезжает снова и снова. Без метки человек, выключивший
    // шумодав у себя, получал бы его обратно на первом же чужом тапе - и правило
    // «локальное побеждает» держалось бы на удаче.
    // ═══ КОМУ ЗАПРЕЩЕНЫ РЕАКЦИИ И ЗВУКИ ═══
    // Сравнение ТОЧНОЕ и по identity (закон №11): у веб-гостя оно начинается с `web-`, и
    // подстрочный матч однажды заглушил бы не того.
    funOff = {};
    ((m && m.fun) || []).forEach(function (x) { funOff[String(x)] = 1; });
    funPaint();
    var _r = (m && m.rnn) || null;
    rnnAllOn = !!(_r && _r.all && _r.on);
    var _ar = $('admrnn');
    if (_ar) {
      _ar.classList.toggle('on', rnnAllOn);
      _ar.textContent = rnnAllOn ? '🔊 Снять шумодав со всех' : '🔇 Шумодав всем';
    }
    var _aw = $('admrnnwhy');
    if (_aw) {
      _aw.textContent = rnnAllOn
        ? ('Попрошено всем включить шумодав' + (_r.by ? ' (' + _r.by + ')' : '')
           + '. Это ПРОСЬБА: делает её страница каждого, и каждый вправе выключить у себя.')
        : 'Просит всех включить свой шумодав. Выключить у себя может каждый.';
    }
    // КТО Я - МОЖЕТ БЫТЬ ЕЩЁ НЕИЗВЕСТНО: `showRec` выполняется и ДО подключения, а
    // `myIdent` появляется после него. Съесть метку в этот момент значило бы навсегда
    // потерять адресную просьбу: она числилась бы прочитанной, а исполнить её было не с
    // чем. Ничего не трогаем - сразу после подключения `showRec()` зовётся ещё раз.
    if (_r && Number(_r.ts || 0) > rnnAskTs && myIdent) {
      rnnAskTs = Number(_r.ts) || 0;
      // ПРОСЬБУ СЧИТАЕМ ПРОЧИТАННОЙ В ЛЮБОМ СЛУЧАЕ, даже чужую: иначе следующая смена
      // соседнего признака принесёт её снова и мы применим её задним числом.
      var _mine = !!(_r.all || (myIdent && String(_r.to || '') === String(myIdent)));
      // СТАРУЮ НЕ ИСПОЛНЯЕМ. Вошедший через час не должен получать шумодав по просьбе, о
      // которой все давно забыли; окно названо константой, а не подобрано на глаз.
      // ВОЗРАСТ СЧИТАЕМ В ОДНОЙ ШКАЛЕ С МЕТКОЙ. И ОТРИЦАТЕЛЬНЫЙ ВОЗРАСТ - НЕ ПОВОД
      // ОТКАЗЫВАТЬ: «просьба из будущего» означает только расхождение часов, а не то, что
      // человек её не отправлял. Отбрасывать по нему значило бы вернуть ту же молчаливую
      // поломку, только с другой стороны.
      var _age = srvNow() - (Number(_r.ts) || 0);
      var _fresh = _age <= RNN_ASK_TTL;
      if (_mine && _fresh) {
        rnnWant = { on: !!_r.on, by: String(_r.by || '') };
        if (rnnPump) rnnPump();
      }
    }
  }

  // ═══ ВИДЕО: ОДНА ДВЕРЬ НА СВОЁ И ЧУЖОЕ, И ТРИ РАСКЛАДКИ ═══
  // Своё видео человек обязан видеть тоже: иначе «что именно я показываю - ту вкладку или
  // весь экран?» можно спросить только у соседей, посреди разговора.
  //: [{t: дорожка, el: обёртка}] - помним ДОРОЖКУ, а не sid: у своей публикации sid
  //: появляется не сразу, и поиск по нему снимал бы не то (а чаще - ничего).
  var vids = [];
  var layMode = 'auto';
  var LAY_NAMES = { auto: 'авто', grid: 'сетка', spk: 'крупно' };
  // ЗАКРЕПЛЁННОЕ ОКНО И ВЫСОТА ДЕЛИТЕЛЯ - ЛИЧНЫЕ И ПЕРЕЖИВАЮТ ЗАХОД. В комнату не едет
  // ничего: подстроил себе - у соседей ни один пиксель не сдвинулся.
  var layPin = '';
  var layBigH = 0;
  try {
    layPin = localStorage.getItem('rtc_lay_pin') || '';
    layBigH = parseInt(localStorage.getItem('rtc_lay_bigh') || '0', 10) || 0;
    layMode = localStorage.getItem('rtc_lay_mode') || 'auto';
    if (!LAY_NAMES[layMode]) layMode = 'auto';
  } catch (e) {}

  function laySave() {
    try {
      localStorage.setItem('rtc_lay_pin', layPin || '');
      localStorage.setItem('rtc_lay_bigh', String(layBigH || 0));
      localStorage.setItem('rtc_lay_mode', layMode);
    } catch (e) {}
  }

  function addVideo(track, nm, mine, pid) {
    var w = document.createElement('div');
    w.className = 'vwrap';
    if (pid) w.dataset.pid = pid;
    if (mine) w.dataset.me = '1';
    var v = track.attach();
    v.setAttribute('playsinline', ''); v.muted = true; v.autoplay = true;
    w.appendChild(v);
    // ПОДПИСЬ ОБЯЗАТЕЛЬНА У СВОЕГО ОКНА: без неё человек видит свой же экран внутри
    // своего экрана и решает, что это чужой показ (и наоборот).
    var tag = document.createElement('span');
    tag.className = 'vnm';
    tag.textContent = mine ? 'Ты · так тебя видят' : (nm || 'Участник');
    // ИМЯ ЛЕЖИТ НА САМОМ ОКНЕ: по нему отвечаем на вопрос «а кто уже показывает».
    if (!mine) w.dataset.nm = (nm || 'Участник');
    w.appendChild(tag);
    // ═══ ЗАКРЕПИТЬ - ЭТО МЕСТНОЕ РЕШЕНИЕ, А НЕ КОМАНДА КОМНАТЕ ═══
    // Кому смотреть крупно, каждый решает себе: «крупно говорящий» хорош на созвоне и
    // мешает, когда смотришь чужой экран и слушаешь автора. Ничего не рассылаем.
    var pin = document.createElement('button');
    pin.className = 'vpin';
    pin.textContent = '📌';
    pin.title = 'Закрепить это окно крупно (только у тебя)';
    pin.onclick = function (ev) {
      ev.stopPropagation();
      var key = w.dataset.pid || (w.dataset.me === '1' ? '@me' : '');
      layPin = (layPin === key || !key) ? '' : key;
      if (layPin && layMode === 'auto') layMode = 'spk';
      laySave();
      layPaint();
      say(layPin ? 'Закрепил окно крупно - только у тебя. Снять: тот же 📌.'
                 : 'Закрепление снял.');
    };
    w.appendChild(pin);
    $('screens').appendChild(w);
    vids.push({ t: track, el: w });
    layPaint();
  }

  function dropVideo(track) {
    for (var i = vids.length - 1; i >= 0; i--) {
      if (vids[i].t !== track) continue;
      try { track.detach(vids[i].el.querySelector('video')); } catch (e) {}
      vids[i].el.remove();
      vids.splice(i, 1);
    }
    layPaint();
  }

  // ═══ ПЛИТКА УБИРАЕТСЯ ПО ФАКТУ МЁРТВОЙ ДОРОЖКИ, А НЕ ПО ПРИХОДУ СОБЫТИЯ ═══
  // Живой отзыв 29.08: камеру и показ экрана выключили, а тёмные плитки остались. Класс
  // тот же, что был у звука радио (Б3): источник сняли, ОКНО забыли. Событие тут не
  // опора: `LocalTrackUnpublished` приходит с `pub.track`, а к моменту его прихода SDK
  // мог уже обнулить ссылку - тогда `dropVideo(undefined)` не находит НИЧЕГО и плитка
  // живёт дальше. Ни ошибки, ни строки в консоли.
  // ПОЭТОМУ ПРОВЕРЯЕМ РЕЗУЛЬТАТ (закон №35): дорожка, чей `MediaStreamTrack` перешёл в
  // `ended`, показывать больше нечего - окно уходит независимо от того, дошло событие
  // или нет. Уборка идемпотентна и стоит один проход по списку окон.
  function sweepVideos() {
    var dead = [];
    vids.forEach(function (r) {
      var mst = null;
      try { mst = r.t && r.t.mediaStreamTrack; } catch (e) { mst = null; }
      // НЕТ `mediaStreamTrack` - НЕ ПОВОД СНОСИТЬ: у части версий SDK его нет вовсе, и
      // слепая уборка убрала бы ЖИВОЕ чужое видео. Сносим только доказанно мёртвое.
      if (mst && mst.readyState === 'ended') dead.push(r.t);
    });
    dead.forEach(dropVideo);
    return dead.length;
  }

  // ═══ МИКРОФОН: ОДНА ДВЕРЬ, И СОСТОЯНИЕ МЕНЯЕТСЯ ТОЛЬКО ПОСЛЕ УСПЕХА ═══
  // Мест, где мы дёргаем микрофон, ТРИ: кнопка внизу, адресная просьба «приглушись» и
  // общее «тишина». Во всех трёх стояло `micOn = false; try { ... } catch (e) {}` - то
  // есть подпись менялась ПЕРЕД вызовом, а отказ SDK съедался МОЛЧА. Отказ там не
  // теоретический: ровно этим путём приходит `waiting for pending publication promise
  // timed out`, если публикация ещё идёт, - и человек видел переключившуюся кнопку над
  // работающим микрофоном. Это тот же класс, что залипшая кнопка показа (закон №55:
  // обратный путь обязан быть проверен), только тише - у показа хотя бы был текст.
  // ВЕРДИКТ ПО ФАКТУ (закон №35): состояние берём у SDK после вызова, а не из намерения.
  async function micSet(want, why) {
    if (!room) return false;
    try {
      await room.localParticipant.setMicrophoneEnabled(want);
    } catch (e) {
      // ИСТИННОЕ СОСТОЯНИЕ СПРАШИВАЕМ У SDK, А НЕ ДОГАДЫВАЕМСЯ: у части отказов дорожка
      // всё-таки переключается, и «вернуть как было» соврало бы во второй раз.
      try { micOn = !!room.localParticipant.isMicrophoneEnabled; } catch (e2) {}
      micPaint();
      say((why ? why + ' ' : '') + 'Микрофон переключить не вышло ('
          + (e && e.message || e) + '). Кнопка показывает то, что есть на самом деле.',
          true);
      return false;
    }
    micOn = want;
    micPaint();
    if (why) say(why);
    try { upsert(room.localParticipant.identity, { muted: !micOn }); } catch (e) {}
    return true;
  }

  function micPaint() {
    var b = document.getElementById('mic');
    if (!b) return;
    b.className = micOn ? 'on' : 'off';
    barLabel(b, micOn ? '🎙' : '🔇', 'Микрофон');
  }

  function layPaint() {
    var box = $('screens');
    var n = vids.length;
    // «АВТО» - ЭТО НЕ ЧЕТВЁРТАЯ РАСКЛАДКА, А ПРАВИЛО: одно видео во всю ширину, два и
    // больше - сетка. Человек выбирает только тогда, когда правило ему не подходит.
    // ЗАКРЕПЛЁННОЕ ОКНО СИЛЬНЕЕ ПРАВИЛА «АВТО»: человек сказал, что смотреть крупно, и
    // переспрашивать его каждый раз, когда заговорил сосед, - это спорить с ним.
    var mode = layMode;
    if (mode === 'auto') mode = layPin ? 'spk' : (n >= 2 ? 'grid' : 'one');
    box.className = (mode === 'grid') ? 'grid' : (mode === 'spk' ? 'spk' : '');
    if (mode === 'spk') {
      // КРУПНО - ЗАКРЕПЛЁННЫЙ, А ЕСЛИ ЕГО НЕТ - ТОТ, КТО ГОВОРИТ. Молчат все - первый:
      // пустое место вместо картинки читается как поломка.
      var big = null;
      if (layPin) {
        vids.forEach(function (r) {
          var k = r.el.dataset.pid || (r.el.dataset.me === '1' ? '@me' : '');
          if (!big && k && k === layPin) big = r;
        });
        // ЗАКРЕПЛЁННЫЙ УШЁЛ ИЗ КОМНАТЫ - ЗАКРЕПЛЕНИЕ СНИМАЕТСЯ САМО. Держать его значило
        // бы показывать крупно пустоту и не давать вернуться к нормальной раскладке.
        if (!big) { layPin = ''; laySave(); }
      }
      if (!big) {
        vids.forEach(function (r) {
          var pid = r.el.dataset.pid || '';
          if (!big && pid && people[pid] && people[pid].speaking) big = r;
        });
      }
      if (!big) big = vids[0];
      vids.forEach(function (r) {
        r.el.classList.toggle('big', r === big);
        r.el.classList.toggle('small', r !== big);
        var k = r.el.dataset.pid || (r.el.dataset.me === '1' ? '@me' : '');
        r.el.classList.toggle('pinned', !!(layPin && k === layPin));
      });
      laySplit(box);
    } else {
      vids.forEach(function (r) {
        r.el.classList.remove('big'); r.el.classList.remove('small');
        r.el.classList.remove('pinned');
      });
      // ДЕЛИТЬ НЕЧЕГО - ПОЛОСЫ НЕТ ВОВСЕ (закон №36). Она живёт РОВНО в режиме «крупно»:
      // в сетке тянуть не за что, и оставленная полоса читалась бы как сломанная кнопка.
      // УБОРКА СТОИТ ИМЕННО ЗДЕСЬ, В ВЕТКЕ «не крупно»: вынеси её наружу - и она сносила
      // бы полосу СРАЗУ ПОСЛЕ того, как ветка «крупно» её создала (поймано пробой:
      // «делителя между окнами нет» при верном на вид коде).
      var _sp = document.getElementById('vsplit');
      if (_sp) _sp.remove();
    }
    // ГОВОРЯЩИЙ - ОБВОДКОЙ ПЛИТКИ, И ЭТО ОДНО МЕСТО НА ВСЕ РАСКЛАДКИ. Раскладка отвечает
    // на вопрос «где окна», подсветка - «кто сейчас говорит»; свяжи их, и в сетке
    // говорящий перестал бы подсвечиваться вовсе.
    vids.forEach(function (r) {
      var pid = r.el.dataset.pid || '';
      r.el.classList.toggle('speaking', !!(pid && people[pid] && people[pid].speaking));
    });
    var b = $('lay');
    if (b) {
      // РАСКЛАДЫВАТЬ НЕЧЕГО - КНОПКИ НЕТ. Она бы переключала невидимое и читалась как
      // сломанная (закон №36: причина рядом, а не молчание после тапа).
      b.style.display = n ? '' : 'none';
      b.textContent = '🔲 Раскладка: ' + LAY_NAMES[layMode];
      b.classList.toggle('on', layMode !== 'auto');
    }
  }

  // ═══ ДЕЛИТЕЛЬ МЕЖДУ ОКНАМИ: ТЯНЕШЬ - МЕНЯЕТСЯ ТОЛЬКО ТВОЙ ЭКРАН ═══
  // Полоса живёт РОВНО в режиме «крупно»: в сетке делить нечего, и полоса там была бы
  // кнопкой, которая ничего не делает. Высоту храним в пикселях у себя (закон о личном
  // против общего: раскладка это вкус, а не состояние комнаты).
  // МЫШЬ И ПАЛЕЦ - ОДИН КОД: `pointer`-события покрывают оба, а два обработчика разошлись
  // бы на первой правке (закон №40).
  function laySplit(box) {
    var sp = document.getElementById('vsplit');
    if (!sp) {
      sp = document.createElement('div');
      sp.id = 'vsplit';
      sp.title = 'Потяни, чтобы изменить размер. Двойной тап - вернуть как было';
      box.appendChild(sp);
      var from = 0, base = 0;
      sp.addEventListener('pointerdown', function (e) {
        from = e.clientY;
        var b = box.querySelector('.vwrap.big');
        base = b ? b.getBoundingClientRect().height : 0;
        try { sp.setPointerCapture(e.pointerId); } catch (e2) {}
        e.preventDefault();
      });
      sp.addEventListener('pointermove', function (e) {
        if (!from) return;
        // ПОТОЛКИ НЕ УКРАШЕНИЕ: без нижнего окно схлопывается в ноль и вернуть его нечем
        // (тянуть станет не за что), без верхнего уезжают все остальные плитки.
        var h = Math.max(120, Math.min(window.innerHeight * 0.85, base + (e.clientY - from)));
        layBigH = Math.round(h);
        box.style.setProperty('--bigh', layBigH + 'px');
      });
      function stop() { if (from) { from = 0; laySave(); } }
      sp.addEventListener('pointerup', stop);
      sp.addEventListener('pointercancel', stop);
      // ОБРАТНЫЙ ПУТЬ У РАЗМЕРА ТОЖЕ ЕСТЬ (закон №55): утянул окно не туда - двойной тап
      // возвращает как было, и искать «сброс» в меню не нужно.
      sp.addEventListener('dblclick', function () {
        layBigH = 0; box.style.removeProperty('--bigh'); laySave();
        say('Размер окна вернул к обычному.');
      });
    }
    if (layBigH) box.style.setProperty('--bigh', layBigH + 'px');
  }

  // ═══ ВО ВЕСЬ ЭКРАН: У TELEGRAM СВОЙ API, У БРАУЗЕРА СВОЙ ═══
  // Кнопка появляется ТОЛЬКО там, где хоть один из них есть: на клиенте старее Bot API 8.0
  // её быть не должно вовсе - кнопка, после которой ничего не происходит, хуже отсутствующей.
  var fullOn = false;

  function fullCan() {
    return !!(tg && typeof tg.requestFullscreen === 'function')
        || !!(document.documentElement && document.documentElement.requestFullscreen);
  }

  function fullPaint() {
    var b = $('full');
    if (!b) return;
    b.style.display = fullCan() ? '' : 'none';
    b.classList.toggle('on', fullOn);
    b.textContent = fullOn ? '⛶ Свернуть' : '⛶ Во весь экран';
  }

  // ═══ КАЧЕСТВО СВЯЗИ: ЦИФРЫ ВМЕСТО «У МЕНЯ ЗАИКАЕТСЯ» ═══
  // ЖИВОЙ СОЗВОН НЕСКОЛЬКИХ ЧЕЛОВЕК (Ren 27.08): «непонятно, у кого плохо со связью».
  // По жалобе делать нечего: она не говорит НИ КТО, НИ НАСКОЛЬКО. Пороги названы им же -
  // потери больше 2% и джиттер больше 30 мс.
  //: ПОТЕРИ СЧИТАЮТСЯ ЗА ОКНО, А НЕ ОТ НАЧАЛА СОЗВОНА. Накопленный процент за час
  //: показывает историю, а вопрос у человека про СЕЙЧАС: одна плохая минута в начале
  //: разговора не должна красить весь остаток.
  var LOSS_BAD = 2, JIT_BAD = 30, STAT_EVERY = 10000;
  var statPrev = {};          // identity -> {lost, recv}
  var statLast = {};          // identity -> {loss, jit, rtt} последнего окна
  var statSaid = false;       // говорили ли уже, что статистики у клиента нет

  function statFmt(nm, q) {
    var bad = (q.loss > LOSS_BAD) || (q.jit > JIT_BAD);
    return nm + ': ' + q.loss.toFixed(1) + '% потерь, джиттер ' + Math.round(q.jit) + ' мс'
      + (q.rtt ? ', RTT ' + Math.round(q.rtt) + ' мс' : '') + (bad ? ' ⚠️' : '');
  }

  async function statsOnce() {
    if (!room || !connected) return;
    var rows = [];
    var ps = [];
    room.remoteParticipants.forEach(function (p) { ps.push(p); });
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      var pubs = [];
      var m = p.trackPublications || p.tracks;
      if (m && m.forEach) m.forEach(function (pub) { pubs.push(pub); });
      var got = null;
      for (var k = 0; k < pubs.length; k++) {
        var t = pubs[k].track;
        // ЧИСЛА БЕРЁМ У ТОГО, КТО ИХ ЗНАЕТ, И НЕ ВЫДУМЫВАЕМ, ЕСЛИ ОН МОЛЧИТ (закон №22):
        // у старого клиента этого метода нет вовсе, и «0% потерь» было бы враньём.
        if (!t || typeof t.getRTCStatsReport !== 'function') continue;
        var rep2 = null;
        try { rep2 = await t.getRTCStatsReport(); } catch (e) { rep2 = null; }
        if (!rep2 || !rep2.forEach) continue;
        var lost = 0, recv = 0, jit = 0, rtt = 0, seen = false;
        rep2.forEach(function (st) {
          if (st.type === 'inbound-rtp') {
            seen = true;
            lost += Number(st.packetsLost || 0);
            recv += Number(st.packetsReceived || 0);
            jit = Math.max(jit, Number(st.jitter || 0) * 1000);
          } else if (st.type === 'candidate-pair' && st.currentRoundTripTime) {
            rtt = Math.max(rtt, Number(st.currentRoundTripTime) * 1000);
          } else if (st.type === 'remote-inbound-rtp' && st.roundTripTime) {
            rtt = Math.max(rtt, Number(st.roundTripTime) * 1000);
          }
        });
        if (!seen) continue;
        var prev = statPrev[p.identity] || { lost: 0, recv: 0 };
        var dl = Math.max(0, lost - prev.lost), dr = Math.max(0, recv - prev.recv);
        statPrev[p.identity] = { lost: lost, recv: recv };
        got = { loss: (dl + dr) ? (100 * dl / (dl + dr)) : 0, jit: jit, rtt: rtt };
        break;
      }
      if (!got) continue;
      statLast[p.identity] = got;
      // ИМЯ БЕРЁМ ИЗ СПИСКА КОМНАТЫ, А НЕ У `nameOf`: та живёт в области видимости `go()`,
      // и модульная функция её не видит - вышло бы «nameOf is not a function» на первом
      // же тике, то есть строка связи не появилась бы НИ РАЗУ.
      var _nm = (people[p.identity] && people[p.identity].name)
             || human(p.name, p.identity);
      rows.push(statFmt(_nm, got));
    }
    var box = $('connq');
    if (box) {
      // МОЛЧАНИЕ КЛИЕНТА НАЗЫВАЕТСЯ ОДИН РАЗ, А НЕ КАЖДЫЕ ДЕСЯТЬ СЕКУНД.
      if (!rows.length && !statSaid) {
        statSaid = true;
        box.textContent = ps.length
          ? 'Связь: клиент не отдаёт статистику - цифр по участникам не будет.'
          : '';
      } else if (rows.length) {
        statSaid = false;
        box.textContent = 'Связь (за 10 с): ' + rows.join(' · ');
      }
    }
    return rows;
  }

  // ═══ ТИК ЖИВЁТ РЯДОМ С ЗАМЕРОМ, А НЕ ВНУТРИ ВЕТКИ ПОДПИСИ ═══
  // Собирает цифры КАЖДЫЙ (это его канал), а отправляет боту только админ: пришли снимок
  // все, в логе лежало бы N копий одного разговора. Внутри `if (initData)` тик был бы
  // невидим соседям - в частности, приходу нового участника, а это ровно тот момент,
  // когда его связь интересна.
  var _statTick = 0;
  async function statTick() {
    var rows = await statsOnce();
    _statTick++;
    if (!initData || !iAmAdm || !rows || !rows.length || (_statTick % 6)) return;
    try {
      var r = await fetch(API + '/signal', {
        method: 'POST',
        headers: { 'X-Init-Data': initData, 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind: 'rtcstat', room: ROOM, rows: rows.slice(0, 20) }),
      });
      // ═══ НЕУДАЧА НЕ ЛОМАЕТ РАЗГОВОР, НО И НЕ ИСЧЕЗАЕТ БЕССЛЕДНО ═══
      // Строка связи на экране считается локально и работает при любом исходе, поэтому
      // человеку тут говорить нечего. А вот пустой `catch {}` означал бы, что «в логе нет
      // связи» и «Worker выложен старой версией и про `rtcstat` не знает» выглядят
      // одинаково, - а разбор начинается ровно с этого различия.
      if (!r.ok) console.warn('[rtcstat] ящик не принял: HTTP', r.status);
    } catch (e) { console.warn('[rtcstat] не отправилось:', e); }
  }
  // ПЕРВЫЙ ЗАМЕР - СРАЗУ, А НЕ ЧЕРЕЗ ОКНО. Ждать десять секунд пустой строки человек
  // читает как «статистики нет»; первое окно короче, и это честно - оно и правда короче.
  setTimeout(statTick, 1500);
  setInterval(statTick, STAT_EVERY);

  // СКОЛЬКО ЧЕЛОВЕК В КОМНАТЕ - ОТДЕЛЬНОЙ СТРОКОЙ И ВСЕГДА. Список из одной строки «Ты»
  // не отвечает на вопрос «я тут один или другие ещё не зашли»: это два разных решения -
  // ждать или звать людей. Число считается ПО ТОМУ ЖЕ объекту, что рисует список, а не
  // отдельным счётчиком - два счётчика разошлись бы на первом же выходе участника.
  function headcount() {
    var n = Object.keys(people).length;
    if (n <= 1) return 'В комнате: только ты';
    var tail = (n % 10 === 1 && n % 100 !== 11) ? 'человек'
             : ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'человека'
             : 'человек');
    return 'В комнате: ' + n + ' ' + tail;
  }

  function draw() {
    var box = $('people');
    box.innerHTML = '';
    var ids = Object.keys(people);
    if (connected) sub(headcount());
    if (!ids.length) { box.innerHTML = '<div class="me">Пока никого</div>'; return; }
    ids.forEach(function (id) {
      var p = people[id];
      var row = document.createElement('div');
      row.className = 'p';
      // ОЧЕРЕДЬ СЛОВА - ЭТО ПОРЯДОК, А НЕ ФЛАЖОК: номер считается по времени поднятия,
      // иначе «кто раньше поднял» решает случайный порядок объекта.
      var q2 = ids.filter(function (x) { return people[x].hand; })
                  .sort(function (a, b) { return people[a].hand - people[b].hand; });
      var pos = q2.indexOf(id);
      // ═══ ЗНАЧОК ШУМОДАВА - ТОЛЬКО АДМИНУ, И ЭТО НЕ СЕКРЕТНОСТЬ, А ЧИСТОТА СПИСКА ═══
      // Остальным он не отвечает ни на один вопрос: своё состояние человек видит на своей
      // же кнопке, а чужое ему нечем изменить. Админу же это ЕДИНСТВЕННЫЙ способ увидеть
      // ФАКТ вместо своей отправленной просьбы.
      // «Неизвестно» отличается от «выключен»: сосед со старой страницей про шумодав не
      // рассказывает вовсе, и молчание не значит «у него выключено».
      var _rn = (iAmAdm && !p.me)
        ? (p.rnn === undefined ? '<span class="hand">🔇?</span> '
                               : (p.rnn ? '<span class="hand">🔇</span> ' : ''))
        : '';
      row.innerHTML = '<span class="dot' + (p.speaking ? ' on' : '') + '"></span>'
        + '<span class="nm"></span>'
        + (pos >= 0 ? '<span class="hand">✋ ' + (pos + 1) + '</span> ' : '')
        + _rn
        + '<span class="me">' + (p.me ? 'ты' : (p.muted ? 'микрофон выкл' : '')) + '</span>';
      row.querySelector('.nm').textContent = p.name;
      // ═══ ДЕЙСТВИЯ НАД УЧАСТНИКОМ ═══
      // СВОЯ СТРОКА ИХ НЕ ПОЛУЧАЕТ: «заглушить себя» это кнопка микрофона внизу, и второй
      // способ сделать то же самое разошёлся бы с ней при первой правке.
      if (!p.me) {
        var more = document.createElement('button');
        more.className = 'more';
        more.textContent = '⋯';
        more.onclick = function () {
          pactFor = (pactFor === id) ? '' : id;
          draw();
        };
        row.appendChild(more);
      }
      box.appendChild(row);
      if (pactFor === id && !p.me) box.appendChild(pactRow(id, p));
    });
  }

  //: ЧЬЁ МЕНЮ ДЕЙСТВИЙ СЕЙЧАС РАСКРЫТО. Одно на список: два раскрытых разом означали бы,
  //: что человек не видит, к кому относится кнопка, которую он вот-вот нажмёт.
  var pactFor = '';

  function pactRow(id, p) {
    var box = document.createElement('div');
    box.className = 'pact';
    var isRadio = (id === DJ_ID);
    if (isRadio) {
      // ═══ РАДИО - НЕ ЧЕЛОВЕК, И ЗДЕСЬ ДЕЙСТВИЕ НАСТОЯЩЕЕ ═══
      // Процессом владеет БОТ, значит «отсоединить» это не просьба, а команда: тот же
      // путь, что у кнопки «Выключить радио», и второй дороги мы не заводим (закон №40).
      var off = document.createElement('button');
      off.textContent = '⏹ Отсоединить радио';
      off.onclick = function () {
        pactFor = ''; draw();
        if (djOff) djOff();
        else say('Отсоединить радио может тот, кто вошёл из Telegram: у меня нет канала '
                 + 'к боту.', true);
      };
      box.appendChild(off);
      var nt = document.createElement('p');
      nt.className = 'me';
      nt.textContent = 'Радио - мой процесс, поэтому это настоящая команда, а не просьба.';
      box.appendChild(nt);
      return box;
    }
    // ═══ АДМИН МОЖЕТ ПО-НАСТОЯЩЕМУ, ОСТАЛЬНЫЕ - ПРОСЯТ ═══
    // Разница не в вежливости, а в том, ЧТО ФИЗИЧЕСКИ УМЕЕТ КЛИЕНТ: выключить чужой
    // микрофон у livekit-client двери нет вовсе, это только серверный вызов. Поэтому
    // админские кнопки идут через ящик к боту, а право всё равно проверяет ОН (закон
    // №32) - здесь решается лишь, что показывать.
    if (iAmAdm && admDo) {
      // ═══ ШУМОДАВ У УЧАСТНИКА - ПЕРЕКЛЮЧАТЕЛЬ, А НЕ ОДНОСТОРОННЯЯ КНОПКА (закон №55) ═══
      // Подпись называет РЕЗУЛЬТАТ тапа и считается от ФАКТИЧЕСКОГО состояния, которое
      // прислал он сам. Считай мы её от последней отправленной просьбы, кнопка врала бы
      // ровно у того, кто просьбу не исполнил или отменил у себя.
      // ГРАНИЦА НАЗВАНА ЧЕСТНО НИЖЕ, В ПОДПИСИ: это тоже просьба, только с настоящим
      // гейтом. Включает шумодав его страница, и выключить у себя он может всегда.
      var _rnOn = !!p.rnn;
      var rb = document.createElement('button');
      rb.className = 'adm';
      rb.textContent = _rnOn ? '🔊 Снять шумодав' : '🔇 Включить шумодав';
      rb.onclick = function () {
        pactFor = ''; draw();
        admDo(_rnOn ? 'rnn_off' : 'rnn_on', id, p.name);
      };
      box.appendChild(rb);
      // ═══ РЕАКЦИИ И ЗВУКИ - ПЕРЕКЛЮЧАТЕЛЬ, И ОБРАТНЫЙ ПУТЬ ОБЯЗАТЕЛЕН (закон №55) ═══
      // Заглушить человека навсегда одним тапом нельзя: он перестанет быть участником
      // разговора, а вернуть его будет нечем до конца созвона.
      var _fOff = !!funOff[String(id)];
      var fb = document.createElement('button');
      fb.className = 'adm';
      fb.textContent = _fOff ? '🔊 Вернуть реакции' : '🙊 Запретить реакции и звуки';
      fb.onclick = function () {
        pactFor = ''; draw();
        admDo(_fOff ? 'fun_on' : 'fun_off', id, p.name);
      };
      box.appendChild(fb);
      [['🔇 Заглушить', 'mute'], ['🚪 Отключить', 'kick'],
       ['👑 Сделать админом', 'admin']].forEach(function (a) {
        var b = document.createElement('button');
        b.className = 'adm';
        b.textContent = a[0];
        b.onclick = function () {
          pactFor = ''; draw();
          admDo(a[1], id, p.name);
        };
        box.appendChild(b);
      });
    }
    [['🔇 Попросить приглушиться', 'quiet'],
     ['🚪 Попросить выйти', 'bye']].forEach(function (a) {
      var b = document.createElement('button');
      b.textContent = a[0];
      b.onclick = function () {
        pactFor = ''; draw();
        send({ t: 'ask1', to: id, do: a[1], by: myLabel() });
        say('Отправил ' + p.name + ': ' + (a[1] === 'quiet' ? 'приглушиться' : 'выйти')
            + '. Это просьба - решает он.');
      };
      box.appendChild(b);
    });
    // ═══ ЧЕСТНО ПРО ГРАНИЦУ, А НЕ МОЛЧА ═══
    // Серверного «замолчи» мы не шлём: для него нужен админский грант У КАЖДОГО, то есть
    // право выключать чужой микрофон кому угодно. Подпись, обещающая приказ там, где
    // отправлена просьба, хуже отсутствующей кнопки - человек решит, что сломалось.
    var note = document.createElement('p');
    note.className = 'me';
    // ТЕКСТ ОТВЕЧАЕТ СОСТОЯНИЮ, А НЕ ПОРЯДКУ СТРОК: у админа на экране стоят ОБА ряда
    // кнопок, и общая подпись «это просьбы» врала бы про верхний.
    note.textContent = iAmAdm
      ? ('Заглушить и отключить - настоящие: их выполняет сервер. Шумодав - просьба с '
         + 'настоящим гейтом: включает его страница участника, и выключить у себя он '
         + 'может всегда. Нижние - ПРОСЬБЫ: у него всплывёт окно, и он решает сам.')
      : ('Это ПРОСЬБЫ: у него всплывёт окно, и он решает сам. По-настоящему заглушить '
         + 'или отключить может только админ комнаты.');
    box.appendChild(note);
    return box;
  }

  // ИМЯ ЧЕЛОВЕКА, А НЕ ЕГО TELEGRAM-ID. Токен несёт `name` из подписи, но у токена,
  // выданного СТАРЫМ Worker'ом, там лежит uid - и комната показывала соседям столбик
  // голых чисел. Число вместо имени не сообщает НИЧЕГО и при этом светит чужой id,
  // поэтому оно заменяется словом, а не показывается «как есть».
  // ЧТО НАМ ВООБЩЕ РАЗРЕШИЛИ. JWT это base64 - клиент читает свой грант, не спрашивая
  // никого. Нужно вот зачем: страница и Worker выкладываются РАЗНЫМИ командами, и если
  // приехала новая страница со старым токеном, кнопка показа есть, а права нет. LiveKit
  // в этом случае НЕ отказывает - он ВИСИТ («waiting for pending publication promise
  // timed out»), и по этому тексту причину не угадать (живой случай Ren 25.08).
  function grantOf(token) {
    try {
      var b = String(token).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      var j = JSON.parse(decodeURIComponent(escape(atob(b + '='.repeat((4 - b.length % 4) % 4)))));
      return (j && j.video) || {};
    } catch (e) { return {}; }
  }

  function human(name, id) {
    var n = String(name == null ? '' : name).trim();
    if (!n || n === String(id) || /^\d{5,}$/.test(n)) return 'Гость';
    return n;
  }

  function upsert(id, patch) {
    people[id] = Object.assign(people[id] || { name: id, speaking: false, muted: false }, patch);
    draw();
  }

  // ═════════════════════════════════════════════════════════════════════════════════
  // ЗВУКОВЫЕ РЕАКЦИИ: СИНТЕЗ НА МЕСТЕ + КАНАЛ ДАННЫХ, А НЕ ВТОРАЯ АУДИО-ДОРОЖКА
  // ═════════════════════════════════════════════════════════════════════════════════
  // ПОЧЕМУ НЕ ДОРОЖКОЙ, ХОТЯ LiveKit ЭТО УМЕЕТ. У нас на `track_published` висит вебхук,
  // и бот ДОБИРАЕТ каждую новую аудио-дорожку в идущую запись - ради вошедших позже.
  // Саундборд, опубликованный дорожкой, попал бы туда же, а бюджет Egress это ТРИ дорожки
  // на комнату (`track_cpu_cost` 0.5 при `cpus: 2.0`), - то есть каждый «тынц» отнимал бы
  // место у живого человека, и узнали бы мы об этом по недостающему голосу в транскрипте.
  // Это механизм, а не вкусовщина.
  //
  // ПОЧЕМУ БЕЗ ФАЙЛОВ. Файлы пришлось бы выкладывать ОТДЕЛЬНОЙ командой от страницы, а
  // два артефакта, уезжающие врозь, у нас уже дважды расходились (страница против
  // Worker'а, грант показа экрана). Синтез такого класса не имеет вовсе: звук едет тем же
  // документом, что и кнопка.
  //
  // ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. Смеха нет: голос синтезом не подделать, а «смех», звучащий
  // как пила, хуже отсутствующей кнопки. Все восемь ниже - ударные и шум, они синтезом
  // получаются как есть, а не «похоже».
  var _AC = null, _MASTER = null;

  function actx() {
    if (!_AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { _AC = new C(); } catch (e) { return null; }
      _MASTER = _AC.createGain();
      // ═══ УРОВЕНЬ: 0.5 БЫЛО ТИХО, И ЭТО ЖИВОЙ ОТЗЫВ, А НЕ ВКУС ═══
      // Реакция звучит ПОВЕРХ разговора, у которого своя громкость, - и «гонг и остальные
      // очень тихие» означает, что её просто не слышно. Ставим 1.0 и держим пики у
      // источников: общий множитель ниже единицы отнимал половину у КАЖДОГО звука разом.
      _MASTER.gain.value = 1.0;
      _MASTER.connect(_AC.destination);
    }
    // БЕЗ ЖЕСТА БРАУЗЕР ДЕРЖИТ КОНТЕКСТ ПРИТОРМОЖЕННЫМ И МОЛЧА. `resume()` зовём без
    // ожидания: не успел к этому звуку - успеет к следующему, а срывать из-за него ПОКАЗ
    // реакции нельзя (у сигнала обязано быть два независимых пути дойти).
    try { if (_AC.state === 'suspended') _AC.resume(); } catch (e) {}
    return _AC;
  }

  function noise(ac, sec) {
    var n = Math.max(1, Math.floor(ac.sampleRate * sec));
    var b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  //: Шумовой удар: хлопок, щётка, тарелка. `exponentialRamp` в НОЛЬ уходить не умеет -
  //: отсюда 0.0001, а не 0 (иначе Web Audio молча не применит спад, и звук оборвётся
  //: щелчком).
  function burst(ac, t0, dur, gain, type, freq, q) {
    var s = ac.createBufferSource(); s.buffer = noise(ac, dur + 0.02);
    var f = ac.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq || 1200;
    if (q) f.Q.value = q;
    var g = ac.createGain();
    g.gain.setValueAtTime(Math.max(0.0001, gain), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(_MASTER);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }

  //: Тон с атакой и спадом. Атака в 8 мс нужна против щелчка: мгновенный старт с полной
  //: громкости слышен как треск, а не как нота.
  function tone(ac, t0, dur, gain, f0, f1, type) {
    var o = ac.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(_MASTER);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  // РЕЕСТР ОДИН НА КНОПКУ И НА ПРИЁМНИК: рисуем кнопки из него же, из него же читаем
  // пришедший id. Два списка разъехались бы, и половина комнаты слышала бы не то, что
  // написано на кнопке у соседа (закон №40).
  var SOUNDS = {
    clap: { e: '👏', t: 'Хлопки', p: function (ac, t) {
      // ═══ ВТОРОЙ ЗАХОД, И ОБА ПРЕЖНИХ ПРОМАХА НАЗВАНЫ ═══
      // (1) `bandpass` c Q=1.2 на коротком шуме - РЕЗОНАТОР: звенит на своей частоте, ухо
      // слышит тон, а не удар. (2) `highpass` на 320-700 Гц оставил ВЕСЬ низ, и вышло
      // «низко, на хлопки не похоже» (живой отзыв Ren).
      // ХЛОПОК ЖИВЁТ ВЫШЕ, ЧЕМ КАЖЕТСЯ: основная энергия ладоней - 1.5-4 кГц, а спад
      // 8-15 мс, не 35. Отсюда: срез снизу от 1.2 кГц, ОЧЕНЬ короткий удар и лёгкий
      // «хвост зала» после каждого - без него это щелчки мыши, а не аплодисменты.
      for (var i = 0; i < 28; i++) {
        // РАЗБРОС НЕРОВНЫЙ: в начале плотно, дальше реже - так хлопает зал, а ровная
        // сетка читается как метроном.
        var at = t + Math.pow(Math.random(), 0.5) * 1.15;
        burst(ac, at, 0.010 + Math.random() * 0.008, 0.55 + Math.random() * 0.35,
              'highpass', 1200 + Math.random() * 900, 0);
        burst(ac, at + 0.006, 0.045, 0.10 + Math.random() * 0.06, 'bandpass', 2400, 0.7);
      }
    } },
    drum: { e: '🥁', t: 'Дробь', p: function (ac, t) {
      // ═══ ПОЧЕМУ ПРЕЖНЯЯ БЫЛА «НЕ ПОХОЖА» ═══
      // `lowpass 260` на 50 мс - это глухой бубух, и двадцать таких подряд сливаются в
      // РОВНЫЙ ГУЛ. Барабанная дробь - это СУХИЕ короткие удары по пластику: середина и
      // верх (600 Гц - 5 кГц), длительность 8-14 мс, и они обязаны РАЗЛИЧАТЬСЯ поштучно.
      // Плюс дробь идёт ПАРАМИ (правая-левая) с лёгкой неровностью - ровная сетка звучит
      // машинно.
      var at = t, step = 0.075;
      while (at < t + 1.15) {
        burst(ac, at, 0.008 + Math.random() * 0.005, 0.34 + Math.random() * 0.16,
              'highpass', 700, 0);
        step = Math.max(0.022, step * 0.94);      // РАЗГОН: без него это метроном
        at += step * (0.9 + Math.random() * 0.2);
      }
      // ФИНАЛЬНЫЙ УДАР - ДРУГОЙ ПО ТЕМБРУ, иначе конец не читается как конец.
      burst(ac, at + 0.06, 0.09, 0.60, 'highpass', 400, 0);
      tone(ac, at + 0.06, 0.30, 0.30, 190, 70, 'sine');
      burst(ac, at + 0.06, 0.45, 0.22, 'highpass', 5500, 0);   // тарелка
    } },
    tyn: { e: '🥁', t: 'Тынц', p: function (ac, t) {
      tone(ac, t, 0.18, 0.30, 220, 90, 'sine');              // ба-
      tone(ac, t + 0.17, 0.18, 0.30, 175, 70, 'sine');       // -дум
      burst(ac, t + 0.34, 0.55, 0.20, 'highpass', 5200, 0);  // -тсс
    } },
    bell: { e: '🔔', t: 'Динь', p: function (ac, t) {
      // Колокол - это НЕСКОЛЬКО обертонов с разным спадом: одна синусоида звучит как
      // писк из микроволновки.
      tone(ac, t, 1.10, 0.34, 880, 880, 'sine');
      tone(ac, t, 0.90, 0.16, 1320, 1320, 'sine');
      tone(ac, t, 0.60, 0.05, 2640, 2640, 'sine');
    } },
    tada: { e: '🎺', t: 'Та-да', p: function (ac, t) {
      [523, 659, 784].forEach(function (f, i) {
        tone(ac, t + i * 0.085, 0.14, 0.30, f, f, 'triangle');
      });
      tone(ac, t + 0.26, 0.70, 0.34, 1047, 1047, 'triangle');
    } },
    buzz: { e: '📢', t: 'Гудок', p: function (ac, t) {
      tone(ac, t, 0.45, 0.28, 118, 108, 'square');
    } },
    pop: { e: '💧', t: 'Поп', p: function (ac, t) {
      tone(ac, t, 0.11, 0.38, 420, 950, 'sine');
    } },
    gong: { e: '⏰', t: 'Гонг', p: function (ac, t) {
      // ТРИ ОДИНАКОВЫХ СИНУСА ПОДРЯД - ЭТО БУДИЛЬНИК, А НЕ ГОНГ. У гонга ОДИН удар с
      // неровными обертонами и длинным хвостом; удар начинается шумом (било о металл),
      // дальше остаётся звон.
      burst(ac, t, 0.06, 0.34, 'lowpass', 1800, 0);
      [110, 164, 233, 311, 415].forEach(function (f, i) {
        tone(ac, t, 2.6 - i * 0.35, 0.30 / (i + 1.4), f, f * 0.995, 'sine');
      });
    } },
  };

  // ═══ ГОТОВЫЙ СЭМПЛ СИЛЬНЕЕ СИНТЕЗА, И ЭТО РЕШЕНИЕ REN ═══
  // «Хлопки звучат как писк, гонг тихий - синтез не справляется». Он и не справится:
  // хлопок это запись комнаты, а не осциллятор. Поэтому рядом со страницей может лежать
  // `snd/<id>.ogg`, и он ВЫИГРЫВАЕТ у синтеза.
  // МАНИФЕСТ, А НЕ ПРОБА КАЖДОГО ФАЙЛА: восемь HEAD-запросов на открытие комнаты ради
  // «а есть ли» - это восемь лишних кругов и восемь способов ошибиться. `deploy_room`
  // собирает список из КАТАЛОГА, то есть по факту наличия, а не по нашей памяти.
  // ФАЙЛОВ МОЖЕТ НЕ БЫТЬ ВОВСЕ - тогда работает то, что есть, и ничего не ломается.
  var SND_BUF = {};                 // id -> AudioBuffer (или null, если не вышло)
  var SND_FILES = null;             // список id, для которых файл ЕСТЬ

  function sndManifest() {
    if (SND_FILES !== null) return Promise.resolve(SND_FILES);
    return fetch('snd/index.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (j) { SND_FILES = Array.isArray(j) ? j : []; return SND_FILES; });
  }

  function sndLoad(ac, id) {
    if (SND_BUF[id] !== undefined) return Promise.resolve(SND_BUF[id]);
    return fetch('snd/' + id + '.ogg')
      .then(function (r) { return r.ok ? r.arrayBuffer() : Promise.reject(0); })
      .then(function (b) { return ac.decodeAudioData(b); })
      .then(function (buf) { SND_BUF[id] = buf; return buf; })
      .catch(function () { SND_BUF[id] = null; return null; });
  }

  //: -> сыграл ли. Отвечаем ФАКТОМ, а не намерением: не поднялся контекст - вызывающий
  //: обязан знать, что человек ничего не услышал, и показать событие глазами.
  function playSnd(id) {
    var s = SOUNDS[id];
    if (!s) return false;
    var ac = actx();
    if (!ac) return false;
    if (SND_BUF[id]) {
      try {
        var src = ac.createBufferSource();
        src.buffer = SND_BUF[id];
        src.connect(_MASTER);
        src.start(ac.currentTime + 0.02);
        return true;
      } catch (e) { /* дальше синтезом */ }
    }
    if (SND_FILES && SND_FILES.indexOf(id) >= 0 && SND_BUF[id] === undefined) {
      // ФАЙЛ ЕСТЬ, НО ЕЩЁ НЕ ЗАГРУЖЕН: тянем и играем, когда приедет. Ждать его молча
      // нельзя - человек тапнул и обязан услышать хоть что-то в эту же секунду.
      sndLoad(ac, id).then(function (b) {
        if (!b) return;
        try {
          var s2 = ac.createBufferSource();
          s2.buffer = b; s2.connect(_MASTER); s2.start(ac.currentTime + 0.01);
        } catch (e) {}
      });
    }
    if (!s.p) return SND_BUF[id] !== undefined;
    try { s.p(ac, ac.currentTime + 0.02); } catch (e) { return false; }
    return true;
  }

  //: СКОЛЬКО РЕАКЦИЙ ВИСИТ НА ЭКРАНЕ РАЗОМ. Без потолка десяток подряд закрыл бы список
  //: людей целиком - то есть «кто говорит» пропало бы ровно тогда, когда в комнате
  //: оживлённо.
  var POP_MAX = 5;

  function popup(txt) {
    var box = $('pops');
    if (!box) return;
    var d = document.createElement('div');
    d.className = 'pop';
    d.textContent = txt;
    box.appendChild(d);
    while (box.children.length > POP_MAX) box.removeChild(box.firstChild);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2700);
  }

  async function go() {
    stage('запрос токена');
    var r;
    try {
      if (WEB) {
        // ИМЯ СПРАШИВАЕМ, ЕСЛИ ЕГО НЕТ В ССЫЛКЕ: человек без Telegram нам не представлен
        // ничем, а соседям по комнате надо знать, кто говорит.
        var nm = q.get('name') || '';
        if (!nm) {
          stage(BOOT_ASKING);
          try { nm = (prompt('Как тебя звать в комнате?') || '').slice(0, 40); } catch (e) {}
          stage('запрос токена');
        }
        // ═══ СВОЁ МЕСТО ВОЗВРАЩАЕМ, А НЕ ЗАНИМАЕМ ВТОРОЕ ═══
        // Ссылка отдаёт десять мест, и перезагрузка (в том числе НАША, ради обновления
        // версии) съедала бы по одному. Строка места случайная, живёт ТОЛЬКО здесь и
        // наружу не уезжает - вернуть её может лишь этот браузер.
        var _seat = '';
        try { _seat = localStorage.getItem('rtc_seat_' + ROOM) || ''; } catch (e) {}
        r = await fetchT(API + '/rtc/web?t=' + encodeURIComponent(WEB)
                        + (nm ? '&name=' + encodeURIComponent(nm) : '')
                         + (_seat ? '&seat=' + encodeURIComponent(_seat) : ''), null, 15000);
      } else {
        r = await fetchT(API + '/rtc/token?room=' + encodeURIComponent(ROOM), {
          headers: { 'X-Init-Data': initData },
        }, 15000);
      }
    } catch (e) {
      sub('Сервер не ответил');
      say('Не достучался до ' + API + ': ' + (e && e.message || e), true);
      return;
    }
    var j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok || !j || !j.token) {
      sub('Войти не вышло');
      // ═══ ОТКАЗ НАЗЫВАЕТ ПРИЧИНУ ЧЕЛОВЕЧЕСКИ И ГОВОРИТ, ЧТО ДЕЛАТЬ ═══
      // ЖИВОЙ ОТКАЗ REN 28.08: «вход по браузерной ссылке не сработал» - и всё, что видел
      // человек, это код с машинным словом. А причины лечатся ПО-РАЗНОМУ: кончились
      // места по ссылке (просить новую), полна комната (это уже не про ссылку), подпись
      // не сошлась (новая не поможет вовсе), комнаты не подняты (это у нас).
      var WHY = {
        web_link_full: 'По этой ссылке уже вошли все, кому она даёт место. Попроси новую '
                       + 'ссылку у того, кто позвал.',
        web_room_full: 'В комнате уже максимум гостей по ссылкам. Новая ссылка не '
                       + 'поможет - это потолок самой комнаты.',
        // СТАРЫЙ КОД, КОТОРЫЙ НЫНЕШНИЙ Worker БОЛЬШЕ НЕ ОТДАЁТ. Строку оставляем
        // НАРОЧНО: страница и Worker выкладываются РАЗНЫМИ командами, и свежая страница
        // со старым Worker'ом - живой случай, стоивший нам круга уже дважды.
        web_used: 'Ссылка уже отработала. Попроси новую.',
        web_expired: 'Ссылка просрочена: у неё есть срок ВХОДА, не разговора. Попроси новую.',
        bad_web_sign: 'Подпись ссылки не сошлась - новая ссылка тут не поможет, это у нас. '
                      + 'Скажи об этом тому, кто звал.',
        bad_web_token: 'Ссылка испорчена - вероятно, скопировалась не целиком.',
        web_store: 'Не смогли отметить вход и поэтому не пускаем: пускать не отметив '
                   + 'значит открыть ссылку навсегда. Это у нас.',
        no_livekit: 'Комнаты сейчас не подняты. Это у нас, ссылка ни при чём.',
        no_initdata: 'Telegram не передал подпись. Открой комнату кнопкой из бота.',
      };
      var code = (j && j.error) || '';
      // ИМЯ ЗДЕСЬ НЕ ПРОИЗВОЛЬНОЕ, И ЭТО ЗАКОН №26: локальный `var` затеняет модульное имя
      // ВО ВСЕЙ функции, а не с места присвоения. Первая редакция звалась `human` - и
      // роняла `nameOf()` строкой ниже («human is not a function»), потому что модульная
      // функция `human(name, id)` в этой функции переставала существовать. Поймала это
      // браузерная проба, а не чтение: обе строки по отдельности выглядят верно.
      var why = WHY[code] || '';
      if (code === 'web_link_full' && j && j.cap) {
        why += ' (мест по ссылке: ' + j.cap + ', занято ' + (j.used || j.cap) + ')';
      }
      if (code === 'web_room_full' && j && j.cap) {
        why += ' (гостей по ссылкам в комнате: ' + (j.used || j.cap) + ' из ' + j.cap + ')';
      }
      // МАШИННЫЙ КОД ОСТАЁТСЯ РЯДОМ: по нему ищут в логах, и убрать его значит сделать
      // разбор дороже ради красоты строки.
      say((why || ('Сервер отказал: ' + (code || 'без причины')))
          + ' [' + r.status + ' ' + (code || '?') + ']', true);
      return;
    }
    // МЕСТО ЗАПОМИНАЕМ СРАЗУ: следующая перезагрузка вернёт его, а не займёт новое.
    // Ключ по комнате - у человека их бывает несколько, и общий ключ означал бы, что
    // вторая комната стирает место в первой.
    if (j && j.seat) {
      try { localStorage.setItem('rtc_seat_' + ROOM, String(j.seat)); } catch (e) {}
    }
    // ЧТО РАБОТАЕТ - ФАКТ С СЕРВЕРА, А НЕ ПРЕДПОЛОЖЕНИЕ СТРАНИЦЫ. Три состояния, и
    // «не знаем» это НЕ «работает»: бот публикует признак регулярно, и молчание бота
    // означает ровно то, что мы про запись ничего не знаем (fail-closed).
    CAPS = (j && j.caps) || null;
    // ═══ ЧАСЫ СЕРВЕРА, А НЕ ТЕЛЕФОНА ═══
    // Просьбы админа приезжают в метаданных с меткой, поставленной БОТОМ, а «свежая или
    // старая» считала страница по `Date.now()` СВОЕГО устройства. Часы на телефоне живут
    // своей жизнью: уход на четверть часа вперёд молча превращал свежую просьбу в
    // «старую, не исполняем» - ни ошибки, ни строки, кнопка админа просто не работает у
    // одного человека из десяти. Считаем поправку один раз и дальше меряем всё в
    // серверной шкале.
    // НЕ ПРИСЛАЛИ - РАБОТАЕМ КАК РАНЬШЕ И ГОВОРИМ ЭТО В КОНСОЛЬ: старый Worker живёт, а
    // молчаливый возврат к часам телефона был бы возвратом самой поломки.
    if (j && typeof j.now === 'number' && j.now > 1700000000) {
      SRV_SKEW = j.now - Date.now() / 1000;
    } else {
      console.warn('[rtc] Worker не прислал своё время - свежесть просьб считаю по часам '
                   + 'этого устройства; расхождение часов ломает их молча');
    }

    room = new LK.Room({
      // ВИДЕО ПОЯВИЛОСЬ (показ экрана и камера), значит адаптивный поток снова нужен:
      // он не гонит крупную картинку туда, где её негде показать.
      adaptiveStream: true,
      dynacast: true,             // не гоняем дорожки туда, где их никто не слушает
      // ═══ ТРИ ФЛАГА ОБРАБОТКИ ЗВУКА - ОБЯЗАТЕЛЬНЫ ═══
      // Без echoCancellation комната с двух телефонов в одной комнате даёт вой; без
      // noiseSuppression в эфир едет кондиционер; без autoGainControl один участник
      // слышен шёпотом, другой криком. Это не «настройки по вкусу», а условие того,
      // чтобы разговором вообще можно было пользоваться.
      // ОДИН ОБЪЕКТ НА ВСЕ ТРИ МЕСТА (умолчания комнаты, явная просьба при включении
      // микрофона, починка после захвата). Три копии этих флагов разъехались бы, и
      // разбор «что мы вообще просили» упёрся бы в вопрос «которая из копий».
      audioCaptureDefaults: AUDIO_WANT,
    });

    // ЭТОТ БЛОК СТОИТ ДО РЕГИСТРАЦИИ СОБЫТИЙ НАРОЧНО: `room.connect()` ниже, а
    // подписка на дорожку радио приходит СРАЗУ после него - бот уже в комнате.
    // Объяви мы `DJ_ID` ниже по файлу, первый же `TrackSubscribed` сравнивал бы
    // identity с `undefined`, громкость не ставилась бы вовсе, и выглядело бы это
    // как «ползунок не работает». Тот же класс, что подпись кнопки записи, которая
    // зависела от порядка строк, а не от состояния.
    room.on(LK.RoomEvent.ParticipantConnected, function (p) {
      upsert(p.identity, { name: human(p.name, p.identity) });
      // КОТ ЗАМЕЧАЕТ ВОШЕДШЕГО. Ничего не сообщает сверх того, что и так видно в списке,
      // - это характер, а не индикатор, и потому его можно выключить.
      try { if (window.catDo) window.catDo('hop'); } catch (e) {}

      // спрашивают «а его хорошо слышно?», и ответ через десять секунд опаздывает.
      setTimeout(statTick, 1200);
    });
    room.on(LK.RoomEvent.ParticipantDisconnected, function (p) {
      if (isDj(p)) dropDj();
      delete people[p.identity]; draw();
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, function (track, _pub2, p2) {
      if (track.kind === 'audio') {
        // РАДИО ВЫКЛЮЧИЛИ - ПОЛЗУНОК УХОДИТ ВМЕСТЕ С НИМ. Регулятор громкости того, чего
        // не играет, читается как «сломано»: человек двигает его и ничего не происходит.
        // ОТПИСКА ОДНОЙ ДОРОЖКИ - НЕ «ВЫКЛЮЧИЛИ РАДИО». При смене станции старая и новая
        // живут внахлёст, и `dropDj()` здесь снёс бы ТОЛЬКО ЧТО ПРИШЕДШУЮ: радио умирало
        // бы на каждом переключении (поймано браузерной пробой на моей же правке).
        // Снимаем ровно эту дорожку; ползунок убираем, только если радио не осталось
        // ВОВСЕ - выключение целиком приезжает признаком комнаты, а не отпиской.
        detachTrack(track);
        if (track === djTrack) djTrack = null;
        if (isDj(p2) && !Object.keys(djSids).length) { djTrack = null; showDjVol(false); }
        return;
      }
      if (track.kind !== 'video') return;
      // ЧУЖОЕ ВИДЕО УБИРАЕТСЯ, КОГДА ЕГО ПЕРЕСТАЛИ ДАВАТЬ. Оставленный чёрный
      // прямоугольник читается как «зависло».
      dropVideo(track);
    });
    // ═══ СВОЁ ВИДЕО ЧЕЛОВЕК ОБЯЗАН ВИДЕТЬ ТОЖЕ ═══
    // ЖИВОЙ ОТЗЫВ REN: показывающий не видит, ЧТО именно уходит соседям, - ту вкладку или
    // весь экран, попал ли в кадр. Спросить об этом можно только у них, то есть посреди
    // разговора. Своя картинка идёт ТОЙ ЖЕ дверью, что чужая (закон №40), и помечена
    // словом «Ты»: две копии «как показать видео» разошлись бы на первой правке.
    room.on(LK.RoomEvent.LocalTrackPublished, function (pub) {
      var t = pub && pub.track;
      // ИМЯ СВОЕГО ОКНА СОСТАВЛЯЕТ ДВЕРЬ, А НЕ ВЫЗЫВАЮЩИЙ. Передавали 'Ты' строкой - и
      // пометка держалась на ТЕКСТЕ от вызывающего, а не на признаке «моё»: подсадка
      // «своё окно без подписи» проходила МОЛЧА, потому что строка приезжала снаружи.
      if (t && t.kind === 'video') addVideo(t, '', true);
    });
    room.on(LK.RoomEvent.LocalTrackUnpublished, function (pub) {
      if (pub && pub.track) dropVideo(pub.track);
      // СОБЫТИЕ МОЖЕТ ПРИЙТИ С УЖЕ ОБНУЛЁННОЙ ССЫЛКОЙ - тогда строка выше не находит
      // ничего. Подметаем по факту: окно над мёртвой дорожкой не нужно никому.
      sweepVideos();
    });
    room.on(LK.RoomEvent.TrackSubscribed, function (track, _pub, p) {
      if (track.kind === 'video') {
        // СМОТРЕТЬ ЧУЖОЙ ЭКРАН УМЕЮТ ВСЕ, ВКЛЮЧАЯ МОБИЛЬНЫЕ: это обычное входящее видео.
        // Ограничение касается только ОТДАЧИ - там у мобильных браузеров нет самого API.
        addVideo(track, (p ? nameOf(p) : 'Участник'), false, p && p.identity);
        say((p && p.name ? p.name : 'Участник') + ' показывает экран.');
        return;
      }
      if (track.kind === 'audio') {
        // ЗВУК ИГРАЕТ ЭЛЕМЕНТОМ, КОТОРЫЙ МЫ ДЕРЖИМ САМИ: на iOS элемент, не привязанный к
        // DOM, браузер вправе выгрузить, и участник замолкает без единой ошибки.
        attachTrack(track, isDj(p));
        // ═══ РАДИО ИГРАЕТ ФОНОМ, А НЕ ВРОВЕНЬ С ГОЛОСАМИ ═══
        // Живой прогон Ren: «мы делали радио, чтобы играло ФОНОМ под разговор - тихо».
        // Громкость КЛИЕНТСКАЯ и у каждого своя: серверной ручки «сделай этому участнику
        // тише» у LiveKit нет, да она и не нужна - одному фон мешает, другому нет.
        // СТАВИТСЯ СРАЗУ ПРИ ПОДПИСКЕ, А НЕ ПОСЛЕ ПЕРВОГО ДВИЖЕНИЯ ПОЛЗУНКА: иначе первые
        // секунды радио бьёт по ушам, и человек лезет искать регулятор уже раздражённым.
        if (isDj(p)) { djTrack = track; applyDjVolume(); showDjVol(true); }
      }
    });
    room.on(LK.RoomEvent.ActiveSpeakersChanged, function (spk) {
      var now = {};
      spk.forEach(function (p) { now[p.identity] = true; });
      Object.keys(people).forEach(function (id) { people[id].speaking = !!now[id]; });
      // ЗАГОВОРИЛИ - КОТ ПРОСЫПАЕТСЯ. Дремота это признак ТИШИНЫ, и держать её при живом
      // разговоре значило бы врать картинкой.
      if (spk && spk.length) { try { if (window.catAwake) window.catAwake(); } catch (e) {} }
      draw();
      // «КРУПНО» СЛЕДУЕТ ЗА ГОВОРЯЩИМ, ИНАЧЕ ЭТО ПРОСТО «БОЛЬШИМ ПЕРВЫЙ ВОШЕДШИЙ».
      layPaint();
    });
    // ═══ ИНДИКАТОР ЗАПИСИ - ИЗ МЕТАДАННЫХ КОМНАТЫ, А НЕ ИЗ РАССЫЛКИ ПО КАНАЛУ ДАННЫХ ═══
    // Рассылку не услышит тот, кто зашёл ПОЗЖЕ, то есть индикатор молчал бы ровно тому,
    // кого он должен предупредить. Метаданные LiveKit отдаёт каждому при входе и шлёт
    // всем при смене - это состояние комнаты, а не чьё-то сообщение.
    room.on(LK.RoomEvent.RoomMetadataChanged, function (m) { showRec(m); });
    room.on(LK.RoomEvent.TrackMuted, function (_pub, p) { upsert(p.identity, { muted: true }); });
    room.on(LK.RoomEvent.TrackUnmuted, function (_pub, p) { upsert(p.identity, { muted: false }); });
    room.on(LK.RoomEvent.Disconnected, function (reason) {
      connected = false;
      sub('Отключился');
      say('Соединение закрыто' + (reason ? ' (' + reason + ')' : '') + '.');
    });
    // ПЕРЕПОДКЛЮЧЕНИЕ НАЗЫВАЕТСЯ ВСЛУХ: молчащая комната и комната, которая сейчас
    // вернётся, для человека выглядят одинаково, а ждать стоит только во второй.
    room.on(LK.RoomEvent.Reconnecting, function () { say('Связь прервалась, возвращаюсь…'); });
    room.on(LK.RoomEvent.Reconnected, function () { say(''); });

    stage('подключение к комнате');
    try {
      await room.connect(j.url, j.token);
      // ФЛАГИ ПЕРЕДАЮТСЯ ЯВНО, А НЕ ТОЛЬКО ЧЕРЕЗ УМОЛЧАНИЯ КОМНАТЫ. Умолчания SDK
      // мержит со своими, и «мы же попросили в конструкторе» - это рассуждение, а не
      // гарантия: у аргумента приоритет выше, и он снимает вопрос целиком.
      stage('включение микрофона');
      // ═══ ПОСЛЕ RELOAD В WEBVIEW `getUserMedia` МОЖЕТ НЕ ВЕРНУТЬСЯ ВОВСЕ ═══
      // Факт, а не догадка: сторож загрузки назвал СТАДИЮ - «включение микрофона», при
      // том что соединение уже `connected`, а подпись Telegram на месте (живой прогон
      // 29.08, «Перезагрузить» в меню Telegram). У этого вызова нет своего потолка, и
      // страница оставалась на «Подключаюсь…» НАВСЕГДА.
      // ВХОД БЕЗ МИКРОФОНА ЛУЧШЕ, ЧЕМ НЕ ВХОД: человек попадает в комнату, слышит всех, и
      // ему СКАЗАНО, чем это лечится. Микрофон не отменён - его включает та же кнопка,
      // что и всегда, и включение идёт уже по жесту человека (а жест как раз и есть то,
      // чего вебвью ждал). Молча войти немым нельзя: он будет говорить в пустоту.
      var micGot = await Promise.race([
        room.localParticipant.setMicrophoneEnabled(true, AUDIO_WANT)
          .then(function () { return 'ok'; }, function (e) { return e; }),
        new Promise(function (ok) { setTimeout(function () { ok('slow'); }, MIC_BOOT_MS); })
      ]);
      if (micGot !== 'ok') {
        micOn = false;
        var _mw = (micGot === 'slow')
          ? ('микрофон не ответил за ' + Math.round(MIC_BOOT_MS / 1000)
             + ' с - так бывает после перезагрузки страницы в Telegram')
          : ('микрофон не дали (' + (micGot && micGot.message || micGot) + ')');
        say('Ты в комнате и всех слышишь, но ' + _mw
            + '. Нажми «🎙 Микрофон» внизу - включится по твоему касанию.', true);

      say('LiveKit: ' + (e && e.message || e), true);
      return;
    }
    connected = true;
    micPaint();                       // подпись кнопки обязана отвечать факту, а не намерению
    // ЗАПИСЬ МОГЛА НАЧАТЬСЯ ДО НАШЕГО ВХОДА, И ЭТО ГЛАВНЫЙ СЛУЧАЙ, РАДИ КОТОРОГО
    // индикатор живёт в метаданных: вошедший позже обязан узнать о записи сразу, а не
    // остаться единственным, кто о ней не знает.
    showRec(room.metadata);

    // ═══ ЧТО БРАУЗЕР ПРИМЕНИЛ НА САМОМ ДЕЛЕ ═══
    // Мы ПРОСИМ echoCancellation/noiseSuppression/autoGainControl в audioCaptureDefaults,
    // но просьба и факт - разные вещи: часть клиентов молча игнорирует флаг, а на части
    // платформ обработку делает ОС и браузер её отключает. Живой случай (Ren 25.08): у
    // собеседницы шёл РОВНЫЙ ГУЛ, с которым встроенное подавление обязано справляться, -
    // значит вопрос не «слабое ли оно», а «включилось ли вообще».
    // getSettings() отдаёт ПРИМЕНЁННЫЕ значения, и печатаем мы их НА СТРАНИЦЕ, а не в
    // консоль: до консоли на телефоне не добраться.
    function micTrack() {
      var pubs = room.localParticipant.trackPublications
              || room.localParticipant.tracks || new Map();
      var out = null;
      pubs.forEach(function (pub) {
        if (String(pub.source || '') !== 'microphone' || !pub.track) return;
        out = pub.track.mediaStreamTrack || null;
      });
      return out;
    }

    // ═══ ЧТО БРАУЗЕР ВООБЩЕ УМЕЕТ ═══
    // ЖИВОЙ ПРОГОН (Ren): «шумодав не сообщает · эхо вкл · громкость не сообщает · 96000 Гц
    // · до браузера дошло не то». Моя прежняя строка обвиняла НАС - будто флаги потерялись
    // по дороге. Но 96000 Гц это чистая улика: конвейер обработки Chrome работает на 48
    // кГц, и родная частота устройства означает, что обработки НЕТ ВОВСЕ. А `getSettings()`
    // молчит про noiseSuppression ровно тогда, когда браузер такого флага НЕ ЗНАЕТ (так
    // ведёт себя Safari: у него из трёх есть только echoCancellation).
    // ЗНАЧИТ ИСХОДОВ ТРИ, А НЕ ДВА, И ПУТАТЬ ИХ НЕЛЬЗЯ: «браузер не умеет» (лечится только
    // своим шумодавом, встроенного там нет в принципе), «умеет, но до него не дошло» (это
    // НАШ баг) и «дошло, но выключено» (чиним на месте). Одна фраза на три случая - ровно
    // та подмена причины, из-за которой мы уже теряли круги.
    function canDo(k) {
